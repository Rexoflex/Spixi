<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Contact</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark)
     so the page doesn't flash white while tokens.css + the bundle load. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-action-default); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */
.c-topbar .c-button[data-type="text"] {
  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

<style data-src="../styles/components/overlay.css">
/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
}

.c-modal__actions {
  display: flex;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the

  margin-block-start: var(--spacing-24);
}

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 260px; }
:root[data-desktop] [data-dt-ctx-source] { background: var(--surface-interactive-selected); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

</style><!-- c-modal (delete-history / remove-contact confirms) + c-sheet -->
<style data-src="../styles/components/txlist-item.css">
/* c-txlist-item — wallet transaction row (docs/tx-row-spec.md, DECISIONS #55).
   Figma rows are static; hover/pressed = #23 interactive tokens per #43. */

.c-txlist-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  width: 100%;
  padding: var(--spacing-16) var(--spacing-12);
  border: 0;
  background: transparent;
  cursor: pointer;
  text-align: start;
  font-family: var(--font-secondary);
  -webkit-tap-highlight-color: transparent;
  /* 100ms intentional: micro-interaction, matches chatlist row hover */
  /* A5 (#348): background-size carries the centre-out press fill's CLOSE (base.css).
     background-color stays at its intentional 100ms micro duration. */
  transition: background-color var(--duration-100) var(--easing-standard),
              background-size 220ms var(--easing-accelerate, ease-in);
  /* A5 (#348): the centre-out press fill. base.css only flips background-size while
     pressed — the IMAGE and its centred origin live HERE, in the same rule as the
     row's own `background`, so no state rule's `background` shorthand can wipe them
     out from under the sweep. Every state rule below sets background-COLOR for the
     same reason: a colour is all any of them ever meant to set. */
  background-image: linear-gradient(var(--surface-action-tonal-default), var(--surface-action-tonal-default));
  background-repeat: no-repeat;
  background-position: center;
  background-size: 0% 100%;
}
/* W4a (#348): the selected row uses the CHAT-ROW treatment, exactly.
   The wallet row was left on --surface-interactive-selected while the chats list
   moved to the action-tonal surface (Damir 2026-07-07, chatlist-item.css:22), so
   the two lists showed DIFFERENT selected colours in the same desktop window. The
   shell rule that set it even CLAIMED to "mirror the chats-list treatment"
   (home.html) — it had stopped doing so. The rule now lives here, beside this
   row's own hover and pressed rules and in the same order as the chat row, so the
   two lists cannot drift apart again. */
.c-txlist-item[aria-current] {
  background-color: var(--surface-action-tonal-default);
  /* A5 (#348): a SELECTED row closes in its OWN tonal family. Without this the image
     would revert to the neutral gradient the instant the press ends, flashing grey
     over the action colour for the length of the close. */
  background-image: linear-gradient(var(--surface-action-tonal-pressed), var(--surface-action-tonal-pressed));
}
@media (hover: hover) and (pointer: fine) {

     see chatlist-item.css. :not([aria-current]) is load-bearing (source order).

  .c-txlist-item:hover:not([aria-current]) { background-color: var(--surface-interactive-hover); }
}
/* :active AFTER the hover block so pressed wins (source order at equal specificity) */
  /* ★ A5 (#348) review r2: :active drives the SAME centre-out fill. It used to paint

     data-pressed on every Chromium engine — so the flat tint covered the sweep and the
     press still read exactly as the flicker Damir asked us to remove. */
.c-txlist-item:active { background-size: 100% 100%; }
.c-txlist-item[aria-current]:active { background-size: 100% 100%; }

/* #228 desktop row rhythm — same treatment as chat rows (#226/R3): 48px circle

   — with the glyph and the clear affordance in action ink. Placed AFTER :hover and

<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Contact-details / chat-info shell — the redesigned 1:1 contact
   * surface wired to the REAL C# MAUI bridge (native.js in the bundle). Reached
   * by tapping a 1:1 chat header (SingleChatPage emits ixian:details → C# pushes
   * ContactDetails, which loads this file). ONE component (createChatInfo) also
   * powers the in-chat GROUP info takeover (src/shells/chat.html).
   *
   * ARCHITECTURE §5 / bridge-audit-A §2 (ContactDetails.xaml.cs). ZERO C# change,
   * frozen bridge — every action is an existing legacy `ixian:` verb.
   *
   * Contract (verified ContactDetails.xaml.cs):
   *   C#→JS: setPaneMode('1'|'2') [#247 desktop pane, pre-present]
   *          · setContext('chat'|'contact') [#248 entry-dependent title/actions]
   *          · setGroupInfo(count, blind, admin, notifications, owner) +
   *            clearMembers/addMember(addr, nick, avatar, role) [#248 group surface]
   *          · setAddress(addr) · setNickname(nick) [every sec] · setAvatar(path)
   *          ["" = none] · showIndicator("true"|"false") · clearRecentActivity()
   *          · addPaymentActivity(txid, type, time, amount, confirmed)  (5-arg;
   *          type = LOCALIZED "Sent"/"Received"; confirmed "true"|"error").
   *   JS→C#: ixian:onload · ixian:back · ixian:remove (remove contact) ·
   *          ixian:removehistory · ixian:request · ixian:send · ixian:chat ·
   *          ixian:txdetails:<txid> · ixian:userdefinednick:<nick> ·
   *          [#248 group] ixian:leave · ixian:en/disableNotifications ·
   *          ixian:kick:<addr> · ixian:ban:<addr> (all forwarded by ContactDetails,
   *          mirroring the SingleChatPage handlers).
   *
   * CONTEXT CHOICE (Damir 2026-07-08 — revises #142): context 'contact', kind
   *   'contact'. The contact-details page now shows the "Contact details" title +
   *   a leading "Message" button (ixian:chat → opens/pops the conversation) AND
   *   keeps BOTH destructive actions — the component was un-gated so context
   *   'contact' renders "Delete chat history" (ixian:removehistory) alongside
   *   "Remove contact" (ixian:remove). ixian:chat pushes SingleChatPage when
   *   reached from the contacts list, or pops back when opened from a chat header
   *   (customChatBtn) — same "open conversation" outcome either way.
   *
   * UPDATE CHURN: C#'s updateScreen() re-pushes setNickname + setAvatar +
   *   showIndicator EVERY SECOND, and clears + re-adds the WHOLE tx list every
   *   second. A naive rebuild-per-push would wipe an in-progress nickname edit,
   *   the open payments accordion, and scroll position every tick. So pushes are
   *   coalesced (settle timer) and the panel is rebuilt ONLY when the meaningful
   *   state (name / address / tx set) actually CHANGES — and never while a
   *   nickname edit is open. The avatar rebuilds once when it resolves; PRESENCE
   *   deliberately does NOT rebuild — it flips at the poll cadence, so it is
   *   applied with a targeted toggle instead (A4/#302, setChatInfoPresence) and is
   *   only re-seeded into stateSig so a rebuild from another cause keeps it.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createChatInfo, setChatInfoPresence, formatIxiAmount,
    createNativeBridge, installExecuteUiCommand,
    attachPressFeedback,
    createModal, openModal, truncateAddressMiddle,   // N27 (#367): remove-blocked modal
    isPseudoAddressNick, dismissTopOverlay,          // D-19b (#370) blind pseudo-key display guard · N50 back-dismiss wiring
    showToast,                                       // N55: optimistic request-sent feedback,
    applyPushedTheme,
  } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  /* #343: ONE call lights up press feedback for every pressable surface in this
     shell (src/components/pressable.js). Delegated on document, so rows created
     later by a re-render are covered without re-attaching. A new shell needs
     exactly this line. */
  attachPressFeedback();
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[contact-details]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;

  const root = document.getElementById('contact-root');

  /* —— contact state — flushed by ContactDetails.onLoad + updateScreen (1/sec) —— */
  const state = {
    name: '',            // friend.nickname (display name; incorporates any user-defined nick)
    address: '',
    online: false,       // showIndicator — NOT rendered by the component yet (gap), no rebuild
    avatarPath: null,    // setAvatar — rendered in the c-chat-info hero; onerror → gradient fallback
    txs: [],             // committed tx rows (txlist-item opts)
    txsBuf: null,        // accumulator between clearRecentActivity and the settle
    // #248: entry-dependent context — 'chat' (header/row-menu → "Chat info"/"Group
    // info", no Message action) vs 'contact' (directory → "Contact details").
    context: 'contact',
    // #248 GROUP surface: ContactDetails now carries group info too (setGroupInfo +
    // clearMembers/addMember roster — same contract family as SingleChatPage CI1).
    isGroup: false,
    group: { count: 0, blind: false, admin: false, notifications: true, owner: '' },
    /* ★ NOTIF-2 (Damir's 2026-08-21 block): the per-1:1 mute. Pushed by ContactDetails
       as setContactNotifications("1"|"0") for the 1:1 case only — the group surface
       carries its own value in setGroupInfo, and that one is SYNCED to the other side
       while this one is local to the device. Defaults ON so the row cannot paint as
       muted before the push lands. */
    notifications: true,
    members: [],         // committed roster [{ name, address, avatar, owner }]
    membersBuf: null,    // accumulator between clearMembers and the settle
  };

  /** Resolve a C# avatar arg to an <img> src or null (same rule as the other
   *  shells). Threaded into the c-chat-info hero; a path that can't load degrades
   *  cleanly via the avatar component's onerror → deterministic gradient. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }

  /* Best-effort direction from the LOCALIZED tx type ("Sent"/"Received"). C#
   * sends a localized string, not an enum (a fragile signal — flagged as a BE
   * ask). Compare against the shell's own localized words, then a multilingual
   * "received" stem, else default to outgoing. The row LABEL always shows the
   * verbatim C# string, so a wrong arrow never mislabels the row. */
  function txDirection(typeText) {
    const t = String(typeText || '').trim().toLowerCase();
    if (!t) return 'out';
    const recv = (strings.received || 'Received').toLowerCase();   // fallback = the dict value (A4 sweep: one key, one English)
    const sent = (strings.sent || 'Sent').toLowerCase();
    if (t === recv) return 'in';
    if (t === sent) return 'out';
    if (/receiv|empfang|recib|reçu|ricev|получ|recebid|受信|接收/.test(t)) return 'in';
    return 'out';
  }

  /* #366 loop m1: members the user requested from THIS page — the optimistic
   * 'pending' must survive change-gated panel rebuilds (chat-info mutates only
   * its mapped copy). One page = one contact, so the set never needs a reset. */
  const requestedMembers = new Set();

  /* N27 (#367): remove refused because the contact is in a group — C# names the
   * blocking group(s) (removeBlocked push, name/address PAIRS) and this modal
   * shows them + the path out. All text lands via textContent (group names are
   * peer-controlled). The in-shell modal replaces the old native alert, which
   * could not name anything. */
  function openRemoveBlockedModal(groups) {
    const list = document.createElement('ul');
    list.className = 'cd-remove-blocked';
    for (const g of groups) {
      const li = document.createElement('li');
      li.textContent = g.name || (g.address ? truncateAddressMiddle(g.address) : '');
      list.append(li);
    }
    const path = document.createElement('p');
    path.className = 'c-modal__body';
    path.textContent = strings.removeBlockedPath
      || 'Remove the contact from these groups, or leave the groups. Then remove the contact again.';
    const wrap = document.createElement('div');
    wrap.append(list, path);
    openModal(createModal({
      title: strings.removeBlockedTitle || 'Cannot remove contact',
      body: strings.removeBlockedIntro || 'This contact is a member of these groups:',
      content: wrap,
      role: 'alertdialog',
      host: document.body,
      // informational, single-action, no data at risk → scrim tap may dismiss
      // (loop M1/r2 NIT-5: a convenience exit — OK always dismisses too. N50
      // (#370) added the cdoverlay/cdBack wiring: OS back dismisses this modal
      // FIRST, then pops the page).
      lightDismiss: true,
      actions: [{ label: strings.ok || 'OK', type: 'fill', autofocus: true }],
      strings,
    }));
  }

  /* —— panel build (change-gated, see UPDATE CHURN above) ——————————————————— */
  let built = false;
  let lastSig = '';

  function buildPanel() {
    // #248 GROUP surface: kind 'group' renders name/avatar + notifications toggle +
    // the full member list (owner chip, admin kick/ban) + Leave — no money, no
    // Message, no nickname override (group rename = a BE ask, no verb exists).
    // Context is forced to 'chat' for groups ("Group info" — a group is never a
    // "contact details" surface even from the directory).
    if (state.isGroup) {
      return createChatInfo({
        kind: state.group.kind || 'group',   // #249: 'bot' → members/notifications, no Leave (CI4)
        context: 'chat',
        name: state.name,
        address: state.address,
        avatar: state.avatarPath,
        avatarSeed: state.address,
        memberCount: state.group.count,
        members: state.members.map((m) => ({
          name: m.name, address: m.address, avatar: m.avatar,
          owner: !!(state.group.owner && m.address && m.address !== '[Unknown]' && m.address === state.group.owner),
          // #366: honest sheet badges + Add-contact gating. The requestedMembers
          // latch (loop m1): chat-info's optimistic 'pending' lives on the MAPPED
          // copy, so any rebuild (late setAvatar, a tx push) would re-offer the
          // request button — the latch survives rebuilds. Page = one contact, so
          // no reset is needed (a new ContactDetails loads a fresh shell).
          relation: (requestedMembers.has(m.address) && (m.relation || 'none') === 'none')
            ? 'pending' : (m.relation || ''),
        })),
        blind: state.group.blind,
        amOwner: state.group.amOwner,   // N48 (#370): hero "You are the owner" chip in blind rooms
        notifications: state.group.notifications,
        capabilities: { notifications: true, admin: state.group.admin },
        host: document.body,
        strings,
        onBack: () => bridge.send('ixian:back'),
        // iOS-26 (Damir F5): a group reached from the CONTACTS DIRECTORY had no way
        // into its conversation — the surface dead-ended, which defeats the reason
        // groups were put back in the directory (a wiped history must not orphan the
        // group). Entered from inside the chat (context 'chat') there is nothing to
        // offer: you are already there. Title stays "Group info" either way.
        onMessage: state.context === 'chat' ? undefined : () => bridge.send('ixian:chat'),
        // notifications toggle → the group mute verbs (#248 ContactDetails forwards;
        // fire-and-forget, resolve optimistically — same as the in-chat takeover).
        onNotifications: (next, ctrl) => {
          state.group.notifications = next;
          bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
          ctrl.done();
        },
        // admin kick/ban (#248 forwards); blind-masked rows have no real address —
        // never emit a verb with a masked payload.
        onMemberAction: (action, m, ctrl) => {
          if (m && m.address && m.address !== '[Unknown]' && (action === 'kick' || action === 'ban')) {
            bridge.send('ixian:' + action + ':' + m.address);
          }
          ctrl.done();
        },
        // N26 (#366): member-sheet "Send contact request" — ContactDetails now
        // carries the SAME guarded verb as SingleChatPage (shared helper). The
        // chat-info layer gates it on relation === 'none'; masked rows never emit.
        onContactRequest: (m) => {
          if (m && m.address && m.address !== '[Unknown]') {
            requestedMembers.add(m.address);   // loop m1: survive panel rebuilds
            bridge.send('ixian:sendContactRequest:' + m.address);
            // N55: optimistic toast at the emit site (fire-and-forget verb, no ack)
            showToast({ text: strings.contactRequestSent || 'Contact request sent', tone: 'success', host: document.body, strings });
          }
        },
        onLeave: (ctrl) => { bridge.send('ixian:leave'); ctrl.done(); },
      });
    }
    return createChatInfo({
      kind: 'contact',
      // #248: entry-dependent — 'contact' (directory) keeps the Message action +
      // "Contact details" title; 'chat' (header/row-menu) titles "Chat info".
      context: state.context,
      name: state.name,
      address: state.address,
      avatar: state.avatarPath,        // real contact photo (setAvatar); gradient fallback if unresolved
      avatarSeed: state.address,       // identity-stable gradient hue even before the name lands
      online: state.online,            // A4 (#302): seed the hero dot on (re)build; live flips go
                                       // through setChatInfoPresence, see showIndicator
      nickname: '',                    // no separate wire-name vs override signal; name = display name,
                                       // edit prefills empty w/ name as placeholder (empty = clear override)
      txs: state.txs,
      // A4: `capabilities` is a FEATURE-GATE bag ("this surface supports presence"),
      // not a live-value channel — it was carrying state.online since #142 and
      // nothing ever read it. The live value now rides the top-level `online` opt.
      /* ★ NOTIF-2: notifications is LIVE for 1:1 now (media/selfDestruct still have no
         bridge verb — §9). ContactDetails' existing ixian:en/disableNotifications
         handlers gained a 1:1 branch that writes a LOCAL device preference, because a
         1:1 friend has no botInfo to hold the flag and Core may not be changed here.
         Muting is therefore device-side and the peer is never told — which is also the
         correct privacy behaviour for muting somebody. */
      capabilities: { presence: true, notifications: true },
      notifications: state.notifications,
      host: document.body,             // confirm modals / QR-adjacent sheets attach to the page body
      strings,

      onBack: () => bridge.send('ixian:back'),

      // Message → open the conversation with this contact (ixian:chat: pushes
      // SingleChatPage from the contacts list, pops back from a chat header).
      onMessage: () => bridge.send('ixian:chat'),

      /* ★ NOTIF-2: the 1:1 mute. Same verbs as the group surface — ContactDetails
         routes on whether botInfo exists, so the shell asks one question and does not
         need to know where the answer is stored. Resolved optimistically like the group
         toggle: the write is a local preference that cannot fail in a way the user could
         act on, and C# re-pushes the stored value on the next open. */
      onNotifications: (next, ctrl) => {
        state.notifications = next;
        bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
        ctrl.done();
      },

      // nickname → local user-defined override (ixian:userdefinednick). Empty clears it.
      // C# re-pushes friend.nickname on the next tick, so the display self-heals.
      onNickname: (nick, ctrl) => { bridge.send('ixian:userdefinednick:' + nick); ctrl.done(); },

      // money — these open the NATIVE C# wallet pages (the "C# signs" path, SECURITY.md):
      //   Pay → WalletSendPage · Request → WalletReceivePage. No in-page compose.
      onPay: () => bridge.send('ixian:send'),
      onRequest: () => bridge.send('ixian:request'),

      // payment activity row tap → native tx detail (WalletSentPage).
      onTx: (tx) => { if (tx && tx.txid) bridge.send('ixian:txdetails:' + tx.txid); },

      // destructive — fire-and-forget INTENT after the FE confirm (oneShot latch).
      // C# runs its OWN native alert / removal on receipt (settings-delete pattern):
      //   removehistory → deletes local history + alert · remove → removes the
      //   contact (bots: pendingDeletion + sendLeave) then popToRoot.
      onDeleteHistory: (ctrl) => { bridge.send('ixian:removehistory'); ctrl.done(); },
      onRemoveContact: (ctrl) => { bridge.send('ixian:remove'); ctrl.done(); },
    });
  }

  function rebuildPanel() {
    // preserve the body scroll position across a rebuild (tx-list churn).
    const prevBody = root.querySelector('.c-chat-info__body');
    const top = prevBody ? prevBody.scrollTop : 0;
    root.replaceChildren(buildPanel());
    const nb = root.querySelector('.c-chat-info__body');
    if (nb) nb.scrollTop = top;
    built = true;
  }

  // Signature of the state that actually AFFECTS the rendered panel (name,
  // address, avatar, tx set). The hero now renders the photo, so a resolved
  // avatarPath must rebuild once; presence stays excluded (no presence line yet).
  // A nickname edit in progress defers the rebuild (buildIfChanged guard).
  function stateSig() {
    return JSON.stringify({
      name: state.name,
      address: state.address,
      avatar: state.avatarPath,
      txs: state.txs.map((t) => [t.txid, t.direction, t.status, t.amount, t.timeText, t.name]),
      // #248: context + group meta/roster affect the rendered panel too. Loop C-6:
      // signature sorted by address so a re-pushed roster in a different order
      // never forces a needless rebuild (would drop an open search/sheet).
      context: state.context,
      // ★ NOTIF-2 (audit MINOR): the 1:1 mute must be IN the signature, or the
      // scheduleCommit() in setContactNotifications is decorative — buildIfChanged sees an
      // unchanged signature and does nothing. Benign only because C# pushes it once inside
      // the onLoad burst today; any later re-push (or an echo added tomorrow) would
      // silently fail to render.
      notifications: state.notifications,
      // A4 (#302): in the signature so a rebuild from ANY cause re-seeds the dot
      // with the current value. Live flips still go through setChatInfoPresence —
      // showIndicator never calls scheduleCommit, so this never drives a rebuild
      // by itself, it only makes one that happens anyway come out right.
      online: state.online,
      isGroup: state.isGroup,
      group: state.group,
      members: state.members.map((m) => [m.address, m.name, m.avatar])
        .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)),
    });
  }
  function buildIfChanged() {
    const sig = stateSig();
    if (built && sig === lastSig) return;                 // C# re-pushed identical data — no-op
    // never wipe an in-progress nickname edit; defer until it closes.
    if (built && root.querySelector('.c-chat-info__nick-input')) { scheduleCommit(); return; }
    lastSig = sig;
    rebuildPanel();
  }

  /* Coalesce the per-second updateScreen burst (setNickname + setAvatar +
   * showIndicator + clearRecentActivity + addPaymentActivity×N — each a separate
   * EvaluateJavaScriptAsync frame) into ONE commit + change check, so partial tx
   * lists never paint. 120ms settles comfortably inside the 1s tick. */
  let commitTimer = 0;
  function scheduleCommit() { clearTimeout(commitTimer); commitTimer = setTimeout(commitAndBuild, 120); }
  function commitAndBuild() {
    if (state.txsBuf !== null) { state.txs = state.txsBuf; state.txsBuf = null; }
    if (state.membersBuf !== null) { state.members = state.membersBuf; state.membersBuf = null; }   // #248 roster
    buildIfChanged();
  }

  /* NO empty first paint (flicker fix): the boot spinner (in #contact-root markup)
   * stays until the FIRST coalesced commit lands via scheduleCommit — rebuildPanel's
   * replaceChildren then swaps it for the filled panel in ONE render. `built` is still
   * false, so buildIfChanged builds unconditionally on that first commit. A brand-new
   * contact with no data still resolves: ContactDetails.onLoad always pushes setAddress
   * + updateScreen (→ scheduleCommit), and this fallback timer force-builds even if a
   * push never arrives, so the screen can never hang on the spinner. */
  setTimeout(() => { if (!built) commitAndBuild(); }, 1200);

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS handlers — page globals (executeUiCommand resolves bare fnRefs).
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    // W1 (#336): this shell had NO setTheme handler at all — the pick-time C# fan-out
    // (SettingsPage:398-426, all overlays) hit an undefined bare global (a swallowed
    // ReferenceError, the #258 class), so a live chat-info/group-info pane could
    // never re-theme. Same grammar as home.html's handler (args arrive DECODED via
    // the real dispatcher; #53 transition suppression for a one-frame flip).
    // ★ N71 (#421): body moved to theme-runtime.js — five shells carried a copy of
    // it and thirteen carried none, which is how #251 and #288 MAJOR-1 both happened.
    setTheme(name) { applyPushedTheme(name); },

    // Q4-③ (#270): call-ui wiring GONE — calls present on the native CallPage
    // (identity comes from C#'s Friend, so the roster resolve is obsolete too).
    // #247: desktop pane hosting — C# pushes '1' (detail slot) or '2' (column beside
    // the conversation) BEFORE any content push; unset = mobile/full-span takeover.
    setPaneMode(col) { document.body.dataset.pane = (col === '2') ? '2' : '1'; },
    // #248: entry-dependent surface — pushed before setAddress in onLoad.
    setContext(c) { state.context = (c === 'chat') ? 'chat' : 'contact'; scheduleCommit(); },
    // #248 GROUP surface: meta (count/blind/admin/notifications/owner) + roster.
    // Roster arrives as a clearMembers → addMember×N burst → buffered like the tx
    // list so a partial roster never commits.
    /* ★ NOTIF-2: the per-1:1 mute state. MUST be defined even though it is only ever
       pushed for a 1:1 — C# emits a push as a BARE GLOBAL, and an undefined one throws
       while the arguments are evaluated, before the dispatcher can catch it (#258). */
    setContactNotifications(on) {
      state.notifications = (on === '1' || on === 'true' || on === 'True' || on === true);
      scheduleCommit();
    },

    setGroupInfo(count, blind, admin, notifications, owner, kind, amOwner) {
      state.isGroup = true;
      state.group = {
        count: Number(count) || 0,
        blind: blind === '1' || blind === 'true' || blind === 'True',
        admin: admin === '1' || admin === 'true' || admin === 'True',
        notifications: notifications === '1' || notifications === 'true' || notifications === 'True',
        owner: owner || '',
        kind: kind === 'bot' ? 'bot' : 'group',   // #249: bots ride this surface too
        // N48 (#370): MY OWN owner status — additive 7th arg (old exe → undefined
        // → false). Blind groups get no owner ADDRESS, but my own status is mine
        // to see; the hero renders it there (the self row is unidentifiable).
        amOwner: amOwner === '1' || amOwner === 'true' || amOwner === 'True',
      };
      scheduleCommit();
    },
    clearMembers() { state.membersBuf = []; scheduleCommit(); },
    // D-5/N26 (#366): trailing `relation` ('contact'|'pending'|'none'|'self';
    // "" on blind rows, undefined from an old exe → treated as unknown).
    addMember(address, nick, avatar, role, relation) {
      if (state.membersBuf === null) state.membersBuf = [];
      state.membersBuf.push({
        address: address || '',
        /* D-19b (#370): a blind-masked row ('[Unknown]' address) whose nick is
           the legacy "x"+<address> pseudo-key must not display it — the member
           list would print the exact address the blind mask hides. Blanked
           here → chat-info renders its placeholder for the row. */
        name: (address === '[Unknown]' && isPseudoAddressNick(nick)) ? '' : (nick || ''),
        avatar: resolveAvatar(avatar),
        role: role || '',            // opaque role int (semantics live in Ixian-Core); owner comes from setGroupInfo
        relation: ['contact', 'pending', 'pending-in', 'none', 'self'].indexOf(relation) !== -1 ? relation : '',   // R2 (#371): + incoming-pending
      });
      scheduleCommit();
    },
    // N27 (#367): remove refused → C# enumerates the blocking groups and pushes
    // them as name/address PAIRS (variadic; each arg b64-escaped by transport).
    // Odd tails are ignored; an empty push falls back to nothing (C# keeps the
    // legacy alert for the empty-enumeration edge).
    removeBlocked() {
      const args = Array.prototype.slice.call(arguments);
      const groups = [];
      for (let i = 0; i + 1 < args.length; i += 2) {
        groups.push({ name: String(args[i] || ''), address: String(args[i + 1] || '') });
      }
      if (groups.length) openRemoveBlockedModal(groups);
    },
    setAddress(address) { state.address = address || ''; scheduleCommit(); },
    setNickname(nick) { state.name = nick || ''; scheduleCommit(); },
    // Real contact photo → the c-chat-info hero (resolves today on WinUI; every
    // platform once BE cutover X1 lands the data: URI). Commit so the hero updates
    // when the photo arrives; the coalescer + edit-guard keep it churn-safe, and
    // c-avatar's onerror falls back to the gradient if the path can't load.
    setAvatar(path) { state.avatarPath = resolveAvatar(path); scheduleCommit(); },
    /* A4 (#302): presence. Guarded on CHANGE — this arrives at the poll cadence
       (~0.5 Hz while the surface is visible) and an unguarded scheduleCommit would
       reset the 120 ms settle timer on every tick, so the panel could never settle.
       No rebuild: a targeted dot toggle. state.online is also in stateSig now, so a
       rebuild triggered by something else re-seeds the dot correctly. */
    showIndicator(online) {
      const next = asBool(online);
      if (next === state.online) return;
      state.online = next;
      if (built && !state.isGroup) setChatInfoPresence(root.firstElementChild, next);
    },

    // tx list is cleared + fully re-pushed every second. Buffer between clear and
    // the settle so a partial list never commits.
    clearRecentActivity() { state.txsBuf = []; scheduleCommit(); },
    addPaymentActivity(txid, type, time, amount, confirmed) {
      const dir = txDirection(type);
      if (state.txsBuf === null) state.txsBuf = [];
      state.txsBuf.push({
        txid: txid || '',
        direction: dir,
        // confirmed "true" → confirmed; anything else ("error" = ActivityStatus
        // != Final) → pending (still confirming). C# collapses pending+error into
        // one "error" string — a real status enum is a BE ask.
        status: asBool(confirmed) ? 'confirmed' : 'pending',
        name: type || '',                                   // verbatim localized "Sent"/"Received" label
        amount: (dir === 'in' ? '+' : '-') + formatIxiAmount(amount),
        // iOS-55/#328 (W1 class): C# now pushes raw EPOCH SECONDS — all-digits
        // formats in-component via formatTxTimestamp/docLocale (createTxItem
        // prefers timestamp when timeText is absent); anything else = an OLD
        // exe's pre-formatted string → verbatim (backcompat). >0 guard: epoch 0
        // degrades to "no time", never a 1970 date.
        ...((/^\d{1,12}$/.test(String(time == null ? '' : time).trim()) && Number(String(time).trim()) > 0)
          ? { timestamp: Number(String(time).trim()) * 1000 }
          : { timeText: time || '' }),
      });
      scheduleCommit();
    },
    /* N50 (#370, #369 F5): OS back must dismiss the TOP OVERLAY first (the
       remove-blocked modal, a member sheet), then pop the page. C# routes back
       into the shell via this push while the mirror below reports an open
       overlay — the homeBack grammar (#336), applied to this shell. Self-heal:
       if nothing was actually open (stale mirror), re-sync so the next back
       pops the page instead of wedging. */
    cdBack() {
      if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
      syncCdOverlay();
    },
  };

  bridge.exposeAll(handlers);

  /* N50 (#370): mirror the shared overlay stack's open-state to C#
     (overlay.js toggles body[data-overlay-open]) — the exact home.html recipe:
     coalesced through a zero-timeout so an open→close flurry sends one line. */
  let cdOverlaySyncT = 0;
  function cdOverlayLive() { return document.body.dataset.overlayOpen !== undefined; }
  function syncCdOverlay() {
    if (cdOverlaySyncT) return;
