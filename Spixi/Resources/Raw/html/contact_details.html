<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Contact</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark)
     so the page doesn't flash white while tokens.css + the bundle load. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-action-default); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */
.c-topbar .c-button[data-type="text"] {
  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }
/* ★ Batch E (b) (#557, Damir 2026-08-22): the MOBILE scrim is one level deeper
   (0.6 → 0.7) — the lifted message (#506②) reads better against the darker
   ground. Desktop keeps 0.6 for its centred dialogs; anchored desktop menus
   stay wash-free (#268, [data-dt-clear] below). */
:root:not([data-desktop]) .c-scrim { background: var(--surface-scrim-deep); }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}
/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————
   The sheet is z-44 and every scrim is z-40, so a sheet paints above a scrim that
   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.
   The house pattern is "close the sheet, then open the modal". A second quick tap
   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
}

.c-modal__actions {
  display: flex;
  /* ★ Batch B/C loop r1 M-1 (2026-08-24): WRAP. A long localized confirm label
     ("Supprimer le compte", "Отменить приглашение") overflowed the fixed pair —
     nowrap labels + flex-basis 0 + min-width:auto has no out. Wrapping drops the
     long action onto its own full-width row (the remove-contact sheet's answer);
     short pairs render exactly as before. */
  flex-wrap: wrap;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②). ⚠ NO min-width:0 here — loop r2 R2-1: with flex-basis 0 a used min of 0 makes every item's hypothetical size 0, so the wrap above could NEVER fire; min-width:auto (the label's min-content) is what trips it. Measured in Chrome: with auto, the long confirm wraps to its own full row; with 0 it spilled 43px past its button */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],

   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);

     separation — and in LIGHT mode --surface-menu == --surface-screen (both

     text. A hairline restores the edge; dark mode never needed it (menu-700 on

}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 260px; }
/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source

   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".

   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

/* ═════════ MOBILE anchored dropdown (Batch E (a), #557, Damir 2026-08-22) ═════════
   The message menu + the chats-row menu present as a DROPDOWN anchored to the
   pressed row (desktop-anchors.js anchorSheetToRow sets the tag + inline
   left/top/width). Placement prefers ABOVE the row, so the menu can never cover
   the message it acts on — the 4.1 fix, structural. Everything else about the
   overlay is UNCHANGED: same z-44 (above the z-42 lifted row, #506②), same scrim
   (one level deeper here, (b) above), same focus/Esc/stack grammar, and the
   `:not([data-open])` pointer-events rule still covers the fade windows.

   slid from the bottom edge to mid-screen would point at the wrong origin. */
:root:not([data-desktop]) .c-sheet[data-m-anchor] {
  left: auto; right: auto; bottom: auto;
  margin: 0;
  max-width: none;
  border-radius: var(--radius-16);
  padding: var(--spacing-8) var(--spacing-12) var(--spacing-12);

  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-decelerate);

:root:not([data-desktop]) .c-sheet[data-m-anchor][data-open] { transform: none; opacity: 1; }
:root:not([data-desktop]) .c-sheet[data-m-anchor] .c-sheet__handle { display: none; }

/* ★★ #591 (Damir's second mockup) — THE COVER.

   their identity gradient (`.c-idhue`, the same 12 anchors their fallback avatar uses).
   ⚠ `z-index: -1` inside the hero's own isolation puts it above the page ground and
   below every child, so the avatar, the name and the pencil all sit on top of it with
   no stacking games and no risk of covering content — the same recipe the press layer
   uses (base.css). Bleeds edge to edge by cancelling the body's inline padding. */
.c-chat-info__cover {
  position: absolute;
  z-index: -1;
  /* ⚠ AND IT BLEEDS UPWARD TOO. `top: 0` is the HERO's top, and the body's own 16px
     padding-block-start sits above it — so the band began 16px below the chrome with a
     hard horizontal edge, which is the same floating-panel complaint the inline fix was
     written for, rotated 90°. The mask only fades the bottom. */
  top: calc(-1 * var(--spacing-16));
  /* ⚠ THE FIRST CUT DID NOT BLEED, and its own comment said it did. `100vw` with
     `max-width: 100%` clamps straight back to the hero — the hero IS the containing
     block, so the pair cancelled and left a hard-cornered band inset 16px from both
     edges: a floating rectangle, not a backdrop. Viewport units were the wrong tool;
     cancelling the body's own inline padding is the right one, and it stays correct
     inside a 360px desktop pane, where `100vw` would have been the whole window. */
  inset-inline: calc(-1 * var(--spacing-16));
  height: 148px;                       /* 132 + the 16 it now reaches upward */

  pointer-events: none;
  background: linear-gradient(140deg, var(--av-c1, var(--surface-neutral-02)), var(--av-c2, var(--surface-neutral-02)));

     not a panel. mask-image is progressive: without it the cover is simply a solid band. */

  mask-image: linear-gradient(to bottom, #000 40%, transparent 100%);

/* c-search-field — text-field/large specialization (docs/chip-search-spec.md,
   DECISIONS #51). Permanent transparent border prevents the Figma default→hover
   layout jump; focus fakes the spec's 2px border via box-shadow (no shift). */

.c-search-field {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  min-height: var(--size-target-min); /* Figma ≈40px — raised to touch minimum (#51) */
  padding: var(--spacing-8) var(--spacing-12);
  border: var(--outline-width-1) solid transparent; /* Figma: none; see header */
  border-radius: var(--radius-full);
  background: var(--surface-neutral-02);
  /* glyph ink shares the placeholder's text token — one resting ink for the
     whole empty field (deliberate; icon-neutral-* would split the pair) */
  color: var(--text-neutral-02);
  /* 100ms intentional: micro-interaction, matches chip/chatlist hover */
  transition: background-color var(--duration-100) var(--easing-standard),
              border-color var(--duration-100) var(--easing-standard),
              box-shadow var(--duration-100) var(--easing-standard);
}

/* #228 desktop density: pointer targets may go tighter than the 44px touch
   minimum (TG search ≈32–36px). Mobile keeps --size-target-min. */
:root[data-desktop] .c-search-field {
  min-height: 36px;
  padding-block: var(--spacing-4);
}

/* Figma text-field used outline-info (hover) + text-action-default (focus) as
   borders — confirmed errors by Damir 2026-07-02; action OUTLINE roles are the
   correct family (#51). Mirror back to Figma text-field/large. */
@media (hover: hover) and (pointer: fine) {
  .c-search-field:hover {
    background: var(--surface-neutral-03);
    border-color: var(--outline-action-hover);
  }
}

.c-search-field:focus-within {
  background: var(--surface-neutral-01);
  border-color: var(--outline-action-default);
  box-shadow: 0 0 0 1px var(--outline-action-default); /* 1px border + 1px shadow ≈ spec 2px */
}

/* ★ BUG-3 — ACTIVE FILTER (Damir F5 2026-08-13: "I had active search bar stuff in").
   A field holding a query is not a resting input: it is HIDING ROWS, so it stops
   looking neutral and wears the ACTION outline permanently — not only while focused
   — with the glyph and the clear affordance in action ink. Placed AFTER :hover and
   :focus-within (equal specificity, source order decides) so the filtering state
   out-ranks a passing hover; focus stays distinguishable because it adds the
   box-shadow + surface change, which this rule does not touch.
   Semantic tokens only; nothing here is density- or viewport-dependent. */
.c-search-field[data-active] {
  border-color: var(--outline-action-default);
  color: var(--text-action-default);
}
.c-search-field[data-active] .c-search-field__clear { color: var(--text-action-default); }

.c-search-field__icon { flex: none; }

.c-search-field__input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 0 var(--spacing-4);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-md); /* 16px — no iOS focus zoom */
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-01);
  caret-color: var(--text-action-default);
}
.c-search-field__input::placeholder { color: var(--text-neutral-02); opacity: 1; }
/* sanctioned #51 deviation from the #23 ring: text fields show focus as the
   container's action border+shadow (Figma text-field treatment), not the ring */
.c-search-field__input:focus { outline: none; }
/* custom clear button is the affordance — hide the native WebKit one */
.c-search-field__input::-webkit-search-cancel-button { display: none; }

.c-search-field__clear {
  flex: none;
  display: flex;
  border: 0;
  padding: var(--spacing-4);

  background: transparent;
  color: var(--text-neutral-02);
  cursor: pointer;
  border-radius: var(--radius-full);

  position: relative;

.c-search-field__clear::after {

  left: 50%;
  width: var(--size-target-min);
  height: var(--size-target-min);

@media (hover: hover) and (pointer: fine) {

  line-height: var(--line-height-body-sm);

}
.c-wallet-receive__copy {
  flex: none;
  width: 32px; height: 32px;                       /* visual 32; hit area below (#106) */
  position: relative;

.c-wallet-receive__copy:active { background: var(--surface-interactive-pressed); }   /* #28 pressed wash */

/* —— amount (mirrors the send entry: money is the hero) —— */
.c-wallet-receive__amountrow { display: flex; align-items: center; gap: var(--spacing-12); }
.c-wallet-receive__amount {
  flex: 1; min-width: 0;

/* —— send-request-to-contact strip —— */
.c-wallet-receive__ask { display: flex; flex-direction: column; gap: var(--spacing-12); }
.c-wallet-receive__asklabel {
  margin: 0;
  font-size: var(--font-size-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-02);
}
/* Damir F5 2026-07-29 (round 2): the strip stopped at 5 contacts, so reaching anyone
   further down MEANT typing — fixed by making it SCROLL (cap raised in
   wallet-receive.js). The card treatment tried in round 1 is REVERTED: this strip
   already sits inside the request box, so a second surface stacked its padding on top
   of that one and read cramped. ★ #560 (Damir, screenshots 2026-08-25) REVERSES
   both halves of that ruling: the capped 5-row INNER scroller was the "weird" he
   flagged (scroll-inside-scroll on touch, the CTA detached from the pick), and
   the list now wears the DIRECTORY CARD — byte-parity with .c-contacts__list
   (#149③ anti-drift). Full-length list, the PAGE scrolls, the CTA below goes
   STICKY so it stays reachable. The keyboard case is served by order (amount is
   on top and W-k drops the keyboard on Enter), not by a cap. */
.c-wallet-receive__contacts {
  display: flex;
  flex-direction: column;
  background: var(--surface-card);
  border-radius: var(--radius-16);
  padding: var(--spacing-4);

}
/* ★ W-j (Damir F5 2026-08-23): the row anatomy MOVED to contact-row.css — the rows
   are the shared c-contact-row now (directory grammar: avatar-48 + name + truncated
   address + online dot + the W9 select circle). `.c-wallet-receive__contact` stays
   on the element as an ALIAS for base.css (press sweep) / pressable.js / the pins;
   it carries no layout of its own any more. */
/* (disabled rows: contact-row.css dims the avatar + name at --opacity-disabled — one grammar) */
.c-wallet-receive__hint {

/* (the W9 select circle lives in contact-row.css now — .c-contact-row__check) */
/* W9 result line — the visible half of the send outcome (the live region does the

   reads error and the failed rows are still ticked above it. */
.c-wallet-receive__result {
  margin: 0;
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-success);
}
.c-wallet-receive__result[data-tone='error'] { color: var(--text-error); }
/* W9 CTA — the one thing on this surface that can send. Full width, primary.
   ★ #560: STICKY — the list is full-length now (the page scrolls), so the send
   action pins itself to the bottom of the scroller, rows sliding beneath it,
   reachable at any scroll depth and clear of the home indicator. elevation-2
   separates it from the rows passing under. */
.c-wallet-receive__cta {

/* —— #527: header row (request heading + the small "Show my address" button) —— */
.c-wallet-receive__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--spacing-12);
}
.c-wallet-receive__head .c-wallet-receive__asklabel { margin: 0; }
.c-wallet-receive__addrbtn { flex: none; }

/* —— #527 / ★ W-c: the address sheet (QR + address + copy + Share + explainer) ——
   Damir F5 2026-08-23: the desktop dialog OVERFLOWED (visible scrollbar, the chip
   and the explainer cut) and a short phone viewport had no scroll at all. The
   sheet content is now its OWN scroll region with a viewport cap; the QR card
   scales with min(); the desktop dialog is capped at 440px. Then the PREMIUM
   pass — this is the one address surface (Account reuses it), polished once. */
.c-addr-sheet {
  display: flex; flex-direction: column; gap: var(--spacing-16);
  max-height: min(72dvh, 640px);            /* the sheet title + handle sit above; the rest scrolls */
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-inline: var(--spacing-2);         /* room for the chip's focus ring inside the scroller */
  margin-inline: calc(-1 * var(--spacing-2));
}
@supports not (height: 1dvh) { .c-addr-sheet { max-height: min(72vh, 640px); } }
/* ★ #575 (Damir): on MOBILE the sheet grows to NEAR-FULL height, "just below the
   top bar". A max-height alone would not do it — the content got shorter when the
   QR shrank, so the sheet has a HEIGHT and the explainer is pushed to the foot.
   The subtraction is the chrome the sheet cannot use: the status-bar inset, the top
   bar it must clear, the home-indicator inset, and ~88px of the sheet's own handle,
   title and padding. `max(...)` is the floor — on a very short window the sheet
   falls back to a normal capped sheet instead of computing a negative height. */
/* ⚠ review MINOR-4: the height is a PREFERRED size, bounded by the HOST. `100dvh` is
   the viewport, and `.c-sheet` is absolutely positioned inside whatever host it was
   given — a phone frame in the demos, and a short landscape window on device. An
   unbounded preferred height grew the sheet UPWARD past the host's top edge, where
   `overflow: hidden` cut off the handle, the title and the new dismiss button: a
   near-full sheet with no visible way out. The sheet is a flex column capped at 100%
   of its containing block, and the content shrinks inside it. */
:root:not([data-desktop]) .c-sheet--addr {
  display: flex;
  flex-direction: column;
  max-height: 100%;
  box-sizing: border-box;
}
/* ⚠ round-2 MINOR-4: createSheet wraps the content in `.c-sheet__content`, so THAT is
   the flex item — the first cut put `flex`/`min-height` on the grandchild, where both
   are inert, and the sheet still overflowed a short host. The wrapper shrinks; the
   scroll region inside it keeps a preferred height and gives it up when it must. */
:root:not([data-desktop]) .c-sheet--addr > .c-sheet__content {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
:root:not([data-desktop]) .c-addr-sheet {
  flex: 1 1 auto;
  min-height: 0;
  height: max(320px, calc(100dvh - var(--safe-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--layout-bar-top, 56px) - 88px));
  max-height: none;
}
@supports not (height: 1dvh) {
  :root:not([data-desktop]) .c-addr-sheet {
    height: max(320px, calc(100vh - var(--safe-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--layout-bar-top, 56px) - 88px));
  }
}
/* ★ #589: the slack of the near-full mobile sheet used to collect UNDER the
   explainer, because the explainer was the last block. It is not any more — the
   safety line now sits directly under the address block, and that adjacency is the
   whole point of Damir's order. So the slack moves to the ONE seam where a gap
   reads as deliberate: between the sentence that explains the surface and the
   surface itself. Everything below the QR keeps its token gaps and its adjacency.
   ⚠ An auto margin resolves to 0 when there is no free space, so a short window
   still scrolls from the true top — no unreachable content. */
:root:not([data-desktop]) .c-addr-sheet__qrwrap { margin-block-start: auto; }
/* the explicit way out (#575). Mobile only: a desktop dialog is dismissed with Esc
   or a click outside, and both stay available here too. It sits over the sheet's own
   padding in the title row, so it never displaces content. */
.c-addr-sheet__dismiss {
  position: absolute;
  top: var(--spacing-8);
  inset-inline-end: var(--spacing-8);
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius-full);
  background: transparent;
  color: var(--icon-neutral-02);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .c-addr-sheet__dismiss:hover { background: var(--surface-interactive-hover); color: var(--icon-neutral-01); } }
/* ★ #589 (Damir F5 2026-08-26): DESKTOP GETS THE DISMISS ICON TOO. Esc and a
   click outside were the only ways out of the dialog, and neither is visible. The
   button was hidden on desktop because #575 built it for the near-full mobile
   sheet, where the scrim had shrunk to a strip — but "there is another way out"
   was never a reason to hide the only VISIBLE one. */
/* the title must not run under the button — both presentations now */
.c-sheet--addr .c-sheet__title { padding-inline-end: 44px; }
/* ★ #589: one rhythm. The sheet's own blocks are a --spacing-16 stack, and the
   title sat 12 above them, so the gap that separates the heading from everything
   read tighter than the gaps INSIDE it. Token, and the largest of the two. */
.c-sheet--addr .c-sheet__title { margin-bottom: var(--spacing-16); }
:root[data-desktop] .c-sheet--addr { width: min(440px, 92%); }
/* ★★ #589 — WHY THE PERSISTENT THUMB BELOW "DID NOT REACH THIS STATE".
   ⚠ MY FIRST ANSWER WAS WRONG AND THE AUDIT DISPROVED IT. I claimed `max-height: 76%`
   is a percentage of a HOST that could be shorter than the viewport. It cannot be:
   every production caller passes `document.body`, `.c-sheet` is absolutely positioned,
   and neither `html` nor `body` is positioned or transformed — so the containing block
   IS the initial containing block, and `76%` and `76vh` measure the same box. The
   Account pane is its own WebView, so its viewport is the pane; the two cannot disagree
   there either.

   THE REAL DEFECT IS THE CONSTANT. `92px` was the desktop chrome the scroll region
   cannot use: 24 + 24 dialog padding plus one line of title and its margin. It assumed
   a ONE-LINE title. The title's usable width is now 440 − 48 − 44 (this batch adds the
   dismiss clearance below), so a long locale wraps it to two lines, real chrome passes
   92, the OUTER dialog needs to scroll — and `overflow-y: hidden` further down clips it
   silently, with no bar anywhere. My own `margin-bottom: --spacing-16` on the title
   would have made the stale constant worse.

   Rebuilt without the arithmetic: the dialog is a flex column and the scroll region is
   the flex item that gives up height first, so it binds against whatever the chrome
   actually measures, in any locale. */
:root[data-desktop] .c-sheet--addr {
  display: flex;
  flex-direction: column;
}
:root[data-desktop] .c-sheet--addr > .c-sheet__content {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
:root[data-desktop] .c-addr-sheet { flex: 1 1 auto; min-height: 0; max-height: none; }
/* ★ F5-5 ② (#556, Damir F5 2026-08-24): the desktop dialog showed NO scrollbar on
   overflow. Two causes: the OUTER dialog (.c-sheet, overflow-y:auto in overlay.css)
   could scroll instead of this element, and the u-scroll thumb is hover-only.
   The addr dialog now clips (the inner .c-addr-sheet is the one scroller), and its
   thumb is PERSISTENT while it overflows — slim + themed, the contact-list look. */
:root[data-desktop] .c-sheet--addr { overflow-y: hidden; }
/* ★ #589: the thumb PAINT leaves the pointer gate — the width does NOT, and the audit
   caught me shipping it outside.
   ⚠ Authoring any `::-webkit-scrollbar` rule opts a Chromium scroller OUT of overlay
   scrollbars and into classic, LAYOUT-CONSUMING ones. `.u-scroll` declares its width
   inside `@media (hover: hover) and (pointer: fine)` together with
   `scrollbar-gutter: stable`, which is what stops that width from reflowing content.
   Exporting the width alone gave a touch-screen Windows laptop — `data-desktop`,
   coarse pointer — a 6px bar with no reserved gutter, appearing and disappearing as
   overflow toggled and shoving the QR and the chip sideways.
   Only the two PAINT declarations are ungated, which is all the override needed. */
:root[data-desktop] .c-addr-sheet.u-scroll {
  scrollbar-color: var(--outline-neutral-02) transparent;
}
:root[data-desktop] .c-addr-sheet.u-scroll::-webkit-scrollbar-thumb {
  background: var(--outline-neutral-02);
}
/* review MINOR-6: the sheet's own polite region — the same recipe the hub uses
   (settings-shell.css .c-settings__live), so one grammar, not a second one. */
.c-addr-sheet__live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  margin: 0;
}
/* ★★ #591: THE GEOMETRY DOCBLOCK MOVED HERE, and it moved because its subject did.
   It was written in chat-info.css when that file drew the last inline QR card; the
   contact-details card is retired and this sheet is now the ONE card in the app that
   renders a code. A measured-geometry comment beside a card that no longer exists is
   the drift PIN-G was built to catch. Verbatim, so the numbers stay the measured ones. */

/* ★ N86 ① (Damir 2026-08-25): "the QR should have a smaller white padding around it,
   this way on dark mode it's quite overpowering."

   Measured before touching it, because HALF of that white is a standard, not a choice.
   createQrSvg bakes `quiet = 4` — the ISO/IEC 18004 minimum quiet zone. Below four
   modules scanners start failing, and this is a WALLET ADDRESS, where a misread is the
   worst class of defect in the app. At 185px that quiet zone measures 16.44px to 20.00px
   per side (the table below), and it is untouchable.

   The 12px card padding on top of it was doing a job the quiet zone already does. Gone:
   the white square drops from ≈209px to 185px, a 22% cut in white area, with no effect
   on scanning at all.

   ⚠ THE RADIUS SURVIVES THE PADDING, and the corner arithmetic is why. With 12px of
   padding the 16px curve lived entirely in the padding and could not reach the code.
   With none, it eats the quiet zone's own corner.

   ★ #46 loop: the numbers below are MEASURED, not estimated. An earlier version of this
   comment carried three wrong ones. The method: run the SHIPPED encoder
   (createQrSvg → setQrValue, ecc 'M', quiet = 4) over the real payload
   (`address + ':ixi'`) and read the viewBox back. Re-measure the same way if the payload
   or the encoder changes. Over payloads of 34 to 76 characters the viewBox takes exactly
   three values. The BOX is the code plus the 4-module quiet zone on each side, so the box
   is always 8 cells wider than the code:
     34–42 chars → 29-module code, 37-cell box, 5.00px per cell, 20.00px quiet zone
     43–62 chars → 33-module code, 41-cell box, 4.51px per cell, 18.05px quiet zone
     63–76 chars → 37-module code, 45-cell box, 4.11px per cell, 16.44px quiet zone
   A real Ixian address lands in the middle row.

   ⚠ A 16px radius removes at most R(√2−1) = 6.63px of DIAGONAL depth at a square corner.
   It does NOT remove 16 − 16/√2 = 4.69px. That second value is the sagitta of the arc. It
   is a different measurement, and it understates the loss by 41%.

   THE SAFETY RESULT, which is unchanged. The quiet zone is 16.44px in the worst measured
   case. The radius is 16px. The curve therefore stays inside the quiet zone at all four
   corners and reaches no module. Along every edge, where ISO/IEC 18004 measures, the clip
   removes nothing. The curve first touches the code corner when the quiet zone falls
   below 16 − 16/√2 = 4.69px, which needs a box of about 157 cells. This payload cannot
   make one.
   ⚠ Raise this radius above 16px and re-do both comparisons. */
.c-addr-sheet__qrwrap { display: flex; justify-content: center; }
.c-addr-sheet__qrcard {
  /* scale with the viewport on BOTH axes: a short window shrinks the code before
     it pushes the chip below the fold. --surface-qr stays near-white in both themes.
     ★ F5-5 ① (#556, Damir F5 2026-08-24): card padding DROPPED to the Account
     proportions (.c-settings__qr has none — N86). The SVG's own ISO quiet zone is
     the white margin; the extra 20px ring doubled it. Radius joins the Account
     family (radius-16); the hairline outline goes with the padding. */
  /* ★ #575 (Damir): "QR still too big — shrink it." 280 → 216. The code stays
     comfortably scannable at arm's length (a base58 address is a low-density QR and
     the SVG keeps its own ISO quiet zone, N86), and the smaller card is what lets
     the address chip and the explainer share the sheet without scrolling. */
  width: min(216px, 40dvh, 62vw, 100%);
  padding: 0;
  border-radius: var(--radius-16);
  box-shadow: var(--elevation-1);
}
@supports not (height: 1dvh) { .c-addr-sheet__qrcard { width: min(216px, 40vh, 62vw, 100%); } }
.c-addr-sheet__caption {
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
}
/* the address chip: the #99 member-sheet pattern, one step more deliberate —
   a hairline, a larger radius and letter-spacing so the base58 reads as a token */
.c-addr-sheet__addr {
  padding-block: var(--spacing-12);
  padding-inline: var(--spacing-16) var(--spacing-8);
  border-radius: var(--radius-16);
  border: var(--outline-width-1) solid var(--outline-neutral-01);
}
.c-addr-sheet__addr .c-wallet-receive__addrvalue {
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: 0.01em;
}
.c-addr-sheet__addr .c-wallet-receive__copy { width: 40px; height: 40px; }
.c-addr-sheet__addr .c-wallet-receive__copy[data-state='ok'] { color: var(--icon-success); }
.c-addr-sheet__addr .c-wallet-receive__copy[data-state='fail'] { color: var(--icon-error); }
/* ★ #575: Share is an icon button on the chip, beside Copy — the full-width
   outline row it replaced "reads as a too-short bar". Same 40px square as Copy, so
   the chip carries a pair of equal controls. */
.c-addr-sheet__sharebtn { width: 40px; height: 40px; }
/* the explainer block — ★ F5-5 ③ (#556): ONE glyph level. The filled disc read as
   an icon inside an icon (Damir screenshot); a bare tinted info-circle leads the
   two quiet lines. The safety line keeps its inline shield glyph. */
/* ★ #575 (Damir): a TWO-COLUMN GRID, glyph gutter + copy column. Every line of
   copy shares ONE left edge — that is his "align the safety text with the info
   text's left edge, not under the icon". The old flex layout put the shield inside
   the text column, which indented the safety line away from the paragraph above it.
   `align-items: start` keeps each glyph on the first line of its own paragraph. */
.c-addr-sheet__explain {
  display: grid;
  /* ⚠ #589: a FIXED gutter, not `auto`. With `auto` the track is sized by that block's
     own glyph — 20px for the info-circle, 16px for the shield — so the two blocks'
     copy started 32px and 28px from their card edge. A 4px step between two otherwise
     identical cards is exactly the one-left-edge alignment #575 was written to buy.
     A fixed track is also what makes `justify-self: center` on the glyph mean anything;
     against an `auto` track it was a no-op. */
  grid-template-columns: 20px minmax(0, 1fr);
  align-items: start;
  column-gap: var(--spacing-12);
  padding: var(--spacing-12);
  border-radius: var(--radius-16);
  background: var(--surface-neutral-02);
}
.c-addr-sheet__explainicon { margin-top: 1px; color: var(--icon-info); display: inline-flex; justify-self: center; }
.c-addr-sheet__explainicon--safe { color: var(--icon-success); margin-top: 2px; }
.c-addr-sheet__info {
  margin: 0;
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}
.c-addr-sheet__info--safe { color: var(--text-neutral-01); }

/* ★ W-b (2026-08-24): desktop content column cap — see wallet-send.css */
:root[data-desktop] .c-wallet-receive { max-width: 560px; margin-inline: auto; width: 100%; box-sizing: border-box; }

  /* Production shell: fill the WebView. contact_details.html is loaded by the C#

  .contact-boot__dot { flex: none; width: var(--size-avatar-40); height: var(--size-avatar-40); border-radius: var(--radius-full); background: var(--surface-neutral-02); }
  .contact-boot__line { height: 14px; border-radius: var(--radius-full); background: var(--surface-neutral-02); }
  .contact-boot__disc, .contact-boot__dot, .contact-boot__line { animation: contact-boot-shimmer 1.4s var(--easing-standard) infinite; }
  @keyframes contact-boot-shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .contact-boot__disc, .contact-boot__dot, .contact-boot__line { animation: none; } }
  /* N27 (#367): the blocking-group list inside the remove-blocked modal.
     max-height + scroll (loop MAJOR M1): the list is data-driven and c-modal
     has no overflow of its own — many groups (or landscape) must scroll the
     LIST, never push the OK button past the clipped viewport. */
  /* Loop r2 MINOR-1: the FIXED chrome (title + intro + path + actions) alone can
     exceed a short landscape viewport with the host scroll-locked — cap the
     modal itself so OK is always reachable by scroll. Shell-scoped on purpose:
     the global c-modal grammar is not this batch's to change. */

  .cd-remove-blocked {

  /* Unit 6 (#247): desktop pane hosting. C# pushes setPaneMode('1'|'2') pre-present:
       '1' = the detail slot (no conversation open) — the body content caps at the demo
             grammar 640, title bar spans full width (#245b pattern);
       '2' = the 360px column beside the open conversation — hairline divider on its

             so no double line; the 640 cap is inert at pane width). */

  /* ★ #591 (round-2 review): the hero COVER bleeds to the body's padding edge, and in a
     detail column wider than the 640 cap that edge is 640px of centred band with hard
     left and right edges floating in the column. In pane mode the cover spans the PANE,
     not the capped content column. `100vw` is wrong here for the same reason it was wrong
