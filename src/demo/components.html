<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spixi components — demo</title>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<style>
  /* demo chrome only — not part of the system */
  body { padding: var(--spacing-24); max-width: 900px; margin: 0 auto; }
  .demo-toolbar { display: flex; gap: var(--spacing-12); align-items: center; margin-bottom: var(--spacing-32); }
  .demo-section { margin-bottom: var(--spacing-40); }
  .demo-row { display: flex; gap: var(--spacing-12); align-items: center; flex-wrap: wrap; margin-bottom: var(--spacing-12); }
  .demo-label { width: 90px; flex: none; color: var(--text-neutral-02); font-size: var(--font-size-body-sm); }
  .demo-full { max-width: 360px; border: 1px dashed var(--outline-neutral-02); padding: var(--spacing-12); border-radius: var(--radius-12); }
</style>
</head>
<body>
  <div class="demo-toolbar">
    <h1 class="t-heading-md" style="margin-right:auto">Components</h1>
    <span id="theme-slot"></span>
  </div>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Button — sizes × types (intent: default)</h2>
    <div id="grid-default"></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Button — destructive</h2>
    <div id="grid-destructive"></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">States</h2>
    <div class="demo-row"><span class="demo-label">disabled</span><span id="row-disabled"></span></div>
    <div class="demo-row"><span class="demo-label">loading</span><span id="row-loading"></span></div>
    <div class="demo-row"><span class="demo-label">load→done</span><span id="row-interactive"></span></div>
    <div class="demo-row"><span class="demo-label">destructive</span><span id="row-destructive-flow"></span></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Icons</h2>
    <div class="demo-row"><span class="demo-label">leading</span><span id="row-icon-leading"></span></div>
    <div class="demo-row"><span class="demo-label">trailing</span><span id="row-icon-trailing"></span></div>
    <div class="demo-row"><span class="demo-label">icon-only</span><span id="row-icon-only"></span></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Width: full (fills container)</h2>
    <div class="demo-full" id="row-full"></div>
  </section>

<script src="../components/icons.iife.js"></script>
<script src="spixi.iife.js"></script>
<script>
  /* Real component code loads from the generated bundle (DECISIONS.md #35). */
  const { createButton, setLoading, setSuccess } = window.Spixi;
  /* ============================ demo ============================ */

  const TYPES = ['fill', 'tonal', 'outline', 'text'];
  const SIZES = [56, 44, 32];

  const makeIcon = (name) => window.SpixiIcons.icon(name);

  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  const themeBtn = createButton({
    // initial label reflects the actual starting theme (OS-dark may already apply)
    label: document.documentElement.dataset.theme === 'dark' ? 'Toggle light' : 'Toggle dark',
    type: 'outline', size: 32,
    onClick: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark';
      root.dataset.theme = dark ? 'light' : 'dark';
      themeBtn.querySelector('.c-button__label').textContent = dark ? 'Toggle dark' : 'Toggle light';
    },
  });
  document.getElementById('theme-slot').append(themeBtn);

  for (const pair of [['grid-default', 'default'], ['grid-destructive', 'destructive']]) {
    const grid = document.getElementById(pair[0]);
    for (const size of SIZES) {
      const row = document.createElement('div');
      row.className = 'demo-row';
      const label = document.createElement('span');
      label.className = 'demo-label';
      label.textContent = size + 'px';
      row.append(label);
      for (const type of TYPES) row.append(createButton({ label: 'Button', type, size, intent: pair[1] }));
      grid.append(row);
    }
  }

  const disabledRow = document.getElementById('row-disabled');
  for (const type of TYPES) disabledRow.append(createButton({ label: 'Button', type, disabled: true }));

  const loadingRow = document.getElementById('row-loading');
  for (const type of TYPES) loadingRow.append(createButton({ label: 'Loading', type, loading: true }));

  // load 1.2s → success morph 1.4s → restore (DECISIONS.md #29)
  const interactive = createButton({
    label: 'Save settings', type: 'fill',
    onClick: () => {
      setLoading(interactive, true);
      setTimeout(() => setSuccess(interactive, { label: 'Saved' }), 1200);
    },
  });
  document.getElementById('row-interactive').append(interactive);

  const destructiveFlow = createButton({
    label: 'Delete history', type: 'tonal', intent: 'destructive',
    onClick: () => {
      setLoading(destructiveFlow, true);
      setTimeout(() => setSuccess(destructiveFlow, { label: 'Deleted' }), 1200);
    },
  });
  document.getElementById('row-destructive-flow').append(destructiveFlow);

  document.getElementById('row-icon-leading').append(
    createButton({ label: 'Back', type: 'tonal', icon: makeIcon('arrow-left') }),
    createButton({ label: 'Scan', type: 'outline', icon: makeIcon('qrcode') }),
  );
  document.getElementById('row-icon-trailing').append(
    createButton({ label: 'Continue', type: 'fill', icon: makeIcon('arrow-right'), iconPosition: 'trailing' }),
  );
  document.getElementById('row-icon-only').append(
    createButton({ type: 'fill', icon: makeIcon('qrcode'), ariaLabel: 'Scan QR code' }),
    createButton({ type: 'tonal', icon: makeIcon('arrow-left'), ariaLabel: 'Back' }),
    createButton({ type: 'text', size: 32, icon: makeIcon('arrow-right'), ariaLabel: 'Forward' }),
  );

  document.getElementById('row-full').append(
    createButton({ label: 'Send payment', type: 'fill', size: 56, width: 'full' }),
  );
</script>
</body>
</html>
