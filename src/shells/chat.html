<!-- Resolve the theme BEFORE any style/paint so the instant-bg + tokens match the
     user's chosen appearance from the first frame (no light→dark flash). Same
     head-top guard the other shells use; the late body block below is harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- Desktop split (Approach 1, DECISIONS #208): .is-desktop drops the chat doodle
     pattern + renders chat-info as a side panel. Set by ?desktop=1 (preview) or
     window.__SPIXI_DESKTOP__ (C# at cutover). Off by default → mobile untouched. -->
<script>(function(){try{var p=new URLSearchParams(location.search);if(p.get('desktop')==='1'||window.__SPIXI_DESKTOP__)document.documentElement.classList.add('is-desktop');}catch(e){}})();</script>
<style>
  /* Paint the screen surface IMMEDIATELY — before tokens.css/base.css load and
     before the JS bundle parses — so entering a chat doesn't flash an empty
     "blank" pane while the shell boots (Damir F5). Values mirror --surface-screen
     (neutral-10 / neutral-900); tokens.css takes over once loaded. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }

<style>
  /* Production chat shell: fill the WebView (no demo phone frame). The chat
     topbar pins, the message log (c-chat-canvas → .messages) scrolls, the
     composer pins to the bottom. Element ids/classes MATCH the demo so the
     component CSS applies unchanged. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #chat-topbar { flex: none; }
  .c-banner { flex: none; }              /* connectivity strip pins under the topbar */
  .chat-request-pane { flex: none; }     /* incoming-request pane pins above the composer */
  .c-chat-canvas { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* Messages sit at the BOTTOM (adjacent to the composer) and grow upward — the
     natural chat flow. The secure notice floats CENTERED in the free space above
     them: its own two auto-margins split that space equally above + below it, so
     on a new/empty chat it lands dead-center, and as messages fill in below it
     the notice rises like a normal bubble. When the log overflows the auto-
     margins collapse to 0 → notice pins to the top of history, log scrolls,
     newest at the bottom (Damir 2026-07-07). */
  #messages { flex: 1; min-height: 0; padding-bottom: var(--spacing-4); display: flex; flex-direction: column; }
  #messages > .c-sysnotice { margin-top: auto; margin-bottom: auto; }
  #chat-composer { flex: none; }
  /* ===== DESKTOP (.is-desktop, DECISIONS #208) — pattern-off + grey ground =====
     The doodle pattern reads busy in a wide desktop pane, so drop it while KEEPING
     the gradient wash (the pattern is the ::before layer; the gradient is the
     element background). Dark desktop deepens the base to grey-1000. Mirrors the
     demo's .dt-frame rule (#207). .is-desktop is on <html>, same element as
     data-theme, so the dark rule is a COMPOUND selector (not descendant). The
     info side-panel layout is added in a later stage. Mobile keeps its pattern. */
  .is-desktop .c-chat-canvas::before { display: none; }
  html.is-desktop[data-theme="dark"] .c-chat-canvas { --chat-canvas-base: var(--neutral-1000); }
  /* boot spinner — fills the log while the JS bundle parses + C# pushes the
     conversation; the first renderLogNow() clears #messages and removes it. */
  .chat-boot { flex: 1; display: flex; align-items: center; justify-content: center; }
  .chat-boot__spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border-subtle, rgba(128,128,128,0.22));
    border-top-color: var(--icon-accent, #1892ce);
    animation: chat-boot-spin 0.8s linear infinite;
  }
  @keyframes chat-boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .chat-boot__spinner { animation: none; } }
  /* avatar flash guard: keep the topbar avatar invisible (slot reserved) until the
     identity lands, so the boot gradient never flashes before the real avatar. */
  .c-topbar.is-avatar-pending .c-avatar { visibility: hidden; }
  /* attach → App-invite picker (inside a c-sheet) */
  .chat-app-picker { display: flex; flex-direction: column; gap: var(--spacing-1, 4px); }
  .chat-app-picker__item {
    display: flex; align-items: center; gap: var(--spacing-3, 12px);
    padding: var(--spacing-3, 12px); border: 0; border-radius: var(--radius-md, 12px);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer; width: 100%;
  }
  .chat-app-picker__item:hover { background: var(--interactive-hover, rgba(128,128,128,0.12)); }
  .chat-app-picker__name { font-weight: 600; }
  .chat-app-picker__empty { padding: var(--spacing-4, 16px); text-align: center; color: var(--text-neutral-03, #888); }
  /* group/bot chat-info takeover — full-viewport cover mounted over the chat.
     z-30 sits ABOVE the bars/composer (z-20) but BELOW the sheets (z-40) + modal
     (z-50) it spawns, so its member sheet + kick/ban/leave confirms render on top.
     The c-chat-info panel is height:100% → fills this. */
  .chat-info-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .chat-info-takeover > .c-chat-info { flex: 1; min-height: 0; }
  /* Bot channels (Option A — channel-as-title, Damir F5 2026-07-08): the CURRENT
     channel name lives in the topbar title with a chevron-down affordance; tapping
     the title opens the selector as a panel that slides DOWN from under the topbar
     (NOT the old under-topbar bar, NOT a bottom sheet). The trailing ⓘ opens the
     chat-info takeover. */
  .c-topbar.is-bot-channels .c-topbar__name {
    display: inline-flex; align-items: center; gap: var(--spacing-1, 4px);
  }
  .chat-channel-chev { flex: none; color: var(--icon-neutral-02, currentColor); }
  .chat-channel-unread-dot {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);
  }
  /* top-anchored channel selector: full-viewport scrim + a panel pinned directly
     under the topbar (its `top` is set inline = the topbar height) that slides
     down (translateY -100% → 0). */
  .chat-channel-overlay { position: fixed; inset: 0; z-index: 15; } /* below topbar (--z-20): panel slides out from UNDER the bar; scrim dims messages/composer but NOT the topbar (Damir 2026-07-08) */
  .chat-channel-overlay__scrim {
    position: absolute; inset: 0; background: var(--surface-scrim, rgba(0,0,0,0.4));
    opacity: 0; transition: opacity var(--duration-200, 200ms) var(--easing-standard, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-overlay__scrim { opacity: 1; }
  .chat-channel-panel {
    position: absolute; left: 0; right: 0;   /* top set inline = topbar height */
    max-height: 60vh; overflow-y: auto;
    background: var(--surface-menu, var(--surface-neutral-01, #fff));
    border-bottom-left-radius: var(--radius-16, 16px);
    border-bottom-right-radius: var(--radius-16, 16px);
    box-shadow: var(--elevation-3, 0 8px 24px rgba(0,0,0,0.24));
    padding: var(--spacing-3, 12px);
    transform: translateY(-100%);
    transition: transform var(--duration-200, 200ms) var(--easing-emphasized, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-panel { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .chat-channel-overlay__scrim, .chat-channel-panel { transition: none; }
  }
  .chat-channel-panel__title {
    font-size: var(--font-size-label-sm, 13px);
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-neutral-02, #666);
    padding: var(--spacing-1, 4px) var(--spacing-2, 8px) var(--spacing-2, 8px);
  }
  /* channel list (rows shared by the panel) */
  .chat-channel-list { display: flex; flex-direction: column; gap: var(--spacing-1, 4px); }
  .chat-channel-list__item {
    display: flex; align-items: center; gap: var(--spacing-2, 8px);
    width: 100%; padding: var(--spacing-3, 12px); border: 0; border-radius: var(--radius-md, 12px);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer;
  }
  .chat-channel-list__unread {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);
  }
  .chat-channel-list__item[data-selected] { background: var(--surface-action-tonal-default, rgba(24,146,206,0.12)); }
  .chat-channel-list__item[data-selected] .chat-channel-list__name { font-weight: var(--font-weight-semibold, 600); }
  .chat-channel-list__item:hover { background: var(--interactive-hover, rgba(128,128,128,0.12)); }
  .chat-channel-list__empty { padding: var(--spacing-4, 16px); text-align: center; color: var(--text-neutral-03, #888); }

  /* @ jump-to-mention FAB (#8). Hidden until an unseen mention of the local user
     exists. It occupies the PRIMARY bottom slot by default (when the scroll-to-latest
     chevron is hidden — i.e. at the bottom, image-1 case); when the chevron is visible
     (scrolled up) it slides UP one slot to sit ABOVE the chevron, never overlapping it.
     Keyed off the sibling c-scroll-latest[data-visible] (appended before this button). */
  .chat-mention-fab {
    position: absolute;
    inset-inline-end: var(--spacing-16);
    inset-block-end: var(--spacing-16);   /* primary bottom slot (chevron hidden) */
    width: var(--size-target-min); height: var(--size-target-min);
    display: flex; align-items: center; justify-content: center;
    border: var(--outline-width-1) solid var(--outline-neutral-01);
    border-radius: var(--radius-full);
    background: var(--surface-action-tonal-default);
    color: var(--text-action-default);
    box-shadow: var(--elevation-2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    opacity: 0; transform: translateY(var(--spacing-8)); visibility: hidden; pointer-events: none;
    transition: opacity var(--duration-200) var(--easing-standard),
                transform var(--duration-200) var(--easing-decelerate),
                inset-block-end var(--duration-200) var(--easing-decelerate),
                visibility var(--duration-200),
                background-color var(--duration-100) var(--easing-standard);
  }
  /* chevron visible → stack the @ FAB one 44px button + gap above it */
  .c-scroll-latest[data-visible] ~ .chat-mention-fab {
    inset-block-end: calc(var(--spacing-16) + var(--size-target-min) + var(--spacing-8));
  }
  .chat-mention-fab[data-visible] { opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }
  @media (hover: hover) { .chat-mention-fab:hover { background: var(--surface-action-tonal-hover); } }
  .chat-mention-fab:active { background: var(--surface-action-tonal-pressed); }
  /* unseen-mention count (same recipe as the scroll-latest badge: error role + ring) */
  .chat-mention-fab__badge {
    position: absolute; top: calc(-1 * var(--spacing-4)); inset-inline-end: calc(-1 * var(--spacing-4));
    min-width: 18px; height: 18px; padding: 0 var(--spacing-4);
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full);
    background: var(--surface-error); color: var(--text-neutral-on-action);
    box-shadow: 0 0 0 2px var(--surface-menu);
    font-size: var(--font-size-label-xs); line-height: 1; font-weight: var(--font-weight-bold);
  }

  /* pulse the target message on jump */
  .c-bubble-row[data-mention-pulse] .c-bubble { animation: chat-mention-pulse 1.4s var(--easing-standard) 1; }
  @keyframes chat-mention-pulse {
    0%, 20% { box-shadow: 0 0 0 3px var(--surface-warning-inverse); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .c-bubble-row[data-mention-pulse] .c-bubble { animation: none; } }
</style>

<body>
  <div id="chat-topbar"></div>
  <div class="c-chat-canvas">
    <!-- tabindex: keyboard users must be able to scroll text-only history -->
    <div class="messages u-scroll" id="messages" role="log" aria-label="Messages" tabindex="0"><div class="chat-boot" aria-hidden="true"><span class="chat-boot__spinner"></span></div></div>
  </div>
  <div id="chat-composer"></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production chat shell — the redesigned single-chat surface wired to the REAL
   * C# MAUI bridge (native.js in the bundle). SingleChatPage.xaml.cs pushes the
   * conversation via executeUiCommand(fnRef, b64…) against the page globals
   * registered below; the composer + back button emit legacy `ixian:` commands
   * via bridge.send.
   *
   * Contract source of truth: Spixi/Pages/Chat/SingleChatPage.xaml.cs +
   * Resources/Raw/html/js/chat.js (legacy). The 1:1 text conversation is wired
   * fully (create + status upsert + delete + typing + clear). Everything else is
   * a safe no-op stub so C#'s dispatch never console.errors.
   *
   * CONTRACT NOTES (verified against SingleChatPage.xaml.cs, line refs):
   *  · Text CREATE arrives via addMe / addThem (chat.js insertMessage → prefix,
   *    xaml.cs:1460), 12 args:
   *      addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending)
   *      addThem(id, address, nick, avatar, text, time)
   *    (legacy addMe/addThem share the addText 7-arg shape; addThem is called
   *    with only 6 by C#, so args 7-11 are undefined for incoming rows.)
   *  · Text STATUS UPDATE arrives via updateMessage (chat.js:1035, xaml.cs:1624):
   *      updateMessage(id, message, sent, confirmed, read, paid, errorSending)
   *    Legacy updateMessage ONLY mutates an existing msg_<id> row (returns early
   *    if unknown). To be robust here it is an UPSERT: create if the id is
   *    unknown (using `message` as the text + `sent` for direction), else update
   *    the existing row's status + text.
   *  · timestamps are UNIX SECONDS (legacy addText does `new Date(time*1000)`);
   *    the redesigned bubbles want ms → multiply.
   *  · All bool args are the .NET "True"/"False" strings.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, createMessageBubble, createDateSeparator,
    createComposer, clearComposer, createTypingIndicator, createScrollToLatest,
    setMessageStatus, removeMessage,
    createFileBubble, setFileProgress,
    createMediaBubble, setMediaSrc, openMediaViewer,
    createPaymentBubble, createCallBubble,
    createAppBubble, createSystemNotice,
    attachMessageMenu, openTipSheet, openMemberSheet, openAttachSheet,
    createModal, openModal, showToast,
    createWarningBanner, setWarning, createContactRequest,
    createSheet, openSheet, closeSheet,
    createChatInfo,                 // group/bot chat-info takeover (header tap; 1:1 → ContactDetails page)
    addReactions: applyReactions,   // component free-fn; aliased — the bridge handler below is also `addReactions`
    truncateAddressMiddle,          // #211 canon: chat surfaces show addresses truncated, never in full
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;

  /* #211 address-display canon: the visible chat title is the nick, or the address
   * MIDDLE-TRUNCATED (6…6) when there's no nick (or the "nick" is really the address
   * echoed back). Full address lives only in Contact details + payments. */
  function identityTitle() {
    const nick = identity.name || '';
    if (nick && nick !== identity.address) return nick;
    return identity.address ? truncateAddressMiddle(identity.address) : (nick || '');
  }

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[chat-shell stub]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;
  /* legacy sends Unix SECONDS; redesigned bubbles compare against Date.now() (ms) */
  const toMs = (t) => { let n = Number(t) || 0; if (n && n < 1e12) n *= 1000; return n; };

  /* —— chat mode (setChatMode type: 0 = 1:1, 1 = group, 2 = blind group,
   *    3 = bot — chat.js setChatMode / xaml.cs:526,549). We keep it so the
   *    header + grouping know whether to show sender labels/avatars. ————————— */
  const mode = { type: 0, isBot: false, isMulti: false, admin: false, notifications: true };

  /* —— header identity model. setNickname / setOnlineStatus mutate this; the
   *    topbar is rebuilt so name + presence sub-line stay live. ——————————————— */
  const identity = { name: '', sub: '', address: '', online: false, avatar: null };

  /** Resolve a C# avatar arg to an <img> src, or null for the gradient fallback
   *  (same rule as the home shell): real on-disk path → src (normalize
   *  backslashes); the C# default placeholders → null = deterministic gradient.
   *  The avatar component has an onerror→gradient fallback, so a non-resolving
   *  path degrades cleanly. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }
  let callVisible = false;   // showCallButton reveals the topbar phone action (1:1, peer reachable)

  // Bot channel selector state — declared BEFORE the topbar renderer because the
  // channel-as-title (Option A) reads channelState during the first synchronous
  // paint (see the bot-channel bridge-protocol note further down).
  const channelState = { has: false, index: 0, name: '', icon: '', unread: false };
  let channelList = [];               // accumulated per open, from addChannelToSelector
  let channelDropdown = null;         // top-anchored selector overlay (open = non-null)
  let channelSheetBody = null;        // the live channel list inside the panel
  let channelKeydown = null;          // Esc + Tab-trap handler while the dropdown is open
  let channelFocusin = null;          // focus containment while the dropdown is open
  let channelReturnFocus = null;      // element to restore focus to on close (the title trigger)
  let focusTitleAfterRender = false;  // row-select rebuilds the topbar → focus the new title (review MINOR-2)

  const topbarHost = document.getElementById('chat-topbar');
  function renderTopbarNow() {
    topbarHost.textContent = '';
    const s = window.SL || {};
    // Bot channel mode (Option A): once C# has named a channel, the topbar TITLE
    // becomes the current channel name + chevron and opens the channel selector;
    // a trailing ⓘ opens the chat-info takeover. Otherwise the identity block
    // behaves as before (group/blind → chat-info takeover; 1:1 → ContactDetails).
    const botChannels = mode.isBot && channelState.has;

    const actions = [];
    // start a voice call — revealed by showCallButton (C# gates availability);
    // ixian:call toggles initiate/hang-up (xaml:136).
    if (callVisible) actions.push({ icon: 'phone', label: s.call || 'Call', onClick: () => bridge.send('ixian:call') });
    // bot channels: the title now opens the selector, so chat-info moves to a
    // trailing info icon (shown on desktop AND mobile per Damir).
    if (botChannels) actions.push({ icon: 'info-circle', label: s.chatInfo || 'Chat info', onClick: () => openChatInfo() });

    const tb = createTopbar({
      variant: 'chat',
      identity: {
        // channel-as-title: the channel name is the header label in bot mode; the
        // bot name/address drops to the sub-line so the identity stays visible.
        // #211: a nameless identity shows its address MIDDLE-TRUNCATED, never in full.
        name: botChannels ? ('# ' + (channelState.name || '')) : identityTitle(),
        sub: botChannels
          ? [identityTitle(), identity.sub || ''].filter(Boolean).join(' · ')
          : (identity.sub || ''),
        address: identity.address || identity.name || '',
        online: botChannels ? false : identity.online,
        avatar: identity.avatar || null,
      },
      // Header tap. bot channels → open the channel selector (title = affordance).
      // group/blind-group → the IN-CHAT chat-info takeover (SingleChatPage owns the
      // group verbs). 1:1 → navigate to the ContactDetails page (ixian:details).
      onIdentity: botChannels
        ? () => openChannelSelector()
        : () => { if (mode.isMulti) openChatInfo(); else bridge.send('ixian:details'); },
      onBack: () => bridge.send('ixian:back'),
      actions,
    });

    // Inject the chevron (and an any-channel-unread dot) into the title so the
    // channel-as-title reads as a dropdown affordance. Done here (not in the
    // shared c-topbar component) to keep the component generic.
    if (botChannels) {
      tb.classList.add('is-bot-channels');
      const nameEl = tb.querySelector('.c-topbar__name');
      if (nameEl && window.SpixiIcons && window.SpixiIcons.icon) {
        if (channelState.unread) {
          const dot = document.createElement('span');
          dot.className = 'chat-channel-unread-dot';
          dot.setAttribute('aria-hidden', 'true');
          nameEl.append(dot);
        }
        const chev = window.SpixiIcons.icon('chevron-down', { size: 18 });
        chev.classList.add('chat-channel-chev');
        nameEl.append(chev);
      }
    }
    // Avatar flash guard (Damir F5): the synchronous first paint runs BEFORE C# pushes
    // onChatScreenReady/setAvatar, so identity has no address yet and createAvatar would
    // paint a default gradient that then swaps to the real avatar. Hide the avatar until
    // the identity lands (address known) — the slot reserves space, then the real avatar
    // (or the correct address-gradient) appears once, with no wrong-colour flash.
    if (!identity.address) tb.classList.add('is-avatar-pending');
    topbarHost.append(tb);
    // channel row-select coalesces a topbar rebuild; land focus on the NEW title
    // (the old trigger is detached by textContent='' above → would drop to body).
    if (focusTitleAfterRender && botChannels) {
      focusTitleAfterRender = false;
      const wrap = tb.querySelector('.c-topbar__identity-wrap');
      if (wrap) wrap.focus({ preventScroll: true });
    }
  }
  // Coalesce topbar rebuilds too: on open C# fires setNickname + setOnlineStatus
  // (+ onChatScreenReady) in quick succession, each tearing down + rebuilding the
  // header — same flicker class as the log. Batch to one frame.
  let topbarQueued = false;
  function renderTopbar() {
    if (topbarQueued) return;
    topbarQueued = true;
    requestAnimationFrame(() => { topbarQueued = false; renderTopbarNow(); });
  }
  renderTopbarNow();  // synchronous first paint

  /* connectivity banner (#59) — mounts directly under the top bar; showWarning
   * opens/updates it, empty text collapses it (bridge showWarning, xaml:1746). */
  const warningBanner = createWarningBanner({ strings: window.SL || {} });
  topbarHost.after(warningBanner);

  /* —— bot channel selector (Damir F5 2026-07-08: bot chats support channels) ——
   * Bots (mode.type 3) can host multiple channels. C# drives it (legacy chat.js):
   *   setSelectedChannel(index, icon, name)          → current channel; reveals the
   *                                                     bar (chat.js:250)
   *   addChannelToSelector(index, name, icon, unread) → one channel row, pushed
   *       ONLY in response to ixian:populateChannelSelector (pull-on-open,
   *       chat.js:1338/1353) — so the list is empty until the bar is tapped
   *   setChannelSelectorStatus(status)               → any-channel-unread flag
   *       ("true" = all read, else unread — chat.js:1345)
   * Tapping a row emits ixian:selectChannel:<index> (chat.js:1319; C# switches +
   * reloads the messages + echoes setSelectedChannel). The selector shows ONLY for
   * bots, once C# has named a channel — non-bot chats are untouched. State is
   * declared above (needed by the first topbar paint). */
  function makeChannelRow(ch) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chat-channel-list__item';
    if (ch.index === channelState.index) b.dataset.selected = '';
    const name = document.createElement('span');
    name.className = 'chat-channel-list__name';
    name.textContent = '# ' + (ch.name || '');
    b.append(name);
    if (ch.unread) {
      const dot = document.createElement('span');
      dot.className = 'chat-channel-list__unread';
      dot.setAttribute('aria-hidden', 'true');
      b.append(dot);
    }
    b.addEventListener('click', () => {
      // optimistic selection; C# echoes setSelectedChannel + reloads the messages
      channelState.index = ch.index;
      channelState.name = ch.name;
      channelState.icon = ch.icon || channelState.icon;
      channelState.unread = false;
      focusTitleAfterRender = true;   // land focus on the rebuilt title (review MINOR-2)
      renderTopbar();                 // channel name lives in the title now
      bridge.send('ixian:selectChannel:' + ch.index);
      closeChannelSelector();
    });
    return b;
  }

  /* Channel selector — a top-anchored panel that slides DOWN from directly under
   * the topbar (Option A, Damir F5 2026-07-08). Opened by tapping the topbar
   * title; NOT a bottom sheet. Scrim + Esc close it. */
  /* focusables inside the open dropdown panel (rows arrive async) — mirrors overlay.js */
  function channelFocusables() {
    if (!channelDropdown) return [];
    const p = channelDropdown.querySelector('.chat-channel-panel');
    if (!p) return [];
    return [...p.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => !el.disabled && !el.hidden);
  }

  function closeChannelSelector() {
    if (channelKeydown) { document.removeEventListener('keydown', channelKeydown); channelKeydown = null; }
    if (channelFocusin) { document.removeEventListener('focusin', channelFocusin); channelFocusin = null; }
    if (!channelDropdown) return;
    const el = channelDropdown;
    channelDropdown = null;
    channelSheetBody = null;
    // restore focus to the title trigger — only if focus is ours to move (still
    // inside the closing overlay or dropped to body), matching overlay.js policy.
    const rf = channelReturnFocus; channelReturnFocus = null;
    const active = document.activeElement;
    if (rf && rf.isConnected && typeof rf.focus === 'function' &&
        (el.contains(active) || active === document.body)) {
      rf.focus({ preventScroll: true });
    }
    el.classList.remove('is-open');
    el.style.pointerEvents = 'none';   // exiting overlay: stale scrim must not catch clicks (review NIT)
    // let the slide-up finish before detaching (reduced-motion → transition:none,
    // transitionend still fires); safety timer covers the no-transition case
    let removed = false;
    const done = () => { if (removed) return; removed = true; el.remove(); };
    el.querySelector('.chat-channel-panel').addEventListener('transitionend', done, { once: true });
    setTimeout(done, 260);
  }

  function openChannelSelector() {
    if (!mode.isBot) return;
    closeChannelSelector();
    channelReturnFocus = document.activeElement;   // the topbar title trigger
    const s = window.SL || {};
    channelList = [];

    const overlay = document.createElement('div');
    overlay.className = 'chat-channel-overlay';
    const scrim = document.createElement('div');
    scrim.className = 'chat-channel-overlay__scrim';
    scrim.addEventListener('click', closeChannelSelector);

    const panel = document.createElement('div');
    panel.className = 'chat-channel-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('tabindex', '-1');
    panel.setAttribute('aria-label', s.channels || 'Channels');
    // anchor the panel directly under the topbar (+ any connectivity banner)
    panel.style.top = (topbarHost.offsetHeight + (warningBanner.offsetHeight || 0)) + 'px';

    const title = document.createElement('div');
    title.className = 'chat-channel-panel__title';
    title.textContent = s.channels || 'Channels';
    panel.append(title);

    channelSheetBody = document.createElement('div');
    channelSheetBody.className = 'chat-channel-list';
    const empty = document.createElement('p');
    empty.className = 'chat-channel-list__empty';
    empty.textContent = s.loading || 'Loading…';
    channelSheetBody.append(empty);
    panel.append(channelSheetBody);

    overlay.append(scrim, panel);
    document.body.append(overlay);
    channelDropdown = overlay;
    // Esc closes; Tab is trapped within the panel (mirrors overlay.js house style).
    channelKeydown = (e) => {
      if (e.key === 'Escape') { closeChannelSelector(); return; }
      if (e.key !== 'Tab' || !channelDropdown) return;
      const f = channelFocusables();
      if (f.length === 0) { e.preventDefault(); panel.focus({ preventScroll: true }); return; }
      const first = f[0], last = f[f.length - 1], act = document.activeElement;
      if (!f.includes(act)) { e.preventDefault(); (e.shiftKey ? last : first).focus({ preventScroll: true }); }
      else if (e.shiftKey && act === first) { e.preventDefault(); last.focus({ preventScroll: true }); }
      else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus({ preventScroll: true }); }
    };
    document.addEventListener('keydown', channelKeydown);
    // anything focused outside the open dropdown bounces back in (overlay.js parity)
    channelFocusin = (e) => {
      if (!channelDropdown || channelDropdown.contains(e.target)) return;
      (channelFocusables()[0] || panel).focus({ preventScroll: true });
    };
    document.addEventListener('focusin', channelFocusin);
    // trigger the slide-down on the next frame (so the -100% start state paints)
    requestAnimationFrame(() => { if (channelDropdown === overlay) overlay.classList.add('is-open'); });
    // move focus into the panel now (list is still loading → the panel itself)
    panel.focus({ preventScroll: true });

    // pull the list — C# answers with addChannelToSelector per channel
    bridge.send('ixian:populateChannelSelector');
  }

  /* —— message log —————————————————————————————————————————————————————————— */
  const box = document.getElementById('messages');

  /* model: id → record, in insertion order. A record is one of:
   *   kind 'text'    → { id, kind, direction, text, ts(ms), status, senderNick, senderAddress }
   *   kind 'file'    → { id, kind, direction, ts(ms), fileid, name, meta, fstate,
   *                      progress, senderNick, senderAddress }
   *   kind 'payment' → { id, kind, direction, ts(ms), title, amount, pstatus,
   *                      txid, enableView, senderNick, senderAddress }  (view-only)
   *   kind 'call'    → { id, kind, ts(ms), missed, label, duration }    (view-only)
   * order[] holds ids in timestamp order so inserts find their slot (the legacy
   * findOlderChat behaviour). row: id → DOM row element. fileIndex maps a
   * transfer's fileid → the owning message id, because updateFile(fileid,…)
   * references the transfer, not the message row (chat.js:1009). */
  const model = new Map();   // id → record
  const rows = new Map();    // id → row element
  let order = [];            // ids, kept timestamp-ascending
  const fileIndex = new Map(); // fileid → message id
  const txIndex = new Map();   // txid → message id (updateTransactionStatus keys by txid)
  const groupNicks = new Map(); // group sender address → resolved nick (updateGroupChatNicks)
  const groupRoster = new Map(); // roster key → { address, name, avatar } from ixian:loadContacts (full participant list)

  /* —— @-mention context (premium mentions #210). The bubble highlighter (#7) and
   * the composer picker (#6) share ONE source of member names: roster nicks
   * (loadContacts) + seen-sender nicks (groupNicks) + the 1:1 peer nick. `self`
   * keys = the LOCAL user's nick, which C# does NOT push to the chat today — read
   * from window.SL.SelfNick / SPIXI_ENV.selfNick when a trivial push lands
   * (be-cutover) so self-mention emphasis + the jump-to-me FAB (#8) light up; empty
   * until then (highlight-all + picker work regardless). Memoized; invalidated when
   * the name sources change. */
  let _mentionObj = null;
  let selfNickPushed = '';   // C13: the LOCAL user's nick, delivered by the setSelfNick bridge push
  function selfMentionKeys() {
    const sl = window.SL || {}, env = window.SPIXI_ENV || {};
    const out = [];
    if (selfNickPushed) out.push(selfNickPushed);       // C13 primary source (native bridge)
    if (sl.SelfNick) out.push(String(sl.SelfNick));     // demo/injection fallback
    if (env.selfNick) out.push(String(env.selfNick));
    return out;
  }
  function mentionNameList() {
    const set = new Set();
    for (const [, m] of groupRoster) { if (m && m.name) set.add(m.name); }
    for (const [, n] of groupNicks) { if (n) set.add(n); }
    for (const rec of model.values()) { if (rec && rec.senderNick && rec.senderNick !== rec.senderAddress) set.add(rec.senderNick); }  // seen senders (addThem)
    if (!mode.isMulti && identity.name) set.add(identity.name);   // 1:1 peer nick
    for (const s of selfMentionKeys()) set.add(s);                // my own nick is a valid @target too
    return [...set];
  }
  function mentionCtx() {
    if (!_mentionObj) _mentionObj = { names: mentionNameList(), self: selfMentionKeys() };
    return _mentionObj;
  }
  function invalidateMentions() { _mentionObj = null; }
  /* Members for the composer @-picker (#6): group/bot only (1:1 → []). Dedupe by
   * name. Sources: roster (loadContacts, has avatars) + resolved nicks (groupNicks)
   * + SEEN SENDERS from the loaded messages (model) — the last is essential so the
   * picker works on a chat you just opened, BEFORE chat-info/loadContacts has run
   * (Damir F5 2026-07-09: "@ in composer does nothing"). */
  function mentionMembers() {
    if (!mode.isMulti) return [];
    const by = new Map();
    for (const [, m] of groupRoster) { if (m && m.name && !by.has(m.name)) by.set(m.name, { name: m.name, address: m.address || '', avatar: m.avatar || null }); }
    for (const [addr, n] of groupNicks) { if (n && !by.has(n)) by.set(n, { name: n, address: addr || '', avatar: null }); }
    for (const rec of model.values()) {                       // seen senders (addThem) — before any roster load
      const nm = rec && rec.senderNick;
      if (nm && nm !== rec.senderAddress && !by.has(nm)) by.set(nm, { name: nm, address: rec.senderAddress || '', avatar: rec.avatar || null });
    }
    return [...by.values()];
  }
  // msg-ids I've liked THIS session. The bridge's addReactions sends only
  // key:count (no per-user flag — C5), so a fresh reaction can't tell the shell
  // that *I* reacted; tracking my own likes locally lets the pill show the
  // selected "you reacted" state immediately (Damir F5). Historical own-state
  // (a like from a previous session, re-pushed on load) still needs the C5 flag.
  const myLikes = new Set();
  let loadedMedia = new Set();   // remote-media URLs the user has loaded (persisted per peer, Damir 2026-07-08)
  // installed multi-user apps pushed by C# loadApps (addApp) — feed the attach
  // → "App invite" picker (legacy parity: legacy showed an app option in the
  // attach bar, picking one emits ixian:app:<id>, chat.js:1250 / onApp xaml:832).
  const chatApps = [];

  // Best-known display nick for a group sender: an explicit nick on the row wins,
  // else the last name resolved via updateGroupChatNicks for that address.
  const resolveNick = (address, nick) =>
    nick || (address && groupNicks.get(String(address))) || '';

  // True when a row has a REAL display nick (not empty, and not just its own
  // address echoed back as the nick) — nameless senders fall through to the
  // truncated + copyable address treatment (Damir F5, 2026-07-07).
  const senderHasNick = (rec) =>
    !!rec.senderNick && rec.senderNick !== rec.senderAddress;

  /* typing pill — appended while typing is on, removed on timeout / new message,
   * and always kept LAST (shell duty mirrored from the demo). */
  let typingRow = null;
  let typingTimer = null;
  let typingActive = false;   // peer is currently typing — survives full re-renders
  // re-append after a rebuild: renderLogNow's box.textContent='' detaches the pill,
  // so this must re-add it whenever typing is ACTIVE (audit M3: the old
  // parentNode===box guard could never re-append a just-cleared pill).
  function keepTypingLast() {
    if (typingActive && typingRow) box.append(typingRow);
  }
  function showTyping() {
    if (!typingRow) {
      typingRow = createTypingIndicator(mode.isMulti && identity.name ? { name: identity.name } : {});
    }
    typingActive = true;
    box.append(typingRow);
    box.scrollTop = box.scrollHeight;
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(hideTyping, 5000);  // legacy showUserTyping auto-hides after 5s
  }
  function hideTyping() {
    typingActive = false;
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    if (typingRow && typingRow.parentNode) typingRow.remove();
  }

  const nearBottom = () => box.scrollTop + box.clientHeight * 1.5 >= box.scrollHeight;

  /* status derivation from the legacy bool flags (chat.js updateMessage / addMe):
   *   errorSending → failed   (highest priority)
   *   read         → read
   *   confirmed    → delivered (peer received; "double check" in legacy)
   *   sent         → sent      (relayed; single check)
   *   else         → sending   (the legacy "default"/clock state) */
  function statusFrom({ sent, confirmed, read, errorSending }) {
    if (asBool(errorSending)) return 'failed';
    if (asBool(read)) return 'read';
    if (asBool(confirmed)) return 'delivered';
    if (asBool(sent)) return 'sent';
    return 'sending';
  }

  /* #63 grouping: consecutive same-direction rows within 90s form a run.
   * Recomputes position (single/first/middle/last) for the whole log — simplest
   * correct approach for an upsert model with out-of-order inserts + deletes.
   * Only TEXT rows group: a typed card (file/…) is always standalone and breaks
   * the run. In group chats a run also breaks when the sender changes, so every
   * participant keeps their own label + avatar. */
  const GROUP_WINDOW = 90000;
  function positionsFor(ids) {
    const pos = {};
    for (let i = 0; i < ids.length; i++) {
      const r = model.get(ids[i]);
      const prev = i > 0 ? model.get(ids[i - 1]) : null;
      const next = i < ids.length - 1 ? model.get(ids[i + 1]) : null;
      const cont = (a, b) => a && b
        && (a.kind || 'text') === 'text' && (b.kind || 'text') === 'text'
        && a.direction === b.direction
        && (a.senderAddress || '') === (b.senderAddress || '')
        && Math.abs(a.ts - b.ts) < GROUP_WINDOW;
      const withPrev = cont(prev, r);
      const withNext = cont(r, next);
      pos[ids[i]] = !withPrev && !withNext ? 'single'
        : !withPrev && withNext ? 'first'
        : withPrev && withNext ? 'middle'
        : 'last';
    }
    return pos;
  }

  function buildRow(rec, position) {
    if (rec.kind === 'file') return buildFileRow(rec);
    if (rec.kind === 'app') return buildAppRow(rec);
    if (rec.kind === 'payment') return buildPaymentRow(rec);
    if (rec.kind === 'call') return buildCallRow(rec);
    // A text message that is JUST a remote image/GIF URL → media tile (Damir
    // 2026-07-07: legacy parity, reopens #82 for remote media). The model stays
    // kind 'text' (menu/reactions still work — attachMessageMenu targets
    // .c-mbubble too), we only swap the RENDER.
    const media = mediaUrlOf(rec.text);
    if (media) return buildMediaRow(rec, media);
    const isSent = rec.direction === 'sent';
    return createMessageBubble({
      direction: isSent ? 'sent' : 'received',
      position,
      text: rec.text || '',
      timestamp: rec.ts,
      status: isSent ? rec.status : null,
      // group/bot chats: show the sender nick, or the raw ADDRESS (middle-truncated
      // + click-to-copy in the component) when there's no nick yet (Damir 2026-07-07).
      // A nameless sender is one with no nick AND one whose "nick" is really its
      // own address (some C# paths pass the address as the nick fallback) — both
      // must render truncated + copyable, not a full untruncated address label.
      sender: (!isSent && mode.isMulti) ? (senderHasNick(rec) ? rec.senderNick : (rec.senderAddress || null)) : null,
      senderIsAddress: (!isSent && mode.isMulti && !senderHasNick(rec) && !!rec.senderAddress),
      showAvatar: (!isSent && mode.isMulti),
      name: senderHasNick(rec) ? rec.senderNick : '',
      address: rec.senderAddress || '',
      avatar: rec.avatar || null,   // real per-sender photo (C# addThem avatar); gradient fallback

      // #99: in a NON-blind group (type 1) OR a bot chat (type 3), the sender
      // label + avatar open the member sheet — the ONLY way to reach a NAMED
      // sender's full address (nick labels aren't copyable; the address is)
      // (Damir F5 2026-07-08). Blind groups (type 2) hide identities → no tap.
      onSenderClick: (!isSent && (mode.type === 1 || mode.type === 3) && (rec.senderAddress || rec.senderNick))
        ? () => openMember(rec) : null,
      // resend has NO SingleChatPage case (dead verb) — gate the Retry affordance
      // behind cap('resend') so a failed message shows an HONEST "Not delivered"
      // (no dead button) until the BE cutover lands the resend case (audit M1).
      onRetry: (isSent && rec.status === 'failed' && bridge.cap('resend'))
        ? () => bridge.send('ixian:contextAction:resend:' + rec.id) : null,
      // URLs render as buttons; the shell confirms before opening externally
      // (#82 — P2P has no server, so no auto-load of remote content). Fixes
      // Damir F5: links were inert because no handler was wired.
      onLinkClick: (url) => confirmOpenLink(url),
      // @-mentions → highlighted spans (bold + tonal pill); self-mention stronger (#210)
      mention: mentionCtx(),
    });
  }

  /* —— remote media (GIF/image) tiles —————————————————————————————————————————
   * Damir 2026-07-07 (reopens #82, legacy parity, client-fetch — accepts that
   * loading a remote asset reveals the reader's IP to the host; flag for
   * BE/security sign-off): a message that is EXACTLY a direct image/GIF URL
   * renders as a tap-to-load tile (play button → fetch → full-screen viewer),
   * instead of the plain confirm-to-open link. Detection is conservative — a
   * direct media EXTENSION or a known direct-media host (media.tenor.com,
   * mediaN.giphy.com) — so a random page URL stays a link (a page URL wouldn't
   * load as an <img> anyway). Non-direct hosts fail-soft to the tile's retry
   * state. autoload stays OFF (a future "auto-load media" setting = legacy's
   * immediate load). NOTE: website OpenGraph meta cards are NOT wired — fetching
   * a site's meta from the WebView is CORS-blocked; that needs a proxy or
   * sender-composed meta (§82). */
  const MEDIA_EXT = /\.(gif|png|jpe?g|webp|bmp|avif)(\?|#|$)/i;
  function mediaUrlOf(text) {
    const t = (text == null ? '' : String(text)).trim();
    if (!/^https?:\/\/\S+$/i.test(t) || /\s/.test(t)) return null;   // must be a lone URL
    let u;
    try { u = new URL(t); } catch (_) { return null; }
    const host = u.hostname.toLowerCase();
    const directGifHost = /^media\d*\.(tenor|giphy)\.com$/.test(host) || /^c\.tenor\.com$/.test(host);
    if (MEDIA_EXT.test(u.pathname)) {
      return { url: t, kind: /\.gif(\?|#|$)/i.test(u.pathname) ? 'gif' : 'image' };
    }
    if (directGifHost) return { url: t, kind: 'gif' };
    return null;
  }
  function buildMediaRow(rec, media) {
    const isSent = rec.direction === 'sent';
    const label = media.kind === 'gif' ? 'GIF' : ((window.SL && window.SL.image) || 'Image');
    return createMediaBubble({
      direction: isSent ? 'sent' : 'received',
      kind: media.kind,
      src: media.url,
      alt: label,
      timestamp: rec.ts,
      gutter: mode.isMulti && !isSent,
      strings: window.SL || {},
      // legacy parity (Damir 2026-07-08): LOAD BY DEFAULT — or if the user loaded
      // this exact URL before (persisted), even when the global pref is off.
      autoload: mediaAutoloadOn() || loadedMedia.has(media.url),
      onOpen: () => openMediaViewer({ host: overlayHost, src: media.url, kind: media.kind, alt: label, strings: window.SL || {} }),
      // the tile grows from its placeholder box to the GIF's full size on load —
      // if the user was at the bottom, pull the log down; and remember this URL so
      // it auto-expands on re-entry even if autoload is later turned off.
      onLoad: () => { rememberLoadedMedia(media.url); if (nearBottom()) box.scrollTop = box.scrollHeight; },
    });
  }

  /* external-link confirm (#82): tapping an in-text link asks before leaving the
   * app / touching a remote URL, then opens via the legacy verb (dispatch 315). */
  function confirmOpenLink(url) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.openLinkTitle || 'Open external link?',
      body: url,
      host: overlayHost,
      actions: [
        { label: s.cancel || 'Cancel', type: 'text', autofocus: true },
        { label: s.openLink || 'Open', type: 'fill',
          onClick: () => bridge.send('ixian:openLink:' + url) },
      ],
    }));
  }

  /* file transfer row (chat.js addFile:904 / updateFile:1009).
   *   received + not started → 'offer'    → tap = ixian:acceptfile:<fileid>
   *   in transfer (0<p<100)  → 'progress' → no tap (disabled while downloading)
   *   complete               → 'complete' → tap = ixian:openfile:<fileid>
   * OUTGOING transfers now show progress too (Damir F5): the SENDER gets real
   * per-packet ticks (TransferManager.sendFileData → updateFile, 0→100+complete),
   * so a sent file shows the bar + "keep Spixi open" hint while transferring and
   * flips to complete (open button + success toast) when done — instead of the
   * legacy "own file = instantly complete". meta is empty (bridge sends no size). */
  function buildFileRow(rec) {
    return createFileBubble({
      direction: rec.direction,
      name: rec.name || '',
      meta: rec.meta || '',
      state: rec.fstate,
      progress: rec.progress || 0,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onAccept: () => bridge.send('ixian:acceptfile:' + rec.fileid),
      onOpen: () => bridge.send('ixian:openfile:' + rec.fileid),
    });
  }

  /* derive the file bubble state from the legacy addFile flags. */
  function fileStateFrom(me, progress, complete) {
    const p = Number(progress) || 0;
    if (asBool(complete) || p >= 100) return 'complete';
    // in-flight: OUTGOING shows send progress (bar + keep-open) — never 'offer'
    // (own files have no accept step); INCOMING = downloading vs a pending offer.
    if (asBool(me)) return 'progress';
    return p > 0 ? 'progress' : 'offer';
  }

  /* app invite/session card (chat.js addAppRequest:1174). state derives from the
   * stable localSender + appStatus signals; actions reuse the EXISTING verbs
   * (installApp / joinApp). C7(a): Decline is a LOCAL action — the invite card flips
   * to a terminal 'declined' state (persisted per peer, survives re-flush/re-open);
   * the sender is NOT notified (be-cutover C7 decline-notify is future BE). Only on
   * incoming invites (invite / missing states); own invites keep Cancel. */
  function buildAppRow(rec) {
    const incoming = rec.direction === 'received';
    const declined = incoming && declinedApps.has(String(rec.id));
    // C7(b) privacy: a REMOTE (http) app icon auto-fetches from the publisher on render
    // → reveals the receiver's IP before any install consent (#82). Gate it behind the
    // media-autoload pref (privacy-first) so the same opt-out that suppresses remote chat
    // media also suppresses the publisher icon → rocket fallback. Local icon paths
    // (installed apps) are never remote, so never gated.
    const rawIcon = rec.iconUrl || null;
    const remoteIcon = !!rawIcon && /^https?:\/\//i.test(rawIcon);
    const iconUrl = (remoteIcon && !mediaAutoloadOn()) ? null : rawIcon;
    return createAppBubble({
      name: rec.name || '',
      iconUrl: iconUrl,
      state: declined ? 'declined' : rec.astate,
      direction: rec.direction,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      // C7(b): only offer Get app when the invite actually carries an install URL —
      // otherwise installApp fires with an empty string and silently no-ops (C# fetch
      // rejects it). No URL → no dead button (the user can still Decline).
      onGet: rec.appInstallURL ? () => bridge.send('ixian:installApp:' + encodeURIComponent(rec.appInstallURL)) : undefined,
      onLaunch: () => bridge.send('ixian:joinApp:' + rec.appid),
      onJoin: () => bridge.send('ixian:joinApp:' + rec.appid),
      // in-session (already joined) → Resume reopens the app; joinApp re-shows the
      // minimized session. No End-session verb exists in the bridge → onEnd omitted
      // (createAppBubble gates it, so no dead button).
      onResume: () => bridge.send('ixian:joinApp:' + rec.appid),
      // local decline → persist + repaint as 'declined'; not shown once already declined
      onDecline: (incoming && !declined) ? () => declineApp(rec.id) : undefined,
    });
  }

  /* map the legacy addAppRequest flags → createAppBubble state.
   *   own invite (localSender)      → 'invited'    (Launch)
   *   incoming, app not installed   → 'missing'    (Get)
   *   incoming, session active      → 'in-session' (Resume) — C# 'Minimized' (xaml)
   *   incoming, installed, no session→ 'invite'    (Join) */
  function appStateFrom(localSender, appStatus) {
    if (asBool(localSender)) return 'invited';
    if (appStatus === 'Missing') return 'missing';
    if (appStatus === 'Minimized') return 'in-session';   // joined already → Resume, not Join again
    return 'invite';
  }

  /* payment card (chat.js addPaymentRequest / xaml.cs:1310,1361 · updates
   * 1648,1665). VIEW-ONLY in v1 (Damir 2026-07-07 interview-2 #5): an
   * informational card — amount + status badge + a Details link that opens the
   * NATIVE payment view (ixian:viewPayment). No inline Pay/Decline yet — that
   * needs a signed §8 path (SECURITY.md), deferred to BE cutover C3. Role is
   * sent|received by localSender, so the card renders NO action buttons; the
   * C#-localized `title` is passed verbatim because role alone can't tell a
   * REQUEST from a completed PAYMENT (the C1 enum gap — a best-effort interim). */
  function buildPaymentRow(rec) {
    const canView = rec.enableView && rec.txid;
    return createPaymentBubble({
      role: rec.direction === 'sent' ? 'sent' : 'received',
      title: rec.title || '',
      amount: rec.amount || '',
      status: rec.pstatus,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onDetails: canView ? () => bridge.send('ixian:viewPayment:' + rec.txid) : null,
    });
  }

  /* map the legacy FontAwesome status_icon → the redesigned card status enum.
   * C# emits only these three for payments (xaml.cs:1249/1265/1284/1325/1331/
   * 1336): fa-check-circle → completed · fa-exclamation-circle → declined ·
   * fa-clock (waiting/pending) → pending. */
  function paymentStatusFrom(statusIcon) {
    const s = String(statusIcon || '');
    if (s.indexOf('check') !== -1) return 'completed';
    if (s.indexOf('exclamation') !== -1) return 'declined';
    return 'pending';
  }

  /* call event card (chat.js addCall:1496). VIEW-ONLY best-effort (BE cutover
   * C4): the bridge conflates direction + no-answer/missed into one `declined`
   * flag plus a localized text blob. declined → render as "missed" so a call-
   * back is offered (via the existing ixian:call toggle); otherwise it was
   * answered → the (m:ss) duration is pulled out of the text. directionLabel is
   * left empty — it isn't recoverable from the localized string. */
  function buildCallRow(rec) {
    return createCallBubble({
      missed: rec.missed,
      direction: rec.direction || 'received',   // C4: outgoing calls finally sit right
      // pass the C#-localized label verbatim (duration stripped — shown
      // separately) so "No answer" (outgoing rang-out) isn't reconstructed as
      // "Missed voice call". Direction stays default until BE sends it (C4).
      title: rec.label || '',
      duration: rec.duration || '',
      timestamp: rec.ts,
      onCallBack: () => bridge.send('ixian:call'),
    });
  }

  /* reactions (chat.js addReactions:549). The bridge sends a ;-joined "key:count"
   * string. v1 renders LIKE reactions (heart + count), toggled via the existing
   * `like` contextAction (xaml.cs:1045). Tips carry a txid, not a display amount
   * (xaml.cs:979/1607), so we can't show the value — but we DO render a tip pill
   * (heart-handshake glyph + "Tipped", Damir F5) so a tip is visible on the
   * bubble. C5: the bridge's trailing own arg (";"-joined keys I reacted with) is
   * authoritative; myLikes stays as the optimistic/old-exe fallback. */
  function parseReactions(str, id, ownStr) {
    const reactions = [];
    let tipCount = 0;
    const ownKeys = new Set(String(ownStr || '').split(';').filter(Boolean));
    // C5: when the bridge supplies the own-keys arg (new exe) it is AUTHORITATIVE —
    // honor it exclusively so a stale local myLikes can't override an authoritative
    // negative (e.g. a reaction removed on another device). myLikes is used ONLY on
    // old exes that don't send the arg (ownStr === undefined).
    const likedByMe = ownStr !== undefined ? ownKeys.has('like') : myLikes.has(String(id));
    for (const tok of String(str || '').split(';')) {
      if (!tok) continue;
      const parts = tok.split(':');
      const count = parseInt(parts[parts.length - 1], 10) || 0;
      if (count <= 0) continue;
      if (tok.startsWith('like')) reactions.push({ emoji: '❤️', count, own: likedByMe });
      else if (tok.startsWith('tip')) tipCount += count;   // txid, not amount → count only
    }
    const sl = window.SL || {};
    const tip = tipCount > 0
      ? (tipCount > 1 ? (sl.tipped || 'Tipped') + ' ×' + tipCount : (sl.tipped || 'Tipped'))
      : '';
    return { reactions, tip };
  }

  /* React to a message with a like (the ONE reaction the bridge supports —
   * xaml.cs:1045). Records my like locally for the own-state (C5 interim), emits
   * the toggle, and optimistically reflects it on the row so the pill shows
   * selected immediately (C#'s addReactions re-emit lands the authoritative
   * count next). Shared by the context-menu React action AND tapping a pill. */
  function reactToMessage(id) {
    id = String(id);
    myLikes.add(id);
    saveLikes();                                       // persist own-state across re-flushes (C5 interim)
    bridge.send('ixian:contextAction:like:' + id);
    const rec = model.get(id);
    if (!rec) return;
    rec.reactions = rec.reactions || [];
    const heart = rec.reactions.find((r) => r.emoji === '❤️');
    if (heart) heart.own = true;                       // count updates when C# responds
    else rec.reactions.push({ emoji: '❤️', count: 1, own: true }); // optimistic first like
    const row = rows.get(id);
    if (row) applyRowReactions(rec, row, true);
  }

  /* apply a record's stored reactions to its live row — called from renderLog so
   * pills survive re-renders, and from the addReactions handler for a live pop. */
  function applyRowReactions(rec, row, animate) {
    const hasReactions = rec.reactions && rec.reactions.length;
    if (!hasReactions && !rec.tip) return;
    applyReactions(row, {
      reactions: rec.reactions || [],
      tip: rec.tip || '',
      animate: !!animate,
      host: box,
      onToggle: () => reactToMessage(rec.id),
    });
  }

  /* —— message context menu (long-press + right-click) ————————————————————————
   * Attached to TEXT rows in renderLogNow. Actions map to existing bridge verbs;
   * Reply/Edit are §8-gated behind a capability flag (OFF until BE), so they
   * never render today. Non-text cards keep their own inline actions in v1. */
  const overlayHost = document.body;
  function wireMenu(rec, row) {
    // Enable the context menu on CONTENT rows. Text gets copy/edit; file/payment/
    // app cards get react + tip + delete too (Damir: "file/payment can't react or
    // tip — change that"). react/tip/delete map to the same bridge verbs by msg id
    // regardless of kind (the reaction pill anchors on .c-tcard/.c-fbubble too);
    // the menu auto-hides Copy (no text) and Edit (not own text). Call logs are
    // excluded — reacting/tipping a call record is nonsensical and they carry
    // their own call-back affordance.
    const kind = rec.kind || 'text';
    if (kind === 'call') return;
    const isSent = rec.direction === 'sent';
    attachMessageMenu(row, {
      host: overlayHost,
      text: rec.text || '',
      reactions: ['❤️'],   // the bridge only persists "like" (C8: emoji reactions need a core change — be-cutover C8)
      capabilities: {
        reply: bridge.cap('reply'),                       // §8-gated, OFF until BE (#25)
        edit: bridge.cap('edit') && isSent && !!rec.text, // own text only
        tip: (!isSent && !mode.isBot && mode.type !== 2), // C# blocks tip in bots + blind groups (xaml:942)
        report: mode.isBot,                               // C# report is bots-only (xaml:1026)
        select: false,                                    // multi-select not wired in the shell yet
      },
      onAction: (action, arg) => onMenuAction(action, rec),
    });
  }

  function onMenuAction(action, rec) {
    const id = rec.id;
    if (action === 'react') { reactToMessage(id); return; }
    if (action === 'copy') {
      if (navigator.clipboard && rec.text) navigator.clipboard.writeText(rec.text).catch(() => {});
      return;
    }
    if (action === 'delete') { bridge.send('ixian:contextAction:deleteMessage:' + id); return; }
    if (action === 'report') { bridge.send('ixian:contextAction:report:' + id); return; }
    if (action === 'tip') { openTipForMessage(rec); return; }
    // reply/edit are capability-gated off → never reached in v1
    dbg('menu action (gated/unhandled)', action);
  }

  /* member identity sheet (#99) — sender tap in a non-blind group OR a bot chat
   * (Damir F5 2026-07-08: a NAMED bot/group sender had no way to reveal its
   * address). Shows the FULL address (nick is spoofable), a contact-request
   * path, and admin kick/ban when I'm the group admin (bots have no admin →
   * just identity + copy + request). C# runs its own confirm for kick/ban
   * (displaySpixiAlert). relation defaults 'none' — the chat shell has no
   * contact roster, so it can't tell if the member is already a contact (BE
   * gap #99/§9); the request verb is idempotent-ish on the C# side. */
  function openMember(rec) {
    if (!rec.senderAddress && !rec.senderNick) return;
    const s = window.SL || {};
    const actions = [];
    if (mode.admin && rec.senderAddress) {
      actions.push({ label: s.removeFromGroup || 'Remove from group', destructive: true,
        onClick: () => bridge.send('ixian:kick:' + rec.senderAddress) });
      actions.push({ label: s.banFromGroup || 'Ban from group', destructive: true,
        onClick: () => bridge.send('ixian:ban:' + rec.senderAddress) });
    }
    openMemberSheet({
      host: overlayHost,
      member: { name: rec.senderNick || '', address: rec.senderAddress || '', avatar: rec.avatar || null },
      blind: false,
      relation: 'none',
      onRequest: rec.senderAddress
        ? () => bridge.send('ixian:sendContactRequest:' + rec.senderAddress) : null,
      actions,
      strings: s,
    });
  }

  /* —— group / bot chat-info takeover (#189-follow: header tap on a multi chat) ——
   * Mounts a full-viewport c-chat-info panel OVER the conversation (not a page
   * nav — SingleChatPage owns the group verbs). onBack closes it back to the
   * chat; it never emits ixian:back (that would pop the whole SingleChatPage).
   *
   * Members are BEST-EFFORT: there is no full-roster push from SingleChatPage, so
   * the list is built from senders we've SEEN (received rows) + resolved group
   * nicks (updateGroupChatNicks). A true roster + member count is a BE ask.
   * Blind groups (type 2) hide addresses. Admin (mode.admin) injects Kick/Ban via
   * the component's built-in member sheet; contact-request + kick/ban reuse the
   * existing verbs. */
  let chatInfoTakeover = null;
  let chatInfoOpen = false;

  // Members: authoritative full roster (ixian:loadContacts) enriched with senders
  // SEEN in loaded history (fresher nick/photo, and covers not-yet-synced members).
  function collectGroupMembers() {
    const byKey = new Map();     // unique key → { name, address, avatar }
    // 1) full participant roster (blind entries keyed by nick, real ones by address)
    for (const [key, m] of groupRoster) {
      byKey.set(key, { name: m.name || '', address: m.address || '', avatar: m.avatar || null });
    }
    // 2) enrich from received-message senders (skip blind-masked addresses)
    for (const rec of model.values()) {
      if (rec.direction === 'received' && rec.senderAddress && rec.senderAddress !== '[Unknown]') {
        const prev = byKey.get(rec.senderAddress) || { name: '', address: rec.senderAddress, avatar: null };
        byKey.set(rec.senderAddress, {
          name: prev.name || (senderHasNick(rec) ? rec.senderNick : ''),
          address: rec.senderAddress,
          avatar: prev.avatar || rec.avatar || null,   // real per-sender photo (C# addThem avatar)
        });
      }
    }
    // 3) resolved nicks
    for (const [addr, nick] of groupNicks) {
      if (!addr || addr === '[Unknown]') continue;
      const prev = byKey.get(addr) || { name: '', address: addr, avatar: null };
      byKey.set(addr, { name: prev.name || (nick || ''), address: addr, avatar: prev.avatar });
    }
    return [...byKey.values()];
  }

  function buildChatInfo() {
    const s = window.SL || {};
    const infoKind = mode.type === 3 ? 'bot' : 'group';   // bot channels reuse the members/notifications surface
    return createChatInfo({
      kind: infoKind,
      context: 'chat',
      name: identity.name || identity.address || '',
      avatar: identity.avatar || null,       // real 1:1/bot/group photo (C# addThem/setAvatar); gradient fallback
      avatarSeed: identity.address || identity.name || '',
      members: collectGroupMembers(),        // best-effort; memberCount falls back to members.length
      blind: mode.type === 2,                // blind group: identities hidden
      notifications: mode.notifications,
      // groups/bots have en/disableNotifications; admin gates kick/ban. media +
      // selfDestruct stay OFF (no bridge verb, §9).
      capabilities: { notifications: true, admin: mode.admin },
      host: overlayHost,                     // member sheet + kick/ban/leave confirms attach to body (above the takeover)
      strings: s,
      onBack: closeChatInfo,                 // close the takeover — NOT ixian:back

      // notifications toggle → the group/bot mute verbs. Fire-and-forget: the
      // bridge gives no ack, so resolve optimistically (component keeps the state).
      onNotifications: (next, ctrl) => {
        mode.notifications = next;
        bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
        ctrl.done();
      },

      // member sheet (component-owned): contact request + admin kick/ban. Reuses
      // the existing verbs; C# runs its own confirm for kick/ban on receipt.
      onContactRequest: (m) => { if (m && m.address) bridge.send('ixian:sendContactRequest:' + m.address); },
      onMemberAction: (action, m, ctrl) => {
        if (m && m.address && (action === 'kick' || action === 'ban')) bridge.send('ixian:' + action + ':' + m.address);
        ctrl.done();
      },

      // destructive — leave group (component renders this for kind 'group' only;
      // bots have no in-chat leave verb → no destructive row for a bot, flagged).
      onLeave: (ctrl) => { bridge.send('ixian:leave'); ctrl.done(); },
    });
  }

  let chatInfoRefreshQueued = false;
  function scheduleChatInfoRefresh() {   // coalesce the loadContacts roster burst → one rebuild
    if (chatInfoRefreshQueued) return;
    chatInfoRefreshQueued = true;
    requestAnimationFrame(() => { chatInfoRefreshQueued = false; refreshChatInfo(); });
  }

  function openChatInfo() {
    if (chatInfoOpen) return;
    chatInfoOpen = true;
    groupRoster.clear();                 // fresh roster per open (avoids stale/removed members accumulating)
    bridge.send('ixian:loadContacts');   // pull the full participant roster → addContact per member
    chatInfoTakeover = document.createElement('div');
    chatInfoTakeover.className = 'chat-info-takeover';
    chatInfoTakeover.append(buildChatInfo());
    document.body.append(chatInfoTakeover);
  }
  function closeChatInfo() {
    chatInfoOpen = false;
    if (chatInfoTakeover) { chatInfoTakeover.remove(); chatInfoTakeover = null; }
  }
  // Rebuild an OPEN takeover in place (e.g. setChatMode arrived after opening, or
  // new senders were seen). Cheap; the takeover is a shallow snapshot.
  function refreshChatInfo() {
    if (!chatInfoOpen || !chatInfoTakeover) return;
    chatInfoTakeover.replaceChildren(buildChatInfo());
  }

  /* tip: open the amount sheet (no balance — C# runs the real balance check +
   * native confirm), then emit ixian:contextAction:tip:<id>:<amount>. Recipient
   * is DISPLAY-only (C# resolves the real payee from the msg id). */
  function openTipForMessage(rec) {
    openTipSheet({
      message: { id: rec.id, excerpt: rec.text || undefined },
      recipient: {
        name: rec.senderNick || identity.name || identity.address || '',
        address: rec.senderAddress || identity.address || '',
      },
      balance: null,
      host: overlayHost,
      onTip: (payload, ctrl) => {
        bridge.send('ixian:contextAction:tip:' + rec.id + ':' + payload.amount);
        ctrl.done();   // the tip pill / wallet tx land via the bridge (addReactions)
      },
    });
  }

  /* composer ⊕ → attach sheet (tile grid) replacing the legacy native attach bar.
   *   file    → ixian:sendfile            (native picker)
   *   photo/gif → ixian:sendmedia         (gated on the media capability, #81)
   *   pay     → ixian:send  (onSendIxi)   1:1 only — native compose + sign
   *   request → ixian:request (onRequestIxi) 1:1 only
   * App-invite tile is hidden (no SingleChatPage invite verb); Pay/Request are
   * hidden in groups/bots (C# rejects them there). */
  function openAttach() {
    openAttachSheet({
      host: overlayHost,
      media: bridge.cap('media'),   // Photo/GIF appear only when the BE image standard lands (#81)
      apps: !mode.isBot,            // App invite: onApp is blocked in bots (xaml:834); 1:1 + groups OK
      payments: mode.type === 0,    // 1:1 only
      strings: window.SL || {},
      onAction: (id) => {
        if (id === 'file') bridge.send('ixian:sendfile');
        else if (id === 'photo' || id === 'gif') bridge.send('ixian:sendmedia');
        else if (id === 'pay') bridge.send('ixian:send');
        else if (id === 'request') bridge.send('ixian:request');
        else if (id === 'app') openAppPicker();
      },
    });
  }

  /* App-invite picker (legacy parity): the attach "App invite" tile opens a
   * sheet of installed multi-user apps (captured from loadApps/addApp); picking
   * one emits ixian:app:<id> → onApp starts an app session with the peer
   * (xaml:832). Empty state when none are installed. */
  function openAppPicker() {
    const s = window.SL || {};
    const content = document.createElement('div');
    content.className = 'chat-app-picker';
    if (!chatApps.length) {
      const empty = document.createElement('p');
      empty.className = 'chat-app-picker__empty';
      empty.textContent = s.noApps || 'No apps installed yet.';
      content.append(empty);
    } else {
      for (const app of chatApps) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chat-app-picker__item';
        if (window.SpixiIcons && window.SpixiIcons.icon) b.append(window.SpixiIcons.icon('rocket', { size: 20 }));
        const nm = document.createElement('span');
        nm.className = 'chat-app-picker__name';
        nm.textContent = app.name;
        b.append(nm);
        b.addEventListener('click', () => { closeSheet(sheet); bridge.send('ixian:app:' + app.id); });
        content.append(b);
      }
    }
    const sheet = createSheet({ title: s.inviteApp || 'Invite an app', content, host: overlayHost, strings: s });
    openSheet(sheet);
  }

  /* incoming contact-request pane (#109) — showContactRequest fires when the
   * peer's requestAdd lands and they're not yet approved (xaml:1196). Only "1"
   * is sent (no identity), so we populate from the header identity. Accept →
   * ixian:accept (onAcceptFriendRequest); Decline → ixian:undorequest (the only
   * decline path SingleChatPage offers — removes the pending friend + leaves).
   * Sits above the composer; C#'s re-flush after accept clears it (clearMessages). */
  let requestPane = null;
  function removeRequestPane() { if (requestPane) { requestPane.remove(); requestPane = null; } }
  function showRequestPane() {
    removeRequestPane();
    requestPane = document.createElement('div');
    requestPane.className = 'chat-request-pane';
    requestPane.append(createContactRequest({
      name: identity.name || '', address: identity.address || '',
      timestamp: Date.now(), host: overlayHost, strings: window.SL || {},
      onAccept: () => bridge.send('ixian:accept'),
      onDecline: () => bridge.send('ixian:undorequest'),
    }));
    document.getElementById('chat-composer').before(requestPane);
  }

  /* secure-chat / privacy notice — ALWAYS the first item in the log, mirroring
   * the legacy `private-messages-note` (chat.js clearMessages:1404). Marks the
   * conversation as end-to-end encrypted + P2P. Copy is i18n-overridable via
   * window.SL; "How it works" opens the security page through the legacy verb. */
  const SECURE_LINK = 'https://www.spixi.io/help-center.html';
  function createSecureNotice() {
    const s = window.SL || {};
    return createSystemNotice({
      title: s.secureNoticeTitle || 'Encrypted. Peer-to-peer. Yours alone.',
      text: s.secureNoticeText || 'Messages go straight from device to device, sealed with post-quantum encryption. No server carries or stores them — every message exists only with you two, nowhere else.',
      linkLabel: s.secureNoticeLink || 'How it works',
      onLink: () => bridge.send('ixian:openLink:' + SECURE_LINK),
    });
  }

  /* full re-render of the log from the model — used after any insert/delete so
   * grouping + timestamp order stay correct. Rebuilds date separators too.
   * Call the coalesced `renderLog()` from handlers; `renderLogNow()` is the
   * synchronous rebuild (also used for the first paint). */
  function renderLogNow() {
    invalidateMentions();   // rebuild the mention name list from the CURRENT model each render → seen senders (addThem) are always included (review m1)
    const scrollWasAtBottom = nearBottom();
    // Build the whole log into a DETACHED fragment, then swap it in with ONE
    // replaceChildren — the live #messages box is NEVER momentarily empty, so a
    // paint can't catch a blank log mid-rebuild (Damir 2026-07-07 flicker). Also
    // removes the boot spinner (it's a child of box) on the first render.
    const frag = document.createDocumentFragment();
    rows.clear();
    frag.append(createSecureNotice());   // privacy note pinned at the top of history
    const pos = positionsFor(order);
    let lastDay = null;
    for (const id of order) {
      const rec = model.get(id);
      const day = new Date(rec.ts).toDateString();
      if (day !== lastDay) { frag.append(createDateSeparator(rec.ts)); lastDay = day; }
      const row = buildRow(rec, pos[id]);
      row.dataset.msgid = id;
      rows.set(id, row);
      frag.append(row);
      applyRowReactions(rec, row, false);  // re-attach pills after a rebuild
      wireMenu(rec, row);                  // long-press / right-click context menu
    }
    box.replaceChildren(frag);             // atomic swap — no empty intermediate state
    keepTypingLast();
    if (scrollWasAtBottom) box.scrollTop = box.scrollHeight;
    firstRenderDone = true;                 // boot spinner is now gone
    if (typeof updateMentionFab === 'function') updateMentionFab();  // refresh @ jump FAB (#8)
  }

  /* Render scheduling — two regimes:
   * (1) NORMAL (post-load): coalesce into one animation frame so a burst of
   *     small updates (status ticks, a new message) rebuilds at most once/frame.
   * (2) LOAD BURST: on open C# streams the WHOLE history — clearMessages →
   *     insertMessage×N → onChatScreenLoaded (SingleChatPage.xaml.cs:1110/588).
   *     Each EvaluateJavaScriptAsync runs on a LATER frame, so even the rAF
   *     coalescer rebuilt+swapped the growing log many times as rows streamed
   *     in → the log visibly "filled in" / flickered (Damir 2026-07-07, chats
   *     with history). During a burst we SUPPRESS every render (the model just
   *     accumulates) and paint ONCE at onChatScreenLoaded — so the user sees the
   *     boot spinner, then the finished conversation in a single paint. A
   *     trailing safety timer force-finishes the burst if that signal never
   *     arrives (other loadMessages call sites, robustness). */
  let renderQueued = false;
  let bursting = false;
  let burstSafety = 0;
  let firstRenderDone = false;   // gates the boot spinner → first real paint
  function beginBurst() {
    bursting = true;
    armBurstSafety();
  }
  function armBurstSafety() {
    clearTimeout(burstSafety);
    burstSafety = setTimeout(endBurstAndRender, 250);   // fallback if onChatScreenLoaded is missing
  }
  function endBurstAndRender() {
    clearTimeout(burstSafety);
    if (!bursting) return;
    bursting = false;
    renderLogNow();
  }
  function renderLog() {
    if (bursting) { armBurstSafety(); return; }   // suppress during the load burst
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderLogNow(); });
  }

  /* insert (or move) an id into `order` keeping timestamp-ascending; stable for
   * equal timestamps (append after equals → matches arrival order). */
  function orderInsert(id) {
    order = order.filter((x) => x !== id);
    const ts = model.get(id).ts;
    let i = order.length;
    while (i > 0 && model.get(order[i - 1]).ts > ts) i--;
    order.splice(i, 0, id);
  }

  /* UPSERT a text row. flags = { sent, confirmed, read, paid, errorSending }. */
  function upsertText(id, text, direction, ts, flags, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'text', direction, senderNick: '', senderAddress: '' };
    if (text !== undefined && text !== null) rec.text = String(text);
    if (direction) rec.direction = direction;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
      if (extra.avatar !== undefined) rec.avatar = extra.avatar || null;
    }
    rec.status = statusFrom(flags || {});
    model.set(id, rec);
    orderInsert(id);
    hideTyping();  // any new/updated message clears the typing pill (legacy addText → hideUserTyping)

    if (!existing) {
      renderLog();  // new row → re-render so grouping + date separators are correct
      return;
    }
    // status-only update on an existing SENT row → surgical tick (no flicker).
    // failed restructures the row, so re-render instead.
    if (rec.direction === 'sent' && rec.status !== 'failed') {
      const row = rows.get(id);
      if (row) { setMessageStatus(row, rec.status); return; }
    }
    renderLog();
  }

  /* CREATE a file transfer row (legacy addFile). Keyed by message id like text
   * rows; fileIndex maps the transfer's fileid → this id so updateFile finds it. */
  function upsertFile(id, ts, dir, fileid, name, fstate, progress, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'file', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'file';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (fileid != null) { rec.fileid = String(fileid); fileIndex.set(String(fileid), id); }
    if (name != null) rec.name = String(name);
    rec.fstate = fstate;
    rec.progress = Number(progress) || 0;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE an app invite/session row (legacy addAppRequest). Static once added
   * (no updateApp verb). appid drives joinApp; appInstallURL drives installApp. */
  function upsertApp(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'app', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'app';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.appid !== undefined) rec.appid = extra.appid;
