<!DOCTYPE html>

<title>Spixi</title>
<style>
  /* Paint the screen surface IMMEDIATELY — before tokens.css/base.css load and
     before the JS bundle parses — so entering a chat doesn't flash an empty
     "blank" pane while the shell boots (Damir F5). Values mirror --surface-screen
     (neutral-10 / neutral-900); tokens.css takes over once loaded. */
  html { background: #f9fafb; }
  @media (prefers-color-scheme: dark) { html { background: #13171b; } }

<!-- overlay surfaces wired in the chat depth batch (#188): c-sheet/c-modal live
     in overlay.css (above); these style their CONTENT — without them the attach
     sheet / tip sheet / member sheet / banner / request pane render unstyled. -->
<link rel="stylesheet" href="../styles/components/attach-sheet.css">
<link rel="stylesheet" href="../styles/components/tip-sheet.css">

<style>
  /* Production chat shell: fill the WebView (no demo phone frame). The chat
     topbar pins, the message log (c-chat-canvas → .messages) scrolls, the
     composer pins to the bottom. Element ids/classes MATCH the demo so the
     component CSS applies unchanged. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #chat-topbar { flex: none; }
  .c-banner { flex: none; }              /* connectivity strip pins under the topbar */
  .chat-request-pane { flex: none; }     /* incoming-request pane pins above the composer */
  .c-chat-canvas { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* Messages sit at the BOTTOM (adjacent to the composer) and grow upward — the
     natural chat flow. The secure notice floats CENTERED in the free space above
     them: its own two auto-margins split that space equally above + below it, so
     on a new/empty chat it lands dead-center, and as messages fill in below it
     the notice rises like a normal bubble. When the log overflows the auto-
     margins collapse to 0 → notice pins to the top of history, log scrolls,
     newest at the bottom (Damir 2026-07-07). */
  #messages { flex: 1; min-height: 0; padding-bottom: var(--spacing-4); display: flex; flex-direction: column; }
  #messages > .c-sysnotice { margin-top: auto; margin-bottom: auto; }
  #chat-composer { flex: none; }
  /* boot spinner — fills the log while the JS bundle parses + C# pushes the
     conversation; the first renderLogNow() clears #messages and removes it. */
  .chat-boot { flex: 1; display: flex; align-items: center; justify-content: center; }
  .chat-boot__spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border-subtle, rgba(128,128,128,0.22));
    border-top-color: var(--icon-accent, #1892ce);
    animation: chat-boot-spin 0.8s linear infinite;
  }
  @keyframes chat-boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .chat-boot__spinner { animation: none; } }
  /* attach → App-invite picker (inside a c-sheet) */
  .chat-app-picker { display: flex; flex-direction: column; gap: var(--spacing-1, 4px); }
  .chat-app-picker__item {
    display: flex; align-items: center; gap: var(--spacing-3, 12px);
    padding: var(--spacing-3, 12px); border: 0; border-radius: var(--radius-md, 12px);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer; width: 100%;
  }
  .chat-app-picker__item:hover { background: var(--interactive-hover, rgba(128,128,128,0.12)); }
  .chat-app-picker__name { font-weight: 600; }
  .chat-app-picker__empty { padding: var(--spacing-4, 16px); text-align: center; color: var(--text-neutral-03, #888); }
</style>
</head>
<body>
  <div id="chat-topbar"></div>
  <div class="c-chat-canvas">
    <!-- tabindex: keyboard users must be able to scroll text-only history -->
    <div class="messages u-scroll" id="messages" role="log" aria-label="Messages" tabindex="0"><div class="chat-boot" aria-hidden="true"><span class="chat-boot__spinner"></span></div></div>
  </div>
  <div id="chat-composer"></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production chat shell — the redesigned single-chat surface wired to the REAL
   * C# MAUI bridge (native.js in the bundle). SingleChatPage.xaml.cs pushes the
   * conversation via executeUiCommand(fnRef, b64…) against the page globals
   * registered below; the composer + back button emit legacy `ixian:` commands
   * via bridge.send.
   *
   * Contract source of truth: Spixi/Pages/Chat/SingleChatPage.xaml.cs +
   * Resources/Raw/html/js/chat.js (legacy). The 1:1 text conversation is wired
   * fully (create + status upsert + delete + typing + clear). Everything else is
   * a safe no-op stub so C#'s dispatch never console.errors.
   *
   * CONTRACT NOTES (verified against SingleChatPage.xaml.cs, line refs):
   *  · Text CREATE arrives via addMe / addThem (chat.js insertMessage → prefix,
   *    xaml.cs:1460), 12 args:
   *      addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending)
   *      addThem(id, address, nick, avatar, text, time)
   *    (legacy addMe/addThem share the addText 7-arg shape; addThem is called
   *    with only 6 by C#, so args 7-11 are undefined for incoming rows.)
   *  · Text STATUS UPDATE arrives via updateMessage (chat.js:1035, xaml.cs:1624):
   *      updateMessage(id, message, sent, confirmed, read, paid, errorSending)
   *    Legacy updateMessage ONLY mutates an existing msg_<id> row (returns early
   *    if unknown). To be robust here it is an UPSERT: create if the id is
   *    unknown (using `message` as the text + `sent` for direction), else update
   *    the existing row's status + text.
   *  · timestamps are UNIX SECONDS (legacy addText does `new Date(time*1000)`);
   *    the redesigned bubbles want ms → multiply.
   *  · All bool args are the .NET "True"/"False" strings.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, createMessageBubble, createDateSeparator,
    createComposer, clearComposer, createTypingIndicator, createScrollToLatest,
    setMessageStatus, removeMessage,
    createFileBubble, setFileProgress,
    createMediaBubble, setMediaSrc, openMediaViewer,
    createPaymentBubble, createCallBubble,
    createAppBubble, createSystemNotice,
    attachMessageMenu, openTipSheet, openMemberSheet, openAttachSheet,
    createModal, openModal, showToast,
    createWarningBanner, setWarning, createContactRequest,
    createSheet, openSheet, closeSheet,
    addReactions: applyReactions,   // component free-fn; aliased — the bridge handler below is also `addReactions`
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;

  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[chat-shell stub]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;
  /* legacy sends Unix SECONDS; redesigned bubbles compare against Date.now() (ms) */
  const toMs = (t) => { let n = Number(t) || 0; if (n && n < 1e12) n *= 1000; return n; };

  /* —— chat mode (setChatMode type: 0 = 1:1, 1 = group, 2 = blind group,
   *    3 = bot — chat.js setChatMode / xaml.cs:526,549). We keep it so the
   *    header + grouping know whether to show sender labels/avatars. ————————— */
  const mode = { type: 0, isBot: false, isMulti: false, admin: false };

  /* —— header identity model. setNickname / setOnlineStatus mutate this; the
   *    topbar is rebuilt so name + presence sub-line stay live. ——————————————— */
  const identity = { name: '', sub: '', address: '', online: false, avatar: null };

  /** Resolve a C# avatar arg to an <img> src, or null for the gradient fallback
   *  (same rule as the home shell): real on-disk path → src (normalize
   *  backslashes); the C# default placeholders → null = deterministic gradient.
   *  The avatar component has an onerror→gradient fallback, so a non-resolving
   *  path degrades cleanly. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }
  let callVisible = false;   // showCallButton reveals the topbar phone action (1:1, peer reachable)

  const topbarHost = document.getElementById('chat-topbar');
  function renderTopbarNow() {
    topbarHost.textContent = '';
    const s = window.SL || {};
    topbarHost.append(createTopbar({
      variant: 'chat',
      identity: {
        name: identity.name || identity.address || '',
        sub: identity.sub || '',
        address: identity.address || identity.name || '',
        online: identity.online,
        avatar: identity.avatar || null,
      },
      // Header tap → chat info. No dedicated redesigned takeover is wired in v1;
      // ixian:details is the legacy verb SingleChatPage understands.
      onIdentity: () => bridge.send('ixian:details'),
      onBack: () => bridge.send('ixian:back'),
      // start a voice call — revealed by showCallButton (C# gates availability);
      // ixian:call toggles initiate/hang-up (xaml:136).
      actions: callVisible
        ? [{ icon: 'phone', label: s.call || 'Call', onClick: () => bridge.send('ixian:call') }]
        : [],
    }));
  }
  // Coalesce topbar rebuilds too: on open C# fires setNickname + setOnlineStatus
  // (+ onChatScreenReady) in quick succession, each tearing down + rebuilding the
  // header — same flicker class as the log. Batch to one frame.
  let topbarQueued = false;
  function renderTopbar() {
    if (topbarQueued) return;
    topbarQueued = true;
    requestAnimationFrame(() => { topbarQueued = false; renderTopbarNow(); });
  }
  renderTopbarNow();  // synchronous first paint

  /* connectivity banner (#59) — mounts directly under the top bar; showWarning
   * opens/updates it, empty text collapses it (bridge showWarning, xaml:1746). */
  const warningBanner = createWarningBanner({ strings: window.SL || {} });
  topbarHost.after(warningBanner);

  /* —— message log —————————————————————————————————————————————————————————— */
  const box = document.getElementById('messages');

  /* model: id → record, in insertion order. A record is one of:
   *   kind 'text'    → { id, kind, direction, text, ts(ms), status, senderNick, senderAddress }
   *   kind 'file'    → { id, kind, direction, ts(ms), fileid, name, meta, fstate,
   *                      progress, senderNick, senderAddress }
   *   kind 'payment' → { id, kind, direction, ts(ms), title, amount, pstatus,
   *                      txid, enableView, senderNick, senderAddress }  (view-only)
   *   kind 'call'    → { id, kind, ts(ms), missed, label, duration }    (view-only)
   * order[] holds ids in timestamp order so inserts find their slot (the legacy
   * findOlderChat behaviour). row: id → DOM row element. fileIndex maps a
   * transfer's fileid → the owning message id, because updateFile(fileid,…)
   * references the transfer, not the message row (chat.js:1009). */
  const model = new Map();   // id → record
  const rows = new Map();    // id → row element
  let order = [];            // ids, kept timestamp-ascending
  const fileIndex = new Map(); // fileid → message id
  const txIndex = new Map();   // txid → message id (updateTransactionStatus keys by txid)
  const groupNicks = new Map(); // group sender address → resolved nick (updateGroupChatNicks)
  // msg-ids I've liked THIS session. The bridge's addReactions sends only
  // key:count (no per-user flag — C5), so a fresh reaction can't tell the shell
  // that *I* reacted; tracking my own likes locally lets the pill show the
  // selected "you reacted" state immediately (Damir F5). Historical own-state
  // (a like from a previous session, re-pushed on load) still needs the C5 flag.
  const myLikes = new Set();
  // installed multi-user apps pushed by C# loadApps (addApp) — feed the attach
  // → "App invite" picker (legacy parity: legacy showed an app option in the
  // attach bar, picking one emits ixian:app:<id>, chat.js:1250 / onApp xaml:832).
  const chatApps = [];

  // Best-known display nick for a group sender: an explicit nick on the row wins,
  // else the last name resolved via updateGroupChatNicks for that address.
  const resolveNick = (address, nick) =>
    nick || (address && groupNicks.get(String(address))) || '';

  /* typing pill — appended while typing is on, removed on timeout / new message,
   * and always kept LAST (shell duty mirrored from the demo). */
  let typingRow = null;
  let typingTimer = null;
  let typingActive = false;   // peer is currently typing — survives full re-renders
  // re-append after a rebuild: renderLogNow's box.textContent='' detaches the pill,
  // so this must re-add it whenever typing is ACTIVE (audit M3: the old
  // parentNode===box guard could never re-append a just-cleared pill).
  function keepTypingLast() {
    if (typingActive && typingRow) box.append(typingRow);
  }
  function showTyping() {
    if (!typingRow) {
      typingRow = createTypingIndicator(mode.isMulti && identity.name ? { name: identity.name } : {});
    }
    typingActive = true;
    box.append(typingRow);
    box.scrollTop = box.scrollHeight;
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(hideTyping, 5000);  // legacy showUserTyping auto-hides after 5s
  }
  function hideTyping() {
    typingActive = false;
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    if (typingRow && typingRow.parentNode) typingRow.remove();
  }

  const nearBottom = () => box.scrollTop + box.clientHeight * 1.5 >= box.scrollHeight;

  /* status derivation from the legacy bool flags (chat.js updateMessage / addMe):
   *   errorSending → failed   (highest priority)
   *   read         → read
   *   confirmed    → delivered (peer received; "double check" in legacy)
   *   sent         → sent      (relayed; single check)
   *   else         → sending   (the legacy "default"/clock state) */
  function statusFrom({ sent, confirmed, read, errorSending }) {
    if (asBool(errorSending)) return 'failed';
    if (asBool(read)) return 'read';
    if (asBool(confirmed)) return 'delivered';
    if (asBool(sent)) return 'sent';
    return 'sending';
  }

  /* #63 grouping: consecutive same-direction rows within 90s form a run.
   * Recomputes position (single/first/middle/last) for the whole log — simplest
   * correct approach for an upsert model with out-of-order inserts + deletes.
   * Only TEXT rows group: a typed card (file/…) is always standalone and breaks
   * the run. In group chats a run also breaks when the sender changes, so every
   * participant keeps their own label + avatar. */
  const GROUP_WINDOW = 90000;
  function positionsFor(ids) {
    const pos = {};
    for (let i = 0; i < ids.length; i++) {
      const r = model.get(ids[i]);
      const prev = i > 0 ? model.get(ids[i - 1]) : null;
      const next = i < ids.length - 1 ? model.get(ids[i + 1]) : null;
      const cont = (a, b) => a && b
        && (a.kind || 'text') === 'text' && (b.kind || 'text') === 'text'
        && a.direction === b.direction
        && (a.senderAddress || '') === (b.senderAddress || '')
        && Math.abs(a.ts - b.ts) < GROUP_WINDOW;
      const withPrev = cont(prev, r);
      const withNext = cont(r, next);
      pos[ids[i]] = !withPrev && !withNext ? 'single'
        : !withPrev && withNext ? 'first'
        : withPrev && withNext ? 'middle'
        : 'last';
    }
    return pos;
  }

  function buildRow(rec, position) {
    if (rec.kind === 'file') return buildFileRow(rec);
    if (rec.kind === 'app') return buildAppRow(rec);
    if (rec.kind === 'payment') return buildPaymentRow(rec);
    if (rec.kind === 'call') return buildCallRow(rec);
    // A text message that is JUST a remote image/GIF URL → media tile (Damir
    // 2026-07-07: legacy parity, reopens #82 for remote media). The model stays
    // kind 'text' (menu/reactions still work — attachMessageMenu targets
    // .c-mbubble too), we only swap the RENDER.
    const media = mediaUrlOf(rec.text);
    if (media) return buildMediaRow(rec, media);
    const isSent = rec.direction === 'sent';
    return createMessageBubble({
      direction: isSent ? 'sent' : 'received',
      position,
      text: rec.text || '',
      timestamp: rec.ts,
      status: isSent ? rec.status : null,
      // group/bot chats: show the sender nick, or the raw ADDRESS (middle-truncated
      // + click-to-copy in the component) when there's no nick yet (Damir 2026-07-07).
      sender: (!isSent && mode.isMulti) ? (rec.senderNick || rec.senderAddress || null) : null,
      senderIsAddress: (!isSent && mode.isMulti && !rec.senderNick && !!rec.senderAddress),
      showAvatar: (!isSent && mode.isMulti),
      name: rec.senderNick || '',
      address: rec.senderAddress || '',
      avatar: rec.avatar || null,   // real per-sender photo (C# addThem avatar); gradient fallback

      // #99: in a NON-blind group, the sender label + avatar open the member
      // sheet (identity verification + admin). Blind groups (type 2) hide
      // identities, bots (3) have no member roster → no tap.
      onSenderClick: (!isSent && mode.type === 1 && (rec.senderAddress || rec.senderNick))
        ? () => openMember(rec) : null,
      // resend has NO SingleChatPage case (dead verb) — gate the Retry affordance
      // behind cap('resend') so a failed message shows an HONEST "Not delivered"
      // (no dead button) until the BE cutover lands the resend case (audit M1).
      onRetry: (isSent && rec.status === 'failed' && bridge.cap('resend'))
        ? () => bridge.send('ixian:contextAction:resend:' + rec.id) : null,
      // URLs render as buttons; the shell confirms before opening externally
      // (#82 — P2P has no server, so no auto-load of remote content). Fixes
      // Damir F5: links were inert because no handler was wired.
      onLinkClick: (url) => confirmOpenLink(url),
    });
  }

  /* —— remote media (GIF/image) tiles —————————————————————————————————————————
   * Damir 2026-07-07 (reopens #82, legacy parity, client-fetch — accepts that
   * loading a remote asset reveals the reader's IP to the host; flag for
   * BE/security sign-off): a message that is EXACTLY a direct image/GIF URL
   * renders as a tap-to-load tile (play button → fetch → full-screen viewer),
   * instead of the plain confirm-to-open link. Detection is conservative — a
   * direct media EXTENSION or a known direct-media host (media.tenor.com,
   * mediaN.giphy.com) — so a random page URL stays a link (a page URL wouldn't
   * load as an <img> anyway). Non-direct hosts fail-soft to the tile's retry
   * state. autoload stays OFF (a future "auto-load media" setting = legacy's
   * immediate load). NOTE: website OpenGraph meta cards are NOT wired — fetching
   * a site's meta from the WebView is CORS-blocked; that needs a proxy or
   * sender-composed meta (§82). */
  const MEDIA_EXT = /\.(gif|png|jpe?g|webp|bmp|avif)(\?|#|$)/i;
  function mediaUrlOf(text) {
    const t = (text == null ? '' : String(text)).trim();
    if (!/^https?:\/\/\S+$/i.test(t) || /\s/.test(t)) return null;   // must be a lone URL
    let u;
    try { u = new URL(t); } catch (_) { return null; }
    const host = u.hostname.toLowerCase();
    const directGifHost = /^media\d*\.(tenor|giphy)\.com$/.test(host) || /^c\.tenor\.com$/.test(host);
    if (MEDIA_EXT.test(u.pathname)) {
      return { url: t, kind: /\.gif(\?|#|$)/i.test(u.pathname) ? 'gif' : 'image' };
    }
    if (directGifHost) return { url: t, kind: 'gif' };
    return null;
  }
  function buildMediaRow(rec, media) {
    const isSent = rec.direction === 'sent';
    const label = media.kind === 'gif' ? 'GIF' : ((window.SL && window.SL.image) || 'Image');
    return createMediaBubble({
      direction: isSent ? 'sent' : 'received',
      kind: media.kind,
      src: media.url,
      alt: label,
      timestamp: rec.ts,
      gutter: mode.isMulti && !isSent,
      strings: window.SL || {},
      onOpen: () => openMediaViewer({ host: overlayHost, src: media.url, kind: media.kind, alt: label, strings: window.SL || {} }),
    });
  }

  /* external-link confirm (#82): tapping an in-text link asks before leaving the
   * app / touching a remote URL, then opens via the legacy verb (dispatch 315). */
  function confirmOpenLink(url) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.openLinkTitle || 'Open external link?',
      body: url,
      host: overlayHost,
      actions: [
        { label: s.cancel || 'Cancel', type: 'text', autofocus: true },
        { label: s.openLink || 'Open', type: 'fill',
          onClick: () => bridge.send('ixian:openLink:' + url) },
      ],
    }));
  }

  /* file transfer row (chat.js addFile:904 / updateFile:1009).
   *   received + not started → 'offer'    → tap = ixian:acceptfile:<fileid>
   *   in transfer (0<p<100)  → 'progress' → no tap (disabled while downloading)
   *   complete               → 'complete' → tap = ixian:openfile:<fileid>
   * OUTGOING transfers now show progress too (Damir F5): the SENDER gets real
   * per-packet ticks (TransferManager.sendFileData → updateFile, 0→100+complete),
   * so a sent file shows the bar + "keep Spixi open" hint while transferring and
   * flips to complete (open button + success toast) when done — instead of the
   * legacy "own file = instantly complete". meta is empty (bridge sends no size). */
  function buildFileRow(rec) {
    return createFileBubble({
      direction: rec.direction,
      name: rec.name || '',
      meta: rec.meta || '',
      state: rec.fstate,
      progress: rec.progress || 0,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onAccept: () => bridge.send('ixian:acceptfile:' + rec.fileid),
      onOpen: () => bridge.send('ixian:openfile:' + rec.fileid),
    });
  }

  /* derive the file bubble state from the legacy addFile flags. */
  function fileStateFrom(me, progress, complete) {
    const p = Number(progress) || 0;
    if (asBool(complete) || p >= 100) return 'complete';
    // in-flight: OUTGOING shows send progress (bar + keep-open) — never 'offer'
    // (own files have no accept step); INCOMING = downloading vs a pending offer.
    if (asBool(me)) return 'progress';
    return p > 0 ? 'progress' : 'offer';
  }

  /* app invite/session card (chat.js addAppRequest:1174). state derives from the
   * stable localSender + appStatus signals; actions reuse the EXISTING verbs
   * (installApp / joinApp) so no new bridge command is needed. Decline-invite has
   * no legacy verb → intentionally omitted in v1 (legacy had none either). */
  function buildAppRow(rec) {
    return createAppBubble({
      name: rec.name || '',
      iconUrl: rec.iconUrl || null,
      state: rec.astate,
      direction: rec.direction,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onGet: () => bridge.send('ixian:installApp:' + encodeURIComponent(rec.appInstallURL || '')),
      onLaunch: () => bridge.send('ixian:joinApp:' + rec.appid),
      onJoin: () => bridge.send('ixian:joinApp:' + rec.appid),
    });
  }

  /* map the legacy addAppRequest flags → createAppBubble state.
   *   own invite (localSender)     → 'invited' (Launch)
   *   incoming, app not installed  → 'missing' (Get)
   *   incoming, installed/minimized→ 'invite'  (Join) */
  function appStateFrom(localSender, appStatus) {
    if (asBool(localSender)) return 'invited';
    return appStatus === 'Missing' ? 'missing' : 'invite';
  }

  /* payment card (chat.js addPaymentRequest / xaml.cs:1310,1361 · updates
   * 1648,1665). VIEW-ONLY in v1 (Damir 2026-07-07 interview-2 #5): an
   * informational card — amount + status badge + a Details link that opens the
   * NATIVE payment view (ixian:viewPayment). No inline Pay/Decline yet — that
   * needs a signed §8 path (SECURITY.md), deferred to BE cutover C3. Role is
   * sent|received by localSender, so the card renders NO action buttons; the
   * C#-localized `title` is passed verbatim because role alone can't tell a
   * REQUEST from a completed PAYMENT (the C1 enum gap — a best-effort interim). */
  function buildPaymentRow(rec) {
    const canView = rec.enableView && rec.txid;
    return createPaymentBubble({
      role: rec.direction === 'sent' ? 'sent' : 'received',
      title: rec.title || '',
      amount: rec.amount || '',
      status: rec.pstatus,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onDetails: canView ? () => bridge.send('ixian:viewPayment:' + rec.txid) : null,
    });
  }

  /* map the legacy FontAwesome status_icon → the redesigned card status enum.
   * C# emits only these three for payments (xaml.cs:1249/1265/1284/1325/1331/
   * 1336): fa-check-circle → completed · fa-exclamation-circle → declined ·
   * fa-clock (waiting/pending) → pending. */
  function paymentStatusFrom(statusIcon) {
    const s = String(statusIcon || '');
    if (s.indexOf('check') !== -1) return 'completed';
    if (s.indexOf('exclamation') !== -1) return 'declined';
    return 'pending';
  }

  /* call event card (chat.js addCall:1496). VIEW-ONLY best-effort (BE cutover
   * C4): the bridge conflates direction + no-answer/missed into one `declined`
   * flag plus a localized text blob. declined → render as "missed" so a call-
   * back is offered (via the existing ixian:call toggle); otherwise it was
   * answered → the (m:ss) duration is pulled out of the text. directionLabel is
   * left empty — it isn't recoverable from the localized string. */
  function buildCallRow(rec) {
    return createCallBubble({
      missed: rec.missed,
      // pass the C#-localized label verbatim (duration stripped — shown
      // separately) so "No answer" (outgoing rang-out) isn't reconstructed as
      // "Missed voice call". Direction stays default until BE sends it (C4).
      title: rec.label || '',
      duration: rec.duration || '',
      timestamp: rec.ts,
      onCallBack: () => bridge.send('ixian:call'),
    });
  }

  /* reactions (chat.js addReactions:549). The bridge sends a ;-joined "key:count"
   * string. v1 renders LIKE reactions (heart + count), toggled via the existing
   * `like` contextAction (xaml.cs:1045). Tips carry a txid, not a display amount
   * (xaml.cs:979/1607), so we can't show the value — but we DO render a tip pill
   * (heart-handshake glyph + "Tipped", Damir F5) so a tip is visible on the
   * bubble. No per-user flag in the bridge → own from myLikes (session interim). */
  function parseReactions(str, id) {
    const reactions = [];
    let tipCount = 0;
    const likedByMe = myLikes.has(String(id));
    for (const tok of String(str || '').split(';')) {
      if (!tok) continue;
      const parts = tok.split(':');
      const count = parseInt(parts[parts.length - 1], 10) || 0;
      if (count <= 0) continue;
      if (tok.startsWith('like')) reactions.push({ emoji: '❤️', count, own: likedByMe });
      else if (tok.startsWith('tip')) tipCount += count;   // txid, not amount → count only
    }
    const sl = window.SL || {};
    const tip = tipCount > 0
      ? (tipCount > 1 ? (sl.tipped || 'Tipped') + ' ×' + tipCount : (sl.tipped || 'Tipped'))
      : '';
    return { reactions, tip };
  }

  /* React to a message with a like (the ONE reaction the bridge supports —
   * xaml.cs:1045). Records my like locally for the own-state (C5 interim), emits
   * the toggle, and optimistically reflects it on the row so the pill shows
   * selected immediately (C#'s addReactions re-emit lands the authoritative
   * count next). Shared by the context-menu React action AND tapping a pill. */
  function reactToMessage(id) {
    id = String(id);
    myLikes.add(id);
    bridge.send('ixian:contextAction:like:' + id);
    const rec = model.get(id);
    if (!rec) return;
    rec.reactions = rec.reactions || [];
    const heart = rec.reactions.find((r) => r.emoji === '❤️');
    if (heart) heart.own = true;                       // count updates when C# responds
    else rec.reactions.push({ emoji: '❤️', count: 1, own: true }); // optimistic first like
    const row = rows.get(id);
    if (row) applyRowReactions(rec, row, true);
  }

  /* apply a record's stored reactions to its live row — called from renderLog so
   * pills survive re-renders, and from the addReactions handler for a live pop. */
  function applyRowReactions(rec, row, animate) {
    const hasReactions = rec.reactions && rec.reactions.length;
    if (!hasReactions && !rec.tip) return;
    applyReactions(row, {
      reactions: rec.reactions || [],
      tip: rec.tip || '',
      animate: !!animate,
      host: box,
      onToggle: () => reactToMessage(rec.id),
    });
  }

  /* —— message context menu (long-press + right-click) ————————————————————————
   * Attached to TEXT rows in renderLogNow. Actions map to existing bridge verbs;
   * Reply/Edit are §8-gated behind a capability flag (OFF until BE), so they
   * never render today. Non-text cards keep their own inline actions in v1. */
  const overlayHost = document.body;
  function wireMenu(rec, row) {
    // Enable the context menu on CONTENT rows. Text gets copy/edit; file/payment/
    // app cards get react + tip + delete too (Damir: "file/payment can't react or
    // tip — change that"). react/tip/delete map to the same bridge verbs by msg id
    // regardless of kind (the reaction pill anchors on .c-tcard/.c-fbubble too);
    // the menu auto-hides Copy (no text) and Edit (not own text). Call logs are
    // excluded — reacting/tipping a call record is nonsensical and they carry
    // their own call-back affordance.
    const kind = rec.kind || 'text';
    if (kind === 'call') return;
    const isSent = rec.direction === 'sent';
    attachMessageMenu(row, {
      host: overlayHost,
      text: rec.text || '',
      reactions: ['❤️'],   // the bridge supports only "like" — offer just the heart
      capabilities: {
        reply: bridge.cap('reply'),                       // §8-gated, OFF until BE (#25)
        edit: bridge.cap('edit') && isSent && !!rec.text, // own text only
        tip: (!isSent && !mode.isBot && mode.type !== 2), // C# blocks tip in bots + blind groups (xaml:942)
        report: mode.isBot,                               // C# report is bots-only (xaml:1026)
        select: false,                                    // multi-select not wired in the shell yet
      },
      onAction: (action, arg) => onMenuAction(action, rec),
    });
  }

  function onMenuAction(action, rec) {
    const id = rec.id;
    if (action === 'react') { reactToMessage(id); return; }
    if (action === 'copy') {
      if (navigator.clipboard && rec.text) navigator.clipboard.writeText(rec.text).catch(() => {});
      return;
    }
    if (action === 'delete') { bridge.send('ixian:contextAction:deleteMessage:' + id); return; }
    if (action === 'report') { bridge.send('ixian:contextAction:report:' + id); return; }
    if (action === 'tip') { openTipForMessage(rec); return; }
    // reply/edit are capability-gated off → never reached in v1
    dbg('menu action (gated/unhandled)', action);
  }

  /* member identity sheet (#99) — sender tap in a non-blind group. Shows the
   * FULL address (nick is spoofable), a contact-request path, and admin
   * kick/ban when I'm the group admin. C# runs its own confirm for kick/ban
   * (displaySpixiAlert). relation defaults 'none' — the chat shell has no
   * contact roster, so it can't tell if the member is already a contact (BE
   * gap #99/§9); the request verb is idempotent-ish on the C# side. */
  function openMember(rec) {
    if (!rec.senderAddress && !rec.senderNick) return;
    const s = window.SL || {};
    const actions = [];
    if (mode.admin && rec.senderAddress) {
      actions.push({ label: s.removeFromGroup || 'Remove from group', destructive: true,
        onClick: () => bridge.send('ixian:kick:' + rec.senderAddress) });
      actions.push({ label: s.banFromGroup || 'Ban from group', destructive: true,
        onClick: () => bridge.send('ixian:ban:' + rec.senderAddress) });
    }
    openMemberSheet({
      host: overlayHost,
      member: { name: rec.senderNick || '', address: rec.senderAddress || '' },
      blind: false,
      relation: 'none',
      onRequest: rec.senderAddress
        ? () => bridge.send('ixian:sendContactRequest:' + rec.senderAddress) : null,
      actions,
      strings: s,
    });
  }

  /* tip: open the amount sheet (no balance — C# runs the real balance check +
   * native confirm), then emit ixian:contextAction:tip:<id>:<amount>. Recipient
   * is DISPLAY-only (C# resolves the real payee from the msg id). */
  function openTipForMessage(rec) {
    openTipSheet({
      message: { id: rec.id, excerpt: rec.text || undefined },
      recipient: {
        name: rec.senderNick || identity.name || identity.address || '',
        address: rec.senderAddress || identity.address || '',
      },
      balance: null,
      host: overlayHost,
      onTip: (payload, ctrl) => {
        bridge.send('ixian:contextAction:tip:' + rec.id + ':' + payload.amount);
        ctrl.done();   // the tip pill / wallet tx land via the bridge (addReactions)
      },
    });
  }

  /* composer ⊕ → attach sheet (tile grid) replacing the legacy native attach bar.
   *   file    → ixian:sendfile            (native picker)
   *   photo/gif → ixian:sendmedia         (gated on the media capability, #81)
   *   pay     → ixian:send  (onSendIxi)   1:1 only — native compose + sign
   *   request → ixian:request (onRequestIxi) 1:1 only
   * App-invite tile is hidden (no SingleChatPage invite verb); Pay/Request are
   * hidden in groups/bots (C# rejects them there). */
  function openAttach() {
    openAttachSheet({
      host: overlayHost,
      media: bridge.cap('media'),   // Photo/GIF appear only when the BE image standard lands (#81)
      apps: !mode.isBot,            // App invite: onApp is blocked in bots (xaml:834); 1:1 + groups OK
      payments: mode.type === 0,    // 1:1 only
      strings: window.SL || {},
      onAction: (id) => {
        if (id === 'file') bridge.send('ixian:sendfile');
        else if (id === 'photo' || id === 'gif') bridge.send('ixian:sendmedia');
        else if (id === 'pay') bridge.send('ixian:send');
        else if (id === 'request') bridge.send('ixian:request');
        else if (id === 'app') openAppPicker();
      },
    });
  }

  /* App-invite picker (legacy parity): the attach "App invite" tile opens a
   * sheet of installed multi-user apps (captured from loadApps/addApp); picking
   * one emits ixian:app:<id> → onApp starts an app session with the peer
   * (xaml:832). Empty state when none are installed. */
  function openAppPicker() {
    const s = window.SL || {};
    const content = document.createElement('div');
    content.className = 'chat-app-picker';
    if (!chatApps.length) {
      const empty = document.createElement('p');
      empty.className = 'chat-app-picker__empty';
      empty.textContent = s.noApps || 'No apps installed yet.';
      content.append(empty);
    } else {
      for (const app of chatApps) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chat-app-picker__item';
        if (window.SpixiIcons && window.SpixiIcons.icon) b.append(window.SpixiIcons.icon('rocket', { size: 20 }));
        const nm = document.createElement('span');
        nm.className = 'chat-app-picker__name';
        nm.textContent = app.name;
        b.append(nm);
        b.addEventListener('click', () => { closeSheet(sheet); bridge.send('ixian:app:' + app.id); });
        content.append(b);
      }
    }
    const sheet = createSheet({ title: s.inviteApp || 'Invite an app', content, host: overlayHost, strings: s });
    openSheet(sheet);
  }

  /* incoming contact-request pane (#109) — showContactRequest fires when the
   * peer's requestAdd lands and they're not yet approved (xaml:1196). Only "1"
   * is sent (no identity), so we populate from the header identity. Accept →
   * ixian:accept (onAcceptFriendRequest); Decline → ixian:undorequest (the only
   * decline path SingleChatPage offers — removes the pending friend + leaves).
   * Sits above the composer; C#'s re-flush after accept clears it (clearMessages). */
  let requestPane = null;
  function removeRequestPane() { if (requestPane) { requestPane.remove(); requestPane = null; } }
  function showRequestPane() {
    removeRequestPane();
    requestPane = document.createElement('div');
    requestPane.className = 'chat-request-pane';
    requestPane.append(createContactRequest({
      name: identity.name || '', address: identity.address || '',
      timestamp: Date.now(), host: overlayHost, strings: window.SL || {},
      onAccept: () => bridge.send('ixian:accept'),
      onDecline: () => bridge.send('ixian:undorequest'),
    }));
    document.getElementById('chat-composer').before(requestPane);
  }

  /* secure-chat / privacy notice — ALWAYS the first item in the log, mirroring
   * the legacy `private-messages-note` (chat.js clearMessages:1404). Marks the
   * conversation as end-to-end encrypted + P2P. Copy is i18n-overridable via
   * window.SL; "How it works" opens the security page through the legacy verb. */
  const SECURE_LINK = 'https://www.spixi.io/help-center.html';
  function createSecureNotice() {
    const s = window.SL || {};
    return createSystemNotice({
      title: s.secureNoticeTitle || 'Encrypted. Peer-to-peer. Yours alone.',
      text: s.secureNoticeText || 'Messages go straight from device to device, sealed with post-quantum encryption. No server carries or stores them — every message exists only with you two, nowhere else.',
      linkLabel: s.secureNoticeLink || 'How it works',
      onLink: () => bridge.send('ixian:openLink:' + SECURE_LINK),
    });
  }

  /* full re-render of the log from the model — used after any insert/delete so
   * grouping + timestamp order stay correct. Rebuilds date separators too.
   * Call the coalesced `renderLog()` from handlers; `renderLogNow()` is the
   * synchronous rebuild (also used for the first paint). */
  function renderLogNow() {
    const scrollWasAtBottom = nearBottom();
    // Build the whole log into a DETACHED fragment, then swap it in with ONE
    // replaceChildren — the live #messages box is NEVER momentarily empty, so a
    // paint can't catch a blank log mid-rebuild (Damir 2026-07-07 flicker). Also
    // removes the boot spinner (it's a child of box) on the first render.
    const frag = document.createDocumentFragment();
    rows.clear();
    frag.append(createSecureNotice());   // privacy note pinned at the top of history
    const pos = positionsFor(order);
    let lastDay = null;
    for (const id of order) {
      const rec = model.get(id);
      const day = new Date(rec.ts).toDateString();
      if (day !== lastDay) { frag.append(createDateSeparator(rec.ts)); lastDay = day; }
      const row = buildRow(rec, pos[id]);
      row.dataset.msgid = id;
      rows.set(id, row);
      frag.append(row);
      applyRowReactions(rec, row, false);  // re-attach pills after a rebuild
      wireMenu(rec, row);                  // long-press / right-click context menu
    }
    box.replaceChildren(frag);             // atomic swap — no empty intermediate state
    keepTypingLast();
    if (scrollWasAtBottom) box.scrollTop = box.scrollHeight;
    firstRenderDone = true;                 // boot spinner is now gone
  }

  /* Render scheduling — two regimes:
   * (1) NORMAL (post-load): coalesce into one animation frame so a burst of
   *     small updates (status ticks, a new message) rebuilds at most once/frame.
   * (2) LOAD BURST: on open C# streams the WHOLE history — clearMessages →
   *     insertMessage×N → onChatScreenLoaded (SingleChatPage.xaml.cs:1110/588).
   *     Each EvaluateJavaScriptAsync runs on a LATER frame, so even the rAF
   *     coalescer rebuilt+swapped the growing log many times as rows streamed
   *     in → the log visibly "filled in" / flickered (Damir 2026-07-07, chats
   *     with history). During a burst we SUPPRESS every render (the model just
   *     accumulates) and paint ONCE at onChatScreenLoaded — so the user sees the
   *     boot spinner, then the finished conversation in a single paint. A
   *     trailing safety timer force-finishes the burst if that signal never
   *     arrives (other loadMessages call sites, robustness). */
  let renderQueued = false;
  let bursting = false;
  let burstSafety = 0;
  let firstRenderDone = false;   // gates the boot spinner → first real paint
  function beginBurst() {
    bursting = true;
    armBurstSafety();
  }
  function armBurstSafety() {
    clearTimeout(burstSafety);
    burstSafety = setTimeout(endBurstAndRender, 250);   // fallback if onChatScreenLoaded is missing
  }
  function endBurstAndRender() {
    clearTimeout(burstSafety);
    if (!bursting) return;
    bursting = false;
    renderLogNow();
  }
  function renderLog() {
    if (bursting) { armBurstSafety(); return; }   // suppress during the load burst
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderLogNow(); });
  }

  /* insert (or move) an id into `order` keeping timestamp-ascending; stable for
   * equal timestamps (append after equals → matches arrival order). */
  function orderInsert(id) {
    order = order.filter((x) => x !== id);
    const ts = model.get(id).ts;
    let i = order.length;
    while (i > 0 && model.get(order[i - 1]).ts > ts) i--;
    order.splice(i, 0, id);
  }

  /* UPSERT a text row. flags = { sent, confirmed, read, paid, errorSending }. */
  function upsertText(id, text, direction, ts, flags, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'text', direction, senderNick: '', senderAddress: '' };
    if (text !== undefined && text !== null) rec.text = String(text);
    if (direction) rec.direction = direction;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
      if (extra.avatar !== undefined) rec.avatar = extra.avatar || null;
    }
    rec.status = statusFrom(flags || {});
    model.set(id, rec);
    orderInsert(id);
    hideTyping();  // any new/updated message clears the typing pill (legacy addText → hideUserTyping)

    if (!existing) {
      renderLog();  // new row → re-render so grouping + date separators are correct
      return;
    }
    // status-only update on an existing SENT row → surgical tick (no flicker).
    // failed restructures the row, so re-render instead.
    if (rec.direction === 'sent' && rec.status !== 'failed') {
      const row = rows.get(id);
      if (row) { setMessageStatus(row, rec.status); return; }
    }
    renderLog();
  }

  /* CREATE a file transfer row (legacy addFile). Keyed by message id like text
   * rows; fileIndex maps the transfer's fileid → this id so updateFile finds it. */
  function upsertFile(id, ts, dir, fileid, name, fstate, progress, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'file', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'file';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (fileid != null) { rec.fileid = String(fileid); fileIndex.set(String(fileid), id); }
    if (name != null) rec.name = String(name);
    rec.fstate = fstate;
    rec.progress = Number(progress) || 0;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE an app invite/session row (legacy addAppRequest). Static once added
   * (no updateApp verb). appid drives joinApp; appInstallURL drives installApp. */
  function upsertApp(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'app', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'app';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.appid !== undefined) rec.appid = extra.appid;
      if (extra.name !== undefined) rec.name = extra.name || '';
      if (extra.iconUrl !== undefined) rec.iconUrl = extra.iconUrl || null;
      if (extra.astate !== undefined) rec.astate = extra.astate;
      if (extra.appInstallURL !== undefined) rec.appInstallURL = extra.appInstallURL || '';
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE/UPSERT a payment card (legacy addPaymentRequest). extra carries the
   * verbatim title, amount, status enum (from status_icon), txid, enableView. */
  function upsertPayment(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'payment', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'payment';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.title !== undefined) rec.title = extra.title || '';
      if (extra.amount !== undefined) rec.amount = extra.amount;
      if (extra.pstatus !== undefined) rec.pstatus = extra.pstatus;
      if (extra.txid !== undefined) { rec.txid = extra.txid || ''; if (rec.txid) txIndex.set(rec.txid, id); }
      if (extra.enableView !== undefined) rec.enableView = extra.enableView;
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE a call event row (legacy addCall). missed = the bridge `declined`
   * flag (rang out / no answer); label = the C#-localized wording verbatim;
   * duration is a preformatted "m:ss" or empty. */
  function upsertCall(id, ts, missed, label, duration) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'call' };
    rec.kind = 'call';
    if (ts) rec.ts = ts;
    rec.missed = !!missed;
    rec.label = label || '';
    rec.duration = duration || '';
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers — every one a page global (via bridge.exposeAll),
   * because executeUiCommand(fnRef, …) resolves fnRef as a bare page-global.
   * The 1:1 text path is wired; the rest are safe no-op stubs.
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    /* ——— header + mode (wired) ——————————————————————————————————————————— */

    // setChatMode(type, cost, costText, admin, botDescription, notificationsString)
    // type: 0 = 1:1, 1 = private group, 2 = blind group, 3 = bot (chat.js:152).
    // v1 focus is 1:1 text; we record the mode so grouping shows sender
    // labels/avatars for groups. cost/bot/notifications surfaces are later passes.
    setChatMode(type, cost, costText, admin, botDescription, notificationsString) {
      const t = Number(type) || 0;
      mode.type = t;
      mode.isBot = (t === 3);
      // isMulti = shows per-sender labels + avatars: private/blind GROUPS *and*
      // BOT channels (Damir F5: bot-group messages showed no nick/avatar because
      // bots are type 3). Legacy set the sender for `friend.bot || Group`
      // (SingleChatPage:1222). Group-only logic uses mode.type===1 directly.
      mode.isMulti = (t === 1 || t === 2 || t === 3);
      mode.admin = asBool(admin);
      dbg('setChatMode', { type: t, cost, admin: mode.admin, notificationsString });
    },

    setNickname(nick) {
      identity.name = nick || '';
      renderTopbar();
    },

    // setOnlineStatus receives a fully-localised string from C# (chat-online /
    // chat-offline / member count / waiting-for-response) — render it verbatim
    // as the presence sub-line. We flag the avatar dot online only for the
    // 1:1 "online" wording heuristically; presence text is the source of truth.
    setOnlineStatus(status) {
      identity.sub = status || '';
      const s = (status || '').toLowerCase();
      identity.online = !mode.isMulti && /online/.test(s);
      renderTopbar();
    },

    /* ——— messages (wired) ———————————————————————————————————————————————— */

    // Batch reset. showMore ("true"/"false") = whether a "load older" affordance
    // belongs at the top; v1 just resets the model (loadmore is a stub verb).
    clearMessages(showMore) {
      model.clear();
      rows.clear();
      fileIndex.clear();
      txIndex.clear();
      myLikes.clear();
      removeRequestPane();   // a re-flush after accept clears the request pane
      order = [];
      hideTyping();
      typingRow = null;
      // clearMessages marks the START of a load burst (loadMessages, xaml:1110) —
      // suppress renders until onChatScreenLoaded so the whole history paints once
      // (no flicker). We do NOT render here: the boot spinner (or the prior log)
      // stays until the burst finishes, avoiding a blank/notice flash.
      beginBurst();
      dbg('clearMessages', { showMore });
    },

    // TEXT create — own message. 12-arg legacy addMe shape (xaml.cs:1460).
    addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending) {
      upsertText(id, text, 'sent', toMs(time),
        { sent, confirmed, read, paid, errorSending },
        { avatar: resolveAvatar(avatar) });
    },

    // TEXT create — incoming message. Legacy addThem is called with 6 args
    // (xaml.cs:1460 for !localSender); status flags are irrelevant for received
    // rows (no ticks rendered). nick/address feed the group sender label/avatar.
    addThem(id, address, nick, avatar, text, time) {
      const av = resolveAvatar(avatar);
      upsertText(id, text, 'received', toMs(time), {},
        { senderNick: resolveNick(address, nick), senderAddress: address || '', avatar: av });
      // 1:1 topbar: C# never pushes a peer avatar for the header (only setNickname/
      // setOnlineStatus, xaml:1694/1705) — capture it from the peer's message.
      if (av && !mode.isMulti && !identity.avatar) { identity.avatar = av; renderTopbar(); }
    },

    // TEXT status UPSERT (chat.js:1035, xaml.cs:1624). Update the row's status
    // (and text) if it exists; create it if not (robustness — the legacy handler
    // only updated, but C# may updateMessage a row this shell hasn't seen yet).
    updateMessage(id, message, sent, confirmed, read, paid, errorSending) {
      const dir = asBool(sent) ? 'sent' : 'received';
      const existing = model.get(String(id));
      upsertText(id, message, dir, existing ? existing.ts : Date.now(),
        { sent, confirmed, read, paid, errorSending });
    },

    // Remove a row and re-render so #63 grouping repairs around the gap.
    deleteMessage(id) {
      id = String(id);
      const rec = model.get(id);
      if (!rec) { dbg('deleteMessage: unknown', id); return; }
      if (rec.kind === 'file' && rec.fileid) fileIndex.delete(rec.fileid);
      if (rec.kind === 'payment' && rec.txid) txIndex.delete(rec.txid);
      model.delete(id);
      order = order.filter((x) => x !== id);
      renderLog();
    },

    // Peer is typing — show the pill briefly (auto-hides after 5s).
    showUserTyping() { showTyping(); },

    // Clear the composer input (C# echoes this after a successful send).
    clearInput() { if (composerEl) clearComposer(composerEl); },

    /* ——— lifecycle acks (minimal) ———————————————————————————————————————— */

    // C#→JS acks. onChatScreenReady carries the peer address; store it so the
    // avatar hue is identity-stable even before setNickname lands.
    onChatScreenReady(address) {
      identity.address = address || '';
      if (!identity.name) renderTopbar();
      maybeRestoreDraft();                 // address known → bring back any saved draft (CH7)
      dbg('onChatScreenReady', address);
    },
    // End of the initial load burst (fires after loadMessages, xaml:588) — paint
    // the whole history in ONE render, pin to the bottom, and put the caret in the
    // composer so the user can type immediately without tapping it (Damir).
    onChatScreenLoaded() {
      // End the load burst and paint the WHOLE history in ONE render (spinner →
      // conversation, no intermediate empty-notice frame). Always renders (even
      // for an empty chat: shows the secure notice) — not gated on `bursting`.
      bursting = false;
      clearTimeout(burstSafety);
      renderLogNow();
      box.scrollTop = box.scrollHeight;
      maybeRestoreDraft();                 // fallback if onChatScreenReady didn't carry the address
      focusComposer();
      dbg('onChatScreenLoaded');
    },

    hideBackButton() { dbg('hideBackButton'); },     // 2-pane: back owned by host chrome
    setUnreadIndicator(n) { dbg('setUnreadIndicator', n); },

    /* ——— payments (view-only, wired) ————————————————————————————————————————
     * addPaymentRequest is the 14-arg legacy shape (xaml.cs:1310/1361):
     *   (id, txid, address, nick, avatar, title, amount, status, statusIcon,
     *    time, localSender, confirmed, read, enableView)
     * `title` + `status` are C#-LOCALIZED strings; `statusIcon` is the stable
     * signal we map to the status enum. localSender ("True"/"") → direction. */
    addPaymentRequest(id, txid, address, nick, avatar, title, amount, status, statusIcon, time, localSender, confirmed, read, enableView) {
      upsertPayment(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        title: title || '', amount: amount,
        pstatus: paymentStatusFrom(statusIcon),
        txid: txid || '', enableView: asBool(enableView),
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },

    // Request-status update (xaml.cs:1665): (msg_id, txid, status, statusIcon,
    // enableView). Patches the card in place (re-render); ignores unknown ids.
    updatePaymentRequestStatus(id, txid, status, statusIcon, enableView) {
      id = String(id);
      const rec = model.get(id);
      if (!rec || rec.kind !== 'payment') { dbg('updatePaymentRequestStatus: unknown', id); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      if (txid) {
        if (rec.txid && rec.txid !== String(txid)) txIndex.delete(rec.txid); // drop stale key on re-key (N1)
        rec.txid = String(txid); txIndex.set(rec.txid, id);
      }
      rec.enableView = asBool(enableView);
      renderLog();
    },

    // Direct-payment status update (xaml.cs:1648): (txid, status, statusIcon) —
    // keyed by TXID, so resolve via txIndex.
    updateTransactionStatus(txid, status, statusIcon) {
      const id = txIndex.get(String(txid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateTransactionStatus: unknown txid', txid); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      renderLog();
    },

    /* FILE transfer create (chat.js addFile:904, 13-arg). me/sent/read/paid are
     * the .NET bool strings; nick/address feed the group sender label/avatar. */
    addFile(id, address, nick, avatar, fileid, name, time, me, sent, read, progress, complete, paid) {
      upsertFile(id, toMs(time), asBool(me) ? 'sent' : 'received', fileid, name,
        fileStateFrom(me, progress, complete), progress,
        { senderNick: resolveNick(address, nick), senderAddress: address || '' });
    },

    /* FILE transfer progress/complete (chat.js updateFile:1009, keyed by fileid).
     * Update the record + the live row in place (setFileProgress handles the
     * bar AND the progress→complete flip, re-arming the open action). */
    updateFile(fileid, progress, complete) {
      const id = fileIndex.get(String(fileid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateFile: unknown fileid', fileid); return; }
      const prev = rec.fstate;
      const done = asBool(complete) || (Number(progress) || 0) >= 100;
      rec.progress = Number(progress) || 0;
      // BOTH directions tick then flip to complete (Damir F5: outgoing shows
      // progress too — the sender gets per-packet ticks, TransferManager:410).
      rec.fstate = done ? 'complete' : 'progress';
      const row = rows.get(id);
      // setFileProgress mutates a row that is ALREADY in 'progress' (bar tick +
      // the progress→complete flip). A structural change (offer→progress etc.)
      // has no track to grow, so rebuild the row from the model instead.
      if (row && prev === 'progress') setFileProgress(row, rec.progress, { state: rec.fstate });
      else renderLog();
      // slick completion cue for OUTGOING transfers (Damir F5): a one-shot success
      // toast the moment a sent file finishes (the bar + open button carry the rest).
      if (done && prev !== 'complete' && rec.direction === 'sent' && !rec.sentToastShown) {
        rec.sentToastShown = true;
        showToast({ text: (window.SL && window.SL.fileSent) || 'File sent', tone: 'success', host: overlayHost, strings: window.SL || {} });
      }
    },

    // CALL event (chat.js addCall:1496): (id, text, declined, time). VIEW-ONLY
    // best-effort — see buildCallRow. declined ("True"/"False") = rang out /
    // no answer; an answered call embeds a "(m:ss)" duration in the localized text.
    addCall(id, text, declined, time) {
      const isDeclined = asBool(declined);
      const raw = String(text || '');
      const dur = isDeclined ? '' : ((raw.match(/\((\d+:\d{2})\)/) || [])[1] || '');
      // strip a trailing "(m:ss)" so the label is just the wording; the duration
      // is rendered separately by the card
      const label = raw.replace(/\s*\(\d+:\d{2}\)\s*$/, '').trim();
      upsertCall(id, toMs(time), isDeclined, label, dur);
    },

    // REACTIONS (chat.js addReactions:549) — ;-joined "key:count". Store on the
    // record (so re-renders keep them) + apply to the live row with a pop. The
    // bridge re-emits the FULL list each time, so parse-replace is correct.
    addReactions(id, reactions) {
      const rec = model.get(String(id));
      if (!rec) { dbg('addReactions: unknown', id); return; }
      const parsed = parseReactions(reactions, id);
      rec.reactions = parsed.reactions;
      rec.tip = parsed.tip;
      const row = rows.get(String(id));
      if (row) {
        if (rec.reactions.length || rec.tip) applyRowReactions(rec, row, true);
        else applyReactions(row, { reactions: [] });   // cleared → remove pills
      }
    },
    addContact() { dbg('addContact'); },
    // incoming contact request (xaml:1196) → accept/decline pane above composer
    showContactRequest() { showRequestPane(); },
    // reveal the topbar call action (C# gates when a call is possible, xaml:583)
    showCallButton() { callVisible = true; renderTopbar(); },
    // APP invite/session card (chat.js addAppRequest:1174). appStatus ∈
    // {Missing, Minimized, else} — already enum-shaped. Reuses installApp/joinApp.
    addAppRequest(id, appid, appname, appimage, address, nick, avatar, time, localSender, sent, read, appStatus, appInstallURL) {
      upsertApp(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        appid: appid, name: appname, iconUrl: appimage || null,
        astate: appStateFrom(localSender, appStatus),
        appInstallURL: appInstallURL || '',
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },
    // installed multi-user apps (loadApps, xaml:1088 — addApp(id,name,icon,publisher))
    // → the attach "App invite" picker. icon path doesn't resolve in-shell → omitted.
    addApp(id, name, icon, publisher) { chatApps.push({ id: String(id), name: name || String(id), publisher: publisher || '' }); },
    clearApps() { chatApps.length = 0; },
    addChannelToSelector() { dbg('addChannelToSelector'); },
    setSelectedChannel() { dbg('setSelectedChannel'); },
    setChannelSelectorStatus() { dbg('setChannelSelectorStatus'); },
    // A participant's nick resolved/changed (chat.js:1233). Update every row from
    // that sender address + re-render so their label refreshes. Also store it so
    // later rows from an as-yet-unseen address get the right name on arrival.
    updateGroupChatNicks(address, nick) {
      const addr = String(address || '');
      if (!addr) return;
      groupNicks.set(addr, nick || '');
      let touched = false;
      for (const rec of model.values()) {
        if (rec.senderAddress === addr && rec.senderNick !== (nick || '')) {
          rec.senderNick = nick || '';
          touched = true;
        }
      }
      if (touched) renderLog();
    },
    showRequestSentModal() { dbg('showRequestSentModal'); },
    // connectivity strip (xaml:1746/1754/1767) — non-empty opens, "" collapses
    showWarning(text) { setWarning(warningBanner, text || ''); },
  };

  bridge.exposeAll(handlers);

  // Do NOT paint the empty log now — that produced a spinner → empty-notice →
  // full-conversation sequence (the residual flicker Damir felt after the burst
  // gate). Instead the BOOT SPINNER stays until the first real render:
  // onChatScreenLoaded paints the whole history in ONE go. A short fallback
  // (armed at ready) covers a brand-new empty chat or a missing signal so the
  // spinner never sticks — but never paints mid-burst (guarded on !bursting).

  /* —— scroll-to-latest affordance (appears when scrolled up) ——————————————— */
  const stl = createScrollToLatest({ target: box });
  box.closest('.c-chat-canvas').append(stl);

  /* —— composer (JS→C# emits) ——————————————————————————————————————————————
   * send  → ixian:chat:<encodeURIComponent(text)>  (legacy chat.js:409 — chat
   *         text is the ONE ixian verb that is URI-encoded; native.js otherwise
   *         composes raw, so we encode here and hand bridge.send the whole cmd).
   * typing → ixian:typing, throttled to >1s like legacy (chat.js:423). Legacy
   *         suppresses typing in group chats; mirror that.
   * After send we clear locally for snappiness; C# also echoes clearInput. */
  /* —— composer drafts (CH7). Persist the UNSENT composer text to localStorage
   * keyed by peer address so it survives leaving/returning to the chat, and the
   * chats list (home.html, same Resources/Raw/html origin) can show a "Draft: …"
   * excerpt. A draft is the user's own unsent text (not message history) →
   * SECURITY.md-OK to cache; cleared on a successful send. Fail-soft if
   * localStorage is unavailable. Keyed on identity.address, which lands via
   * onChatScreenReady BEFORE the composer can be typed into. */
  const DRAFT_PREFIX = 'spixi.draft.';
  let draftRestored = false;
  let draftSaveTimer = 0;
  function draftKey() { return identity.address ? DRAFT_PREFIX + identity.address : ''; }
  function saveDraft(text) {
    const k = draftKey();
    if (!k) return;
    try {
      if (text && text.trim()) localStorage.setItem(k, text);
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function clearDraft() {
    clearTimeout(draftSaveTimer);          // cancel any in-flight debounced save so it can't
    const k = draftKey();                  // resurrect the just-sent text after removeItem (audit race)
    if (!k) return;
    try { localStorage.removeItem(k); } catch (_) {}
  }
  /** Restore a saved draft once the peer address is known — but never clobber
   *  text the user already started typing, and only once per page life. */
  function maybeRestoreDraft() {
    if (draftRestored) return;
    const k = draftKey();
    if (!k) return;                              // address not known yet — try again later
    draftRestored = true;
    let saved = '';
    try { saved = localStorage.getItem(k) || ''; } catch (_) {}
    if (!saved) return;
    const input = composerEl && composerEl.querySelector('.c-composer__input');
    if (!input || input.value) return;          // don't overwrite in-progress typing
    input.value = saved;
    input.dispatchEvent(new Event('input'));    // grow + action sync; isTrusted=false → no spurious ixian:typing
  }

  let composerEl = null;
  let lastTypingSent = 0;
  composerEl = createComposer({
    placeholder: (window.SL && window.SL.chatPlaceholder) || 'Message',
    voice: false,
    onSend: (text) => {
      if (!text) return;
      bridge.send('ixian:chat:' + encodeURIComponent(text));
      clearDraft();                                   // sent → drop the saved draft (CH7)
      // composer already clears its own field on send; this is belt-and-braces.
    },
    onTyping: () => {
      if (mode.isMulti) return;                       // legacy: no typing in groups
      const now = Date.now();
      if (now - lastTypingSent > 1000) {              // >1s throttle (chat.js:423)
        lastTypingSent = now;
        bridge.send('ixian:typing');
      }
    },
    // ⊕ attach: redesigned attach sheet (tile grid) replacing the legacy native
    // attach bar. Routes to the existing verbs — nothing invisible.
    onAttach: () => openAttach(),
  });
  document.getElementById('chat-composer').append(composerEl);

  /* Save the draft as the user types (debounced ~400ms). Only genuine typing
   * (isTrusted) persists — a synthetic restore/clear event must not re-write.
   * flushDraft() writes immediately on blur / page-hide so leaving the chat
   * within the debounce window never drops the last keystrokes (audit). */
  {
    const input = composerEl.querySelector('.c-composer__input');
    if (input) {
      const flushDraft = () => { clearTimeout(draftSaveTimer); saveDraft(input.value); };
      input.addEventListener('input', (e) => {
        if (!e.isTrusted) return;
        clearTimeout(draftSaveTimer);
        const v = input.value;
        draftSaveTimer = setTimeout(() => saveDraft(v), 400);
      });
      input.addEventListener('blur', flushDraft);
      // WebView back/navigation away → persist the in-progress draft now.
      window.addEventListener('pagehide', flushDraft);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
    }
  }

  /* Put the caret in the composer so the user can type on entry without tapping
   * (Damir). Called from onChatScreenLoaded; guarded so a missing input or a
   * non-focusable state (e.g. a modal open) never throws. */
  function focusComposer() {
    try {
      const input = composerEl && composerEl.querySelector('.c-composer__input');
      if (input) input.focus();
    } catch (_) {}
  }

  /* —— page ready — fire ixian:onload AFTER the document fully loads, matching
   *    the legacy onload() timing (spixi.js:88 → window load). Firing it
   *    synchronously during parse raced C#'s conversation push: the first entry
   *    could arrive empty and only a manual refresh fixed it. Deferring to the
   *    window 'load' event makes C# push setChatMode/setNickname/addMe/addThem at
   *    the right time, so the conversation populates on first open. ———————————— */
  function signalReady() {
    bridge.ready();
    // Fallback: if nothing has painted shortly after ready (brand-new empty chat
    // whose C# skips clearMessages, or a missing onChatScreenLoaded), replace the
    // boot spinner with the current model so it never sticks. Never paints during
    // a load burst (that render is owned by onChatScreenLoaded / the burst safety).
    setTimeout(() => { if (!firstRenderDone && !bursting) renderLogNow(); }, 500);
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
