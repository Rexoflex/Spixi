<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The in-page appearance switch below re-sets the same value. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spixi — Account</title>
<style>
  /* Paint the screen surface IMMEDIATELY (keyed off the head-top data-theme, so
     there's no light<->dark flip while tokens.css + the ~1MB bundle load). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="../styles/components/settings-app.css"><!-- About / How-to takeovers (c-settings-about/-howto/-links) -->
<link rel="stylesheet" href="../styles/components/settings-screens.css"><!-- Chat appearance takeover (6e.2) -->
<link rel="stylesheet" href="../styles/components/settings-backup.css"><!-- Backup sublevel in the pane (#243) -->
<link rel="stylesheet" href="../styles/components/message-bubble.css"><!-- .c-chat-canvas paint for the appearance preview -->

<style>
  /* Production shell: fill the WebView. Internal views (hub = root · danger /
     about / how-to = takeovers) swap client-side inside #settings-root.
     PEER-TAB CHROME: a c-bottomnav (Account active) is added so Account READS as
     a home tab (Damir). SettingsPage is still a standalone PUSHED page (settings
     data is pushed by SettingsPage, not HomePage), so this is an approximation —
     non-Account taps do a best-effort ixian:back (pop to home). Precise-tab
     landing + true in-home integration need BE (be-cutover S11). */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #settings-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #settings-root > * { flex: 1; min-height: 0; }
  #settings-nav { flex: none; }
  /* Desktop (Damir F5 r2, mirrors home.html): the peer-tab nav renders as the
     LEFT RAIL (c-bottomnav--rail variant), first in the row. Mobile untouched. */
  :root[data-desktop] body { flex-direction: row; }
  :root[data-desktop] #settings-nav { order: -1; display: flex; }

  /* —— Account as a PEER PANE (unit 2 #240 · #243 sublevels · #245 placement,
     Damir: "same peer as wallet/apps/chats, NOT a distant pane"): C# pins this
     WebView over the home grid MINUS the rail strip (stage margin — the home
     rail stays visible + live beside us), so the peer-tab chrome here is
     dropped. Inside: the HUB renders in the LIST-column slot (width pushed via
     setPaneMetrics → --sd-master-w, aligned with the native chats column +
     hairline where the pane divider sits) and rows open SUBLEVELS in the
     DETAIL region — the desktop demo layout verbatim. Sublevel content keeps
     the demo grammar (§6d ⑬⑭): 640px cap centered, sheet padding on lifted
     pickers, hugging CTAs. Mobile (no data-pane) is untouched. */
  body[data-pane] #settings-nav { display: none; }
  /* #242 specificity: the desktop rail rule `:root[data-desktop] #settings-nav`
     (1,2,0) BEAT a plain (1,1,1) hide — the pane must always out-rank it. */
  :root[data-desktop] body[data-pane] #settings-nav { display: none; }
  body[data-pane] #settings-root { flex-direction: row; }
  body[data-pane] #settings-root > .sd-master {
    flex: 0 0 var(--sd-master-w, 328px);
    display: flex; flex-direction: column; min-height: 0;
    border-inline-end: 1px solid var(--outline-neutral-03);
  }
  body[data-pane] #settings-root > .sd-detail {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
  }
  body[data-pane] .sd-master > * { flex: 1; min-height: 0; }
  /* #245b (Damir): sublevel TITLE BAR spans the full detail width; only the
     CONTENT below it locks at the demo cap (640px, centered). The screen
     element itself is full-width; every non-topbar child gets the cap. */
  body[data-pane] .sd-detail > * { flex: 1; min-height: 0; width: 100%; }
  body[data-pane] .sd-detail > :not(.sd-empty) > :not(.c-topbar) { width: 100%; max-width: 640px; margin-inline: auto; }
  /* selected hub row while its sublevel is open (#33 desktop selection, #194 tint) */
  body[data-pane] .c-settings__row[aria-current="true"] { background: var(--surface-action-tonal-default); }
  body[data-pane] .c-settings__themes { padding: var(--spacing-16); }
  body[data-pane] .c-settings__opts { padding: var(--spacing-16); }
  body[data-pane] .c-settings-backup__hero > .c-settings-backup__cta { width: auto; min-width: 240px; margin-inline: auto; }
  body[data-pane] .c-settings-backup__adv-box .c-button { width: auto; }
  /* detail empty state (dt-empty grammar, desktop demo §3) */
  .sd-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--spacing-12); color: var(--text-neutral-02); text-align: center; padding: var(--spacing-24);
  }
  .sd-empty svg { color: var(--icon-neutral-02); opacity: var(--opacity-disabled, 0.4); }
  .sd-empty h2 { color: var(--text-neutral-01); margin: 0; }
  .sd-empty p { margin: 0; font-size: var(--font-size-body-sm); max-width: 320px; }
</style>
</head>
<body>
  <div id="settings-root"></div>
  <div id="settings-nav"></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Account/Settings shell — the redesigned settings hub wired to the
   * REAL C# MAUI bridge (native.js in the bundle). SettingsPage.xaml.cs pushes
   * account data via executeUiCommand(fnRef, b64…) against the page globals
   * registered below; taps go back to C# as legacy `ixian:` commands.
   *
   * ARCHITECTURE §5: settings.html is shell #8 (a SEPARATE page, loaded by
   * SettingsPage) — NOT a home tab. The eventual shell absorbs backup/downloads/
   * dev/contributors, but that needs the C# §5 repoint (item 5, deferred): those
   * pages are navigated from HomePage today (HomePage.xaml.cs:312/316/436), NOT
   * from SettingsPage, so this v1 wires ONLY what SettingsPage.onNavigating
   * actually handles. Everything else degrades (rows hidden) — BE gaps logged in
   * docs/be-cutover-brief.md (S-series).
   *
   * Contract source of truth: Spixi/Pages/Settings/SettingsPage.xaml.cs +
   * Resources/Raw/html/settings.html (legacy inline script). Spec:
   * docs/settings-shell-spec.md §2 (bridge grounding).
   *
   * SECURITY.md: no keys/passwords in the WebView. Account/wallet deletes emit
   * INTENT only (ixian:deletea / ixian:delete) — C# runs the LockPage auth gate.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createSettingsHub, createSettingsDanger,
    createSettingsAbout, createSettingsHowTo,
    createSettingsContributors, createSettingsBackup,
    createChatAppearance, setSettingsSaveVisible,
    settingsThemeSheet, settingsOptionSheet, createTopbar,
    createBottomNav, showToast,
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;
  // #228 platform flag (set pre-paint, constant): desktop swaps the peer-tab
  // bottom bar for the LEFT RAIL + drops the topbar back (rail = the exit).
  const isDesktop = document.documentElement.hasAttribute('data-desktop');
  /* PANE MODE (#240 → #243 → #245): C# pushes setPaneMode('1') in onLoad when
   * HomePage hosts this page as the Account PEER PANE (wide window — the stage
   * spans the grid minus the home rail strip, so the rail stays visible+live
   * beside us). Display-only: the shell hides its own peer chrome, renders the
   * HUB in the list-column slot (setPaneMetrics width) and opens Theme/Language/
   * Backup/etc as SUBLEVELS in the detail region — the desktop demo layout.
   * `?pane=1` = browser-preview forcing (the app never passes query strings). */
  let paneMode = new URLSearchParams(location.search).get('pane') === '1';
  if (paneMode) document.body.dataset.pane = '';
  /* #242 (Damir F5 issue 3): X1 turned the post-picker loadAvatar push into a
   * DATA URI, so the old /avatar-tmp/ path sniff never marked a fresh pick dirty
   * → changing ONLY the photo never showed Save. Track the pick explicitly: set
   * on ixian:avatar, consumed by the NEXT loadAvatar push, cleared on remove. */
  let avatarPickPending = false;
  const strings = window.SL || {};
  // Version: setVersion push (S4, SettingsPage.onLoad mirrors LaunchPage:33);
  // SPIXI_ENV seeds it if the generation step injects one.
  let appVersion = (window.SPIXI_ENV && window.SPIXI_ENV.version) || '';

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const root = document.getElementById('settings-root');

  /* —— account state — flushed by SettingsPage.onLoad after ixian:onload ————————
   * SettingsPage pushes: setNickname · setAppearance · setLockEnabled ·
   * showRemoveAvatar(conditional) · loadAvatar · setVersion (S4) · setAddress (S1) ·
   * setLanguage (S3). It does NOT push backup status — that row degrades (BE gap S2). */
  const state = {
    name: '', savedName: '',
    address: '',                 // S1: setAddress push → QR/address block
    theme: 0,                    // ThemeAppearance: 0 automatic · 1 light · 2 dark (ThemeManager.cs:9)
    lockEnabled: false,
    avatarSrc: null, hasCustomAvatar: false,
    language: 'en-us',           // setLanguage push (S3) overrides; default until it lands
    dirtyNick: false,            // nick edited since last save → persist on exit (ixian:save pops, §2)
    dirtyAvatar: false,          // avatar-tmp picked → needs promotion on exit (applyAvatar)
    // r3 (Damir F5: "lock toggle doesn't persist"): ixian:lock:on|off only flips
    // SettingsPage's in-memory field — Preferences.Set("lockenabled") happens ONLY
    // in onSaveSettings (:249). So a lock toggle is DIRTY: Save appears and any
    // exit routes through ixian:save (theme/language persist immediately C#-side,
    // which is why only lock was lost).
    dirtyLock: false,
  };

  /* Legacy lang-data codes (settings.html:69-81) — MUST match SpixiLocalization
   * .loadLanguage(), so use these exact codes, NOT the demo's variants. FE ships
   * the list at build time (BE gap §8-4). Flags are emoji stand-ins (SVG later). */
  const LANGS = [
    { code: 'en-us', label: 'English', flag: '🇺🇸' },
    { code: 'cn-cn', label: '中文', flag: '🇨🇳' },
    { code: 'es-co', label: 'Español', flag: '🇨🇴' },
    { code: 'de-de', label: 'Deutsch', flag: '🇩🇪' },
    { code: 'fr-fr', label: 'Français', flag: '🇫🇷' },
    { code: 'it-it', label: 'Italiano', flag: '🇮🇹' },
    { code: 'pt-br', label: 'Português (Brasil)', flag: '🇧🇷' },
    { code: 'ru-ru', label: 'Русский', flag: '🇷🇺' },
    { code: 'id-id', label: 'Bahasa Indonesia', flag: '🇮🇩' },
    { code: 'ja-jp', label: '日本語', flag: '🇯🇵' },
    { code: 'lt-lt', label: 'Lietuvių', flag: '🇱🇹' },
    { code: 'sl-si', label: 'Slovenščina', flag: '🇸🇮' },
    { code: 'sr-sp', label: 'Srpski', flag: '🇷🇸' },
  ];

  /* —— theme —————————————————————————————————————————————————————————————————
   * The redesign swaps the token theme via data-theme (no page reload needed),
   * but C# STILL reloads settings.html on ixian:appearance (SettingsPage:178) —
   * we apply locally for instant feedback; the reload re-pushes setAppearance. */
  // 'Auto' resolves to the C#-injected boot theme (the app's own resolution of the
  // OS scheme), captured before any applyTheme call — NOT to this WebView's
  // matchMedia, whose prefers-color-scheme can disagree with the app theme
  // (Damir F5: Account rendered light while the whole app was dark).
  const bootTheme = document.documentElement.dataset.theme || '';
  function applyTheme(idx) {
    const r = document.documentElement;
    if (idx === 1) r.dataset.theme = 'light';
    else if (idx === 2) r.dataset.theme = 'dark';
    else r.dataset.theme = bootTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    // PERSIST the choice so EVERY other shell (same Resources/Raw/html origin)
    // adopts it at boot — the redesigned shells otherwise read only the OS scheme,
    // so a light/dark pick "stayed on Account" (Damir F5). idx 0 = auto → shells
    // fall back to the OS scheme. Written on the C# setAppearance push + on a pick.
    try { localStorage.setItem('spixi.appearance', String(idx)); } catch (e) {}
  }
  // Boot: the head-top script already resolved data-theme (C#-substituted theme
  // name when running in the app; localStorage/OS in the browser demo). The old
  // applyTheme(0) here forced the OS scheme AND clobbered the persisted pick with
  // '0' until C#'s setAppearance landed — a light-app/dark-OS boot flip. The C#
  // setAppearance push (onLoad) and user picks still applyTheme + persist below.

  /* —— chat appearance (6e.2 / #147 flag closing) — FE-ONLY prefs, no bridge.
   * Persisted to localStorage (same Resources/Raw/html origin); the CONSUMER is
   * chat.html, which reads both keys at boot and sets the root vars (nothing in
   * THIS document paints a chat canvas — the takeover preview self-sets its own
   * vars). The stored pattern value is the LIGHT-scale pick (PATTERN_LEVELS);
   * dark chat derives its intensity as v × 0.36 (0.18/0.5 — keeps the #76
   * theme-tuned ratio, Standard = both theme defaults). Clamped on read so a
   * corrupted value can't blow up bubble text. */
  const CHAT_PREFS = { pattern: 'spixi.chat.pattern', textScale: 'spixi.chat.textscale' };
  function readChatPrefs() {
    let pattern = 0.5, textScale = 1;   // #76 locked default · scale M
    try {
      const p = parseFloat(localStorage.getItem(CHAT_PREFS.pattern));
      if (!isNaN(p)) pattern = Math.min(1, Math.max(0, p));
      const t = parseFloat(localStorage.getItem(CHAT_PREFS.textScale));
      if (!isNaN(t)) textScale = Math.min(1.5, Math.max(0.8, t));
    } catch (e) {}
    return { pattern, textScale };
  }

  /* —— exit — the ONLY persist path is ixian:save, which persists nick + promotes
   * avatar-tmp + broadcasts AND pops the page (SettingsPage.onSaveSettings:221).
   * So per-row edits to nickname/avatar are held locally and committed on exit;
   * everything else (theme/language/lock) rides its own immediate verb. Clean
   * exit (no local edits) = ixian:back (discards any stray avatar-tmp). Mirrors
   * legacy Save-vs-Back semantics with the frozen bridge. */
  // Single-fire exit latch. The topbar Save, the topbar/hardware Back and the peer
  // bottom-nav ALL terminate this page (C# pops on ixian:save AND ixian:back). Once
  // any of them fires, a second exit verb is suppressed AND pending hub rebuilds are
  // dropped (scheduleRebuild bails) — a stray second verb or an rAF rebuild landing
  // mid-pop was the flicker our code contributed on Save (#199). The empty-Apps
  // landing after the pop is a HomePage boot-tab problem (home agent), not ours.
  let exiting = false;
  function exitSettings() {
    if (exiting) return;
    exiting = true;
    const dirty = state.dirtyNick || state.dirtyAvatar || state.dirtyLock;
    bridge.send(dirty ? 'ixian:save:' + state.name : 'ixian:back');
  }
  // Explicit Save (topbar check): persist + pop, exactly ONCE, with NO success morph —
  // the C# page pop IS the confirmation (a morph would flash before the teardown).
  function commitSave() {
    if (exiting) return;
    // S14 (BE, gated OFF until C# lands ixian:apply): save WITHOUT popping — persist
    // nick + promote avatar-tmp, STAY on the page, confirm with a topbar "Saved" morph
    // + toast (Damir 2026-07-08). Built + ready; bridge.cap('settingsApply') is false
    // today, so we fall through to the frozen-bridge persist-and-pop below.
    if (bridge.cap('settingsApply')) {
      bridge.send('ixian:apply:' + state.name);
      state.dirtyNick = false; state.dirtyAvatar = false; state.dirtyLock = false;
      if (hubEl && hubEl.showSaved) hubEl.showSaved();
      // let the "Saved" morph play, then the clean hub hides Save again
      setTimeout(syncSave, 1700);
      showToast({ text: strings.settingsSaved || 'Settings saved', tone: 'success', host: document.body, strings });
      return;
    }
    // frozen-bridge fallback: persist + pop, exactly once (the C# page pop = confirm).
    exiting = true;
    bridge.send('ixian:save:' + state.name);
  }

  /* —— views ——————————————————————————————————————————————————————————————————
   * Two presentations, ONE view state (#245):
   *   mobile takeover (no data-pane): the current view replaces #settings-root.
   *   peer pane (data-pane): hub = the LIST-column slot, sublevel = the DETAIL
   *     region ('hub' = detail empty; a sublevel's back EMPTIES the detail).
   * Screens are stateless builders. */
  let hubEl = null, currentView = 'hub';

  const masterWrap = document.createElement('div');
  masterWrap.className = 'sd-master';
  const detailWrap = document.createElement('div');
  detailWrap.className = 'sd-detail';
  let emptyEl = null;

  // detail empty state — dt-empty grammar (desktop demo §3)
  function getEmpty() {
    if (emptyEl) return emptyEl;
    emptyEl = document.createElement('div');
    emptyEl.className = 'sd-empty';
    try {
      const ic = window.SpixiIcons && window.SpixiIcons.icon;
      if (ic) emptyEl.append(ic('user-circle', { size: 64 }));
    } catch (e) {}
    const h = document.createElement('h2');
    h.className = 't-heading-sm';
    h.textContent = strings.account || 'Account';
    const p = document.createElement('p');
    p.textContent = strings.settingsEmptyHint || 'Choose a setting on the left';
    emptyEl.append(h, p);
    return emptyEl;
  }

  // selected hub row while its sublevel is open (aria-current + tint, CSS above)
  function markSelected(view) {
    for (const r of masterWrap.querySelectorAll('.c-settings__row[aria-current]')) {
      r.removeAttribute('aria-current');
    }
    if (view) {
      const r = masterWrap.querySelector('.c-settings__row[data-setting-key="' + view + '"]');
      if (r) r.setAttribute('aria-current', 'true');
    }
  }

  function renderLayout() {
    if (exiting) return;                           // no re-render once the page is exiting
    if (!hubEl) { hubEl = buildHub(); syncSave(); }
    if (paneMode) {
      if (hubEl.parentNode !== masterWrap) masterWrap.replaceChildren(hubEl);
      if (masterWrap.parentNode !== root) root.replaceChildren(masterWrap, detailWrap);
      detailWrap.replaceChildren(currentView === 'hub' ? getEmpty() : buildScreen(currentView));
      markSelected(currentView === 'hub' ? null : currentView);
    } else {
      root.replaceChildren(currentView === 'hub' ? hubEl : buildScreen(currentView));
    }
  }

  function buildHub() {
    return createSettingsHub({
      name: state.name,
      address: state.address,      // S1: setAddress push → QR + address chip (#147 marquee)
      avatarSrc: state.avatarSrc,
      hasCustomAvatar: state.hasCustomAvatar,
      theme: state.theme,
      languages: LANGS,
      language: state.language,
      lockEnabled: state.lockEnabled,
      backup: {},                  // S2: no backup-status signal → standing "Action needed" nudge (spec §8-1)
      version: appVersion,         // S4: setVersion push → hub Version row (spec §8-3)
      // Gates: downloads/dev/change-password + notifications/privacy/security/
      // payment rows stay OFF (no SettingsPage verb — be-cutover S-series).
      // Contributors UN-GATED (#240): the screen is STATIC component data — the
      // S10 open-verb was only ever needed to reach the separate ContributorsPage,
      // which an in-shell view doesn't touch.
      capabilities: { contributors: true },
      host: document.body,
      strings,
      // Mobile: standalone pushed page → topbar back. Desktop (Damir F5 r2): NO
      // back button — the rail is the exit (any non-Account rail tap routes
      // through exitSettings, saving held edits on the way out).
      onBack: isDesktop ? undefined : exitSettings,

      // Save (Damir, legacy parity) — explicit commit + pop via the single-fire
      // latch. ixian:save persists nick + language + lock + promotes avatar-tmp,
      // THEN pops the page (§2). Fires exactly once; no local re-render/morph.
      onSave: commitSave,

      // About / How to use / Contributors — STATIC in-hub views, zero-C# (no bridge verb).
      onAbout: showAbout,
      onHowTo: showHowTo,
      onContributors: showContributors,

      // Chat appearance — FE-only takeover (6e.2): pattern intensity + text size,
      // persisted to localStorage; chat.html applies at boot. Zero-C#.
      onChatAppearance: showChatAppearance,

      // Share address (6e.2, #148⑤ row beside copy) — OS share sheet where the
      // WebView exposes it (navigator.share), else clipboard + toast. No bridge
      // verb exists (§9 wallet-receive precedent) — zero-C# by design.
      onShare: shareAddress,

      // nickname — held local; empty is blocked by the component (legacy ixian:error).
      // Persisted on exit via ixian:save (immediate save would pop the page).
      onNickname: (nick, ctrl) => { state.name = nick; state.dirtyNick = nick !== state.savedName; ctrl.done(); syncSave(); },

      // avatar pick — opens the native C# picker (ixian:avatar → loadAvatar(tmp) push).
      // Close the sheet keeping the current tile; the tmp arrives via loadAvatar and
      // is promoted on exit. NOTE: avatar file paths don't resolve in the self-contained
      // shell yet (repo-wide flag) → the tile shows the deterministic gradient fallback.
      onAvatarChange: (ctrl) => { avatarPickPending = true; bridge.send('ixian:avatar'); ctrl.done({ src: state.avatarSrc || null }); },
      // avatar remove — immediate C#-side (deleteOwnAvatar) → pushes showRemoveAvatar('0') + default loadAvatar.
      // Clear dirtyAvatar: a prior pick left avatar-tmp.jpg on disk; without this, exit would
      // ixian:save → applyAvatar() promotes that leftover tmp and RESURRECTS the removed avatar.
      onAvatarRemove: (ctrl) => { bridge.send('ixian:remove'); avatarPickPending = false; state.avatarSrc = null; state.hasCustomAvatar = false; state.dirtyAvatar = false; ctrl.done(); syncSave(); },

      // theme — apply locally for instant feedback, then the legacy verb (C# reloads the page).
      onTheme: (index, ctrl) => { applyTheme(index); bridge.send('ixian:appearance:' + index); ctrl.done(); },
      // #242/#243 (Damir): in the pane, Theme/Language open as SUBLEVEL screens
      // like every other row — the sheets stay for mobile.
      onThemeNav: () => { if (!paneMode) return false; showTheme(); return true; },
      onLanguageNav: () => { if (!paneMode) return false; showLanguage(); return true; },
      // language — persists + reloads C#-side. i18n gap: the reloaded shell reads its
      // OWN bundled dictionary (en-us here), so the settings UI won't re-render in the
      // picked locale until the holistic i18n live-locale pass (CLAUDE.md). The choice
      // DOES persist app-wide and translates the legacy/native surfaces. (BE gap S5)
      onLanguage: (code, ctrl) => { state.language = code; bridge.send('ixian:language:' + code); ctrl.done(); },

      // app lock — ON optimistic; OFF also optimistic here (matches legacy): the frozen
      // bridge only CONFIRMS a successful OFF (setLockEnabled('False') on auth success)
      // and gives NO signal on auth cancel, so the spec's pending-OFF security UX would
      // wedge the spinner. Optimistic-OFF self-heals from the setLockEnabled push / next
      // load. Ideal pending-OFF needs a C# auth-cancel signal (BE gap S6).
      // r3: a toggle is only persisted by onSaveSettings → mark dirty (Save shows,
      // exit saves). OFF still runs the C# LockPage auth first; a canceled auth
      // leaves the C# field unchanged, so the save is a harmless no-op then.
      onLock: (next, ctrl) => { bridge.send('ixian:lock:' + (next ? 'on' : 'off')); ctrl.done(); state.dirtyLock = true; syncSave(); },

      // backup — #243: in the pane it opens as a SUBLEVEL (the same c-settings-backup
      // screen, verbs forwarded by SettingsPage — cap 'backupInline'); mobile keeps
      // the BackupPage push. The cap also keeps an old exe on the safe push path.
      onBackup: () => {
        if (paneMode && bridge.cap('backupInline')) { showBackup(); return; }
        bridge.send('ixian:backup');
      },

      // change wallet password — GATED OFF (capabilities.changePassword absent): no
      // SettingsPage verb opens EncryptionPassword (bridge-audit-B §1/§3). The
      // settings_encryption.html shell exists + is wired; wire this + flip the flag
      // when BE adds the nav verb (be-cutover S7). Emits the candidate verb so it's
      // ready — inert today (SettingsPage doesn't dispatch it, and the row is hidden).
      onChangePassword: () => bridge.send('ixian:encpass'),

      onDanger: showDanger,
    });
  }

  // Save shows ONLY with unsaved changes (Damir F5 r2) — dirty lives in the
  // shell, so every dirty flip routes through here (rebuilds re-derive it too).
  function syncSave() {
    if (hubEl) setSettingsSaveVisible(hubEl, !!(state.dirtyNick || state.dirtyAvatar || state.dirtyLock));
  }

  function rebuildHub() {
    const prevBody = hubEl && hubEl.querySelector('.c-settings__body');
    const top = prevBody ? prevBody.scrollTop : 0;
    hubEl = buildHub();
    syncSave();
    if (paneMode) {
      // the hub column is always mounted; keep the open sublevel + its selection
      masterWrap.replaceChildren(hubEl);
      markSelected(currentView === 'hub' ? null : currentView);
      const nb = hubEl.querySelector('.c-settings__body');
      if (nb) nb.scrollTop = top;
    } else if (currentView === 'hub') {
      root.replaceChildren(hubEl);
      const nb = hubEl.querySelector('.c-settings__body');
      if (nb) nb.scrollTop = top;
    }
  }

  // Coalesce the onLoad burst (setNickname + setAppearance + setLockEnabled +
  // showRemoveAvatar + loadAvatar all fire synchronously) into ONE hub build.
  let rebuildQueued = false;
  function scheduleRebuild() {
    if (exiting || rebuildQueued) return;          // no rebuild once the page is exiting (flicker guard, #199)
    rebuildQueued = true;
    requestAnimationFrame(() => { rebuildQueued = false; if (!exiting) rebuildHub(); });
  }

  // View switches — one-liners into the mode-aware renderer (#240). showHub as a
  // screen's onBack = "detail → empty" in split mode, "takeover → hub" otherwise.
  function showHub() { currentView = 'hub'; renderLayout(); }
  function showDanger() { currentView = 'danger'; renderLayout(); }
  function showAbout() { currentView = 'about'; renderLayout(); }
  function showHowTo() { currentView = 'howto'; renderLayout(); }
  function showChatAppearance() { currentView = 'chatappearance'; renderLayout(); }
  function showContributors() { currentView = 'contributors'; renderLayout(); }
  function showTheme() { currentView = 'theme'; renderLayout(); }          // #242/#243: pane-mode sublevels (hub routes them)
  function showLanguage() { currentView = 'language'; renderLayout(); }
  function showBackup() { currentView = 'backup'; renderLayout(); }        // #243: pane + backupInline cap only

  // #242: detail-screen chrome for the inline pickers — same view topbar + body
  // grammar as the component screens; back = showHub (split: empties the detail).
  function pickerScreen(title, content) {
    const el = document.createElement('div');
    el.className = 'c-settings';
    el.append(createTopbar({ variant: 'view', title, onBack: showHub }));
    const body = document.createElement('div');
    body.className = 'c-settings__body u-scroll';
    body.append(content);
    el.append(body);
    return el;
  }

  /* Screen builders (stateless — rebuilt per open/mode-flip):
   * · danger — all four deletes are fire-and-forget INTENT: ctrl.done() dismisses
   *   the FE confirm; C# takes over (native alert for history/downloads; LockPage
   *   auth for account/wallet — presents FULL-WINDOW via the overlay-host fallback,
   *   #229/#230, even while this page is a pane). On a successful account delete
   *   C# re-runs onLoad → the hub rebuilds; a wallet delete tears the page down.
   * · about — static, zero-C#; version from the setVersion push (S4). No bridge
   *   verb opens a URL from the WebView → links render as selectable text
   *   (onOpenLink deliberately omitted, be-cutover S13).
   * · howto — static, zero-C#.
   * · contributors — static component data (#240 un-gated; no verb needed).
   * · chatappearance — FE-only (6e.2 / #147): live preview + presets; persists to
   *   localStorage, chat.html consumes at boot (see CHAT_PREFS note above).
   *   KNOWN FLAG: in dark theme the preview shows the light-scale intensity
   *   (component sets raw v); real dark chat renders v × 0.36 — logged (#239 ⓐ). */
  function buildScreen(view) {
    switch (view) {
      case 'danger': return createSettingsDanger({
        host: document.body,
        onBack: showHub,
        onDeleteHistory: (ctrl) => { bridge.send('ixian:deleteh'); ctrl.done(); },     // UNGATED C#-side (spec §8-2)
        onDeleteDownloads: (ctrl) => { bridge.send('ixian:deleted'); ctrl.done(); },
        onDeleteAccount: (ctrl) => { bridge.send('ixian:deletea'); ctrl.done(); },     // C# LockPage auth gate
        onDeleteWallet: (ctrl) => { bridge.send('ixian:delete'); ctrl.done(); },       // C# LockPage auth → shutdown → Launch
        strings,
      });
      case 'about': return createSettingsAbout({
        version: appVersion, host: document.body, strings,
        onBack: showHub,
      });
      case 'howto': return createSettingsHowTo({
        host: document.body, strings,
        onBack: showHub,
      });
      case 'contributors': return createSettingsContributors({
        strings,
        onBack: showHub,
      });
      case 'chatappearance': {
        const prefs = readChatPrefs();
        return createChatAppearance({
          patternOpacity: prefs.pattern,
          textScale: prefs.textScale,
          strings,
          onBack: showHub,
          onPattern: (v) => { try { localStorage.setItem(CHAT_PREFS.pattern, String(v)); } catch (e) {} },
          onTextScale: (v) => { try { localStorage.setItem(CHAT_PREFS.textScale, String(v)); } catch (e) {} },
        });
      }
      // #242/#243: Theme/Language as pane sublevels (the hub routes here via
      // onThemeNav/onLanguageNav only in pane mode). Same commit verbs as the
      // sheets; the picker content is the SAME component in inline mode
      // (stay-open, check moves), wrapped in the view-topbar chrome.
      case 'theme': return pickerScreen(strings.theme || 'Theme',
        settingsThemeSheet({
          current: state.theme, strings, inline: true,
          commit: (v, ctrl) => { applyTheme(v); bridge.send('ixian:appearance:' + v); ctrl.done(); },
          onPicked: (o) => { if (o) { state.theme = o.value; scheduleRebuild(); } },
        }));
      case 'language': return pickerScreen(strings.language || 'Language',
        settingsOptionSheet({
          title: strings.language || 'Language',
          options: LANGS.map((l) => ({ value: l.code, label: l.label, flag: l.flag })),
          current: state.language, strings, inline: true,
          // C# persists + RELOADS settings.html on this verb — the fresh page
          // re-lands on the hub with the new current (S5 i18n note applies).
          commit: (code, ctrl) => { state.language = code; bridge.send('ixian:language:' + code); ctrl.done(); },
        }));
      // #243: Backup as a pane sublevel — the SAME c-settings-backup screen the
      // standalone settings_backup.html shell mounts, with SettingsPage now
      // forwarding the two verbs (cap 'backupInline'; the flow is fire-and-forget,
      // C# owns file paths + the share sheet — S12/S2 notes apply unchanged).
      case 'backup': return createSettingsBackup({
        status: {},                          // S2: no backup-status push → conservative default
        host: document.body,
        // #245b (Damir): the ONE backup illustration everywhere — same asset the
        // create-account/onboarding tail + backup nudge use (build-shells copies
        // src/demo/images → html/images; fail-soft to the shield placeholder).
        illustration: 'images/backup.svg',
        onBack: showHub,
        onBackup: (_payload, ctrl) => { bridge.send('ixian:backupAccount'); ctrl.done(); },
        onExportWallet: (ctrl) => { bridge.send('ixian:backupWallet'); ctrl.done(); },
        strings,
      });
    }
    // unknown view (unreachable — all setters are controlled): degrade safely.
    // NEVER hand hubEl to the detail region (it would steal it from the master).
    return paneMode ? getEmpty() : hubEl;
  }

  // Share own address (6e.2). navigator.share where the WebView exposes it
  // (never assumed — WinUI WebView2 may not); fallback = clipboard + "Copied"
  // toast so the row is never a dead end. Errors (incl. user-cancel) are benign.
  // #235b (Opus review MINOR-2): navigator.clipboard is UNDEFINED on non-secure /
  // older WebView2 origins → `.writeText` threw into a silent catch (no copy, no
  // feedback). Now: guard clipboard existence, fall back to execCommand, and if
  // EVERYTHING fails surface an error toast — the row always gives feedback.
  function execCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }
  function shareAddress({ address }) {
    const addr = address || state.address;
    if (!addr) return;
    if (navigator.share) {
      navigator.share({ text: addr }).catch(() => {});
      return;
    }
    const ok = () => showToast({ text: strings.copied || 'Copied', tone: 'success', host: document.body, strings });
    const fail = () => { if (execCopy(addr)) ok(); else showToast({ text: strings.copyFailed || 'Could not copy', tone: 'error', host: document.body, strings }); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addr).then(ok, fail);
      } else { fail(); }
    } catch (e) { fail(); }
  }

  showHub();   // render immediately; C# fills it after ixian:onload

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers — page globals (executeUiCommand resolves bare
   * fnRefs). SettingsPage.onLoad pushes these; loadAvatar also arrives after the
   * ixian:avatar picker. All coalesce into one hub rebuild.
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    // setNickname(nick) — SettingsPage.onLoad:43
    setNickname(nick) { state.name = nick || ''; state.savedName = state.name; state.dirtyNick = false; scheduleRebuild(); },

    // setAppearance(idx) — onLoad:46; idx = (int)ThemeAppearance
    setAppearance(idx) { const n = parseInt(idx, 10); state.theme = isNaN(n) ? 0 : n; applyTheme(state.theme); scheduleRebuild(); },

    // setLockEnabled(bool.ToString()) — onLoad:52 + lock-off auth resolution (HandleAuthSucceeded:241)
    setLockEnabled(s) { state.lockEnabled = (s === 'True' || s === 'true' || s === true); scheduleRebuild(); },

    // showRemoveAvatar('1'|'0') — onLoad:63 (only when a custom avatar exists) + onRemoveAvatar:411
    showRemoveAvatar(show) { state.hasCustomAvatar = (show === '1' || show === 'true' || show === true); scheduleRebuild(); },

    // loadAvatar(path) — onLoad:66 / after picker:374 / after remove:412. Legacy
    // encodes '/' as '&bsol;' (settings.html:378). A tmp path means a fresh pick →
    // mark dirty so exit promotes it. Path resolution in-shell is the known avatar
    // flag → the tile falls back to a gradient until that's fixed.
    loadAvatar(path) {
      let p = (path || '').replace(/&bsol;/g, '/');
      // DEFAULT sentinel: SettingsPage pushes 'img/spixiavatar.png' when no custom
      // avatar exists (xaml:461). It RESOLVES on WinUI → rendered the LEGACY avatar
      // image instead of the redesign gradient (Damir F5 2026-07-08). Map the default
      // sentinels to null so createAvatar draws the deterministic gradient — same as
      // contact_details' resolveAvatar.
      if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') p = '';
      state.avatarSrc = p || null;
      // Dirty = a fresh pick pending promotion. #242: since X1 this push is a DATA
      // URI (no 'avatar-tmp' in it) — the explicit pick latch decides; the path
      // sniff stays as a fallback for the imageToDataUri raw-path failure mode.
      // Initial load / post-remove default pushes arrive with no pick pending →
      // not dirty, so a stale pick can't get promoted on the next exit.
      if (avatarPickPending && p) {
        state.dirtyAvatar = true;
        avatarPickPending = false;
      } else {
        state.dirtyAvatar = !!p && /avatar-tmp/i.test(p);
      }
      scheduleRebuild();
    },

    // setVersion(version) — S4 (SettingsPage.onLoad, mirrors LaunchPage:33);
    // feeds the hub Version row + the About takeover.
    setVersion(v) { appVersion = v || ''; scheduleRebuild(); },

    // setAddress(address) — S1 (SettingsPage.onLoad). PLAIN identity address (legacy
    // share form, HomePage:322 — no ExtendedAddress _suffix, that's payment-only);
    // used VERBATIM; the component appends ':ixi' for the QR.
    setAddress(addr) { state.address = addr || ''; scheduleRebuild(); },

    // setLanguage(code) — S3 (SettingsPage.onLoad, legacy codes e.g. 'en-us',
    // settings.html:69-81). Fixes the Language row's shown "current" only; the
    // picker always committed correctly. Unknown/empty codes keep the default.
    setLanguage(code) { if (code) { state.language = String(code).toLowerCase(); scheduleRebuild(); } },

    // setPaneMode('1') — unit 2 (#240): HomePage hosts this page as a detail-column
    // PANE (wide window). Arrives in the onLoad burst BEFORE the overlay presents
    // (pushes coalesce ahead of the #225 present), so the pane never flashes the
    // takeover layout; re-pushed by the language-change reload. Display-only.
    setPaneMode(v) {
      const on = (v === '1' || v === 'true' || v === true);
      if (on === paneMode) return;
      paneMode = on;
      if (on) document.body.dataset.pane = '';
      else delete document.body.dataset.pane;
      renderLayout();
    },

    // setPaneMetrics(width) — #245: the hub column's width in CSS px (= the native
    // list column minus the rail strip), so the Account hub aligns with the chats
    // list and its hairline lands where the pane divider sits. Pushed with
    // setPaneMode; guarded against junk.
    setPaneMetrics(w) {
      const n = parseFloat(w);
      if (!isNaN(n) && n >= 200 && n <= 1000) {
        document.documentElement.style.setProperty('--sd-master-w', n + 'px');
      }
    },

    // onExitRequest() — C# asks the pane to close ITSELF (home tab switch, #240):
    // the same save-if-dirty exit as back-from-hub; single-fire latched, so a
    // repeat request while the pop is in flight is a no-op.
    onExitRequest() { exitSettings(); },

    // setCaps('a,b,…') — #242: C# declares which OPTIONAL verbs this build
    // dispatches (SettingsPage.onLoad pushes 'settingsApply' now that ixian:apply
    // exists). Mutates the bridge's capability object IN PLACE — bridge.cap()
    // reads the same reference — so the S14-gated Save-stays path lights up.
    // Shell + C# ship in one commit, but the gate keeps an OLD exe with a NEW
    // shell (or vice versa) from emitting a verb nobody dispatches.
    setCaps(list) {
      String(list || '').split(',').forEach((c) => {
        c = c.trim();
        if (c) bridge.capabilities[c] = true;
      });
    },

    // onBack() — hardware back, routed by HomePage while this page is an overlay
    // (#240; SettingsPage.OnBackButtonPressed when pushed). In any screen (danger /
    // about / how-to / …) back returns to the hub (split: empties the detail);
    // from the hub it exits (save-if-dirty else back).
    onBack() { if (currentView !== 'hub') showHub(); else exitSettings(); },
  };

  bridge.exposeAll(handlers);

  /* —— peer-tab bottom nav (Damir): Account reads as a home tab. Non-Account taps
   * do a best-effort ixian:back (pop SettingsPage → home); precise-tab landing +
   * true in-home integration need BE (HomePage pushing settings data, or a
   * home-tab-select verb) — be-cutover S11. The nav persists across the
   * hub/takeover swaps (it's a sibling of #settings-root). ————————————————————— */
  const NAV_ITEMS = [
    { id: 'chats', label: strings.chats || 'Chats', icon: 'messages' },
    { id: 'apps', label: strings.apps || 'Apps', icon: 'apps' },
    { id: 'wallet', label: strings.wallet || 'Wallet', icon: 'wallet' },
    { id: 'account', label: strings.account || 'Account', icon: 'user-circle' },
  ];
  const nav = createBottomNav({
    items: NAV_ITEMS, active: 'account',
    // Desktop (Damir F5 r2): same LEFT RAIL as the home shell (logo on top) so a
    // FULL-WINDOW Account (narrow desktop window) reads as a peer pane. When C#
    // hosts this page as a real PANE (unit 2 #240, setPaneMode) this whole nav is
    // hidden — home's rail sits beside the pane.
    variant: isDesktop ? 'rail' : undefined,
    logo: isDesktop,
    // Leaving Account = pop back to home. Route through exitSettings (NOT a raw
    // ixian:back) so a held-but-uncommitted nickname / picked avatar is saved on
    // the way out, exactly like the topbar/hardware back (audit m1 — the raw back
    // dropped the edit + let C# delete avatar-tmp).
    // r3 QUIRK fix (Damir: "from Account you always land on whatever tab you left
    // on"): there's still no C# land-on-tab verb (S11), so the TAPPED tab rides
    // localStorage (same origin) — home consumes it via the storage event while
    // it sits under this pushed page (+ a focus fallback). Timestamped so a
    // stranded key can't switch tabs minutes later.
    onChange: (id) => {
      if (id === 'account') return;
      try { localStorage.setItem('spixi.landtab', id + ':' + Date.now()); } catch (e) {}
      exitSettings();
    },
  });
  document.getElementById('settings-nav').append(nav);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s first push, arriving empty until
   *    a manual refresh. ———————————————————————————————————————————————————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
