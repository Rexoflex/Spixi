<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Call</title>
<style>
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);
  /* ★ #46 r2 C1: the ink that rides ON --_fill, intent-switched like every other member of
     this private palette. It used to be --text-neutral-on-action hard-coded at the
     [data-type="fill"] rule, which was right for the default intent and wrong for
     destructive: in dark --surface-destructive-default is --error-300 #f49c92 and the white
     label measured 2.01:1 — the worst reading anywhere in the #46 audit, and the one row
     the census missed. Default intent is unchanged at 6.68:1 on #3050bd (Damir, Session K). */
  --_on-fill: var(--text-neutral-on-action);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  /* ★ #46 r2 C1: dark #131415 on --error-300 #f49c92 = 8.80:1 (was #f9fafb at 2.01:1);
     light #f9fafb on --error-600 #b12525 = 6.36:1, unchanged. State steps hold on the same
     ink: dark hover #f1786e 6.72:1 / pressed #e34540 4.56:1.
     Reversal: delete the --_on-fill declaration below and the destructive fill falls back
     to the base palette (--text-neutral-on-action), i.e. back to 2.01:1 in dark. */
  --_on-fill: var(--text-neutral-on-destructive);
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--_on-fill); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  /* ★ #46 r2 C1: the morph fill is GREEN, never the action blue — in dark --success-300
     #91c69b took the on-action white at 1.87:1. --text-neutral-on-success = 9.45:1 dark /
     5.98:1 light. The !important is the morph overriding any intent, and stays. */
  color: var(--text-neutral-on-success) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/avatar.css">
/* c-avatar — photo or deterministic gradient placeholder (DECISIONS.md #34, #364).
   N1 rework (supersedes #37): JS stamps the anchor INDEX (data-hue 0..11);
   the 12 gradients below are hand-tuned per anchor and serve BOTH themes
   (the c-disc #170 grammar — vivid fill + white ink, mode-agnostic).
   Every pair is computed ≥ 4.5:1 under white ink at BOTH stops (#364 table).
   Recipe: stop1 = hsl(h, 62%, L1) · stop2 = hsl(h+25, 58%, L1−10).

   ★ #591: the same 12 anchors are now reusable OFF an avatar, via `.c-idhue`. The
   contact-details cover is a person's identity colour behind their photo, and it must
   be the SAME colour their gradient avatar would have been — two sources for one
   identity is how they drift apart. Each selector gains one alternative; the values are
   untouched, and `.c-disc[data-hue]` cannot collide because its hues are NAMES
   ('accent', 'info', …) and these are indices. */

.c-avatar[data-hue="0"], .c-idhue[data-hue="0"]  { --av-c1: hsl(0, 62%, 52%);   --av-c2: hsl(25, 58%, 42%);  }
/* ★ Session I (sheet 2b = D; Damir #735: "our avatars seem a bit off"): the three MUDDY
   anchors re-tuned — 1 was olive-brown, 2 brown, 3 a dull green; they now read orange,
   amber and a lifted green (TG's set has no browns). Every stop still ≥ 4.5:1 under
   white ink, measured: 1 → #c35118 4.66 / #a5381d 6.60 · 2 → #ae6113 4.65 / #974e17
   6.14 · 3 → #458226 4.69 / #216327 7.29. Reversal values ride in the trailing comment. */
.c-avatar[data-hue="1"], .c-idhue[data-hue="1"]  { --av-c1: hsl(20, 78%, 43%);  --av-c2: hsl(12, 70%, 38%);  } /* was hsl(22,62%,43%) / hsl(47,58%,33%) */
.c-avatar[data-hue="2"], .c-idhue[data-hue="2"]  { --av-c1: hsl(30, 80%, 38%);  --av-c2: hsl(26, 74%, 34%);  } /* was hsl(40,62%,35%) / hsl(65,58%,25%) */
.c-avatar[data-hue="3"], .c-idhue[data-hue="3"]  { --av-c1: hsl(100, 55%, 33%); --av-c2: hsl(125, 50%, 26%); } /* was hsl(95,62%,31%) / hsl(120,58%,21%) */
.c-avatar[data-hue="4"], .c-idhue[data-hue="4"]  { --av-c1: hsl(135, 62%, 32%); --av-c2: hsl(160, 58%, 22%); }
.c-avatar[data-hue="5"], .c-idhue[data-hue="5"]  { --av-c1: hsl(165, 62%, 31%); --av-c2: hsl(190, 58%, 21%); }
.c-avatar[data-hue="6"], .c-idhue[data-hue="6"]  { --av-c1: hsl(190, 62%, 35%); --av-c2: hsl(215, 58%, 25%); }
.c-avatar[data-hue="7"], .c-idhue[data-hue="7"]  { --av-c1: hsl(215, 62%, 50%); --av-c2: hsl(240, 58%, 40%); }
.c-avatar[data-hue="8"], .c-idhue[data-hue="8"]  { --av-c1: hsl(245, 62%, 58%); --av-c2: hsl(270, 58%, 48%); }
.c-avatar[data-hue="9"], .c-idhue[data-hue="9"]  { --av-c1: hsl(275, 62%, 55%); --av-c2: hsl(300, 58%, 45%); }
.c-avatar[data-hue="10"], .c-idhue[data-hue="10"] { --av-c1: hsl(305, 62%, 47%); --av-c2: hsl(330, 58%, 37%); }
.c-avatar[data-hue="11"], .c-idhue[data-hue="11"] { --av-c1: hsl(335, 62%, 51%); --av-c2: hsl(0, 58%, 41%);   }

.c-avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  border-radius: var(--radius-full);
  /* B5 (#231): container border DROPPED — gradient placeholders go borderless
     (Telegram-class, lighter list rhythm); the hairline moves to the PHOTO img
     only (below) so a light photo still separates from a light surface. Outer
     size unchanged (border-box) → photo and gradient variants render the same
     footprint + identical circular mask. */
  /* N1 (#364): white ink in BOTH themes — the anchor gradients are dark enough
     everywhere (≥ 4.5:1 computed). Literal #fff on purpose, exactly like
     c-disc (base.css): a theme-flipping token here re-breaks dark mode. */
  color: #fff; /* initials/glyph over gradient */
  overflow: visible;
}

/* Known sizes from size tokens (unknown sizes: inline fallback in avatar.js).
   Initials scale ≈ 0.38 × avatar size. */
.c-avatar[data-size="24"] { width: var(--size-avatar-24); height: var(--size-avatar-24); }
.c-avatar[data-size="24"] .c-avatar__initials { font-size: 9px; }
/* ★ Session K (walk J2 T1, the group-sender avatar at --bubble-avatar-size): the three
   sheet sizes get their initials step — the 0.375 ratio the 48 → 18 pair set. 28 / 32 / 36
   are sized inline by createAvatar (no --size-avatar token for them, by design: the bubble
   token is the one home). */
.c-avatar[data-size="28"] .c-avatar__initials { font-size: 11px; }
.c-avatar[data-size="32"] { width: var(--size-avatar-32); height: var(--size-avatar-32); }
.c-avatar[data-size="32"] .c-avatar__initials { font-size: 12px; }
.c-avatar[data-size="36"] .c-avatar__initials { font-size: 13px; }
.c-avatar[data-size="40"] { width: var(--size-avatar-40); height: var(--size-avatar-40); }
.c-avatar[data-size="40"] .c-avatar__initials { font-size: 15px; }
.c-avatar[data-size="48"] { width: var(--size-avatar-48); height: var(--size-avatar-48); }
.c-avatar[data-size="48"] .c-avatar__initials { font-size: 18px; }
/* W2 (#302): 64 = the chat-info HERO. It has rendered at that size since #142 but
   had no rule here at all, so it fell through to avatar.js's inline width/height
   fallback and its initials kept the base font-size instead of the 0.38× scale.
   Sizing stays inline — no --size-avatar-64 token exists yet (flag at the next
   Figma mirror); this pins the initials scale and the hero-scale presence dot. */
.c-avatar[data-size="64"] .c-avatar__initials { font-size: 24px; }
.c-avatar[data-size="64"] .c-avatar__dot { width: 16px; height: 16px; }
/* ★ Session I (sheet 2b = D): the HEROES had no initials rule at all — chat info, contact
   details and Account render at 80, the launch avatar at 96, and every one of them fell
   through to the base font-size, so a hero disc carried a list-sized letter. That was
   a visible part of "our avatars seem a bit off". 0.375× (the 48 → 18 ratio). */
.c-avatar[data-size="80"] .c-avatar__initials { font-size: 30px; }
.c-avatar[data-size="80"] .c-avatar__dot { width: 18px; height: 18px; }
.c-avatar[data-size="96"] .c-avatar__initials { font-size: 36px; }
.c-avatar[data-size="96"] .c-avatar__dot { width: 20px; height: 20px; }

.c-avatar[data-placeholder] {
  /* Fallbacks = anchor 7 (blue): a stale bundle that never stamps data-hue
     still paints a legible gradient instead of a transparent disc.
     ★ Session I (sheet 2b = D): TG-like DEPTH — a soft white highlight at the top-left
     over the pair gradient (160°, was 135°). MEASURED against the #364 floor: the veil
     is 22% at its centre and gone by half the radius, so at the disc centre — where
     the initials sit — it is ≈ 5%, and the lightest re-tuned stop (#c35118, 4.66:1)
     still clears 4.4:1 there under white ink; the 18px+ semibold initials are WCAG
     large text (3:1 floor). The sheet's 28%/55% draft veiled the centre to ≈ 13% and
     failed that arithmetic, so it was dialled down before shipping. */
  background-image:
    radial-gradient(100% 100% at 28% 18%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 50%),
    linear-gradient(160deg,
      var(--av-c1, hsl(215, 62%, 50%)),
      var(--av-c2, hsl(240, 58%, 40%)));
}

.c-avatar__img {
  width: 100%;
  height: 100%;
  border-radius: var(--radius-full);
  border: var(--outline-width-1) solid var(--outline-neutral-02); /* B5 (#231): photos-only hairline */
  object-fit: cover;
}

.c-avatar__initials {
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0;
  user-select: none;
  -webkit-user-select: none; /* WebKit honors only the prefixed form */
}

.c-avatar__dot {
  position: absolute;
  inset-inline-end: 0; /* RTL-logical (audit) */
  inset-block-end: 0;
  width: 12px;  /* sanctioned: dot scale is avatar-relative, not a size token */
  height: 12px;
  border-radius: var(--radius-full);
  background: var(--surface-presence-online);
  /* ring = surface-screen: shows a mismatched halo on hover/selected row surfaces —
     known + accepted for now; proper fix needs a design decision (audit LOW) */
  border: var(--outline-width-2) solid var(--surface-screen);
}

</style>
<style data-src="../styles/components/overlay.css">
/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }
/* ★ Batch E (b) (#557, Damir 2026-08-22): the MOBILE scrim is one level deeper
   (0.6 → 0.7) — the lifted message (#506②) reads better against the darker
   ground. Desktop keeps 0.6 for its centred dialogs; anchored desktop menus
   stay wash-free (#268, [data-dt-clear] below). */
:root:not([data-desktop]) .c-scrim { background: var(--surface-scrim-deep); }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

/* ★★ #608 (device row 5a, iPhone 15) — THE SHEET RISES FOR THE KEYBOARD.
   A bottom sheet is `bottom: 0` of its host, and on iOS the host does NOT shrink under
   the soft keyboard: the whole sheet sat behind it. On the tip sheet only the title row
   stayed visible — the amount chips, the custom-amount field the sheet had just FOCUSED
   itself, and the button that commits the payment were all underneath, on a surface with
   no scroll and no cap, so nothing could reach them. That is also why the keyboard read
   as having "no way out": the scrim you would tap to dismiss it was under the keyboard
   too.
   Three declarations, and every one of them is INERT at `--kb-inset: 0` — no keyboard,
   no change, anywhere in the app:
     · the sheet sits on top of the keyboard instead of behind it;
     · the home-indicator pad is given back while the keyboard covers that strip anyway
       (the same max() the chat composer uses), so the sheet does not float twice;
     · it is capped and scrollable, so a sheet taller than the space that is left can
       still be read to the end rather than being clipped at both ends.
   ⚠ Mobile only. A desktop dialog is centred, has no soft keyboard, and is scoped
   separately further down this file. */
:root:not([data-desktop]) .c-sheet {
  bottom: var(--kb-inset, 0px);
  padding-bottom: calc(var(--spacing-16) + max(0px, env(safe-area-inset-bottom, 0px) - var(--kb-inset, 0px)));
  max-height: calc(100% - var(--kb-inset, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————
   The sheet is z-44 and every scrim is z-40, so a sheet paints above a scrim that
   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.
   The house pattern is "close the sheet, then open the modal". A second quick tap
   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
  /* ★★ E1d (Damir on device, 2026-08-29 — Windows AND mobile): a long URL OVERFLOWS the
     dialog. The external-link confirm (#82, chat.html confirmOpenLink) puts the raw URL in
     this slot as its body, and a URL is ONE unbroken token — no spaces, and a query string
     or a `#fragment` gives the line breaker nothing to work with. The modal is capped at
     360px, so the text ran straight past the rounded corner on both platforms.
     ⚠ `anywhere`, not `break-word`: `overflow-wrap: break-word` only breaks BETWEEN
     opportunities and still refuses to split a single long token in several engines, which
     is exactly the case here. `anywhere` breaks only when the line would otherwise overflow,
     so ordinary body copy in every other modal is untouched — it is not `word-break:
     break-all`, which would hyphen-less-chop normal sentences too.
     ★ This slot is shared by every modal body, which is why the fix belongs here and not in
     the link dialog: the same overflow waits for any long token — a wallet address, a
     file name, a base58 transaction id — and those are all things this app puts in dialogs. */
  overflow-wrap: anywhere;
}

.c-modal__actions {
  display: flex;
  /* ★ Batch B/C loop r1 M-1 (2026-08-24): WRAP. A long localized confirm label
     ("Supprimer le compte", "Отменить приглашение") overflowed the fixed pair —
     nowrap labels + flex-basis 0 + min-width:auto has no out. Wrapping drops the
     long action onto its own full-width row (the remove-contact sheet's answer);
     short pairs render exactly as before. */
  flex-wrap: wrap;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②). ⚠ NO min-width:0 here — loop r2 R2-1: with flex-basis 0 a used min of 0 makes every item's hypothetical size 0, so the wrap above could NEVER fire; min-width:auto (the label's min-content) is what trips it. Measured in Chrome: with auto, the long confirm wraps to its own full row; with 0 it spilled 43px past its button */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 220px; padding: var(--spacing-8); }   /* ★ Session I (sheet 6 + Damir's Windows walk: "quite substantial") — was min-width 260, padding 12/16/16 */
/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source
   highlight is RETUNED — the SELECTED tint read as a selection state on the
   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".
   ⚠ loop E-4 (r2): :not([aria-current]) is LOAD-BEARING — this (0,3,0) shorthand
   would otherwise REPLACE the OPEN conversation's tonal selected paint (0,2,0)
   in the desktop split view, visually deselecting the row under its own menu.
   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
/* ★ Session K: the rule is no longer desktop-scoped — the apps ⋯ dropdown clears its wash on
   mobile too (Damir: "shouldn't dim at all"). The tag keeps its name; one grammar. */
.c-scrim[data-dt-clear],
:root:not([data-desktop]) .c-scrim[data-dt-clear] { background: transparent; }   /* the second selector out-specifies the mobile deep wash (line 19, (0,3,0)) */

/* ═════════ MOBILE anchored dropdown (Batch E (a), #557, Damir 2026-08-22) ═════════
   The message menu + the chats-row menu present as a DROPDOWN anchored to the
   pressed row (desktop-anchors.js anchorSheetToRow sets the tag + inline
   left/top/width). Placement prefers ABOVE the row, so the menu can never cover
   the message it acts on — the 4.1 fix, structural. Everything else about the
   overlay is UNCHANGED: same z-44 (above the z-42 lifted row, #506②), same scrim
   (one level deeper here, (b) above), same focus/Esc/stack grammar, and the
   `:not([data-open])` pointer-events rule still covers the fade windows.
   Enter/exit = FADE IN PLACE (the desktop [data-dt-anchor] rule): a panel that
   slid from the bottom edge to mid-screen would point at the wrong origin. */
:root:not([data-desktop]) .c-sheet[data-m-anchor] {
  left: auto; right: auto; bottom: auto;
  margin: 0;
  max-width: none;
  border-radius: var(--radius-16);
  padding: var(--spacing-8) var(--spacing-12) var(--spacing-12);
  /* ★ loop E-1 (r2): the dropdown must never leave the SAFE region or outgrow the
     host — a menu taller than the screen with the body scroll locked is
     unreachable UI, and a clamp to y=8 puts the react row under the Dynamic
     Island (the #288 inset class). The height cap makes the menu its own
     scroller; the JS clamp (anchorSheetToRow) keeps top ≥ safe-top + 8. */
  max-height: calc(100% - var(--safe-top, 0px) - env(safe-area-inset-bottom, 0px) - 2 * var(--spacing-8));
  overflow-y: auto;
  transform: none;
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-decelerate);
}
:root:not([data-desktop]) .c-sheet[data-m-anchor][data-open] { transform: none; opacity: 1; }
:root:not([data-desktop]) .c-sheet[data-m-anchor] .c-sheet__handle { display: none; }

/* c-callin — incoming call overlay (#86): identity on top of the scrim,
   three labeled action circles. Call layer (z-60, above modals like the
   callbar it hands over to). */

.c-callin {
  position: absolute;
  inset: 0;
  z-index: var(--z-60);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-inline: var(--spacing-24);
  /* iOS edge-to-edge: the full-window ring (CallPage) bleeds under the status bar +
     home indicator — keep identity/actions clear of both. env() = 0 elsewhere. */
  padding-top: var(--safe-top, 0px);   /* ★ AND-7 */
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface-scrim); /* + overlay scrim ⇒ near-black stage */
}

/* halves composition (Damir): identity centers in the TOP half, actions
   center in the BOTTOM half — each flexes to 50% and centers its content */
.c-callin__identity {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  text-align: center;
}
/* ringing pulse — decorative; finite tokens don't fit a ring, so guard it */
.c-callin__avatar {
  position: relative;
  display: flex;
  border-radius: var(--radius-full);
}
.c-callin__avatar::before {
  content: '';
  position: absolute;
  inset: calc(-1 * var(--spacing-8));
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid var(--surface-wash-on-hero-pressed);
  animation: c-callin-pulse calc(var(--duration-300) * 5) var(--easing-standard) infinite;
}
@keyframes c-callin-pulse {
  0% { transform: scale(0.85); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: scale(1.25); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-callin__avatar::before { animation: none; opacity: 0.6; transform: none; }
}

/* ═════ DESKTOP presentation (#264, Damir: "optimize the call UI on desktop") —
   FE half only: the ring still covers just THIS WebView (one pane's DOM cannot
   cover another — ★ #221); TRUE full-viewport coverage rides the C18(a)
   broadcast (every visible pane rings at once). Here: the phone-shaped
   halves composition reads stretched in a wide pane → compress the identity/
   actions into a centered COLUMN card rhythm with a width cap. */
:root[data-desktop] .c-callin { justify-content: center; }
:root[data-desktop] .c-callin__identity {
  flex: 0 0 auto;
  padding-bottom: var(--spacing-32, 32px);
}
:root[data-desktop] .c-callin__actions {
  flex: 0 0 auto;
  width: min(420px, 100%);
}
.c-callin__name {
  font-family: var(--font-primary);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-on-scrim);
}
.c-callin__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-on-scrim);
  opacity: 0.72; /* sanctioned: muted-on-scrim, no dedicated token yet */
}

.c-callin__actions {
  flex: 1;
  display: flex;
  align-items: center; /* vertical center of the bottom half */
  justify-content: center;
  gap: var(--spacing-32);
}
.c-callin__action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-8);
}
.c-callin__circle {
  width: 56px;  /* button/56 scale */
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-full);
  /* ★ #46 r2 C1: a fallback only — every kind below sets its own ink, because none of the
     three circles is --surface-action-default. Kept so a new kind is never inkless. */
  color: var(--icon-neutral-on-action);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--duration-100) var(--easing-decelerate),

@media (hover: hover) and (pointer: fine) {
  .c-callin__circle:hover { transform: scale(1.06); }
}
.c-callin__circle:active { transform: scale(0.96); }
/* freeze audit: on-scrim focus ring (see media-viewer note) */
.c-callin__circle:focus-visible { outline-color: var(--icon-on-scrim); }
/* ★ #46 r2 C1: green and red fills, not the action blue. In dark the inherited on-action
   white glyph measured 1.87:1 on --success-300 #91c69b and 2.63:1 on --error-400 #f1786e.
   The role inks give 9.45:1 / 6.72:1 dark and 5.98:1 / 6.36:1 light. Fills unchanged.
   Reversal: delete the two color declarations and the glyphs fall back to the 1.87/2.63 white. */
.c-callin__circle[data-kind="accept"] { background: var(--surface-success); color: var(--icon-neutral-on-success); }
.c-callin__circle[data-kind="decline"] { background: var(--surface-error); color: var(--icon-neutral-on-error); }

.c-callin__label {
  font-size: var(--font-size-label-sm);
  line-height: var(--line-height-label-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-on-scrim);
}

<style data-src="../styles/components/callbar.css">
/* c-callbar — active call strip pinned to the top of the host.
   z-60: ABOVE modals — an active call never hides (DESIGN_SYSTEM.md §2).
   Success surface = universal "call in progress"; on-action ink inverts

<style>
  /* Q4-③ (#270): THE native call surface — loaded ONLY by CallPage, the one
     C#-presented cover that replaced the per-pane call-ui broadcasts (Damir F5:
     N rings/N bars on desktop, roster-less identities). Two modes, one document:
       ring    — CallPage presents this WebView FULL-WINDOW; the c-callin overlay
                 renders over the themed body (its own scrim included).
       bar     — CallPage re-margins the stage to a TOP STRIP: this viewport IS
                 the strip (~64dip, --call-bar-h must match CallPage.barHeightDip),
                 and the callbar pins to its top edge.
     Identity (nick + avatar data-URI, X1) is pushed by C# — always right.
     SECURITY: this page emits ONLY the existing global call verbs
     (ixian:appAccept/appReject/hangUp) — intent only, C# owns the call. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { overflow: hidden; }
  :root { --call-bar-h: 64px; }
  /* bar mode: the strip fills the (short) viewport; hairline under it so the
     strip reads as a shelf over whatever pane sits beneath the native stage. */
  body[data-mode="bar"] .c-callbar {
    position: fixed; top: 0; left: 0; right: 0;
    /* Edge-to-edge: the strip's native stage starts at the SCREEN top, so the bar
       surface paints under the status bar and the content row sits below it.
       ★ CallPage MUST grow the stage by the SAME inset (barHeightDip + safe top) —
       on iOS from SafeAreaInsets.Top, on Android from MainActivity.TopInsetDip since
       AND-7 (#401) removed the root-view top padding. If those two ever disagree the
       64dip content row is clipped inside `body { overflow: hidden }`. Windows keeps
       --safe-top at 0 and the stage keeps its plain 64dip. */
    height: calc(var(--call-bar-h) + var(--safe-top, 0px));   /* ★ AND-7 */
    padding-top: var(--safe-top, 0px);
    box-sizing: border-box;
    border-bottom: 1px solid var(--outline-neutral-03, rgba(128,128,128,0.18));
  }
  /* Review MAJOR (Q4 loop): callbar.css's #264 DESKTOP rule (:root[data-desktop]
     .c-callbar, specificity 0-3-0) OUT-SPECIFIES the rule above (0-2-1) — and this
     shell sets data-desktop on every desktop UA. It floats the bar as a centered
     560px pill offset 8px from the top… inside a stage viewport that is EXACTLY
     --call-bar-h tall with overflow:hidden ⇒ the pill's bottom 8px (and its radius)
     were CLIPPED, with the rest of the opaque native stage showing as a band around
     it. The floating pill is a DOM-overlay grammar; this stage IS the strip, so the
     production call surface takes the strip back on desktop too (the demos keep the
     pill — callbar.css is untouched). Damir: art dial. */
  :root[data-desktop] body[data-mode="bar"] .c-callbar {
    left: 0; right: 0; width: auto;

  :root[data-desktop] body[data-mode="bar"] .c-callbar[data-open] {
    transform: translateY(0);

  /* ring mode: c-callin + its scrim render over the themed full-window body.

<script src="spixi.icons.js"></script>
<script src="spixi.strings.js"></script>
<!-- A4: C#-substituted locale carrier — the dictionary follows the Settings pick;
     ?lang= still overrides (demos/tests); un-substituted → en-us fallback. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="spixi.bundle.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production CALL shell — the one native call surface (CallPage, Q4-③/#270).
   *
   * Contract (CallPage.xaml.cs):
   *   C#→JS  setCallUi(kind, name, avatar, text, startedSecs, sessionId, address)
   *          kind ∈ 'ring' | 'dialing' | 'incall'. Re-pushed on EVERY state
   *          change and re-asserted after ixian:onload (the shell holds no
   *          state C# can't replay). avatar = data URI (X1) or a sentinel path
   *          (→ gradient fallback). startedSecs = unix SECONDS, 0 ⇒ no timer.
   *   JS→C#  ixian:appAccept:<addr>:<sid> · ixian:appReject:<addr>:<sid> ·
   *          ixian:hangUp:<sid> — the existing global verbs (onNavigatingGlobal;
   *          VoIPManager routes them; ★ mini-apps still can't reach any of this —
   *          acceptsCallPushes gates are untouched).
   *   Dismissal is NATIVE: C# tears the surface down on accept-elsewhere /
   *   decline / remote hang-up / the #265 ring timeout — this shell never
   *   self-dismisses (no local verb exists; a hidden-but-ringing call would lie).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    showIncomingCall, hideIncomingCall,
    showCallBar, hideCallBar,
    createNativeBridge, installExecuteUiCommand,
    applyPushedTheme,
    } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme fallback (head-top script normally resolved it already).
  (function () {
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  const bridge = createNativeBridge();
  installExecuteUiCommand();

  // C# pushes sentinels/paths through un-encoded (X1) — anything that isn't a
  // data/http(s) URI can't resolve in this self-contained shell → gradient.
  function resolveAvatar(v) {
    const s = String(v || '');
    return /^(data:image\/|https?:\/\/)/.test(s) ? s : null;
  }

  let ringEl = null;        // live c-callin (singleton)
  let ringSession = '';
  let barSession = '';      // hang-up target while the bar is up
  const hungUp = new Set(); // sessions this surface already hung up (one-shot per call)

  function dropRing() {
    if (!ringEl) return;
    const el = ringEl;
    ringEl = null;
    ringSession = '';
    hideIncomingCall(el);
  }

  function renderRing(name, avatar, text, sid, addr) {
    // Review MINOR: call-overlay.js DISMISSES the ring itself when an action latches
    // (Accept/Decline), but nothing reset our identity latch — so between the tap and
    // C#'s next push the shell believed a ring for `sid` was live while the DOM was
    // empty. A re-assert in that window (any page's OnAppearing → broadcastCallState)
    // then rendered NOTHING behind a full-window, back-swallowing cover. Treat a
    // detached ring as gone.
    if (ringEl && !ringEl.isConnected) { ringEl = null; ringSession = ''; }
    // #335 reviewer (MAJOR-residual): a DISMISSING ring is still CONNECTED for up
    // to ~400ms (overlay.js removes on transitionend / a 400ms fallback) but its
    // data-open is deleted SYNCHRONOUSLY at dismiss — the AND-11 gate's re-arm
    // tick could land in that window, match `ringSession === sid` on the dying
    // element, and be SWALLOWED → the blank cover the gate exists to prevent.
    // Treat a no-longer-open ring as gone too ('' while open → the `in` test).
    if (ringEl && !('open' in ringEl.dataset)) { ringEl = null; ringSession = ''; }
    if (ringEl && ringSession === sid) return;    // same ring — keep it (no restart/refocus)
    dropRing();
    ringSession = sid;
    ringEl = showIncomingCall({
      host: document.body,
      ignore: false,       // Accept/Decline only — no local-dismiss verb exists (C# keeps ringing)
      caller: { name: name || '', address: addr || '', avatar: resolveAvatar(avatar) },
      sub: text || '',     // C#-localized "Incoming call" line
      onAccept: () => bridge.send('ixian:appAccept:' + addr + ':' + sid),
      onDecline: () => bridge.send('ixian:appReject:' + addr + ':' + sid),
      strings,
    });
  }

  function renderBar(text, startedSecs, sid) {
    dropRing();
    // Review MINOR: a re-assert (dialing → in-call, or any page's OnAppearing →
    // broadcastCallState) used to RE-ARM the hang-up latch after the user had already
    // hung up — a second tap then re-fired ixian:hangUp on a session C# was tearing
    // down. Hang-up is one-shot per session, for the life of this surface.
    barSession = hungUp.has(sid) ? '' : sid;
    const t = Number(startedSecs) || 0;
    showCallBar({
      host: document.body,
      text: String(text || ''),
      startedAt: t > 0 ? t * 1000 : null,        // 0 ⇒ dialing, no timer (spixi.js:304)
      // no onReturn: this surface can't navigate the app (return-to-call =
      // logged follow-up — needs a C#-routed verb); the main region renders
      // INERT (callbar.js #257 grammar), hang-up is the live action.
      onHangUp: () => {
        const target = barSession;
        if (!target) return;                     // already ended — idempotent
        barSession = '';
        hungUp.add(target);
        bridge.send('ixian:hangUp:' + target);   // C# tears the surface down
      },
      strings,
    });
  }

  const handlers = {
    /* ★ N71 (#421): the live re-theme push. C# used to RELOAD every page on an OS
     * theme flip, which threw the user back to Chats (N78) and discarded unsaved
     * input; it pushes now, so this shell must be able to receive one. Shared body
     * (theme-runtime.js) — never re-derive 'auto' from matchMedia here, the
     * WebView's prefers-color-scheme can disagree with the app theme. */
    setTheme(name) { applyPushedTheme(name); },
    /* the ONE push — full current state, replayable (see contract above) */
    setCallUi(kind, name, avatar, text, startedSecs, sessionId, address) {
      const k = String(kind || '');
      const sid = String(sessionId || '');
      const addr = String(address || '');
      if (k === 'ring') {
        document.body.dataset.mode = 'ring';
        hideCallBar(document.body);
        barSession = '';
        renderRing(name, avatar, text, sid, addr);
      } else if (k === 'dialing' || k === 'incall') {
        document.body.dataset.mode = 'bar';
        renderBar(text, startedSecs, sid);
      }
      // any other kind: leave the surface exactly as it is (an unknown kind used to
      // fall into 'bar' mode and paint an empty opaque strip).
    },
  };
  bridge.exposeAll(handlers);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177): C# then
   *    (re)pushes setCallUi and reveals the stage. ————————————————————————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
