<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety walk test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 20px 0 8px; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 12px; font-size: 15px;
    border: 1px solid #888; border-radius: 8px; background: transparent; color: inherit; text-align: left; text-decoration: none; }
  #out { margin-top: 16px; padding: 12px; border-radius: 8px; border: 1px dashed #888; min-height: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Safety walk test</h1>
<p>A test app for the Session Safety walk. It is not for release.</p>
<h2>Storage (S-1)</h2>
<button id="save" type="button">1 · Save inside (table "main")</button>
<button id="read" type="button">2 · Read inside</button>
<button id="saveOut" type="button">3 · Try to save OUTSIDE the app folder</button>
<button id="readOut" type="button">4 · Try to read OUTSIDE the app folder</button>
<h2>Windows only (O-02)</h2>
<button id="win" type="button">5 · Open a new window</button>
<a id="dl" class="btn" href="data:text/plain;charset=utf-8,safety%20walk%20download" download="safety-walk.txt">6 · Start a download</a>
<button id="cam" type="button">7 · Ask for the camera</button>
<h2>Storage partition check (MAJOR #4)</h2>
<button id="ls" type="button">8 · Look for Spixi page data (key names only)</button>
<div id="out">Result: (nothing yet)</div>
<script src="app.js"></script>
</body>
</html>
