            if (connectivitySub) bar.setAttribute('data-connecting-bar', '');
            else bar.removeAttribute('data-connecting-bar');
          }
        } else {
          renderTopbar();   // no sub yet (pre-first-paint edge) → normal rebuild
        }
      }
      setWarning(warningBanner, isConn ? '' : (text || ''));
    },

    /* N51 (the N50/#370 grammar applied to chat): OS back routed INTO the shell
       while the mirror below reports an open overlay. Arm order = the edge-swipe
       precedent (#328): the hand-rolled channel selector first (it is NOT on the
       shared stack), then the shared overlay stack (sheets/menus/modals render
       above the selection bar), then select mode — the natives' order. Self-heal:
       nothing actually open (stale mirror) → re-sync so the next back pops the
       conversation instead of wedging (the N50 cdBack grammar). */
    chatBack() {
      if (channelDropdown) { closeChannelSelector(); return; }
      const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
      if (dismiss && dismiss()) return;
      if (closeAttachTrayIfOpen()) return;                  // ★ #705: the tray under the bar, after any sheet above it
      if (chatSendView) { closeSendTakeover(); return; }   // loop MAJOR fix: the cover before select mode
      if (chatSelect) {
        // #376 loop A-1 belt: a dead handle must not eat the press with no heal —
        // verify the selection is LIVE on the DOM before exiting through it.
        if (box.dataset.selecting === undefined) { chatSelect = null; syncChatOverlay(); return; }
        exitChatSelect();
        return;
      }
      syncChatOverlay();
    },
  };

  /* ★★★ ONE WIRE, NOT THREE (round 2, surviving mutations X1, X2, X8).
     Round 1 pushed the composer ⊕ state from three handlers. Each call site was a
     separate line that a single deletion could remove, and the suite read none of them:
     deleting the one in `setChatMode` hid the ⊕ for the whole session in every room.
     The state is DERIVED instead. Every C#→JS handler runs through this one wrapper, and
     the wrapper re-derives the ⊕ after the handler returns. A new handler that changes
     the room, the peer or a capability needs no new call.
     `finally`, so a handler that throws still leaves the ⊕ honest.
     ⚠ Delete this wrapper and the ⊕ freezes at its boot state in every room. */
  const syncedHandlers = {};
  for (const name of Object.keys(handlers)) {
    const fn = handlers[name];
    syncedHandlers[name] = typeof fn !== 'function' ? fn : function (...args) {
      try {
        return fn.apply(this, args);
      } finally {
        /* Best-effort, and deliberately so: this wrapper sits on EVERY C# push, and a
           throw here would replace the handler's own result. `composerEl` is assigned
           far below this line, so a push that lands before the composer is built reads
           it in its temporal dead zone. */
        /* ★ round 3 MINOR-4: a ONE-OFF throw is healed by the next push, and a throw
           that REPEATS freezes the ⊕ for the whole session. Say so on the debug
           channel, or the device report reads "the ⊕ never appears" with a clean log. */
        try { syncAttachAffordance(); } catch (e) { dbg('syncAttachAffordance threw', e && e.message); }
      }
    };
  }
  bridge.exposeAll(syncedHandlers);

  /* N51: mirror the shell's overlay-stack state to C# so Android back closes the
     TOP overlay (an overlay.js sheet, the hand-rolled channel selector, select
     mode) instead of popping the whole conversation — chat is a HomePage overlay
     (#225), so its in-document surfaces are invisible to C#. The exact
     contact_details recipe (N50): coalesced through a zero-timeout so an
     open→close flurry sends one line. channelDropdown + chatSelect live OUTSIDE
     the shared overlay stack (no body[data-overlay-open]), so they join the
     predicate and their open/close sites call syncChatOverlay() explicitly. */
  let chatOverlaySyncT = 0;
  function chatOverlayLive() {
    // #376 loop A-2: the reactions inspect sheet hosts on #messages (applyReactions
    // passes host: box), so its data-overlay-open lands on BOX, not body. Dead
    // today (only ❤️ ships, the "+N" trigger can't render), but the C8 emoji batch
    // lights it up — cover the host now so the hole can't reopen silently.
    return document.body.dataset.overlayOpen !== undefined
      || box.dataset.overlayOpen !== undefined
      || !!channelDropdown || !!chatSelect
      || !!chatSendView                                // loop MAJOR fix: the money cover consumes back too
      || (composerEl && isAttachTrayOpen(composerEl)); // ★ #705: the attach tray consumes back
  }
  function syncChatOverlay() {
    if (chatOverlaySyncT) return;
    chatOverlaySyncT = setTimeout(() => {
      chatOverlaySyncT = 0;
      try { bridge.send('ixian:chatoverlay:' + (chatOverlayLive() ? '1' : '0')); } catch (e) {}
    }, 0);
  }
  try {
    new MutationObserver(syncChatOverlay).observe(document.body, { attributes: true, attributeFilter: ['data-overlay-open'] });
    new MutationObserver(syncChatOverlay).observe(box, { attributes: true, attributeFilter: ['data-overlay-open'] });   // loop A-2: the box-hosted sheet
  } catch (e) {}

  // Do NOT paint the empty log now — that produced a spinner → empty-notice →
  // full-conversation sequence (the residual flicker Damir felt after the burst
  // gate). Instead the BOOT SPINNER stays until the first real render:
  // onChatScreenLoaded paints the whole history in ONE go. A short fallback
  // (armed at ready) covers a brand-new empty chat or a missing signal so the
  // spinner never sticks — but never paints mid-burst (guarded on !bursting).

  /* —— scroll-to-latest affordance (appears when scrolled up) ——————————————— */
  const stl = createScrollToLatest({ target: box });
  box.closest('.c-chat-canvas').append(stl);

  /* N53: feed the chevron's unread badge (setScrollLatestCount shipped in #74 and
   * was never fed). Counts every INCOMING row created while the user is scrolled
   * up; the load burst is excluded (history streaming is not "new"), and the read
   * happens at upsert time — before the coalesced render — so it reflects the
   * position the user was actually reading at. Reset: back at the bottom (scroll
   * listener below), per peer (onChatScreenReady) and per bot channel
   * (setSelectedChannel — the counter must not carry across rooms). */
  let stlUnread = 0;
  let stlFlushQuietUntil = 0;   // loop B-1: re-flush quiet window (set by clearMessages)
  function setStlUnread(n) {
    stlUnread = n;
    setScrollLatestCount(stl, n, window.SL || {});
  }
  function noteArrival(existing, rec) {
    if (existing || bursting) return;                    // update or history stream — not an arrival
    /* #376 loop B-1 (MAJOR): `bursting` alone is NOT a complete flush gate — the
       load-more and reloadScreen paths never push onChatScreenLoaded, so their
       burst can only end by the 250ms idle timer, and ONE main-thread stall
       mid-stream (GC, a data-URI decode) flips it while rows are still coming.
       clearMessages wipes the model, so every re-flushed row is a CREATE — with
       the user held scrolled-up by applyOlderAnchor, the badge counted requested
       HISTORY as unread. Belt: a 5s quiet window after every clearMessages (the
       A3 loadPhase window precedent). Fails SAFE: a live arrival inside the
       window is missed by the badge (the chevron still shows), never miscounted. */
    if (Date.now() < stlFlushQuietUntil) return;
    if (rec && rec.direction === 'sent') return;         // own sends stick to the bottom anyway
    // loop B-9: an old exe's addCall carries no `outgoing` arg → no direction —
    // never count a directionless call row (it may be the user's own).
    if (rec && rec.kind === 'call' && !rec.direction) return;
    if (nearBottom()) return;                            // visible on arrival — nothing unread
    setStlUnread(stlUnread + 1);
  }
  box.addEventListener('scroll', () => {
    /* #376 loop B-5: clear at the CHEVRON's own threshold (200px, scroll-latest.js
       SHOW_THRESHOLD), not nearBottom's half-viewport — the badge must not vanish
       while three bubbles are still below the fold. Count-side stays nearBottom():
       inside that band renderLogNow sticks to the bottom on arrival (same
       predicate), so the pairing is coherent. */
    if (stlUnread && box.scrollHeight - box.scrollTop - box.clientHeight <= 200) setStlUnread(0);
  }, { passive: true });

  /* ★ Session K [SCROLL] — TEMPORARY, the scroll-jank instrument (Damir, walk J2, heavy seed:
     "a bit janky when going into chats and scrolling"). Nothing stamps SCROLL today — the
     [CDPERF] frame probe counts the 600 ms after present only. This one runs a rAF loop
     while the log scrolls and for 250 ms after the last scroll event, then prints ONE line:
       [SCROLL] frames=N drop=N max=Nms dur=Nms rows=N h=N
     frames = rAF callbacks seen · drop = frames whose delta exceeded 32 ms (two 60 Hz frames;
     a 90/120 Hz phone reads harsher, which is the safe direction) · max = the longest gap ·
     dur = wall time · rows = rendered rows · h = scrollHeight. console.warn → logcat
     `[WEBVIEW]` (#754). No verb, no bridge, no data. Retire with the [CDPERF] set. */
  (function scrollJankProbe() {
    let raf = 0, last = 0, frames = 0, drop = 0, max = 0, t0 = 0, quiet = 0;
    const tick = (now) => {
      if (last) { const d = now - last; frames++; if (d > 32) drop++; if (d > max) max = d; }
      last = now;
      if (now - quiet > 250) {
        raf = 0; last = 0;
        if (frames >= 6) {
          try {
            console.warn('[SCROLL] frames=' + frames + ' drop=' + drop + ' max=' + Math.round(max) + 'ms dur=' + Math.round(now - t0)
              + 'ms rows=' + box.querySelectorAll('.c-bubble-row').length + ' h=' + box.scrollHeight);
          } catch (e) {}
        }
        frames = 0; drop = 0; max = 0;
        return;
      }
      raf = requestAnimationFrame(tick);
    };
    box.addEventListener('scroll', () => {
      quiet = performance.now();
      if (!raf) { t0 = quiet; raf = requestAnimationFrame(tick); }
    }, { passive: true });
  })();

  /* —— @ jump-to-mention FAB (#8, premium mentions #210) ————————————————————
   * Sits bottom-right, ABOVE the scroll-to-latest chevron. Appears ONLY when a
   * message mentioning the LOCAL user is off-screen; tap smooth-scrolls to the
   * nearest such message + pulses it. Identifying "me" needs the local nick,
   * which C# does not push to the chat yet — so this stays hidden until
   * SelfNick lands (be-cutover); highlight-all + the picker work regardless. */
  const mentionFab = document.createElement('button');
  mentionFab.type = 'button';
  mentionFab.className = 'chat-mention-fab';
  mentionFab.setAttribute('aria-label', (window.SL && window.SL.jumpToMention) || 'Jump to mention');
  if (window.SpixiIcons && window.SpixiIcons.icon) mentionFab.append(window.SpixiIcons.icon('at', { size: 22 }));
  else mentionFab.textContent = '@';
  const mentionFabBadge = document.createElement('span');   // count of unseen mentions (Telegram-style)
  mentionFabBadge.className = 'chat-mention-fab__badge u-tabular';
  mentionFabBadge.setAttribute('aria-hidden', 'true');       // count lives in the button aria-label
  mentionFabBadge.hidden = true;
  mentionFab.append(mentionFabBadge);
  box.closest('.c-chat-canvas').append(mentionFab);

  /* Cycle-with-count behaviour (Telegram-style, Damir 2026-07-09). The FAB counts
   * EVERY mention of ME the user hasn't SEEN yet — regardless of where it sits in the
   * history — and, per tap, jumps to the NEWEST unseen one first (the most recent @you,
   * usually the nearest scroll), pulsing it; each subsequent tap steps to the next-older
   * unseen (Damir: jumping to the earliest first felt backwards). A mention becomes
   * "seen" once it scrolls into view (or is jumped to). The seen set is PERSISTED per
   * peer (localStorage, same pattern as myLikes/loadedMedia) so a caught-up mention does
   * not resurface on the next open — mirrors Telegram's durable unread-mention marker.
   * No baseline seed: on first open, all not-yet-seen mentions (anywhere in the log)
   * surface, which IS the desired catch-up. */
  const mentionSeen = new Set();      // message ids whose @me has been seen (persisted per peer)

  /* does a message text @-mention the LOCAL user? (boundary-checked, case-insensitive) */
  function textMentionsMe(text) {
    const keys = mentionCtx().self;
    if (!keys.length || !text || text.indexOf('@') < 0) return false;
    const low = text.toLowerCase();
    const isWord = (c) => c && /[\p{L}\p{N}_]/u.test(c);
    for (const k of keys) {
      const key = String(k).toLowerCase();
      if (!key) continue;
      let i = low.indexOf('@' + key);
      while (i !== -1) {
        const before = i > 0 ? low[i - 1] : '';
        const after = low[i + 1 + key.length] || '';
        if (!isWord(before) && before !== '@' && !isWord(after)) return true;
        i = low.indexOf('@' + key, i + 1);
      }
    }
    return false;
  }
  function mentionIdsOrdered() {                         // chronological (oldest → newest)
    const out = [];
    for (const id of order) { const rec = model.get(id); if (rec && textMentionsMe(rec.text)) out.push(id); }
    return out;
  }
  function mentionRowVisible(row) {
    const br = box.getBoundingClientRect(); const rr = row.getBoundingClientRect();
    return rr.bottom > br.top && rr.top < br.bottom;
  }
  function updateMentionFab() {
    if (!mentionFab) return;
    if (!mentionCtx().self.length) { mentionFab.removeAttribute('data-visible'); return; }
    const ids = mentionIdsOrdered();
    let changed = false;
    for (const id of ids) {                              // mark any now-visible mention seen
      const row = rows.get(id);
      if (row && row.isConnected && mentionRowVisible(row) && !mentionSeen.has(id)) {
        mentionSeen.add(id); changed = true;
      }
    }
    if (changed) saveMentionSeen();                      // persist catch-up progress
    const unseen = ids.filter((id) => !mentionSeen.has(id));
    const n = unseen.length;
    mentionFab.toggleAttribute('data-visible', n > 0);
    mentionFab._next = n ? unseen[n - 1] : null;         // NEWEST unseen first (Damir: jump to the most recent mention; each tap then steps to the next-older)
    mentionFabBadge.hidden = n <= 1;                     // show a count only when >1 pending
    if (n > 1) mentionFabBadge.textContent = n > 99 ? '99+' : String(n);
    const base = (window.SL && window.SL.jumpToMention) || 'Jump to mention';
    mentionFab.setAttribute('aria-label', n > 1 ? base + ', ' + n : base);
  }
  function resetMentionTracking() { loadMentionSeen(); }   // per-peer: restore the durable seen set
  mentionFab.addEventListener('click', () => {
    const id = mentionFab._next; if (!id) return;
    // M1 (#441): the scroll-and-pulse body now lives in jumpToRow, shared with the
    // reply quote so the two can never drift.
    if (!jumpToRow(id, updateMentionFab)) return;
    mentionSeen.add(id); saveMentionSeen();              // viewing it counts as seen (persisted) → next tap advances
    updateMentionFab();
  });
  let mentionFabRaf = 0;
  box.addEventListener('scroll', () => {
    if (mentionFabRaf) return;
    mentionFabRaf = requestAnimationFrame(() => { mentionFabRaf = 0; updateMentionFab(); });
  }, { passive: true });

  /* —— composer (JS→C# emits) ——————————————————————————————————————————————
   * send  → ixian:chat:<encodeURIComponent(text)>  (legacy chat.js:409 — chat
   *         text is the ONE ixian verb that is URI-encoded; native.js otherwise
   *         composes raw, so we encode here and hand bridge.send the whole cmd).
   * typing → ixian:typing, throttled to >1s like legacy (chat.js:423). Legacy
   *         suppresses typing in group chats; mirror that.
   * After send we clear locally for snappiness; C# also echoes clearInput. */
  /* —— composer drafts (CH7). Persist the UNSENT composer text to localStorage
   * keyed by peer address so it survives leaving/returning to the chat, and the
   * chats list (home.html, same Resources/Raw/html origin) can show a "Draft: …"
   * excerpt. A draft is the user's own unsent text (not message history) →
   * SECURITY.md-OK to cache; cleared on a successful send. Fail-soft if
   * localStorage is unavailable. Keyed on identity.address, which lands via
   * onChatScreenReady BEFORE the composer can be typed into. */
  const DRAFT_PREFIX = 'spixi.draft.';
  let draftRestored = false;
  let draftSaveTimer = 0;
  function draftKey() { return identity.address ? DRAFT_PREFIX + identity.address : ''; }
  function saveDraft(text) {
    const k = draftKey();
    if (!k) return;
    try {
      if (text && text.trim()) localStorage.setItem(k, text);
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function clearDraft() {
    clearTimeout(draftSaveTimer);          // cancel any in-flight debounced save so it can't
    const k = draftKey();                  // resurrect the just-sent text after removeItem (audit race)
    if (!k) return;
    try { localStorage.removeItem(k); } catch (_) {}
  }
  /** Restore a saved draft once the peer address is known — but never clobber
   *  text the user already started typing, and only once per page life. */
  function maybeRestoreDraft() {
    if (draftRestored) return;
    const k = draftKey();
    if (!k) return;                              // address not known yet — try again later
    draftRestored = true;
    let saved = '';
    try { saved = localStorage.getItem(k) || ''; } catch (_) {}
    if (!saved) return;
    const input = composerEl && composerEl.querySelector('.c-composer__input');
    if (!input || input.value) return;          // don't overwrite in-progress typing
    input.value = saved;
    input.dispatchEvent(new Event('input'));    // grow + action sync; isTrusted=false → no spurious ixian:typing
  }

  /* —— Q12: deleted-tail excerpt hint (shared contract with home.html, which
   * reads spixi.exdel.<addr>). Deleting the LAST message leaves the chats list
   * stale: the delete path never re-pushes HomePage (SingleChatPage:1150-1159
   * pushes only THIS WebView), and C#'s friend.metaData.lastMessage may keep the
   * deleted message (Ixian-Core is outside this tree — unverifiable, #215; the
   * hint self-expires if C# turns out to correct itself). So on a delete of the
   * tail row we write a per-address hint home.html folds into the row.
   *
   * LOCAL DELETES ONLY (A-1). C# pushes the IDENTICAL deleteMessage(id) command
   * for both paths, but only the local menu delete mutates core (SingleChatPage:
   * 1146/1154 → friend.deleteMessage); the REMOTE msgDelete path (StreamProcessor:
   * 459-462 → UIHelpers.deleteMessage:69-77 → SingleChatPage:1727) just drops the
   * bubble — core keeps the message, so C# keeps pushing the same lastMessage ts
   * (hint could never expire) while the next open re-shows the row. Hence the
   * writer is latched: onMenuAction registers the id in pendingLocalDeletes and
   * the deleteMessage handler consumes it. Remote deletes still remove the row —
   * they just write no hint.
   *
   * Shape: { del: ms ts of the C#-VISIBLE lastMessage (max over sequential tail
   * deletes — C#'s stale lastMessage keeps the newest ts it ever saw), t: ms ts of
   * the new tail or 0, kind }. NO message text (DECISIONS #254 security ruling:
   * shells + mini-apps share the file:// storage partition, so untrusted publisher
   * code may read localStorage — we never widen it with counterpart-authored text).
   * home expires the hint when C# pushes a lastMessage ts ≠ del. Crosses the #221
   * wall via same-origin localStorage ONLY (the #238 landtab precedent) — no shared
   * JS, no bridge. SKIPPED: bots (lastMessage may live in another channel than the
   * visible order[], accepted edge) · rows with a synthetic wall-clock ts (A-3) ·
   * deletes arriving mid-load-burst, where order[] is still partial (A-6). */
  const EXDEL_PREFIX = 'spixi.exdel.';
  const pendingLocalDeletes = new Set();   // ids sent by the local delete menu, awaiting C#'s echo
  function writeExdelHint(deletedRec, wasTail) {
    if (!wasTail || !identity.address || mode.isBot) return;
    if (bursting) return;                              // A-6: partial log mid-load-burst → tail is not final
    if (deletedRec.tsSynthetic) return;                // A-3: wall-clock ts C# can't push → hint could never expire
    const k = EXDEL_PREFIX + identity.address;
    let del = deletedRec.ts || 0;
    try {   // sequential tail deletes: keep the NEWEST ts C# ever saw as lastMessage
      const prev = JSON.parse(localStorage.getItem(k) || 'null');
      if (prev && prev.del) del = Math.max(del, prev.del);
    } catch (_) {}
    if (!del) return;                                  // no comparable ts → no safe hint
    const tailId = order[order.length - 1];
    const tail = tailId ? model.get(tailId) : null;
    const hint = {
      del,
      t: tail ? (tail.ts || 0) : 0,
      kind: tail ? tail.kind : '',
    };
    try { localStorage.setItem(k, JSON.stringify(hint)); } catch (_) {}
  }

  /* —— own-reaction persistence (C5 interim). The bridge's addReactions re-emit
   * carries NO per-user flag, so "I reacted" is FE-remembered in myLikes. A C#
   * re-flush (clearMessages→re-add) or reopening the chat must NOT drop it, else
   * the pill loses its selected state while the heart+count survive (Damir F5,
   * 2026-07-07). Persisted keyed by peer address — same origin/pattern as drafts;
   * a like is the user's own action metadata, SECURITY.md-OK to cache. */
  const LIKE_PREFIX = 'spixi.likes.';
  function likeKey() { return identity.address ? LIKE_PREFIX + identity.address : ''; }
  function saveLikes() {
    const k = likeKey();
    if (!k) return;
    try {
      if (myLikes.size) localStorage.setItem(k, JSON.stringify([...myLikes]));
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function loadLikes() {
    myLikes.clear();                            // reset for THIS peer (desktop peer-switch safe)
    const k = likeKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => myLikes.add(String(id)));
    } catch (_) {}
  }

  // Remote media (GIF/image) load policy — legacy parity: load by default. The
  // global pref defaults ON; write 'off' to spixi.media.autoload to opt out (a
  // settings toggle can flip it — deferred UI). Regardless of the pref, URLs the
  // user DID load are remembered per peer so they auto-expand on re-entry (fixes
  // the "GIF hidden again after leaving + returning" bug). #82 security note in
  // be-cutover-brief (auto-loading remote media reveals the reader's IP to the host).
  const MEDIA_AUTOLOAD_KEY = 'spixi.media.autoload';
  const MEDIA_LOADED_PREFIX = 'spixi.media.loaded.';
  function mediaAutoloadOn() {
    try { return localStorage.getItem(MEDIA_AUTOLOAD_KEY) !== 'off'; } catch (_) { return true; }
  }
  function loadedMediaKey() { return identity.address ? MEDIA_LOADED_PREFIX + identity.address : ''; }
  function loadLoadedMedia() {
    loadedMedia = new Set();                    // reset for THIS peer (desktop peer-switch safe)
    const k = loadedMediaKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((u) => loadedMedia.add(String(u)));
    } catch (_) {}
  }
  function rememberLoadedMedia(url) {
    if (!url) return;
    loadedMedia.add(url);
    const k = loadedMediaKey();
    if (!k) return;
    try { localStorage.setItem(k, JSON.stringify([...loadedMedia])); } catch (_) {}
  }

  /* —— declined app-invite persistence (C7(a)). Declining an app invite is a LOCAL
   * action (the sender is NOT notified — future BE, be-cutover C7). Instead of deleting
   * the card (feels like it vanished), the invite stays and flips to a terminal
   * "Declined" state. Remembered per peer so it survives a C# re-flush (loadMessages
   * re-pushes the invite as 'invite'/'missing') and re-opening the chat. Same
   * origin/pattern as myLikes — the user's own action metadata, SECURITY.md-OK. */
  /* ★ B2: the CANCELED set — my own invites I withdrew — same origin/pattern as the

    /* ★ B2: an UNTAGGED legacy value is dropped, not adopted — it may be exactly the
       rotation-poisoned number this fix exists to stop, and there is no way to tell. One
       keyboard re-measures it. */
    const m = /^(\d+)@(\d+)$/.exec(raw);
    if (!m) return;
    const px = parseInt(m[1], 10), w = parseInt(m[2], 10);
    if (!(px >= 160 && px <= 600) || !(w > 0)) return;

  })();
  (function keyboardViewport() {
    const vv = window.visualViewport;
    if (document.documentElement.hasAttribute('data-desktop')) return;
    let kbOpen = false;
    let nativeKb = false;                  // r2 (#303): true once C# keyboard frames arrive — they win
    /* iOS-53 r2 (#324) — bottom-stick THROUGH the margin transition. A one-shot
     * scrollTop write only held the bottom for the instant jump; with the
     * composer sliding (280ms), the log's height changes every frame, so the
     * stick must track the whole slide or the newest message lags then snaps.
     * 340ms > the 280ms transition; restarts safely on overlapping writes. */
    let stickRaf = 0, stickEnd = 0;
    function stickDuring(ms) {
      // #328 loop fix: reduced-motion has no transition to track — one write.
      if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) {
        box.scrollTop = box.scrollHeight;
        return;
      }
      stickEnd = performance.now() + ms;
      cancelAnimationFrame(stickRaf);
      (function step() {
        box.scrollTop = box.scrollHeight;
        if (performance.now() < stickEnd) stickRaf = requestAnimationFrame(step);
      })();
    }
    /* #328 loop fix (audit MAJOR): any user touch cancels the stick — the loop
     * exists only to track the composer's own 280ms slide; without this it
     * fought user scrolling AND yanked the @-mention FAB's jump back to the
     * bottom while the mention was already marked seen (the marker burned with
     * the jump never shown). A touch anywhere = user intent wins. */
    /* #337 audit MINOR: touchmove too — the AND-16 v2 arm fires on a window
     * RESIZE that can land MID-drag (composer tap → flick up → IME resize
     * ~100-300ms later): touchstart already happened, so without a move abort
     * the stick fought the active finger for up to 500ms (#328 class). A
     * touchmove only fires with a finger down — cancelling there never hurts
     * the no-touch case the stick exists for (the composer's own slide). */
    for (const evName of ['touchstart', 'touchmove']) {
      document.addEventListener(evName, () => {
        cancelAnimationFrame(stickRaf);
        stickEnd = 0;
      }, { passive: true, capture: true });
    }

      document.documentElement.style.setProperty('--kb-inset', px + 'px');

      lastInset = px;
    }
    let insetChanged = false;
    function apply() {
      if (!vv) return;
      // innerHeight tracks the LAYOUT viewport (constant under WKWebView's
      // keyboard); vv.height shrinks by the keyboard overlap.
      const delta = window.innerHeight - vv.height;
      const open = delta > 60;
      const stick = nearBottom();          // read BEFORE the layout change
      // r2 (#303): once the NATIVE lever is live, the vv path stops writing the
      // inset (two writers with different readings of the same keyboard would
      // fight) but keeps its pan-reset + stick duties below.

        if (open) setInset(Math.round(delta));
        else if (kbOpen) setInset(0);
      }

      // vv 'scroll' listener below catches the late pan too). With the composer
      // lifted above the keyboard, WebKit has no reason to re-pan after this.

      // #328: arm ONLY when this pass actually changed the inset — the settle
      // ladder re-runs apply() at 80..1400ms and each pass re-armed a fresh
      // 340ms pin (a ~1.7s continuous window after every focus, audit MAJOR).

      insetChanged = false;
    }
    /* r2 (#303) — SETTLE POLL. Damir's F5: the composer lifted only after 7-8
     * typed characters. Diagnosis: the first vv 'resize' fires BEFORE the keyboard
     * geometry settles (delta still < 60 → no-op) and no further event comes until
     * a keystroke makes WebKit scroll the caret (vv 'scroll' → apply → correct).
     * So: every trigger (vv event OR composer focus) runs apply() NOW plus a short
     * recheck ladder that outlives the ~250ms keyboard animation — a missed or
     * early event can no longer strand the composer under the keyboard. */
    let settleTimers = [];
    function kick() {
      apply();
      for (const t of settleTimers) clearTimeout(t);
      settleTimers = [80, 240, 480, 900, 1400].map((ms) => setTimeout(apply, ms));
    }
    if (vv) {
      vv.addEventListener('resize', kick);
      vv.addEventListener('scroll', kick);
    }
    // focus into the composer = the user summoned the keyboard — don't wait for vv
    document.addEventListener('focusin', (e) => {
      if (composerEl && composerEl.contains(e.target)) kick();
    });
    // belt: any stray document pan while the keyboard is up gets reset
    window.addEventListener('scroll', () => { if (kbOpen) window.scrollTo(0, 0); }, { passive: true });

    /* AND-16 v2 (#336) — measured 2026-08-12 on the Samsung (kb-probe). Android
     * adjustResize SHRINKS the layout viewport: innerHeight 774→451 with the
     * keyboard, and vv.height tracks it 1:1 (delta = innerHeight − vv.height = 0),
     * so the vv writer above stays correctly silent AND the composer is already
     * placed right (probe cb == innerHeight, above the keyboard). The ONLY defect:
     * the log's scrollTop stays put while scrollMax GROWS by the shrink (probe:
     * st 5063/5063 → 5063/5386) → the newest messages fall 323px below the fold.
     *
     * The #333 one-shot re-pin was falsified because nearBottom() recomputes
     * against the SHRUNKEN clientHeight (~339px) and reads false right after the
     * shrink (5063 + 339·1.5 < scrollHeight). The fix judges "were we at bottom"
     * on the PRE-resize geometry (sampled on scroll, stable) and re-pins with the
     * settle-tracked stickDuring — NOT a one-shot — so it holds the bottom across
     * the whole IME animation. Android-only (iOS innerHeight is constant under its
     * keyboard, so the shrink test excludes it; UA-gated as belt). */
    if (/Android/i.test(navigator.userAgent || '')) {
      let wasAtBottom = nearBottom();
      box.addEventListener('scroll', () => { wasAtBottom = nearBottom(); }, { passive: true });
      let lastIH = window.innerHeight;
      let lastIW = kbSlotWidth();            // ★ B2: the shape this baseline was taken in
      let lastAng = kbOrientationAngle();
      window.addEventListener('resize', () => {
        const ih = window.innerHeight;
        /* ★★ B2 (#46 loop, MAJOR — see the rememberKbSlot docblock): A ROTATION IS NOT A
           KEYBOARD, and every line below this point assumes it is one. Portrait→landscape is a
           >60 px shrink whose delta (≈386 on the reference device) is bigger than any keyboard,
           so without this guard it (a) wrote that delta into --kb-slot-h and persisted it — a
           tray at ~99 % of the landscape viewport, replayed into portrait on the next launch —
           and (b) latched kbUp, which sends the ⊕ down handKeyboardToTray's HOLD path with no
           keyboard to leave and no further resize coming, so the tray appeared only on the
           450 ms backstop: visible latency on a primary control, two gestures from a cold start.
           A rotation moves the width (or, on an engine that reports it first, the orientation
           angle); a soft keyboard moves neither. So a shape change re-baselines the SHAPE and
           stands the two KEYBOARD READS down: no slot sample, no kbUp latch (`shrank` is false
           whenever the shape moved, and both hang off `shrank`). Re-scoping the PUBLISHED slot
           is not done here — the shape-change listener registered in bootKbSlot owns that for
           every platform, and one rule with two copies is how the two start disagreeing.
           ★★ R3-KB (#46 loop ROUND 3, MAJOR) — AND A WINDOW RESIZE IS NOT A KEYBOARD EITHER,
           WHICH THE SHAPE GUARD ABOVE CANNOT SEE. It separates ROTATIONS from keyboards, and
           the paragraph below used to claim it separated the whole class of window resizes,
           naming "entering or leaving split-screen with the field focused" among resizes that
           "carry a width change". ON A PORTRAIT PHONE THE SPLIT-SCREEN DIVIDER IS HORIZONTAL:
           innerWidth and screen.orientation.angle are both UNCHANGED and only innerHeight
           moves, and MainActivity.cs delivers it as one resize, not a recreate
           (ResizeableActivity = true, SupportsPictureInPicture = true, and ConfigurationChanges
           INCLUDES ScreenSize and SmallestScreenSize — the two that would otherwise recreate). Reference device: 774 → ≈390. shapeChanged false ⇒ shrank true ⇒
           rememberKbSlot(≈384) — inside the 160-600 band, published, and persisted as
           "384@1080", tagged with the PORTRAIT width, i.e. the very shape it will be replayed
           into on every later launch; and kbUp latched true in the same statement with no
           keyboard on screen. That is verbatim the symptom the rememberKbSlot docblock says
           the width tag makes impossible.
           GEOMETRY CANNOT SOLVE IT. Under Android adjustResize a keyboard shrink and a window
           shrink are the same event: same surface, same direction, overlapping magnitudes. So
           the discriminator is SEMANTIC — a soft keyboard cannot be up unless an editable is
           focused (kbEditableFocused, above). Both keyboard reads now hang off `editable`;
           the shape guard STAYS as an additional suppressor for the sample, because a rotation
           WITH the field focused is still not a keyboard measurement.
           ⚠ RESIDUAL, stated because the code does NOT enforce it: one shape is left — a
           resize that dismisses the IME while the field KEEPS focus and shrinks the window by
           MORE than the IME gave back, so there is no >60 px grow either (entering split-screen
           on an engine that leaves the editable focused). Nothing observable separates that
           from a keyboard. The sample it takes is tagged with the live width and the next real
           keyboard in that shape overwrites it; kbUp stands true until the next grow or the
           next focus change. Bounded and self-correcting, unlike the unconditional version.
           ★★ R2-1 (#46 loop ROUND 2, MAJOR) — THE THREE ARE NOT SYMMETRICAL, AND THIS IS WHY.
           Round 1 wrote this guard as an early `return`, which suppressed the kbUp CLEAR along
           with the sample and the latch. That third suppression was collateral, and it put
           symptom (b) above back through a different door. MainActivity.cs:53 declares
           `ResizeableActivity = true` and :55-60 lists ConfigChanges ScreenSize | Orientation |
           UiMode | ScreenLayout | SmallestScreenSize | Density, so the activity is RESIZED,
           never recreated: ONE resize can carry a width change AND the keyboard's departure
           together — entering or leaving split-screen with the field focused, a fold with the
           IME up, a rotation where the IME switches to fullscreen/extract mode. With the early
           return kbUp then stood `true` with no keyboard on screen, and on Android nothing else
           writes it (the init above, this line, and `__setKbInset` — which the r2 docblock
           below records as never firing on Android WebView, where C# pushes nothing). The next
           ⊕ took handKeyboardToTray's hold path, no resize was coming, B3's grow guard
           correctly refused every jitter, and the tray appeared only on the 450 ms backstop:
           symptom (b), verbatim, until the user opened and closed a keyboard once.
           So the sample and the latch stay suppressed — they read a shrink AS a keyboard, and a
           rotation's shrink is larger than any keyboard — while the CLEAR runs, because a stale
           `true` is unbounded in time.
           ★★ R3-2 (#46 loop ROUND 3) — AND THE CLEAR IS NO LONGER ONE-SIDED. R2-1 left it as
           `else if (ih > lastIH + 60)`, i.e. a GROW only, and then justified that with the
           R2-1 list — which contains at least two SHRINKS that carry the keyboard away:
           entering split-screen with the field focused (the transition dismisses the IME while
           the window shrinks by more than the IME added), and portrait+IME (451) → landscape
           with the IME dropped (≈388). In both, `shrank` is false (the shape moved, or no
           editable is focused) so nothing re-latches, and the grow test is false so nothing
           clears — kbUp stood `true` with no keyboard and the next ⊕ waited out the 450 ms
           backstop. Symptom (b) again, from a third direction.
           The complement of R3-KB's gate is the fix and it falls out of the same signal: NO
           EDITABLE FOCUSED ⇒ NO KEYBOARD ⇒ CLEAR, in either direction, at any magnitude. The
           >60 px GROW clause STAYS beside it, because it is the one dismissal that leaves the
           editable focused: the system Back key hides the IME without moving focus, and with
           only the focus test kbUp would stand true for the rest of the session.
           ⚠ RESIDUAL, stated because the code does NOT enforce it: a landscape→portrait
           rotation with the keyboard STILL up is also a >60 px grow (reference device: ≈188 in
           landscape+IME → 451 in portrait+IME), so it clears kbUp with a keyboard on screen.
           Bounded cost: the next ⊕ takes the non-hold path and the tray rises beside a keyboard
           that the ⊕'s own focus steal (#756) is already dismissing — the K1 two-heights flash,
           for one open, until the next real shrink re-latches. Weighed against a latch that
           lies for the rest of the session, that is a choice, not an oversight.
           ⚠ SECOND RESIDUAL, same shape (round 4): an IME that changes its OWN height IN PLACE
           with the field still focused — Gboard's floating/one-handed toggle, the voice-input
           panel — grows the window by well over 60 px while an editable keeps focus, so the
           grow clause clears kbUp with the keyboard on screen. Same bounded cost: the next ⊕
           takes the non-hold path with `instant: true` and flashes the two heights once, until
           the next shrink re-latches. Recorded, not fixed — telling that grow from a real
           dismissal needs a signal this tree does not have.
           REVERSAL: delete this block and the poisoned slot and the latched kbUp both return.
           Put `return;` back inside the shape branch and the CLEAR goes down with them — a
           450 ms ⊕ on every tap after one shape-changing resize carried the keyboard away.
           NOTE what it also costs, deliberately: the bottom re-pin below does not run for a
           rotation — `shrank` is false on a shape change, and stickDuring tracks an IME settle
           animation, which a rotation is not. ★★ R3-KB adds the same to the ledger for a WINDOW
           RESIZE with no editable focused (split-screen in or out with nobody typing): `shrank`
           is false there too, so the log is not re-pinned. Same reasoning — there is no IME
           settle to track — and the same cost, a reader at the bottom who must scroll. */
        const iw = kbSlotWidth(), ang = kbOrientationAngle();
        const shapeChanged = (iw !== lastIW || ang !== lastAng);
        if (shapeChanged) { lastIW = iw; lastAng = ang; }
        const editable = kbEditableFocused();                 // ★★ R3-KB: no editable, no keyboard
        const shrank = editable && !shapeChanged && ih < lastIH - 60;     // keyboard opening (not chrome jitter, not a window resize)
        /* ★ Session J (Damir, Android: "the sheet is not the same height as the keyboard, and
           flickers when switching between keyboard and sheet"): the KEYBOARD'S OWN HEIGHT is
           the shrink, measured here on adjustResize, and it becomes the tray's height
           (--kb-slot-h, attach-sheet.css) — a tray that is exactly the keyboard's slot swaps
           with it without the bar moving by the difference. Persisted, so the first tray of
           the next session is already right; 268 stays the fallback until a keyboard has
           been seen. The stamps are TEMPORARY ([KBTRAY], console.warn → logcat W chromium),

        if (shrank) kbUp = true; else if (!editable || ih > lastIH + 60) kbUp = false;   // ★ #756: the keyboard's own state; ★★ R2-1: the CLEAR is NOT shape-gated; ★★ R3-2: and NOT grow-only

    }
    /* r2 (#303) — NATIVE LEVER (the #294 alternative, now primary on iOS). C#
     * observes UIKeyboardWillChangeFrame/WillHide (SpixiContentPage, chat.html
     * pages only) and pushes the FINAL keyboard overlap in points — same units as
     * CSS px — through this global. Deterministic where the vv event is not: the
     * notification always carries the settled end-frame. First push latches
     * nativeKb so the vv writer stands down; hide pushes 0. The vv machinery

      if (document.documentElement.hasAttribute('data-desktop')) return;
      const px = Math.max(0, Math.round(Number(h) || 0));

      const stick = nearBottom();
      if (px > 60) rememberKbSlot(px);     // ★ Session J: the iOS keyboard's height is the tray's slot too
      kbUp = px > 60;                      // ★ #756

      // #328: change-gated like the vv writer — a re-push of the same height
      // (C# re-posts WillChangeFrame freely) must not re-pin the log.

      insetChanged = false;
    };
  })();


  /* #334 iOS-62 — BOOT-SCOPED late-height re-pin. The boot pin in
   * onChatScreenLoaded is one synchronous write, but bubbles GROW after it —
   * file-transfer state swaps mutate rows IN PLACE (setFileProgress: progress
   * bar/hint/Open-file appear) and app-invite remote icons load — pushing the
   * newest content below the fold ("chat opens not quite at the bottom", Damir
   * walk 2026-08-11; media tiles already self-re-pin on img load). Bounded
   * settle window + nearBottom guard + USER-INPUT ABORT — the #328 MAJOR-2
   * lesson: a pin without an abort fights the user; touch is not enough on
   * desktop, so wheel + mousedown cancel too. Idempotent beside the #324 stick
   * (same value, same direction). */

    document.addEventListener(evName, cancelBootRepin, { passive: true, capture: true }));

    bootRepinEnd = performance.now() + ms;
    cancelAnimationFrame(bootRepinRaf);
    (function step() {
      if (performance.now() >= bootRepinEnd) return;
      if (nearBottom()) {
        const max = box.scrollHeight - box.clientHeight;
        if (box.scrollTop < max) box.scrollTop = max;
      }
      bootRepinRaf = requestAnimationFrame(step);
    })();
  }

  /* —— iOS-56 r3 — edge-swipe back, SHELL lever (#325) ——————————————————————
   * Two rounds of a native UIScreenEdgePanGestureRecognizer died silently in
   * UIKit arbitration (never transitioned to Began — no [swipe] lines with the
   * recognizer on the WKWebView + simultaneous recognition, then on the page
   * root + scroll-pan requireToFail). The touches provably DO reach this page
   * (scrolling works), so the pan is detected HERE instead: touchstart within
   * 24px of the left edge, then >70px rightward travel with <50px vertical
   * drift inside 700ms = back. Sheet-first: an open overlay consumes the swipe
   * (dismissTopOverlay() — synchronous here, same grammar as Esc/back; a
   * locked money sheet swallows it); otherwise ixian:back = the topbar-back
   * verb (popToRootAsync — overlay-aware C#-side). Touch surfaces only;
   * desktop untouched. No horizontal gesture exists in the chat surface, so
   * there is nothing to collide with; vertical scroll intent bails early. */
  /* ★ L3 (#706): the recogniser moved to src/components/edge-back.js so every shell can
   * attach it with one line; the numbers are the shipped ones. What stays HERE is the
   * one-level chain — the same order chatBack runs for hardware back: channel → stack
   * → tray → cover → selection → ixian:back. */
  attachEdgeBack({ onBack: () => {
    // #328 (audit MINOR): the bot channel selector is hand-rolled (top-
    // anchored panel, deliberately NOT on the shared overlay stack) — the
    // sheet-first contract must cover it too, or the swipe closes the
    // whole chat under an open panel.
    if (channelDropdown) { closeChannelSelector(); return; }   // live-state probe: nulled at close START (an exiting panel must not eat the swipe)
    const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
    if (dismiss && dismiss()) return;                          // a sheet/menu sits ABOVE the selection bar
    if (closeAttachTrayIfOpen()) return;                       // ★ #705: the attach tray, same order as chatBack
    // SELECTION FIRST: back out of the contextual bar before it backs out of
    // the conversation (the natives' order; the ✕ is the same exit).
    if (chatSelect) { exitChatSelect(); return; }
    // ★ L1 (#640) / W5: the money cover consumes back before the page pops (chatBack order)
    if (chatSendView) { closeSendTakeover(); return; }
    bridge.send('ixian:back');
  } });

  /* —— page ready — fire ixian:onload AFTER the document fully loads, matching
   *    the legacy onload() timing (spixi.js:88 → window load). Firing it
   *    synchronously during parse raced C#'s conversation push: the first entry
   *    could arrive empty and only a manual refresh fixed it. Deferring to the
   *    window 'load' event makes C# push setChatMode/setNickname/addMe/addThem at
   *    the right time, so the conversation populates on first open. ———————————— */
  function signalReady() {
    /* ★ Session K [CDPERF] — TEMPORARY, the boot SPLIT. C#'s constructor → onload gap
       (140–180 ms, #754) is two things: creating the WebView and loading + parsing this
       1.2 MB page. Navigation Timing says which: `nav` = navigationStart → this handler,
       `dcl` = the parse (DOMContentLoaded − navigationStart) — so the WebView's own
       creation cost is C#'s gap minus `nav`. Fixed words + integers; retire with the set. */
    try {
      const e = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      const t = performance.timing;
      const dcl = e ? Math.round(e.domContentLoadedEventEnd) : (t ? t.domContentLoadedEventEnd - t.navigationStart : -1);
      console.warn('[CDPERF] chat-shell boot nav=' + Math.round(performance.now()) + 'ms dcl=' + dcl + 'ms');
    } catch (e) {}
    bridge.ready();
    // Fallback: if nothing has painted shortly after ready (brand-new empty chat
    // whose C# skips clearMessages, or a missing onChatScreenLoaded), replace the
    // boot spinner with the current model so it never sticks. Never paints during
    // a load burst (that render is owned by onChatScreenLoaded / the burst safety).
    setTimeout(() => { if (!firstRenderDone && !bursting) renderLogNow(); }, 500);
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
