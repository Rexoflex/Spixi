      if (extra.name !== undefined) rec.name = extra.name || '';
      if (extra.iconUrl !== undefined) rec.iconUrl = extra.iconUrl || null;
      if (extra.astate !== undefined) rec.astate = extra.astate;
      if (extra.appInstallURL !== undefined) rec.appInstallURL = extra.appInstallURL || '';
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE/UPSERT a payment card (legacy addPaymentRequest). extra carries the
   * verbatim title, amount, status enum (from status_icon), txid, enableView. */
  function upsertPayment(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'payment', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'payment';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.title !== undefined) rec.title = extra.title || '';
      if (extra.amount !== undefined) rec.amount = extra.amount;
      if (extra.pstatus !== undefined) rec.pstatus = extra.pstatus;
      if (extra.txid !== undefined) { rec.txid = extra.txid || ''; if (rec.txid) txIndex.set(rec.txid, id); }
      if (extra.enableView !== undefined) rec.enableView = extra.enableView;
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* CREATE a call event row (legacy addCall). missed = the bridge `declined`
   * flag (rang out / no answer); label = the C#-localized wording verbatim;
   * duration is a preformatted "m:ss" or empty. */
  function upsertCall(id, ts, missed, label, duration, outgoing) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'call' };
    rec.kind = 'call';
    if (ts) rec.ts = ts;
    rec.missed = !!missed;
    rec.label = label || '';
    rec.duration = duration || '';
    // C4: card side from message.localSender; undefined (old exe) keeps the
    // pre-C4 received-side default.
    if (outgoing !== undefined) rec.direction = outgoing ? 'sent' : 'received';
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    renderLog();
  }

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers — every one a page global (via bridge.exposeAll),
   * because executeUiCommand(fnRef, …) resolves fnRef as a bare page-global.
   * The 1:1 text path is wired; the rest are safe no-op stubs.
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    /* ——— header + mode (wired) ——————————————————————————————————————————— */

    // setChatMode(type, cost, costText, admin, botDescription, notificationsString)
    // type: 0 = 1:1, 1 = private group, 2 = blind group, 3 = bot (chat.js:152).
    // v1 focus is 1:1 text; we record the mode so grouping shows sender
    // labels/avatars for groups. cost/bot/notifications surfaces are later passes.
    setChatMode(type, cost, costText, admin, botDescription, notificationsString) {
      const t = Number(type) || 0;
      mode.type = t;
      mode.isBot = (t === 3);
      // isMulti = shows per-sender labels + avatars: private/blind GROUPS *and*
      // BOT channels (Damir F5: bot-group messages showed no nick/avatar because
      // bots are type 3). Legacy set the sender for `friend.bot || Group`
      // (SingleChatPage:1222). Group-only logic uses mode.type===1 directly.
      mode.isMulti = (t === 1 || t === 2 || t === 3);
      mode.admin = asBool(admin);
      // notificationsString "True"/"False" (groups/bots) — current mute state for
      // the chat-info notifications toggle (legacy chat.js:237).
      mode.notifications = asBool(notificationsString);
      // reflect a live mode/notification change into an OPEN chat-info takeover
      if (chatInfoOpen) refreshChatInfo();
      // channel UI is bot-gated (channel-as-title) — re-evaluate on any mode change
      renderTopbar();
      dbg('setChatMode', { type: t, cost, admin: mode.admin, notificationsString });
    },

    setNickname(nick) {
      identity.name = nick || '';
      invalidateMentions();                // 1:1 peer nick feeds the mention list
      renderTopbar();
    },

    // X1 follow-up: C# pushes the peer's (or group's) avatar on chat load so the TOPBAR
    // shows it with no messages yet (new contact) and for groups. Authoritative over the
    // message-scavenged fallback (addThem). resolveAvatar maps a sentinel → null → gradient.
    setAvatar(avatar) {
      identity.avatar = resolveAvatar(avatar);
      renderTopbar();
    },

    // setOnlineStatus receives a fully-localised string from C# (chat-online /
    // chat-offline / member count / waiting-for-response) — render it verbatim
    // as the presence sub-line. We flag the avatar dot online only for the
    // 1:1 "online" wording heuristically; presence text is the source of truth.
    setOnlineStatus(status) {
      identity.sub = status || '';
      const s = (status || '').toLowerCase();
      identity.online = !mode.isMulti && /online/.test(s);
      renderTopbar();
    },

    /* ——— messages (wired) ———————————————————————————————————————————————— */

    // Batch reset. showMore ("true"/"false") = whether a "load older" affordance
    // belongs at the top; v1 just resets the model (loadmore is a stub verb).
    clearMessages(showMore) {
      model.clear();
      rows.clear();
      fileIndex.clear();
      txIndex.clear();
      // NOTE: do NOT clear myLikes here — a C# re-flush (clearMessages→re-add)
      // must keep my own-reaction state, else the pill reverts to un-selected
      // while the heart+count survive (Damir 2026-07-07). myLikes is (re)loaded
      // per-peer from storage in onChatScreenReady; peer-switch resets it there.
      removeRequestPane();   // a re-flush after accept clears the request pane
      order = [];
      hideTyping();
      typingRow = null;
      // clearMessages marks the START of a load burst (loadMessages, xaml:1110) —
      // suppress renders until onChatScreenLoaded so the whole history paints once
      // (no flicker). We do NOT render here: the boot spinner (or the prior log)
      // stays until the burst finishes, avoiding a blank/notice flash.
      beginBurst();
      dbg('clearMessages', { showMore });
    },

    // TEXT create — own message. 12-arg legacy addMe shape (xaml.cs:1460).
    addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending) {
      upsertText(id, text, 'sent', toMs(time),
        { sent, confirmed, read, paid, errorSending },
        { avatar: resolveAvatar(avatar) });
    },

    // TEXT create — incoming message. Legacy addThem is called with 6 args
    // (xaml.cs:1460 for !localSender); status flags are irrelevant for received
    // rows (no ticks rendered). nick/address feed the group sender label/avatar.
    addThem(id, address, nick, avatar, text, time) {
      const av = resolveAvatar(avatar);
      upsertText(id, text, 'received', toMs(time), {},
        { senderNick: resolveNick(address, nick), senderAddress: address || '', avatar: av });
      // 1:1 topbar fallback: if setAvatar (onLoad, X1) hasn't landed a header avatar yet,
      // scavenge it from the peer's first message (1:1/bot only — groups get the group
      // avatar via setAvatar). Guarded on !identity.avatar so setAvatar always wins.
      if (av && !mode.isMulti && !identity.avatar) { identity.avatar = av; renderTopbar(); }
    },

    // TEXT status UPSERT (chat.js:1035, xaml.cs:1624). Update the row's status
    // (and text) if it exists; create it if not (robustness — the legacy handler
    // only updated, but C# may updateMessage a row this shell hasn't seen yet).
    // NOTE: `sent` here is the DELIVERY flag (message.sent, xaml.cs:1646), NOT
    // direction — a status tick must NEVER flip an existing row's side (own group
    // messages flipped to 'received' while delivery lagged, Damir F5 2026-07-08).
    // Only a robustness-create of an unseen row uses it as a best-guess direction.
    updateMessage(id, message, sent, confirmed, read, paid, errorSending) {
      const existing = model.get(String(id));
      const dir = existing ? undefined : (asBool(sent) ? 'sent' : 'received');
      upsertText(id, message, dir, existing ? existing.ts : Date.now(),
        { sent, confirmed, read, paid, errorSending });
    },

    // C13: the LOCAL user's own nick (SingleChatPage.onLoad). Lets the shell identify
    // "me" for self-mention emphasis + the @ jump-to-mention FAB. Refresh the memoized
    // mention context + the FAB so an already-rendered log re-evaluates its self-mentions.
    setSelfNick(nick) {
      selfNickPushed = nick ? String(nick) : '';
      invalidateMentions();
      if (typeof updateMentionFab === 'function') updateMentionFab();
    },

    // Remove a row and re-render so #63 grouping repairs around the gap.
    deleteMessage(id) {
      id = String(id);
      const rec = model.get(id);
      if (!rec) { dbg('deleteMessage: unknown', id); return; }
      if (rec.kind === 'file' && rec.fileid) fileIndex.delete(rec.fileid);
      if (rec.kind === 'payment' && rec.txid) txIndex.delete(rec.txid);
      model.delete(id);
      order = order.filter((x) => x !== id);
      renderLog();
    },

    // Peer is typing — show the pill briefly (auto-hides after 5s).
    showUserTyping() { showTyping(); },

    // Clear the composer input (C# echoes this after a successful send).
    clearInput() { if (composerEl) clearComposer(composerEl); },

    /* ——— lifecycle acks (minimal) ———————————————————————————————————————— */

    // C#→JS acks. onChatScreenReady carries the peer address; store it so the
    // avatar hue is identity-stable even before setNickname lands.
    onChatScreenReady(address) {
      identity.address = address || '';
      identity.avatar = null;              // per-peer reset (desktop reparent); setAvatar (onLoad) re-sets it
      if (!identity.name) renderTopbar();
      maybeRestoreDraft();                 // address known → bring back any saved draft (CH7)
      loadLikes();                         // address known → restore my own-reaction state (per-peer)
      loadLoadedMedia();                   // restore which remote media the user loaded (per-peer)
      loadDeclinedApps();                  // restore which app invites the user declined (per-peer, C7)
      groupRoster.clear();                 // per-peer reset: don't leak peer A's roster into B (desktop reparent)
      groupNicks.clear();                  // per-peer reset (repopulated by this peer's updateGroupChatNicks burst)
      invalidateMentions();                // per-peer reset of the mention name list
      resetMentionTracking();              // per-peer reset of the @ jump-to-mention seen/baseline state (#8)
      dbg('onChatScreenReady', address);
    },
    // End of the initial load burst (fires after loadMessages, xaml:588) — paint
    // the whole history in ONE render, pin to the bottom, and put the caret in the
    // composer so the user can type immediately without tapping it (Damir).
    onChatScreenLoaded() {
      // End the load burst and paint the WHOLE history in ONE render (spinner →
      // conversation, no intermediate empty-notice frame). Always renders (even
      // for an empty chat: shows the secure notice) — not gated on `bursting`.
      bursting = false;
      clearTimeout(burstSafety);
      renderLogNow();
      box.scrollTop = box.scrollHeight;
      maybeRestoreDraft();                 // fallback if onChatScreenReady didn't carry the address
      focusComposer();
      dbg('onChatScreenLoaded');
    },

    hideBackButton() { dbg('hideBackButton'); },     // 2-pane: back owned by host chrome
    setUnreadIndicator(n) { dbg('setUnreadIndicator', n); },

    /* ——— payments (view-only, wired) ————————————————————————————————————————
     * addPaymentRequest is the 14-arg legacy shape (xaml.cs:1310/1361):
     *   (id, txid, address, nick, avatar, title, amount, status, statusIcon,
     *    time, localSender, confirmed, read, enableView)
     * `title` + `status` are C#-LOCALIZED strings; `statusIcon` is the stable
     * signal we map to the status enum. localSender ("True"/"") → direction. */
    addPaymentRequest(id, txid, address, nick, avatar, title, amount, status, statusIcon, time, localSender, confirmed, read, enableView) {
      upsertPayment(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        title: title || '', amount: amount,
        pstatus: paymentStatusFrom(statusIcon),
        txid: txid || '', enableView: asBool(enableView),
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },

    // Request-status update (xaml.cs:1665): (msg_id, txid, status, statusIcon,
    // enableView). Patches the card in place (re-render); ignores unknown ids.
    updatePaymentRequestStatus(id, txid, status, statusIcon, enableView) {
      id = String(id);
      const rec = model.get(id);
      if (!rec || rec.kind !== 'payment') { dbg('updatePaymentRequestStatus: unknown', id); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      if (txid) {
        if (rec.txid && rec.txid !== String(txid)) txIndex.delete(rec.txid); // drop stale key on re-key (N1)
        rec.txid = String(txid); txIndex.set(rec.txid, id);
      }
      rec.enableView = asBool(enableView);
      renderLog();
    },

    // Direct-payment status update (xaml.cs:1648): (txid, status, statusIcon) —
    // keyed by TXID, so resolve via txIndex.
    updateTransactionStatus(txid, status, statusIcon) {
      const id = txIndex.get(String(txid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateTransactionStatus: unknown txid', txid); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      renderLog();
    },

    /* FILE transfer create (chat.js addFile:904, 13-arg). me/sent/read/paid are
     * the .NET bool strings; nick/address feed the group sender label/avatar. */
    addFile(id, address, nick, avatar, fileid, name, time, me, sent, read, progress, complete, paid) {
      upsertFile(id, toMs(time), asBool(me) ? 'sent' : 'received', fileid, name,
        fileStateFrom(me, progress, complete), progress,
        { senderNick: resolveNick(address, nick), senderAddress: address || '' });
    },

    /* FILE transfer progress/complete (chat.js updateFile:1009, keyed by fileid).
     * Update the record + the live row in place (setFileProgress handles the
     * bar AND the progress→complete flip, re-arming the open action). */
    updateFile(fileid, progress, complete) {
      const id = fileIndex.get(String(fileid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateFile: unknown fileid', fileid); return; }
      const prev = rec.fstate;
      const done = asBool(complete) || (Number(progress) || 0) >= 100;
      rec.progress = Number(progress) || 0;
      // BOTH directions tick then flip to complete (Damir F5: outgoing shows
      // progress too — the sender gets per-packet ticks, TransferManager:410).
      rec.fstate = done ? 'complete' : 'progress';
      const row = rows.get(id);
      // setFileProgress mutates a row that is ALREADY in 'progress' (bar tick +
      // the progress→complete flip). A structural change (offer→progress etc.)
      // has no track to grow, so rebuild the row from the model instead.
      if (row && prev === 'progress') setFileProgress(row, rec.progress, { state: rec.fstate });
      else renderLog();
      // slick completion cue for OUTGOING transfers (Damir F5): a one-shot success
      // toast the moment a sent file finishes (the bar + open button carry the rest).
      if (done && prev !== 'complete' && rec.direction === 'sent' && !rec.sentToastShown) {
        rec.sentToastShown = true;
        showToast({ text: (window.SL && window.SL.fileSent) || 'File sent', tone: 'success', host: overlayHost, strings: window.SL || {} });
      }
    },

    // CALL event (chat.js addCall:1496): (id, text, declined, time) + C4 trailing
    // args: outgoing ("True"/"False" — message.localSender), missed (declined AND
    // incoming; carried for future no-answer-vs-missed styling — the call-back
    // nudge intentionally still shows for BOTH, legacy parity), durationSecs (raw
    // seconds, "" unless answered+ended). Old exe → all three undefined: side
    // defaults to received and the duration falls back to the "(m:ss)" embedded
    // in the localized label, exactly as before.
    addCall(id, text, declined, time, outgoing, missed, durationSecs) {
      const isDeclined = asBool(declined);
      const raw = String(text || '');
      // C4 raw seconds win; legacy "(m:ss)"-in-label is the fallback
      let dur = '';
      const secs = parseInt(durationSecs, 10);
      if (!isDeclined && !isNaN(secs) && secs >= 0) {
        dur = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
      }
      if (!dur) dur = isDeclined ? '' : ((raw.match(/\((\d+:\d{2})\)/) || [])[1] || '');
      // strip a trailing "(m:ss)" so the label is just the wording; the duration
      // is rendered separately by the card
      const label = raw.replace(/\s*\(\d+:\d{2}\)\s*$/, '').trim();
      upsertCall(id, toMs(time), isDeclined, label, dur,
        outgoing === undefined ? undefined : asBool(outgoing));
    },

    // REACTIONS (chat.js addReactions:549) — ;-joined "key:count". Store on the
    // record (so re-renders keep them) + apply to the live row with a pop. The
    // bridge re-emits the FULL list each time, so parse-replace is correct.
    // C5: trailing `own` arg = ;-joined keys the local user reacted with
    // (undefined on an old exe → myLikes fallback inside parseReactions).
    addReactions(id, reactions, own) {
      const rec = model.get(String(id));
      if (!rec) { dbg('addReactions: unknown', id); return; }
      const parsed = parseReactions(reactions, id, own);
      rec.reactions = parsed.reactions;
      rec.tip = parsed.tip;
      const row = rows.get(String(id));
      if (row) {
        if (rec.reactions.length || rec.tip) applyRowReactions(rec, row, true);
        else applyReactions(row, { reactions: [] });   // cleared → remove pills
      }
    },
    // full participant roster (SingleChatPage.loadContacts → addContact per member,
    // xaml:474; args = address, nick, avatar, role). Blind groups mask address to
    // "[Unknown]" with a unique nick → key those by nick so they don't collapse.
    // Feeds the chat-info member list (Damir 2026-07-08; was a no-op stub — corrects
    // be-cutover CI1: this roster push already existed on the frozen bridge).
    addContact(address, nick, avatar) {
      const addr = String(address || '');
      if (!addr) return;
      const key = addr === '[Unknown]' ? ('blind:' + (nick || '')) : addr;
      const raw = avatar ? String(avatar).replace(/\\/g, '/') : '';
      const av = raw && !/spixiavatar\.png$|spixi-group-avatar\.png$/.test(raw) ? raw : null;
      const prev = groupRoster.get(key) || {};
      groupRoster.set(key, { address: addr, name: nick || prev.name || '', avatar: av || prev.avatar || null });
      invalidateMentions();                // roster nick changed → rebuild the mention name list
      if (chatInfoOpen) scheduleChatInfoRefresh();
    },
    // incoming contact request (xaml:1196) → accept/decline pane above composer
    showContactRequest() { showRequestPane(); },
    // reveal the topbar call action (C# gates when a call is possible, xaml:583)
    showCallButton() { callVisible = true; renderTopbar(); },
    // APP invite/session card (chat.js addAppRequest:1174). appStatus ∈
    // {Missing, Minimized, else} — already enum-shaped. Reuses installApp/joinApp.
    addAppRequest(id, appid, appname, appimage, address, nick, avatar, time, localSender, sent, read, appStatus, appInstallURL) {
      upsertApp(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        appid: appid, name: appname, iconUrl: appimage || null,
        astate: appStateFrom(localSender, appStatus),
        appInstallURL: appInstallURL || '',
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },
    // installed multi-user apps (loadApps, xaml:1088 — addApp(id,name,icon,publisher))
    // → the attach "App invite" picker. icon path doesn't resolve in-shell → omitted.
    addApp(id, name, icon, publisher) { chatApps.push({ id: String(id), name: name || String(id), publisher: publisher || '' }); },
    clearApps() { chatApps.length = 0; },
    // BOT CHANNELS (chat.js:1353/250/1345). setSelectedChannel names the current
    // channel + reveals the bar; addChannelToSelector rows arrive (pull-on-open)
    // into the live sheet; setChannelSelectorStatus flags any-channel-unread.
    addChannelToSelector(index, name, icon, unread) {
      const ch = { index: Number(index) || 0, name: name || '', icon: icon || '', unread: asBool(unread) };
      channelList.push(ch);
      if (channelSheetBody) {
        const ph = channelSheetBody.querySelector('.chat-channel-list__empty');
        if (ph) ph.remove();
        channelSheetBody.append(makeChannelRow(ch));
      }
    },
    setSelectedChannel(index, icon, name) {
      channelState.has = true;
      channelState.index = Number(index) || 0;
      channelState.icon = icon || '';
      channelState.name = name || '';
      renderTopbar();
    },
    // "true" ⇒ all read; anything else (incl. "") ⇒ unread (legacy chat.js:1345)
    setChannelSelectorStatus(status) {
      channelState.unread = String(status) !== 'true';
      renderTopbar();
    },
    // A participant's nick resolved/changed (chat.js:1233). Update every row from
    // that sender address + re-render so their label refreshes. Also store it so
    // later rows from an as-yet-unseen address get the right name on arrival.
    updateGroupChatNicks(address, nick) {
      const addr = String(address || '');
      if (!addr) return;
      groupNicks.set(addr, nick || '');
      invalidateMentions();                // a resolved sender nick joins the mention name list
      let touched = false;
      for (const rec of model.values()) {
        if (rec.senderAddress === addr && rec.senderNick !== (nick || '')) {
          rec.senderNick = nick || '';
          touched = true;
        }
      }
      if (touched) renderLog();
    },
    showRequestSentModal() { dbg('showRequestSentModal'); },
    // connectivity strip (xaml:1746/1754/1767) — non-empty opens, "" collapses
    showWarning(text) { setWarning(warningBanner, text || ''); },
  };

  bridge.exposeAll(handlers);

  // Do NOT paint the empty log now — that produced a spinner → empty-notice →
  // full-conversation sequence (the residual flicker Damir felt after the burst
  // gate). Instead the BOOT SPINNER stays until the first real render:
  // onChatScreenLoaded paints the whole history in ONE go. A short fallback
  // (armed at ready) covers a brand-new empty chat or a missing signal so the
  // spinner never sticks — but never paints mid-burst (guarded on !bursting).

  /* —— scroll-to-latest affordance (appears when scrolled up) ——————————————— */
  const stl = createScrollToLatest({ target: box });
  box.closest('.c-chat-canvas').append(stl);

  /* —— @ jump-to-mention FAB (#8, premium mentions #210) ————————————————————
   * Sits bottom-right, ABOVE the scroll-to-latest chevron. Appears ONLY when a
   * message mentioning the LOCAL user is off-screen; tap smooth-scrolls to the
   * nearest such message + pulses it. Identifying "me" needs the local nick,
   * which C# does not push to the chat yet — so this stays hidden until
   * SelfNick lands (be-cutover); highlight-all + the picker work regardless. */
  const mentionFab = document.createElement('button');
  mentionFab.type = 'button';
  mentionFab.className = 'chat-mention-fab';
  mentionFab.setAttribute('aria-label', (window.SL && window.SL.jumpToMention) || 'Jump to mention');
  if (window.SpixiIcons && window.SpixiIcons.icon) mentionFab.append(window.SpixiIcons.icon('at', { size: 22 }));
  else mentionFab.textContent = '@';
  const mentionFabBadge = document.createElement('span');   // count of unseen mentions (Telegram-style)
  mentionFabBadge.className = 'chat-mention-fab__badge u-tabular';
  mentionFabBadge.setAttribute('aria-hidden', 'true');       // count lives in the button aria-label
  mentionFabBadge.hidden = true;
  mentionFab.append(mentionFabBadge);
  box.closest('.c-chat-canvas').append(mentionFab);

  /* Cycle-with-count behaviour (Telegram-style, Damir 2026-07-09). The FAB counts
   * EVERY mention of ME the user hasn't SEEN yet — regardless of where it sits in the
   * history — and, per tap, jumps to the NEWEST unseen one first (the most recent @you,
   * usually the nearest scroll), pulsing it; each subsequent tap steps to the next-older
   * unseen (Damir: jumping to the earliest first felt backwards). A mention becomes
   * "seen" once it scrolls into view (or is jumped to). The seen set is PERSISTED per
   * peer (localStorage, same pattern as myLikes/loadedMedia) so a caught-up mention does
   * not resurface on the next open — mirrors Telegram's durable unread-mention marker.
   * No baseline seed: on first open, all not-yet-seen mentions (anywhere in the log)
   * surface, which IS the desired catch-up. */
  const mentionSeen = new Set();      // message ids whose @me has been seen (persisted per peer)

  /* does a message text @-mention the LOCAL user? (boundary-checked, case-insensitive) */
  function textMentionsMe(text) {
    const keys = mentionCtx().self;
    if (!keys.length || !text || text.indexOf('@') < 0) return false;
    const low = text.toLowerCase();
    const isWord = (c) => c && /[\p{L}\p{N}_]/u.test(c);
    for (const k of keys) {
      const key = String(k).toLowerCase();
      if (!key) continue;
      let i = low.indexOf('@' + key);
      while (i !== -1) {
        const before = i > 0 ? low[i - 1] : '';
        const after = low[i + 1 + key.length] || '';
        if (!isWord(before) && before !== '@' && !isWord(after)) return true;
        i = low.indexOf('@' + key, i + 1);
      }
    }
    return false;
  }
  function mentionIdsOrdered() {                         // chronological (oldest → newest)
    const out = [];
    for (const id of order) { const rec = model.get(id); if (rec && textMentionsMe(rec.text)) out.push(id); }
    return out;
  }
  function mentionRowVisible(row) {
    const br = box.getBoundingClientRect(); const rr = row.getBoundingClientRect();
    return rr.bottom > br.top && rr.top < br.bottom;
  }
  function updateMentionFab() {
    if (!mentionFab) return;
    if (!mentionCtx().self.length) { mentionFab.removeAttribute('data-visible'); return; }
    const ids = mentionIdsOrdered();
    let changed = false;
    for (const id of ids) {                              // mark any now-visible mention seen
      const row = rows.get(id);
      if (row && row.isConnected && mentionRowVisible(row) && !mentionSeen.has(id)) {
        mentionSeen.add(id); changed = true;
      }
    }
    if (changed) saveMentionSeen();                      // persist catch-up progress
    const unseen = ids.filter((id) => !mentionSeen.has(id));
    const n = unseen.length;
    mentionFab.toggleAttribute('data-visible', n > 0);
    mentionFab._next = n ? unseen[n - 1] : null;         // NEWEST unseen first (Damir: jump to the most recent mention; each tap then steps to the next-older)
    mentionFabBadge.hidden = n <= 1;                     // show a count only when >1 pending
    if (n > 1) mentionFabBadge.textContent = n > 99 ? '99+' : String(n);
    const base = (window.SL && window.SL.jumpToMention) || 'Jump to mention';
    mentionFab.setAttribute('aria-label', n > 1 ? base + ' — ' + n : base);
  }
  function resetMentionTracking() { loadMentionSeen(); }   // per-peer: restore the durable seen set
  mentionFab.addEventListener('click', () => {
    const id = mentionFab._next; if (!id) return;
    const row = rows.get(id); if (!row) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    row.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    row.setAttribute('data-mention-pulse', '');
    row.addEventListener('animationend', () => row.removeAttribute('data-mention-pulse'), { once: true });
    mentionSeen.add(id); saveMentionSeen();              // viewing it counts as seen (persisted) → next tap advances
    setTimeout(() => { row.removeAttribute('data-mention-pulse'); updateMentionFab(); }, 1600);
    updateMentionFab();
  });
  let mentionFabRaf = 0;
  box.addEventListener('scroll', () => {
    if (mentionFabRaf) return;
    mentionFabRaf = requestAnimationFrame(() => { mentionFabRaf = 0; updateMentionFab(); });
  }, { passive: true });

  /* —— composer (JS→C# emits) ——————————————————————————————————————————————
   * send  → ixian:chat:<encodeURIComponent(text)>  (legacy chat.js:409 — chat
   *         text is the ONE ixian verb that is URI-encoded; native.js otherwise
   *         composes raw, so we encode here and hand bridge.send the whole cmd).
   * typing → ixian:typing, throttled to >1s like legacy (chat.js:423). Legacy
   *         suppresses typing in group chats; mirror that.
   * After send we clear locally for snappiness; C# also echoes clearInput. */
  /* —— composer drafts (CH7). Persist the UNSENT composer text to localStorage
   * keyed by peer address so it survives leaving/returning to the chat, and the
   * chats list (home.html, same Resources/Raw/html origin) can show a "Draft: …"
   * excerpt. A draft is the user's own unsent text (not message history) →
   * SECURITY.md-OK to cache; cleared on a successful send. Fail-soft if
   * localStorage is unavailable. Keyed on identity.address, which lands via
   * onChatScreenReady BEFORE the composer can be typed into. */
  const DRAFT_PREFIX = 'spixi.draft.';
  let draftRestored = false;
  let draftSaveTimer = 0;
  function draftKey() { return identity.address ? DRAFT_PREFIX + identity.address : ''; }
  function saveDraft(text) {
    const k = draftKey();
    if (!k) return;
    try {
      if (text && text.trim()) localStorage.setItem(k, text);
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function clearDraft() {
    clearTimeout(draftSaveTimer);          // cancel any in-flight debounced save so it can't
    const k = draftKey();                  // resurrect the just-sent text after removeItem (audit race)
    if (!k) return;
    try { localStorage.removeItem(k); } catch (_) {}
  }
  /** Restore a saved draft once the peer address is known — but never clobber
   *  text the user already started typing, and only once per page life. */
  function maybeRestoreDraft() {
    if (draftRestored) return;
    const k = draftKey();
    if (!k) return;                              // address not known yet — try again later
    draftRestored = true;
    let saved = '';
    try { saved = localStorage.getItem(k) || ''; } catch (_) {}
    if (!saved) return;
    const input = composerEl && composerEl.querySelector('.c-composer__input');
    if (!input || input.value) return;          // don't overwrite in-progress typing
    input.value = saved;
    input.dispatchEvent(new Event('input'));    // grow + action sync; isTrusted=false → no spurious ixian:typing
  }

  /* —— own-reaction persistence (C5 interim). The bridge's addReactions re-emit
   * carries NO per-user flag, so "I reacted" is FE-remembered in myLikes. A C#
   * re-flush (clearMessages→re-add) or reopening the chat must NOT drop it, else
   * the pill loses its selected state while the heart+count survive (Damir F5,
   * 2026-07-07). Persisted keyed by peer address — same origin/pattern as drafts;
   * a like is the user's own action metadata, SECURITY.md-OK to cache. */
  const LIKE_PREFIX = 'spixi.likes.';
  function likeKey() { return identity.address ? LIKE_PREFIX + identity.address : ''; }
  function saveLikes() {
    const k = likeKey();
    if (!k) return;
    try {
      if (myLikes.size) localStorage.setItem(k, JSON.stringify([...myLikes]));
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function loadLikes() {
    myLikes.clear();                            // reset for THIS peer (desktop peer-switch safe)
    const k = likeKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => myLikes.add(String(id)));
    } catch (_) {}
  }

  // Remote media (GIF/image) load policy — legacy parity: load by default. The
  // global pref defaults ON; write 'off' to spixi.media.autoload to opt out (a
  // settings toggle can flip it — deferred UI). Regardless of the pref, URLs the
  // user DID load are remembered per peer so they auto-expand on re-entry (fixes
  // the "GIF hidden again after leaving + returning" bug). #82 security note in
  // be-cutover-brief (auto-loading remote media reveals the reader's IP to the host).
  const MEDIA_AUTOLOAD_KEY = 'spixi.media.autoload';
  const MEDIA_LOADED_PREFIX = 'spixi.media.loaded.';
  function mediaAutoloadOn() {
    try { return localStorage.getItem(MEDIA_AUTOLOAD_KEY) !== 'off'; } catch (_) { return true; }
  }
  function loadedMediaKey() { return identity.address ? MEDIA_LOADED_PREFIX + identity.address : ''; }
  function loadLoadedMedia() {
    loadedMedia = new Set();                    // reset for THIS peer (desktop peer-switch safe)
    const k = loadedMediaKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((u) => loadedMedia.add(String(u)));
    } catch (_) {}
  }
  function rememberLoadedMedia(url) {
    if (!url) return;
    loadedMedia.add(url);
    const k = loadedMediaKey();
    if (!k) return;
    try { localStorage.setItem(k, JSON.stringify([...loadedMedia])); } catch (_) {}
  }

  /* —— declined app-invite persistence (C7(a)). Declining an app invite is a LOCAL
   * action (the sender is NOT notified — future BE, be-cutover C7). Instead of deleting
   * the card (feels like it vanished), the invite stays and flips to a terminal
   * "Declined" state. Remembered per peer so it survives a C# re-flush (loadMessages
   * re-pushes the invite as 'invite'/'missing') and re-opening the chat. Same
   * origin/pattern as myLikes — the user's own action metadata, SECURITY.md-OK. */
  let declinedApps = new Set();
  const DECLINED_APP_PREFIX = 'spixi.app.declined.';
  function declinedAppKey() { return identity.address ? DECLINED_APP_PREFIX + identity.address : ''; }
  function loadDeclinedApps() {
    declinedApps = new Set();                    // reset for THIS peer (desktop peer-switch safe)
    const k = declinedAppKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => declinedApps.add(String(id)));
    } catch (_) {}
  }
  function declineApp(id) {
    id = String(id);
    if (declinedApps.has(id)) return;
    declinedApps.add(id);
    const k = declinedAppKey();
    if (k) { try { localStorage.setItem(k, JSON.stringify([...declinedApps])); } catch (_) {} }
    renderLog();                                 // repaint the card as 'declined'
  }

  /* —— @ jump-to-mention seen-state persistence (Telegram-style catch-up, Damir
   * 2026-07-09). Which of MY mentions the user has already caught up on, keyed by
   * peer address — so a mention doesn't resurface on re-open. Same origin/pattern
   * as myLikes; it's the user's own read-progress metadata, SECURITY.md-OK to cache. */
  const MENTION_SEEN_PREFIX = 'spixi.mentions.seen.';
  function mentionSeenKey() { return identity.address ? MENTION_SEEN_PREFIX + identity.address : ''; }
  function saveMentionSeen() {
    const k = mentionSeenKey();
    if (!k) return;
    try {
      if (mentionSeen.size) localStorage.setItem(k, JSON.stringify([...mentionSeen]));
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function loadMentionSeen() {
    mentionSeen.clear();                        // reset for THIS peer (desktop peer-switch safe)
    const k = mentionSeenKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => mentionSeen.add(String(id)));
    } catch (_) {}
  }

  let composerEl = null;
  let lastTypingSent = 0;
  composerEl = createComposer({
    placeholder: (window.SL && window.SL.chatPlaceholder) || 'Message',
    voice: false,
    onSend: (text) => {
      if (!text) return;
      bridge.send('ixian:chat:' + encodeURIComponent(text));
      clearDraft();                                   // sent → drop the saved draft (CH7)
      // composer already clears its own field on send; this is belt-and-braces.
    },
    onTyping: () => {
      if (mode.isMulti) return;                       // legacy: no typing in groups
      const now = Date.now();
      if (now - lastTypingSent > 1000) {              // >1s throttle (chat.js:423)
        lastTypingSent = now;
        bridge.send('ixian:typing');
      }
    },
    // ⊕ attach: redesigned attach sheet (tile grid) replacing the legacy native
    // attach bar. Routes to the existing verbs — nothing invisible.
    onAttach: () => openAttach(),
    // @-autocomplete member picker (#210). Always wired; mentionMembers() returns
    // [] in 1:1 (nothing to pick) so the picker only ever opens in group/bot chats.
    // `mode` isn't known at composer-creation, so the gate lives in the source fn.
    mentionSource: mentionMembers,
  });
  document.getElementById('chat-composer').append(composerEl);

  /* Save the draft as the user types (debounced ~400ms). Only genuine typing
   * (isTrusted) persists — a synthetic restore/clear event must not re-write.
   * flushDraft() writes immediately on blur / page-hide so leaving the chat
   * within the debounce window never drops the last keystrokes (audit). */
  {
    const input = composerEl.querySelector('.c-composer__input');
    if (input) {
      const flushDraft = () => { clearTimeout(draftSaveTimer); saveDraft(input.value); };
      input.addEventListener('input', (e) => {
        if (!e.isTrusted) return;
        clearTimeout(draftSaveTimer);
        const v = input.value;
        draftSaveTimer = setTimeout(() => saveDraft(v), 400);
      });
      input.addEventListener('blur', flushDraft);
      // WebView back/navigation away → persist the in-progress draft now.
      window.addEventListener('pagehide', flushDraft);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
    }
  }

  /* Put the caret in the composer so the user can type on entry without tapping
   * (Damir). Called from onChatScreenLoaded; guarded so a missing input or a
   * non-focusable state (e.g. a modal open) never throws. */
  function focusComposer() {
    try {
      const input = composerEl && composerEl.querySelector('.c-composer__input');
      if (input) input.focus();
    } catch (_) {}
  }

  /* —— page ready — fire ixian:onload AFTER the document fully loads, matching
   *    the legacy onload() timing (spixi.js:88 → window load). Firing it
   *    synchronously during parse raced C#'s conversation push: the first entry
   *    could arrive empty and only a manual refresh fixed it. Deferring to the
   *    window 'load' event makes C# push setChatMode/setNickname/addMe/addThem at
   *    the right time, so the conversation populates on first open. ———————————— */
  function signalReady() {
    bridge.ready();
    // Fallback: if nothing has painted shortly after ready (brand-new empty chat
    // whose C# skips clearMessages, or a missing onChatScreenLoaded), replace the
    // boot spinner with the current model so it never sticks. Never paints during
    // a load burst (that render is owned by onChatScreenLoaded / the burst safety).
    setTimeout(() => { if (!firstRenderDone && !bursting) renderLogNow(); }, 500);
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
