          const b = hubEl.querySelector('.c-settings__body');
          if (b) { b.scrollTop = t; requestAnimationFrame(() => { b.scrollTop = t; }); }
        }
      }
      if (masterWrap.parentNode !== root) root.replaceChildren(masterWrap, detailWrap);
      detailWrap.replaceChildren(currentView === 'hub' ? getEmpty() : buildScreen(currentView));
      // #274: remember which language the picker was BUILT with — a restored
      // picker renders before the onLoad burst lands (state.language still the
      // default), so rebuildHub refreshes it when the pushed current differs.
      if (currentView === 'language') detailWrap.dataset.langBuilt = state.language;
      else delete detailWrap.dataset.langBuilt;
      delete root.dataset.langBuilt;               // #274 re-review R5: clear the other mode's key
      if (currentView === 'notifications') detailWrap.dataset.notifSig = notifSig();
      else delete detailWrap.dataset.notifSig;
      delete root.dataset.notifSig;
      markSelected(currentView === 'hub' ? null : currentView);
    } else {
      // #336 (Damir F5 #15): a takeover sublevel DETACHES the hub node, and a
      // detached scroller re-attaches at scrollTop 0 — so About/How-to/Chat
      // appearance/Contributors/Delete-data snapped the hub to the top on
      // return (Theme/Language are sheets that never detach it → they held).
      // Save the hub scroll on the way OUT, restore it on the way back.
      if (currentView !== 'hub' && root.contains(hubEl)) {
        const b = hubEl.querySelector('.c-settings__body');
        if (b) hubScrollTop = b.scrollTop;
      }
      // #337 audit (iOS-66 root cause): an ALREADY-MOUNTED hub must not be
      // detach/re-attached — replaceChildren with the same node still resets the
      // scroller to 0, so every hub-view re-render (onRepresented, setPaneMode
      // re-assert) silently lost the scroll, then the restore below re-applied a
      // STALE latch (saved at the last sublevel visit ≈ bottom) → "Account snaps
      // to the bottom on a language change". Skip the swap when nothing changed;
      // consume the latch ONE-SHOT so a stale value can never be re-applied.
      if (currentView === 'hub' && hubEl.parentNode === root) {
        // hub already mounted — leave it in place (live scroll preserved)
      } else {
        root.replaceChildren(currentView === 'hub' ? hubEl : buildScreen(currentView));
        if (currentView === 'hub' && hubScrollTop) {
          const t = hubScrollTop; hubScrollTop = 0;   // one-shot (#337)
          const b = hubEl.querySelector('.c-settings__body');
          if (b) { b.scrollTop = t; requestAnimationFrame(() => { b.scrollTop = t; }); }
        }
      }
      // #274 review MINOR-2: track the built language for the NON-pane mount too — a
      // restored picker can boot before setPaneMode/setLanguage land (or the window
      // narrowed across the reload); rebuildHub refreshes it either way.
      if (currentView === 'language') root.dataset.langBuilt = state.language;
      else delete root.dataset.langBuilt;
      delete detailWrap.dataset.langBuilt;         // #274 re-review R5: clear the other mode's key
      if (currentView === 'notifications') root.dataset.notifSig = notifSig();
      else delete root.dataset.notifSig;
      delete detailWrap.dataset.notifSig;
    }
  }

  function buildHub() {
    return createSettingsHub({
      name: state.name,
      address: state.address,      // S1: setAddress push → QR + address chip (#147 marquee)
      avatarSrc: state.avatarSrc,
      hasCustomAvatar: state.hasCustomAvatar,
      theme: state.theme,
      languages: langList(state.language),   // A4: + the fallback row when the OS put us on a hidden locale
      language: state.language,
      lockEnabled: state.lockEnabled,
      backup: backupStatus(),      // iOS-19 (#283): local stamp — see backupStatus()
      version: appVersion,         // S4: setVersion push → hub Version row (spec §8-3)
      // Gates: dev + notifications/privacy/security/payment rows
      // stay OFF (no SettingsPage verb — be-cutover S-series).
      // Contributors UN-GATED (#240): the screen is STATIC component data — the
      // S10 open-verb was only ever needed to reach the separate ContributorsPage,
      // which an in-shell view doesn't touch.
      // Downloads UN-GATED (#264, S8 LANDED): SettingsPage now dispatches
      // ixian:downloads → the redesigned DownloadsPage/downloads.html shell,
      // presented like Backup (pane: pinned to the detail column; else takeover).
      // Change password UN-GATED behind the C# cap (iOS-20 #283, S7 LANDED):
      // SettingsPage pushes setCaps(...'encpass') + dispatches ixian:encpass →
      // EncryptionPassword (the redesigned lock shell). Old exe: cap absent →
      // row hidden, exactly as before.
      /* ★ NOTIF-2 (Damir's 2026-08-21 block): globalNotifications is no longer a dark
         gate — SettingsPage pushes the cap and dispatches the three verbs. Read from
         the cap rather than hardcoded to true so an OLD exe (which pushes no such cap)
         keeps the row hidden instead of showing switches whose verbs nothing handles. */
      capabilities: {
        contributors: true, downloads: true,
        changePassword: bridge.cap('encpass'),
        globalNotifications: bridge.cap('globalNotifications'),
      },
      onNotifications: showNotifications,
      // Q1-② (#267, S16 option a): in the PANE, Downloads is a true in-hub
      // SUBLEVEL — the list/open/delete verbs are routed through SettingsPage
      // (cap 'downloadsInline'), no second WebView, no pane-stacking (the #264
      // col-1 pin left the hub tappable underneath — the bug Damir reported).
      // Mobile (and an old exe) keeps the DownloadsPage takeover via the verb.
      onDownloads: () => {
        if (paneMode && bridge.cap('downloadsInline')) { showDownloads(); return; }
        bridge.send('ixian:downloads');
      },
      host: document.body,
      strings,
      // iOS-46 (#315): NO back arrow on the hub, ANY form factor — Account is a
      // peer TAB now (C# keeps the page warm + re-presents it), and a tab has no
      // "back". Exits that remain: the peer bottom-nav taps (mobile — routed
      // through exitSettings below, saving held edits), the rail (desktop, Damir
      // F5 r2 grammar), and the hardware/system back (handlers.onBack →
      // exitSettings — Android unchanged). Sublevels keep their back-to-hub.
      onBack: undefined,

      // Save (Damir, legacy parity) — explicit commit + pop via the single-fire
      // latch. ixian:save persists nick + language + lock + promotes avatar-tmp,
      // THEN pops the page (§2). Fires exactly once; no local re-render/morph.
      // W2 (#348): the explicit control exists ONLY as the legacy-exe fallback.
      // createSettingsHub builds no action at all when onSave is absent
      // (settings-shell.js:338), so auto-save simply has no check icon.
      onSave: autoSaveOn() ? undefined : commitSave,

      /* ★ N42 (#443, Damir): Contacts, reachable from Account. There is no C# verb
         for "go home and open the contacts directory" — the same gap S11 names for
         landing on a tab — so it rides the SAME #238 localStorage hand-off the
         bottom-nav/rail taps already use, with 'contacts' as the id. home.html
         consumes it, lands on Chats and opens the directory takeover.
         The write is a fixed keyword and a timestamp: no user data, no new key. */
      onContacts: () => {
        try { localStorage.setItem('spixi.landtab', 'contacts:' + Date.now()); } catch (e) {}
        exitSettings();
      },

      /* ★ #443 (Damir V1): what IS this address. One sheet — the desktop overlay
         grammar (#261 M6) renders every c-sheet as a centred dialog, so this is one
         component, not a mobile/desktop fork.
         ⚠ COPY IS A DRAFT — flagged for Damir's sign-off. It deliberately does NOT
         claim the address hides anything: an Ixian address is public and its balance
         is visible in any explorer, so the honest promise is about WALLET ACCESS. */
      onAddressInfo: () => {
        const body = document.createElement('div');
        body.className = 'c-settings__addrinfo-body';
        const p1 = document.createElement('p');
        p1.textContent = strings.addressInfoBody
          || 'This is your address on the Ixian network. Share it, or let someone scan the code, and they can add you as a contact or send you IXI.';
        const p2 = document.createElement('p');
        p2.textContent = strings.addressInfoSafety
          || 'Sharing it is safe: it never gives anyone access to your wallet.';
        body.append(p1, p2);
        const sheet = createSheet({
          content: body, host: document.body, strings,
          title: strings.addressInfoTitle || 'Your Ixian address',
        });
        openSheet(sheet);
      },

      // About / How to use / Contributors — STATIC in-hub views, zero-C# (no bridge verb).
      onAbout: showAbout,
      onHowTo: showHowTo,
      onContributors: showContributors,

      // Chat appearance — FE-only takeover (6e.2): pattern intensity + text size,
      // persisted to localStorage; chat.html applies at boot. Zero-C#.
      onChatAppearance: showChatAppearance,

      // Share address (6e.2, #148⑤ row beside copy) — OS share sheet where the
      // WebView exposes it (navigator.share), else clipboard + toast. No bridge
      // verb exists (§9 wallet-receive precedent) — zero-C# by design.
      // W9 (#348, Damir): MOBILE ONLY. On desktop this button had no distinct
      // behaviour left — WebView2 exposes no navigator.share, so after #342 its
      // only path was the clipboard fallback, i.e. a duplicate of the copy control
      // built right beside it (settings-shell.js:542 vs :571). Removing it on
      // desktop removes a redundant control; it does NOT undo C7, because mobile
      // still gets the real system share sheet.
      // The gate is the UA sniff, and its failure direction is safe: the sniff
      // cannot fire on Android/iOS (their UA carries Android/Mobile), so the worst
      // case is that a desktop keeps a harmless duplicate — never that a phone
      // loses its share sheet.
      onShare: isDesktop ? undefined : shareAddress,

      // nickname — held local; empty is blocked by the component (legacy ixian:error).
      // Persisted on exit via ixian:save (immediate save would pop the page).
      // W2: fires once per edit (component commits on Enter/blur, not per keystroke).
      onNickname: (nick, ctrl) => { state.name = nick; state.dirtyNick = nick !== state.savedName; ctrl.done(); autoSave(); },

      // avatar pick — opens the native C# picker (ixian:avatar → loadAvatar(tmp) push).
      // Close the sheet keeping the current tile; the tmp arrives via loadAvatar and
      // is promoted on exit. NOTE: avatar file paths don't resolve in the self-contained
      // shell yet (repo-wide flag) → the tile shows the deterministic gradient fallback.
      onAvatarChange: (ctrl) => { avatarPickPending = true; bridge.send('ixian:avatar'); ctrl.done({ src: state.avatarSrc || null }); },
      // avatar remove — immediate C#-side (deleteOwnAvatar) → pushes showRemoveAvatar('0') + default loadAvatar.
      // Clear dirtyAvatar: a prior pick left avatar-tmp.jpg on disk; without this, exit would
      // ixian:save → applyAvatar() promotes that leftover tmp and RESURRECTS the removed avatar.
      /* ★ W2 (#348) review MAJOR-3: NO auto-save here either — same one-navigation
         collision as onLock. `ixian:apply` would clobber `ixian:remove`, so the avatar
         would stay on disk and stay visible to every contact while this shell had
         already painted the gradient and toasted "Settings saved".
         Nothing is lost by omitting it: the remove is immediate C#-side and answers with
         showRemoveAvatar + a default loadAvatar push. */
      onAvatarRemove: (ctrl) => { bridge.send('ixian:remove'); avatarPickPending = false; state.avatarSrc = null; state.hasCustomAvatar = false; state.dirtyAvatar = false; ctrl.done(); syncSave(); },

      // theme — apply locally for instant feedback, then the legacy verb (C# reloads the page).
      onTheme: (index, ctrl) => { applyTheme(index); bridge.send('ixian:appearance:' + index); ctrl.done(); },
      // #242/#243 (Damir): in the pane, Theme/Language open as SUBLEVEL screens
      // like every other row — the sheets stay for mobile.
      onThemeNav: () => { if (!paneMode) return false; showTheme(); return true; },
      // A4: mobile keeps the SHEET, but the hub's own sheet call carries no hint
      // (settings-shell.js:732) — so when the fallback row is present we open the
      // same sheet here, with the pending-translation hint. Otherwise: unchanged.
      onLanguageNav: () => {
        if (paneMode) { showLanguage(); return true; }
        const hint = langHint(state.language);
        if (!hint) return false;               // normal case → the component's sheet
        settingsOptionSheet({
          title: strings.language || 'Language',
          hint,
          options: langOptions(state.language),
          current: state.language,
          host: document.body,
          strings,
          commit: (code, ctrl) => { state.language = code; bridge.send('ixian:language:' + code); ctrl.done(); },
          // C# reloads the page on the verb; rebuild anyway so the row value is
          // never stale (we bypassed the component's own onPicked repaint).
          onPicked: (o) => { if (o) scheduleRebuild(); },
        });
        return true;
      },
      // language — persists + reloads C#-side. A4: the reloaded shell now resolves
      // its dictionary from the SL language-code carrier (see the boot line), so the
      // settings UI DOES come back in the picked locale (was: en-us in every locale).
      // NOTE: no live *SL marker in this comment — the C# substituter is text-based
      // and would rewrite it here too. Locales without
      // a shell dictionary stay hidden — see the LANGS/PENDING_LANGS note above.
      onLanguage: (code, ctrl) => { state.language = code; bridge.send('ixian:language:' + code); ctrl.done(); },

      // app lock — ON optimistic; OFF also optimistic here (matches legacy): the frozen
      // bridge only CONFIRMS a successful OFF (setLockEnabled('False') on auth success)
      // and gives NO signal on auth cancel, so the spec's pending-OFF security UX would
      // wedge the spinner. Optimistic-OFF self-heals from the setLockEnabled push / next
      // load. Ideal pending-OFF needs a C# auth-cancel signal (BE gap S6).
      // r3: a toggle is only persisted by onSaveSettings → mark dirty (Save shows,
      // exit saves). OFF still runs the C# LockPage auth first; a canceled auth
      // leaves the C# field unchanged, so the save is a harmless no-op then.
      /* ★ W2 (#348) review MAJOR-1 + MAJOR-2 — DO NOT auto-save here. Two reasons, and
         each one alone is disqualifying:
         1. bridge.send is a raw `location.href` assignment with NO queue (native.js:63).
            Two of them in one task coalesce last-wins — the #185 lesson home.html:706
            already documents. `ixian:apply` would CLOBBER `ixian:lock:on`, so C# would
            never flip the field and the save would write the OLD value while the toggle
            read ON and the toast said "Settings saved".
         2. Turning the lock OFF is not resolved here at all: `ixian:lock:off` opens a
            LockPage auth modal, and the field only changes later in HandleAuthSucceeded.
            Saving now would persist the PRE-AUTH value and clear the dirty flag with it —
            leaving app-lock permanently ON with no way to remove it.
         The save is driven by C#'s CONFIRMATION instead — see setLockEnabled below. */
      onLock: (next, ctrl) => { bridge.send('ixian:lock:' + (next ? 'on' : 'off')); ctrl.done(); state.dirtyLock = true; syncSave(); },

      // backup — #243: in the pane it opens as a SUBLEVEL (the same c-settings-backup
      // screen, verbs forwarded by SettingsPage — cap 'backupInline'); mobile keeps
      // the BackupPage push. The cap also keeps an old exe on the safe push path.
      onBackup: () => {
        if (paneMode && bridge.cap('backupInline')) { showBackup(); return; }
        bridge.send('ixian:backup');
      },

      // Change Spixi password. This row is LIVE (S7 landed in #283): SettingsPage
      // pushes the `encpass` cap and dispatches ixian:encpass. The stale "gated off,
      // inert today" note that stood here was written before that and is deleted.
      // #341 (Damir F5 item (a)): in the PANE, Change password is a true in-hub
      // SUBLEVEL, exactly like Backup (#243) and Downloads (#267). Before this, the
      // verb pushed the EncryptionPassword page, which W7 makes cover its opener —
      // and the Account pane IS the window minus the rail, so the form filled the
      // window. That behaviour was correct for W7 and wrong for the user.
      // ⚠ Do NOT "fix" this by pinning EncryptionPassword to grid column 1. The hub
      // then stays visible AND live underneath, every hub row opens a sublevel below
      // the password pane, and the surface reads as frozen. That is the W7 bug.
      // Mobile keeps the pushed page: no pane, or an old exe without the cap.
      onChangePassword: () => {
        if (paneMode && bridge.cap('encpassInline')) { showEncpass(); return; }
        bridge.send('ixian:encpass');
      },

      onDanger: showDanger,
    });
  }

  // Save shows ONLY with unsaved changes (Damir F5 r2) — dirty lives in the
  // shell, so every dirty flip routes through here (rebuilds re-derive it too).
  // W2 (#348): with auto-save on, the control is not built at all, so this is a
  // no-op there and stays correct for the legacy fallback below.
  function syncSave() {
    if (hubEl) setSettingsSaveVisible(hubEl, !!(state.dirtyNick || state.dirtyAvatar || state.dirtyLock));
  }

  /* ★ W2 (#348, Damir's call): AUTO-SAVE. The Account screen showed a bare check
     icon that gave no sign of having done anything — and the model he assumed, and
     that the gap audit already agreed, is that a settings screen just saves.
     Every settings change now persists as it is made and confirms with a toast; the
     explicit control is gone.

     autoSaveOn() is the gate. Auto-save needs ixian:apply, the verb that persists
     WITHOUT popping the page (S14, SettingsPage:441). An older exe does not dispatch
     it and does not push the cap, and there the ONLY way to save is the popping
     ixian:save — which cannot be fired on every edit. That build keeps the explicit
     control exactly as before. New shell on an old exe therefore still works.

     ★ WHY THE TRIGGERS ARE WHERE THEY ARE — the security lens (handover gate).
     Saving the nickname calls FriendList.broadcastNicknameChange (SettingsPage:678),
     which tells EVERY contact. Auto-saving on a typing debounce would broadcast each
     half-typed nickname to all of them. It does not, and it cannot: the component
     commits the nickname on Enter or BLUR only (settings-shell.js:523/:531), so
     onNickname already fires once per edit — the same number of broadcasts the
     explicit Save produced. Avatar and app-lock are single discrete acts.
     Nothing here adds a verb, a key or a sink. */
  function autoSaveOn() { return bridge.cap('settingsApply'); }
  function autoSave() {
    if (!autoSaveOn()) { syncSave(); return; }   // legacy exe: show the control instead
    /* ★ review MINOR-12: nothing dirty, nothing to do. Every apply runs the WHOLE of
       saveSettingsCore — a language-file reload, an account-file write and an avatar
       promotion (SettingsPage:660-687) — so an edit that ends where it started must not
       trigger one, and must not toast "Settings saved" for a no-op. */
    if (!(state.dirtyNick || state.dirtyAvatar || state.dirtyLock)) { syncSave(); return; }
    commitSave();
  }

  function rebuildHub() {
    const prevBody = hubEl && hubEl.querySelector('.c-settings__body');
    const top = prevBody ? prevBody.scrollTop : 0;
    hubEl = buildHub();
    syncSave();
    if (paneMode) {
      // the hub column is always mounted; keep the open sublevel + its selection
      masterWrap.replaceChildren(hubEl);
      markSelected(currentView === 'hub' ? null : currentView);
      // #274: the language picker is a STATELESS state-keyed builder — refresh
      // it when the pushed current differs from the one it was built with (the
      // restored-across-reload boot builds it before setLanguage lands). Every
      // other sublevel keeps its live node (downloads buffers, backup flow —
      // the original "keep the sublevel" rule).
      if (currentView === 'language' && detailWrap.dataset.langBuilt !== state.language) {
        detailWrap.replaceChildren(buildScreen('language'));
        detailWrap.dataset.langBuilt = state.language;
      }
      // ★ AUDIT MAJOR (see notifSig): the same treatment for the notifications screen.
      if (currentView === 'notifications' && detailWrap.dataset.notifSig !== notifSig()) {
        detailWrap.replaceChildren(buildScreen('notifications'));
        detailWrap.dataset.notifSig = notifSig();
      }
      const nb = hubEl.querySelector('.c-settings__body');
      if (nb) nb.scrollTop = top;
    } else if (currentView === 'hub') {
      root.replaceChildren(hubEl);
      const nb = hubEl.querySelector('.c-settings__body');
      if (nb) nb.scrollTop = top;
    } else if (currentView === 'notifications' && root.dataset.notifSig !== notifSig()) {
      // ★ AUDIT MAJOR (see notifSig) — the mobile/takeover mode of the same fix.
      root.replaceChildren(buildScreen('notifications'));
      root.dataset.notifSig = notifSig();
    } else if (currentView === 'language' && root.dataset.langBuilt !== state.language) {
      // #274 review MINOR-2: refresh a mounted NON-pane language picker when the
      // pushed current differs from the one it was built with (stale check).
      root.replaceChildren(buildScreen('language'));
      root.dataset.langBuilt = state.language;
    }
  }

  // Coalesce the onLoad burst (setNickname + setAppearance + setLockEnabled +
  // showRemoveAvatar + loadAvatar all fire synchronously) into ONE hub build.
  let rebuildQueued = false;
  function scheduleRebuild() {
    if (exiting || rebuildQueued) return;          // no rebuild once the page is exiting (flicker guard, #199)
    rebuildQueued = true;
    requestAnimationFrame(() => { rebuildQueued = false; if (!exiting) rebuildHub(); });
  }

  // View switches — one-liners into the mode-aware renderer (#240). showHub as a
  // screen's onBack = "detail → empty" in split mode, "takeover → hub" otherwise.
  // #274 review MINOR-3: user nav drops an un-consumed reload stash — if the language
  // reload never happened (old exe / failed send), the stale key must not re-open the
  // picker on the next Account boot inside the 15 s window.
  function showHub() { try { localStorage.removeItem(VIEW_RESUME_KEY); } catch (e) {} currentView = 'hub'; renderLayout(); }
  function showDanger() { currentView = 'danger'; renderLayout(); }
  /* iOS-21 — external links from About / How-to. The WebView never navigates to
     http(s) itself (iOSWebViewHandler.DecidePolicy Cancel-blocks it, and the
     Windows/legacy flows all route through Browser.OpenAsync); the sanctioned
     path is the ixian:openLink verb SingleChatPage already implements (:334),
     now mirrored on SettingsPage. URLs here are curated in-code, never user
     input (settings-app.js linkRow). Before this, About/How-to links rendered
     as dead selectable text (be-cutover S13). */
  function openExternal(url) { if (url) bridge.send('ixian:openLink:' + url); }

  function showAbout() { currentView = 'about'; renderLayout(); }
  function showHowTo() { currentView = 'howto'; renderLayout(); }
  function showChatAppearance() { currentView = 'chatappearance'; renderLayout(); }
  function showContributors() { currentView = 'contributors'; renderLayout(); }
  function showTheme() { currentView = 'theme'; renderLayout(); }          // #242/#243: pane-mode sublevels (hub routes them)
  function showLanguage() { currentView = 'language'; renderLayout(); }
  function showBackup() { currentView = 'backup'; renderLayout(); }        // #243: pane + backupInline cap only
  function showDownloads() { currentView = 'downloads'; renderLayout(); }  // Q1-② (#267): pane + downloadsInline cap only
  function showNotifications() { currentView = 'notifications'; renderLayout(); }  // ★ NOTIF-2

  /* ★ NOTIF-2 — the optimistic-switch resolver.
   *
   * switchRow hands us a `ctrl` and waits: `done()` commits the new position, `fail()`
   * rolls it back and shows the failure text. The authority is C#'s echo push, not this
   * function, so the ctrl is parked here and fired by whichever of the two arrives.
   *
   * ⚠ The timeout is the part that matters. Without it, an exe that does not handle
   * the verb (an OLDER build — the cap gate makes that unlikely but not impossible, and
   * a dropped navigation is always possible) would leave the switch pending forever with
   * no way back. Failing it back is honest: the preference genuinely did not change.
   *
   * A second tap on the same row before the first resolves supersedes it — the pending
   * ctrl is failed rather than dropped, so no control is left waiting. */
  /* ★ AUDIT MAJOR: the notifications SCREEN needed a rebuild path of its own.
   * `applyNotifPush` called scheduleRebuild → rebuildHub, whose only branches are the hub
   * and the language picker — so a mounted notifications screen was NEVER re-rendered from
   * state. Two consequences, one latent and one reachable today: an unsolicited push could
   * not correct a switch, and any renderLayout landing mid-flight (setPaneMode, setLocale,
   * the #315 onRepresented) snapped the switch back to the stale value and then IGNORED the
   * echo — leaving C# storing ON while the UI showed OFF, permanently, until the user left
   * and re-entered the sublevel.
   * Same shape as #274's langBuilt: a state-keyed signature, rebuilt only on a real change,
   * so a rebuild cannot churn the screen under a user's finger. */
  const notifSig = () => [state.notifEnabled, state.notifSenderName, state.notifSounds].join('|');

  const NOTIF_ACK_MS = 4000;
  const notifPending = Object.create(null);

  /* The echo half. C# stores the value then pushes back what it stored, so a value that
     disagrees with what the user asked for is a genuine failure and the switch must roll
     back to the STORED position — which is what re-rendering from state does.
     ⚠ Re-render unconditionally, including for the onLoad burst where nothing is
     pending: the switches must show the stored values on first paint. */
  function applyNotifPush(key, raw) {
    const v = boolPush(raw);
    state[key] = v;
    const p = notifPending[key];
    if (p) resolveNotif(key, p.want === v);
    scheduleRebuild();
  }

  function resolveNotif(key, ok) {
    const p = notifPending[key];
    if (!p) return;
    delete notifPending[key];
    clearTimeout(p.timer);
    try { if (ok) p.ctrl.done(); else p.ctrl.fail(); } catch (e) {}
  }

  function latchNotif(key, next, ctrl) {
    // Supersede an in-flight tap on the same row rather than orphaning its ctrl.
    resolveNotif(key, false);
    const timer = setTimeout(() => { resolveNotif(key, false); }, NOTIF_ACK_MS);
    notifPending[key] = { ctrl, timer, want: !!next };
    const verb = (key === 'notifEnabled') ? 'ixian:notifEnabled:'
      : (key === 'notifSenderName') ? 'ixian:notifSenderName:'
      : 'ixian:notifSounds:';
    bridge.send(verb + (next ? 'on' : 'off'));
  }
  function showEncpass() { currentView = 'encpass'; renderLayout(); }      // #341: pane + encpassInline cap only

  // #242: detail-screen chrome for the inline pickers — same view topbar + body
  // grammar as the component screens; back = showHub (split: empties the detail).
  function pickerScreen(title, content) {
    const el = document.createElement('div');
    el.className = 'c-settings';
    el.append(createTopbar({ variant: 'view', title, onBack: showHub }));
    const body = document.createElement('div');
    body.className = 'c-settings__body u-scroll';
    body.append(content);
    el.append(body);
    return el;
  }

  /* Screen builders (stateless — rebuilt per open/mode-flip):
   * · danger — all four deletes are fire-and-forget INTENT: ctrl.done() dismisses
   *   the FE confirm; C# takes over (native alert for history/downloads; LockPage
   *   auth for account/wallet — presents FULL-WINDOW via the overlay-host fallback,
   *   #229/#230, even while this page is a pane). On a successful account delete
   *   C# re-runs onLoad → the hub rebuilds; a wallet delete tears the page down.
   * · about — static, zero-C#; version from the setVersion push (S4). No bridge
   *   verb opens a URL from the WebView → links render as selectable text
   *   (onOpenLink deliberately omitted, be-cutover S13).
   * · howto — static, zero-C#.
   * · contributors — static component data (#240 un-gated; no verb needed).
   * · chatappearance — FE-only (6e.2 / #147): live preview + presets; persists to
   *   localStorage, chat.html consumes at boot (see CHAT_PREFS note above).
   *   ★ N81 (#422) CLOSES the #239 ⓐ flag: the preview used to paint the raw
   *   light-scale value while the real dark chat rendered v × 0.36, so in dark
   *   theme it promised a pattern the chat never showed. The preview now assigns
   *   var(--chat-pattern-alpha-N), which resolves under the PREVIEW's own theme —
   *   it is the same number the chat will paint, by construction rather than by
   *   two derivations agreeing. */
  function buildScreen(view) {
    switch (view) {
      case 'danger': return createSettingsDanger({
        host: document.body,
        onBack: showHub,
        onDeleteHistory: (ctrl) => { bridge.send('ixian:deleteh'); ctrl.done(); },     // UNGATED C#-side (spec §8-2)
        onDeleteDownloads: (ctrl) => { bridge.send('ixian:deleted'); ctrl.done(); },
        onDeleteAccount: (ctrl) => { bridge.send('ixian:deletea'); ctrl.done(); },     // C# LockPage auth gate
        onDeleteWallet: (ctrl) => { bridge.send('ixian:delete'); ctrl.done(); },       // C# LockPage auth → shutdown → Launch
        strings,
      });
      case 'about': return createSettingsAbout({
        version: appVersion, host: document.body, strings,
        onOpenLink: openExternal,     // iOS-21
        onBack: showHub,
      });
      case 'howto': return createSettingsHowTo({
        host: document.body, strings,
        onOpenLink: openExternal,     // iOS-21 — "Learn more" → the help centre
        /* ★ Item 6 (#397/#400): the permanent community door. SettingsPage had no
           handler for ixian:joinBot at all (only HomePage did) — this batch gave it one
           that calls the SAME shared static, so nothing is duplicated and no second verb
           exists. Opt-in: the row does nothing until it is tapped. */
        onJoinCommunity: () => bridge.send('ixian:joinBot'),
        onBack: showHub,
      });
      /* ★ NOTIF-2 (Damir's 2026-08-21 block) — the global notification screen, live at
       * last. Each switch is OPTIMISTIC with rollback: switchRow moves at once, then
       * waits for ctrl.done()/ctrl.fail(). C# echoes the stored value back through
       * setNotif* on every write, which both resolves the control and makes a failed
       * write visible rather than silently reverting on the next open.
       *
       * `latchNotif` is the resolve half: the echo push can arrive before or after this
       * callback returns, so the ctrl is held and fired by whichever happens — with a
       * timeout so a verb that is never handled fails the switch back instead of
       * leaving it spinning forever. */
      case 'notifications': return createNotificationsScreen({
        enabled: state.notifEnabled,
        previews: state.notifSenderName,
        sounds: state.notifSounds,
        capabilities: { globalNotifications: bridge.cap('globalNotifications') },
        strings,
        onBack: showHub,
        onEnabled: (next, ctrl) => { latchNotif('notifEnabled', next, ctrl); },
        onPreviews: (next, ctrl) => { latchNotif('notifSenderName', next, ctrl); },
        onSounds: (next, ctrl) => { latchNotif('notifSounds', next, ctrl); },
      });
      case 'contributors': return createSettingsContributors({
        strings,
        onBack: showHub,
      });
      case 'chatappearance': {
        const prefs = readChatPrefs();
        // a re-render of THIS view rebuilds the screen too — release the
        // outgoing instance before the new one replaces it in the DOM
        releaseChatAppearance();
        return (appearanceEl = createChatAppearance({
          patternOpacity: prefs.pattern,
          patternStyle: prefs.patternStyle,
          textScale: prefs.textScale,
          isDesktop,
          strings,
          onBack: showHub,
          onPattern: (v) => { try { localStorage.setItem(CHAT_PREFS.pattern, String(v)); } catch (e) {} },
          onPatternStyle: (v) => { try { localStorage.setItem(CHAT_PREFS.patternStyle, String(v)); } catch (e) {} },
          onTextScale: (v) => { try { localStorage.setItem(CHAT_PREFS.textScale, String(v)); } catch (e) {} },
        }));
      }
      // #242/#243: Theme/Language as pane sublevels (the hub routes here via
      // onThemeNav/onLanguageNav only in pane mode). Same commit verbs as the
      // sheets; the picker content is the SAME component in inline mode
      // (stay-open, check moves), wrapped in the view-topbar chrome.
      case 'theme': return pickerScreen(strings.theme || 'Theme',
        settingsThemeSheet({
          current: state.theme, strings, inline: true,
          commit: (v, ctrl) => { applyTheme(v); bridge.send('ixian:appearance:' + v); ctrl.done(); },
          onPicked: (o) => { if (o) { state.theme = o.value; scheduleRebuild(); } },
        }));
      case 'language': return pickerScreen(strings.language || 'Language',
        settingsOptionSheet({
          title: strings.language || 'Language',
          hint: langHint(state.language),      // A4: only when the fallback row is present
          options: langOptions(state.language),
          current: state.language, strings, inline: true,
          // C# persists + RELOADS settings.html on this verb — #274: stash the
          // open picker first so the reloaded pane re-lands HERE (the fresh boot
          // consumes the stash; the setLanguage push repaints the check via
          // rebuildHub's picker refresh) instead of the empty Account detail.
          commit: (code, ctrl) => { state.language = code; stashViewForReload(); bridge.send('ixian:language:' + code); ctrl.done(); },
        }));
      // #243: Backup as a pane sublevel — the SAME c-settings-backup screen the
      // standalone settings_backup.html shell mounts, with SettingsPage now
      // forwarding the two verbs (cap 'backupInline'; the flow is fire-and-forget,
      // C# owns file paths + the share sheet — S12/S2 notes apply unchanged).
      case 'backup': return createSettingsBackup({
        status: backupStatus(),              // iOS-19 (#283): local stamp (see backupStatus)
        host: document.body,
        // #245b (Damir): the ONE backup illustration everywhere — same asset the
        // create-account/onboarding tail + backup nudge use (build-shells copies
        // src/demo/images → html/images; fail-soft to the shield placeholder).
        illustration: 'images/backup.png',
        onBack: showHub,
        onBackup: (_payload, ctrl) => { stampBackup(); bridge.send('ixian:backupAccount'); ctrl.done(); },
        onExportWallet: (ctrl) => { stampBackup(); bridge.send('ixian:backupWallet'); ctrl.done(); },
        strings,
      });
      // Q1-② (#267, S16a): Downloads as a pane sublevel — the SAME
      // c-settings-downloads screen the standalone downloads.html shell mounts,
      // fed by SettingsPage's OWN clearFiles/addFile pushes (verb ixian:loadDownloads;
      // per-file open/delete = ixian:openDownload:/deleteDownload: — renamed from
      // DownloadsPage's open:/delete: so they can't collide with SettingsPage's
      // delete-account family; BOTH hosts now run the C# traversal guard).
      // File names are UNTRUSTED → the component renders textContent only.
      case 'downloads': {
        downloadsEl = createSettingsDownloads({
          files: [], host: document.body, strings,
          onBack: showHub,
          // Q1 review (#267 loop, MAJOR): the name is PEER-SUPPLIED (TransferManager
          // writes transfer.fileName verbatim) and rides an URL — it MUST be encoded.
          // Unencoded, a decoy file literally named `invoice%2Epdf` survives Chromium's
          // canonicalization as a valid-looking escape and C#'s UnescapeDataString
          // resolves it onto `invoice.pdf` — a wrong-file open, and a wrong-file DELETE.
          // encodeURIComponent → `%25` round-trips exactly (C# unescapes ONCE).
          onOpenFile: (name) => bridge.send('ixian:openDownload:' + encodeURIComponent(name)),   // fire-and-forget
          onDeleteFile: (name, ctrl) => { bridge.send('ixian:deleteDownload:' + encodeURIComponent(name)); ctrl.done(); },  // C# re-pushes the list
          // no onClearAll: same #264 audit rationale as downloads.html — the only
          // bulk verb (ixian:deleted) lives on the DANGER screen with its confirm.
        });
        bridge.send('ixian:loadDownloads');   // request the list into THIS WebView
        return downloadsEl;
      }
      // #341 (Damir F5 item (a)): Change password as a pane SUBLEVEL — the SAME
      // c-encpass screen the standalone settings_encryption.html shell mounts, with
      // SettingsPage now dispatching ixian:changepass: itself (cap 'encpassInline').
      // Mobile (and an old exe) keeps the pushed EncryptionPassword page via
      // ixian:encpass, so the #340 closeSublevelOverlays sweep still applies there.
      //
      // ★ TRANSPORT NOTE (SECURITY, read before you change this): the password rides
      // the SAME frozen `ixian:changepass:<DELIM>old<DELIM>new` verb as the standalone
      // page. Nothing new is invented, but the pattern now has a SECOND host, and this
      // host is a long-lived, parked document. Two guards make that safe, and both are
      // load-bearing: (1) the navigation is CANCELLED by C#, so no history entry keeps
      // the URL; (2) releaseEncpass() scrubs the fields on every leave path. Never
      // store, log or echo these values, and never widen the verb.
      case 'encpass': {
        // #341 audit MAJOR-1: release the PREVIOUS screen first. renderLayout skips
        // releaseEncpass while the user is ON this view, but it still rebuilds — a
        // second tap on the live hub row, setPaneMode on a window resize, setLocale,
        // onRepresented. Each one replaced the node and left the old, FILLED form
        // detached with its three plaintext values held by the window listener.
        // createChatAppearance's case does the same step for the same reason.
        releaseEncpass();
        encpassEl = createEncPassScreen({
          strings,                               // no `host`: the component ignores it (mountEncPassPage never passed one)
          // #341 audit MINOR-3: the component's success path calls onBack 900 ms after
          // the morph. In that window the user can open another sublevel from the live
          // hub column, and an unguarded showHub would close THAT screen instead.
          onBack: () => { if (currentView === 'encpass') showHub(); },
          onChangePassword: (oldPass, newPass, ctrl) => {
            // Watchdog: inline there is no page pop to signal an outcome, so a C#
            // that never answers would strand the form disabled forever. ctrl is
            // one-shot (lockCtrl), so a late real result after this fires is inert.
            const seq = ++encpassSeq;
            let settled = false;
            encpassGuard = setTimeout(() => {
              if (settled || seq !== encpassSeq) return;
              settled = true;
              encpassGuard = 0;
              encpassCtrl = null;
              ctrl.fail();                       // component supplies the wrong-current copy
            }, 8000);
            encpassCtrl = {
              seq,
              done: (p) => { settled = true; clearTimeout(encpassGuard); encpassGuard = 0; ctrl.done(p); },
              fail: (m) => { settled = true; clearTimeout(encpassGuard); encpassGuard = 0; ctrl.fail(m); },
            };
            bridge.send('ixian:changepass:' + ENC_DELIM + oldPass + ENC_DELIM + newPass);
          },
        });
        return encpassEl;
      }
    }
    // unknown view (unreachable — all setters are controlled): degrade safely.
    // NEVER hand hubEl to the detail region (it would steal it from the master).
    return paneMode ? getEmpty() : hubEl;
  }

  // Share own address (6e.2). Fallback = clipboard + "Copied" toast, so the row is
  // never a dead end.
  // ⚠ C7 (#342) CORRECTS THIS COMMENT: WinUI WebView2 DOES expose navigator.share, and
  // it REJECTS when it cannot present a sheet — so "errors are benign" was wrong, and
  // acting on it is what made the button a silent no-op on desktop. See shareAddress.
  // #235b (Opus review MINOR-2): navigator.clipboard is UNDEFINED on non-secure /
  // older WebView2 origins → `.writeText` threw into a silent catch (no copy, no
  // feedback). Now: guard clipboard existence, fall back to execCommand, and if
  // EVERYTHING fails surface an error toast — the row always gives feedback.
  function execCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand && document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }
  /* C7 (#342, Damir F5: "on desktop the share button beside the address does nothing").
   * CONFIRMED DEFECT, and the cause was the ladder's SHAPE, not a missing capability.
   * The old code took `navigator.share` as proof that sharing works, swallowed every
   * rejection with `.catch(() => {})`, and RETURNED — so the clipboard fallback below
   * it was unreachable on the one engine that needs it. WinUI WebView2 DOES expose
   * navigator.share and DOES reject when it cannot present a system sheet. The button
   * therefore did exactly nothing on desktop, silently.
   * The correct ladder already existed in the sibling shell (home.html
   * shareReceivePayload, the A10 fix).
   * ★ #455 (G5, Damir on device: "the share icon copies instead of sharing"). The
   * sentence that used to be here — "SettingsPage dispatches no such verb, so the
   * clipboard IS the terminal fallback" — was true, and it was the bug. Android's
   * WebView implements no Web Share API at all, so rung 1 is ABSENT on the platform
   * this button exists for, and the clipboard was not a fallback there but the only
   * behaviour. SettingsPage now dispatches `ixian:share` (the HomePage:748 branch,
   * lifted verbatim, sharing the same getPrimaryAddress() this shell was pushed), so
   * the ladder reaches a native sheet like its sibling does. The clipboard stays as
   * the last rung, for a host that has neither.
   *  1. navigator.share first, inside the click's activation window.
   *  2. On rejection: a WebKit AbortError means the sheet appeared and the user
   *     dismissed it — that is not a failure, so stay silent. WebView2 is detected
   *     through window.chrome.webview and always falls through, because its rejection
   *     means "I could not show a sheet".
   *  3. Clipboard, then execCommand, then an error toast. The row always answers. */
  function copyAddressFallback(addr) {
    const ok = () => showToast({ text: strings.copied || 'Copied', tone: 'success', host: document.body, strings });
    const fail = () => { if (execCopy(addr)) ok(); else showToast({ text: strings.copyFailed || 'Couldn’t copy. Select the address text instead', tone: 'error', host: document.body, strings }); };   // fallback = the dict value (A4 conflict gate)
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addr).then(ok, fail);
      } else { fail(); }
    } catch (e) { fail(); }
  }
  function shareAddress({ address }) {
    const addr = address || state.address;
    if (!addr) return;
    /* #455: the native rung is only correct for the address C# itself holds. A caller
       that somehow passes a different string must not silently share the wallet's
       primary address instead — it falls to the clipboard, which cannot lie. */
    const native = () => {
      if (addr === state.address) { bridge.send('ixian:share'); return true; }
      return false;
    };
    if (navigator.share) {
      try {
        navigator.share({ text: addr }).catch((e) => {
          const isWebView2 = !!(window.chrome && window.chrome.webview);
          if (e && e.name === 'AbortError' && !isWebView2) return;   // user cancelled — not a failure
          if (!native()) copyAddressFallback(addr);
        });
        return;
      } catch (e) { /* threw synchronously → fall through */ }
    }
    if (!native()) copyAddressFallback(addr);          // Android WebView: no Web Share API
  }

  // #274 review MAJOR-1: renderLayout, NOT showHub — showHub() re-set currentView to
  // 'hub', clobbering the just-restored takeResumeView() value and making the whole
  // restore dead code (the pane landed on the empty detail after every language
  // pick — Damir's "NOT fixed" F5). currentView is already correct here.
  renderLayout();   // render immediately; C# fills it after ixian:onload

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers — page globals (executeUiCommand resolves bare
   * fnRefs). SettingsPage.onLoad pushes these; loadAvatar also arrives after the
   * ixian:avatar picker. All coalesce into one hub rebuild.
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    // Q4-③ (#270): call-ui wiring GONE — calls present on the native CallPage.

    // #334 iOS-61: the Account tab's nav replica was BLIND to unread (the count
    // was pushed to the home WebView only) — SettingsPage.updateScreen now fans
    // it here, VALUE-latched C#-side (never the chat push's edge-latch, whose
    // number is documented-dishonest — chat.html:2745). NOTE: C#'s total is
    // mute-BLIND while home's badge is mute-aware (CH4 FE-interim) → the two can
    // differ on muted unread; accepted, logged as a dial. `nav` is declared
    // later in this script — safe: C# pushes only after ixian:onload.
    setUnreadIndicator(n) { lastNavUnread = parseInt(n, 10) || 0; try { setNavBadge(nav, 'chats', lastNavUnread); } catch (e) {} },

    // #334 iOS-58 (Damir dial: LIVE re-localize): the language pick no longer
    // reloads this page — C# pushes the picked code; the BUNDLED dictionaries
    // swap in place (SpixiStrings.get also re-stamps <html lang> → timestamps
    // re-localize on re-render), the cached hub is dropped (its text carries the
    // old dict), the nav replica rebuilds, and renderLayout re-renders the
    // current view — the picker stays exactly where it was and dirty nick/avatar
    // state SURVIVES (better than the #274 stash, which stays as belt for any
    // residual reload path). Components read strings at render time
    // (getStrings → window.SL) — no further plumbing. KNOWN residuals
    // (accepted, DECISIONS #334): C#-pushed verbatim text + generatePage carriers
    // keep the old language until the next natural regenerate.
    // ⚠ Do NOT write the carrier syntax literally in this file, not even in a
    // comment: localizeHtml is line-by-line and substitutes ANY match it finds, so
    // an empty one logged `Unknown localization key;` to ixian.log on EVERY
    // settings.html generation (found in Damir's 2026-08-19 log) and blanked the
    // comment text in the generated document.
    setLocale(code) {
      let dict = null;
      try { dict = window.SpixiStrings.get(String(code || '')); } catch (e) { dict = null; }
      if (!dict) return;
      window.SL = dict;
      strings = dict;
      if (code) state.language = String(code);
      // #337 (iOS-66): keep the pick surface's scroll through the re-localize —
      // the rebuilt hub re-attaches at 0, so capture the LIVE position now and
      // let renderLayout's one-shot restore re-apply it (mobile keeps the sheet
      // open over an unmoved hub; pane keeps the hub column where it was).
      // (r2: isConnected guard — a detached hub reports scrollTop 0, which would
      // ZERO a #15 latch saved on sublevel entry; unreachable today, belt only.)
      const hb = hubEl && hubEl.isConnected && hubEl.querySelector('.c-settings__body');
      hubScrollTop = hb ? hb.scrollTop : hubScrollTop;
      hubEl = null;
      emptyEl = null;      // loop MINOR-4: the memoized sd-empty pane baked the old dict
      // loop MINOR-5: the pane picker still arms the #274 reload-stash before the
      // verb — this push IS the proof no reload is coming; a stranded stash would
      // boot the NEXT pane open into the Language sublevel. The stash stays as
      // the belt for any genuine residual reload (which never delivers setLocale).
      try { localStorage.removeItem(VIEW_RESUME_KEY); } catch (e) {}
      buildPeerNav();
      renderLayout();
    },

    // setNickname(nick) — SettingsPage.onLoad:43
    setNickname(nick) { state.name = nick || ''; state.savedName = state.name; state.dirtyNick = false; scheduleRebuild(); },

    /* ★ N71 (#421): the live re-theme push. Two jobs, and the second is the one
     * that is easy to miss. (a) apply the swap, shared body (theme-runtime.js).
     * (b) REFRESH the 'Auto' resolution — this page owns the appearance picker, so
     * when the appearance is System the pushed name IS the new answer for every
     * later applyTheme(0). Without (b) a rebuild after an OS flip would snap the
     * page back to the boot theme and silently undo the push (★ #410).
     *
     * The order matters: autoTheme is updated FIRST, so anything the swap triggers
     * already reads the fresh value. Deliberately does NOT touch
     * `spixi.appearance` — an OS flip does not change the user's PICK (still
     * 'System'), and writing an idx here would silently convert their Auto choice
     * into a hard Light/Dark one. */
    setTheme(name) {
      /* ★ #46 audit (both auditors, independently): trust the pushed name as the
       * SYSTEM answer ONLY while System is the selected appearance. The pushed value
       * is getResolvedAppearanceName(), which returns the PICK whenever the pick is
       * explicit — so an unguarded assignment poisons the Auto cache with a value the
       * OS never reported. It is reachable because #421 newly routes the explicit-pick
       * path through the same sweep, and this page is now in it.
       * The sequence it broke (app = System, OS = light): pick Dark → autoTheme
       * becomes 'dark' → pick System → applyTheme(0) runs BEFORE the verb is sent and
       * paints from the poisoned cache → the Account flashes dark, then C#'s correct
       * push flips it back. A visible wrong-theme flash on the picker itself, which is
       * the one screen #242 round 2 cleaned up. */
      if (state.theme === 0) autoTheme = name === 'dark' ? 'dark' : 'light';
      applyPushedTheme(name);
    },

    // setAppearance(idx) — onLoad:46; idx = (int)ThemeAppearance
    setAppearance(idx) { const n = parseInt(idx, 10); state.theme = isNaN(n) ? 0 : n; applyTheme(state.theme); scheduleRebuild(); },

    // setLockEnabled(bool.ToString()) — onLoad:52 + lock-off auth resolution (HandleAuthSucceeded:241)
    /* ★ W2 (#348): this push is the AUTHORITATIVE app-lock value — the boot value at
       onLoad, and the post-auth resolution when the user turns the lock off. It is
       therefore the only safe place to persist it: one verb per task, and the value is
       the one C# actually holds.
       `lockSaved` starts undefined, so the FIRST push (boot) only records the baseline
       and never writes. */
    setLockEnabled(s) {
      const v = (s === 'True' || s === 'true' || s === true);
      state.lockEnabled = v;
      if (lockSaved === undefined) { lockSaved = v; state.dirtyLock = false; }
      else if (v !== lockSaved) { lockSaved = v; state.dirtyLock = true; autoSave(); }
      scheduleRebuild();
    },

    /* ★ NOTIF-2: the three global switches. Each is pushed once at onLoad and again as
       the ECHO of every write, which is what resolves the optimistic switchRow. A
       re-render is scheduled rather than done inline so the onLoad burst still coalesces
       into one paint (the :1018 rule). */
    setNotifEnabled(s) { applyNotifPush('notifEnabled', s); },
    setNotifSenderName(s) { applyNotifPush('notifSenderName', s); },
    setNotifSounds(s) { applyNotifPush('notifSounds', s); },

    // showRemoveAvatar('1'|'0') — onLoad:63 (only when a custom avatar exists) + onRemoveAvatar:411
    showRemoveAvatar(show) { state.hasCustomAvatar = (show === '1' || show === 'true' || show === true); scheduleRebuild(); },

    // loadAvatar(path) — onLoad:66 / after picker:374 / after remove:412. Legacy
    // encodes '/' as '&bsol;' (settings.html:378). A tmp path means a fresh pick →
    // mark dirty so exit promotes it. Path resolution in-shell is the known avatar
    // flag → the tile falls back to a gradient until that's fixed.
    loadAvatar(path) {
      let p = (path || '').replace(/&bsol;/g, '/');
      // DEFAULT sentinel: SettingsPage pushes 'img/spixiavatar.png' when no custom
      // avatar exists (xaml:461). It RESOLVES on WinUI → rendered the LEGACY avatar
      // image instead of the redesign gradient (Damir F5 2026-07-08). Map the default
      // sentinels to null so createAvatar draws the deterministic gradient — same as
      // contact_details' resolveAvatar.
      if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') p = '';
      state.avatarSrc = p || null;
      // Dirty = a fresh pick pending promotion. #242: since X1 this push is a DATA
      // URI (no 'avatar-tmp' in it) — the explicit pick latch decides; the path
      // sniff stays as a fallback for the imageToDataUri raw-path failure mode.
      // Initial load / post-remove default pushes arrive with no pick pending →
      // not dirty, so a stale pick can't get promoted on the next exit.
      let pickLanded = false;
      if (avatarPickPending && p) {
        state.dirtyAvatar = true;
        avatarPickPending = false;
        pickLanded = true;
      } else {
        // Consume the latch on a non-pick push too (Opus #246): a CANCELED picker
        // (or a default/empty re-push after cancel) reaches this branch with p===''.
        // Leaving the latch armed let a later reload push (language reload / account-
        // delete onLoad re-push, non-empty) false-mark dirtyAvatar → a spurious Save
        // + exit via ixian:save instead of a clean ixian:back. The pick flow is a
        // SINGLE non-empty loadAvatar push (the tmp), so clearing here can't drop a
        // real pick's dirty (that took the if-branch above).
        avatarPickPending = false;
        state.dirtyAvatar = !!p && /avatar-tmp/i.test(p);
      }
      scheduleRebuild();
      // W2 (#348): promote a fresh pick immediately. This also ends a real footgun —
      // a non-save exit sends ixian:back, and ixian:back DELETES avatar-tmp.jpg
      // (SettingsPage:184-189), so picking a photo and then leaving by any route that
      // was not Save silently threw the photo away.
      // ONLY on a landed pick: the boot and post-remove pushes take the else branch,
      // and auto-saving on those would write on every page load.
      if (pickLanded) autoSave();
    },

    // setVersion(version) — S4 (SettingsPage.onLoad, mirrors LaunchPage:33);
    // feeds the hub Version row + the About takeover.
    setVersion(v) { appVersion = v || ''; scheduleRebuild(); },

    // setAddress(address) — S1 (SettingsPage.onLoad). PLAIN identity address (legacy
    // share form, HomePage:322 — no ExtendedAddress _suffix, that's payment-only);
    // used VERBATIM; the component appends ':ixi' for the QR.
    setAddress(addr) { state.address = addr || ''; scheduleRebuild(); },

    // setLanguage(code) — S3 (SettingsPage.onLoad, legacy codes e.g. 'en-us',
    // settings.html:69-81). Fixes the Language row's shown "current" only; the
    // picker always committed correctly. Unknown/empty codes keep the default.
    setLanguage(code) { if (code) { state.language = String(code).toLowerCase(); scheduleRebuild(); } },

    // setPaneMode('1') — unit 2 (#240): HomePage hosts this page as a detail-column
    // PANE (wide window). Arrives in the onLoad burst BEFORE the overlay presents
    // (pushes coalesce ahead of the #225 present), so the pane never flashes the
    // takeover layout; re-pushed by the language-change reload. Display-only.
    setPaneMode(v) {
      const on = (v === '1' || v === 'true' || v === true);
      if (on === paneMode) return;
      paneMode = on;
      if (on) document.body.dataset.pane = '';
      else delete document.body.dataset.pane;
      renderLayout();
    },

    // setPaneMetrics(width) — #245: the hub column's width in CSS px (= the native
    // list column minus the rail strip), so the Account hub aligns with the chats
    // list and its hairline lands where the pane divider sits. Pushed with
    // setPaneMode; guarded against junk.
    setPaneMetrics(w) {
      const n = parseFloat(w);
      if (!isNaN(n) && n >= 200 && n <= 1000) {
        document.documentElement.style.setProperty('--sd-master-w', n + 'px');
      }
    },

    // onExitRequest() — C# asks the pane to close ITSELF (home tab switch, #240):
    // the same save-if-dirty exit as back-from-hub; single-fire latched, so a
    // repeat request while the pop is in flight is a no-op.
    onExitRequest() { exitSettings(); },

    // setCaps('a,b,…') — #242: C# declares which OPTIONAL verbs this build
    // dispatches (SettingsPage.onLoad pushes 'settingsApply' now that ixian:apply
    // exists). Mutates the bridge's capability object IN PLACE — bridge.cap()
    // reads the same reference — so the S14-gated Save-stays path lights up.
    // Shell + C# ship in one commit, but the gate keeps an OLD exe with a NEW
    // shell (or vice versa) from emitting a verb nobody dispatches.
    setCaps(list) {
      String(list || '').split(',').forEach((c) => {
        c = c.trim();
        if (c) bridge.capabilities[c] = true;
      });
      // iOS-20 (#283): the hub's Change-password row visibility reads
      // bridge.cap('encpass') at BUILD time — if the hub happened to render
      // before this push landed (boot ordering), rebuild so the row appears.
      scheduleRebuild();
      /* ★ W2 (#348) review MINOR-10: an edit committed BEFORE this push took the
         legacy branch and only revealed the check icon — and this rebuild then removes
         that icon, because auto-save is on now. Without this the edit would sit dirty
         with no affordance at all until exit. Flush it. */
      autoSave();
    },

    // Q1-② (#267): downloads list pushed by SettingsPage itself (ixian:loadDownloads
    // → clearFiles + addFile per file; re-pushed after a delete). Same settle-buffer
    // as downloads.html — one EvaluateJavaScriptAsync frame per file, so buffer
    // between the clear and an 80ms settle so a partial list never paints.
    // ctime is a LOCALE-OPAQUE DateTime.ToString() → displayed verbatim, never parsed.
    clearFiles() { dlBuf = []; dlSettle(); },
    addFile(name, ctime) {
      if (dlBuf === null) dlBuf = [];
      dlBuf.push({ name: name || '', time: ctime || '' });
      dlSettle();
    },

    // setEncPassResult('1'|'0') — #341. The standalone settings_encryption.html has
    // NO result push: C# alerts and pops the page, and mountEncPassPage releases the
    // form on a 1600 ms no-pop timer. Inline there is no pop, so SettingsPage answers
    // explicitly instead. '1' = the wallet was re-encrypted with the new password;
    // anything else = the current password was wrong. Carries NO password material.
    // A result that arrives after the user left the sublevel finds encpassCtrl null
    // (releaseEncpass cleared it) and is dropped.
    setEncPassResult(ok) {
      const c = encpassCtrl;
      // #341 audit MINOR-2: the seq test drops an answer that belongs to a submit the
      // user already walked away from, so it can never resolve a later form.
      if (!c || c.seq !== encpassSeq) {
        // #341 review MINOR-7: but a DROPPED SUCCESS must still be told. The inline
        // route suppresses the native alerts, so a user who leaves the screen while
        // C# is validating would get no confirmation on any surface — and the wallet
        // password HAS changed. The mobile route cannot reach this state: C# alerts
        // and pops there.
        if (String(ok) === '1') {
          showToast({ text: strings.passwordChanged || 'Password changed', tone: 'success', host: document.body, strings });
        }
        return;
      }
      encpassCtrl = null;
      if (String(ok) === '1') c.done();
      // #341 review MINOR-2: this needs its OWN key. Re-using `badPassword` collided
      // with the component's value for the same key, and extract-strings exits 1 on a
      // fallback conflict — the whole build chain would have stopped at step 1.
      else if (String(ok) === '2') c.fail(strings.encpassRejected || 'That password can’t be used. Pick a different one.');
      else c.fail();                             // '0' — component supplies the wrong-current copy
    },

    // onBack() — hardware back, routed by HomePage while this page is an overlay
    // (#240; SettingsPage.OnBackButtonPressed when pushed). In any screen (danger /
    // about / how-to / …) back returns to the hub (split: empties the detail);
    // from the hub it exits (save-if-dirty else back).
    onBack() {
      // AND-37 (the N51 family): an open bottom sheet (theme/appearance/language
      // pickers on mobile ride the shared overlay stack) consumes back BEFORE any
      // navigation — without this arm the hub branch below exited the whole page
      // from under the sheet and back landed on Chats. No C# mirror is needed
      // here: unlike chat, back ALWAYS routes into this shell (HomePage's
      // SettingsPage branch + SettingsPage.OnBackButtonPressed are unconditional).
      const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
      if (dismiss && dismiss()) return;
      if (currentView !== 'hub') showHub(); else exitSettings();
    },

    // #315 (iOS-46 warm re-present; #46 r1 MAJOR-1): C# now PARKS this page on
    // close and re-presents the SAME document — the single-fire `exiting` latch
    // (#199 flicker guard, designed for a page that DIES on pop) would otherwise
    // freeze every re-presented Account: renders bailed, every exit verb
    // suppressed, no back arrow left to save you (this batch removed it). The
    // re-present push resets the latch, re-arms the dirty machinery and repaints
    // whatever view the user parked on. Also un-gates the #314 backup-stamp poll
    // (which pauses on `exiting` — a parked page must not tick timers).
    onRepresented() {
      exiting = false;
      exitSent = false;            // W2: a re-presented document may exit again
      rebuildQueued = false;
      clearTimeout(exitHeal);      // W2: the re-present IS the reset; drop any pending heal
      // #46 r2 MAJOR-1: reconcile the dirty machinery with what the PARKING EXIT
      // already persisted — every reachable park routes through exitSettings,
      // which sent ixian:save:<name> when dirty, so at park time shell-state ==
      // C#-state. Without this, a re-presented page kept savedName/dirty* from
      // BEFORE that save: a phantom Save button, and worse — reverting the nick
      // to the stale savedName read as "not dirty" → exit sent ixian:back and
      // the revert was SILENTLY DROPPED (the #240 close-audit class).
      state.savedName = state.name;
      state.dirtyNick = state.dirtyAvatar = state.dirtyLock = false;
      avatarPickPending = false;
      refreshBackupStampIfChanged();   // a backup may have happened while parked
      renderLayout();
      syncSave();
      // #320: the peer nav may have parked with the EXIT tap's tab highlighted
      // (bottomnav auto-selects before onChange) — this page is the Account tab.
      try { setNavActive(nav, 'account'); } catch (e) { /* pre-nav boot */ }
    },
  };

  bridge.exposeAll(handlers);

  /* —— peer-tab bottom nav (Damir): Account reads as a home tab. Non-Account taps
   * do a best-effort ixian:back (pop SettingsPage → home); precise-tab landing +
   * true in-home integration need BE (HomePage pushing settings data, or a
   * home-tab-select verb) — be-cutover S11. The nav persists across the
   * hub/takeover swaps (it's a sibling of #settings-root). ————————————————————— */
  /* #334 iOS-58: the nav is now REBUILDABLE — its labels captured a dict, and
   * setLocale swaps dicts LIVE (no page reload), so the replica rebuilds in
   * place. The unread badge (iOS-61) is re-applied across rebuilds from
   * lastNavUnread — C#'s push is value-latched and won't repeat. */
  let nav = null;
  let lastNavUnread = 0;
  function buildPeerNav() {
    const items = [
      { id: 'chats', label: strings.chats || 'Chats', icon: 'messages' },
      { id: 'apps', label: strings.apps || 'Apps', icon: 'apps' },
      { id: 'wallet', label: strings.wallet || 'Wallet', icon: 'wallet' },
      { id: 'account', label: strings.account || 'Account', icon: 'user-circle' },
    ];
    const fresh = createBottomNav({
      items, active: 'account',
      // Desktop (Damir F5 r2): same LEFT RAIL as the home shell (logo on top) so a
      // FULL-WINDOW Account (narrow desktop window) reads as a peer pane. When C#
      // hosts this page as a real PANE (unit 2 #240, setPaneMode) this whole nav is
      // hidden — home's rail sits beside the pane.
      variant: isDesktop ? 'rail' : undefined,
      logo: isDesktop,
      // Leaving Account = pop back to home. Route through exitSettings (NOT a raw
      // ixian:back) so a held-but-uncommitted nickname / picked avatar is saved on
      // the way out, exactly like the topbar/hardware back (audit m1 — the raw back
      // dropped the edit + let C# delete avatar-tmp).
      // r3 QUIRK fix (Damir: "from Account you always land on whatever tab you left
      // on"): there's still no C# land-on-tab verb (S11), so the TAPPED tab rides
      // localStorage (same origin) — home consumes it via the storage event while
      // it sits under this pushed page (+ a focus fallback). Timestamped so a
      // stranded key can't switch tabs minutes later.
      onChange: (id) => {
        if (id === 'account') return;
        try { localStorage.setItem('spixi.landtab', id + ':' + Date.now()); } catch (e) {}
        exitSettings();
        // #320 (Damir F5 of #315): bottomnav moves the highlight on tap BEFORE
        // onChange runs — the exit-tap left e.g. Wallet selected, the page PARKED
        // in that state, and the warm re-present showed Account with the wrong tab
        // lit. This page IS the Account tab: snap the highlight back immediately
        // so the parked state is always canonical (belt: onRepresented re-asserts).
        setNavActive(nav, 'account');
      },
    });
    if (nav) nav.replaceWith(fresh);
    else document.getElementById('settings-nav').append(fresh);
    nav = fresh;
    if (lastNavUnread) setNavBadge(nav, 'chats', lastNavUnread);
  }
  buildPeerNav();

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s first push, arriving empty until
   *    a manual refresh. ———————————————————————————————————————————————————————— */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant),
  // transitionend + timeout fallback (the #29 morph pattern).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }

  function signalReady() { dropAppBoot(); bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
