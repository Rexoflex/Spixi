<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi</title>
<!-- #228 platform type flag (queued for launch at its next rebuild — this batch):
     desktop OS → compact desktop type/density (tokens.css :root[data-desktop]);
     set BEFORE first paint, constant across window resize. iPad (Macintosh UA +
     touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<style>
  /* The launch flow is a FIXED-DARK brand surface in BOTH themes (--gradient-
     launch, lock.html precedent #160): paint a deep dark IMMEDIATELY — launch
     previously had NO instant-bg at all, so a slow load flashed default-white.
     ★ N73 (#391): the value is the TOP of --gradient-launch (linear 200deg, first
     stop #1b163c), not the lock's #13171b — the status-bar strip and the boot
     cover now match the first pixels the shell actually paints. */
  html { background: #1b163c; }
  /* Splash boot moment (Batch B, #256 ⑭) — dark-pinned variant (lock grammar):
     pulsing brand logo in white over the deep surface, dropped at window load. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #1b163c; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  .app-boot__logo { width: 64px; height: 64px; color: #ffffff; animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/overlay.css"><!-- c-sheet: Terms/Privacy doc sheet + the settings pickers -->
<link rel="stylesheet" href="../styles/components/toast.css">
<link rel="stylesheet" href="../styles/components/lock-shell.css"><!-- passwordField (c-lock__field) grammar (launch-spec §5) -->
<link rel="stylesheet" href="../styles/components/settings-shell.css"><!-- language/theme sheets (one picker grammar) -->
<link rel="stylesheet" href="../styles/components/settings-screens.css"><!-- #147 theme preview tiles -->
<link rel="stylesheet" href="../styles/components/launch-shell.css">
<style>
  /* Production launch shell: fill the WebView. The redesigned launch-shell is
     ONE continuous fixed-dark brand surface (--gradient-launch); it already sets
     height:100% + the gradient, and the welcome view clears env(safe-area-inset-
     top) itself. The FORM views (create/restore/retry) have no top
     inset in the component (the demo added a 44px stand-in) — feed them the
     device safe-area here so the transparent topbar clears the OS statusbar while
     the gradient still bleeds behind it (#160b⑧ full-bleed precedent). */
  /* ★ N73 (#391): the launch flow is FIXED DARK in both themes, so the page
     ground must be too — var(--surface-screen) painted LIGHT behind a dark shell
     in light mode, which is the wrong status-bar strip Damir reported. This is
     the same value C# paints behind the WebView (SpixiContentPage.surfaceColorFor)
     and the same value the instant-bg above uses: one colour, three layers. */
  html, body { margin: 0; height: 100%; background: #1b163c; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #launch-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #launch-root > .c-launch { flex: 1; min-height: 0; }
  #launch-root .c-launch__view { padding-top: env(safe-area-inset-top); }

  /* W15 (#348): on a wide window the FORM views (create / restore / retry)
     stretched their content from edge to edge. Cap the CONTENT COLUMN only.
       · .c-launch keeps the full-bleed --gradient-launch — the brand surface is
         never capped.
       · The hero and tour art size themselves (min(46vw,176px) / min(58vw,232px)
         in launch-shell.css), so the illustrations are untouched.
       · The topbar is excluded, exactly as contact_new.html does it, so Back
         stays at the screen edge.
       · The welcome view needs nothing — its carousel is already max-width 360
         and its CTAs 320 (launch-shell.css).
     GATED ON WIDTH, not on the desktop UA sniff: the sniff is the suspected
     cause of W10, and a width test is the same signal C# already uses for its
     own pane breakpoint (HomePage.OnPageSizeChanged — `Width < 700`).
     ★ review NIT-15: cap the body's CHILDREN, not the body. .c-launch__body is the
     scrolling column (it carries u-scroll), so capping it would move the scrollbar ~640px
     in from the window edge on a wide window. The footer is not a scroller, so it
     caps directly. */
  @media (min-width: 700px) {
    #launch-root .c-launch__body > *,
    #launch-root .c-launch__footer {
      width: 100%;
      max-width: 640px;
      margin-inline: auto;
    }
  }
</style>
</head>
<body>
  <!-- Splash boot cover (Batch B) — logo injected right after icons.iife.js below;
       dropped in signalReady (window load). -->
  <div class="app-boot" id="app-boot"><div class="app-boot__logo" id="app-boot-logo" role="status" aria-label="Loading"></div></div>
  <div id="launch-root"></div>

<script src="../components/icons.iife.js"></script>
<!-- Splash boot logo — injected the moment the (small) icon registry is parsed,
     well before the ~1MB bundle; fail-soft if the registry is missing. -->
<script>(function(){try{var h=document.getElementById('app-boot-logo');if(h&&window.SpixiIcons&&window.SpixiIcons.icon)h.append(window.SpixiIcons.icon('logo',{size:64}));}catch(e){}})();</script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick (LaunchPage offers the same picker).
     ?lang= still overrides (demos/tests); in a plain-browser preview the marker stays
     un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.__SPIXI_LANG__ = new URLSearchParams(location.search).get('lang') || '*SL{language-code}';window.SL = window.SpixiStrings.get(window.__SPIXI_LANG__);</script>
<!-- ★ N75 (#391): ONE launch document, ONE WebView, every view. The BOOT view
     arrives as a generatePage carrier (the devMode grammar, #314) so the cold
     unlock (retry) paints its own view on the FIRST frame — a push would show a
     welcome frame first. C# registers it before every loadPage; an
     un-substituted marker (plain-browser preview) falls back to welcome, and
     ?view= still overrides for demos/tests. -->
<script>(function(){var c='*SL{LaunchBootView}';var q=new URLSearchParams(location.search).get('view');var ok=/^(welcome|create|restore|retry)$/;window.__LAUNCH_VIEW__=ok.test(q||'')?q:(ok.test(c)?c:'welcome');})();</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Launch / onboarding shell — the redesigned launch-shell wired to
   * the REAL C# MAUI bridge (native.js in the bundle).
   *
   * ★ N75 (#391): ONE PAGE, ONE WEBVIEW, EVERY VIEW. The launch flow used to be
   * five C# pages, each with its own WebView loading its own copy of THIS SAME
   * document (intro / intro_new / intro_restore / intro_retry / onboarding) —
   * five parses of one large file plus a native page push per step, which is the
   * flicker Damir reported. The shell always held every view internally, so the
   * fix was to stop navigating: LaunchPage now hosts welcome + create + restore +
   * retry and switches them in place; C# follows along through the verbs it
   * already received (create / restore / back) and can drive the view with the
   * setLaunchView push. ★ N76 removed the onboarding tail entirely.
   *
   * Verbs (bridge-audit-A §7–10 — FROZEN, no new outbound verb):
   *   introload · accept · language:<code> · create · restore · back ·
   *   create:<nick>:<password> · avatar · error · selectfile ·
   *   restore:<password> · proceed:<password>
   * Pushes: setVersion · showTerms · showOnboardingSection · loadAvatar ·
   *   setUploadedFileName · showPasswordError · removeLoadingOverlay ·
   *   setLaunchView.
   *
   * Contract source of truth: Spixi/Pages/Launch/LaunchPage.xaml.cs.
   * Spec: docs/launch-spec.md.
   *
   * SECURITY.md: passwords live ONLY in field values, transiently — the component
   * scrubs them on back / ctrl.done / window pagehide. Shells emit INTENT; C#
   * generates/decrypts the wallet. Nick/password transit as ixian: URL payloads
   * is the legacy C# reality (SECURITY.md known issue) — not widened here; the
   * component gates the create:<nick>:<password> parse hazards inline (§1).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createLaunchShell, setLaunchVersion, setLaunchAvatar, setLaunchFile, setLaunchView,
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;
  const strings = window.SL || {};

  /* —— which view does this document boot on? ——————————————————————————————
   * ★ N75: there is no longer one HTML file per view — this ONE document holds
   * welcome/create/restore/retry and switches between them in place. C# only
   * chooses the FIRST one (welcome on a fresh install, retry on a cold unlock). */
  const VIEWS = ['welcome', 'create', 'restore', 'retry'];
  const bootRaw = window.__LAUNCH_VIEW__ || 'welcome';
  const view = VIEWS.includes(bootRaw) ? bootRaw : 'welcome';

  /* —— bridge transport ————————————————————————————————————————————————————
   * Serialize outgoing ixian: commands. The MAUI WebView processes ONE URL
   * navigation at a time, so a rapid double `location.href` (accept + create on
   * the welcome page) would drop the first. A tiny queue delivers each on its own
   * macrotask — C# cancels every ixian: navigation (e.Cancel), leaving the WebView
   * on the same page, so the next command fires cleanly. Also hardens every other
   * emit path against an accidental back-to-back send. */
  const outbox = [];
  let draining = false;
  function drain() {
    if (!outbox.length) { draining = false; return; }
    window.location.href = outbox.shift();
    setTimeout(drain, 0);
  }
  function emit(command) {
    outbox.push(command);
    if (!draining) { draining = true; drain(); }
  }
  const bridge = createNativeBridge({ emit });   // send() → the serialized queue
  installExecuteUiCommand();                      // defines window.executeUiCommand for C#

  const host = document.body;
  const root = document.getElementById('launch-root');

  /* —— consent ————————————————————————————————————————————————————————————
   * LaunchPage.onLoad pushes showTerms only when terms are NOT yet accepted. We
   * record consent (ixian:accept) ONCE, at the first Create/Restore tap on the
   * welcome view. Premium round: "continuing = agreeing"
   * (the fine-print consent line + in-app Terms/Privacy sheets render on the
   * create/restore forms; the binding tap is the welcome CTA that navigates). */
  let termsRequired = false, acceptSent = false;
  function recordConsent() {
    if (!termsRequired || acceptSent) return;
    acceptSent = true;
    bridge.send('ixian:accept');
  }

  /* —— active locale ————————————————————————————————————————————————————————
   * A4 (Opus #46 loop): the shell never told launch-shell WHICH locale is active,
   * so the language pill always showed LAUNCH_LANGS[0] (en-us) no matter what the
   * account language was — and the hidden-locale fallback row could never engage.
   * Reuse the boot carrier (window.__SPIXI_LANG__, set beside window.SL above); an
   * un-substituted marker or ?lang=pseudo fails the shape test → en-us, as before. */
  const langRaw = String(window.__SPIXI_LANG__ || '');
  const language = /^[a-z]{2}-[a-z]{2}$/.test(langRaw) ? langRaw : 'en-us';

  /* —— wiring ————————————————————————————————————————————————————————————
   * ★ N75 (#391): ONE page hosts every view, so EVERY opt and EVERY push handler
   * is registered once, up front — there is no per-page branch left. The views
   * are mutually exclusive on screen, so their C#→JS pushes cannot collide:
   * setVersion is the same value for all of them, showTerms/loadAvatar/
   * setUploadedFileName each belong to exactly one view, and only ONE submit can
   * be in flight at a time (each form disables itself while it waits), which is
   * what lets the three removeLoadingOverlay paths share one release. */
  const baseName = (p) => String(p || '').replace(/\\/g, '/').split('/').pop();

  // the ONE in-flight submit control (create | restore | retry). launchCtrl is
  // one-shot, so a late release after showPasswordError is a no-op, not a bug.
  let activeCtrl = null;

  const opts = {
    view, host, strings, language,
    // language persists + RELOADS intro.html C#-side (LaunchPage onNavigating) —
    // fire-and-forget; the reload re-boots this shell on the welcome view.
    // ★ N72: there is no appearance hook any more — the pill is gone.
    onLanguage: (code) => bridge.send('ixian:language:' + code),
    /* ★ N75: the welcome CTAs now switch IN PLACE (launch-shell does the show()
       itself). These hooks stay as NOTIFICATIONS so C# can follow the view — it
       needs the current view for the hardware back button, and it is the only
       place that may record consent. No page is pushed any more. */
    onGoCreate: () => { recordConsent(); bridge.send('ixian:create'); },
    onGoRestore: () => { recordConsent(); bridge.send('ixian:restore'); },
    onPickAvatar: () => bridge.send('ixian:avatar'),   // native picker → loadAvatar
    // Loading until C# resolves (spec §2.2): on success C# generates the wallet
    // then navigates to Home + tears this page down (the morph never resolves —
    // correct); on FAILURE C# shows the native alert AND pushes
    // removeLoadingOverlay (#334 L1, was the wedge: no release signal → inputs +
    // button permanently dead).
    onCreateAccount: (nick, pass, ctrl) => { activeCtrl = ctrl; bridge.send('ixian:create:' + nick + ':' + pass); },
    onSelectFile: () => bridge.send('ixian:selectfile'),
    onRestore: (pass, ctrl) => { activeCtrl = ctrl; bridge.send('ixian:restore:' + pass); },
    onRetry: (pass, ctrl) => { activeCtrl = ctrl; bridge.send('ixian:proceed:' + pass); },
    /* back from a form view — the component already switched to welcome; this only
       tells C# so its hardware-back knows where it is.
       ★ review MAJOR-1: do NOT drop activeCtrl here. The form's Back control is live
       while a submit is in flight (only the fields and the CTA are disabled), and the
       submit runs on a C# background thread — so Back, then a wallet-generation
       failure, would arrive at a null control and the release would be LOST. The form
       would then be permanently dead behind the loading morph, which is exactly the
       #334 L1 wedge: before N75, Back POPPED the page and re-entry rebuilt the WebView,
       so it could not survive. The control is one-shot and re-enables the form it owns,
       so releasing a hidden view is correct, not a leak. */
    onBack: () => { bridge.send('ixian:back'); },
  };

  const handlers = {
    setVersion: (v) => setLaunchVersion(el, v),
    showTerms: () => { termsRequired = true; },      // arm the one-shot ixian:accept
    showOnboardingSection: () => {},                 // legacy no-op: welcome always shows CTAs
    // ★ N75: C# view router (hardware back, and the retry lockout falling back to
    // welcome). setLaunchView ignores an unknown or unchanged view.
    setLaunchView: (v) => setLaunchView(el, String(v || '')),
    // loadAvatar(path) — native picker result (create view).
    loadAvatar: (path) => setLaunchAvatar(el, path || null),
    // C# sends the full tmp filepath — display the basename (legacy parity,
    // intro_restore.html:135). Confirms a file was picked + enables submit.
    setUploadedFileName: (path) => setLaunchFile(el, baseName(path)),
    // restore: wrong password → inline error on the field (spec §2.3). One-shot
    // latch: C# fires showPasswordError THEN removeLoadingOverlay — the error wins.
    showPasswordError: () => { if (activeCtrl) activeCtrl.fail(strings.restoreFailed || 'That password didn\u2019t open the backup.'); },
    /* the shared release. SILENT fail('') everywhere: create and retry are both
       covered by a native alert that already spoke, and restore's own message
       already landed through showPasswordError. fail('') keeps the typed values
       and re-enables the form. */
    removeLoadingOverlay: () => { if (activeCtrl) activeCtrl.fail(''); },
  };

  // LaunchPage.onLoad → setVersion (+ showTerms). ONE ready verb for the whole
  // flow now: ixian:introload. The old per-page ixian:onload is gone with the
  // create page (#391 N75).
  const readyCmd = 'ixian:introload';

  const el = createLaunchShell(opts);
  root.append(el);
  bridge.exposeAll(handlers);

  /* —— page ready — fire the page's ready verb on window LOAD (#177 load-timing
   *    invariant): firing during parse races C#'s first push. ONE verb for the
   *    whole flow now — the document loads once. ——————————————————————————— */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant),
  // transitionend + timeout fallback (the #29 morph pattern).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }

  function signalReady() { dropAppBoot(); if (readyCmd) bridge.send(readyCmd); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
