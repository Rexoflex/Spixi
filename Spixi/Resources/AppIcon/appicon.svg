<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- ★ L17 — the ADAPTIVE ICON BACKGROUND: Damir's #175595, flat, edge to edge.
     It must be FULL-BLEED and it must have no detail: Android masks this layer to the
     launcher's shape (circle, squircle, rounded square) and also lets it PARALLAX behind
     the foreground on some launchers. A gradient banded at 48px and a mark here would be
     cropped by every mask, which is why the mark lives in appiconfg.svg instead.
     Spixi.csproj's MauiIcon Color carries the same value for the platforms that want a
     flat colour rather than this file. -->
<rect width="1024" height="1024" fill="#175595"/>
</svg>
