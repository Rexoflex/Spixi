<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- ★★ E1b — THE WINDOWS APP ICON. Damir, 2026-08-29: "on windows the icon is a bit rough,
     and too small logo. can we have separate windows app icon, so slightly bigger logo,
     color is great, and have rounded rectangle rather than sharp rectangle."

     ⚠⚠ THIS FILE EXISTS BECAUSE ONE ICON CANNOT SERVE BOTH PLATFORMS, AND THE REASON IS
     MEASURABLE, NOT AESTHETIC. In appiconfg.svg the mark occupies 326x398 of the 1024
     canvas — 31.8% of the width — with 349px of padding each side. That padding is
     CORRECT and deliberate: L17 split the icon into background + foreground precisely so
     Android could mask it to the launcher shape and zoom the foreground ~1.5x without
     cropping the mark. On a phone it therefore lands at roughly 48% and looks right.
     ★ WINDOWS NEITHER MASKS NOR ZOOMS. It draws the composed square as-is, so the same
     padding is dead space and the taskbar shows the mark at about TWO THIRDS the size
     Android shows it. Shrinking the padding in the shared file would fix Windows and
     break Android; hence a second file, behind a TFM condition in Spixi.csproj.

     THE TWO DELIBERATE DIFFERENCES FROM THE SHARED ICON, AND NOTHING ELSE:
     ① the mark is scaled 1.5x about the tile centre — chosen to MATCH WHAT ANDROID
        ALREADY EFFECTIVELY RENDERS (its own ~1.5x adaptive zoom), so the two platforms
        agree on how big the logo looks rather than on what the file contains. 398 -> 597,
        i.e. 58.3% of the tile height, 47.8% of its width.
     ② a rounded rectangle, r=229 (22.4% of 1024) — the Windows 11 app-icon convention.
        On Android the ROUNDING IS THE LAUNCHER'S JOB and baking it in would double it;
        on Windows nothing rounds it for you, so it has to be in the asset.
     ⚠ THE GROUND IS COPIED VERBATIM AND MUST STAY THAT WAY: flat #0076E1 under the same
     radial. That colour was settled by measurement in #689 — the icon was never too dark,
     it was UNDER-SATURATED (ground L* 40.2 / chroma 38.1 against Discord's 43.8 / 68.1),
     and the first fix, lightening it, made it worse. Do not re-tune it here. A change to
     the brand ground belongs in appicon.svg and should be mirrored into this file. -->
<defs>
  <radialGradient id="spixiWinIconBg" gradientUnits="userSpaceOnUse" cx="1024" cy="0" r="1448.1">
    <stop offset="0.1313" stop-color="#4B9CEF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#223A59" stop-opacity="0.2"/>
  </radialGradient>
  <clipPath id="spixiWinIconClip">
    <rect width="1024" height="1024" rx="229" ry="229"/>
  </clipPath>
</defs>
<g clip-path="url(#spixiWinIconClip)">
  <rect width="1024" height="1024" fill="#0076E1"/>
  <rect width="1024" height="1024" fill="url(#spixiWinIconBg)"/>
  <g transform="translate(512 512) scale(1.5) translate(-512 -512)">
