<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spixi</title>
<!-- #228 platform type flag (queued for launch at its next rebuild — this batch):
     desktop OS → compact desktop type/density (tokens.css :root[data-desktop]);
     set BEFORE first paint, constant across window resize. iPad (Macintosh UA +
     touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<style>
  /* The launch flow is a FIXED-DARK brand surface in BOTH themes (--gradient-
     launch, lock.html precedent #160): paint a deep dark IMMEDIATELY — launch
     previously had NO instant-bg at all, so a slow load flashed default-white. */
  html { background: #13171b; }
  /* Splash boot moment (Batch B, #256 ⑭) — dark-pinned variant (lock grammar):
     pulsing brand logo in white over the deep surface, dropped at window load. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #13171b; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  .app-boot__logo { width: 64px; height: 64px; color: #ffffff; animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/overlay.css"><!-- c-sheet: Terms/Privacy doc sheet + the settings pickers -->
<link rel="stylesheet" href="../styles/components/toast.css">
<link rel="stylesheet" href="../styles/components/lock-shell.css"><!-- passwordField (c-lock__field) grammar (launch-spec §5) -->
<link rel="stylesheet" href="../styles/components/settings-shell.css"><!-- language/theme sheets (one picker grammar) -->
<link rel="stylesheet" href="../styles/components/settings-screens.css"><!-- #147 theme preview tiles -->
<link rel="stylesheet" href="../styles/components/launch-shell.css">
<style>
  /* Production launch shell: fill the WebView. The redesigned launch-shell is
     ONE continuous fixed-dark brand surface (--gradient-launch); it already sets
     height:100% + the gradient, and the welcome view clears env(safe-area-inset-
     top) itself. The FORM views (create/restore/retry) + the tail have no top
     inset in the component (the demo added a 44px stand-in) — feed them the
     device safe-area here so the transparent topbar clears the OS statusbar while
     the gradient still bleeds behind it (#160b⑧ full-bleed precedent). */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #launch-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #launch-root > .c-launch { flex: 1; min-height: 0; }
  #launch-root .c-launch__view,
  #launch-root .c-launch__tail { padding-top: env(safe-area-inset-top); }
</style>
</head>
<body>
  <!-- Splash boot cover (Batch B) — logo injected right after icons.iife.js below;
       dropped in signalReady (window load). -->
  <div class="app-boot" id="app-boot"><div class="app-boot__logo" id="app-boot-logo" role="status" aria-label="Loading"></div></div>
  <div id="launch-root"></div>

<script src="../components/icons.iife.js"></script>
<!-- Splash boot logo — injected the moment the (small) icon registry is parsed,
     well before the ~1MB bundle; fail-soft if the registry is missing. -->
<script>(function(){try{var h=document.getElementById('app-boot-logo');if(h&&window.SpixiIcons&&window.SpixiIcons.icon)h.append(window.SpixiIcons.icon('logo',{size:64}));}catch(e){}})();</script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick (LaunchPage offers the same picker).
     ?lang= still overrides (demos/tests); in a plain-browser preview the marker stays
     un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.__SPIXI_LANG__ = new URLSearchParams(location.search).get('lang') || '*SL{language-code}';window.SL = window.SpixiStrings.get(window.__SPIXI_LANG__);</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Launch / onboarding shell — the redesigned launch-shell wired to
   * the REAL C# MAUI bridge (native.js in the bundle).
   *
   * WHY THIS SHELL IS DIFFERENT (five pages, not one): unlike the single-page
   * shells (settings, chat) or the tabbed home shell, the legacy launch flow is
   * FIVE separate C# pages, each with its own WebView + HTML file + onNavigating
   * handler (ARCHITECTURE §5 row 1, bridge-audit-A §7–10 + audit-B OnboardPage):
   *
   *   intro.html          LaunchPage         welcome  · introload/create/restore/
   *                                                     accept/language/appearance
   *   intro_new.html      LaunchCreatePage   create   · onload/back/create:<n>:<p>/
   *                                                     avatar/restore  → loadAvatar
   *   intro_restore.html  LaunchRestorePage  restore  · back/selectfile/restore:<p>
   *                                                     → setUploadedFileName/
   *                                                       showPasswordError/removeLoadingOverlay
   *   intro_retry.html    LaunchRetryPage    retry    · back/proceed:<p>
   *                                                     → removeLoadingOverlay
   *   onboarding.html     OnboardPage        tail     · back/joinbot/finish
   *
   * The redesigned launch-shell holds ALL FIVE views internally (SPA), but on the
   * real bridge the C# page navigation IS the routing: each legacy filename boots
   * this SAME shell at its own view. build-shells.mjs writes this file to all five
   * names and injects `window.__LAUNCH_VIEW__` per output (browser test: ?view=).
   *
   * ZERO C# change, bridge FROZEN. Contract source of truth: the five
   * Spixi/Pages/Launch/*.xaml.cs + OnboardPage.xaml.cs. Spec: docs/launch-spec.md.
   *
   * SECURITY.md: passwords live ONLY in field values, transiently — the component
   * scrubs them on back / ctrl.done / window pagehide. Shells emit INTENT; C#
   * generates/decrypts the wallet. Nick/password transit as ixian: URL payloads
   * is the legacy C# reality (SECURITY.md known issue) — not widened here; the
   * component gates the create:<nick>:<password> parse hazards inline (§1).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createLaunchShell, setLaunchVersion, setLaunchAvatar, setLaunchFile,
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;
  const strings = window.SL || {};

  /* —— which legacy page is hosting this shell? ————————————————————————————— */
  const VIEWS = ['welcome', 'create', 'restore', 'retry', 'tail'];
  const bootRaw = window.__LAUNCH_VIEW__
    || new URLSearchParams(location.search).get('view')
    || 'welcome';
  const view = VIEWS.includes(bootRaw) ? bootRaw : 'welcome';

  /* —— bridge transport ————————————————————————————————————————————————————
   * Serialize outgoing ixian: commands. The MAUI WebView processes ONE URL
   * navigation at a time, so a rapid double `location.href` (accept + create on
   * the welcome page) would drop the first. A tiny queue delivers each on its own
   * macrotask — C# cancels every ixian: navigation (e.Cancel), leaving the WebView
   * on the same page, so the next command fires cleanly. Also hardens every other
   * emit path against an accidental back-to-back send. */
  const outbox = [];
  let draining = false;
  function drain() {
    if (!outbox.length) { draining = false; return; }
    window.location.href = outbox.shift();
    setTimeout(drain, 0);
  }
  function emit(command) {
    outbox.push(command);
    if (!draining) { draining = true; drain(); }
  }
  const bridge = createNativeBridge({ emit });   // send() → the serialized queue
  installExecuteUiCommand();                      // defines window.executeUiCommand for C#

  const host = document.body;
  const root = document.getElementById('launch-root');

  /* —— consent ————————————————————————————————————————————————————————————
   * LaunchPage.onLoad pushes showTerms only when terms are NOT yet accepted. We
   * record consent (ixian:accept) ONCE, at the first Create/Restore tap on the
   * WELCOME page — the only page whose C# handler processes ixian:accept (the
   * create/restore/retry pages don't). Premium round: "continuing = agreeing"
   * (the fine-print consent line + in-app Terms/Privacy sheets render on the
   * create/restore forms; the binding tap is the welcome CTA that navigates). */
  let termsRequired = false, acceptSent = false;
  function recordConsent() {
    if (!termsRequired || acceptSent) return;
    acceptSent = true;
    bridge.send('ixian:accept');
  }

  /* —— active locale ————————————————————————————————————————————————————————
   * A4 (Opus #46 loop): the shell never told launch-shell WHICH locale is active,
   * so the language pill always showed LAUNCH_LANGS[0] (en-us) no matter what the
   * account language was — and the hidden-locale fallback row could never engage.
   * Reuse the boot carrier (window.__SPIXI_LANG__, set beside window.SL above); an
   * un-substituted marker or ?lang=pseudo fails the shape test → en-us, as before. */
  const langRaw = String(window.__SPIXI_LANG__ || '');
  const language = /^[a-z]{2}-[a-z]{2}$/.test(langRaw) ? langRaw : 'en-us';

  /* —— per-view wiring ———————————————————————————————————————————————————— */
  const baseOpts = { view, host, strings, language };
  let opts = baseOpts;
  let handlers = {};
  let readyCmd = null;             // the ready/onload verb this page's C# expects
  let restoreCtrl = null, retryCtrl = null;

  const baseName = (p) => String(p || '').replace(/\\/g, '/').split('/').pop();

  if (view === 'welcome') {
    // intro.html · LaunchPage
    opts = Object.assign({}, baseOpts, {
      // language / appearance persist + RELOAD intro.html C#-side (LaunchPage
      // onNavigating) — fire-and-forget; the reload re-boots this welcome shell.
      onLanguage: (code) => bridge.send('ixian:language:' + code),
      onAppearance: (idx) => bridge.send('ixian:appearance:' + idx),
      // welcome CTAs NAVIGATE to the real create/restore pages (the hooks added
      // to launch-shell.js) instead of switching in place — a bare LaunchPage
      // can't process create:<nick>:<password>. Consent rides the first tap.
      onGoCreate: () => { recordConsent(); bridge.send('ixian:create'); },
      onGoRestore: () => { recordConsent(); bridge.send('ixian:restore'); },
    });
    handlers = {
      setVersion: (v) => setLaunchVersion(el, v),
      showTerms: () => { termsRequired = true; },      // arm the one-shot ixian:accept
      showOnboardingSection: () => {},                 // legacy no-op: welcome always shows CTAs
    };
    readyCmd = 'ixian:introload';                       // LaunchPage's onLoad trigger (NOT ixian:onload)
  } else if (view === 'create') {
    // intro_new.html · LaunchCreatePage
    opts = Object.assign({}, baseOpts, {
      onPickAvatar: () => bridge.send('ixian:avatar'),  // native picker → loadAvatar(path)
      // INDEFINITE loading (spec §2.2): on success C# generates the wallet then
      // navigates to Home + tears this page down (the morph never resolves);
      // on failure C# shows a NATIVE alert with NO release signal → the spinner
      // stays (the wedge, flag §6② / BE ask L1). We deliberately don't touch ctrl.
      onCreateAccount: (nick, pass /* , ctrl */) => bridge.send('ixian:create:' + nick + ':' + pass),
      onBack: () => bridge.send('ixian:back'),          // C# pops LaunchCreatePage → welcome
    });
    handlers = {
      setVersion: (v) => setLaunchVersion(el, v),
      // loadAvatar(path) — native picker result. The absolute file path doesn't
      // resolve inside the self-contained shell (repo-wide avatar flag) → the
      // preview falls back to the deterministic gradient. Wired for honesty.
      loadAvatar: (path) => setLaunchAvatar(el, path || null),
    };
    readyCmd = 'ixian:onload';                          // LaunchCreatePage.onLoad → setVersion
  } else if (view === 'restore') {
    // intro_restore.html · LaunchRestorePage (NO onload handler → no ready verb)
    opts = Object.assign({}, baseOpts, {
      onSelectFile: () => bridge.send('ixian:selectfile'),   // native file picker → setUploadedFileName
      onRestore: (pass, ctrl) => { restoreCtrl = ctrl; bridge.send('ixian:restore:' + pass); },
      onBack: () => bridge.send('ixian:back'),
    });
    handlers = {
      // C# sends the full tmp filepath — display the basename (legacy parity,
      // intro_restore.html:135). Confirms a file was picked + enables submit.
      setUploadedFileName: (path) => setLaunchFile(el, baseName(path)),
      // wrong password → inline error on the field (spec §2.3). One-shot latch:
      // C# fires showPasswordError THEN removeLoadingOverlay — the error wins.
      showPasswordError: () => { if (restoreCtrl) restoreCtrl.fail(strings.restoreFailed || 'That password didn’t open the backup.'); },
      removeLoadingOverlay: () => { if (restoreCtrl) restoreCtrl.fail(''); },   // latched no-op after the error; bare release otherwise
    };
  } else if (view === 'retry') {
    // intro_retry.html · LaunchRetryPage (NO onload handler → no ready verb)
    opts = Object.assign({}, baseOpts, {
      onRetry: (pass, ctrl) => { retryCtrl = ctrl; bridge.send('ixian:proceed:' + pass); },
      onBack: () => bridge.send('ixian:back'),
    });
    handlers = {
      // wrong password = NATIVE alert + removeLoadingOverlay → SILENT restore
      // (fail('') keeps the value, no inline dup — the alert already spoke;
      // the unlock-screen grammar, spec §2.4).
      removeLoadingOverlay: () => { if (retryCtrl) retryCtrl.fail(''); },
    };
  } else {
    // onboarding.html · OnboardPage (tail — modal presented by HomePage after
    // create; NO onload handler, NO back per spec §2.5).
    // On the Join path the component calls onJoinBot() THEN onFinish() (its SPA
    // model: "add the bot" + "complete onboarding" are two steps). But the native
    // OnboardPage's `ixian:joinbot` ALREADY finishes onboarding + pops the modal
    // (OnboardPage.xaml.cs:36 → finishOnboarding), so a trailing `ixian:finish`
    // would double-fire onboardDone + pop the page beneath. Guard: joinbot and
    // finish are MUTUALLY EXCLUSIVE terminal verbs — emit finish only when the
    // user did NOT join. (Skip only calls onFinish → ixian:finish.)
    let tailJoined = false;
    opts = Object.assign({}, baseOpts, {
      // "Back up now" has NO OnboardPage verb (it only handles joinbot/finish/
      // back) → the component just advances to the join step; the real backup is
      // deferred to the settings Backup row (BE ask L3). Omitting onBackupNow
      // lets the component advance without a dead ixian: navigation.
      onJoinBot: () => { tailJoined = true; bridge.send('ixian:joinbot'); },  // OnboardPage → joinBot + finish + pop
      onFinish: () => { if (!tailJoined) bridge.send('ixian:finish'); },      // skip path only (joinbot already finished)
    });
    handlers = {};   // no C#→JS pushes for the tail
  }

  const el = createLaunchShell(opts);
  root.append(el);
  bridge.exposeAll(handlers);

  /* —— page ready — fire the page's ready verb on window LOAD (#177 load-timing
   *    invariant): firing during parse races C#'s first push. Restore/retry/tail
   *    have no C# onload handler, so they send nothing (the boot cover still
   *    drops for them — signalReady runs on every view). ————————————————————— */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant),
  // transitionend + timeout fallback (the #29 morph pattern).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }

  function signalReady() { dropAppBoot(); if (readyCmd) bridge.send(readyCmd); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
