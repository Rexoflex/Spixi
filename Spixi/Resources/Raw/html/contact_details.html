/* ★★ #598: SPACE THAT IS CHOSEN, NOT SPACE THAT IS LEFT OVER.
   #589 placed the slack here with `margin-block-start: auto`. The seam was the right
   one; the mechanism was not. An auto margin is a REMAINDER — its size is whatever the
   layout has spare, so it changed with the screen, the locale and the content, and on a
   tall phone it grew to ~110px. At identical pixel counts, chosen space reads as design
   and left-over space reads as a mistake.
   So the QR block now carries its own block padding: one step above the sheet's
   `--spacing-16` rhythm, constant on every device, in every locale, at any length.
   ⚠ Never `margin-block-start: auto` here again. */
:root:not([data-desktop]) .c-addr-sheet__qrwrap {
  padding-block: var(--spacing-24);
}
/* the explicit way out (#575). Mobile only: a desktop dialog is dismissed with Esc
   or a click outside, and both stay available here too. It sits over the sheet's own
   padding in the title row, so it never displaces content. */
.c-addr-sheet__dismiss {
  position: absolute;
  top: var(--spacing-8);
  inset-inline-end: var(--spacing-8);
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: var(--radius-full);
  background: transparent;
  color: var(--icon-neutral-02);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) { .c-addr-sheet__dismiss:hover { background: var(--surface-interactive-hover); color: var(--icon-neutral-01); } }
/* ★ #589 (Damir F5 2026-08-26): DESKTOP GETS THE DISMISS ICON TOO. Esc and a
   click outside were the only ways out of the dialog, and neither is visible. The
   button was hidden on desktop because #575 built it for the near-full mobile
   sheet, where the scrim had shrunk to a strip — but "there is another way out"
   was never a reason to hide the only VISIBLE one. */
/* the title must not run under the button — both presentations now */
.c-sheet--addr .c-sheet__title { padding-inline-end: 44px; }
/* ★ #589: one rhythm. The sheet's own blocks are a --spacing-16 stack, and the
   title sat 12 above them, so the gap that separates the heading from everything
   read tighter than the gaps INSIDE it. Token, and the largest of the two. */
.c-sheet--addr .c-sheet__title { margin-bottom: var(--spacing-16); }
:root[data-desktop] .c-sheet--addr { width: min(440px, 92%); }
/* ★★ #589 — WHY THE PERSISTENT THUMB BELOW "DID NOT REACH THIS STATE".
   ⚠ MY FIRST ANSWER WAS WRONG AND THE AUDIT DISPROVED IT. I claimed `max-height: 76%`
   is a percentage of a HOST that could be shorter than the viewport. It cannot be:
   every production caller passes `document.body`, `.c-sheet` is absolutely positioned,
   and neither `html` nor `body` is positioned or transformed — so the containing block
   IS the initial containing block, and `76%` and `76vh` measure the same box. The
   Account pane is its own WebView, so its viewport is the pane; the two cannot disagree
   there either.

   THE REAL DEFECT IS THE CONSTANT. `92px` was the desktop chrome the scroll region
   cannot use: 24 + 24 dialog padding plus one line of title and its margin. It assumed
   a ONE-LINE title. The title's usable width is now 440 − 48 − 44 (this batch adds the
   dismiss clearance below), so a long locale wraps it to two lines, real chrome passes
   92, the OUTER dialog needs to scroll — and `overflow-y: hidden` further down clips it
   silently, with no bar anywhere. My own `margin-bottom: --spacing-16` on the title
   would have made the stale constant worse.

   Rebuilt without the arithmetic: the dialog is a flex column and the scroll region is
   the flex item that gives up height first, so it binds against whatever the chrome
   actually measures, in any locale. */
:root[data-desktop] .c-sheet--addr {
  display: flex;
  flex-direction: column;
}
:root[data-desktop] .c-sheet--addr > .c-sheet__content {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
:root[data-desktop] .c-addr-sheet { flex: 1 1 auto; min-height: 0; max-height: none; }
/* ★ F5-5 ② (#556, Damir F5 2026-08-24): the desktop dialog showed NO scrollbar on
   overflow. Two causes: the OUTER dialog (.c-sheet, overflow-y:auto in overlay.css)
   could scroll instead of this element, and the u-scroll thumb is hover-only.
   The addr dialog now clips (the inner .c-addr-sheet is the one scroller), and its
   thumb is PERSISTENT while it overflows — slim + themed, the contact-list look. */
:root[data-desktop] .c-sheet--addr { overflow-y: hidden; }
/* ★ #589: the thumb PAINT leaves the pointer gate — the width does NOT, and the audit
   caught me shipping it outside.
   ⚠ Authoring any `::-webkit-scrollbar` rule opts a Chromium scroller OUT of overlay
   scrollbars and into classic, LAYOUT-CONSUMING ones. `.u-scroll` declares its width
   inside `@media (hover: hover) and (pointer: fine)` together with
   `scrollbar-gutter: stable`, which is what stops that width from reflowing content.
   Exporting the width alone gave a touch-screen Windows laptop — `data-desktop`,
   coarse pointer — a 6px bar with no reserved gutter, appearing and disappearing as
   overflow toggled and shoving the QR and the chip sideways.
   Only the two PAINT declarations are ungated, which is all the override needed. */
:root[data-desktop] .c-addr-sheet.u-scroll {
  scrollbar-color: var(--outline-neutral-02) transparent;
}
:root[data-desktop] .c-addr-sheet.u-scroll::-webkit-scrollbar-thumb {
  background: var(--outline-neutral-02);
}
/* review MINOR-6: the sheet's own polite region — the same recipe the hub uses
   (settings-shell.css .c-settings__live), so one grammar, not a second one. */
.c-addr-sheet__live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  margin: 0;
}
/* ★★ #591: THE GEOMETRY DOCBLOCK MOVED HERE, and it moved because its subject did.
   It was written in chat-info.css when that file drew the last inline QR card; the
   contact-details card is retired and this sheet is now the ONE card in the app that
   renders a code. A measured-geometry comment beside a card that no longer exists is
   the drift PIN-G was built to catch. Verbatim, so the numbers stay the measured ones. */

/* ★ N86 ① (Damir 2026-08-25): "the QR should have a smaller white padding around it,
   this way on dark mode it's quite overpowering."

   Measured before touching it, because HALF of that white is a standard, not a choice.
   createQrSvg bakes `quiet = 4` — the ISO/IEC 18004 minimum quiet zone. Below four
   modules scanners start failing, and this is a WALLET ADDRESS, where a misread is the
   worst class of defect in the app. At 185px that quiet zone measures 16.44px to 20.00px
   per side (the table below), and it is untouchable.

   The 12px card padding on top of it was doing a job the quiet zone already does. Gone:
   the white square drops from ≈209px to 185px, a 22% cut in white area, with no effect
   on scanning at all.

   ⚠ THE RADIUS SURVIVES THE PADDING, and the corner arithmetic is why. With 12px of
   padding the 16px curve lived entirely in the padding and could not reach the code.
   With none, it eats the quiet zone's own corner.

   ★ #46 loop: the numbers below are MEASURED, not estimated. An earlier version of this
   comment carried three wrong ones. The method: run the SHIPPED encoder
   (createQrSvg → setQrValue, ecc 'M', quiet = 4) over the real payload
   (`address + ':ixi'`) and read the viewBox back. Re-measure the same way if the payload
   or the encoder changes. Over payloads of 34 to 76 characters the viewBox takes exactly
   three values. The BOX is the code plus the 4-module quiet zone on each side, so the box
   is always 8 cells wider than the code:
     34–42 chars → 29-module code, 37-cell box, 5.00px per cell, 20.00px quiet zone
     43–62 chars → 33-module code, 41-cell box, 4.51px per cell, 18.05px quiet zone
     63–76 chars → 37-module code, 45-cell box, 4.11px per cell, 16.44px quiet zone
   A real Ixian address lands in the middle row.

   ⚠ A 16px radius removes at most R(√2−1) = 6.63px of DIAGONAL depth at a square corner.
   It does NOT remove 16 − 16/√2 = 4.69px. That second value is the sagitta of the arc. It
   is a different measurement, and it understates the loss by 41%.

   THE SAFETY RESULT, which is unchanged. The quiet zone is 16.44px in the worst measured
   case. The radius is 16px. The curve therefore stays inside the quiet zone at all four
   corners and reaches no module. Along every edge, where ISO/IEC 18004 measures, the clip
   removes nothing. The curve first touches the code corner when the quiet zone falls
   below 16 − 16/√2 = 4.69px, which needs a box of about 157 cells. This payload cannot
   make one.
   ⚠ Raise this radius above 16px and re-do both comparisons. */
.c-addr-sheet__qrwrap { display: flex; justify-content: center; }
.c-addr-sheet__qrcard {
  /* scale with the viewport on BOTH axes: a short window shrinks the code before
     it pushes the chip below the fold. --surface-qr stays near-white in both themes.
     ★ F5-5 ① (#556, Damir F5 2026-08-24): card padding DROPPED to the Account
     proportions (.c-settings__qr has none — N86). The SVG's own ISO quiet zone is
     the white margin; the extra 20px ring doubled it. Radius joins the Account
     family (radius-16); the hairline outline goes with the padding. */
  /* ★ #575 (Damir): "QR still too big — shrink it." 280 → 216. The code stays
     comfortably scannable at arm's length (a base58 address is a low-density QR and
     the SVG keeps its own ISO quiet zone, N86), and the smaller card is what lets
     the address chip and the explainer share the sheet without scrolling. */
  width: min(216px, 40dvh, 62vw, 100%);
  padding: 0;
  border-radius: var(--radius-16);
  box-shadow: var(--elevation-1);
}
@supports not (height: 1dvh) { .c-addr-sheet__qrcard { width: min(216px, 40vh, 62vw, 100%); } }
.c-addr-sheet__caption {

}
/* the address chip: the #99 member-sheet pattern, one step more deliberate —
   a hairline, a larger radius and letter-spacing so the base58 reads as a token */
.c-addr-sheet__addr {
  padding-block: var(--spacing-12);
  padding-inline: var(--spacing-16) var(--spacing-8);
  border-radius: var(--radius-16);
  border: var(--outline-width-1) solid var(--outline-neutral-01);
}
.c-addr-sheet__addr .c-wallet-receive__addrvalue {

.c-addr-sheet__addr .c-wallet-receive__copy { width: 40px; height: 40px; }
.c-addr-sheet__addr .c-wallet-receive__copy[data-state='ok'] { color: var(--icon-success); }
.c-addr-sheet__addr .c-wallet-receive__copy[data-state='fail'] { color: var(--icon-error); }
/* ★ #575: Share is an icon button on the chip, beside Copy — the full-width
   outline row it replaced "reads as a too-short bar". Same 40px square as Copy, so
   the chip carries a pair of equal controls. */
.c-addr-sheet__sharebtn { width: 40px; height: 40px; }
/* the explainer block — ★ F5-5 ③ (#556): ONE glyph level. The filled disc read as
   an icon inside an icon (Damir screenshot); a bare tinted info-circle leads the
   two quiet lines. The safety line keeps its inline shield glyph. */
/* ★ #575 (Damir): a TWO-COLUMN GRID, glyph gutter + copy column. Every line of
   copy shares ONE left edge — that is his "align the safety text with the info
   text's left edge, not under the icon". The old flex layout put the shield inside
   the text column, which indented the safety line away from the paragraph above it.
   `align-items: start` keeps each glyph on the first line of its own paragraph. */
.c-addr-sheet__explain {
  display: grid;
  /* ⚠ #589: a FIXED gutter, not `auto`. With `auto` the track is sized by that block's
     own glyph — 20px for the info-circle, 16px for the shield — so the two blocks'
     copy started 32px and 28px from their card edge. A 4px step between two otherwise
     identical cards is exactly the one-left-edge alignment #575 was written to buy.
     A fixed track is also what makes `justify-self: center` on the glyph mean anything;
     against an `auto` track it was a no-op. */
  grid-template-columns: 20px minmax(0, 1fr);
  align-items: start;
  column-gap: var(--spacing-12);
  padding: var(--spacing-12);
  border-radius: var(--radius-16);
  background: var(--surface-neutral-02);
}
/* ★★ #599 (Damir, 2026-08-27 — D5): THE SAFETY BLOCK GETS COLOUR.
   Both explain blocks and the address chip painted `--surface-neutral-02`, so three
   cards in a row read as one broken card, and the safety line — the only one that is a
   WARNING about someone else's money — read as part of the chip above it.
   `--explain--safe` was already the paint-free semantic hook (wallet-receive.js), so the
   colour lands there and cannot leak into the info block above the QR, or into the peer
   sheet, which renders no safety block at all.
   Measured on the tokens: copy 12.6:1 light / 15.5:1 dark on this surface; the glyph
   uses `--text-success` rather than `--icon-success` because the latter is 4.28:1 in
   light — over the 3:1 graphic bar, but under the text bar it sits beside. The hairline
   is what separates the block from the sheet in DARK, where every tinted surface is
   ~1.14:1 in lightness and reads as hue alone. */
.c-addr-sheet__explain--safe {
  background: var(--surface-success-inverse);
  /* ⚠ an inset SHADOW, not a border. A 1px border would shrink the content box and
     shift this block's copy 1px against the info block above it — and one shared
     left edge for every line of copy is exactly what #575/#589 bought (row A1.3). */
  box-shadow: inset 0 0 0 var(--outline-width-1) var(--outline-success-inverse);
}
.c-addr-sheet__explainicon { margin-top: 1px; color: var(--icon-info); display: inline-flex; justify-self: center; }
.c-addr-sheet__explainicon--safe { color: var(--text-success); margin-top: 2px; }
.c-addr-sheet__info {
  margin: 0;
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}
.c-addr-sheet__info--safe { color: var(--text-neutral-01); }

/* ★ W-b (2026-08-24): desktop content column cap — see wallet-send.css */
:root[data-desktop] .c-wallet-receive { max-width: 560px; margin-inline: auto; width: 100%; box-sizing: border-box; }

.c-delete-chat { display: flex; flex-direction: column; gap: var(--spacing-16); }
.c-delete-chat__peer {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
}
.c-delete-chat__name {
  min-width: 0;
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-lg);
  line-height: var(--line-height-label-lg);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
  overflow: hidden;
  text-overflow: ellipsis;

.c-delete-chat__body {

  font-family: var(--font-secondary);

/* ★ A7 (Damir, Batch A 2026-08-24): the option rows are the GROUP-CREATION checkbox
   grammar — a pressable row with the trailing 24px select circle (the contacts-shell
   pickerRow recipe, --icon-neutral-03 ring, filled --surface-action-default on
   aria-checked) — not the off-brand native <input type=checkbox>. */
.c-delete-chat__opts { display: flex; flex-direction: column; }
.c-delete-chat__opt {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  width: 100%;
  min-height: var(--size-target-min);   /* ≥44px touch target */
  padding: var(--spacing-4) 0;
  border: 0;
  background: transparent;
  text-align: start;
  color: var(--text-neutral-01);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;

.c-delete-chat__opt:disabled { cursor: default; }
/* loop r1: the fixed-on "Delete chat" row is a STATEMENT of what happens, not an inert
   control — its label keeps full ink (dimming it read 2.57:1); the static circle says fixed */
.c-delete-chat__opt-label { flex: 1; min-width: 0; }
.c-delete-chat__check {

              border-color var(--duration-200) var(--easing-standard),

@media (prefers-reduced-motion: reduce) { .c-delete-chat__check { transition: none; } }

.c-remove-contact__row:focus-visible {

/* ★ A5 (Damir's shape, Batch A): the REMOVE-CONTACT bottom sheet — peer header, the
   honest body, the shared-groups strip (multi-select "leave first" rows) and the two
   actions. Rendered inside c-sheet (overlay.css owns the sheet chrome). */
.c-remove-contact { display: flex; flex-direction: column; gap: var(--spacing-16); }
.c-remove-contact__groups {

.c-remove-contact__row {

.c-remove-contact__rowname {

/* REMOVE-CONTACT SPEC 2 (Damir, 2026-08-28): "Keep contact" and "Leave 1 & remove"
   read as different KINDS of thing rather than as two choices. They are the HOUSE
   two-button footer now, byte-identical to .c-modal__actions: equal width, wrap, and
   NO min-width:0 — with flex-basis 0 a used min of 0 makes every item's hypothetical
   size 0, so the wrap could never fire and the long label spilled past its button
   instead of dropping to its own full-width row. The 2:1 override that made the CTA
   double-width is gone with it; that WAS the size difference. */
.c-remove-contact__actions { display: flex; flex-wrap: wrap; gap: var(--spacing-8); justify-content: flex-end; }
.c-remove-contact__actions .c-button { flex: 1 1 0; }

/* —— #506② / iOS-62: the long-pressed message is PROMOTED above the scrim ————
   Damir on device: "you cannot see what you are acting on." #492 shipped the cheap
   half — a ring on a bubble left UNDER the scrim — and the device killed it:
   measured 2.01:1 against the bubble beneath --surface-scrim (rgba(17,18,19,.6))
   versus 5.98:1 above it. No colour survives a 60% wash, so this is not a tint that
   needs tuning; the node has to come out from under the scrim. That is the §5b
   anchored presentation, and it is what iMessage does.

   ⚠ The ROW lifts, not the bubble. Reactions overlap the bubble corner by design
   (#65) and the avatar and sender label belong to the same message — lifting the
   bubble alone would leave its own reactions stranded behind the scrim, which is a
   worse version of the bug being fixed.

   ⚠ PRECONDITION — A RULE FOR EVERY STYLESHEET, NOT AN OBSERVATION ABOUT THIS ONE.
   No ancestor between the lifted row and the host may create a stacking context.
   The row lifts to z-42 to clear the z-40 scrim. A stacking context on an ancestor
   caps the lift inside that ancestor, and the row drops back under the scrim.
   The failure is SILENT: nothing logs, and the ring still paints.
   The ancestors today are `.c-chat-canvas` (position:relative, z-index auto,
   overflow:hidden) and the scroller from `.c-chat-canvas > *` (position:relative
   only). Overflow alone creates no stacking context. Both still CLIP the lifted row
   to their own box, which is correct: the message stays inside the log.
   ⚠ Do NOT add any of these to `.c-chat-canvas`, to the scroller (`.messages`,
   `.u-scroll`), or to any ancestor of them. Each one creates a stacking context on
   its own: `z-index` other than auto, `transform`, `translate`, `rotate`, `scale`,
   `perspective`, `filter`, `-webkit-filter`, `backdrop-filter`, `clip-path`,
   `mask-image` (or the `mask` shorthand), `opacity` below 1, `mix-blend-mode`,
   `isolation: isolate`, `contain: paint|layout|strict|content`,
   `content-visibility: auto|hidden`, `view-transition-name`, `position: sticky` and
   `position: fixed`.
   `translate`, `rotate` and `scale` are the easy ones to miss. They are the
   individual transform properties. They read like plain geometry, and they cost the
   same stacking context a `transform` shorthand does.
   ⚠ This rule has been broken once. `chat-flow.css` had
   `.c-chat-canvas[data-flow] { z-index: 0; }` for the Live flow canvas, which
   killed the lift for that one pattern style (#46 loop MAJOR-2). The flow canvas
   now paints by TREE ORDER at z-index auto and needs no context. Add a new one and
   you repeat the defect.
   ⚠ THE ONE THAT LOOKS SAFE AND IS NOT. `message-bubble.css:29` puts
   `opacity: var(--chat-pattern-opacity)` on `.c-chat-canvas::before`, and
   `chat-pattern.css:56` puts `mask-image` on the same pseudo-element. A pseudo-
   element carries its own box, so both of those are correct where they stand: the
   HOST keeps z-index auto and the lift still clears the scrim.
   Move either declaration up onto `.c-chat-canvas` — an editor "tidying the layer",
   or making the whole canvas dim — and the host becomes a stacking context. The
   long-press lift then dies silently on EVERY pattern style, not one. If the tile
   needs to fade, fade the pseudo-element, never the host.

   ⚠ pointer-events: none is NOT decoration. With the row above the scrim, a tap on
   the highlighted message would hit the MESSAGE instead of the scrim, and light
   dismiss — every other overlay's way out — would stop working on the one element
   the user is looking at. Dead to hit-testing, the tap falls through to the scrim
   exactly as it did before the lift. The lifted message is a picture, like
   iMessage's snapshot; the menu is what is interactive. */
[data-menu-lift] {
  position: relative;
  z-index: var(--z-42);
  pointer-events: none;
}

/* ★★ #589 (Damir F5 2026-08-26) — THE LIFTED ROW IS NOT PROMINENT IN DARK MODE.
   And the audit found the reason is older and larger than the report.

   THE GROUND HAS ALWAYS BEEN DEAD CODE. #572 put `background: --surface-screen` on
   `.c-swipe`, but `.c-swipe__content` (chats-swipe.css) is a positioned child that
   FILLS the wrapper and already paints that same `--surface-screen`, opaquely. A
   positioned child paints above its parent's background, so the wrapper's ground was
   never visible — and painting the list's own colour is exactly the "same colour as
   the list" Damir is looking at. Every ordinary mobile row is wrapped (home.html
   passes pin + mute), so this is the normal case, not an edge.

   ⚠ MY FIRST FIX LANDED AT THE SAME DEAD ALTITUDE — a `z-index: -1` wash on
   `.c-swipe`, still under that opaque child. It would have changed nothing visible,
   which is worse than the bug it answered, because the pin would have gone green.

   FIXED BY MOVING THE PAINT TO THE ELEMENT THAT SHOWS, and by making it ONE OPAQUE
   TOKEN rather than a translucent wash. `--surface-neutral-02` is the neutral raised
   fill, one perceptual level off `--surface-screen` in BOTH themes
   (neutral-50 / neutral-800). Damir asked for "the neutral press fill"; the literal
   press token is an ALPHA (`--surface-press-row-hover`) and it cannot be used here —
   above a 0.7 scrim a translucent row reads as the dim itself, which is the whole
   reason the ground exists. This is the same neutral, one level, opaque.

   ⚠ It also removes a defect the wash version would have introduced: the row's own
   press layer (`base.css .c-chatlist-item::before`, 0.05) is still filling when the
   long press opens the menu, so a second 0.10 wash composited to ~0.15 for the first
   several hundred milliseconds — a lift whose colour depends on how fast the menu
   opened. One opaque paint has no such coupling.

   ⚠ NOT a tonal fill, and that part of the old note stands: tonal reads as SELECTED,
   the reading Batch E (c) removed on desktop for the same reason.

   ★★ AND THE GROUND ALONE IS NOT ENOUGH IN DARK — the round-2 review measured it and
   it is the point Damir actually raised. A scrim is BLACK: over the light list it
   drops the surroundings to ~#575859 and one neutral step then reads at 6.2:1, but
   over the dark list it can barely darken what is already near-black, so the same
   step measures 1.10:1. For calibration, `--surface-pinned` composites to 1.15 in
   dark and N56 shipped that as "a very light wash". A third one-token attempt would
   land in the same place.
   So the lifted row also takes the RING — the same 5.98:1 recipe `[data-menu-target]`
   already uses on a lifted message (#492), which is scrim-independent because it does
   not rely on the ground underneath. One recipe, two surfaces. */

/* ★ #572 ③ (the E-3 dial) — THE CHAT ROW variant of the same lift.
   `data-menu-lift="row"` is set by chats-row-menu.js on the `.c-swipe` wrapper
   (its comment carries the stacking check for that chain). The rule above already
   gives it the layer; a chat row needs TWO things a message row must not have:

   ⚠ AN OPAQUE GROUND. `.c-chatlist-item` is `background: transparent`
   (chatlist-item.css:11). Above a 0.7 scrim a transparent row reads as the dim
   itself — the exact "I cannot see what I am acting on" this fixes. A message row
   stays transparent on purpose: only the BUBBLE should show, never a plate around
   it. That is why the selector matches the value and not the bare attribute.

   ⚠ ITS OWN RADIUS. The row is full-bleed inside the list; standing alone above the
   scrim it must read as one card, the same radius the desktop press wash uses. */
/* The WRAPPER keeps a ground of its own, and the review is why: `openChatRowMenu`
   closes an open swipe drawer BEFORE it lifts, and `.c-swipe__content` springs back
   over a 200ms transform. During that motion the region between the two action panels
   is the WRAPPER — so dropping its paint showed a translucent band of scrim through a
   row that is supposed to be lifted above it. It costs one declaration to keep. */
:root:not([data-desktop]) .c-swipe[data-menu-lift="row"] {
  background-color: var(--surface-lift-row);
  border-radius: var(--radius-12);
}
:root:not([data-desktop]) .c-swipe[data-menu-lift="row"] .c-swipe__content {
  background: var(--surface-lift-row);
  border-radius: var(--radius-12);
}
/* ⚠ review MINOR-7: the lift falls back to the ROW itself when the swipe wrapper is
   parked — a handshaking row is never wrapped (chats-shell.js), and neither is a row
   with pin and mute both off. On that element the ground would out-specify the row's
   own state fills, which is what the note above forbids: `--surface-pinned` (0,2,0)
   and the `[aria-current]` tonal would both lose to a (0,3,0) shorthand. Guarded, so
   a stateful row keeps its own paint and simply lifts without a new ground. */
/* the UNWRAPPED fallback (a handshaking row; pin and mute both off) — the row is
   the lift target itself and is transparent, so it takes the same paint directly. */
:root:not([data-desktop]) .c-chatlist-item[data-menu-lift="row"]:not([data-pinned]):not([aria-current]) {
  background-color: var(--surface-lift-row);
  border-radius: var(--radius-12);
}
/* ⚠ THERE IS NO PRESS WASH HERE, and an earlier draft of this batch said there was.
   The lift is an opaque ground plus a ring (above). The note below is what that
   replaced, kept because half of it still holds. What was wrong: the scrim alone does
   NOT isolate the row when the row's ground is the same colour as the list beneath it,
   and in dark it barely isolates it at all. What is still true, and is why the ground
   is the NEUTRAL step and not a tonal one: a TONAL fill reads as SELECTED, the reading
   Batch E (c) removed on desktop for the same reason. Desktop keeps
   `[data-dt-ctx-source]` and its own value; it has no scrim.
   ⚠ The ground goes on the WRAPPER, never on `.c-chatlist-item`. The row keeps its
   own state fills — `--surface-pinned`, the press sweep, `[aria-current]` — and
   those are alpha layers that need something opaque behind them. Painting the item
   instead would either lose the state or lose the ground. */

/* ★★ #605 (Damir, 2026-08-27 — D2): THE RING ON THE CHAT ROW IS REMOVED.
   His words: "it's not looking good, and it gets cut off on the sides. It's not
   appropriate for a chat app and this action." The clipping identifies this ring and
   not the message one: `.c-swipe` is full-bleed in the list and the scroller's
   computed `overflow-x` cut the 5px spread at both screen edges. A message bubble
   sits inside `.c-bubble-row`'s 16px inline padding and cannot be clipped, so the
   message ring is UNTOUCHED here — flagged for Damir rather than assumed.

   ⚠ THE RING WAS THE ONLY THING WORKING IN DARK, so it does not leave alone.
   What replaces it is elevation and a genuinely lighter ground, and — the part that
   actually matters — the row now really does escape the scrim on every platform
   (chats-row-menu.js, the ghost). Measured on the tokens, in dark:
     row against the UNDIMMED list          ΔL* 4.0   (the 1.10:1 the last round measured)
     row against the DIMMED field, escaped  ΔL* 9.0
     …and with the ground one step lighter  ΔL* 10.7
   WCAG ratios are near 1 for all three because both colours are near-black and the
   +0.05 flare term dominates — which is why the ratio was the wrong instrument for
   this surface, and why the fix is the LAYER plus the step, not a colour. */
:root:not([data-desktop]) .c-swipe[data-menu-lift="row"],
:root:not([data-desktop]) .c-chatlist-item[data-menu-lift="row"] {
  box-shadow: var(--elevation-3);
}

/* The ring, unchanged from #492 — it was never the wrong ring, only the wrong
   layer. Above the scrim it reads at its measured 5.98:1.
   ⚠ NO border-radius here. `inherit` would take the PARENT's radius and square off
   every bubble the moment it is pressed; the box-shadow already follows whatever
   radius the bubble itself carries. box-shadow rather than `border` because a
   border would change the box and reflow the bubble under the user's finger. */
[data-menu-target] {
  box-shadow: 0 0 0 2px var(--brand-400), 0 0 0 5px rgba(118, 157, 255, 0.28); /* sanctioned: tokenise-candidate (#884 ③ `--surface-selected-wash` = primary-400 at alpha, Damir deferred) */
  transition: box-shadow 120ms ease-out;
}
@media (prefers-reduced-motion: reduce) {
  [data-menu-target] { transition: none; }
}

/* ★★ #606 (rows A2.1 / A2.2 / 12 / 15 — the FOURTH round, and the first with an iOS
   device): THE LIFT IS NOW A GHOST, and it does not depend on winning a z-index race.
   The three earlier rounds all raised `z-index` on the row and all were measured on
   Android. On iOS the row does not lift at all, and on one row it sits BEHIND the dim.
   The scrim is a child of `document.body`; the row is a descendant of a composited,
   async-scrolled overflow container (`#chat-scroll`, and WKWebView's own scroll view
   is disabled, so every `.u-scroll` is a real iOS scroller). Whether WebKit will hoist
   a descendant out of that layer to clear a sibling of its scroller is exactly the
   thing three rounds assumed and none proved.
   So stop asking. `liftPressedRow` now also paints a positioned COPY of the row as a
   SIBLING of the scrim — the same technique a native context menu uses, where the
   pressed view is snapshotted. A sibling cannot lose a stacking contest to its
   sibling, on any engine.
   ★ It is purely ADDITIVE: the `data-menu-lift` hoist stays exactly as it is, the
   ghost is opaque and covers the original pixel for pixel, and if the row cannot be
   measured no ghost is made and the behaviour is today's. Nothing regresses on
   Android; iOS gains the lift it never had.
   ⚠ Geometry is set INLINE by the JS, deliberately: a `position: fixed` written here
   would be a second declared value on a `[data-menu-lift]` rule, and the cascade pin
   that keeps this whole family honest asserts one value per property across every
   rule that matches. */
[data-menu-ghost] {
  margin: 0;
  /* the ghost is a picture of a row, never a target — the scrim below it takes the
     light-dismiss tap, exactly as it does for the hoisted original. */
  pointer-events: none;
}

/* c-chip — mirrors Figma chip/{small,large} + code-first selected/disabled
   (docs/chip-search-spec.md, DECISIONS #50). Semantic tokens only. */

.c-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-4);
  border: var(--outline-width-1) solid var(--outline-neutral-04);
  border-radius: var(--radius-16);
  background: var(--surface-neutral-01);
  color: var(--text-neutral-01);
  font-family: var(--font-secondary);
  font-weight: var(--chip-weight);   /* ★ Session I (#735 P.S. "filter chip text weight UP") */
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  position: relative;
  /* ★★ #841 / AND-44 (Damir's screenshot, group create): a member chip labelled
     "Androoo 🗻🔥 Androoo Androoo Androoootururururuurru" ran off the screen edge and
     took its remove × with it — the × was clipped away, so the member could not be
     removed. A nick is network-supplied (#140 family), so the guard belongs here rather
     than on any assumption about length.
     THREE declarations, and all three are load-bearing: a flex item's automatic minimum
     size is its MIN-CONTENT, and min-width beats max-width — so without `min-width: 0`
     the cap below is inert against exactly the unbreakable label that causes this. The
     cap is on the CHIP so the label ellipsizes while the × keeps its `flex: none` seat.
     ⚠ THE DEFAULT IS DELIBERATE. A wrapping row must cap; a horizontal SCROLLER must
     not, and the two scrollers opt out at their own definitions (.c-chats-header__filters,
     .c-apps-discover__cats) rather than every wrapping row opting in — #838's lesson: a
     new wrapping container then gets the safe behaviour for free, and a new scroller that
     forgets to opt out shows a clipped label, not an unreachable control. */
  min-width: 0;
  max-width: 100%;
  /* 100ms intentional: micro-interaction, same rationale as chatlist row hover */
  /* transform = the #343 press release; declared here so base.css never has to
     out-specify (and therefore replace) this shorthand — see #346. */
  transition: background-color var(--duration-100) var(--easing-standard),
              color var(--duration-100) var(--easing-standard),
              border-color var(--duration-100) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

   + 2 border), target must be 44 (--size-target-min); pseudo widens the hit
   box vertically without visual change */
.c-chip::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: var(--size-target-min);
  transform: translateY(-50%);

<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Contact-details / chat-info shell — the redesigned 1:1 contact
   * surface wired to the REAL C# MAUI bridge (native.js in the bundle). Reached
   * by tapping a 1:1 chat header (SingleChatPage emits ixian:details → C# pushes
   * ContactDetails, which loads this file). ONE component (createChatInfo) also
   * powers the in-chat GROUP info takeover (src/shells/chat.html).
   *
   * ARCHITECTURE §5 / bridge-audit-A §2 (ContactDetails.xaml.cs).
   * ⚠ NO LONGER "zero C# change": ★★ L1 (#640) routes the money composes here. The
   * verbs are not new to the app — they are the SAME three SingleChatPage answers —
   * but ContactDetails.xaml.cs now answers them too, and declares setCaps.
   *
   * Contract (verified ContactDetails.xaml.cs):
   *   C#→JS: setPaneMode('1'|'2') [#247 desktop pane, pre-present]
   *          · setContext('chat'|'contact') [#248 entry-dependent title/actions]
   *          · showCallButton() [★ #591: reveal the Call action — codecs + Approved]
   *          · setGroupInfo(count, blind, admin, notifications, owner) +
   *            clearMembers/addMember(addr, nick, avatar, role) [#248 group surface]
   *          · setAddress(addr) · setNickname(nick) [every sec] · setAvatar(path)
   *          ["" = none] · showIndicator("true"|"false") · clearRecentActivity()
   *          · addPaymentActivity(txid, type, time, amount, confirmed)  (5-arg;
   *          type = LOCALIZED "Sent"/"Received"; confirmed "true"|"error")
   *          · [★★ L1 #640] setCaps('composeSend,composeRequest') ·
   *            setSendQuote(addr, amount, fee, balance, max, error) ·
   *            signSendResult('ok'|'cancel'|'fail', message).
   *   JS→C#: ixian:onload · ixian:back · ixian:remove (remove contact) ·
   *          ixian:removehistory · ixian:chat ·
   *          [★★ L1 #640] ixian:signSend:<addr>:<amount> · ixian:feeQuery:<addr>:<amount>
   *          · ixian:sendrequest:<addr>:<amount> — the money composes, IN-SHELL. They
   *          REPLACE ixian:request / ixian:send, which pushed the legacy
   *          WalletReceivePage / WalletSendPage; both pages are deleted.
   *          ixian:txdetails:<txid> · ixian:userdefinednick:<nick> ·
   *          [#248 group] ixian:leave · ixian:en/disableNotifications ·
   *          ixian:kick:<addr> · ixian:ban:<addr> (all forwarded by ContactDetails,
   *          mirroring the SingleChatPage handlers).
   *
   * CONTEXT CHOICE (Damir 2026-07-08 — revises #142): context 'contact', kind
   *   'contact'. The contact-details page now shows the "Contact details" title +
   *   a leading "Message" button (ixian:chat → opens/pops the conversation) AND
   *   keeps BOTH destructive actions — the component was un-gated so context
   *   'contact' renders "Delete chat history" (ixian:removehistory) alongside
   *   "Remove contact" (ixian:remove). ixian:chat pushes SingleChatPage when
   *   reached from the contacts list, or pops back when opened from a chat header
   *   (customChatBtn) — same "open conversation" outcome either way.
   *
   * UPDATE CHURN: C#'s updateScreen() re-pushes setNickname + setAvatar +
   *   showIndicator EVERY SECOND, and clears + re-adds the WHOLE tx list every
   *   second. A naive rebuild-per-push would wipe an in-progress nickname edit,
   *   the open payments accordion, and scroll position every tick. So pushes are
   *   coalesced (settle timer) and the panel is rebuilt ONLY when the meaningful
   *   state (name / address / tx set) actually CHANGES — and never while a
   *   nickname edit is open. The avatar rebuilds once when it resolves; PRESENCE
   *   deliberately does NOT rebuild — it flips at the poll cadence, so it is
   *   applied with a targeted toggle instead (A4/#302, setChatInfoPresence) and is
   *   only re-seeded into stateSig so a rebuild from another cause keeps it.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createChatInfo, setChatInfoPresence, formatIxiAmount,
    createPendingContact,   // ★ C17 (Session AD): the minimal profile for a contact whose request is still out
    createNativeBridge, installExecuteUiCommand,
    attachEdgeBack,   // ★ L3 (#706): the iOS back signal + the one-level chain
    attachPressFeedback,
    openRemoveContactSheet, setRemoveSheetGroups, setRemoveSheetResult,   // ★★ spec §4: the SAME sheet the chats row opens
    isPseudoAddressNick, dismissTopOverlay,          // D-19b (#370) blind pseudo-key display guard · N50 back-dismiss wiring
    isAddressShaped,                                 // ★ #591: an address-shaped "nickname" must not become the sheet's title
    showToast,                                       // N55: optimistic request-sent feedback,
    openAddressSheet,                                // ★ #591: the ONE address surface, peer variant
    applyPushedTheme,
    /* ★★ L1 (#640) — the money compose, ported from chat.html. This page emitted
     * `ixian:send` / `ixian:request`, which pushed the LEGACY WalletSendPage /
     * WalletReceivePage. Damir: "Nothing legacy was supposed to exist in this app
     * anymore." Same three symbols the chat shell destructures, same aliasing:
     * `setSendQuote` is renamed because the BRIDGE HANDLER below shares the name. */
    createTopbar,                                    // the takeover's own view topbar (Back)
    createWalletSend,                                // Pay  → the lockedRecipient compose (W5 #523)
    openRequestSheet,                                // Request → the amount sheet (#139/#528)
    setSendQuote: applySendQuote,                    // W6 — the component-side quote applier
  } = window.Spixi;
  const strings = window.SL || {};

  /* ★★ security sweep C-3 — FORGET A PEER, from the page that removed them.
   * C# pushes removeContactResult to the page that asked for the removal and to no
   * other (ContactDetails.xaml.cs and HomePage.xaml.cs each push to `this`), so a
   * removal started HERE never reaches home.html's own sweep. This is that sweep, with
   * one difference: this document holds no pin state, so it prunes the address out of
   * the stored spixi.pins array directly. home.html re-seeds its in-memory set from the
   * `storage` event that write raises, so a stale set cannot write the address back.
   * ⚠ Prefix-driven, exactly like the twin in home.html: every `spixi.*` key whose name
   * ENDS with `.<address>` goes, so a key family added later is covered by construction.
   * The length guard is load-bearing — an empty address would make the suffix "." and
   * match nearly every key in the store. Keep the two bodies in step.
   * `scope`, the same vocabulary home.html uses:
   *   'contact' — the contact is gone (removed, or a room we left). Everything goes,
   *               the pin with it. This is also the default.
   *   'history' — the CONVERSATION is gone but the contact STAYS, so the two
   *               contact-state markers survive and the pin is left alone. A user who
   *               deletes their messages must not see a hidden request re-appear, and a
   *               handshake stage is about the contact, not about the messages. */
  const PEER_KEYS_KEPT_ON_HISTORY = ['spixi.hidereq.', 'spixi.hsstage.'];
  function forgetPeerStorage(addr, scope) {
    const a = String(addr || '');
    if (a.length < 8) return;                     // fail closed on a short or empty address
    const suffix = '.' + a;
    try {
      const doomed = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || k.indexOf('spixi.') !== 0) continue;
        if (k.length <= suffix.length || k.slice(-suffix.length) !== suffix) continue;
        if (scope === 'history' && PEER_KEYS_KEPT_ON_HISTORY.some((pfx) => k.indexOf(pfx) === 0)) continue;
        doomed.push(k);
      }
      // remove AFTER the walk — removing during it re-indexes the store and skips keys
      for (const k of doomed) localStorage.removeItem(k);
      if (scope === 'history') return;            // the contact stays, and so does its pin
      const pins = JSON.parse(localStorage.getItem('spixi.pins') || '[]');
      if (Array.isArray(pins) && pins.indexOf(a) !== -1) {
        localStorage.setItem('spixi.pins', JSON.stringify(pins.filter((p) => p !== a)));
      }
    } catch (e) { /* storage may be unavailable */ }
  }

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;

    else if (a === '2') document.documentElement.dataset.theme = 'dark';

  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'

     later by a re-render are covered without re-attaching. A new shell needs

  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[contact-details]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;

  const root = document.getElementById('contact-root');

  const state = {
    name: '',            // friend.nickname (display name; incorporates any user-defined nick)
    address: '',
    online: false,       // showIndicator — NOT rendered by the component yet (gap), no rebuild
    avatarPath: null,    // setAvatar — rendered in the c-chat-info hero; onerror → gradient fallback
    txs: [],             // committed tx rows (txlist-item opts)
    txsBuf: null,        // accumulator between clearRecentActivity and the settle
    callable: false,     // ★ #591: revealed by showCallButton — C# gates on codecs + FriendState.Approved, exactly as the chat header does. Default FALSE so a contact who cannot be reached never shows the action.
    sharedGroups: null,  // ★ A4: [{ name, address }] once setSharedGroups answers; null = not yet; undefined = no answer (strip hidden)
    membersLanded: false,   // ★ A8: the first roster commit landed
    // #248: entry-dependent context — 'chat' (header/row-menu → "Chat info"/"Group
    // info", no Message action) vs 'contact' (directory → "Contact details").
    context: 'contact',
    // ★ C17 (Session AD): the relation C# pushes (contactRelationFor): contact · pending ·
    // pending-in · self · none · '' (not yet / a room). 'pending' = OUR request is out.
    relation: '',
    undoCtrl: null,      // the pending profile's Cancel ctrl, resolved by undoRequestResult
    // #248 GROUP surface: ContactDetails now carries group info too (setGroupInfo +
    // clearMembers/addMember roster — same contract family as SingleChatPage CI1).
    isGroup: false,
    group: { count: 0, blind: false, admin: false, notifications: true, owner: '' },
    /* ★ NOTIF-2 (Damir's 2026-08-21 block): the per-1:1 mute. Pushed by ContactDetails

       carries its own value in setGroupInfo, and that one is SYNCED to the other side
       while this one is local to the device. Defaults ON so the row cannot paint as
       muted before the push lands. */
    notifications: true,
    members: [],         // committed roster [{ name, address, avatar, owner }]
    membersBuf: null,    // accumulator between clearMembers and the settle
  };

  /** Resolve a C# avatar arg to an <img> src or null (same rule as the other
   *  shells). Threaded into the c-chat-info hero; a path that can't load degrades
   *  cleanly via the avatar component's onerror → deterministic gradient. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }

  /* Best-effort direction from the LOCALIZED tx type ("Sent"/"Received"). C#
   * sends a localized string, not an enum (a fragile signal — flagged as a BE
   * ask). Compare against the shell's own localized words, then a multilingual
   * "received" stem, else default to outgoing. The row LABEL always shows the
   * verbatim C# string, so a wrong arrow never mislabels the row. */
  /** ★ CI2: the wallet tab's status mapping (home.html walletStatus), one line each. */
  function activityStatus(confirmed) {
    const c = String(confirmed == null ? '' : confirmed);
    if (c === 'true' || c === 'True') return 'confirmed';
    if (c === 'unknown') return 'unknown';
    if (c === 'error') return 'failed';

  function txDirection(typeText) {
    const t = String(typeText || '').trim().toLowerCase();
    if (!t) return 'out';
    const recv = (strings.received || 'Received').toLowerCase();   // fallback = the dict value (A4 sweep: one key, one English)
    const sent = (strings.sent || 'Sent').toLowerCase();
    if (t === recv) return 'in';
    if (t === sent) return 'out';
    if (/receiv|empfang|recib|reçu|ricev|получ|recebid|受信|接收/.test(t)) return 'in';
    return 'out';
  }
