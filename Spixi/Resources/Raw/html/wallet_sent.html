<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). Same recipe as every redesigned shell. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Transaction</title>
<style>
  /* Paint the screen surface IMMEDIATELY (keyed off the head-top data-theme). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-action-default); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */
.c-topbar .c-button[data-type="text"] {
  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;

  /* the top 8px was the drag-handle's seat — a dialog title needs real air */

  transform: translate(-50%, calc(-50% + var(--spacing-16)));

  border: 1px solid var(--outline-neutral-03);

:root[data-desktop] [data-dt-ctx-source] { background: var(--surface-interactive-selected); border-radius: var(--radius-12); }

:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

<body>
  <!-- C#-LOCALIZED string carriers (#252 mechanism): generatePage substitutes the
       star-SL markers with the EXACT "unknown counterparty" strings WalletSentPage
       pushes as the username (xaml.cs:164/:201), so the shell can locale-proof
       detect a no-contact tx and show the direction glyph instead of personalizing
       a gradient avatar from "Unknown Recipient". Browser preview leaves them raw
       → the reader ignores them (en-us literals below back them up).
       ⚠ #248: markers must stay same-line-closed. -->
  <div id="sl-carriers" hidden aria-hidden="true">
    <span id="sl-unknown-recipient">*SL{wallet-unknown-recipient}</span>
    <span id="sl-unknown-sender">*SL{wallet-unknown-sender}</span>
  </div>

  <div id="tx-topbar"></div>
  <div class="u-scroll" id="tx-scroll"><div class="boot"><div class="boot__spinner" role="status" aria-label="Loading"></div></div></div>

<script src="spixi.icons.js"></script>
<script src="spixi.strings.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. ?lang= still overrides (demos/
     tests); in a plain-browser preview the marker stays un-substituted →
     SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="spixi.bundle.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Transaction-details shell (B3, #256) — the redesigned tx detail
   * wired to the REAL C# MAUI bridge (native.js in the bundle). Loaded by
   * WalletSentPage. ZERO C# change, frozen bridge. Spec: docs/wallet-shell-spec.md
   * §detail + fable-build-brief-missing-bits.md §3 B3.
   *
   * Contract (Pages/Wallet/WalletSentPage.xaml.cs — verified):
   *   C#→JS: clearEntries() — starts every checkTransaction pass; ⚠ ALSO pushed
   *            alone on a re-poll whose status hasn't changed (:121 precedes the
   *            :129-132 early-return) → it resets the STAGING buffer only, never the
   *            committed model and never the rendered card (legacy parity: the legacy
   *            clearEntries body is empty). See the staging docblock below — this is
   *            the #288 F5 bug.
   *          setReceivedMode() — received tx, precedes addEntry.
   *          addEntry(address, username, avatar, amount, fiat, time, type,
   *            confirmed) — ONE counterparty entry (C# breaks after the first;
   *            multi-recipient is a C#-side TODO). amount/fiat pre-formatted
   *            UN-grouped; time = pre-formatted human string (verbatim, never
   *            parsed); type 'send'|'receive'; confirmed 'true'|'false'|
   *            'unknown'|'error'.
   *          setData(amount, fee, time, txid, confirmed) — closes the burst →
   *            the shell renders HERE (one paint per pass). fee = IxiNumber
   *            string (full precision — NOT #77-truncated: fees are sub-0.01).
   *          hideBackButton() — pane-hosted (wide: HomePage rightContent); the
   *            title bar drops its back affordance.
   *          setHideBalance(hide) — #285: the persisted #263 global hide flag
   *            ("True"/"False"); masks money+who, per-view reveal eye un-masks.
   *   JS→C#: ixian:onload (ready; C# then runs checkTransaction) ·
   *          ixian:dismiss (narrow: pops the page) ·
   *          ixian:viewexplorer (TX-SCOPED explorer URL — ?p=transaction&id=…).
   *   LIVE STATUS: updateScreen() re-polls until Final → a fresh burst lands on
   *   every status change; the card re-renders in place (badge/status flips).
   *
   * ★ VIEW-ONLY (SECURITY.md): no compose, no signing, no money math beyond
   *   display grouping. The money path stays C#'s; wallet-send is a later batch.
   * X1 note: WalletSentPage is NOT in the #217 imageToDataUri wrap set (it was
   *   "legacy — do at repoint"; the repoint is THIS shell) → the avatar arrives
   *   as a raw local path: resolves on WinUI (#190), degrades to the gradient
   *   elsewhere via createAvatar onerror. Wrap ask logged in be-cutover (X1).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, openTxSheet, closeSheet,
    createNativeBridge, installExecuteUiCommand,
    truncateAddressMiddle,               // #276: address-shaped counterparty names render truncated
    createButton,                        // #285: the per-view reveal button
    formatTxTimestamp,                   // iOS-55 (#325): epoch → localized display (docLocale)
    groupAmountDisplay,                  // ★ I-6 (#360): locale-aware amount display (money.js),
    applyPushedTheme,
  } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme fallback (standard block): only re-derive if the head-top script
  // somehow didn't run.
  (function () {
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  const bridge = createNativeBridge();
  installExecuteUiCommand();

  const scroll = document.getElementById('tx-scroll');
  const topbarHost = document.getElementById('tx-topbar');

  /* —— title bar: back = ixian:dismiss (narrow); hideBackButton (pane) rebuilds
   *    it without the back affordance — the pane has no pop to offer. ————————— */
  function buildTopbar(withBack) {
    topbarHost.replaceChildren(createTopbar({
      variant: 'view',
      title: strings.txDetails || 'Transaction details',
      backLabel: strings.back || 'Back',
      onBack: withBack ? () => bridge.send('ixian:dismiss') : null,
    }));
  }
  buildTopbar(true);

  /* —— helpers ——————————————————————————————————————————————————————————————— */
  // Display grouping only (legacy wallet_sent.html:175 amountWithCommas) — the
  // detail is the authoritative record, so decimals stay VERBATIM (no 2dp clamp).
  // ★ I-6 (#360): separators now follow the APP LANGUAGE (money.js
  // groupAmountDisplay — group + decimal mark travel together), not hard commas.
  const amountWithCommas = (n) => groupAmountDisplay(n);
  // 'true'→confirmed · 'false'→pending · 'unknown'→unknown · anything else→failed
  // (mirrors the legacy enum + home.html walletStatus).
  function statusFrom(confirmed) {
    const c = String(confirmed || '').toLowerCase();
    return c === 'true' ? 'confirmed' : c === 'false' ? 'pending' : c === 'unknown' ? 'unknown' : 'failed';
  }
  // Counterparty avatar: C# pushes a raw path — normalize Windows separators
  // (#206 canon); the `img/…` WebView-relative sentinel (spixiavatar.png = "no
  // avatar stored") degrades to the deterministic gradient like every other
  // redesigned surface (#206 ⑦).
  function resolveAvatar(path) {
    const p = String(path || '').replace(/\\/g, '/');
    if (!p || p.indexOf('img/') === 0) return null;
    return p;
  }
  // Unknown-counterparty detection (#252 equality carriers): C# sends the
  // LOCALIZED "Unknown Recipient/Sender" as the username when there is no
  // friend record — match it so we don't personalize a gradient from it.
  function carrierText(id) {
    const el = document.getElementById(id);
    const t = el ? el.textContent.trim() : '';
    return (!t || t.indexOf('*SL' + '{') !== -1) ? '' : t;   // raw marker (preview) → unusable
  }
  const UNKNOWN_NAMES = [
    carrierText('sl-unknown-recipient'), carrierText('sl-unknown-sender'),
    'Unknown Recipient', 'Unknown Sender',   // en-us literals back up the raw-marker preview
  ].filter(Boolean);

  /* —— buffered model: one render per C# burst (at setData) ————————————————— */
  const model = { entries: [], received: false, data: null };
  /* #288 F5 (Damir: "hidden balance → open detail → Show amounts doesn't show amounts").
   * checkTransaction pushes `clearEntries` as its FIRST act and then early-returns when
   * the activity status is unchanged (WalletSentPage:121 / :129-133), and updateScreen
   * re-polls at 1 Hz for as long as !isConfirmedDisplayed — which is only ever set for an
   * Activity.Final tx (:137). So on ANY pending/unknown transaction the buffer is empty
   * one second after open, while the painted card still shows the last good burst.
   * That was safe while setData was render()'s ONLY caller. #285's per-view reveal added
   * a SECOND caller, so revealing rebuilt the card from {} → blank amount/name/fiat: the
   * chrome intact with no money in it. (`received` reset too, but that sign flip is NOT
   * observable — an empty entry renders no amount at all, so no sign is emitted. Audit
   * correction; recognise a recurrence by the BLANK card, not by a wrong sign.) NOT a
   * layout bug — a CONFIRMED tx stops polling and reveals fine, which is why it looked
   * narrow-only. The buffer can also be empty AT open, not just one second later: onLoad's
   * own checkTransaction takes the early return whenever the 1 Hz tick already ran a pass,
   * which it can — pageLoaded is the readyState poll, not ixian:onload. The burst now STAGES here and is COMMITTED at setData, so render() is
   * idempotent for every caller and the documented "buffer reset only, never clears the
   * rendered card" contract finally holds for re-renders too.
   * Push order is safe: clearEntries (:121) → setReceivedMode (:208) → addEntry
   * (:187/:225) → setData (:236). */
  const staging = { entries: [], received: false };
  let rendered = false;

  /* —— #285 (#263/#276 hide leg): the detail follows the GLOBAL hide flag.
   *    C# (WalletSentPage.onLoad) pushes the persisted flag before the burst.
   *    The old "detail stays unmasked = explicit reveal" dial was designed for
   *    the mobile sheet→Details flow; on desktop a row tap opens THIS page
   *    directly, leaking money+who next to a masked list. Reveal is explicit
   *    again via the per-view eye (a hide re-push that CHANGES the flag drops the
   *    reveal; an unchanged-value re-push preserves it — HomePage's balance-toggle
   *    broadcast depends on exactly that, #288).
   *    Masking parity with home.html: money + who; status/date/txid stay
   *    (pattern-of-life dial). ————————————————————————————————————————————— */
  let walletHidden = false;
  // #288 review: the mask was fail-OPEN — the shell rendered money before it knew the
  // flag, so a lost/late setHideBalance push (older exe, stranded queue, or a 1 Hz
  // checkTransaction tick landing between pageLoaded and ixian:onload) painted the card
  // fully unmasked with the preference ON. Mask until the flag has actually arrived.
  let hideKnown = false;
  let revealed = false;
  /* #288 F5 audit R10: ONE source of truth — the two call sites (buildTx and the eye)
   * had the predicate inline and duplicated; two edits from disagreeing, and a
   * disagreement means either a masked card with no way to reveal, or an unmasked card
   * that still offers one. */
  function isMasked() { return (walletHidden || !hideKnown) && !revealed; }
  /* #288 F5 audit R1: the eye must NOT be offered during the fail-closed unknown
   * window. It used to render there, and the first setHideBalance push — which is
   * always treated as actionable, even when its value matches the masked default —
   * unconditionally clears `revealed`, silently undoing a tap the user had just made.
   * The window is sub-millisecond (readyState complete → load), but the fix is free:
   * no flag, no eye. The card stays masked either way, so nothing leaks. */
  function canReveal() { return hideKnown && walletHidden && !revealed; }
  const WALLET_MASK = '••••••';

  function buildTx() {
    const e = model.entries[0] || {};
    const d = model.data || {};
    const status = d.status || e.status || 'unknown';
    const dirIn = model.received || e.direction === 'in';
    const sign = status === 'failed' ? '' : (dirIn ? '+' : '-');
    const unknown = !e.name || UNKNOWN_NAMES.indexOf(e.name) !== -1;
    // #276 (#211 canon sweep): C# sends the RAW ADDRESS as `username` when the
    // counterparty isn't a contact — the "Sent to {name}" title rendered full
    // base58 (Damir F5). Address-shaped names render MIDDLE-TRUNCATED; the full
    // address stays on the copyable address row below (the sanctioned field).
    // Same token shape as home.html's looksLikeAddress (base58, 20–128, ≥1 digit).
    const nameIsAddr = !unknown && /^[1-9A-HJ-NP-Za-km-z]{20,128}$/.test(e.name) && /\d/.test(e.name);
    // #285: mask = global hide minus the per-view reveal. Money + who mask
    // (amount/fiat/fee/name/address/avatar); status/date/txid stay visible —
    // home.html applyWalletVisibility parity ("pattern-of-life is visible
    // anyway; the MONEY and the WHO are what a bystander reads").
    const masked = isMasked();
    return {
      txid: d.txid || '',
      direction: dirIn ? 'in' : 'out',
      status,
      // unknown counterparty → NO name/contact (title stays "Sent"/"Received",
      // the direction circle carries the identity slot, the address row still
      // shows the raw address). Data-honest — never a gradient of "Unknown".
      name: masked ? WALLET_MASK : (unknown ? '' : (nameIsAddr ? truncateAddressMiddle(e.name) : e.name)),
      contact: masked ? false : !unknown,
      address: masked ? '' : (e.address || ''),
      avatar: (masked || unknown) ? null : e.avatar,
      amount: masked ? WALLET_MASK : ((e.amount != null && e.amount !== '') ? sign + amountWithCommas(e.amount) : ''),
      fiat: masked ? '' : ((e.fiat != null && e.fiat !== '') ? sign + '$' + amountWithCommas(e.fiat) : ''),
      fee: masked ? '' : ((d.fee != null && d.fee !== '') ? amountWithCommas(d.fee) + ' IXI' : ''),
      timeText: txTimeDisplay(e.timeText || d.time || ''),
    };
  }

  /* iOS-55 (#325, W1 LANDED): C# pushes the RAW EPOCH (seconds) in addEntry/
   * setData time args — all-digits formats via formatTxTimestamp/docLocale
   * (translated month names, chat-row parity); anything else = an OLD exe's
   * pre-formatted English string → verbatim (backcompat). */
  function txTimeDisplay(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (/^\d{1,12}$/.test(s) && Number(s) > 0) return formatTxTimestamp(Number(s) * 1000);
    return s;
  }

  /* Detail card = the openTxSheet builder LIFTED out of a ghost sheet (the
   * desktop demo's §2.2 recipe, desktop.html:1628 — same card, pane host, no
   * bottom sheet). The ghost never paints: it mounts detached and is dismissed
   * synchronously; the lifted .c-txsheet is reparented before the overlay's
   * 400ms removal fallback touches it. Explorer keeps its one-shot latch —
   * a status re-render re-arms it (sheet parity). */
  function render() {
    const tx = buildTx();
    const ghost = document.createElement('div');
    const sheet = openTxSheet({
      tx, host: ghost, strings,
      // TX-SCOPED explorer (the page's own verb — C# opens ?p=transaction&id=<txid>).
      onExplorer: () => bridge.send('ixian:viewexplorer'),
    });
    const detail = sheet.querySelector('.c-txsheet');
    closeSheet(sheet);
    const cap = document.createElement('div');
    cap.className = 'tx-cap';
    cap.append(detail);
    // #285 per-view reveal: masked → an explicit eye under the amount block
    // reveals THIS view only (the global flag is untouched; the next
    // setHideBalance flip re-masks). Sits inside the card, under the head.
    if (canReveal()) {
      const revealHost = document.createElement('div');
      revealHost.className = 'tx-reveal';
      revealHost.append(createButton({
        label: strings.revealAmounts || 'Show amounts',
        // NOTE: createButton takes an icon ELEMENT, not a name — a string here
        // threw inside the fail-soft dispatcher = eternal boot spinner (F5
        // 2026-07-29). Text-only: the bundle does not export icon(); not worth
        // a bundle rebuild for a glyph.
        type: 'outline', size: 32,
        onClick: () => { revealed = true; render(); },
      }));
      const head = detail.querySelector('.c-txsheet__head');
      if (head) head.after(revealHost); else detail.prepend(revealHost);
    }
    // Re-review MINOR-1: a live status re-render replaces the card in place — if
    // keyboard focus sits inside the outgoing card it would drop to <body>.
    // Re-home it onto the same control (class + index) in the fresh card, else
    // the first focusable there.
    const active = document.activeElement;
    let restoreSel = '', restoreIdx = -1;
    if (active && scroll.contains(active) && active.className) {
      try {
        restoreSel = '.' + String(active.className).trim().split(/\s+/).join('.');
        restoreIdx = Array.prototype.indexOf.call(scroll.querySelectorAll(restoreSel), active);
      } catch (e) { restoreSel = ''; }
    }
    scroll.replaceChildren(cap);
    if (restoreSel && restoreIdx >= 0) {
      let next = null;
      try { next = cap.querySelectorAll(restoreSel)[restoreIdx] || null; } catch (e) {}
      if (!next) next = cap.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
      if (next && next.focus) next.focus({ preventScroll: true });
    }
    rendered = true;
  }

  const handlers = {
    // Q4-③ (#270): the #258 §0 "every shell exposes the call globals" contract is
    // RETIRED — calls present on the ONE native CallPage; no shell receives call
    // pushes anymore (the C# broadcasts route to the surface, not to pages).

    // Buffer reset ONLY — never clears the rendered card (C# pushes a lone
    // clearEntries on every unchanged re-poll; see the contract docblock).
    // #288 F5: resets the STAGING buffer — the committed model survives until the next
    // setData, so a later render() (reveal, status flip) still has real data.
    clearEntries() { staging.entries = []; staging.received = false; },
    setReceivedMode() { staging.received = true; },
    addEntry(address, username, avatar, amount, fiat, time, type, confirmed) {
      staging.entries.push({
        address: address || '',
        name: username || '',
        avatar: resolveAvatar(avatar),
        amount: amount || '',
        fiat: fiat || '',
        timeText: time || '',
        direction: type === 'receive' ? 'in' : 'out',
        status: statusFrom(confirmed),
      });
    },
    // Closes every burst → the one render/re-render point (live status flips).
    // #288 F5: COMMIT the staged burst before rendering (see the staging docblock).
    setData(amount, fee, time, txid, confirmed) {
      model.entries = staging.entries.slice();
      model.received = staging.received;
      model.data = {
        amount: amount || '', fee: fee || '', time: time || '',
        txid: txid || '', status: statusFrom(confirmed),
      };
      render();
    },
    // Pane-hosted (wide): drop the back affordance — C# owns the pane lifecycle.
    hideBackButton() { buildTopbar(false); },
    // #285: the persisted #263 hide flag (bool.ToString() → "True"/"False" —
    // home.html setHideBalance parity). A flip that CHANGES the value drops the
    // per-view reveal; an unchanged-value re-push early-returns and PRESERVES it —
    // which is what makes HomePage's balance-toggle broadcast to open panes safe
    // (#288). Do not "simplify" the early return away.
    setHideBalance(hide) {
      const h = hide === 'True' || hide === 'true' || hide === true;
      // #288 review: the FIRST push must always render, even when its value matches the
      // (masked-by-default) initial state — otherwise "False" on a visible balance would
      // early-return and leave the card masked forever.
      const firstKnown = !hideKnown;
      hideKnown = true;
      if (h === walletHidden && !firstKnown) return;
      walletHidden = h;
      revealed = false;
      if (rendered) render();
    },
    // #251 defense: theme re-push lands as a bare global — accept it.
    // ★ N71 (#421): body shared (theme-runtime.js). This shell carried a MINIMAL
    // variant with no transition suppression, so its swap animated every colour on
    // the page at once (#53); sharing the body fixes that for free.
    setTheme(name) { applyPushedTheme(name); },
  };
  bridge.exposeAll(handlers);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177). ————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
