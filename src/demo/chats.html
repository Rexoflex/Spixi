<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spixi Chats shell — demo</title>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/bottomnav.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/chatlist-item.css">
<link rel="stylesheet" href="../styles/components/chip.css">
<link rel="stylesheet" href="../styles/components/search-field.css">
<link rel="stylesheet" href="../styles/components/badge.css">
<link rel="stylesheet" href="../styles/components/overlay.css">
<link rel="stylesheet" href="../styles/components/toast.css">
<link rel="stylesheet" href="../styles/components/contact-request.css">
<link rel="stylesheet" href="../styles/components/message-menu.css">
<link rel="stylesheet" href="../styles/components/chats-shell.css">
<link rel="stylesheet" href="../styles/components/chats-header.css">
<link rel="stylesheet" href="../styles/components/chats-swipe.css">
<link rel="stylesheet" href="../styles/components/contacts-shell.css">
<link rel="stylesheet" href="../styles/components/txlist-item.css"><!-- chat-info payments rows (#142 precedent) -->
<link rel="stylesheet" href="../styles/components/chat-info.css"><!-- directory → accepted-contact profile -->
<link rel="stylesheet" href="../styles/components/scan-shell.css"><!-- add-contact scan entry (Phase 1 #3) -->
<link rel="stylesheet" href="../styles/components/backup-nudge.css"><!-- periodic backup prompt (legacy parity) -->
<link rel="stylesheet" href="../styles/components/rating-nudge.css"><!-- rate-app prompt (showRatingPrompt mirror) -->
<style>
  body { padding: var(--spacing-24); }
  .demo-toolbar { display: flex; gap: var(--spacing-12); align-items: center; max-width: 900px; margin: 0 auto var(--spacing-32); }
  .demo-frames { display: flex; gap: var(--spacing-32); flex-wrap: wrap; justify-content: center; }
  .demo-phone {
    width: 419px; height: 860px; display: flex; flex-direction: column;
    border: 1px solid var(--outline-neutral-02); border-radius: var(--radius-32);
    overflow: hidden; background: var(--surface-screen);
    box-shadow: var(--elevation-2); position: relative;
  }
  .demo-caption { text-align: center; margin-top: var(--spacing-12); color: var(--text-neutral-02); font-size: var(--font-size-body-sm); }
  .statusbar {
    height: 44px; flex: none; display: flex; align-items: end; justify-content: space-between;
    padding: 0 var(--spacing-24) var(--spacing-4);
    font-weight: var(--font-weight-bold); font-size: var(--font-size-label-md);
  }
  .content { flex: 1; display: flex; flex-direction: column; } /* scroll via .u-scroll */
  .fab {
    position: absolute; right: var(--spacing-16); bottom: calc(var(--layout-bar-bottom) + var(--spacing-16));
    width: 56px; height: 56px; border: 0; border-radius: var(--radius-full);
    background: var(--surface-action-default); color: var(--text-neutral-on-action);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--elevation-2); z-index: var(--z-10);
  }
  @media (hover: hover) { .fab:hover { background: var(--surface-action-hover); } }
  .fab:active { background: var(--surface-action-pressed); }
  /* contacts flow takeover — chat.html .demo-sendpanel grammar: starts below
     the 44px mock statusbar (real app: native safe-area, Phase 2 #22) */
  .demo-panel { position: absolute; inset: 44px 0 0 0; z-index: 25; display: flex; flex-direction: column; background: var(--surface-screen); }
  /* demo-only: a mock camera can't decode — the sim button stands in for html5-qrcode */
  .demo-scan-sim { position: absolute; inset-inline: 0; margin-inline: auto; width: max-content; top: 72px; z-index: 3; } /* below the scan topbar */
</style>
</head>
<body>
  <div class="demo-toolbar">
    <h1 class="t-heading-md" style="margin-right:auto">Chats shell</h1>
    <span id="park-slot"></span>
    <span id="theme-slot"></span>
  </div>

  <div class="demo-frames">
    <div>
      <div class="demo-phone">
        <div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▮</span></div>
        <div id="chats-topbar"></div>
        <div id="chats-header"></div>
        <div class="content u-scroll" id="chat-scroll"></div>
        <button class="fab" id="fab" aria-label="New chat"></button>
        <div id="chats-nav"></div>
      </div>
      <div class="demo-caption">Chats shell — model-driven list · collapsing header (scroll to see it retract) · filter chips · requests on top</div>
    </div>
  </div>

<script src="../components/icons.iife.js"></script>
<script src="strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="spixi.iife.js"></script>
<script>
  const {
    createButton, createTopbar, createBottomNav, setNavBadge,
    createChatsList, setChatsFilter, setChatsQuery, chatsUnreadTotal,
    createChatsHeader, attachChatsCollapse, renderChatsList,
    acceptContactRequest, completeHandshake, setRequestAccepting,
    startTimestampTicker, refreshTimestamps,
    showToast,
    createContactsPicker, setPickerSelection, setPickerContacts,
    createAddContact, setAddContactAddress, createGroupSetup, createPendingContact,
    createChatInfo,
    createScanView, deliverScanResult,
    showBackupNudge, showRatingNudge,
  } = window.Spixi;
  const icon = window.SpixiIcons.icon;
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

  const themeBtn = createButton({
    label: document.documentElement.dataset.theme === 'dark' ? 'Toggle light' : 'Toggle dark',
    type: 'outline', size: 32,
    onClick: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark';
      root.classList.add('theme-switching');
      root.dataset.theme = dark ? 'light' : 'dark';
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
      themeBtn.querySelector('.c-button__label').textContent = dark ? 'Toggle dark' : 'Toggle light';
    },
  });
  document.getElementById('theme-slot').append(themeBtn);

  // periodic backup nudge (legacy #backup-prompt parity — C# fires this via
  // toggleAnimatedSlider('backup-prompt') at most once per 30 days; the demo
  // button simulates that command so Damir can art-direct the sheet)
  const nudgeBtn = createButton({
    label: 'Backup nudge', type: 'outline', size: 32,
    onClick: () => showBackupNudge({
      host: phone,
      // illustrations-plan #6 — 404s until the art drops, then auto-upgrades
      // (img error → tonal shield-disc fallback, launch-shell grammar)
      illustration: 'images/onboarding/backup.svg',
      onBackup: () => showToast({ text: 'ixian:backup → Backup screen (C#)', tone: 'info', host: phone }),
    }),
  });
  document.getElementById('theme-slot').append(nudgeBtn);

  // rate-app prompt (legacy checkForRating → showRatingPrompt; re-prompts
  // until answered — answering marks rating_action=done C#-side)
  const rateBtn = createButton({
    label: 'Rating nudge', type: 'outline', size: 32,
    onClick: () => showRatingNudge({
      host: phone,
      onRate: (a) => showToast({
        text: 'ixian:rating:' + a + ' → ' + (a === 'yes' ? 'store review' : 'support email') + ' (C#)',
        tone: 'info', host: phone,
      }),
    }),
  });
  document.getElementById('theme-slot').append(rateBtn);

  const phone = document.querySelector('.demo-phone');
  document.getElementById('chats-topbar').append(createTopbar({
    variant: 'root', title: 'Spixi', logo: true,
    actions: [{ icon: 'users', label: 'Contacts', onClick: () => openDirectory() }],   // directory: tap = contact DETAILS (Damir)
  }));
  document.getElementById('fab').append(icon('message-plus'));

  const NAV_ITEMS = [
    { id: 'chats', label: 'Chats', icon: 'messages' },
    { id: 'apps', label: 'Apps', icon: 'apps' },
    { id: 'wallet', label: 'Wallet', icon: 'wallet' },
    { id: 'account', label: 'Account', icon: 'user-circle' },
  ];
  const nav = createBottomNav({ items: NAV_ITEMS, active: 'chats' });
  document.getElementById('chats-nav').append(nav);

  /* —— mock model (mirrors bridge addChat + showContactRequest; times relative) —— */
  const now = Date.now();
  const H = 3600000, D = 86400000;
  const at = (msAgo) => now - msAgo;

  const REQUESTS = [
    { name: '', address: '425Hnq88fnnf5CQen', timestamp: at(2 * H) },   // recent → interleaves near the top
    { name: 'Lando C.', address: '9xKd42lando', timestamp: at(5 * D) },  // older → sits deep in the timeline (not pinned on top)
  ];
  const CHATS = [
    { name: 'Han Solo', address: '4fj2solo', online: true, pinned: true, timestamp: at(2 * H), status: 'read', excerpt: { type: 'text', text: 'Chewbacca owes me money..' } },
    { name: 'Sarah Jo', online: true, timestamp: at(D), status: 'delivered', excerpt: { type: 'text', text: 'Coming soon, save me a seat…' } },
    { name: 'John Connor', online: true, timestamp: at(3 * D), unread: 3, excerpt: { type: 'file', text: 'Skynet-access-codes.md' } },
    { name: 'Camping Group Alpha', type: 'group', timestamp: at(3 * D), mention: true, excerpt: { type: 'mention', sender: 'Han Solo', text: '@Han I was there just 2 hour…' } },
    { name: 'Martins Obademo', timestamp: at(4 * D), excerpt: { type: 'call', text: 'Voice call' } },
    { name: 'QWERTZ', online: true, timestamp: at(29 * D), unread: 5, muted: true, excerpt: { type: 'call-missed', text: 'Missed voice call' } },
    { name: 'Baracuda', timestamp: at(29 * D), excerpt: { type: 'payment', text: 'Payment request 25 IXI' } },
    { name: 'London Trip Group', type: 'group', timestamp: at(6 * D), excerpt: { type: 'text', text: 'Han Solo was added' } },
    { name: 'Mexico Trip', type: 'group', timestamp: at(29 * D), excerpt: { type: 'typing', text: 'Han Solo is typing...' } },
    { name: 'Gaucho boy', timestamp: at(29 * D), excerpt: { type: 'draft', text: 'I was th' } },
    { name: '', address: '335Hxq21abcd5OP32', timestamp: at(400 * D), status: 'sent', excerpt: { type: 'text', text: 'Address-only contact (older than a year)' } },
  ];

  const state = { chats: CHATS, requests: REQUESTS, filter: 'all', query: '' };
  const strings = {};
  // capability flags — parkable BE-gated features (#67/§8). Demo defaults pin/mute
  // ON so the swipe is testable; the toolbar "Park pin/mute" button flips them OFF
  // to prove the feature parks (swipe + menu items vanish) until BE ships.
  const caps = { pin: true, mute: true, favorites: false };
  const opts = {
    strings, host: phone, capabilities: caps,
    onOpen: (c) => showToast({ text: 'Open ' + (c.name || c.address) + ' — demo only', tone: 'info', host: phone }),
    // #109 staged accept: latch "Accepting…", then (mock bridge) transition the
    // request into a handshaking chat, then settle it on handshake-complete.
    onRequestAccept: (r, row) => {
      setRequestAccepting(row, strings);
      showToast({ text: 'Accepting ' + (r.name || r.address) + '…', tone: 'info', host: phone });
      setTimeout(() => {                                   // mock: accept ack → establishing
        const chat = acceptContactRequest(list, state, r, opts);
        if (!chat) return;
        setTimeout(() => {                                 // mock: bridge handshake-complete (§9)
          completeHandshake(list, state, chat, opts);
          showToast({ text: 'Secured — ' + (chat.name || chat.address) + ' is ready', tone: 'success', host: phone });
        }, 2600);
      }, 650);
    },
    onHandshakeBlocked: (c) => showToast({ text: 'Still establishing a secure handshake with ' + (c.name || c.address) + '…', tone: 'info', host: phone }),
    onRequestDecline: (r) => showToast({ text: 'Decline ' + (r.name || r.address) + ' — demo only', tone: 'info', host: phone }),
    onChatInfo: (c) => showToast({ text: 'Chat info: ' + (c.name || c.address) + ' — pane coming later', tone: 'info', host: phone }),
    onModelChange: (s) => setNavBadge(nav, 'chats', chatsUnreadTotal(s.chats)),
    onPersist: (action) => showToast({ text: action + ' → bridge intent (mock; C# persists when BE ships)', tone: 'info', host: phone }),
  };

  const scroller = document.getElementById('chat-scroll');
  const list = createChatsList(state, opts);
  scroller.append(list);

  const header = createChatsHeader({
    activeFilter: 'all', strings, favorites: caps.favorites,
    onFilter: (f) => setChatsFilter(list, state, f, opts),
    onQuery: (q) => setChatsQuery(list, state, q, opts),
  });
  document.getElementById('chats-header').append(header);
  attachChatsCollapse(header, scroller);

  // demo-only: park/unpark pin+mute to show the capability gating (swipe + menu)
  let parked = false;
  const parkBtn = createButton({
    label: 'Park pin/mute', type: 'outline', size: 32,
    onClick: () => {
      parked = !parked;
      caps.pin = !parked; caps.mute = !parked;
      parkBtn.querySelector('.c-button__label').textContent = parked ? 'Unpark pin/mute' : 'Park pin/mute';
      renderChatsList(list, state, opts);   // re-render → swipe + menu items reflect caps
    },
  });
  document.getElementById('park-slot').append(parkBtn);

  // Chats badge (#42): unread total excluding muted; bare mention = 1
  setNavBadge(nav, 'chats', chatsUnreadTotal(state.chats));

  /* —— FAB → contacts picker (Phase 1 #2, docs/contacts-spec.md) —— */

  // mock roster (bridge: clearContacts/addContact — type 0 normal · 2 bot/no-group;
  // `pending` = request-sent flag, §9 ask — roster addContact lacks it today)
  // Realistic Ixian-length addresses (~38 base58 chars) so the list subline reads
  // as an identity token, not a handle (spec §7①) — the old short word-like stubs
  // are why the second line looked like a username. Recognizable substrings kept
  // mid-string for the search/dup/tx demos.
  const ROSTER = [
    { name: 'Han Solo', address: 'SxK7q9RmW2p4fj2soloD3vBnH8tYcF6JuEwQ2z', online: true, type: 0 },
    { name: 'Sarah Jo', address: '9KdT2rN8mZ5sarahjo55LpQ7vBqH3xY6bT4nR1', online: true, type: 0 },
    { name: 'John Connor', address: '3nQ8kRpW2mZ7jconnor1984D2cF6JuEwK9xY5b', type: 0 },
    { name: 'Martins Obademo', address: '7pLdN3vBqH2momartins88K8sZtYcF6JuEwA1W', type: 0 },
    { name: 'QWERTZ', address: 'Xy7bT3nQ5qwertz9900aaKpR8mWzD2cF6JuEwA', online: true, type: 0 },
    { name: 'Baracuda', address: '8vBqH7pLdN3baracuda777bT2cF6JuEwK9xY4m', type: 0 },
    { name: 'Gaucho boy', address: '6JuEwK9xY5gauchoboy44R8mWzD2cF3vBqH7pL', type: 0 },
    { name: 'Ixian News', address: '4rN8mWzD2ixnews0001cF6JuEwA1vBqH7pLdN3', type: 2 },              // bot — gated out of multi-select
    { name: 'Ben Kenobi', address: '0bKR8mWzDkenobi78900cF6JuEwA1vBqH7pLdN', pending: true, type: 0 },   // OUR request sent, awaiting accept (Lando is the INCOMING request above)
    { name: '', address: '335Hxq21abcd5OP32KpR8mWzD2cF6JuEwA1vBq', type: 0 },                    // address-only contact
  ];

  const openPanel = (build) => {
    const panel = document.createElement('div');
    panel.className = 'demo-panel';
    const close = () => panel.remove();
    panel.append(build(close));
    phone.append(panel);
  };

  // open (or create) the conversation for a contact — post-add lands HERE (Damir pick)
  const openConversation = (c) => {
    // F9: prefer address when present (name-only OR-matching can collide, e.g. a
    // contact whose name equals an existing group's name); fall back to name only
    // for address-less rows.
    let chat = state.chats.find((x) => (c.address ? x.address === c.address : (c.name && x.name === c.name)));
    if (!chat) {
      chat = {
        name: c.name || '', address: c.address, timestamp: Date.now(), status: 'sent',
        excerpt: { type: 'text', text: c.pending !== false ? 'Contact request sent — waiting for accept' : '' },
      };
      state.chats.unshift(chat);
      renderChatsList(list, state, opts);
      if (opts.onModelChange) opts.onModelChange(state);
    }
    opts.onOpen(chat);
  };

  const openAddContact = (closePicker) => {
    openPanel((closeAdd) => {
      const add = createAddContact({
        strings,
        onBack: closeAdd,
        onScan: () => openScan(add),               // Phase 1 #3: full scan takeover (docs/scan-spec.md)
        // mock ixian:checkAddress → onValidAddress (silent on failure, bridge-audit-A.md:201)
        onCheckAddress: (a, ctrl) => setTimeout(() => ctrl.done(), 450),
        // mock ixian:request:<address> — known dupe fails like C# (self/existing reject)
        onSendRequest: (a, ctrl) => setTimeout(() => {
          if (a === 'SxK7q9RmW2p4fj2soloD3vBnH8tYcF6JuEwQ2z') ctrl.fail('Already in your contacts.');
          else ctrl.done();
        }, 900),
        onOpened: (a) => {
          closeAdd();
          closePicker();
          openConversation({ name: '', address: a, pending: true });
          showToast({ text: 'Request sent — conversation opened (chat surface lives in chat.html)', tone: 'success', host: phone });
        },
      });
      return add;
    });
  };

  /* —— Scan takeover (Phase 1 #3, docs/scan-spec.md) —— */

  // deterministic permission mock: the FIRST Allow attempt DENIES so the
  // recovery state is demoable (and smoke-stable); Try again grants.
  let camGranted = false;
  const SCAN_DEMO_ADDR = 'QRj2NewFriend77xKpR8mWzD2cF6JuEwA1vBq3';
  const openScan = (addEl) => {
    openPanel((closeScan) => {
      const scan = createScanView({
        strings,
        onCancel: closeScan,                       // → ixian:back (C# pops + GC.Collect)
        onRequestPermission: (ctrl) => setTimeout(() => {
          if (!camGranted) {
            camGranted = true;
            ctrl.fail();
            showToast({ text: 'Mock: first attempt denied — demos the recovery state', tone: 'info', host: phone });
          } else ctrl.done();
        }, 500),
        onTorch: (on, ctrl) => setTimeout(() => ctrl.done(), 200), // mock — real torch = device tests (Phase 3)
        // ixian:qrresult:<text> → C# pops the page → parent setAddress (auto-fill + return)
        onDecode: (text) => {
          closeScan();
          setAddContactAddress(addEl, text);
          showToast({ text: 'ixian:qrresult → setAddress (mock)', tone: 'success', host: phone });
        },
      });
      // demo-only: mock camera can't decode — this button stands in for html5-qrcode
      const sim = createButton({
        label: 'Simulate QR decode', type: 'outline', size: 32,
        onClick: () => deliverScanResult(scan, SCAN_DEMO_ADDR),
      });
      sim.classList.add('demo-scan-sim');
      scan.append(sim);
      return scan;
    });
  };

  const openGroupSetup = (picker, sel, closePicker) => {
    openPanel((closeSetup) => createGroupSetup({
      members: sel,
      strings,
      onBack: closeSetup,                                // picker below keeps the selection (spec §3c)
      onMembersChange: (addrs) => setPickerSelection(picker, addrs),
      // mock ixian:avatar → loadAvatar (no native picker in a browser)
      onPickAvatar: (ctrl) => setTimeout(() => ctrl.done(
        'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(210 60% 55%)"/><stop offset="1" stop-color="hsl(250 60% 45%)"/></linearGradient></defs><rect width="80" height="80" fill="url(#g)"/></svg>'),
      ), 500),
      // mock ixian:select:<blindFlag+name>:|addr|… (bridge-audit-A.md:530)
      onCreate: ({ name, blind, addresses }, ctrl) => setTimeout(() => {
        ctrl.done();
        closeSetup();
        closePicker();
        // F10: stub a synthetic address so address-keyed paths (openConversation dup-guard, etc.) don't choke
        const chat = { name, address: 'grp-' + Date.now(), type: 'group', timestamp: Date.now(), excerpt: { type: 'text', text: 'Group created' + (blind ? ' · blind' : '') } };
        state.chats.unshift(chat);
        renderChatsList(list, state, opts);
        if (opts.onModelChange) opts.onModelChange(state);   // F8: badge/model listeners must see the new row
        showToast({ text: 'ixian:select → ' + (blind ? '1' : '0') + name + ' · ' + addresses.length + ' member' + (addresses.length === 1 ? '' : 's') + ' (mock)', tone: 'success', host: phone });
      }, 900),
    }));
  };

  function openContacts() {
    openPanel((closePicker) => {
      const picker = createContactsPicker({
        contacts: ROSTER,
        strings,
        onBack: closePicker,
        onOpenChat: (c) => { closePicker(); openConversation(c); },
        onAddContact: () => openAddContact(closePicker),
        onNext: (sel) => openGroupSetup(picker, sel, closePicker),
      });
      return picker;
    });
  }
  document.getElementById('fab').addEventListener('click', openContacts);

  /* —— topbar Contacts → DIRECTORY: tap = contact details (Damir round 4) —— */

  // demo payment activity (addPaymentActivity mock — Han has history, others are empty)
  const DEMO_TXS = {
    'SxK7q9RmW2p4fj2soloD3vBnH8tYcF6JuEwQ2z': [
      { direction: 'out', status: 'pending', name: 'Han Solo', timestamp: Date.now() - 36e5, amount: '4.00' },
      { direction: 'out', status: 'confirmed', name: 'Han Solo', timestamp: Date.now() - 864e5, amount: '-25.00', fiat: '$30.87' },
      { direction: 'in', status: 'confirmed', name: 'Han Solo', timestamp: Date.now() - 2 * 864e5, amount: '+120.00', fiat: '$148.20' },
      { direction: 'out', status: 'failed', name: 'Han Solo', timestamp: Date.now() - 8 * 864e5, amount: '1.00' },
    ],
    '9KdT2rN8mZ5sarahjo55LpQ7vBqH3xY6bT4nR1': [
      { direction: 'in', status: 'confirmed', name: 'Sarah Jo', timestamp: Date.now() - 3 * 864e5, amount: '+10.00', fiat: '$12.35' },
    ],
  };

  const openContactProfile = (c, closePicker, picker) => {
    openPanel((closeProfile) => {
      if (c.pending) {
        return createPendingContact({
          name: c.name, address: c.address, strings,
          onBack: closeProfile,
          // mock ixian:undorequest (removes the friend, bridge-audit-A.md:86)
          onCancelRequest: (ctrl) => setTimeout(() => {
            ctrl.done();
            closeProfile();
            // F14: mirror the real bridge — undorequest REMOVES the friend, so the
            // demo roster must drop the contact too (else re-opening the directory
            // still shows it as pending).
            const i = ROSTER.indexOf(c);
            if (i !== -1) ROSTER.splice(i, 1);
            if (picker) setPickerContacts(picker, ROSTER);
            showToast({ text: 'ixian:undorequest → request cancelled (mock)', tone: 'info', host: phone });
          }, 700),
        });
      }
      // SAME controls as chat-info's contact page (chat.html contactPage parity —
      // #142③: one component, context 'contact'; only chat-side rows stay behind)
      return createChatInfo({
        kind: 'contact', context: 'contact',
        name: c.name, address: c.address, avatarSeed: c.address,
        txs: DEMO_TXS[c.address] || [],
        host: phone,
        onBack: closeProfile,
        onMessage: () => { closeProfile(); closePicker(); openConversation({ ...c, pending: false }); },
        onPay: () => showToast({ text: 'Pay — wallet flow lives in chat.html', tone: 'info', host: phone }),
        onRequest: () => showToast({ text: 'Request — wallet flow lives in chat.html', tone: 'info', host: phone }),
        onTx: () => showToast({ text: 'Would open the wallet tx sheet', tone: 'info', host: phone }),
        onTxAll: () => showToast({ text: 'Full payment history — wallet activity', tone: 'info', host: phone }),
        onNickname: (nick, ctrl) => setTimeout(ctrl.done, 700),   // ixian:userdefinednick
        onRemoveContact: (ctrl) => setTimeout(() => {             // ixian:remove
          ctrl.done();
          closeProfile();
          const i = ROSTER.indexOf(c);
          if (i !== -1) ROSTER.splice(i, 1);
          if (picker) setPickerContacts(picker, ROSTER);
          showToast({ text: 'Contact removed — ixian:remove (mock)', tone: 'info', host: phone });
        }, 1100),
        strings,
      });
    });
  };

  function openDirectory() {
    openPanel((closePicker) => {
      const picker = createContactsPicker({
        contacts: ROSTER,
        purpose: 'directory',
        strings,
        onBack: closePicker,
        onAddContact: () => openAddContact(closePicker),
        onViewContact: (c) => openContactProfile(c, closePicker, picker),
      });
      return picker;
    });
  }

  startTimestampTicker(() => refreshTimestamps(list));
</script>
</body>
</html>
