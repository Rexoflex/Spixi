# OpenSSF Scorecard of the fork (repository hygiene: pinned actions, token permissions, dangerous workflows, branch
# rules ...). Results go to code scanning as SARIF (Security tab) and, for five days, as a build artifact. The fork only.
#
# WHAT RUNS WHERE (read before you expect a result). Facts from ossf/scorecard-action v2.6.0 (options/options.go,
# Validate): for every event that is not a pull request the action stops with "only the default branch is supported"
# when the ref is not the default branch of the repository. The default branch of Rexoflex/Spixi is `master`, not
# `redesign/frontend`, and a `schedule:` trigger runs only from the copy of a workflow on the default branch. So, until
# this file is on `master`:
#   - the weekly schedule NEVER fires (inert);
#   - a push to `redesign/frontend`, or a manual run on that branch, runs only the job `not-default-branch`, which prints
#     a notice and does nothing else (the job `analysis` is skipped; if it ran, the action would fail on the ref);
#   - there is no Scorecard SARIF in code scanning, and no new Scorecard reading.
# From the day this file is on `master` the job `analysis` runs on each push to `master`, each Monday, and on a manual run
# of `master`. The reading of the checks before that day is `docs/scorecard-baseline.md` (made by hand / by the CLI).
# A `pull_request` trigger (local-file mode, marked experimental by the action) is NOT used here.
#
# PUBLISHING (the OpenSSF API at api.scorecard.dev, the badge) is OFF: `publish_results: false`, no `id-token` permission,
# and nothing leaves the runner except the SARIF upload to GitHub. To turn it on later: set `publish_results: true` and
# add `id-token: write` to the job `analysis` only. The file already obeys the rules that publishing needs (no workflow
# level env or defaults, no workflow level write permission, no env / container / service / `run` step in the job, only
# approved actions in it), so that is the whole change. The Branch-Protection check needs more than the default token
# (a repository PAT); no secret is used here, so that check reads unknown (-1) in this workflow.
name: scorecard

on:
  schedule:
    - cron: '23 5 * * 1'   # Mondays 05:23 UTC; runs only from the copy on the default branch
  push:
    branches: [ 'master', 'redesign/frontend' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis (default branch only)
    if: github.repository == 'Rexoflex/Spixi' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # upload the SARIF to code scanning
      contents: read
      actions: read
    steps:
    - name: Checkout Spixi
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false   # the action's own example does the same: Scorecard reads the checkout, it does not push

    - name: Run Scorecard
      uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5   # v2.6.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: false

    - name: Keep the SARIF as an artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: scorecard-sarif
        path: results.sarif
        if-no-files-found: error
        retention-days: 5

    - name: Upload the SARIF to code scanning
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934   # v4.39.5
      with:
        sarif_file: results.sarif
        category: scorecard

  not-default-branch:
    name: Scorecard does not run on this branch
    if: github.repository == 'Rexoflex/Spixi' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Say why nothing ran
      run: echo "::notice title=Scorecard::ossf/scorecard-action runs only on the default branch (master). This branch gets no Scorecard run. The weekly schedule also starts only after this file is on master."
