   * C# side is unchanged: Confirm emits the existing `ixian:payRequest:<id>`, and
   * `payRequestResult` resolves the sheet exactly as `signSendResult` resolves the
   * compose (ok → success morph · cancel → silent re-enable · fail → inline). */
  let chatPayReview = null;                            // the open sheet's controller
  let chatPayCtrl = null;                              // its pending done/fail
  let chatPayId = '';                                  // loop r1 B-7: the card the sheet belongs to
  let chatPayWait = 0;
  function clearPayWait() { if (chatPayWait) { clearTimeout(chatPayWait); chatPayWait = 0; } }
  function closePayReview() {                          // loop r1 B-3: the screen-ready sweep + teardown path
    const r = chatPayReview;
    chatPayReview = null; chatPayCtrl = null; chatPayId = '';
    clearPayWait();
    if (r) { try { r.close(true); } catch (e) { /* already gone */ } }
  }
  function openPayRequestReview(rec) {
    if (chatPayReview) return;                         // double-open guard
    if (mode.type !== 0) return;                       // loop r1 A-2: 1:1 only (the card arm gates too — belt)
    if (!identity.address || !rec || !rec.id) return;
    const s = window.SL || {};
    const amount = String(rec.amount).trim();
    chatPayId = String(rec.id);
    chatPayReview = openPaymentReview({
      recipient: {
        name: (identity.name && identity.name !== identity.address) ? identity.name : '',
        address: identity.address,
        avatar: identity.avatar || null,
        contact: true,
      },
      amount, fee: null,                               // W6: quoted live — no invented fee
      host: overlayHost, strings: s,
      title: s.payRequestTitle || 'Pay this request',
      onQuote: (addr, amt) => bridge.send('ixian:feeQuery:' + addr + ':' + amt),
      onConfirm: (payload, ctrl) => {
        chatPayCtrl = ctrl;
        clearPayWait();
        // the tipWait grammar: no answer → release, never claim failure. Loop r1 B-2:
        // ABOVE C#'s 120 s confirm self-heal (SPayments.acquireConfirm) — the native
        // dialog can legitimately sit open that long, and a re-armed Confirm under it
        // would only collide with the live confirm.
        chatPayWait = setTimeout(() => {
          chatPayWait = 0;
          const c = chatPayCtrl;
          if (!c) return;
          chatPayCtrl = null;
          c.fail(s.sendNoAnswer || 'No response from the app. Check your wallet activity before you try again.');
        }, 125000);
        bridge.send('ixian:payRequest:' + rec.id);
      },
      onDone: () => { chatPayReview = null; chatPayCtrl = null; chatPayId = ''; clearPayWait(); },   // the status pushes flip the card
      onCancel: () => { chatPayReview = null; chatPayCtrl = null; chatPayId = ''; clearPayWait(); renderLog(); },   // release the Pay latch
    });
    if (!chatPayReview) { chatPayId = ''; renderLog(); }
  }

  /* #528: in-chat Request — the #139 amount sheet (peer known, no balance guard).
   * ONE verb per request (`ixian:sendrequest:<addr>:<amount>`, the W8 grammar on
   * SingleChatPage now); the request-out card arrives via the normal push. */
  function openRequestForPeer() {
    // ★★ ONE PREDICATE (round 2, MAJOR-2) — see openSendTakeover.
    if (!attachFlags().payments || !identity.address) return;
    openRequestSheet({
      recipient: {
        name: (identity.name && identity.name !== identity.address) ? identity.name : '',
        address: identity.address,
        avatar: identity.avatar || null,               // #342: the confirm moment shows WHO
      },
      host: overlayHost,
      strings: window.SL || {},
      onRequest: (payload, ctrl) => {
        bridge.send('ixian:sendrequest:' + identity.address + ':' + payload.amount);
        ctrl.done();                                   // a request is a message — the card push confirms
      },
    });
  }

  /* App-invite picker (legacy parity): the attach "App invite" tile opens a
   * sheet of installed multi-user apps (captured from loadApps/addApp); picking
   * one emits ixian:app:<id> → onApp starts an app session with the peer
   * (xaml:832). Empty state when none are installed. */
  function openAppPicker() {
    // ★★ ONE PREDICATE (round 2, MAJOR-2): C# blocks onApp in a bot room (xaml:834),
    // and an unknown room answers false too.
    if (!attachFlags().apps) return;
    const s = window.SL || {};
    const content = document.createElement('div');
    content.className = 'chat-app-picker';
    if (!chatApps.length) {
      const empty = document.createElement('p');
      empty.className = 'chat-app-picker__empty';
      empty.textContent = s.noApps || 'No apps installed yet.';
      content.append(empty);
    } else {
      for (const app of chatApps) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chat-app-picker__item';
        if (window.SpixiIcons && window.SpixiIcons.icon) b.append(window.SpixiIcons.icon('rocket', { size: 20 }));
        const nm = document.createElement('span');
        nm.className = 'chat-app-picker__name';
        nm.textContent = app.name;
        b.append(nm);
        b.addEventListener('click', () => { closeSheet(sheet); bridge.send('ixian:app:' + app.id); });
        content.append(b);
      }
    }
    const sheet = createSheet({ title: s.inviteApp || 'Invite an app', content, host: overlayHost, strings: s });
    openSheet(sheet);
  }

  /* incoming contact-request pane (#109) — showContactRequest fires when the
   * peer's requestAdd lands and they're not yet approved (xaml:1196). Only "1"
   * is sent (no identity), so we populate from the header identity. Accept →
   * ixian:accept (onAcceptFriendRequest); Decline → ixian:undorequest (the only
   * decline path SingleChatPage offers — removes the pending friend + leaves).
   * Sits above the composer.
   * Q1 review (#267 loop): the old claim "C#'s re-flush after accept clears it"
   * was FALSE — onAcceptFriendRequest (xaml:886-895) only flips friend.approved +
   * sendAcceptAdd; it pushes NO UI command and never calls loadMessages, so the
   * clearMessages → removeRequestPane path never fires on accept. The pane stayed
   * armed over a live composer, and its Decline (undorequest → removeFriend) then
   * DELETED the contact the user had just accepted. Accept now resolves the
   * request FE-side (markRequestResolved: drop the pane + unlock + latch). */
  let requestPane = null;
  let requestResolved = false;   // ⑪ per-peer latch: this peer's request is settled for this page-load
  function removeRequestPane() { if (requestPane) { requestPane.remove(); requestPane = null; } }
  /* Q1 review (#267 loop): the request is settled (accepted here, from the
   * chats-list card, or on the peer's side — C#'s updateScreen pushes
   * showRequestSentModal("0") for BOTH pending states now). Terminal for this
   * peer/page-load: the still-arriving 1 Hz "Waiting for response" heartbeat and
   * a late showContactRequest must not re-lock the composer or re-arm the pane
   * behind the user's back (legacy did the same — chat.js:1880-1883 hid the pane
   * and re-enabled the chat bar on the accept click). NOT called on cancel/decline
   * (those pop the page). Reset per-peer in onChatScreenReady. */
  function markRequestResolved() {
    requestResolved = true;
    setComposerLock(null);
    removeRequestPane();
  }
  function showRequestPane() {
    removeRequestPane();
    requestPane = document.createElement('div');
    requestPane.className = 'chat-request-pane';
    requestPane.append(createContactRequest({
      name: identity.name || '', address: identity.address || '',
      timestamp: Date.now(), host: overlayHost, strings: window.SL || {},
      // Accept → optimistic resolve: emit the verb, then drop the pane + unlock +
      // latch. C# gives us nothing back on accept (see the docblock above), so the
      // pane's removal is OURS to do; the latch makes it stick against the pending
      // heartbeat that keeps ticking until the next updateScreen.
      onAccept: () => { bridge.send('ixian:accept'); markRequestResolved(); },
      onDecline: () => bridge.send('ixian:undorequest'),
    }));
    document.getElementById('chat-composer').before(requestPane);
    // ⑪ same-class hazard as the outgoing lock: pre-accept the handshake isn't
    // done — a composed message would be locally "sent" (ticks) and never arrive.
    // The pane's Accept/Decline are the only affordances until the accept lands.
    setComposerLock('incoming');
  }

  /* ⑪ ★ COMPOSER LOCK (pending contact states) — DECISIONS #266.
   * THE BUG: after sending a contact request the composer stayed live; a typed
   * message was written to the LOCAL store, rendered with delivered+read ticks
   * (updateMessage echoes the local record's flags — not a real ack), and the
   * peer NEVER received it. The app lied about delivery.
   * THE SIGNAL (was a dbg stub): SingleChatPage.onLoad:648-652 pushes
   * showRequestSentModal("1") when friend.state == RequestSent; updateScreen
   * :1900-1904 pushes "0" the moment the state flips to Approved — an EXPLICIT
   * unlock, chosen over inferring from the accepted-system-message or the
   * showCallButton side-channel (states, not messages; codec-independent).
   * THE CANCEL: ixian:undorequest (xaml:353 — removeFriend + pop + clear detail
   * pane; already the incoming-decline verb). No confirm on Cancel: it's
   * reversible (re-send the request) and ⑩ just made Decline single-click —
   * one grammar for both request-flow exits. C# pops the page after cancel;
   * the chats-list "Request sent" row + picker pending badge clear on the
   * shouldRefreshContacts re-flush (HomePage:1945-1949) — no FE mirror needed.
   * States: null (live) · 'outgoing' (waiting strip + Cancel) · 'incoming'
   * (request pane is the affordance; composer hidden, no strip). */
  let composerLock = null;
  let pendingStrip = null;
  function pendingStripText() {
    const tpl = (window.SL && window.SL.waitingForAccept) || 'Waiting for {name} to accept your request';
    // #288 review: String.replace expands $&, $`, $' and $n in the REPLACEMENT, so a
    // peer nickname containing "$&" rendered mangled. split/join is the codebase canon.
    return tpl.split('{name}').join(identityTitle() || '');
  }
  function refreshPendingStrip() {
    if (!pendingStrip) return;
    const t = pendingStrip.querySelector('.chat-pending-strip__text');
    if (t) t.textContent = pendingStripText();
  }
  function setComposerLock(kind) {
    if (composerLock === kind) { refreshPendingStrip(); return; }
    composerLock = kind;
    if (pendingStrip) { pendingStrip.remove(); pendingStrip = null; }
    if (composerEl) composerEl.hidden = !!kind;
    if (kind === 'outgoing') {
      pendingStrip = document.createElement('div');
      pendingStrip.className = 'chat-pending-strip';
      const txt = document.createElement('span');
      txt.className = 'chat-pending-strip__text';
      txt.textContent = pendingStripText();
      // polite live region: the strip appears/disappears with the request state
      pendingStrip.setAttribute('role', 'status');
      /* ★ #562 (Damir 2026-08-25) SUPERSEDES the ⑪ Cancel: HIDE, with the words.
       * The old ixian:undorequest ran removeFriend — Damir's repro: the peer's
       * later accept then landed in a void and their chat could never deliver
       * (RC1's cost). The strip now opens the SAME explain-modal the chats-list
       * row uses (one surface, #149③ rule); confirming writes the
       * `spixi.hidereq.<addr>` handshake (home.html tombstones the row with its
       * real tail) and leaves the chat. The Friend record LIVES — a future
       * accept completes and the chat comes back, as the words promise. */
      const cancel = createButton({
        label: (window.SL && window.SL.hideRequest) || 'Hide request',
        type: 'text', size: 32,
        onClick: () => {
          openRevokeRequestFlow({
            chat: { name: identityTitle(), address: identity.address || '' },
            host: overlayHost,
            strings: window.SL || {},
            onAction: () => {
              // r3 NIT: no identity yet → no key (a bare-prefix key could never be consumed)
              try { if (identity.address) localStorage.setItem('spixi.hidereq.' + identity.address, String(Date.now())); } catch (err) {}
              bridge.send('ixian:back');
            },
          });
        },
      });
      const disc = document.createElement('span');
      disc.className = 'chat-pending-strip__disc';
      disc.setAttribute('aria-hidden', 'true');   // decorative; the text is the status
      if (window.SpixiIcons && window.SpixiIcons.icon) disc.append(window.SpixiIcons.icon('user-plus', { size: 18 }));
      pendingStrip.append(disc, txt, cancel);
      document.getElementById('chat-composer').append(pendingStrip);
    }
  }

  /* secure-chat / privacy notice — ALWAYS the first item in the log, mirroring
   * the legacy `private-messages-note` (chat.js clearMessages:1404). Marks the
   * conversation as end-to-end encrypted + P2P. Copy is i18n-overridable via
   * window.SL; "How it works" opens the security page through the legacy verb. */
  const SECURE_LINK = 'https://www.spixi.io/help-center.html';
  function createSecureNotice() {
    const s = window.SL || {};
    return createSystemNotice({
      title: s.secureNoticeTitle || 'Encrypted. Peer-to-peer. Yours alone.',
      text: s.secureNoticeText || 'Messages go straight from device to device, sealed with post-quantum encryption. No server carries or stores them. Every message exists only with you two, nowhere else.',
      linkLabel: s.secureNoticeLink || 'How it works',
      onLink: () => bridge.send('ixian:openLink:' + SECURE_LINK),
    });
  }

  /* full re-render of the log from the model — used after any insert/delete so
   * grouping + timestamp order stay correct. Rebuilds date separators too.
   * Call the coalesced `renderLog()` from handlers; `renderLogNow()` is the
   * synchronous rebuild (also used for the first paint). */
  function renderLogNow() {
    invalidateMentions();   // rebuild the mention name list from the CURRENT model each render → seen senders (addThem) are always included (review m1)
    const scrollWasAtBottom = nearBottom();
    // Build the whole log into a DETACHED fragment, then swap it in with ONE
    // replaceChildren — the live #messages box is NEVER momentarily empty, so a
    // paint can't catch a blank log mid-rebuild (Damir 2026-07-07 flicker). Also
    // removes the boot spinner (it's a child of box) on the first render.
    const frag = document.createDocumentFragment();
    rows.clear();
    /* A1 (#302): the "Show older messages" affordance, above everything else.
       Model-driven, NOT appended imperatively — this fragment replaces the whole
       box below, so a node poked in from outside a render would be destroyed. */
    if (showOlder) frag.append(buildOlderPill());
    /* A1 / D1 (#302): the secure notice marks the START of the conversation
       ("Encrypted… Yours alone"). Pinning it unconditionally was harmless while
       nothing above it contradicted it — with the pill it would assert "this is the
       beginning" directly above a button that loads more of the beginning. So it
       appears only once history is exhausted, which is also the demo contract
       (src/demo/chat.html:436-450) and #91's original intent. */
    if (!showOlder) frag.append(createSecureNotice());
    /* #265 (Damir ③ / C10 FE-side): a FULFILLED payment request is TWO C#
     * messages — the original requestFunds (flips to ":"+txid → Completed) AND
     * a separate sentFunds direct-payment message carrying the SAME txid. One
     * event, ONE card: suppress the direct-payment card when a REQUEST card
     * owns its txid (the request card carries the fuller story — who asked,
     * Completed badge, working Details). Titles matched via the locale-proof
     * carriers; unfulfilled requests (txid="") and standalone direct payments
     * are untouched. The model keeps both recs (updates still land). */
    const requestTxids = new Set();
    for (const oid of order) {
      const r = model.get(oid);
      if (r && r.kind === 'payment' && r.txid && isRequestTitle(r.title)) requestTxids.add(r.txid);
    }
    const ids = !requestTxids.size ? order : order.filter((oid) => {
      const r = model.get(oid);
      return !(r && r.kind === 'payment' && r.txid && !isRequestTitle(r.title) && requestTxids.has(r.txid));
    });
    const pos = positionsFor(ids);
    let lastDay = null;
    for (const id of ids) {
      const rec = model.get(id);
      const day = new Date(rec.ts).toDateString();
      if (day !== lastDay) { frag.append(createDateSeparator(rec.ts)); lastDay = day; }
      // A3: the one-shot unread divider sits under any date separator, above the
      // first still-unread incoming row of this open (scrolls with the content).
      if (id === unreadBoundaryId) frag.append(createUnreadDivider(window.SL || {}));
      const row = buildRow(rec, pos[id]);
      row.dataset.msgid = id;
      rows.set(id, row);
      frag.append(row);
      applyRowReactions(rec, row, false);  // re-attach pills after a rebuild
      wireMenu(rec, row);                  // long-press / right-click context menu
    }
    box.replaceChildren(frag);             // atomic swap — no empty intermediate state
    keepTypingLast();
    if (scrollWasAtBottom) box.scrollTop = box.scrollHeight;
    else applyOlderAnchor();               // A1: hold the reading position across a load-more re-flush
    firstRenderDone = true;                 // boot spinner is now gone
    if (typeof updateMentionFab === 'function') updateMentionFab();  // refresh @ jump FAB (#8)
    // Multi-select: every row node above is BRAND NEW, so the selection (kept by
    // message id) has to be re-painted onto them. refresh() also prunes ids whose
    // rows are gone — a bulk delete therefore empties the selection and the
    // contextual bar closes itself once the last one lands.
    if (chatSelect) chatSelect.refresh();
  }

  /* Render scheduling — two regimes:
   * (1) NORMAL (post-load): coalesce into one animation frame so a burst of
   *     small updates (status ticks, a new message) rebuilds at most once/frame.
   * (2) LOAD BURST: on open C# streams the WHOLE history — clearMessages →
   *     insertMessage×N → onChatScreenLoaded (SingleChatPage.xaml.cs:1110/588).
   *     Each EvaluateJavaScriptAsync runs on a LATER frame, so even the rAF
   *     coalescer rebuilt+swapped the growing log many times as rows streamed
   *     in → the log visibly "filled in" / flickered (Damir 2026-07-07, chats
   *     with history). During a burst we SUPPRESS every render (the model just
   *     accumulates) and paint ONCE at onChatScreenLoaded — so the user sees the
   *     boot spinner, then the finished conversation in a single paint. A
   *     trailing safety timer force-finishes the burst if that signal never
   *     arrives (other loadMessages call sites, robustness). */
  let renderQueued = false;
  let bursting = false;
  let burstSafety = 0;
  let firstRenderDone = false;   // gates the boot spinner → first real paint
  /* A3 — unread divider (one-shot in place, Damir Batch A interview). The id of
   * the FIRST incoming row that arrived read="False" during a LOAD BURST. The
   * signal is real and exactly-once: SingleChatPage pushes the message (:1603)
   * BEFORE updateMessageReadStatus flips message.read (:1661-65), so the open
   * burst carries the boundary once and the next open correctly doesn't. Only
   * burst rows count — a message arriving while the chat is OPEN also pushes
   * read="False" then flips, and would spawn a divider per message. Survives
   * session re-renders/re-flushes (the model keeps the id; re-flushed history
   * arrives read="True" so the boundary is never re-derived); reset per peer in
   * onChatScreenReady; renderLogNow draws it, positionsFor breaks bubble
   * grouping at it.
   *
   * Derivation is gated on `loadPhase && bursting` — BOTH, and each carries half
   * the meaning:
   *   loadPhase — "this is an open/history load, not live traffic". Spans
   *     clearMessages → onChatScreenLoaded with a GENEROUS 5 s safety, because
   *     SingleChatPage's OnAppearing → reloadScreen → loadMessages path and the
   *     bot channel-switch path never push onChatScreenLoaded.
   *   bursting — "rows are still streaming" (the render coalescer's flag, re-armed
   *     by every insert, expiring 250 ms after the last one). Needed because on
   *     those two no-onChatScreenLoaded paths `loadPhase` would otherwise stay
   *     true for the full 5 s window, and a LIVE message arriving inside it would
   *     be latched as "unread" in a chat the user is watching (bot channels are
   *     exactly the high-traffic case).
   * Consequence, deliberately accepted: if the streamed history ever gaps >250 ms
   * (cold start, very long history, slow Android EvaluateJavaScriptAsync) the
   * boundary in the tail rows is not derived → NO divider. That fails safe, in the
   * same direction as the read===undefined guard; the alternative (loadPhase alone)
   * fails LOUD, drawing a false divider over a message the user watched arrive.
   * `boundaryLatched` makes the boundary ONE-SHOT per peer: a later re-flush
   * (accept, channel re-load, updateMessage storm) must never derive a NEW divider.
   * All three reset per peer in onChatScreenReady (and per channel in
   * setSelectedChannel). */
  let unreadBoundaryId = null;
  let loadPhase = false;         // A3: inside the open/load stream (clearMessages → onChatScreenLoaded)
  let boundaryLatched = false;   // A3: the one-shot boundary chance for this peer/channel is spent
  let loadSafety = 0;            // A3: generous fallback if onChatScreenLoaded never arrives
  /* Start the A3 load phase. No-op once the boundary chance is spent (one-shot),
   * so a re-flush cannot re-open derivation. */
  function beginLoadPhase() {
    if (boundaryLatched) return;
    loadPhase = true;
    clearTimeout(loadSafety);
    loadSafety = setTimeout(endLoadPhase, 5000);
  }
  /* End the A3 load phase and spend the one-shot chance. */
  function endLoadPhase() {
    clearTimeout(loadSafety);
    loadSafety = 0;
    loadPhase = false;
    boundaryLatched = true;
  }
  /* Full A3 reset — new peer (onChatScreenReady) or new bot channel
   * (setSelectedChannel, which C# pushes BEFORE its loadMessages()). */
  function resetUnreadBoundary() {
    clearTimeout(loadSafety);
    loadSafety = 0;
    unreadBoundaryId = null;
    loadPhase = false;
    boundaryLatched = false;
  }
  /* ★ N77 (#413, Damir 2026-08-19): MEASURE the community-bot open, do not guess at it.
   *
   * Reported: joining the Spixi group chat takes 10-20 s to load, and entering the chat
   * during that window "prolongs it since it renders each message". The RENDER half of
   * that is already handled — the burst above suppresses every render and paints once —
   * so the cost is somewhere else, and the leading candidate is that opening the chat
   * runs SingleChatPage.OnAppearing -> reloadScreen -> loadMessages, a SECOND full
   * clearMessages -> insertMessage x N flush of the same history while the first is
   * still streaming. Two overlapping flushes, every message its own
   * EvaluateJavaScriptAsync round trip.
   *
   * So count them. Each burst records how many rows arrived and how long it took, and
   * the line reads e.g.
   *     LOAD b1 n=142 in 2180ms | b2 n=142 in 9640ms | total 11.8s
   * TWO bursts with the SAME n is the duplicate-flush answer and needs no new UI at all.
   * ONE burst spanning the whole window means the bot delivery is genuinely that slow,
   * and only then is a "loading" affordance the right thing to build.
   *
   * Dev-mode gated, no storage, no bridge verb, nothing rendered when dev mode is off. */
  const loadProbe = { bursts: [], cur: null, t0: 0 };
  let loadProbeEl = null;
  function loadProbeDev() {
    try { return slCarrier('sl-devmode', 'false') === 'true'; } catch (e) { return false; }
  }
  function loadProbeRender() {
    if (!loadProbeDev()) return;
    try {
      if (!loadProbeEl) {
        loadProbeEl = document.createElement('div');
        loadProbeEl.className = 'load-probe';
        loadProbeEl.setAttribute('aria-hidden', 'true');
        document.body.append(loadProbeEl);
      }
      const nowMs = performance.now();
      const parts = loadProbe.bursts.map((b, i) =>
        'b' + (i + 1) + ' n=' + b.n + ' in '
        + (b.ms === null ? Math.round(nowMs - b.start) + 'ms…' : b.ms + 'ms'));
      const total = loadProbe.t0 ? Math.round(performance.now() - loadProbe.t0) : 0;
      loadProbeEl.textContent = 'LOAD ' + (parts.join(' | ') || '—')   // i18n-lint-ok:dev — engineering instrument, aria-hidden, dev-gated (#301)
        + (total ? ' | total ' + (total / 1000).toFixed(1) + 's' : '');
    } catch (e) { /* a probe must never break the chat */ }
  }
  function loadProbeBurstStart() {
    try {
      const now = performance.now();
      // a burst long after the previous one is a NEW open, not part of the same load
      if (loadProbe.cur && now - loadProbe.cur.start > 30000) { loadProbe.bursts = []; loadProbe.t0 = 0; }
      if (!loadProbe.t0) loadProbe.t0 = now;
      loadProbe.cur = { n: 0, ms: null, start: now };
      loadProbe.bursts.push(loadProbe.cur);
      if (loadProbe.bursts.length > 6) loadProbe.bursts.shift();   // bounded
      loadProbeRender();
    } catch (e) {}
  }
  function loadProbeBurstEnd() {
    try {
      if (loadProbe.cur && loadProbe.cur.ms === null) {
        loadProbe.cur.ms = Math.round(performance.now() - loadProbe.cur.start);
      }
      loadProbeRender();
    } catch (e) {}
  }
  /* ★ #416: repaint while the burst RUNS, throttled. The first cut rendered only at
     burst start and end, so mid-load the line always read `n=0 in …` — useless at
     exactly the moment Damir is looking at it. Throttled to 200 ms because this is the
     hot path being measured: a textContent write per message would pollute the number
     the probe exists to report. */
  let loadProbeLastPaint = 0;
  function loadProbeRow() {
    try {
      if (!loadProbe.cur) return;
      loadProbe.cur.n += 1;
      const now = performance.now();
      if (now - loadProbeLastPaint < 200) return;
      loadProbeLastPaint = now;
      loadProbeRender();
    } catch (e) {}
  }

  function beginBurst() {
    bursting = true;
    loadProbeBurstStart();
    armBurstSafety();
  }
  function armBurstSafety() {
    clearTimeout(burstSafety);
    burstSafety = setTimeout(endBurstAndRender, 250);   // fallback if onChatScreenLoaded is missing
  }
  function endBurstAndRender() {
    clearTimeout(burstSafety);
    if (!bursting) return;
    bursting = false;
    loadProbeBurstEnd();
    renderLogNow();
  }
  function renderLog() {
    if (bursting) { loadProbeRow(); armBurstSafety(); return; }   // suppress during the load burst (★ #413 counts here — every insert calls this)
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderLogNow(); });
  }

  /* ————————————————————————————————————————————————————————————————————————
   * A1 (#302) — "Show older messages".
   *
   * Chat history beyond the last window per channel was unreachable: C# is
   * fully alive (onLoadMore grows the window by Config.messagesToLoad — 25 since
   * #343, and #354 steps over the poisoned exact-100 window — then re-flushes
   * via loadMessages) but nothing in the shell emitted the verb, and
   * clearMessages threw its `showMore` argument away.
   *
   * End-of-history needs NO heuristic — C# already tells us: loadMessages pushes
   * show_more="false" whenever the returned count is below the window (:1536-1537)
   * and on the empty-history path (:1531).
   *
   * The transport is a full teardown + re-add of the whole grown window, which is
   * why this is a BUTTON and not a scroll trigger: infinite scroll on top of a
   * re-flush yanks the page out from under a scrolling user. The proper fix is a
   * prepend + batched push — see docs/chat-transport-spec.md. When that lands the
   * pill is swapped for a scroll sentinel and attachLazyHistory finally gets wired.
   * ———————————————————————————————————————————————————————————————————————— */
  let showOlder = false;         // C# says more history exists
  let loadingOlder = false;      // a loadmore is in flight
  let olderTimeout = 0;          // spinner can't outlive a lost navigation
  let olderAnchorId = null;      // message id that was topmost when the user tapped
  let olderAnchorOffset = 0;     // its offsetTop minus scrollTop, i.e. its screen y
  let olderAnchorRows = 0;       // row count when the anchor was taken
  let olderAnchorUntil = 0;      // hard deadline — the anchor is for THIS re-flush only

  function buildOlderPill() {
    const wrap = document.createElement('div');
    wrap.className = 'chat-older';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chat-older__btn';
    if (loadingOlder) {
      btn.disabled = true;
      // .c-history-loading ships in lazy-history.css, which this shell already
      // links (:61) — the spinner costs no new CSS.
      const sp = document.createElement('span');
      sp.className = 'c-history-loading__spinner';
      sp.setAttribute('aria-hidden', 'true');
      btn.append(sp);
      btn.append(document.createTextNode((window.SL && window.SL.loading) || 'Loading'));
    } else {
      btn.textContent = (window.SL && window.SL.showOlderMessages) || 'Show older messages';
      btn.addEventListener('click', requestOlder);
    }
    wrap.append(btn);
    return wrap;
  }

  function requestOlder() {
    if (loadingOlder) return;   // each tap grows the C# window by Config.messagesToLoad, permanently
    loadingOlder = true;

    /* Take the anchor BEFORE the re-flush. Element+offset, not a scrollHeight
       delta: the delta is a one-shot and the re-flush can paint across SEVERAL
       renders (C# pushes no onChatScreenLoaded after onLoadMore — only the 250 ms
       burst-safety timer ends the burst, so a slow stream ends it early and paints
       in chunks). An element anchor stays correct however many renders it takes. */
    olderAnchorId = order.length ? order[0] : null;
    olderAnchorRows = order.length;
    // The anchor exists to survive a re-flush that may paint across several renders —
    // not to outlive it. Without a deadline it stays armed after the flush settles and
    // the NEXT unrelated render (a peer message arriving while the user reads the newly
    // loaded history) snaps the scroll back to where they tapped (audit MAJOR).
    olderAnchorUntil = Date.now() + 3000;
    const arow = olderAnchorId && rows.get(olderAnchorId);
    olderAnchorOffset = arow ? (arow.offsetTop - box.scrollTop) : 0;

    /* Paint the loading state SYNCHRONOUSLY, in place. It cannot go through
       renderLog(): clearMessages sets bursting=true and renderLog() then returns
       early for the whole round trip, so a re-render here would never paint. */
    const live = box.querySelector('.chat-older');
    if (live) live.replaceWith(buildOlderPill());

    clearTimeout(olderTimeout);
    olderTimeout = setTimeout(() => {     // a lost navigation must not strand the spinner
      loadingOlder = false;
      olderAnchorId = null;
      renderLog();
    }, 8000);

    bridge.send('ixian:loadmore');
  }

  /* Restore the reading position after a load-more re-flush. Re-applied on EVERY
     render until the row count stops growing, because the re-flush may paint in
     more than one pass (see requestOlder). */
  function applyOlderAnchor() {
    if (!olderAnchorId) return;
    if (Date.now() > olderAnchorUntil) { olderAnchorId = null; return; }   // expired — never yank a later render
    const arow = rows.get(olderAnchorId);
    // Anchor row gone (fell out of the window, or suppressed by the payment-dedup
    // filter): disarm rather than leaving it live for an arbitrary future render.
    if (!arow) { olderAnchorId = null; return; }
    box.scrollTop = arow.offsetTop - olderAnchorOffset;
    if (order.length > olderAnchorRows) { olderAnchorRows = order.length; return; }
    olderAnchorId = null;                 // stream settled — stop re-anchoring
  }

  /* Per-peer reset (onChatScreenReady) — a stale spinner or anchor must never ride
     into the next conversation. */
  function resetOlder() {
    clearTimeout(olderTimeout);
    olderTimeout = 0;
    showOlder = false;
    loadingOlder = false;
    olderAnchorId = null;
    olderAnchorRows = 0;
    olderAnchorUntil = 0;
  }

  /* insert (or move) an id into `order` keeping timestamp-ascending; stable for
   * equal timestamps (append after equals → matches arrival order). */
  function orderInsert(id) {
    order = order.filter((x) => x !== id);
    const ts = model.get(id).ts;
    let i = order.length;
    while (i > 0 && model.get(order[i - 1]).ts > ts) i--;
    order.splice(i, 0, id);
  }

  /* UPSERT a text row. flags = { sent, confirmed, read, paid, errorSending }. */
  function upsertText(id, text, direction, ts, flags, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'text', direction, senderNick: '', senderAddress: '' };
    if (text !== undefined && text !== null) {
      rec.text = String(text);
      // #264 ⑤: recompute on every text change (updateMessage edits included) —
      // an accepted-request line renders as a centered event chip, not a bubble.
      rec.eventChip = !!acceptedEventSubject(rec.text);
    }
    if (direction) rec.direction = direction;
    // Q12 (A-3): a robustness-created row carries a WALL-CLOCK ts (tsSynthetic) that C#
    // can never push back. A DIFFERENT ts arriving here is a real C#-pushed one (updateMessage
    // re-passes the existing ts, so it can't clear the flag) → the row is hint-safe again.
    if (ts && rec.tsSynthetic && ts !== rec.ts) rec.tsSynthetic = false;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
      if (extra.avatar !== undefined) rec.avatar = extra.avatar || null;
      // D-5/N26 (#366): per-sender relation (validated in addThem; '' = unknown)
      if (extra.relation !== undefined) rec.relation = extra.relation || '';
      // M1 (#441): the reply TARGET id (hex). Only ever SET, never cleared by a
      // later status push that omits it — updateMessage carries no reply arg.
      if (extra.replyTo !== undefined && extra.replyTo) rec.replyTo = String(extra.replyTo);
    }
    rec.status = statusFrom(flags || {});
    /* A2 (#302): the paid marker. `paid` has always been PASSED (addMe/addThem
       both carry it, xaml.cs:1361-1364 sets it from transactionId != "") and then
       silently dropped — statusFrom never read it and nothing persisted it. Keep it
       on the record so the bubble can render it.
       ⚠ VERIFY-FIRST (#215): transactionId is assigned inside Ixian-Core, which is
       outside this repo, so it is UNVERIFIED that an outgoing text to a paid bot
       actually carries one. Legacy shipped the glyph (js/chat.js:773), which is
       circumstantial. If the F5 on a real paid bot shows no marker, this is dead
       code, not a bug — see the F5 checklist. */
    const paidBefore = !!rec.paid;
    if (flags && flags.paid !== undefined) rec.paid = asBool(flags.paid);
    model.set(id, rec);
    orderInsert(id);
    hideTyping();  // any new/updated message clears the typing pill (legacy addText → hideUserTyping)
    noteArrival(existing, rec);   // N53: count a live arrival while scrolled up (pre-render read)

    if (!existing) {
      renderLog();  // new row → re-render so grouping + date separators are correct
      return;
    }
    // status-only update on an existing SENT row → surgical tick (no flicker).
    // failed restructures the row, so re-render instead.
    // A2: a `paid` FLIP must escape the surgical path — transactionId can land after
    // send (updateMessage, :2320), and the tick-only updater would never paint the
    // wallet glyph. Keyed on the flag CHANGING, so ordinary status pushes on an
    // already-paid row stay surgical and don't force a full re-render.
    if (rec.direction === 'sent' && rec.status !== 'failed' && !!rec.paid === paidBefore) {
      const row = rows.get(id);
      if (row) { setMessageStatus(row, rec.status); return; }
    }
    renderLog();
  }

  /* CREATE a file transfer row (legacy addFile). Keyed by message id like text
   * rows; fileIndex maps the transfer's fileid → this id so updateFile finds it. */
  function upsertFile(id, ts, dir, fileid, name, fstate, progress, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'file', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'file';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (fileid != null) { rec.fileid = String(fileid); fileIndex.set(String(fileid), id); }
    if (name != null) rec.name = String(name);
    rec.fstate = fstate;
    rec.progress = Number(progress) || 0;
    if (extra) {
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    noteArrival(existing, rec);   // N53: count a live arrival while scrolled up (pre-render read)
    renderLog();
  }

  /* CREATE an app invite/session row (legacy addAppRequest). Static once added
   * (no updateApp verb). appid drives joinApp; appInstallURL drives installApp. */
  function upsertApp(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'app', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'app';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.appid !== undefined) rec.appid = extra.appid;
      if (extra.name !== undefined) rec.name = extra.name || '';
      if (extra.iconUrl !== undefined) rec.iconUrl = extra.iconUrl || null;
      if (extra.astate !== undefined) rec.astate = extra.astate;
      if (extra.appInstallURL !== undefined) rec.appInstallURL = extra.appInstallURL || '';
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    noteArrival(existing, rec);   // N53: count a live arrival while scrolled up (pre-render read)
    renderLog();
  }

  /* CREATE/UPSERT a payment card (legacy addPaymentRequest). extra carries the
   * verbatim title, amount, status enum (from status_icon), txid, enableView. */
  function upsertPayment(id, ts, dir, extra) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'payment', direction: dir, senderNick: '', senderAddress: '' };
    rec.kind = 'payment';
    if (dir) rec.direction = dir;
    if (ts) rec.ts = ts;
    if (extra) {
      if (extra.title !== undefined) rec.title = extra.title || '';
      if (extra.amount !== undefined) rec.amount = extra.amount;
      if (extra.pstatus !== undefined) rec.pstatus = extra.pstatus;
      if (extra.txid !== undefined) {
        rec.txid = extra.txid || '';
        // #265 (Opus MINOR-8): a fulfilled request has TWO recs on the same txid (the
        // request card + the suppressed direct-payment card). The txid must resolve to
        // the card the user actually SEES — the REQUEST — or updateTransactionStatus
        // would patch the hidden rec and leave the visible one stale.
        if (rec.txid) {
          const owner = txIndex.get(rec.txid);
          const ownerRec = owner ? model.get(owner) : null;
          const ownerIsRequest = !!(ownerRec && isRequestTitle(ownerRec.title));
          if (!ownerIsRequest || isRequestTitle(rec.title)) txIndex.set(rec.txid, id);
        }
      }
      if (extra.enableView !== undefined) rec.enableView = extra.enableView;
      if (extra.senderNick !== undefined) rec.senderNick = extra.senderNick || '';
      if (extra.senderAddress !== undefined) rec.senderAddress = extra.senderAddress || '';
    }
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    noteArrival(existing, rec);   // N53: count a live arrival while scrolled up (pre-render read)
    renderLog();
  }

  /* CREATE a call event row (legacy addCall). missed = the bridge `declined`
   * flag (rang out / no answer); label = the C#-localized wording verbatim;
   * duration is a preformatted "m:ss" or empty. */
  function upsertCall(id, ts, missed, label, duration, outgoing, declinedLocal) {
    id = String(id);
    const existing = model.get(id);
    const rec = existing || { id, kind: 'call' };
    rec.kind = 'call';
    if (ts) rec.ts = ts;
    rec.missed = !!missed;
    rec.label = label || '';
    rec.duration = duration || '';
    // C4: card side from message.localSender; undefined (old exe) keeps the
    // pre-C4 received-side default.
    if (outgoing !== undefined) rec.direction = outgoing ? 'sent' : 'received';
    // #572 ④: the user declined this call. Undefined (old exe) leaves the flag off.
    if (declinedLocal !== undefined) rec.declinedLocal = !!declinedLocal;
    model.set(id, rec);
    orderInsert(id);
    hideTyping();
    noteArrival(existing, rec);   // N53: count a live arrival while scrolled up (pre-render read)
    renderLog();
  }

  /* Q4-③ (#270): the Batch-A call-ui glue is GONE — calls (ring + bar) present
   * on the ONE native CallPage surface spanning every pane; C# pushes identity
   * from the Friend, so the shell roster resolve is obsolete. No call push
   * reaches this WebView anymore. */

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers — every one a page global (via bridge.exposeAll),
   * because executeUiCommand(fnRef, …) resolves fnRef as a bare page-global.
   * The 1:1 text path is wired; the rest are safe no-op stubs.
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    /* ——— header + mode (wired) ——————————————————————————————————————————— */

    // setChatMode(type, cost, costText, admin, botDescription, notificationsString, blindString)
    // type: 0 = 1:1, 1 = private group, 2 = blind group, 3 = bot (chat.js:152).
    // Arg 5 is a legacy MISNOMER kept for shape parity: C# passes
    // friend.metaData.botInfo.serverDescription into it (xaml.cs:612). There is no
    // separate "botDescription" anywhere in either tree.
    // Arg 7 (W8, #348) is ADDITIVE and may be absent: the 1:1 push is 4-arg
    // (xaml.cs:675) and an older C# sends 6. Missing → false, which is correct for
    // every case it can be missing in.
    setChatMode(type, cost, costText, admin, botDescription, notificationsString, blindString) {
      const t = Number(type) || 0;
      mode.type = t;
      mode.isBot = (t === 3);
      /* W8 (#348): blindness is its own signal, because the TYPE cannot carry it.
         Type 2 is a blind GROUP, but a bot is type 3 whether or not it hides
         participant addresses — so `type !== 2` was never a complete blind test.
         Anything that needs a real sender identity must gate on mode.blind. */
      /* ★★ #613 (Damir, 2026-08-27): BLINDNESS IS A GROUP PROPERTY, and a bot room is
         not a group. #348 made this line read the raw `hideParticipantAddresses` for any
         type, so a PUBLIC bot channel inherited a private group's mask: "Hidden member"
         on every post, no member sheet, no owner chip, and kick / ban / add-contact all
         structurally dead because the address had been replaced with [Unknown].
         Legacy could not do that — every mask it applies is qualified on
         `FriendType.Group` — and legacy is the reference Damir named.
         C# now sends the qualified answer (Utils.hidesParticipants), and this line says
         the same thing independently so that neither end alone can bring it back. A
         blind GROUP is chat_type 2 by construction (SingleChatPage: the flag is what
         chooses 2 over 1), so `t === 2` is the whole of it; the second arm is belt for
         an exe that numbers types differently. */
      /* ★★ #613 round 2 (adversarial review, HIGH-1). ONE wire value, TWO questions,
         and conflating them is what the first cut got wrong.

         `hidesAddresses` is the RAW flag: it answers "can this room's participants be
         PAID or ADDED?", and the answer is C#'s — a blind group pays a DERIVED address,
         and nothing in the tree says whether a flagged bot room's roster addresses are
         real or derived. Anything that spends money or creates a contact must gate on
         THIS, or the shell offers a button C# will refuse (#215).

         `blind` is the IDENTITY question: "must this room's participants be MASKED?"
         That is a GROUP privacy mode — legacy qualifies every mask it applies on
         FriendType.Group, so a bot room is never masked, and a public channel showing
         "Hidden member" was the regression this batch exists to fix. */
      mode.hidesAddresses = asBool(blindString);
      mode.blind = (t === 2) || (t === 1 && mode.hidesAddresses);
      // ★ review MINOR-7: did this exe actually TELL us? A 6-arg push leaves blindString
      // undefined, and "undefined" is not "not blind" for a bot — it is "unknown".
      mode.blindKnown = (t !== 3) || (blindString !== undefined);
      // isMulti = shows per-sender labels + avatars: private/blind GROUPS *and*
      // BOT channels (Damir F5: bot-group messages showed no nick/avatar because
      // bots are type 3). Legacy set the sender for `friend.bot || Group`
      // (SingleChatPage:1222). Group-only logic uses mode.type===1 directly.
      mode.isMulti = (t === 1 || t === 2 || t === 3);
      mode.admin = asBool(admin);
      /* ★★ L2 (#641) — THE ROSTER IS PULLED AT CHAT OPEN FOR A PRIVATE GROUP.
       *
       * ⚠ The first cut of the delivery detail read `groupRoster` for its denominator, and
       * that map had exactly ONE writer: the addContact push, which only ever fires from
       * openChatInfo(). So the detail was EMPTY until the user independently opened Group
       * info — and the bubble had already lost its read tick. The "no roster, no line"
       * degrade was not an edge case, it was the default state.
       *
       * ⚠ PRIVATE AND BLIND GROUPS ONLY (t 1 and 2), never a bot room. loadContacts walks
       * the whole roster synchronously on the UI thread, and a public bot channel holds up
       * to 500 members — that is the #619 freeze, which cost this project a batch. A bot
       * room needs no denominator anyway: it answers "Delivered" or nothing.
       * Idempotent: openChatInfo clears and re-requests, so this only front-loads it. */
      if ((t === 1 || t === 2) && !groupRoster.size) {
        try { bridge.send('ixian:loadContacts'); } catch (e) { /* roster is best-effort */ }
      }
      // notificationsString "True"/"False" (groups/bots) — current mute state for
      // the chat-info notifications toggle (legacy chat.js:237).
      mode.notifications = asBool(notificationsString);

      /* A2 (#302): paid-bot cost disclosure. Gate on the NUMERIC cost, never on
         costText being non-empty — the chat_type>0 branch covers groups as well as
         bots and always formats a sentence, so a free group arrives carrying
         "Sending messages costs 0.00000000 IXI per kB" (xaml.cs:610). C# gates its
         own spend the same way (botInfo.cost > 0, :754).
         Unparseable → SHOW. This is money-adjacent disclosure: failing towards the
         warning is the safe direction. Display only — legacy did not gate send
         either (it disclosed, it did not block), and nothing here touches the money
         path. */
      const costNum = parseFloat(String(cost == null ? '' : cost).replace(',', '.'));
      const showCost = !!costText && (isNaN(costNum) || costNum > 0);
      mode.costText = showCost ? String(costText) : '';
      if (composerEl) setComposerCost(composerEl, mode.costText || null, window.SL || {});

      /* A6 (#302): bot/server description. Damir confirmed only bot servers set
         one, so the bot-owned channel panel is the complete surface (a plain group
         never carries a description, and never gets a channel selector anyway).
         textContent + a length clamp on render: this string comes from a REMOTE bot
         server. Legacy assigned it with innerHTML (js/chat.js:245) — remote HTML
         injection straight into the chat WebView. That is a legacy vuln this
         redesign closes; logged in the security review. */
      mode.description = String(botDescription == null ? '' : botDescription).trim().slice(0, DESCRIPTION_MAX);

         attach gates read the 1:1 defaults and offer nothing. This is the ONE writer of
         the room answer, and it records WHICH peer the answer describes, so the answer
         cannot survive into another peer.
         ⚠ Delete this line and `modeKnown()` is false for the whole session: no ⊕, no
         Pay, no Request, no App invite and no Send file, in every room. That direction
         is SAFE — the shell offers nothing it cannot deliver — but it is a total loss of
         the affordance, and nothing in the suite reads this line (round 3, surviving
         mutation Y1). It needs a pin.

         bridge.exposeAll. Do not add a syncAttachAffordance() call here. */
      mode.answeredFor = identity.address;

      if (chatInfoOpen) refreshChatInfo();
      // channel UI is bot-gated (channel-as-title) — re-evaluate on any mode change
      renderTopbar();
      dbg('setChatMode', { type: t, cost, showCost, admin: mode.admin, notificationsString });
    },

    setNickname(nick) {

    // was English-shaped and left the dot dead in es/fr/ru/sl/sr).
    setOnlineStatus(status) {

      // (carrier-matched, locale-proof) arrives BEFORE the load burst for both
      // pending states → early generic lock; any OTHER presence text while the
      // generic/incoming lock holds means the state left pending (e.g. accepted
      // from the chats-list card on desktop) → unlock. The 'outgoing' lock is
      // NEVER cleared here — its explicit unlock is showRequestSentModal("0").
      // Q1 review (#267 loop): (1) `!requestResolved` — the heartbeat keeps
      // ticking at 1 Hz until C#'s next updateScreen, so an accepted request must
      // not be re-locked behind the user's back. (2) `!mode.isMulti` — the waiting
      // branch is the `else` of `if (friend.bot)` (xaml:1873-1909), so it also
      // covers GROUPS: a non-approved group would take the lock with NO strip
      // ('outgoing'-only) and NO request pane (a group has no requestAdd message)
      // = a chat you can't type in with zero affordance. setChatMode (xaml:600-636)
      // lands before the first updateScreen (:644), so `mode` is already known.
      if ((status || '') === WAITING_RESPONSE_TEXT) {
        if (!composerLock && !requestResolved && !mode.isMulti) setComposerLock('incoming');

    // Batch reset. showMore ("true"/"false") = whether a "load older" affordance
    // belongs at the top; v1 just resets the model (loadmore is a stub verb).
    clearMessages(showMore) {
      model.clear();
      rows.clear();
      fileIndex.clear();
      txIndex.clear();

      // while the heart+count survive (Damir 2026-07-07). myLikes is (re)loaded
      // per-peer from storage in onChatScreenReady; peer-switch resets it there.
      // Q1 review (#267 loop): a re-flush drops the pane; a STILL-pending peer
      // re-arms it via its own showContactRequest push (accept no longer relies
      // on this path — C# doesn't re-flush on accept; see markRequestResolved).
      // #283-fix re-review R2: EXCEPT while the 'incoming' lock holds — the empty
      // reload after a history wipe (clearMessages, zero rows) has no requestAdd
      // left to re-arm from, and dropping the pane then leaves a locked chat with
      // no Accept/Decline affordance. markRequestResolved still drops it on accept.
      if (composerLock !== 'incoming') removeRequestPane();

      hideTyping();
      typingRow = null;

      // suppress renders until onChatScreenLoaded so the whole history paints once
      // (no flicker). We do NOT render here: the boot spinner (or the prior log)
      // stays until the burst finishes, avoiding a blank/notice flash.
      beginBurst();
      // A3: clearMessages also marks the START of the load phase the unread
      // boundary is derived from. loadPhase is its OWN flag (the render burst's
      // 250 ms expiry must not decide "is this an open load"), but derivation
      // requires loadPhase && bursting — see the A3 docblock.
      beginLoadPhase();

      /* A1 (#302): consume `showMore` instead of discarding it. C# sends the string
         "true"/"false" (loadMessages :1246-1251, and "false" on the empty-history
         path :1243) — this IS the end-of-history signal, so the pill hides itself
         when there is nothing left to fetch. Strict string test: an older C# exe
         that omits the argument leaves it undefined → no pill, which fails safe. */
      showOlder = (String(showMore) === 'true');
      if (loadingOlder) {                 // the re-flush answering our loadmore landed
        clearTimeout(olderTimeout);
        olderTimeout = 0;
        loadingOlder = false;
      }

      stlFlushQuietUntil = Date.now() + 5000;   // #376 loop B-1: open the N53 quiet window (see noteArrival)

      dbg('clearMessages', { showMore, showOlder });
    },

    // TEXT create — own message. 12-arg legacy addMe shape (xaml.cs:1460).
    addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending, relation, replyTo) {

      // now sends on BOTH prefixes (one sendUiCommand). addMe declared 11 params
      // and would otherwise silently discard the reply target on own messages —
      // which is precisely the sender-persistence case that killed C8 (#215).
      upsertText(id, text, 'sent', toMs(time),
        { sent, confirmed, read, paid, errorSending },
        { avatar: resolveAvatar(avatar), replyTo: replyTo || '' });
    },

    // TEXT create — incoming message. C# pushes the FULL 11-arg shape for both
    // prefixes (one sendUiCommand, xaml.cs:1603) — the old 6-param declaration
    // silently DISCARDED the trailing sent/confirmed/read/paid/errorSending
    // (legacy did the same; roadmap M15's "no read-boundary signal" was wrong).
    // Ticks still aren't rendered for received rows — `read` is accepted ONLY to
    // derive the A3 unread boundary from the open burst.
    // D-5/N26 (#366): trailing `relation` ('contact'|'pending'|'none'|'self'|'')
    // — an old C# exe leaves it undefined → the sheet falls back to 'none'.
    addThem(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending, relation, replyTo) {
      const av = resolveAvatar(avatar);
      // A3: first LOAD-PHASE row still unread when the chat opened = the boundary.
      // Exactly-once by C# ordering (push precedes the read flip, :1603/:1661) and
      // by `boundaryLatched` (one-shot per peer/channel). STRICT string test: an old
      // C# exe pushing the 6-arg shape leaves `read === undefined` → fails safe to
      // "no divider" rather than dividing on every row.
      // `bursting` is ANDed in deliberately: a bot CHANNEL SWITCH re-opens the load
      // phase but C# never pushes onChatScreenLoaded on that path (it lives only in
      // onLoad), so loadPhase would stay true for the whole 5s safety window — a LIVE
      // message arriving inside it would be latched as "unread" in an open chat.
      // loadPhase = "this is an open/history load"; bursting = "rows are still
      // streaming" (re-armed by every insert, expires 250ms after the last one).
      if (loadPhase && bursting && !boundaryLatched && unreadBoundaryId === null && read === 'False') {
        unreadBoundaryId = String(id);
      }
      upsertText(id, text, 'received', toMs(time), { paid },
        { senderNick: resolveNick(address, nick), senderAddress: address || '', avatar: av,
          relation: RELATIONS.has(relation) ? relation : '',
          replyTo: replyTo || '' });   // M1 (#441)
      // 1:1 topbar fallback: if setAvatar (onLoad, X1) hasn't landed a header avatar yet,
      // scavenge it from the peer's first message (1:1/bot only — groups get the group
      // avatar via setAvatar). Guarded on !identity.avatar so setAvatar always wins.
      if (av && !mode.isMulti && !identity.avatar) { identity.avatar = av; renderTopbar(); }
    },

    // TEXT status UPSERT (chat.js:1035, xaml.cs:1624). Update the row's status
    // (and text) if it exists; create it if not (robustness — the legacy handler
    // only updated, but C# may updateMessage a row this shell hasn't seen yet).
    // NOTE: `sent` here is the DELIVERY flag (message.sent, xaml.cs:1646), NOT
    // direction — a status tick must NEVER flip an existing row's side (own group
    // messages flipped to 'received' while delivery lagged, Damir F5 2026-07-08).
    // Only a robustness-create of an unseen row uses it as a best-guess direction.
    updateMessage(id, message, sent, confirmed, read, paid, errorSending) {
      const key = String(id);
      const existing = model.get(key);
      const dir = existing ? undefined : (asBool(sent) ? 'sent' : 'received');
      upsertText(key, message, dir, existing ? existing.ts : Date.now(),
        { sent, confirmed, read, paid, errorSending });
      // Q12 (A-3): the robustness-create above stamps a WALL-CLOCK ts C# can never
      // push back as a lastMessage ts → an exdel hint built on it could never expire.
      // Mark the row so writeExdelHint fails safe (writes nothing) if it's later
      // deleted as the tail.
      if (!existing) { const fresh = model.get(key); if (fresh) fresh.tsSynthetic = true; }
    },


    /* Round 2 (DECISIONS #222/#224): live re-theme push from C#. C#-RESOLVED name —
     * never re-derive 'auto' from matchMedia here (the WebView's prefers-color-scheme
     * can disagree with the app theme; Damir F5).

     * ★ N71 (#421): swap body SHARED (theme-runtime.js), transitions suppressed across
     * it (#53). ⚠ This migration was applied, then silently REVERTED by a later
     * comment cleanup in the same session, and the break-my-verdict reviewer caught
     * both the drift AND the reason the pin missed it — the pin matched a substring
     * that the hand-rolled copy also satisfied. The pin now asserts the CALL SHAPE.
     *
     * The onApplied hook is this shell's own and is not optional: the W5 flow canvas
     * reads its ink from computed style each frame, so a RUNNING loop re-themes
     * itself — but under prefers-reduced-motion there is no loop (one static frame),
     * so the repaint has to be pushed explicitly. The pattern INTENSITY no longer
     * needs it (★ N81: CSS resolves the per-theme alpha). */
    setTheme(name) { applyPushedTheme(name, { onApplied: () => applyPatternPrefs(readPatternPrefs()) }); },

    // C13: the LOCAL user's own nick (SingleChatPage.onLoad). Lets the shell identify
    // "me" for self-mention emphasis + the @ jump-to-mention FAB. Refresh the memoized
    // mention context + the FAB so an already-rendered log re-evaluates its self-mentions.
    setSelfNick(nick) {
      selfNickPushed = nick ? String(nick) : '';
      invalidateMentions();
      if (typeof updateMentionFab === 'function') updateMentionFab();
    },

    // Remove a row and re-render so #63 grouping repairs around the gap. C# pushes
    // the SAME command for a local menu delete and a remote (peer-initiated) one —
    // the row goes either way; only the Q12 hint is latched to local deletes (A-1).
    deleteMessage(id) {
      id = String(id);
      const rec = model.get(id);
      const localDelete = pendingLocalDeletes.delete(id);   // consume the latch (this is the only ack)
      if (!rec) { dbg('deleteMessage: unknown', id); return; }
      const wasTail = order.length > 0 && order[order.length - 1] === id;   // Q12: was this the last message?
      if (rec.kind === 'file' && rec.fileid) fileIndex.delete(rec.fileid);
      if (rec.kind === 'payment' && rec.txid) txIndex.delete(rec.txid);
      // A3: deleting the boundary row would leave the id pointing at a dead row →
      // the divider silently vanishes for the session and can't be re-derived (the
      // latch is spent). Re-anchor onto the next RECEIVED row (skipping own rows —
      // "Unread messages" above your own bubble would be nonsense); none → drop it.
      if (id === unreadBoundaryId) {
        unreadBoundaryId = null;
        const bi = order.indexOf(id);
        for (let k = bi + 1; bi >= 0 && k < order.length; k++) {
          const nx = model.get(order[k]);
          if (nx && nx.direction === 'received') { unreadBoundaryId = order[k]; break; }
        }
      }
      model.delete(id);
      order = order.filter((x) => x !== id);
      writeExdelHint(rec, wasTail && localDelete);   // after removal — the order tail IS the new last message
      renderLog();
    },

    // Peer is typing — show the pill briefly (auto-hides after 5s).
    showUserTyping() { showTyping(); },

    // Clear the composer input (C# echoes this after a successful send).
    clearInput() { if (composerEl) clearComposer(composerEl); },

    /* ——— lifecycle acks (minimal) ———————————————————————————————————————— */

    // C#→JS acks. onChatScreenReady carries the peer address; store it so the
    // avatar hue is identity-stable even before setNickname lands.
    onChatScreenReady(address) {
      exitChatSelect();                    // per-peer reset: a selection (and its contextual
                                           // topbar) must never survive into another conversation
      closeSendTakeover();                 // round-2 MINOR: an open money cover must not strand into peer B
      closePayReview();                    // loop r1 B-3 (Batch W): the request-in review sheet sweeps with the compose
      identity.address = address || '';
      identity.avatar = null;              // per-peer reset (desktop reparent); setAvatar (onLoad) re-sets it
      if (!identity.name) renderTopbar();
      maybeRestoreDraft();                 // address known → bring back any saved draft (CH7)
      loadLikes();                         // address known → restore my own-reaction state (per-peer)
      loadLoadedMedia();                   // restore which remote media the user loaded (per-peer)
      loadDeclinedApps();                  // restore which app invites the user declined (per-peer, C7)
      loadCanceledApps();                  // ★ B2: …and which own invites they canceled
      pendingLocalDeletes.clear();         // Q12 per-peer reset: a never-echoed local delete (e.g. the bot
                                           // branch, SingleChatPage:1152 gates on !friend.bot) must not leak
                                           // its id into the next peer and mis-latch a remote delete there
      groupRoster.clear();                 // per-peer reset: don't leak peer A's roster into B (desktop reparent)
      groupNicks.clear();                  // per-peer reset (repopulated by this peer's updateGroupChatNicks burst)
      groupOwner = '';                     // #248 per-peer reset (re-pushed by this peer's setGroupOwner)
      requestedMembers.clear();            // #366 per-peer reset: A's in-flight member requests must not
                                           //    paint 'pending' on B's members (desktop reparent reuse)
      removeRequestPane();                 // ⑪ per-peer reset: peer A's request pane must not survive into B
      setComposerLock(null);               // ⑪ per-peer reset: this peer's pending state re-locks via its own
                                           //    pushes (setOnlineStatus waiting / showRequestSentModal / showContactRequest)
      requestResolved = false;             // Q1 review (#267 loop): the accept latch is per-peer/page-load — a
                                           //    re-opened, still-pending chat must re-lock from its own pushes
      callVisible = false;                 // Q1 review (#267 loop): the last per-peer flag missing from this block —
                                           //    fail-safe, so a call action can't leak into a pending peer on reuse
      // connectivitySub is intentionally NOT reset here (audit A-3): network
      // state is page-global, and C#'s warningDisplayed flag persists across
      // peers on this page instance — it won't re-push until the state CHANGES,
      // so clearing it here would desync a still-connecting topbar.
      invalidateMentions();                // per-peer reset of the mention name list
      resetMentionTracking();              // per-peer reset of the @ jump-to-mention seen/baseline state (#8)
      resetUnreadBoundary();               // A3 per-peer reset (id + loadPhase + boundaryLatched + safety timer)
                                           // — the next open re-derives (or, normally, doesn't)
      resetOlder();                        // A1 per-peer reset — no stale spinner or scroll anchor
      setStlUnread(0);                     // N53 per-peer reset — peer A's unseen count must not badge peer B
      /* ★ per-peer handling of THE ROOM-ANSWER LATCH. This push always precedes this
         peer's setChatMode (SingleChatPage.xaml.cs:626 before :771 / :804).
         ⚠ THIS LINE IS NOT THE CROSS-PEER GUARANTEE. `modeKnown()` compares
         `mode.answeredFor` with `identity.address`, and this handler set that address to
         THIS peer at the top of the block. So peer B cannot inherit peer A's room type
         even if this line is deleted. Deleting it fails SAFE.
         ★ What it DOES do is answer review QUESTION-1. If setChatMode reaches the
         WebView BEFORE this push — a warm bot room, or a language flip that rebuilds the
         document — the stamp above was made against the empty address. One document
         serves ONE peer (HomePage.xaml.cs:2043 builds a new SingleChatPage per open), so
         an answer stamped before any address describes THIS peer. Adopt it. An answer
         stamped for a DIFFERENT peer is dropped. */
      mode.answeredFor = (mode.answeredFor === '') ? identity.address : null;
      dbg('onChatScreenReady', address);
    },
    // End of the initial load burst (fires after loadMessages, xaml:588) — paint
    // the whole history in ONE render, pin to the bottom, and put the caret in the
    // composer so the user can type immediately without tapping it (Damir).
    /* ★ D-10 (#348 follow-up): setTipResult('1'|'0', body).
       '1' → the sheet morphs and closes; the tip pill lands separately via addReactions.
       '0' → body is rendered INLINE by the sheet's own fail() path. C# composes the body
       because it owns the numbers — per Damir's I-7 ruling, no balance and no headroom
       signal is pushed into this WebView.
       Guarded: a result with no sheet open is dropped, and a second result for the same
       attempt is ignored by the component's one-shot. */
    setTipResult(status, body, msgId) {
      const sl = window.SL || {};
      /* ★ audit: CORRELATE. Neither direction carried an id, so a late answer for tip A
         could resolve a sheet the user had since opened on message B — morphing B green
         on A's result, and dropping B's real answer. An id that does not match the
         pending tip is not ours; leave the pending one alone. */
      if (msgId && tipFor && msgId !== tipFor) return;
      clearTimeout(tipWait);
      const c = tipCtrl;
      const amt = tipAmt;
      tipCtrl = null; tipFor = ''; tipAmt = '';
      if (!c) return;
      /* ★★ V-2 (#46 loop 2026-08-29): TWO new statuses, and both exist because the tip
         now waits on a NATIVE CONFIRM DIALOG.

         'pending' — C# has the tip and the dialog is up. The 12 s backstop was written
         for an exe that never answers; a human reading a dialog is not that, and left
         as it was it would have told the user their tip "may not have been sent" while
         the dialog was still on screen, and then sent it. So the backstop is RE-ARMED at
         120 s, which is the same window SPayments uses to declare a confirm latch stale
         — past it, C# has given up on that confirm too. The controller is NOT resolved.

         'cancel' — the user tapped Cancel. '' reaches the sheet's silent re-enable, the
         same rule the payment review already uses: a tip somebody declined is not a tip
         that failed, and an error line there is a lie about their own decision. */
      if (status === 'pending') {
        tipCtrl = c; tipFor = msgId || tipFor; tipAmt = amt;   // put the pending tip back
        tipWait = setTimeout(() => {
          if (!tipCtrl) return;
          const p = tipCtrl; tipCtrl = null; tipFor = ''; tipAmt = '';
          p.fail(sl.tipNoAnswer || 'No answer from the app. The tip may not have been sent.');
        }, 120000);
        return;
      }
      if (status === 'cancel') { c.fail(''); return; }
      if (status === '1' || status === 1 || status === true) {
        c.done();
        /* ★ audit: RESTATE THE AMOUNT. Removing the native alert also removed the only
           place that said WHAT was paid — the sheet morph reads "Tipped" and the reaction
           pill carries a txid, not a value, so the figure vanished. The toast is the
           shell's own announcement and needs nothing from C#. */
        try {
          showToast({ text: (sl.tipConfirm || 'Tip {a} IXI').replace('{a}', amt), tone: 'success', host: overlayHost, strings: sl });
        } catch (e) { /* the morph already confirmed; a toast failure must not matter */ }
      } else {
        c.fail(body || sl.tipFailed || 'The tip could not be sent. Please try again.');
      }
    },

    /* setCaps('a,b,…') — #242 grammar, first used in this shell for tipResult. C#

       degrades instead of waiting forever. Mutates the bridge's capability object in
       place; bridge.cap() reads the same reference. */
    setCaps(list) {
      String(list || '').split(',').forEach((c) => {
        c = c.trim();
        if (c) bridge.capabilities[c] = true;
      });

      // every handler in this object is wrapped at bridge.exposeAll (X8).
    },

    onChatScreenLoaded() {
      // End the load burst and paint the WHOLE history in ONE render (spinner →
      // conversation, no intermediate empty-notice frame). Always renders (even
      // for an empty chat: shows the secure notice) — not gated on `bursting`.
      bursting = false;
      clearTimeout(burstSafety);
      endLoadPhase();                      // A3: the open stream is over — spend the one-shot boundary chance
      renderLogNow();
      box.scrollTop = box.scrollHeight;
      bootRepin(2000);                     // #334 iOS-62: hold the bottom through late bubble growth (abortable)
      maybeRestoreDraft();                 // fallback if onChatScreenReady didn't carry the address

    },

    hideBackButton() { dbg('hideBackButton'); },     // 2-pane: back owned by host chrome

    /* A3 (#302) — unread messages in OTHER chats, shown on the back button.
     *
     * A DOT, not the count — and that is a correctness decision, not a styling one.
     * Two facts about the push make a number dishonest:
     *   1. It is EDGE-LATCHED. SingleChatPage pushes once per 0↔>0 transition
     *      (`unreadIndicatorDisplayed`, declared :42, reset only in onLoad :639,
     *      used :2039-2052). The number is never updated while it changes, so a
     *      rendered count goes stale the moment a second message lands.
     *   2. The first number INCLUDES the chat you just opened. onLoad calls
     *      updateScreen() (:651) → push; loadMessages(), which zeroes this chat's
     *      unread (:1260-1262), only runs later inside Task.Run (:691). Because of
     *      the latch that first wrong number is usually the only one, and it can
     *      never correct downward until it hits 0.

     * the honest reading of the signal.

     * after loadMessages) — logged for batch B, not faked here. */
    setUnreadIndicator(n) {
