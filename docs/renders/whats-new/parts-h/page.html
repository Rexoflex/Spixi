<title>Spixi Delete Data Icons</title>
<style>
:root { --pg-bg: #f4f5f8; --pg-panel: #fff; --pg-fg: #15171c; --pg-muted: #5b6270; --pg-line: #dfe2e9; --pg-bezel: #1b1e24;
  --pg-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --pg-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pg-bg: #0f1218; --pg-panel: #171b23; --pg-fg: #e8eaf0; --pg-muted: #9aa2b1; --pg-line: #2a303c; --pg-bezel: #000; color-scheme: dark; } }
:root[data-theme="dark"] { --pg-bg: #0f1218; --pg-panel: #171b23; --pg-fg: #e8eaf0; --pg-muted: #9aa2b1; --pg-line: #2a303c; --pg-bezel: #000; color-scheme: dark; }
body { margin: 0; background: var(--pg-bg); color: var(--pg-fg); font: 15px/1.5 var(--pg-sans); }
.page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { margin: 0 0 6px; font-size: 26px; } .lede { margin: 0 0 20px; color: var(--pg-muted); max-width: 80ch; }
.opt { margin: 0 0 34px; } .opt h2 { font-size: 18px; margin: 0 0 4px; } .opt p { margin: 0 0 12px; color: var(--pg-muted); max-width: 80ch; }
.pair { display: flex; flex-wrap: wrap; gap: 22px; }
.ph { width: 360px; max-width: 100%; border-radius: 36px; border: 9px solid var(--pg-bezel); overflow: hidden; background: var(--surface-settings-ground); color: var(--text-neutral-01); font-family: var(--font-primary, system-ui); padding-bottom: 18px; }
.ph__top { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--outline-neutral-01, rgba(127,127,127,.18)); background: var(--surface-topbar, var(--surface-settings-ground)); }
.ph__top b { font-size: 20px; } .ico { display: inline-flex; } .ico svg { width: 100%; height: 100%; }
.ph__top .ico { width: 24px; height: 24px; }
.lab { margin: 18px 22px 8px; font-size: 14px; font-weight: 600; color: var(--text-neutral-02); }
.card { margin: 0 14px; background: var(--surface-settings-card, var(--surface-card)); border-radius: 22px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.row { position: relative; }
.row + .row::before { content: ""; position: absolute; left: 70px; right: 0; top: 0; height: 1px; background: var(--outline-sheet-01, rgba(127,127,127,.14)); }
.tile { flex: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 10px -6px rgba(20,30,80,.5); }
.tile .ico { width: 22px; height: 22px; }
.t-grey { background: linear-gradient(160deg, #8a93a6, #5b6375); }
.t-blue { background: linear-gradient(160deg, #6aa8ff, #2160c2); }
.t-green { background: linear-gradient(160deg, #3cc49a, #0e8164); }
.row .tx { flex: 1; min-width: 0; } .row .tx b { display: block; font-size: 16.5px; font-weight: 600; } .row .tx span { color: var(--text-neutral-02); font-size: 14.5px; }
.row > .ico { width: 20px; height: 20px; color: var(--text-neutral-02); }
.danger .row .tx b { color: var(--text-error, #b42318); } .danger .di { width: 26px; height: 26px; color: var(--text-error, #b42318); flex: none; align-self: flex-start; margin-top: 2px; }
.cap { font: 600 12px/1 var(--pg-mono); color: var(--pg-muted); text-align: center; margin-top: 8px; }
/*@TOKENS@*/
</style>
<div class="page">
  <h1>Spixi Delete Data Icons</h1>
  <p class="lede">Damir 15:30: three identical trash icons on one screen say nothing. Two options. Both give each row its own colour; the danger row stays red and plain.</p>
  <div id="opts"></div>
</div>
<script>
/*@DATA@*/
(function () {
  const S = DD.str, I = DD.icons;
  const ico = (n) => '<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + I[n] + '</svg></span>';
  const OPTS = [
    ['Today', 'For reference: the same trash glyph three times.', ['t-grey', 'trash'], ['t-grey', 'trash'], 'trash'],
    ['A · Show the thing — PICKED (Damir 15:34)', 'The icon names WHAT goes; the title already says "Delete". The iOS / Android storage pattern. All three icons are in our registry today (messages · download · user-circle) — no new export.', ['t-blue', 'messages'], ['t-green', 'download'], 'user-circle'],
    ['B · Show the action', 'Each icon carries its own "x": message-x · folder-x · user-x. Says "remove" twice (icon + title) and needs three new Tabler exports into src/assets/icons.', ['t-blue', 'message-x'], ['t-green', 'folder-x'], 'user-x'],
  ];
  const host = document.getElementById('opts');
  OPTS.forEach(([title, note, r1, r2, dz]) => {
    const sec = document.createElement('section'); sec.className = 'opt';
    sec.innerHTML = '<h2>' + title + '</h2><p>' + note + '</p>';
    const pair = document.createElement('div'); pair.className = 'pair';
    ['light', 'dark'].forEach((t) => {
      const f = document.createElement('figure'); f.style.margin = '0';
      f.innerHTML = '<div class="ph sx" data-sxt="' + t + '"><div class="ph__top">' + ico('arrow-left') + '<b>' + S.title + '</b></div>'
        + '<div class="lab">' + S.free + '</div><div class="card">'
        + '<div class="row"><span class="tile ' + r1[0] + '">' + ico(r1[1]) + '</span><span class="tx"><b>' + S.hist + '</b><span>' + S.histSub + '</span></span>' + ico('chevron-right') + '</div>'
        + '<div class="row"><span class="tile ' + r2[0] + '">' + ico(r2[1]) + '</span><span class="tx"><b>' + S.dl + '</b><span>' + S.dlSub + '</span></span>' + ico('chevron-right') + '</div></div>'
        + '<div class="lab">' + S.danger + '</div><div class="card danger"><div class="row"><span class="di">' + ico(dz) + '</span><span class="tx"><b>' + S.acc + '</b><span>' + S.accSub + '</span></span></div></div></div>'
        + '<figcaption class="cap">' + t + '</figcaption>';
      pair.append(f);
    });
    sec.append(pair); host.append(sec);
  });
})();
</script>
