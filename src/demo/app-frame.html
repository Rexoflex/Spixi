<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spixi app frame — demo</title>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/bottomnav.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/chatlist-item.css">
<link rel="stylesheet" href="../styles/components/chip.css">
<link rel="stylesheet" href="../styles/components/search-field.css">
<link rel="stylesheet" href="../styles/components/badge.css">
<link rel="stylesheet" href="../styles/components/txlist-item.css">
<link rel="stylesheet" href="../styles/components/overlay.css">
<link rel="stylesheet" href="../styles/components/banner.css">
<link rel="stylesheet" href="../styles/components/toast.css">
<link rel="stylesheet" href="../styles/components/callbar.css">
<style>
  /* demo chrome */
  body { padding: var(--spacing-24); }
  .demo-toolbar { display: flex; gap: var(--spacing-12); align-items: center; max-width: 900px; margin: 0 auto var(--spacing-32); }
  .demo-frames { display: flex; gap: var(--spacing-32); flex-wrap: wrap; justify-content: center; }
  .demo-phone {
    width: 419px; height: 860px; display: flex; flex-direction: column;
    border: 1px solid var(--outline-neutral-02); border-radius: var(--radius-32);
    overflow: hidden; background: var(--surface-screen);
    box-shadow: var(--elevation-2); position: relative;
  }
  .demo-caption { text-align: center; margin-top: var(--spacing-12); color: var(--text-neutral-02); font-size: var(--font-size-body-sm); }
  .statusbar {
    height: 44px; flex: none; display: flex; align-items: end; justify-content: space-between;
    padding: 0 var(--spacing-24) var(--spacing-4);
    font-weight: var(--font-weight-bold); font-size: var(--font-size-label-md);
  }

  /* Chats screen */
  .search-wrap { margin: var(--spacing-4) var(--spacing-16) var(--spacing-12); flex: none; }
  .content { flex: 1; display: flex; flex-direction: column; } /* scrolling via .u-scroll (base.css) */
  .fab {
    position: absolute; right: var(--spacing-16); bottom: calc(var(--layout-bar-bottom) + var(--spacing-16));
    width: 56px; height: 56px; border: 0; border-radius: var(--radius-full);
    background: var(--surface-action-default); color: var(--text-neutral-on-action);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--elevation-2); z-index: var(--z-10);
  }
  @media (hover: hover) {
    .fab:hover { background: var(--surface-action-hover); }
  }
  .fab:active { background: var(--surface-action-pressed); }

  /* contact request block (design: tinted, actions row) — becomes a component with contacts shell */
  .contact-request {
    display: flex; gap: var(--spacing-12); padding: var(--spacing-12);
    background: var(--surface-neutral-02); align-items: flex-start;
  }
  .contact-request__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-2); }
  .contact-request__name { font-size: var(--font-size-body-lg); line-height: var(--line-height-body-lg); font-weight: var(--font-weight-semibold); color: var(--text-neutral-01); }
  .contact-request__sub { font-size: var(--font-size-body-md); color: var(--text-neutral-02); }
  .contact-request__actions { display: flex; gap: var(--spacing-8); margin-top: var(--spacing-8); }
  .contact-request__time { font-size: var(--font-size-body-sm); color: var(--text-neutral-02); }

  /* Wallet screen */
  .hero {
    background: var(--gradient-hero-overlay), var(--surface-hero);
    color: var(--text-on-hero);
    padding-bottom: var(--spacing-24);
    border-radius: 0 0 var(--radius-24) var(--radius-24);
    flex: none;
  }
  .hero .statusbar { color: var(--text-on-hero); }
  .hero__title {
    font-family: var(--font-primary); font-weight: var(--font-weight-semibold);
    /* heading-sm: ALL screen titles share one scale (Damir 2026-07-02, #58) */
    font-size: var(--font-size-heading-sm); line-height: var(--line-height-heading-sm);
    letter-spacing: var(--tracking-heading-sm);
    padding: var(--spacing-12) var(--spacing-16) var(--spacing-24);
  }
  .hero__balance { padding-inline: var(--spacing-16); }
  .hero__balance-label { color: var(--text-on-hero-muted); font-size: var(--font-size-body-sm); }
  .hero__amount-row { display: flex; align-items: center; gap: var(--spacing-12); }
  .hero__amount {
    font-family: var(--font-primary); font-weight: var(--font-weight-semibold);
    font-size: var(--font-size-heading-lg); line-height: 1.3;
    letter-spacing: -1px; /* hero-amount tracking (Damir 2026-07-02) */
  }
  .hero__amount .unit { font-size: 0.62em; font-weight: var(--font-weight-bold); }
  .hero__eye { margin-left: auto; background: none; border: 0; color: var(--icon-on-hero); cursor: pointer; padding: var(--spacing-8); border-radius: var(--radius-full); }
  /* sheet action rows (menu-item component pending — demo styling).
     56px rows + body-lg per Damir 2026-07-02: "more substantial, easier to tap" */
  .sheet-item {
    display: flex; align-items: center; gap: var(--spacing-16);
    width: 100%; min-height: 56px;
    padding: var(--spacing-8) var(--spacing-12);
    border: 0; border-radius: var(--radius-12); background: transparent;
    color: var(--text-neutral-01); font-family: var(--font-secondary);
    font-size: var(--font-size-body-lg); line-height: var(--line-height-body-lg);
    cursor: pointer; text-align: start;
  }
  @media (hover: hover) {
    .sheet-item:hover { background: var(--surface-interactive-hover); }
  }
  .sheet-item:active { background: var(--surface-interactive-pressed); }

  /* placeholder hovers until c-icon-button lands;
     guarded per DECISIONS #43 (no sticky hover on touch) */
  @media (hover: hover) {
    .hero__eye:hover, .quick-action:hover .quick-action__circle { background: var(--surface-wash-on-hero); } /* tokenized (Figma mirroring 2026-07-02) */
    .hero__eye:hover { color: var(--text-on-hero-muted); } /* ink steps to the light periwinkle on-hero tint — icon-on-hero is already near-white, so "lighter" = tinted (Damir 2026-07-02, #49) */
    .quick-action--primary:hover .quick-action__circle { background: var(--surface-neutral-01); opacity: 0.9; }
  }
  .hero__fiat { color: var(--text-on-hero-muted); font-size: var(--font-size-body-md); }
  .hero__actions { display: flex; gap: var(--spacing-24); padding: var(--spacing-24) var(--spacing-16) 0; }
  .quick-action { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-8); background: none; border: 0; color: var(--text-on-hero); cursor: pointer; font-size: var(--font-size-label-sm); font-weight: var(--font-weight-semibold); }
  .quick-action__circle {
    width: 56px; height: 56px; border-radius: var(--radius-full);
    display: flex; align-items: center; justify-content: center;
    border: var(--outline-width-1) solid var(--text-on-hero-muted); color: var(--icon-on-hero);
  }
  .quick-action--primary .quick-action__circle {
    background: var(--surface-neutral-01); border-color: transparent; color: var(--icon-action-default);
  }
  .filters { display: flex; align-items: center; gap: var(--spacing-8); padding: var(--spacing-16); flex: none; }
</style>
</head>
<body>
  <div class="demo-toolbar">
    <h1 class="t-heading-md" style="margin-right:auto">App frame</h1>
    <span id="banner-slot"></span>
    <span id="call-slot"></span>
    <span id="theme-slot"></span>
  </div>

  <div class="demo-frames">
    <div>
      <div class="demo-phone">
        <div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▮</span></div>
        <div id="chats-topbar"></div>
        <div class="search-wrap" id="search-slot"></div>
        <div class="content u-scroll" id="chat-list"></div>
        <button class="fab" id="fab" aria-label="New chat"></button>
        <div id="chats-nav"></div>
      </div>
      <div class="demo-caption">Chats — real list primitives, deterministic avatars, live timestamps</div>
    </div>

    <div>
      <div class="demo-phone">
        <div class="hero">
          <div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▮</span></div>
          <div class="hero__title">Wallet</div>
          <div class="hero__balance">
            <div class="hero__balance-label">Available Balance</div>
            <div class="hero__amount-row">
              <div class="hero__amount u-tabular">923,852.00 <span class="unit">IXI</span></div>
              <button class="hero__eye" id="eye" aria-label="Hide balance"></button>
            </div>
            <div class="hero__fiat u-tabular">$1,845.62</div>
          </div>
          <div class="hero__actions">
            <button class="quick-action quick-action--primary"><span class="quick-action__circle" id="qa-send"></span>Send</button>
            <button class="quick-action"><span class="quick-action__circle" id="qa-receive"></span>Receive</button>
            <button class="quick-action"><span class="quick-action__circle" id="qa-scan"></span>Scan</button>
          </div>
        </div>
        <div class="filters" id="wallet-filters" role="group" aria-label="Filter transactions"></div>
        <div class="content u-scroll" id="tx-list"></div>
        <div id="wallet-nav"></div>
      </div>
      <div class="demo-caption">Wallet — hero gradient over surface-hero · quick actions · c-chip filter group</div>
    </div>
  </div>

<script src="../components/icons.iife.js"></script>
<script src="strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="spixi.iife.js"></script>
<script>
  const { createButton, createTopbar, createBottomNav, createChatItem, startTimestampTicker, refreshTimestamps, setNavBadge, createChip, setChipSelected, createSearchField } = window.Spixi;
  const icon = window.SpixiIcons.icon;
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  const themeBtn = createButton({
    // initial label reflects the actual starting theme (OS-dark may already apply)
    label: document.documentElement.dataset.theme === 'dark' ? 'Toggle light' : 'Toggle dark',
    type: 'outline', size: 32,
    onClick: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark';
      // suppress transitions for the swap (#53) — mixed durations flicker otherwise
      root.classList.add('theme-switching');
      root.dataset.theme = dark ? 'light' : 'dark';
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
      themeBtn.querySelector('.c-button__label').textContent = dark ? 'Toggle dark' : 'Toggle light';
    },
  });
  document.getElementById('theme-slot').append(themeBtn);

  document.getElementById('chats-topbar').append(createTopbar({
    variant: 'root', title: 'Spixi', logo: true,
    actions: [{ icon: 'users', label: 'Contacts', onClick: () => {} }],
  }));
  document.getElementById('fab').append(icon('message-plus'));

  // FAB → bottom sheet (replaces toggleAnimatedSlider menus; host = phone frame)
  const { createSheet, openSheet, closeSheet, createModal, openModal } = window.Spixi;
  const chatsPhone = document.getElementById('fab').closest('.demo-phone');
  const sheetItem = (glyph, label) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sheet-item';
    b.append(icon(glyph, { size: 24 }), document.createTextNode(label));
    return b;
  };
  document.getElementById('fab').addEventListener('click', () => {
    const list = document.createElement('div');
    list.append(
      sheetItem('message-plus', 'New chat'),
      sheetItem('users', 'New group'),
      sheetItem('scan', 'Scan QR code'),
    );
    const sheet = createSheet({ title: 'Start', content: list, host: chatsPhone });
    for (const item of list.querySelectorAll('.sheet-item')) {
      item.addEventListener('click', () => {
        closeSheet(sheet);
        // toast demo: transient feedback for an action with no other confirmation (#29)
        showToast({ text: item.textContent + ' — demo only', tone: 'info', host: chatsPhone });
      });
    }
    openSheet(sheet);
  });

  /* —— overlays batch part 2: banner / toast / call bar —— */
  const { createWarningBanner, setWarning, showToast, showCallBar, hideCallBar } = window.Spixi;

  // warning banner mounts once under the top bar; bridge drives it via showWarning(text)
  const warningBanner = createWarningBanner();
  document.getElementById('chats-topbar').append(warningBanner);
  let bannerOn = false;
  document.getElementById('banner-slot').append(createButton({
    label: 'Banner', type: 'outline', size: 32,
    onClick: () => {
      bannerOn = !bannerOn;
      setWarning(warningBanner, bannerOn ? 'Connecting to the Ixian network…' : '');
    },
  }));

  // call bar: pinned above everything (z-60) incl. the fake statusbar — iOS-style
  let callOn = false;
  document.getElementById('call-slot').append(createButton({
    label: 'Call', type: 'outline', size: 32,
    onClick: () => {
      callOn = !callOn;
      if (callOn) {
        showCallBar({
          text: 'Han Solo', startedAt: Date.now() - 83000, host: chatsPhone,
          onReturn: () => showToast({ text: 'Returning to call — demo only', tone: 'info', host: chatsPhone }),
          onHangUp: () => {
            callOn = false;
            hideCallBar(chatsPhone);
            showToast({ text: 'Call ended', tone: 'success', host: chatsPhone });
          },
        });
      } else {
        hideCallBar(chatsPhone);
      }
    },
  }));

  const NAV_ITEMS = [
    { id: 'chats', label: 'Chats', icon: 'messages' },
    { id: 'apps', label: 'Apps', icon: 'apps' },
    { id: 'wallet', label: 'Wallet', icon: 'wallet' },
    { id: 'account', label: 'Account', icon: 'user-circle' },
  ];
  const chatsNav = createBottomNav({ items: NAV_ITEMS, active: 'chats' });
  const walletNav = createBottomNav({ items: NAV_ITEMS, active: 'wallet' });
  document.getElementById('chats-nav').append(chatsNav);
  document.getElementById('wallet-nav').append(walletNav);

  document.getElementById('eye').append(icon('eye-off'));
  document.getElementById('qa-send').append(icon('arrow-up-right'));
  document.getElementById('qa-receive').append(icon('arrow-down-left'));
  document.getElementById('qa-scan').append(icon('scan'));

  // wallet tx rows (mock data mirroring bridge addPaymentActivity; times relative)
  const { createTxItem } = window.Spixi;
  const nowTx = Date.now();
  const TX_ROWS = [
    { direction: 'out', status: 'confirmed', name: 'Han Solo', timestamp: nowTx - 2 * 3600000, amount: '-18,000.00', fiat: '-$30.87' },
    { direction: 'in', status: 'confirmed', name: '425H…5CQen', timestamp: nowTx - 26 * 3600000, amount: '+65,000.00', fiat: '+$100.87' },
    { direction: 'out', status: 'pending', name: 'Han Solo', timestamp: nowTx - 27 * 3600000, amount: '-18,000.00', fiat: '-$30.87' },
    { direction: 'out', status: 'failed', name: 'Han Solo', timestamp: nowTx - 50 * 3600000, amount: '18,000.00', fiat: '$30.87' },
    { direction: 'in', status: 'confirmed', name: 'Baracuda', timestamp: nowTx - 96 * 3600000, amount: '+25.00', fiat: '+$0.04' },
    { direction: 'out', status: 'confirmed', name: 'Martins Obademo', timestamp: nowTx - 30 * 86400000, amount: '-1,250.00', fiat: '-$2.14' },
  ];
  const txList = document.getElementById('tx-list');
  const txEls = TX_ROWS.map((t) => {
    const el = createTxItem(t);
    el.dataset.direction = t.direction; // filter reads the element, not a parallel array
    return el;
  });
  txList.append(...txEls);

  // wallet filter chips — exclusive c-chip group, wired to the tx list
  const applyTxFilter = (label) => {
    for (const el of txEls) {
      el.hidden =
        (label === 'Sent' && el.dataset.direction !== 'out') ||
        (label === 'Received' && el.dataset.direction !== 'in');
    }
  };
  const filterChips = ['All', 'Sent', 'Received'].map((label, i) => {
    const chip = createChip({
      label, selected: i === 0,
      onClick: () => {
        filterChips.forEach((c) => setChipSelected(c, c === chip));
        applyTxFilter(label);
      },
    });
    return chip;
  });
  document.getElementById('wallet-filters').append(...filterChips);

  /* —— chat rows (mock data mirroring "Chats - LM"; times relative so buckets are live) —— */
  const now = Date.now();
  const H = 3600000, D = 86400000;
  const at = (msAgo) => now - msAgo;

  const list = document.getElementById('chat-list');

  const CHAT_ROWS = [
    {
      name: 'Han Solo', address: '4fj2...solo', online: true, pinned: true,
      timestamp: at(2 * H), status: 'read',
      excerpt: { type: 'text', text: 'Chewbacca owes me money..' },
    },
    {
      name: 'Sarah Jo', online: true, timestamp: at(D), status: 'delivered',
      excerpt: { type: 'text', text: 'Coming soon, save me a seat at you…' },
    },
    {
      name: 'John Connor', online: true, timestamp: at(3 * D), unread: 3,
      excerpt: { type: 'file', text: 'Skynet-access-codes.md' },
    },
    {
      name: 'Camping Group Alpha', timestamp: at(3 * D), mention: true,
      excerpt: { type: 'mention', sender: 'Han Solo', text: '@Han I was there just 2 hour…' },
    },
    {
      name: 'Martins Obademo', timestamp: at(3 * D),
      excerpt: { type: 'call', text: 'Voice call' },
    },
    {
      name: 'QWERTZ', online: true, timestamp: at(29 * D), unread: 5, muted: true,
      excerpt: { type: 'call-missed', text: 'Missed voice call' },
    },
    {
      name: 'Baracuda', timestamp: at(29 * D),
      excerpt: { type: 'payment', text: 'Payment request 25 IXI' },
    },
    {
      name: 'London Trip Group', timestamp: at(3 * D),
      excerpt: { type: 'text', text: 'Han Solo was added' },
    },
    {
      name: 'Mexico Trip', timestamp: at(29 * D),
      excerpt: { type: 'typing', text: 'Han Solo is typing...' },
    },
    {
      name: 'Gaucho boy', timestamp: at(29 * D),
      excerpt: { type: 'draft', text: 'I was th' },
    },
    {
      name: 'App boi', timestamp: at(29 * D),
      excerpt: { type: 'app-invite', text: 'Invited you to {app name}' },
    },
    {
      name: '', address: '335Hxq21abcd5OP32', timestamp: at(400 * D), status: 'sent',
      excerpt: { type: 'text', text: 'Address-only contact (older than a year)' },
    },
  ];

  list.append(createChatItem(CHAT_ROWS[0]));

  // contact request block (component lands with the contacts shell)
  const req = document.createElement('div');
  req.className = 'contact-request';
  req.append(window.Spixi.createAvatar({ address: '425Hnq88fnnf5CQen', size: 48 }));
  const reqBody = document.createElement('div');
  reqBody.className = 'contact-request__body';
  // DOM calls, not innerHTML — the name slot holds user data in the real shell
  const reqName = document.createElement('span');
  reqName.className = 'contact-request__name';
  reqName.textContent = '425H…5CQen';
  const reqSub = document.createElement('span');
  reqSub.className = 'contact-request__sub';
  reqSub.textContent = 'Wants to connect';
  reqBody.append(reqName, reqSub);
  const reqActions = document.createElement('div');
  reqActions.className = 'contact-request__actions';
  reqActions.append(
    createButton({
      label: 'Decline', type: 'outline', size: 32,
      onClick: () => openModal(createModal({
        title: 'Decline request?',
        body: '425H…5CQen won’t be notified, and can send another request later.',
        role: 'alertdialog',
        host: chatsPhone,
        actions: [
          { label: 'Cancel', type: 'text', autofocus: true }, // safe action gets focus
          { label: 'Decline', type: 'fill', intent: 'destructive', onClick: () => {} },
        ],
      })),
    }),
    createButton({ label: 'Accept', type: 'fill', size: 32, icon: icon('check', { size: 16 }) }),
  );
  reqBody.append(reqActions);
  req.append(reqBody);
  const reqTime = document.createElement('span');
  reqTime.className = 'contact-request__time u-tabular';
  reqTime.textContent = window.Spixi.formatChatTimestamp(at(2 * H));
  req.append(reqTime);
  list.append(req);

  list.append(...CHAT_ROWS.slice(1).map(createChatItem));

  // Chats tab badge (DECISIONS #42): unread total EXCLUDING muted; a bare
  // mention counts as 1. Mirrors what setUnreadIndicator should deliver.
  const unreadTotal = CHAT_ROWS.reduce(
    (n, c) => n + (c.muted ? 0 : (c.unread || (c.mention ? 1 : 0))), 0);
  setNavBadge(chatsNav, 'chats', unreadTotal);
  setNavBadge(walletNav, 'chats', unreadTotal);

  // c-search-field with live filtering over name + excerpt, matches highlighted
  // (#52; shell will filter its data model instead of the DOM)
  const { setHighlights } = window.Spixi;
  document.getElementById('search-slot').append(createSearchField({
    placeholder: 'Search chats',
    onInput: (q) => {
      const needle = q.trim().toLocaleLowerCase();
      for (const row of list.querySelectorAll('.c-chatlist-item')) {
        const name = row.querySelector('.c-chatlist-item__name');
        const excerpt = row.querySelector('.c-excerpt');
        const hit = needle === '' ||
          name.textContent.toLocaleLowerCase().includes(needle) ||
          (excerpt && excerpt.textContent.toLocaleLowerCase().includes(needle));
        row.hidden = !hit;
        setHighlights(name, hit ? needle : '');
        if (excerpt) setHighlights(excerpt, hit ? needle : '');
      }
    },
  }));

  startTimestampTicker(() => refreshTimestamps(list));
</script>
</body>
</html>
