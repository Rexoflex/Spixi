<head>
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<meta charset="utf-8">

<style>
  /* Paint the screen surface IMMEDIATELY (keyed off the head-top data-theme, so
     there's no light<->dark flip while tokens.css + the ~1MB bundle load). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }

<style>
  /* Production shell: fill the WebView (no demo phone frame). Three internal views
     (chats = tab1, wallet = tab2, apps = tab3) swap client-side; the bottom nav
     pins to the bottom and is shared. Account (tab4) pushes the separate
     SettingsPage; a neutral placeholder view only backstops an unexpected tab4
     selection so the screen never goes blank. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  #chat-scroll, #wallet-scroll, #apps-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* selected tx row (two-pane selectTx) — mirrors the chats-list selected treatment */
  .c-txlist-item[aria-current="true"] { background: var(--surface-interactive-selected); }
  /* Explore banner is VISIBLE (fix #7) → opens apps.spixi.io in the external browser
     via ixian:spixiAppsLink (HomePage:278, Browser.OpenAsync — does NOT navigate this
     WebView away). No CSS hide anymore. The per-row ⋮ menu is likewise gone: the
     component only builds it when onMenu is passed, and the apps tab passes appMenu:false
     + no onMenu, so no dead/focusable control renders (was CSS-hidden pre-#184). */
  /* placeholder view (apps/account WIP) */
  #placeholder-view { align-items: center; justify-content: center; text-align: center; padding: var(--spacing-24); }
  .placeholder__title { color: var(--text-neutral-01); margin-bottom: var(--spacing-8); }
  .placeholder__note { color: var(--text-neutral-02); max-width: 32ch; }
  /* FAB — overlays the scroll region, sits above the bottom nav */
  .fab {
    position: fixed; right: var(--spacing-16); bottom: calc(var(--layout-bar-bottom) + var(--spacing-16));
    width: 56px; height: 56px; border: 0; border-radius: var(--radius-full);
    background: var(--surface-action-default); color: var(--text-neutral-on-action);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--elevation-2); z-index: var(--z-10);
  }
  @media (hover: hover) { .fab:hover { background: var(--surface-action-hover); } }
  .fab:active { background: var(--surface-action-pressed); }
  /* Contacts takeover — full-viewport cover mounted OVER the shell (FAB picker +
     topbar directory). Mirrors chat.html .chat-info-takeover: z-30 sits above the
     bars but below any sheet/modal it spawns; the c-contacts panel is height:100%
     → fills this. Closed via its own back button, never an ixian: nav verb. */
  .contacts-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .contacts-takeover > .c-contacts { flex: 1; min-height: 0; }
  /* Wallet Receive/Send takeover — full-viewport cover mounted OVER the wallet view
     (same z-30 boundary as the contacts takeover: above the bars, below any sheet/
     modal the send review spawns). Own topbar back button closes it; NEVER an
     ixian: nav verb (Receive/Send are IN this page, not separate C# pages). */
  .wallet-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .wallet-takeover__body {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: var(--spacing-16);
  }
</style>

<body>
  <!-- tab1: chats -->

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production home shell — the redesigned Chats + Wallet surface wired to the
   * REAL C# MAUI bridge (native.js in the bundle). HomePage.xaml.cs pushes account
   * data via executeUiCommand(fnRef, b64…) against the page globals registered
   * below; taps go back to C# as legacy `ixian:` commands via bridge.send.
   *
   * ARCHITECTURE §5: index.html/HomePage is ONE shell with internal tab views.
   * Wallet is tab2 (NOT a separate page) — C# calls loadTransactions() on
   * `ixian:tab:tab2` and pushes setBalance/addPaymentActivity into THIS page.
   * Chats (tab1) + Wallet (tab2) + Apps (tab3) are wired; C# calls loadApps() on
   * `ixian:tab:tab3` and pushes clearApps/addApp into THIS page. Account (tab4)
   * is not an in-page tab — it PUSHES SettingsPage. All other commands are safe
   * no-op stubs so C#'s dispatch never console.errors.
   *
   * SECURITY.md: Send/Receive delegate to the existing native signed flows
   * (ixian:sendixi / ixian:receiveixi) — no keys/signing in the WebView.
   * Contract source of truth: Spixi/Pages/Home/HomePage.xaml.cs +
   * Resources/Raw/html/js/home.js (legacy). BE gaps → docs/be-cutover-brief.md.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, createBottomNav, setNavBadge, setNavActive,
    createChatsList, renderChatsList, setChatsFilter, setChatsQuery, chatsUnreadTotal,
    createChatsHeader, attachChatsCollapse,
    startTimestampTicker, refreshTimestamps,
    createNativeBridge, installExecuteUiCommand,
    mountContacts,                       // Track D: contacts picker/directory takeover
    // wallet (tab2)
    createWalletHero, setWalletBalance, setBalanceHidden,
    createWalletTxList, renderWalletTxList, setWalletQuery,
    createWalletFilters, createSearchField, attachWalletScroll,
    setChipSelected,
    createWalletReceive,                 // Receive/Request takeover (zero-C#)
    createWalletSend,                    // Send compose/review takeover (BE-gated)
    // apps (tab3)
    createAppsList, renderAppsList, setAppsQuery, setAppsLayout, createAppsHeader,
  } = window.Spixi;
  const icon = window.SpixiIcons.icon;
  const strings = {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  /* —— nav ↔ legacy tab id mapping ————————————————————————————————————————
   * The redesigned bottom nav uses semantic ids; the legacy C# home surface
   * (HomePage.xaml.cs, home.js) speaks tab1..tab4. We translate in both
   * directions so `ixian:tab:<tabX>` matches what C# expects and incoming
   * selectTab('tabX') lights the right nav item + swaps the right view. */
  const NAV_TO_TAB = { chats: 'tab1', wallet: 'tab2', apps: 'tab3', account: 'tab4' };
  const TAB_TO_NAV = { tab1: 'chats', tab2: 'wallet', tab3: 'apps', tab4: 'account' };

  const chatsView = document.getElementById('chats-view');
  const walletView = document.getElementById('wallet-view');
  const appsView = document.getElementById('apps-view');
  const placeholderView = document.getElementById('placeholder-view');

  /* —— topbar (chats) ——————————————————————————————————————————————————————— */
  document.getElementById('chats-topbar').append(createTopbar({
    variant: 'root', title: 'Spixi', logo: true,
    // Contacts action → the DIRECTORY takeover (purpose 'directory'): tap a row →
    // contact details (ixian:details). Add contact → ixian:newcontact. (Track D)
    actions: [{ icon: 'users', label: 'Contacts', onClick: () => openContacts('directory') }],
  }));

  /* —— FAB → contacts picker (purpose 'start') —————————————————————————————————
   * The FAB no longer emits ixian:newchat directly; it opens the picker takeover.
   * Tap a row → open the 1:1 (ixian:chat). Add contact → ixian:newcontact. Create
   * group → ixian:newchat (native multi-picker; in-shell group setup deferred —
   * see contacts-page.js). */
  document.getElementById('fab').append(icon('message-plus'));
  document.getElementById('fab').addEventListener('click', () => openContacts('start'));

  /* —— contacts DIRECTORY roster (loadContacts flush) ————————————————————————
   * HomePage pushes the FRIEND roster as clearContacts → addContact×N (→
   * noContacts when empty) every tick it detects a structural change
   * (shouldRefreshContacts; bridge-audit-A.md:294). This is the contacts
   * DIRECTORY — distinct from the chats list (loadChats): a friend with no
   * messages is here but not in tab1. It feeds the FAB picker + topbar Contacts
   * takeover, NOT tab1. No clearContactsDone signal exists, so coalesce the burst
   * into one refresh next frame (wallet/apps pattern); if a takeover is open,
   * re-flush it live via its controller. */
  let contactsRoster = [];
  let contactsView = null;           // open takeover controller ({ close, setContacts }) or null
  let contactsRenderTimer = 0;
  // RE-ARMING debounce (not rAF): clearContacts→addContact×N arrive as separate
  // eval frames within one C# tick, so a plain rAF can fire BETWEEN the clear and
  // the row pushes → the open takeover flashes its "No contacts" empty state for a
  // frame. An 80ms timer re-armed on every push only fires once the whole burst
  // settles (there is no clearContactsDone signal for the directory roster).
  function scheduleContactsRender() {
    clearTimeout(contactsRenderTimer);
    contactsRenderTimer = setTimeout(() => {
      if (contactsView) contactsView.setContacts(contactsRoster);
    }, 80);
  }

  /* Open the contacts takeover via the clean bridge boundary (contacts-page.js).
   * 'start' (FAB): Add contact + Create group; tap = open chat. 'directory'
   * (topbar): Add contact only; tap = contact details. One open at a time. */
  function openContacts(purpose) {
    if (contactsView) contactsView.close();       // onClose nulls the handle
    contactsView = mountContacts({
      host: document.body, bridge, strings, purpose,
      getRoster: () => contactsRoster,
      onClose: () => { contactsView = null; },
    });
  }

  /* —— bottom nav —————————————————————————————————————————————————————————— */
  const NAV_ITEMS = [
    { id: 'chats', label: 'Chats', icon: 'messages' },
    { id: 'apps', label: 'Apps', icon: 'apps' },
    { id: 'wallet', label: 'Wallet', icon: 'wallet' },
    { id: 'account', label: 'Account', icon: 'user-circle' },
  ];
  let activeNav = 'chats';                                 // last real in-page tab (for the account revert)
  const nav = createBottomNav({
    items: NAV_ITEMS, active: 'chats',
    onChange: (id) => {
      // Account is NOT an in-page tab — it PUSHES the separate SettingsPage
      // (HomePage.xaml.cs:239: ixian:settings → PushAsync(new SettingsPage) → settings.html).
      // Emit the verb and revert the nav highlight so returning lands on the prior tab.
      if (id === 'account') {
        bridge.send('ixian:settings');
        setNavActive(nav, activeNav);
        return;
      }
      activeNav = id;
      showView(id);                                        // swap the client-side view first…
      bridge.send('ixian:tab:' + (NAV_TO_TAB[id] || id));  // …then tell C# (loads tab2/tab3 data). home.js:500
    },
  });
  document.getElementById('chats-nav').append(nav);

  /* —— chats model + list ——————————————————————————————————————————————————
   * Starts empty; C# flushes clearChats → addChat* → clearChatsDone after
   * ixian:onload. Requests are not fed by the current HomePage contract
   * (loadChats only), so requests stays []. */
  const state = { chats: [], requests: [], filter: 'all', query: '' };
  /* Session tombstone for deleted chats (CH3 interim, Damir F5). HomePage has no
   * delete verb, so a delete can't persist to C#; without this a deleted row would
   * reappear on the very next loadChats re-flush. We remember deleted addresses for
   * the session and filter them out of a STRUCTURAL flush — so a delete actually
   * sticks — while a LONE addChat (a real new-message event, updateChat xaml:1020)
   * RESURRECTS the chat (they messaged you again → it should come back). Cleared on
   * app restart (session-only). The DEEPER wipe (deleteAll = history + downloads +
   * contact) still needs the BE verbs — this only removes the row. */
  const deletedChats = new Set();
  const opts = {
    strings,
    host: document.body,
    // Opening a chat → legacy verb ixian:chat:<address> (home.js:438 → C# onChat)
    onOpen: (c) => { if (c.address) bridge.send('ixian:chat:' + c.address); },
    // Row-menu/swipe intents. delete/deleteAll → tombstone the address (the row is
    // already removed from the model by applyChatRowAction). pin/mute/markRead have
    // no BE persistence path yet → local model change only. When BE ships the §8
    // verbs (CH1/CH3/CH4) the real ixian: sends slot in here, keyed on `action`:
    //   markRead → ixian:markread:<addr> · delete → ixian:removehistory (soft)
    //   deleteAll → history+downloads purge + ixian:remove (contact)
    // delete/deleteContact → tombstone the address (row already removed by
    // applyChatRowAction). `detail.media` + the deeper wipe (history/files) and
    // contact removal are the BE intent (CH3); recorded here for when the verbs land:
    //   delete {media:false} → row only (→ ixian:removehistory soft)
    //   delete {media:true}  → + on-device media/files purge
    //   deleteContact        → also remove the contact (→ ixian:remove)
    onPersist: (action, chat, detail) => {
      if ((action === 'delete' || action === 'deleteContact') && chat && chat.address) {
        deletedChats.add(chat.address);   // no HomePage dispatch yet — intent only
      }
    },
    // Delete ON: the tombstone makes the two-step delete actually stick this session
    // (CH3 interim). pin/mute/favorites (CH4) stay parked until their persist verbs.
    capabilities: { pin: false, mute: false, favorites: false, delete: true },
    onModelChange: (s) => setNavBadge(nav, 'chats', chatsUnreadTotal(s.chats)),
  };

  const scroller = document.getElementById('chat-scroll');
  const list = createChatsList(state, opts);
  scroller.append(list);

  /* —— chats header (search + filter chips — CLIENT-SIDE) ————————————————————
   * Search and filter operate on the local model only (setChatsQuery /
   * setChatsFilter). No bridge round-trip — the full roster already lives
   * in-page once C# has flushed it. */
  const header = createChatsHeader({
    activeFilter: 'all', strings, favorites: false,
    onFilter: (f) => setChatsFilter(list, state, f, opts),
    onQuery: (q) => setChatsQuery(list, state, q, opts),
  });
  document.getElementById('chats-header').append(header);
  attachChatsCollapse(header, scroller);

  setNavBadge(nav, 'chats', chatsUnreadTotal(state.chats));

  /* —— chats render pipeline ————————————————————————————————————————————————
   * C# drives the list two ways:
   *   (1) a FULL flush — clearChats → addChat×N → clearChatsDone (loadChats,
   *       HomePage.xaml.cs:1064-1098) — fires on a structural change
   *       (shouldRefreshContacts); clearChatsDone renders once.
   *   (2) a LONE addChat with NO surrounding clear/done (updateChat,
   *       HomePage.xaml.cs:1020-1032) — fires on every message event while
   *       HomePage is on top (UIHelpers.updateMessage/insertMessage/…).
   * So addChat must UPSERT by address (a lone update patches the existing row
   * instead of appending a duplicate) and, when it lands OUTSIDE a flush,
   * schedule a coalesced re-render. `flushing` distinguishes the two: it's set
   * across a clear…done batch so the per-row upserts don't each trigger a
   * render (clearChatsDone renders the batch once). */
  let chatsFlushing = false;
  let chatsRenderQueued = false;
  function scheduleChatsRender() {
    if (chatsRenderQueued) return;
    chatsRenderQueued = true;
    requestAnimationFrame(() => {
      chatsRenderQueued = false;
      // A full flush (clearChats…addChat…clearChatsDone) can begin between the
      // schedule and this frame — clearChats emptied the model but the rows
      // aren't back yet. clearChatsDone owns that render; skip to avoid painting
      // an empty/partial list for one frame (audit MINOR-1).
      if (chatsFlushing) return;
      renderChatsNow();
    });
  }
  function renderChatsNow() {
    renderChatsList(list, state, opts);
    if (opts.onModelChange) opts.onModelChange(state);
    if (selectedAddress) highlightSelected(selectedAddress);
  }
  /** Decode HTML entities in a C#-sent string. The bridge delivers excerpts as
   *  HTML-encoded text (legacy home.js rendered them via innerHTML) — e.g. an
   *  emoji reaction excerpt arrives as `&#x2764;&#xFE0F;`. The redesign renders
   *  excerpts via textContent (XSS-safe), so entities would show LITERALLY.
   *  Decode them here: a <textarea>'s content is RCDATA (character references
   *  decode, but any literal `<tags>` stay inert text) → `.value` is the plain
   *  string, safe to hand to textContent. */
  const _entityTa = document.createElement('textarea');
  function decodeEntities(s) {
    if (!s || s.indexOf('&') === -1) return s || '';
    _entityTa.innerHTML = s;
    return _entityTa.value;
  }

  /** Resolve a C# avatar arg to a usable <img> src, or null for the gradient
   *  fallback. C# sends an absolute on-disk path for a real avatar (legacy set
   *  it straight as an <img src> from this same Resources/Raw/html origin), OR
   *  the relative placeholders `img/spixiavatar.png` / `img/spixi-group-avatar.png`
   *  when there's no custom photo — we WANT the deterministic gradient for those,
   *  so map them to null. Normalize backslashes like legacy loadAvatar did. The
   *  avatar component has an onerror→gradient fallback, so a path that doesn't
   *  resolve degrades cleanly (no broken-image glyph). */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }

  /** Resolve a C# app-icon arg to a usable <img> src, or null for the gradient
   *  tile. Like resolveAvatar but without the avatar-placeholder mapping — an app
   *  with no custom icon arrives as empty/undefined → null → c-app-icon draws its
   *  deterministic letter/glyph tile. A real `icon.png` path is normalized and
   *  passed through; c-app-icon's onerror falls back to the gradient if it can't
   *  load (same resolution story + BE cutover X1 as avatars). */
  function resolveIcon(path) {
    if (!path) return null;
    return String(path).replace(/\\/g, '/');
  }

  /** Insert-or-update a chat by address. Merges the new fields onto an existing
   *  row (preserving client-only flags the bridge never sends — pinned/muted/
   *  favorite/selected), else appends. The component sorts by pinned+timestamp
   *  on render, so array position doesn't matter. */
  function upsertChat(chat) {
    if (!chat.address) { state.chats.push(chat); return; }
    const i = state.chats.findIndex((c) => c && c.address === chat.address);
    if (i === -1) state.chats.push(chat);
    else state.chats[i] = { ...state.chats[i], ...chat };
  }

  /* —— excerpt canon (CH6, best-effort en-us). C# composes the last-message
   * excerpt as a LOCALIZED string (getFriendMessageHelper, HomePage.xaml.cs:907-970):
   * for a typed message it's the message text; for a typed EVENT (file / payment /
   * app invite / voice call) it's a fixed `_SL` phrase. We can't get the structured
   * KIND over the frozen bridge (that's the BE end-state, CH6), so we reverse-match
   * the known ENGLISH phrases back to a chatlist-item excerpt kind → the canon glyph
   * (📄 File · phone · wallet · apps). A localSender message is prefixed with
   * `index-excerpt-self` + " " — that key is EMPTY in en-us (a bare leading space,
   * en-us.txt:305), so we trim before matching. Unknown / non-en-us → plain text
   * (graceful degrade). missed-vs-answered call can't be split — C# collapses both
   * to `index-excerpt-voice-call`. Coincidental exact matches (a user literally
   * types "File") are an accepted best-effort false-positive. */
  const EXCERPT_CANON = {
    'File': 'file',                          // index-excerpt-file
    'Voice Call': 'call',                    // index-excerpt-voice-call (missed+answered collapsed)
    'Payment Request Sent': 'payment',       // index-excerpt-payment-request-sent
    'Payment Request Received': 'payment',   // index-excerpt-payment-request-received
    'Payment Sent': 'payment',               // index-excerpt-payment-sent
    'Payment Received': 'payment',           // index-excerpt-payment-received
    'Invite Sent': 'app-invite',             // chat-app-invite-sent
    'Invite Received': 'app-invite',         // chat-app-invite-received
  };
  // Lone GIF URL → "GIF" chip (keeps a raw tenor/giphy link out of the list).
  // GIF-ONLY: chatlist-item has no image glyph, so a .png/.jpg link would be
  // mislabelled "GIF" — leave those as plain text. Whole-excerpt-is-a-URL only.
  function isGifExcerptUrl(t) {
    if (!/^https?:\/\/\S+$/i.test(t) || /\s/.test(t)) return false;
    let u; try { u = new URL(t); } catch (_) { return false; }
    const host = u.hostname.toLowerCase();
    if (/\.gif(\?|#|$)/i.test(u.pathname)) return true;
    return /^media\d*\.(tenor|giphy)\.com$/.test(host) || /^c\.tenor\.com$/.test(host);
  }
  // A LIKE reaction surfaces in the excerpt as a lone heart (the bridge supports
  // only `like`; C# re-pushes updateChat after a reaction, xaml UIHelpers:75). Show
  // the heart GLYPH + "Reacted" instead of a bare ❤️ (Damir F5). Best-effort: a
  // literal lone "❤️" text message is an accepted false-positive (like CH6's canon
  // string matches); the clean end-state is a structured reaction signal from C#
  // (reactor + "reacted to your message") — a BE row. Match the heart with/without
  // the emoji variation selector.
  // char-code based (NO literal emoji/escape in source → robust through the
  // inline/build pipeline): a lone U+2764 heart with an optional trailing
  // emoji variation selector U+FE0F.
  function isHeartOnly(s) {
    const t = (s.charCodeAt(s.length - 1) === 0xFE0F) ? s.slice(0, -1) : s;
    return t.length === 1 && t.charCodeAt(0) === 0x2764;
  }
  function excerptFromRaw(raw, statusType) {
    const decoded = decodeEntities(raw);
    if (statusType === 'typing') return { type: 'typing', text: decoded };
    const trimmed = (decoded || '').trim();
    const kind = EXCERPT_CANON[trimmed];
    if (kind) return { type: kind, text: trimmed };
    if (trimmed && isHeartOnly(trimmed)) return { type: 'reaction', text: (window.SL && window.SL.reacted) || 'Reacted' };
    if (trimmed && isGifExcerptUrl(trimmed)) return { type: 'gif', text: 'GIF' };   // parity w/ chat.html buildMediaRow
    return { type: 'text', text: decoded };
  }

  /* —— composer drafts (CH7). chat.html persists the unsent composer text to
   * localStorage keyed by peer address (same Resources/Raw/html origin, shared
   * store); we read it here so a chat with a pending draft shows the "Draft: …"
   * excerpt (chatlist-item `draft` type), overriding the last-message excerpt —
   * WhatsApp parity. A draft is the user's OWN unsent text, not history →
   * SECURITY.md-OK to cache. Fail-soft if localStorage is unavailable. */
  const DRAFT_PREFIX = 'spixi.draft.';
  function getDraft(addr) {
    if (!addr) return '';
    try { return (localStorage.getItem(DRAFT_PREFIX + addr) || '').trim(); } catch (_) { return ''; }
  }
  /** Excerpt for a chat row: a pending draft wins, else the canon reverse-map. */
  function excerptFor(address, raw, statusType) {
    const draft = getDraft(address);
    if (draft) return { type: 'draft', text: draft };
    return excerptFromRaw(raw, statusType);
  }

  /* —————————————————————————————————————————————————————————————————————————
   * WALLET (tab2). Balance hero + transaction list. C# drives it once the user
   * (or selectTab) opens tab2 → HomePage.loadTransactions flushes
   * clearPaymentActivity(filter) then addPaymentActivity(...) per row; setBalance
   * ticks in on the 1s UI loop. Filter is a BRIDGE round-trip (C# re-flushes the
   * server-filtered set — NOT client-side); search is client-side over the loaded
   * set (#52 boundary). ————————————————————————————————————————————————————————— */
  const walletState = { txs: [], filter: 'all', query: '' };

  /* Own receiving address (setAddress push, HomePage:673-674) + the RAW (un-grouped)
   * balance (setBalance) — captured for the Receive/Send takeovers below. The hero
   * shows the grouped string; the Send compose needs the raw numeric for money math. */
  let walletOwnAddress = '';
  let walletRawBalance = '';
  /* No fee push reaches the home wallet tab (fee lives on the native WalletSendPage
   * via setFees). The BE-gated compose review can't show a real fee zero-C# → this
   * placeholder stands in until the fee-push BE ask lands. composeSend is OFF in
   * production, so this never faces a user in v1. */
  const WALLET_FEE_ESTIMATE = 0;

  /* setAddress delivers `new ExtendedAddress(primary, OfflineTag, null).ToString()`
   * (HomePage.xaml.cs:673). Empirically the legacy pages (address.html,
   * wallet_request.html) use that string verbatim as the wallet id and append `:ixi`
   * for the QR — i.e. ToString() is the bare base58 address; OfflineTag is a C#-side
   * payment flag, not part of the string. Defensive extraction anyway: strip anything
   * from the first ':' (mirrors the legacy QR parse, bridge-audit-A:200 — "if payload
   * contains :ixi take the prefix as wallet"), so we never double-suffix the
   * component's own `:ixi`. NEEDS BE CONFIRMATION (be-cutover W-series). */
  function cleanReceiveAddress(raw) {
    // Use the pushed address VERBATIM (legacy address.html/wallet_request.html do —
    // ExtendedAddress.ToString() is a bare base58 address, no colon). An earlier
    // split-on-`:` was riskier than legacy for zero benefit: if the string ever
    // carried a `:` it would truncate the address in the QR = a wrong receiving
    // address (audit MINOR, Batch 6). The component appends its own `:ixi`. (BE
    // confirm the ExtendedAddress.ToString() format — be-cutover W7.)
    return String(raw || '').trim();
  }

  // Money formatting parity (audit M1): the C# bridge sends amounts WITHOUT
  // thousands separators (Utils.amountToHumanFormatString only truncates
  // decimals) — legacy home.js re-applied these in JS (spixi.js:151/436). Port
  // them so the redesigned wallet groups + rounds identically. Balance keeps
  // legacy precision (commas only); tx amounts round to 2 dp then group.
  function amountWithCommas(n) {
    const parts = String(n).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (parts[1] ? '.' + parts[1] : '');
  }
  function limitToTwoDecimals(s) {
    const cleaned = String(s).trim().replace(/^([+-])\s*/, '$1');
    const num = parseFloat(cleaned);
    if (isNaN(num)) return String(s);   // fall back to the original, never "NaN"
    return num.toFixed(2);
  }

  // Explorer copy is address-scoped (only `ixian:explorer` exists — BE gap W3);
  // the per-tx sheet button must not imply tx-specificity.
  const walletStrings = { viewExplorer: 'View address in Explorer' };

  const walletOpts = {
    strings: walletStrings, host: document.body,
    // Only address-level `ixian:explorer` exists today → the tx passed by the sheet is
    // ignored; opens the user's address on explorer.ixian.io (C# Browser.OpenAsync).
    // tx-level explorer = BE gap W3.
    onExplorer: () => bridge.send('ixian:explorer'),
  };

  /* ——— Receive/Request takeover (ZERO-C#, wired NOW) ————————————————————————
   * onReceive opens the redesigned c-wallet-receive OVER the wallet view instead of
   * pushing the native WalletReceivePage. QR of the own address (`address:ixi`, the
   * legacy wallet_request format the component builds), an honest copy morph, the
   * request-an-amount reveal (re-encodes the QR to `address:send:amount` CLIENT-SIDE —
   * no bridge), and Share. Own back closes it — never an ixian: nav verb.
   * NOTE: the "send request to a contact" strip is intentionally NOT wired here —
   * its `ixian:sendrequest` verb belongs to WalletReceivePage, NOT HomePage (dead on
   * this tab → a false "sent"), so onSendRequest is omitted and the component hides
   * the strip (audit MAJOR, Batch 6). Request-to-contact from the home wallet tab
   * needs a HomePage-dispatched verb (be-cutover W8).
   * FALLBACK: if setAddress hasn't arrived yet (address empty), delegate to the native
   * WalletReceivePage so Receive is never broken. */
  let walletTakeover = null;                                  // one Receive/Send takeover open at a time
  function mountWalletReceive() {
    if (walletTakeover) return;                               // double-open guard
    const addr = cleanReceiveAddress(walletOwnAddress);
    if (!addr) { bridge.send('ixian:receiveixi'); return; }   // own address not pushed yet → native
    const over = document.createElement('div');
    over.className = 'wallet-takeover';
    walletTakeover = over;
    const close = () => { over.remove(); walletTakeover = null; };
    const tkStrings = Object.assign({}, window.SL || {}, walletStrings);   // localized + explorer override
    over.append(createTopbar({
      variant: 'view', title: tkStrings.receiveTitle || 'Receive',
      backLabel: tkStrings.back || 'Back', onBack: close,
    }));
    const body = document.createElement('div');
    body.className = 'wallet-takeover__body u-scroll';
    body.append(createWalletReceive({
      address: addr,
      strings: tkStrings, host: document.body,
      // No native share bridge verb exists (§9 ask). Use the Web Share API where the
      // WebView provides it; otherwise degrade to a clipboard copy of the payload —
      // never invent a verb. (The component also has its own address-copy affordance.)
      onShare: ({ value }) => {
        if (navigator.share) { navigator.share({ text: value }).catch(() => {}); }
        else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(value); }
      },
      // onSendRequest OMITTED — see docblock (no HomePage ixian:sendrequest verb).
    }));
    over.append(body);
    document.body.append(over);
  }

  /* ——— Send compose/review takeover (BE-GATED — built + wired, OFF in v1) ————————
   * SECURITY.md: no keys/signing in the WebView — C# signs. So the redesigned compose
   * only goes live once BE lands a signed handoff verb (proposed `ixian:signSend:<addr>:
   * <amount>`, §8) + a fee push to this tab. Until then `bridge.cap('composeSend')` is
   * false and onSend keeps the LIVE native signed flow (ixian:sendixi → WalletSendPage),
   * so v1 is unchanged/working. The compose NEVER emits ixian:sendixi at the end (that
   * would just reopen the native compose blank) — it emits the gated sign verb only. */
  function mountWalletSend() {
    if (!bridge.cap('composeSend')) { bridge.send('ixian:sendixi'); return; }   // v1: native signed send
    if (walletTakeover) return;                               // double-open guard
    const over = document.createElement('div');
    over.className = 'wallet-takeover';
    walletTakeover = over;
    const close = () => { over.remove(); walletTakeover = null; };
    const tkStrings = Object.assign({}, window.SL || {}, walletStrings);   // localized + explorer override
    over.append(createTopbar({
      variant: 'view', title: tkStrings.sendTitle || 'Send',
      backLabel: tkStrings.back || 'Back', onBack: close,
    }));
    const body = document.createElement('div');
    body.className = 'wallet-takeover__body u-scroll';
    body.append(createWalletSend({
      contacts: contactsRoster,
      balance: walletRawBalance || 0,    // RAW numeric from setBalance (money math needs un-grouped)
      fee: WALLET_FEE_ESTIMATE,          // placeholder — no home-tab fee push (BE ask)
      strings: tkStrings, host: document.body,
      onQuickScan: () => bridge.send('ixian:quickscan'),   // scan-result routing wired with the composeSend BE work
      // review Confirm → the NEW §8 signed handoff verb (does NOT exist yet). C# signs
      // the pre-composed tx and takes over the native confirm/broadcast → fire-and-forget,
      // resolve optimistically (real done/fail on sign result lands with the verb).
      onSend: (payload, ctrl) => {
        const r = (payload.recipients && payload.recipients[0]) || {};
        bridge.send('ixian:signSend:' + r.address + ':' + payload.amount);
        ctrl.done();
      },
      onDone: () => close(),             // success morph finished → close the takeover
    }));
    over.append(body);
    document.body.append(over);
  }

  const hero = createWalletHero({
    strings: walletStrings,
    onSend: mountWalletSend,                               // BE-gated compose; falls back to ixian:sendixi in v1
    onReceive: mountWalletReceive,                         // redesigned Receive takeover (zero-C#); falls back to native if no address yet
    onScan: () => bridge.send('ixian:quickscan'),
    // hero toggles its own state, then reports it → persist server-side (home.js toggleBalance)
    onToggleHidden: (hidden) => bridge.send('ixian:balance:' + (hidden ? 'hide' : 'show')),
  });
  document.getElementById('wallet-hero').append(hero);

  const walletScroll = document.getElementById('wallet-scroll');
  const walletList = createWalletTxList(walletState, walletOpts);
  walletOpts.listEl = walletList;   // used by setWalletQuery below

  // Tools = search (client-side) + filter chips (bridge round-trip). Built manually
  // so the chips do NOT filter client-side (no listEl passed to createWalletFilters):
  // C# owns the filtered set; a client-side filter over a server-filtered subset would
  // show a stale slice on the next 'All'.
  const walletTools = document.createElement('div');
  walletTools.className = 'c-wallet-tools';
  const walletSearch = createSearchField({
    placeholder: walletStrings.searchTx || 'Search transactions',
    onInput: (v) => setWalletQuery(walletList, walletState, v, walletOpts),
    strings: walletStrings,
  });
  const walletFilters = createWalletFilters(walletState, {
    strings: walletStrings, host: document.body, onExplorer: walletOpts.onExplorer,
    onFilter: (id) => bridge.send('ixian:filter:' + id),   // home.js:54 → C# filterTransactions
  });
  walletTools.append(walletSearch, walletFilters);
  walletScroll.append(walletTools, walletList);

  const WALLET_FILTER_ORDER = ['all', 'sent', 'received'];
  function syncWalletFilterChips(f) {
    const chips = walletFilters.querySelectorAll('.c-chip');   // 3 filter chips; miss-tx pill is not a .c-chip
    const idx = WALLET_FILTER_ORDER.indexOf(f);
    chips.forEach((c, i) => setChipSelected(c, i === idx));
  }

  // Batched render — legacy has no clearPaymentActivityDone signal; C# clears then
  // appends rows one-by-one. Coalesce the burst into a single render next frame.
  let walletRenderQueued = false;
  function scheduleWalletRender() {
    if (walletRenderQueued) return;
    walletRenderQueued = true;
    requestAnimationFrame(() => {
      walletRenderQueued = false;
      renderWalletTxList(walletList, walletState, walletOpts);
      if (selectedTxid) applyTxSelection();
    });
  }

  let selectedTxid = '';
  function applyTxSelection() {
    for (const r of walletList.querySelectorAll('.c-txlist-item')) {
      if (selectedTxid && r.dataset.txid === selectedTxid) r.setAttribute('aria-current', 'true');
      else r.removeAttribute('aria-current');
    }
  }

  // wallet scroll choreography (hero minimize + tools tuck) — attached only while
  // the wallet view is visible.
  let detachWalletScroll = null;
  function attachWallet() { if (!detachWalletScroll) detachWalletScroll = attachWalletScroll(walletScroll, { hero, tools: walletTools }); }
  function detachWallet() { if (detachWalletScroll) { detachWalletScroll(); detachWalletScroll = null; } }

  /* —————————————————————————————————————————————————————————————————————————
   * APPS (tab3). Installed mini-apps list, list⇄grid + client-side search. C# drives
   * it once the user (or selectTab) opens tab3 → HomePage.loadApps flushes clearApps
   * then addApp(...) per installed app (HomePage.xaml.cs:1554-1567).
   *
   * v1 interaction (mobile; spec §2.1 + legacy AppsPage parity): a row TAP LAUNCHES
   * the app — single-user → ixian:startApp:<id> (MiniAppPage), multi-user →
   * ixian:startAppMulti:<id> (WalletRecipientPage picker); "both flags" → single
   * (bridge-audit-A.md:271-273). A trailing ⓘ info button opens the app's DETAILS
   * page (ixian:appDetails:<id> → AppDetailsPage), which owns launch-mode + uninstall
   * + permissions (covers uninstall for v1). Inside HomePage `ixian:details:` is
   * CONTACT details — apps MUST use `ixian:appDetails:` (HomePage:274 vs :408).
   * Add → ixian:newapp (AppNewPage). Discover, direct-launch/recents, and the ⋮ list
   * menu (list-scoped uninstall has no bridge verb — A1) are deferred to the dedicated
   * standalone apps-shell repoint — see docs/be-cutover-brief.md.
   * ————————————————————————————————————————————————————————————————————————— */
  const appsState = { apps: [], query: '', layout: 'list' };
  const appsOpts = {
    strings, host: document.body,
    // primary tap → LAUNCH. single → ixian:startApp; multi → ixian:startAppMulti;
    // both flags → single. C# owns launch (native picker for multi) — SECURITY.md OK.
    onLaunch: (app) => {
      if (!app || app.id == null || app.id === '') return;
      const multi = !!app.isMultiUser && !app.isSingleUser;
      bridge.send('ixian:' + (multi ? 'startAppMulti' : 'startApp') + ':' + app.id);
    },
    // ⓘ info → the app's details page (launch-mode + uninstall + permissions live there).
    onOpen: (app) => { if (app && app.id != null && app.id !== '') bridge.send('ixian:appDetails:' + app.id); },
    onModelChange: () => {},
    appMenu: false,   // no ⋮ in v1 — the ⓘ info button covers details/uninstall
  };

  // Apps topbar — root style + an Add action (→ legacy AppNewPage).
  document.getElementById('apps-topbar').append(createTopbar({
    variant: 'root', title: strings.tabApps || 'Apps',
    actions: [{ icon: 'circle-plus', label: strings.addApp || 'Add mini app', onClick: () => bridge.send('ixian:newapp') }],
  }));

  const appsScroll = document.getElementById('apps-scroll');
  const appsList = createAppsList(appsState, appsOpts);

  // Header = search (client-side) + list⇄grid toggle (in-memory) + the Explore banner.
  // Explore → apps.spixi.io in the EXTERNAL browser (ixian:spixiAppsLink, HomePage:278
  // → Browser.OpenAsync). It does NOT navigate this WebView away, so the shell stays
  // intact. (Phase 1: a direct web link; an in-app Discover feed is the standalone
  // apps-shell repoint — be-cutover A2.)
  const appsHeader = createAppsHeader({
    layout: appsState.layout, strings, discover: false,
    onQuery: (q) => setAppsQuery(appsList, appsState, q, appsOpts),
    onToggleLayout: (next) => setAppsLayout(appsList, appsState, next, appsOpts),
    onExplore: () => bridge.send('ixian:spixiAppsLink'),
  });
  document.getElementById('apps-header').append(appsHeader);
  appsScroll.append(appsList);

  // Batched render — loadApps clears then appends rows one-by-one with no "done"
  // signal; coalesce the burst into a single render next frame (wallet parity).
  let appsRenderQueued = false;
  function scheduleAppsRender() {
    if (appsRenderQueued) return;
    appsRenderQueued = true;
    requestAnimationFrame(() => {
      appsRenderQueued = false;
      renderAppsList(appsList, appsState, appsOpts);
    });
  }

  /* —— view switching ——————————————————————————————————————————————————————— */
  // Placeholder is now reached only by tab4/account (chats/wallet/apps have real views).
  function setPlaceholder(_navId) {
    document.getElementById('placeholder-title').textContent = strings.tabAccount || 'Account';
    document.getElementById('placeholder-note').textContent =
      strings.tabNotReady || 'This section isn’t part of the redesign yet.';
  }
  function showView(navId) {
    const isChats = navId === 'chats';
    const isWallet = navId === 'wallet';
    const isApps = navId === 'apps';
    chatsView.hidden = !isChats;
    walletView.hidden = !isWallet;
    appsView.hidden = !isApps;
    placeholderView.hidden = isChats || isWallet || isApps;
    if (isWallet) attachWallet(); else detachWallet();
    if (!placeholderView.hidden) setPlaceholder(navId);
  }

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS command handlers. Every one is a page global (registered via
   * bridge.exposeAll) because executeUiCommand(fnRef, …) resolves fnRef as a
   * bare page-global reference. Chats + Wallet commands are wired; the rest are
   * safe no-op stubs so C#'s dispatch never throws / console.errors.
   * ————————————————————————————————————————————————————————————————————————— */

  const dbg = (...a) => { try { console.debug('[home-shell stub]', ...a); } catch (_) {} };

  /* map legacy addChat `type` → redesigned chat status badge.
   * legacy: read | confirmed | pending | default | typing | ''  (home.js:405) */
  function statusFromType(type) {
    switch (type) {
      case 'read': return 'read';
      case 'confirmed': return 'delivered';
      case 'pending': return 'sent';
      case 'default': return 'sending';
      default: return undefined;   // '' / typing → no outgoing tick
    }
  }

  /* selectChat highlight — the chats-shell exposes no selection API, and the
   * rendered row carries no address attribute (createChatItem only sets
   * aria-current from a `selected` field). So we drive selection through the
   * MODEL: flag the matching chat `selected:true` (clear the rest) and re-render. */
  function highlightSelected(addr) {
    let changed = false;
    for (const c of state.chats) {
      const want = !!addr && c.address === addr;
      if (!!c.selected !== want) { c.selected = want; changed = true; }
    }
    if (changed) renderChatsList(list, state, opts);
  }
  let selectedAddress = '';   // remembered so a re-render (clearChatsDone) can re-apply

  /* wallet: legacy confirmed enum → redesign status.
   * home.js addPaymentActivity(confirmed): "true"→final · "false"→pending ·
   * "unknown"→unknown · "error"/other→failed */
  function walletStatus(confirmed) {
    if (confirmed === 'true') return 'confirmed';
    if (confirmed === 'unknown') return 'unknown';
    if (confirmed === 'error') return 'failed';
    return 'pending';
  }

  const handlers = {
    /* ——— chats (wired) ——————————————————————————————————————————————————— */

    // Batch start of a FULL flush: reset the model + enter flushing mode so the
    // per-row addChat upserts don't each render (clearChatsDone renders once).
    clearChats() {
      chatsFlushing = true;
      state.chats = [];
    },

    // One row. Maps the legacy addChat args → a redesigned chat, then UPSERTS by
    // address. Order (home.js:397 / HomePage.updateChat:1030):
    //   wallet, from, timestamp, avatar, online, excerpt_msg, type, unread
    // Two callers: (1) inside a clear…done flush (loadChats) — flushing, no
    // render here; (2) a LONE call from updateChat on a message event — upsert
    // patches the existing row (no duplicate) + schedules a coalesced render so
    // the new excerpt/timestamp/unread surface immediately.
    addChat(wallet, from, timestamp, avatar, online, excerpt_msg, type, unread) {
      // Deleted this session (CH3 tombstone): a STRUCTURAL flush must keep it gone;
      // a LONE addChat (a real new-message event) RESURRECTS it (they messaged you).
      if (deletedChats.has(wallet)) {
        if (chatsFlushing) return;              // reflush → stay deleted
        deletedChats.delete(wallet);            // new message → bring it back
      }
      let t = Number(timestamp);
      if (t && t < 1e12) t *= 1000;              // legacy may send Unix seconds → ms
      const n = Number(unread) || 0;
      const chat = {
        address: wallet,
        name: from || '',
        // Real avatar path → <img src> (legacy parity, same origin); the C#
        // default placeholders map to null → deterministic gradient. A path that
        // fails to load falls back to the gradient (avatar.js onerror).
        avatar: resolveAvatar(avatar),
        online: online === 'true' || online === 'True',
        // canon reverse-map (CH6) + draft override (CH7); a pending draft wins.
        excerpt: excerptFor(wallet, excerpt_msg, type),
        unread: n,
        // clear any leftover outgoing tick; re-set below when unread === 0
        status: undefined,
      };
      // Only carry a real timestamp — a 0/NaN (malformed lone push) must not
      // clobber an existing row's timestamp on upsert-merge (audit NIT-1). A
      // brand-new row simply has none until the next good push.
      if (t) chat.timestamp = t;
      // legacy hides the outgoing tick when there are unread messages
      if (n === 0) {
        const st = statusFromType(type);
        if (st) chat.status = st;
      }
      upsertChat(chat);
      if (!chatsFlushing) scheduleChatsRender();   // lone updateChat → render now-ish
    },

    // Batch complete: leave flushing mode, render once, re-apply any selection.
    clearChatsDone() {
      chatsFlushing = false;
      renderChatsNow();
    },

    // Two-pane (tablet/desktop) selection sync from C#.
    selectChat(wallet) {
      selectedAddress = wallet || '';
      highlightSelected(selectedAddress);
    },

    // LIVE per-contact status — pushed every UI tick for changed contacts
    // (HomePage.updateContactStatus:1497 → setContactStatus, xaml:1504). In
    // practice C# always sends excerpt="" + timestamp=0 (Node.cs:443/451,
    // SingleChatPage:1519) → it's a pure ONLINE + UNREAD refresh. Without this
    // the online dot / unread badge only moved on a full loadChats flush
    // (gap-audit §2). We patch ONLY the matching chat row (a status for an
    // address with no conversation is a contacts-directory entry — not a chat —
    // and is ignored); excerpt/timestamp are applied only if non-empty/non-zero
    // so a bare refresh never blanks a good excerpt.
    //   setContactStatus(address, online, unread, excerpt, timestamp)
    setContactStatus(address, online, unread, excerpt, timestamp) {
      if (!address) return;
      const c = state.chats.find((x) => x && x.address === address);
      if (!c) return;                                   // contacts-directory-only status → ignore
      c.online = online === 'true' || online === 'True';
      c.unread = Number(unread) || 0;
      // A live status tick is normally excerpt="" (pure online/unread refresh); when
      // it does carry text, run it through the same canon+draft path as addChat.
      { const ex = excerptFor(address, excerpt, undefined); if (excerpt || ex.type === 'draft') c.excerpt = ex; }
      const t = Number(timestamp);
      if (t) c.timestamp = t < 1e12 ? t * 1000 : t;
      scheduleChatsRender();
    },

    // Chats nav badge — C# already computes the unread total (#42 semantics).
    setUnreadIndicator(n) {
      setNavBadge(nav, 'chats', Number(n) || 0);
    },

    // C# lights the active tab (onLoaded sends selectTab(currentTab='tab1')) —
    // sync BOTH the nav highlight and the visible view.
    selectTab(tab) {
      const navId = TAB_TO_NAV[tab] || tab;
      setNavActive(nav, navId);
      showView(navId);
    },

    /* ——— wallet (wired, tab2) —————————————————————————————————————————————— */

    // setBalance(balance, fiatBalance, nick) — C# sends UN-grouped amounts
    // (Utils.amountToHumanFormatString truncates decimals only). Group them like
    // legacy home.js:84-87 (amountWithCommas), and prefix fiat with "$".
    setBalance(balance, fiatBalance, _nick) {
      walletRawBalance = balance || '';   // RAW (un-grouped) — the Send compose does money math on it
      setWalletBalance(hero, {
        balance: balance ? amountWithCommas(balance) : '',
        fiat: (fiatBalance != null && fiatBalance !== '') ? '$' + amountWithCommas(fiatBalance) : '',
      });
    },

    // setHideBalance(hide) — C# sends bool.ToString() → "True"/"False" (home.js:101).
    setHideBalance(hide) {
      setBalanceHidden(hero, hide === 'True' || hide === 'true' || hide === true);
    },

    // Batch start: reset tx model + sync the active filter chip. Render (empty) next frame.
    clearPaymentActivity(filter) {
      walletState.txs = [];
      const f = (filter === 'sent' || filter === 'received') ? filter : 'all';
      walletState.filter = f;
      syncWalletFilterChips(f);
      scheduleWalletRender();
    },

    // One tx row (home.js:248 / HomePage:1219):
    //   txid, received("1"|"0"), counterparty, time(preformatted str), amount, fiat, confirmed
    addPaymentActivity(txid, received, counterparty, time, amount, fiat, confirmed) {
      const dirIn = String(received) === '1';
      const status = walletStatus(confirmed);
      const sign = dirIn ? '+' : '-';
      // amount/fiat arrive UNSIGNED + UN-grouped. Round the amount to 2 dp then
      // group both (legacy home.js:298-299: amountWithCommas(limitToTwoDecimals())).
      // Sign by direction; failed rows stay unsigned per Figma (txlist-item comment).
      const amtN = amount ? amountWithCommas(limitToTwoDecimals(amount)) : '';
      const ftN = fiat ? amountWithCommas(fiat) : '';
      const amt = amtN ? (status === 'failed' ? amtN : sign + amtN) : '';
      const ft = ftN ? (status === 'failed' ? '$' + ftN : sign + '$' + ftN) : '';
      walletState.txs.push({
        txid: txid || '',
        direction: dirIn ? 'in' : 'out',
        status,
        name: counterparty || '',   // nickname OR raw address (ambiguous — BE gap W4)
        amount: amt,
        fiat: ft,
        timeText: time || '',        // pre-formatted string (BE gap W1: send epoch → relative ts)
        // no address / fee in this payload → the detail sheet omits those rows (data-honest, BE gap W2)
      });
      scheduleWalletRender();
    },

    // Two-pane (tablet/desktop) tx selection sync from C# (home.js:364).
    selectTx(txid) {
      selectedTxid = txid || '';
      applyTxSelection();
    },

    /* ——— apps (wired, tab3) ————————————————————————————————————————————————— */

    // Batch start: reset the model, render (empty) next frame.
    clearApps() {
      appsState.apps = [];
      scheduleAppsRender();
    },

    // One installed app (HomePage.xaml.cs:1567):
    //   addApp(id, name, icon, publisher, isSingleUser, isMultiUser)
    // `icon` is `icon.png` under the app storage dir (MiniAppManager.cs:374). We
    // thread it into the tile as a c-app-icon `src` (resolveIcon normalizes it like
    // an avatar path). It resolves today on WinUI/WebView2 (same file:// origin as
    // avatars) and — pending BE cutover row X1 — as a data: URI on every platform;
    // an unresolvable path degrades cleanly via c-app-icon's onerror → gradient tile
    // (worst case = the previous behavior). `publisher` → the creator subtitle (real
    // data — no §8 gap). isSingleUser/isMultiUser (bool.ToString()) drive the launch
    // verb picked by onLaunch (startApp vs startAppMulti).
    addApp(id, name, icon, publisher, isSingleUser, isMultiUser) {
      appsState.apps.push({
        id: id || '',
        name: name || '',
        creator: publisher || '',
        icon: resolveIcon(icon),                          // c-app-icon src (onerror → gradient)
        isSingleUser: isSingleUser === 'true' || isSingleUser === 'True' || isSingleUser === true,
        isMultiUser: isMultiUser === 'true' || isMultiUser === 'True' || isMultiUser === true,
      });
      scheduleAppsRender();
    },

    /* ——— safe no-op stubs (features owned by other shells / not in v1) ——— */
    loadAvatar() { dbg('loadAvatar'); },        // avatar path doesn't resolve in-shell (flag) — gradient fallback
    // Own primary receiving address (ExtendedAddress+OfflineTag .ToString(), HomePage:673).
    // Stored for the Receive/Send takeovers; cleaned at use (cleanReceiveAddress).
    setAddress(extendedAddress) { walletOwnAddress = String(extendedAddress || '').trim(); },
    setVersion() { dbg('setVersion'); },
    // clearContacts/addContact/noContacts feed the contacts DIRECTORY roster
    // (loadContacts, bridge-audit-A.md:294) — a SEPARATE surface from the chats
    // list. The chats list is fed by clearChats/addChat/clearChatsDone (loadChats);
    // a friend with no messages is in the directory but NOT in chats
    // (getFriendMessageHelper returns null, xaml:869). The redesign routes the
    // directory to the contacts takeover (FAB purpose 'start' + topbar Contacts
    // purpose 'directory'), NOT tab1 — so these fill contactsRoster, not state.chats.
    //   addContact(address, nickname, avatar, online, unreadCount)  (HomePage
    //   signature — NOTE: 5th arg is unreadCount, NOT the WalletRecipientPage
    //   `type`; so the directory carries no group/bot type and no pending flag —
    //   §9 asks. Unread is not surfaced in the picker → ignored.)
    clearContacts() { contactsRoster = []; scheduleContactsRender(); },
    addContact(address, nickname, avatar, online, _unread) {
      if (!address) return;
      contactsRoster.push({
        address,
        name: nickname || '',
        avatar: resolveAvatar(avatar),
        online: online === 'true' || online === 'True',
        // type/pending absent from the HomePage roster (§9) → normal row, no badge
      });
      scheduleContactsRender();
    },
    // empty friend list (loadContacts, xaml:537) → the picker's noContacts state.
    noContacts() { contactsRoster = []; scheduleContactsRender(); },
    selectMenuOption() { dbg('selectMenuOption'); },
    showWarning() { dbg('showWarning'); },
    showRatingPrompt() { dbg('showRatingPrompt'); },
    toggleAnimatedSlider() { dbg('toggleAnimatedSlider'); },
    updateDebugInfo() { dbg('updateDebugInfo'); },
  };

  bridge.exposeAll(handlers);

  /* —— live relative timestamps ("2h", "yesterday", …) ————————————————————— */
  startTimestampTicker(() => refreshTimestamps(list));

  /* —— page ready — fire ixian:onload AFTER the document fully loads, matching
   *    the legacy onload() timing (spixi.js:88 → window load). Firing it
   *    synchronously during parse raced C#'s initial data push: the first load
   *    could arrive empty and only a manual refresh fixed it. Deferring to the
   *    window 'load' event makes C# receive the ready signal at the right time,
   *    so real chats populate on first entry. ———————————————————————————————— */
  function signalReady() {
    // Fix #8 — boot to the chats tab. HomePage keeps `currentTab` on its persistent
    // instance and echoes selectTab(currentTab) on EVERY reload, including the
    // regenerate-index.html reload after SettingsPage pops (HomePage.xaml.cs:667). If
    // the user was on Apps (currentTab=tab3) that echo drops them on an EMPTY apps view
    // after Save. Reset currentTab to tab1 BEFORE onload so the ensuing selectTab
    // lands on chats. tab1 has no C# loader side effect (HomePage.xaml.cs:300). The
    // rAF gap serializes the two location.href sends — a synchronous double-set would
    // drop the first (native.js emits via location.href, no queue).
    bridge.send('ixian:tab:tab1');
    requestAnimationFrame(() => bridge.ready());
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
