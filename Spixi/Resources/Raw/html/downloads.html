<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ #1028 (walk R.6): the platform CONVENTION flag (#922 carrier) in every shell — base.css draws the Mac title-bar hairline from it -->
<script>(function(){var p='*SL{SpixiPlatform}';if(/^(android|ios|maccatalyst|windows)$/.test(p))document.documentElement.setAttribute('data-platform',p);})();</script>
<script>(function(){if('*SL{SpixiP1}'==='1')document.documentElement.setAttribute('data-p1','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;function b(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-bottom',v+'px');}b('*SL{AndroidInsetBottom}');window.setInsetBottom=b;function c(l,r){var n=/^\d{1,3}(\.\d{1,2})?$/,d=document.documentElement.style;if(n.test(String(l)))d.setProperty('--android-inset-left',l+'px');if(n.test(String(r)))d.setProperty('--android-inset-right',r+'px');}c('*SL{AndroidInsetLeft}','*SL{AndroidInsetRight}');window.setInsetSides=c;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Downloads</title>

  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  /* ★ #1052: the TONAL BUTTON's own palette (its surface + ink), AA in every state for the DEFAULT intent.
     --_tonal above stays the shared tonal surface, which the outline/text :active states also paint.
     ⚠ The destructive intent maps --_tb* to its existing tonal pair, which is NOT AA on hover/pressed
     (no destructive tonal button exists today) — give it its own pair before using one. */
  --_tb: var(--surface-button-tonal-default);
  --_tb-hover: var(--surface-button-tonal-hover);
  --_tb-pressed: var(--surface-button-tonal-pressed);
  --_tb-ink: var(--text-button-tonal);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);
  /* ★ #46 r2 C1: the ink that rides ON --_fill, intent-switched like every other member of
     this private palette. It used to be --text-neutral-on-action hard-coded at the
     [data-type="fill"] rule, which was right for the default intent and wrong for
     destructive: in dark --surface-destructive-default WAS --error-300 #f49c92 (before #1018 made
     it --error-600, white ink 6.36:1) and the white label measured 2.01:1 — the worst reading anywhere in the #46 audit, and the one row
     the census missed. Default intent is unchanged at 6.68:1 on #3050bd (Damir, Session K). */
  --_on-fill: var(--text-neutral-on-action);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  /* ★ #46 r2 C1: dark #131415 on --error-300 #f49c92 = 8.80:1 (was #f9fafb at 2.01:1);
     light #f9fafb on --error-600 #b12525 = 6.36:1, unchanged. State steps hold on the same
     ink: dark hover #f1786e 6.72:1 / pressed #e34540 4.56:1.
     Reversal: delete the --_on-fill declaration below and the destructive fill falls back
     to the base palette (--text-neutral-on-action), i.e. back to 2.01:1 in dark. */
  --_on-fill: var(--text-neutral-on-destructive);
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_tb: var(--_tonal);
  --_tb-hover: var(--_tonal-hover);
  --_tb-pressed: var(--_tonal-pressed);
  --_tb-ink: var(--text-error);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--_on-fill); }

.c-button[data-type="tonal"] { background: var(--_tb); color: var(--_tb-ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tb-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tb-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  /* ★ #46 r2 C1: the morph fill is GREEN, never the action blue — in dark --success-300
     #91c69b took the on-action white at 1.87:1. --text-neutral-on-success = 9.45:1 dark /
     5.98:1 light. The !important is the morph overriding any intent, and stays. */
  color: var(--text-neutral-on-success) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
/* ★ L18 (Damir, 2026-08-31): the ink is now a ROLE, --text-logotype — brand blue in
   light (byte-identical: the role aliases --text-action-default) and neutral-01 in
   dark. The theme answer lives in tokens.css; a [data-theme] selector here is the
   shape #421 retired (tokens.css states the rule). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-logotype); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  /* ★ S11 A (#1262, Damir's pick B "blue to violet, one strip"): the sweep blends brand blue → indigo → violet
     (tokens.css region A). The geometry, the animation and the reduced-motion rule below are unchanged. */
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--connecting-line-blue) 30%,
    var(--connecting-line-indigo) 48%,
    var(--connecting-line-violet) 66%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.

   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */

  min-width: 0;
  max-width: 100%;

   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */

  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */

.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }

  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */

  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

/* ★ N19 (#428): while the state is live the sweep IS the bottom border — the bar's
   own hairline under it would read as a second line.
   ⚠ THE PLACEMENT AND THE SECOND SELECTOR ARE BOTH LOAD-BEARING. This rule has to
   sit AFTER the view/chat variant blocks above, which set the `border-bottom`
   SHORTHAND at equal specificity (source order decides), and it needs the
   [data-theme="dark"] twin because the dark overrides are (0,3,0) and would
   otherwise out-specify a (0,2,0) reset — i.e. the hairline would keep painting in
   dark only. Written the first time as one low-specificity rule high up in the file,
   where it silently lost to all four. Pinned in smoke against computed style. */
.c-topbar[data-connecting-bar],
[data-theme="dark"] .c-topbar[data-connecting-bar] { border-bottom-color: transparent; }

/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  /* the OVERLAY backdrop role — not --surface-scrim, which carries near-white ink on
     media tiles and the call stage (tokens.css). Halved in light, #557 values in dark. */
  background: var(--surface-scrim-overlay);

   stay wash-free (#268, [data-dt-clear] below). */

   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-sheet);   /* ★ #1030 (walk P.18): the sheet ground (dark one rung under the menu surface) */
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  /* ★ Session Z (#884 ①, Damir on the Y walk: every sheet "feels too low", "maybe even
     32px"): the foot is spacing-24 (was 16) ABOVE the safe region — the same 24 the
     desktop dialog already used (`:root[data-desktop] .c-sheet` below), so one number
     serves both presentations. Picked over 32: on a 3-button Android bar the sheet now
     also carries the 48 px bar under it (AND-45), and 32 + 48 read as an empty shelf
     (the two variants were rendered; 24 is his pick). The keyboard variant mirrors it. */

.c-sheet[data-open] {

  transition-timing-function: var(--easing-decelerate);

   A bottom sheet is `bottom: 0` of its host, and on iOS the host does NOT shrink under
   the soft keyboard: the whole sheet sat behind it. On the tip sheet only the title row
   stayed visible — the amount chips, the custom-amount field the sheet had just FOCUSED
   itself, and the button that commits the payment were all underneath, on a surface with
   no scroll and no cap, so nothing could reach them. That is also why the keyboard read
   as having "no way out": the scrim you would tap to dismiss it was under the keyboard
   too.
   Three declarations, and every one of them is INERT at `--kb-inset: 0` — no keyboard,
   no change, anywhere in the app:
     · the sheet sits on top of the keyboard instead of behind it;
     · the home-indicator pad is given back while the keyboard covers that strip anyway
       (the same max() the chat composer uses), so the sheet does not float twice;
     · it is capped and scrollable, so a sheet taller than the space that is left can
       still be read to the end rather than being clipped at both ends.

   separately further down this file. */

     viewport rose to y=0 under it; the anchored menu already subtracted --safe-top. */

/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————

   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.

   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }

/* ★★ #1018 (Damir's dark sweep, 2026-09-28: "the bottom sheet is a bit off"): a card INSIDE a sheet
   or a dialog painted the SCREEN card tones (--surface-card / --surface-neutral-02 = neutral-800 in

   the sheet. Inside an overlay those two roles resolve to the sheet-card tone, which LIFTS (neutral-600,

   neutral-50 there. Scoped here, so no component carries a [data-theme] selector. */

.c-modal {
  --surface-neutral-02: var(--surface-sheet-card);
  --surface-card: var(--surface-sheet-card);

  --surface-card-hover: var(--surface-sheet-card-hover);
  --surface-card-pressed: var(--surface-sheet-card-pressed);
  /* ★ #1035 (#46 auditor C, MAJOR): the other roles that equalled the dark sheet once it moved to 800 —
     the menu dividers, the send-review row lines, the address chip, an in-sheet search field, row and
     text-button hover/pressed, and the settings card. Light is value-identical (tokens.css) — for the ROOT
     values: an ancestor that overrode one of these above a sheet would be reset here (none does today). A
     derived pin requires EVERY dark token equal to the sheet ground to be remapped here or allow-listed. */
  --outline-neutral-01: var(--outline-sheet-01);
  --surface-input: var(--surface-input-sheet);
  --surface-interactive-hover: var(--surface-interactive-hover-sheet);
  --surface-interactive-pressed: var(--surface-interactive-pressed-sheet);
  --surface-settings-card: var(--surface-settings-card-sheet);   /* ★ #1036 (r2 n2): light value-identical (was the sheet-card, #edf0f2 for #ffffff) */
}
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-sheet);   /* ★ #1030: a dialog shares the sheet ground (the #1018 card remap is scoped to both) */
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);

     ⚠ `anywhere`, not `break-word`: `overflow-wrap: break-word` only breaks BETWEEN

     is exactly the case here. `anywhere` breaks only when the line would otherwise overflow,
     so ordinary body copy in every other modal is untouched — it is not `word-break:
     break-all`, which would hyphen-less-chop normal sentences too.

     long action onto its own full-width row (the remove-contact sheet's answer);

  gap: var(--spacing-8);
  justify-content: flex-end;

  margin-block-start: var(--spacing-24);

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════

   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {

  border-radius: 0 0 var(--radius-16) var(--radius-16);

     separation — and in LIGHT mode --surface-menu == --surface-screen (both

     text. A hairline restores the edge. ★ #1035: dark needs it too now — the dropdown is a
     sheet, 800 on the 900 screen (1.108), and there is no scrim (#268): the border IS the edge.

/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source
   highlight is RETUNED — the SELECTED tint read as a selection state on the
   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".

   would otherwise REPLACE the OPEN conversation's tonal selected paint (0,2,0)
   in the desktop split view, visually deselecting the row under its own menu.
   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}

/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
/* ★ Session K: the rule is no longer desktop-scoped — the apps ⋯ dropdown clears its wash on
   mobile too (Damir: "shouldn't dim at all"). The tag keeps its name; one grammar. */

:root:not([data-desktop]) .c-scrim[data-dt-clear] { background: transparent; }   /* the second selector out-specifies the mobile deep wash (line 19, (0,3,0)) */

/* ═════════ MOBILE anchored dropdown (Batch E (a), #557, Damir 2026-08-22) ═════════
   The message menu + the chats-row menu present as a DROPDOWN anchored to the
   pressed row (desktop-anchors.js anchorSheetToRow sets the tag + inline
   left/top/width). Placement prefers ABOVE the row, so the menu can never cover
   the message it acts on — the 4.1 fix, structural. Everything else about the
   overlay is UNCHANGED: same z-44 (above the z-42 lifted row, #506②), same scrim
   (one level deeper here, (b) above), same focus/Esc/stack grammar, and the
   `:not([data-open])` pointer-events rule still covers the fade windows.
   Enter/exit = FADE IN PLACE (the desktop [data-dt-anchor] rule): a panel that
   slid from the bottom edge to mid-screen would point at the wrong origin. */
:root:not([data-desktop]) .c-sheet[data-m-anchor] {
  left: auto; right: auto; bottom: auto;
  margin: 0;
  max-width: none;
  border-radius: var(--radius-16);
  padding: var(--spacing-8) var(--spacing-12) var(--spacing-12);
  /* ★ loop E-1 (r2): the dropdown must never leave the SAFE region or outgrow the
     host — a menu taller than the screen with the body scroll locked is
     unreachable UI, and a clamp to y=8 puts the react row under the Dynamic
     Island (the #288 inset class). The height cap makes the menu its own
     scroller; the JS clamp (anchorSheetToRow) keeps top ≥ safe-top + 8. */
  max-height: calc(100% - var(--safe-top, 0px) - var(--safe-bottom, 0px) - 2 * var(--spacing-8));
  overflow-y: auto;
  /* ★ #1067: grow out of the pressed message (origin set in desktop-anchors.js); compositor-only */
  transform: scale(0.92);
  opacity: 0;
  /* ★ #1071: times the CLOSE (the open, mirrored) */
  transition: opacity var(--duration-200) var(--easing-standard-mirror),
              transform var(--duration-200) var(--easing-standard-mirror);
}
:root:not([data-desktop]) .c-sheet[data-m-anchor][data-open] {
  transform: none; opacity: 1;
  transition-timing-function: var(--easing-standard);
}
:root:not([data-desktop]) .c-sheet[data-m-anchor] .c-sheet__handle { display: none; }
/* ★ #1071: its scrim moves with it */
:root:not([data-desktop]) .c-scrim[data-m-anchor-scrim] { transition-timing-function: var(--easing-standard-mirror); }
:root:not([data-desktop]) .c-scrim[data-m-anchor-scrim][data-open] { transition-timing-function: var(--easing-standard); }

/* ★★ #993 (F1): an overlay ROOT takes focus on a pointer open (overlay.js) so the first row shows no
   ring; the root itself must not ring either — it is a dialog container (tabindex -1, never a Tab
   stop), and APG gives a focused dialog container no indicator. (0,2,0) beats base.css :focus-visible. */
[data-overlay-root]:focus { outline: none; }

  border-radius: var(--radius-full);
  background: transparent;
  color: var(--icon-action-default);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
.c-settings__copy::after { content: ''; position: absolute; inset: -6px; }   /* hit area */
@media (hover: hover) and (pointer: fine) {
  .c-settings__copy:hover { background: var(--surface-interactive-hover); }
}
.c-settings__copy:active { background: var(--surface-interactive-pressed); }

/* —— groups: CARD surfaces (#147 — flat hairline rows read utilitarian) —— */
.c-settings__groupwrap { display: flex; flex-direction: column; }
.c-settings__group {
  display: flex;
  flex-direction: column;
  background: var(--surface-settings-card);   /* ★ #1007: WHITE in light (was --surface-card #EDF0F2) */
  border-radius: var(--radius-16);
  padding: var(--spacing-4);
  box-shadow: var(--elevation-settings-card);   /* ★ #1068: the softer Account-card shadow (light); dark = elevation-1 */
  --surface-input: var(--surface-input-on-settings-card);   /* #150③ → #1007: an input on the white card takes the grey */
}
/* ★ Session AF (#949, Damir on the AE walk): NO hairline between rows of the same card — the
   card's own edge groups them and the line inside was noise. (It was the #884 ⑤ /
   #882 (b) `--outline-on-card` border-top on `.c-settings__section + .c-settings__section`.)
   Separation between GROUPS is the card gap + the section label, unchanged. */

/* —— rows: disc · label · value · chevron —— */
.c-settings__row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-8);
  min-height: var(--row-h-nav);     /* ★ Session I canon: 48 (was 52 "44 target + disc breathing room"); switch rows 56 below */
  padding: var(--spacing-4) var(--spacing-8);
  border: 0;
  background: transparent;
  border-radius: var(--radius-12);
  cursor: pointer;
  text-align: start;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
  /* 5c-ii (2026-08-24): the press fill MOVED to the compositor ::before layer in
     base.css — see chatlist-item.css. State rules set background-COLOR only. */
}
.c-settings__row--static { cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .c-settings__row:not(.c-settings__row--static):hover { background-color: var(--surface-card-hover); }   /* ★ Session Z (#882 (a)): this row sits ON a --surface-card, and --surface-interactive-hover IS the card's colour (light 50 on 50, dark 800 on 800) — no hover at all. The card pair is one visible step (#878). */
}
/* 5c-i/ii: the :active fill mirror is REMOVED — see chatlist-item.css. */
.c-settings__row-label {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-width: 0;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  font-weight: var(--row-title-weight);   /* ★ Session J: one notch over the sub (tokens.css) */
}
.c-settings__row-sub { font-weight: var(--font-weight-regular, 400); }   /* ★ Session J: the sub does NOT inherit the title's Medium */
.c-settings__row-value {
  margin-inline-start: auto;
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-md);
  flex: none;
}
.c-settings__row > svg:last-child { color: var(--icon-neutral-02); flex: none; }

/* tinted icon disc: PROMOTED to base.css as .c-disc (#148 — shared with
   chat-info/contact for one consistent treatment) */

/* stacked (two-line) rows — backup nudge, quiet danger rows */
.c-settings__row-label--stack {
  flex-direction: column;
  align-items: flex-start;
  /* N59 → N59b (Damir screenshot, 2026-08-17): the disc now centres against the
     title+sub GROUP, not against the title line alone. The first cut pulled the
     sub up under a title that stayed centred in the 32px disc box — the text
     block read bottom-weighted ("dragging down, uncentered"). The disc leaves
     the flow (absolute, centred on the whole label); the stack carries the
     gutter; the sub needs no pull-up — the dead space is gone at the source. */
  position: relative;
  padding-inline-start: calc(32px + var(--spacing-12));
  gap: 0;
  flex: 1;
}
.c-settings__row-label--stack .c-disc {
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  transform: translateY(-50%);
}
.c-settings__row-top {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
}
.c-settings__row-sub,
.c-settings__backup-sub {
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  /* ★ #712 (Damir on device, 2026-08-30): the sub-label WRAPS. It was a single
     ellipsised line, and on a phone "Message text is never shown in notific…" and
     "Off: messages arrive when Spixi check…" cut the sentence exactly where the
     meaning was. A sub-label is an explanation; an explanation that ends in "…" is
     not one. Two or three lines cost nothing in a stacked row. */
  white-space: normal;
  overflow-wrap: anywhere;
  max-width: 100%;
  min-width: 0;
}
.c-settings__row--backup { min-height: var(--row-h-switch); }   /* ★ Session I canon: the two-line backup row shares the 56 */
.c-settings__row[data-row="switch"] { min-height: var(--row-h-switch); }   /* ★ Session I canon: a row that carries a switch is 56 */
.c-settings__row[data-row="stacked"] { min-height: var(--row-h-stacked); }   /* ★ Session J: a nav row with a sub-line (the third height; Damir's pick) */
/* ★ S9 toggle layout B (Damir): a SWITCH row with a stacked label is a two-row grid — disc + title + switch on
   ONE line (the switch centred on the title line, not on the whole card), the description BELOW, starting
   under the title (disc + its gap) and running the full remaining width, under the switch column too.
   The stack becomes `display: contents`, so its two children (.c-settings__row-top, .c-settings__row-sub)
   are the grid items; the disc goes back into the title line's flow (the N59b absolute-centred disc stays
   for every OTHER stacked row). A switch row WITHOUT a sub is the same one-line row as before: label | switch,
   centred, the same 8 px gap. The DOM is unchanged, so the switch keeps its aria-label (the title) and — on the
   three rows that carry one (read receipts, typing, hide online) — its aria-describedby → the description.
   ★ #46 r3 n3: row-gap 8 = the switch's 44 px tap layer (::after inset -8px) ends ABOVE the description, so no
   part of the description's first line toggles the switch (at 2 px its top ~5 px did). */
.c-settings__row[data-row="switch"] {
  --row-disc-w: 32px;               /* sanctioned: the .c-disc box (base.css) — the description's indent */
  --row-disc-gap: var(--spacing-12);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--spacing-8);
  row-gap: var(--spacing-8);       /* ≥ the tap layer's 8 px overhang below the switch box (#46 r3 n3) */
}
.c-settings__row[data-row="switch"] > .c-settings__switch { grid-column: 2; grid-row: 1; }
.c-settings__row[data-row="switch"] > .c-settings__row-label { grid-column: 1; grid-row: 1; }
.c-settings__row[data-row="switch"] > .c-settings__row-label--stack { display: contents; }
.c-settings__row[data-row="switch"] .c-settings__row-label--stack > .c-settings__row-top {
  grid-column: 1; grid-row: 1;
  min-width: 0;
  gap: var(--row-disc-gap);
}
.c-settings__row[data-row="switch"] .c-settings__row-label--stack .c-disc { position: static; transform: none; }
.c-settings__row[data-row="switch"] .c-settings__row-label--stack > .c-settings__row-sub {
  grid-column: 1 / -1; grid-row: 2;
  margin: 0;
  padding-inline-start: calc(var(--row-disc-w) + var(--row-disc-gap));
}
.c-settings__backup-badge { flex: none; }

/* —— switch (chat-info parity) —— */
.c-settings__switch {
  flex: none;
  position: relative;
  width: 48px;
  height: 28px;
  border: var(--outline-width-1) solid var(--outline-neutral-02);
  border-radius: var(--radius-full);
  background: var(--switch-track-off);   /* #148: dedicated pair — neutral-03 vanished on card surfaces */
  cursor: pointer;
  transition: background-color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard);
  -webkit-tap-highlight-color: transparent;
}
.c-settings__switch::after {        /* 44px target on a 28px control */
  content: '';
  position: absolute;
  inset: -8px;
}
.c-settings__switch[aria-checked='true'] {
  background: var(--surface-action-default);
  border-color: var(--surface-action-default);
}
.c-settings__switch[aria-busy='true'] { opacity: var(--opacity-disabled); }   /* pending auth (lock OFF) */
.c-settings__switch-knob {
  position: absolute;
  top: 2px;
  inset-inline-start: 2px;
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  background: var(--switch-knob);        /* #148: on-action ink went near-black in dark — invisible knob */
  box-shadow: var(--elevation-1);
  transition: transform var(--duration-200) var(--easing-standard);
}
.c-settings__switch[aria-checked='true'] .c-settings__switch-knob {
  transform: translateX(20px);
}

/* —— option sheet (language & friends — sd-sheet grammar, #145③ slot) —— */
.c-settings__opts { display: flex; flex-direction: column; gap: var(--spacing-4); }
/* #148⑥: long pickers scroll inside a taller sheet (search joins later) */
/* #965: the list keeps its cap on desktop (a centred dialog); a phone opens the sheet
   TALL instead (overlay.css .c-sheet[data-tall]) and the list fills it. Its NATIVE
   scrollbar is hidden — the drawn indicator (.c-scrollind) is the always-visible one. */
.c-settings__opts--scroll {
  max-height: min(56vh, 480px);     /* sanctioned: tall-sheet clearance */
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding-inline-end: var(--spacing-16);   /* room for the indicator */
}
.c-settings__opts--scroll::-webkit-scrollbar { display: none; }
.c-settings__opts-frame { position: relative; }
.c-scrollind {
  position: absolute;
  top: var(--spacing-4);
  bottom: var(--spacing-4);
  inset-inline-end: 0;
  width: 4px;                       /* sanctioned: indicator width */
  border-radius: var(--radius-full);
  background: var(--surface-neutral-03);
  display: none;
}
.c-settings__opts-frame[data-overflow] > .c-scrollind { display: block; }
.c-scrollind__thumb {
  position: absolute;
  top: 0; left: 0; right: 0;
  border-radius: var(--radius-full);
  background: var(--icon-neutral-02);
  touch-action: none;
  cursor: grab;
}
/* a wider invisible grab area, so a finger can catch a 4 px thumb */
.c-scrollind__thumb::before { content: ''; position: absolute; inset: 0 -10px; }
.c-scrollind__thumb[data-drag] { cursor: grabbing; background: var(--icon-neutral-01); }
/* a frame exists only in a long picker SHEET, and on a phone that sheet is always tall */
:root:not([data-desktop]) .c-settings__opts-frame { flex: 1 1 auto; min-height: 0; }
:root:not([data-desktop]) .c-settings__opts-frame > .c-settings__opts--scroll { max-height: none; height: 100%; }
/* ★ L15 (2026-08-31): the slot holds either the platform's emoji or a PNG. The width
   is the same 28px it always was, so no row moves on any platform. */
.c-settings__opt-flag {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;                      /* sanctioned: flag slot */
  line-height: 1;
}
/* ★ L15: ONE box, two fillings. The emoji is a glyph so it is sized by font-size and
   needs no border; the PNG is a picture and gets the hairline, because several of the
   flags are mostly WHITE (jp, id) and without an edge they read as a hole in a light
   sheet. The two are deliberately NOT made to look identical — each is the best version
   of itself on the platform that gets it. */
.c-flag { display: block; }
.c-flag--emoji {
  font-size: 20px;                  /* sanctioned: emoji flag optical size */
  line-height: 1;
}
.c-flag--img {
  width: 20px;                      /* sanctioned: flag artwork box (img/flags/*.png are 40px wide) */
  height: auto;
  border-radius: 2px;               /* sanctioned: flag corner */
  box-shadow: 0 0 0 1px var(--outline-neutral-02);
}
.c-settings__opts-hint {
  margin: 0 0 var(--spacing-8);
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
}
/* ★ S9 L (#1246 L = A): the language note — a tinted card ABOVE the list, outside the
   radiogroup; the link is a real button (verb, not a URL). On a phone the long picker's
   frame keeps filling the tall sheet: the box passes the flex column through. */
.c-settings__opts-box { display: flex; flex-direction: column; min-height: 0; }
:root:not([data-desktop]) .c-sheet[data-tall] .c-settings__opts-box { flex: 1 1 auto; }
.c-settings__opts-note {
  flex: none;
  margin: 0 0 var(--spacing-12);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-4);
  border-radius: var(--radius-12);
  background: var(--surface-sheet-card);
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
}
.c-settings__opts-note-text { margin: 0 0 var(--spacing-4); }
.c-settings__opts-note-link {
  display: inline-flex;
  align-items: center;
  min-height: 40px;                 /* sanctioned: inline text-link hit height (≥ 24 px, WCAG 2.5.8) */
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-link);
  font: inherit;
  font-weight: var(--font-weight-semibold);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) and (pointer: fine) {
  .c-settings__opts-note-link:hover { color: var(--text-link-hover); }
}
.c-settings__opts-note-link:focus-visible {
  outline: var(--outline-width-2) solid var(--outline-action-default);
  outline-offset: 2px;
  border-radius: var(--radius-4, 4px);
}
.c-settings__opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-8);
  min-height: 48px;
  padding: 0 var(--spacing-12);
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  cursor: pointer;
  text-align: start;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-settings__opt:hover { background: var(--surface-interactive-hover); }
}
.c-settings__opt:active { background: var(--surface-interactive-pressed); }
.c-settings__opt-label {
  flex: 1;                          /* #148⑥: keeps the check slot pinned right when a flag leads */
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: start;
}
.c-settings__opt-status {           /* fixed slot: check OR spinner — label never moves */
  flex: none;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-success);
}
.c-settings__opt-check { visibility: hidden; }
.c-settings__opt[aria-checked='true'] { font-weight: var(--font-weight-semibold); }
.c-settings__opt[aria-checked='true'] .c-settings__opt-check { visibility: visible; }
.c-settings__opt[data-loading] .c-settings__opt-check { display: none; }
/* ★ S10 F7 (#1254, Damir pick C): the rich row — a 40 px avatar slot, the label over a sub line, the selected row
   tinted. Only rows built with o.avatar / o.sub carry the modifier; every other picker is unchanged. */
.c-settings__opt--rich {
  gap: var(--spacing-12);
  min-height: 64px;                 /* sanctioned: 40 px avatar + 2 × 12 px */
  padding: var(--spacing-12);
}
.c-settings__opt--rich[aria-checked='true'] { background: var(--surface-action-tonal-default); }
.c-settings__opt-avatar { flex: none; display: flex; width: 40px; height: 40px; }   /* sanctioned: avatar-40 slot */
.c-settings__opt-glyph {            /* the "Everyone" disc — a tonal people glyph */
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;                      /* sanctioned: avatar-40 */
  height: 40px;
  border-radius: var(--radius-full);
  background: var(--surface-action-tonal-default);
  color: var(--icon-action-default);
}
/* ★ S10 #46 r1 (R3-16): on the tinted SELECTED row the disc would be the row's own token and vanish — it takes the
   screen ground instead (disc/row 1.41 light · 1.32 dark; the action glyph on it 6.7 / 7.2 : 1, pins-s10/d-from). */
.c-settings__opt--rich[aria-checked='true'] .c-settings__opt-glyph { background: var(--surface-screen); }
.c-settings__opt-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-2);
}
.c-settings__opt-text > .c-settings__opt-label { flex: none; }
.c-settings__opt-sub {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  font-weight: var(--font-weight-regular);
}

/* —— theme sheet: VISUAL PREVIEW TILES (#147) —— */
.c-settings__themes {
  display: flex;
  gap: var(--spacing-8);
}
.c-settings__theme {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-8);
  padding: var(--spacing-8);
  border: var(--outline-width-1) solid var(--outline-neutral-01);
  border-radius: var(--radius-12);
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color var(--duration-100) var(--easing-standard);
}
.c-settings__theme[aria-checked='true'] { border-color: var(--outline-action-default); }
@media (hover: hover) and (pointer: fine) {
  .c-settings__theme:hover { background: var(--surface-interactive-hover); }
}
.c-settings__theme:active { background: var(--surface-interactive-pressed); }
/* the mini screen — FIXED paints (a preview shows its OWN mode, --surface-qr precedent) */
.c-settings__theme-art {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-4);
  height: 64px;                     /* sanctioned: preview miniature dim */
  padding: var(--spacing-8);
  border-radius: var(--radius-8);
  background: var(--preview-light-surface);
  border: var(--outline-width-1) solid var(--outline-neutral-01);
  overflow: hidden;
}
.c-settings__theme-line {
  height: 6px;                      /* sanctioned: preview miniature bars */
  border-radius: var(--radius-full);
  background: var(--preview-light-line);
}
.c-settings__theme-line:first-child { width: 40%; background: var(--surface-action-default); }
.c-settings__theme-line:nth-child(2) { width: 90%; }
.c-settings__theme-line:nth-child(3) { width: 65%; }
.c-settings__theme[data-mode='dark'] .c-settings__theme-art { background: var(--preview-dark-surface); }
.c-settings__theme[data-mode='dark'] .c-settings__theme-line { background: var(--preview-dark-line); }
.c-settings__theme[data-mode='dark'] .c-settings__theme-line:first-child { background: var(--surface-action-default); }
/* System = diagonal split: light art + a dark wedge clipped over the right half */
.c-settings__theme[data-mode='system'] .c-settings__theme-art {
  position: relative;
}
.c-settings__theme[data-mode='system'] .c-settings__theme-art::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--preview-dark-surface);
  clip-path: polygon(100% 0, 100% 100%, 35% 100%);
}
.c-settings__theme-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-4);
}
.c-settings__theme-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-neutral-01);
  font-size: var(--font-size-label-md);
  font-weight: var(--font-weight-semibold);
}
.c-settings__theme[aria-checked='true'] .c-settings__opt-check { visibility: visible; }
.c-settings__theme[data-loading] .c-settings__opt-check { display: none; }

/* —— avatar sheet —— */
.c-settings__avatar-sheet { display: flex; flex-direction: column; gap: var(--spacing-4); }
.c-settings__avatar-option {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-height: 48px;
  padding: 0 var(--spacing-12);
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  cursor: pointer;
  text-align: start;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-settings__avatar-option:hover { background: var(--surface-interactive-hover); }
}
.c-settings__avatar-option:active { background: var(--surface-interactive-pressed); }
.c-settings__avatar-option svg { color: var(--icon-neutral-02); }
.c-settings__avatar-option[data-destructive] { color: var(--text-error); }
.c-settings__avatar-option[data-destructive] svg { color: currentColor; }

/* —— danger screen (#147 tone split) —— */
.c-settings-danger__body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacing-16);
  padding: var(--spacing-16) var(--spacing-16) var(--spacing-32);
}
/* N5 — the Delete-data screen is RESPONSIVE (Damir, master-worklist). The hub
   keeps its one-line truncating subtitles (the I-11 row-rhythm dial), but on
   THIS screen the sub lines are the safety copy ("Messages go from this
   device…") — they must WRAP, never truncate. Scoped to the danger body so no
   hub row changes. No min-width work is needed: .c-settings__row-label already
   ships min-width:0 (the #140③ class, :235-241) and the other flex hops sit on
   the COLUMN axis — 341-next C1's shrink theory was half-stale (loop rounds
   B-NIT-6 + re-review MINOR-1). */
.c-settings-danger__body .c-settings__row-sub {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
}
.c-settings-danger__cards {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-12);
}
.c-settings-danger__card {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-4);
  padding: var(--spacing-12);
  border: var(--outline-width-1) solid var(--outline-neutral-01);
  border-radius: var(--radius-12);
  background: var(--surface-settings-card);   /* ★ #1007: the danger screen shares the grey ground — its cards go white too */
  cursor: pointer;
  text-align: start;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}

/* c-chip — mirrors Figma chip/{small,large} + code-first selected/disabled
   (docs/chip-search-spec.md, DECISIONS #50). Semantic tokens only. */

.c-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-4);
  border: var(--outline-width-1) solid var(--outline-neutral-04);
  border-radius: var(--radius-16);
  background: var(--surface-neutral-01);
  color: var(--text-neutral-01);
  font-family: var(--font-secondary);
  font-weight: var(--chip-weight);   /* ★ Session I (#735 P.S.) → #1148 (1): 500 (the token) */
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  position: relative;
  /* ★★ #841 / AND-44 (Damir's screenshot, group create): a member chip labelled
     "Androoo 🗻🔥 Androoo Androoo Androoootururururuurru" ran off the screen edge and
     took its remove × with it — the × was clipped away, so the member could not be
     removed. A nick is network-supplied (#140 family), so the guard belongs here rather
     than on any assumption about length.
     THREE declarations, and all three are load-bearing: a flex item's automatic minimum
     size is its MIN-CONTENT, and min-width beats max-width — so without `min-width: 0`
     the cap below is inert against exactly the unbreakable label that causes this. The
     cap is on the CHIP so the label ellipsizes while the × keeps its `flex: none` seat.
     ⚠ THE DEFAULT IS DELIBERATE. A wrapping row must cap; a horizontal SCROLLER must
     not, and the two scrollers opt out at their own definitions (.c-chats-header__filters,
     .c-apps-discover__cats) rather than every wrapping row opting in — #838's lesson: a
     new wrapping container then gets the safe behaviour for free, and a new scroller that
     forgets to opt out shows a clipped label, not an unreachable control. */
  min-width: 0;
  max-width: 100%;
  /* 100ms intentional: micro-interaction, same rationale as chatlist row hover */
  /* transform = the #343 press release; declared here so base.css never has to
     out-specify (and therefore replace) this shorthand — see #346. */
  transition: background-color var(--duration-100) var(--easing-standard),
              color var(--duration-100) var(--easing-standard),
              border-color var(--duration-100) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* extended tap area (#50): chips are 26/30px visual (line-height + 8 padding
   + 2 border), target must be 44 (--size-target-min); pseudo widens the hit
   box vertically without visual change */
.c-chip::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: var(--size-target-min);
  transform: translateY(-50%);
}

.c-chip[data-size="large"] {
  padding: var(--spacing-4) var(--spacing-12);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
}
.c-chip[data-size="small"] {
  padding: var(--spacing-4) var(--spacing-8);
  font-size: var(--font-size-body-xs);
  line-height: var(--line-height-body-xs);
  letter-spacing: var(--tracking-body-xs);
}

.c-chip__icon, .c-chip__dismiss { flex: none; }
/* #841: the label is the ONLY part that gives. `white-space: nowrap` is inherited from
   .c-chip, which is what makes the ellipsis render; min-width: 0 lets this inner flex
   item shrink past its own min-content. Inert until something constrains the chip. */
.c-chip__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* count inside a filter chip (Damir 2026-07-09): a plain trailing NUMBER, sits
   after the label via the chip's flex gap. Muted so the label stays primary; the
   selected chip tints it with the chip text colour (inherits currentColor). */
.c-chip__count { flex: none; font-variant-numeric: tabular-nums; opacity: 0.7; }
.c-chip[aria-pressed="true"] .c-chip__count { opacity: 1; }

/* readonly (display) variant — non-interactive tags e.g. app permissions/capabilities */
.c-chip[data-readonly] {
  cursor: default;
  background: var(--surface-neutral-02);
  border-color: transparent;
  color: var(--text-neutral-01);
}
.c-chip[data-readonly] .c-chip__icon { color: var(--icon-neutral-02); }
.c-chip[data-readonly]::after { content: none; }   /* no expanded hit area — it's not a target */

/* selected (toggle chips) — #50, Damir 2026-07-02: TONAL fill ("not too strong"),

   ★ I-2 (#358): the selected chip now carries an OUTLINE — a selected chip and a
   tonal button both paint --surface-action-tonal-default, so "selected" and
   "button" rendered identically (same disease as D-16 fix C, one ramp step
   apart). The outline is a state ladder (default/hover/pressed). The border
   SLOT already exists on every chip (--outline-width-1, transparent when
   unused), so no layout shift — the #51 lesson.
   ★ Loop r1 MAJOR-6: the selected PRESS keeps the DEFAULT fill — the old
   tonal-pressed fill put the pressed outline at 2.31:1 in dark (200-on-500),
   under the 1.4.11 bar exactly when the outline is doing its job. Press
   feedback = outline default→pressed + ink + the #343 scale; the fill holds.
   (Dial rider on the F5 checklist: say if the press wants its wash back.)
   ★ Loop r1 MAJOR-7: every hover/active pair carries the SAME :not() chain —
   the old ladder claimed "source order at equal specificity" while hover
   out-specified active by one pseudo-class, so the pressed rung never painted
   on a mouse. :not([data-readonly]) also stops display-tag chips (spans — they
   match :active) from wearing the selected skin (loop r1 MINOR).
   Contrast, non-text ≥3:1 (WCAG 1.4.11), executable in smoke (#358 pins):
   light rest 600-on-100 = 4.73 · hover 700-on-200 = 6.28 · press 800-on-100 = 9.67
   dark  rest 400-on-800 = 5.47 · hover 300-on-600 = 3.44 · press 200-on-800 = 8.62 */
.c-chip[aria-pressed="true"] {
  background: var(--surface-action-tonal-default);
  border-color: var(--outline-action-default);
  color: var(--text-action-default);
}

@media (hover: hover) and (pointer: fine) {

    color: var(--text-action-hover);

  .c-chip[aria-pressed="true"]:not(:disabled):not([data-readonly]):hover {
    background: var(--surface-action-tonal-hover);
    border-color: var(--outline-action-hover);   /* I-2 (#358): ladder, not transparent */
    color: var(--text-action-hover);
  }
}

/* pressed AFTER hover — same specificity as its hover twin, later in source */
.c-chip:not(:disabled):not([data-readonly]):active {
  background: var(--surface-action-tonal-default);
  border-color: var(--outline-action-pressed);
  color: var(--text-action-pressed);
}
.c-chip[aria-pressed="true"]:not(:disabled):not([data-readonly]):active {
  background: var(--surface-action-tonal-default);   /* r1 MAJOR-6: fill holds — see header */
  border-color: var(--outline-action-pressed);       /* I-2 (#358): ladder, not transparent */
  color: var(--text-action-pressed);
}
