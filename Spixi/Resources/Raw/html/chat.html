         and pushes from updateScreen (:651) BEFORE loadMessages zeroes this chat's own
         unread inside Task.Run (:691) — so the first push after opening the only chat
         with unread messages would light "unread ELSEWHERE" for ~1s. Post-load pushes
         are the trustworthy ones. */
      if (loadPhase) return;
      const next = (Number(n) || 0) > 0;
      if (next === unreadElsewhere) return;
      unreadElsewhere = next;
      renderTopbar();
    },

    /* ——— payments (view-only, wired) ————————————————————————————————————————
     * addPaymentRequest is the 14-arg legacy shape (xaml.cs:1310/1361):
     *   (id, txid, address, nick, avatar, title, amount, status, statusIcon,
     *    time, localSender, confirmed, read, enableView)
     * `title` + `status` are C#-LOCALIZED strings; `statusIcon` is the stable
     * signal we map to the status enum. localSender ("True"/"") → direction. */
    addPaymentRequest(id, txid, address, nick, avatar, title, amount, status, statusIcon, time, localSender, confirmed, read, enableView) {
      /* #529 ghost guard: a CANCELED (msgDelete-blanked) request re-pushes with an
       * EMPTY amount and no txid on reload — render nothing, not an empty card.
       * ('?' = live tx-fetch placeholder, NOT empty — untouched.) */
      if (isRequestTitle(title || '') && !String(amount == null ? '' : amount).trim() && !txid) {
        dbg('addPaymentRequest: blanked request skipped', id);
        return;
      }
      upsertPayment(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        title: title || '', amount: amount,
        pstatus: paymentStatusFrom(statusIcon),
        txid: txid || '', enableView: asBool(enableView),
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },

    /* ——— W5/W6 money-compose plumbing (#523) ——— */
    // W6 answer to ixian:feeQuery — routed to the OPEN in-chat compose only.
    setSendQuote(addr, amount, fee, balance, max, error) {
      // the echo pair rides along — the component drops a stale answer (loop MAJOR)
      if (chatSendView) { applySendQuote(chatSendView, { fee, balance, max, address: addr, amount, error }); return; }
      // ★ W-d: no compose open → the request-in review sheet is the only other asker
      if (chatPayReview) { chatPayReview.setQuote({ fee, balance, address: addr, amount, error }); return; }
      dbg('setSendQuote (no compose)');
    },
    // W5 outcome: 'ok' → success morph · 'cancel' → silent re-enable · else fail(msg).
    signSendResult(status, message) {
      clearSendWait();
      const c = chatSendCtrl;
      if (!c) { dbg('signSendResult (no pending review)'); return; }
      chatSendCtrl = null;
      const st = String(status || '');
      if (st === 'ok') { c.done(); return; }
      if (st === 'cancel') { c.fail(''); return; }
      // loop MAJOR fix: an empty fail is NOT a cancel — null routes to the
      // component's default error copy instead of the silent branch.
      const m = String(message || '');
      c.fail(m === '' ? null : m);
    },
    // ★ B2: the cancel-invite outcome. 'ok' needs nothing (the card is already the
    // tombstone). 'fail' (not my invite / bot / unknown id) → undo the tombstone, say so.
    cancelInviteResult(id, status) {
      const lid = String(id || '');
      if (String(status || '') === 'ok') {
        // loop r2 R2-5 (the #376 loop B-2 rule): this verb HAS an ack, so the success
        // toast waits for it — an optimistic green toast beside a red failure was the
        // exact contradiction that rule exists for. The toast is also the announcement
        // (r1 m-3): the modal's opener was re-rendered away, focus context is gone.
        try { showToast({ text: (window.SL && window.SL.inviteCanceled) || 'Invite canceled', tone: 'success', host: overlayHost, strings: window.SL || {} }); } catch (e) { /* toast optional */ }
        return;
      }
      if (canceledApps.delete(lid)) { saveCanceledApps(); renderLog(); }
      try { showToast({ text: (window.SL && window.SL.cancelInviteFailed) || 'The invite could not be canceled.', tone: 'error', host: overlayHost, strings: window.SL || {} }); } catch (e) { /* toast optional */ }
    },
    // payRequest outcome (request-in card). 'ok' needs nothing — the status pushes
    // flip the card. 'cancel'/'fail' re-render to release the Pay oneShot latch.
    payRequestResult(id, status, message) {
      const st = String(status || '');
      const msg = String(message || '');
      // ★ W-d: the review sheet is open → resolve IT (the signSendResult grammar).
      // Loop r1 B-7: only for ITS card — a result for another id is not ours.
      if (chatPayCtrl && chatPayId && String(id) === chatPayId) {
        clearPayWait();
        const c = chatPayCtrl;
        chatPayCtrl = null;
        if (st === 'ok') { c.done(); return; }
        if (st === 'cancel') { c.fail(''); return; }
        // loop r1 A-1: 'gone' = C# found the request unpayable (settled elsewhere,
        // not found, group/bot, zero) — NOT a user cancel; say so, never silence
        if (st === 'gone') { c.fail(msg || (window.SL && window.SL.payRequestGone) || 'This request can no longer be paid.'); return; }
        c.fail(msg === '' ? null : msg);
        return;
      }
      if (st === 'ok') return;
      renderLog();
      if (st === 'gone') {
        try { showToast({ text: msg || (window.SL && window.SL.payRequestGone) || 'This request can no longer be paid.', tone: 'error', host: overlayHost, strings: window.SL || {} }); } catch (e) { /* toast optional */ }
        return;
      }
      if (st === 'fail' && msg) {
        try { showToast({ text: msg, tone: 'error', host: overlayHost, strings: window.SL || {} }); } catch (e) { /* toast optional */ }
      }
    },

    // Request-status update (xaml.cs:1665): (msg_id, txid, status, statusIcon,
    // enableView). Patches the card in place (re-render); ignores unknown ids.
    updatePaymentRequestStatus(id, txid, status, statusIcon, enableView) {
      id = String(id);
      const rec = model.get(id);
      if (!rec || rec.kind !== 'payment') { dbg('updatePaymentRequestStatus: unknown', id); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      if (txid) {
        if (rec.txid && rec.txid !== String(txid)) txIndex.delete(rec.txid); // drop stale key on re-key (N1)
        rec.txid = String(txid); txIndex.set(rec.txid, id);
      }
      rec.enableView = asBool(enableView);
      renderLog();
    },

    // Direct-payment status update (xaml.cs:1648): (txid, status, statusIcon) —
    // keyed by TXID, so resolve via txIndex.
    updateTransactionStatus(txid, status, statusIcon) {
      const id = txIndex.get(String(txid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateTransactionStatus: unknown txid', txid); return; }
      rec.pstatus = paymentStatusFrom(statusIcon);
      renderLog();
    },

    /* FILE transfer create (chat.js addFile:904, 13-arg). me/sent/read/paid are
     * the .NET bool strings; nick/address feed the group sender label/avatar. */
    addFile(id, address, nick, avatar, fileid, name, time, me, sent, read, progress, complete, paid) {
      upsertFile(id, toMs(time), asBool(me) ? 'sent' : 'received', fileid, name,
        fileStateFrom(me, progress, complete), progress,
        { senderNick: resolveNick(address, nick), senderAddress: address || '' });
    },

    /* FILE transfer progress/complete (chat.js updateFile:1009, keyed by fileid).
     * Update the record + the live row in place (setFileProgress handles the
     * bar AND the progress→complete flip, re-arming the open action). */
    updateFile(fileid, progress, complete) {
      const id = fileIndex.get(String(fileid));
      const rec = id && model.get(id);
      if (!rec) { dbg('updateFile: unknown fileid', fileid); return; }
      const prev = rec.fstate;
      const done = asBool(complete) || (Number(progress) || 0) >= 100;
      rec.progress = Number(progress) || 0;
      // #334 loop MINOR-1: the FIRST updateFile tick = the peer accepted — latch
      // it on the MODEL so a full re-render can never resurrect the Cancel
      // affordance mid-transfer (integer progress floors at 0 on big files, so
      // a progress>0 gate alone lost to renderLogNow rebuilds).
      rec.transferStarted = true;
      // BOTH directions tick then flip to complete (Damir F5: outgoing shows
      // progress too — the sender gets per-packet ticks, TransferManager:410).
      rec.fstate = done ? 'complete' : 'progress';
      const row = rows.get(id);
      // setFileProgress mutates a row that is ALREADY in 'progress' (bar tick +
      // the progress→complete flip). A structural change (offer→progress etc.)
      // has no track to grow, so rebuild the row from the model instead.
      if (row && prev === 'progress') setFileProgress(row, rec.progress, { state: rec.fstate });
      else renderLog();
      // slick completion cue for OUTGOING transfers (Damir F5): a one-shot success
      // toast the moment a sent file finishes (the bar + open button carry the rest).
      if (done && prev !== 'complete' && rec.direction === 'sent' && !rec.sentToastShown) {
        rec.sentToastShown = true;
        showToast({ text: (window.SL && window.SL.fileSent) || 'File sent', tone: 'success', host: overlayHost, strings: window.SL || {} });
      }
    },

    // CALL event (chat.js addCall:1496): (id, text, declined, time) + C4 trailing
    // args: outgoing ("True"/"False" — message.localSender), missed (declined AND
    // incoming; carried for future no-answer-vs-missed styling — the call-back
    // nudge intentionally still shows for BOTH, legacy parity), durationSecs (raw
    // seconds, "" unless answered+ended). Old exe → all three undefined: side
    // defaults to received and the duration falls back to the "(m:ss)" embedded
    // in the localized label, exactly as before.
    addCall(id, text, declined, time, outgoing, missed, durationSecs, declinedLocally) {
      const isDeclined = asBool(declined);
      /* ★ #572 ④: the 8th arg (ADDITIVE) says THIS device turned the call down.
       * The 3rd arg `declined` is C#'s lossy "never connected" — true for a call
       * that simply rang out too — so it cannot carry this on its own. Undefined on
       * an older exe → false, and the card keeps its present missed rendering. */
      const isDeclinedLocal = declinedLocally === undefined ? false : asBool(declinedLocally);
      const raw = String(text || '');
      // C4 raw seconds win; legacy "(m:ss)"-in-label is the fallback
      let dur = '';
      const secs = parseInt(durationSecs, 10);
      if (!isDeclined && !isNaN(secs) && secs >= 0) {
        dur = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
      }
      if (!dur) dur = isDeclined ? '' : ((raw.match(/\((\d+:\d{2})\)/) || [])[1] || '');
      // strip a trailing "(m:ss)" so the label is just the wording; the duration
      // is rendered separately by the card
      const label = raw.replace(/\s*\(\d+:\d{2}\)\s*$/, '').trim();
      upsertCall(id, toMs(time), isDeclined, label, dur,
        outgoing === undefined ? undefined : asBool(outgoing), isDeclinedLocal);
    },

    // REACTIONS (chat.js addReactions:549) — ;-joined "key:count". Store on the
    // record (so re-renders keep them) + apply to the live row with a pop. The
    // bridge re-emits the FULL list each time, so parse-replace is correct.
    // C5: trailing `own` arg = ;-joined keys the local user reacted with
    // (undefined on an old exe → myLikes fallback inside parseReactions).
    addReactions(id, reactions, own) {
      const rec = model.get(String(id));
      if (!rec) { dbg('addReactions: unknown', id); return; }
      const parsed = parseReactions(reactions, id, own);
      rec.reactions = parsed.reactions;
      rec.tip = parsed.tip;
      rec.seenCount = parsed.seenCount;               // ★★ L2 (#641): the long-press detail
      rec.downloadedCount = parsed.downloadedCount;   // ★ file cards
      const row = rows.get(String(id));
      if (row) {
        if (rec.reactions.length || rec.tip) applyRowReactions(rec, row, true);
        else applyReactions(row, { reactions: [] });   // cleared → remove pills
      }
    },
    // full participant roster (SingleChatPage.loadContacts → addContact per member,
    // xaml:474; args = address, nick, avatar, role). Blind groups mask address to
    // "[Unknown]" with a unique nick → key those by nick so they don't collapse.
    // Feeds the chat-info member list (Damir 2026-07-08; was a no-op stub — corrects
    // be-cutover CI1: this roster push already existed on the frozen bridge).
    // D-5 (#366): C# sends 5 args now (role — always sent, kept opaque/unused —
    // then the trailing relation). The old 3-param signature dropped both.
    addContact(address, nick, avatar, role, relation) {
      const addr = String(address || '');
      if (!addr) return;
      const key = addr === '[Unknown]' ? ('blind:' + (nick || '')) : addr;
      /* D-19b (#370): a blind-masked row whose "nick" is the legacy
         "x"+<address> pseudo-key must not DISPLAY that value — it is the
         address the mask hides. The raw value stays in `key` (stable per-member
         identity); the display name goes empty, so the member list shows the
         placeholder and the @-mention sources skip the row. */
      const displayNick = (addr === '[Unknown]' && isPseudoAddressNick(nick)) ? '' : (nick || '');
      const raw = avatar ? String(avatar).replace(/\\/g, '/') : '';
      const av = raw && !/spixiavatar\.png$|spixi-group-avatar\.png$/.test(raw) ? raw : null;
      const prev = groupRoster.get(key) || {};
      groupRoster.set(key, {
        address: addr, name: displayNick || prev.name || '', avatar: av || prev.avatar || null,
        relation: RELATIONS.has(relation) ? relation : (prev.relation || ''),
      });
      invalidateMentions();                // roster nick changed → rebuild the mention name list
      if (chatInfoOpen) scheduleChatInfoRefresh();
    },
    // #248 (Damir item 3): the group/bot OWNER address — the in-chat takeover's
    // member list marks the matching row with an "Owner" chip. Never pushed for
    // blind groups (C# suppresses it — the address would de-anonymize).
    setGroupOwner(address) {
      const next = String(address || '');
      const changed = next !== groupOwner;
      groupOwner = next;
      /* N34 (#365): the push normally precedes the message burst (onLoad order),
       * so this is a no-op. A late or changed value repaints the log once so
       * the Owner chips stay honest (renderLog is coalesced). */
      if (changed && model.size) renderLog();
      if (chatInfoOpen) scheduleChatInfoRefresh();
    },
    // incoming contact request (xaml:1196) → accept/decline pane above composer.
    // Q1 review (#267 loop): terminal once accepted — a late push (C# re-evaluates
    // the pending state on its own schedule) must not re-arm the pane over a
    // composer the user just unlocked.
    showContactRequest() { if (requestResolved) return; showRequestPane(); },
    // reveal the topbar call action (C# gates when a call is possible, xaml:583)
    /* ★★ ROUND 3 (review3-cs MAJOR-2): the call cards read `callVisible` too, and this
     * push can land AFTER a history burst has already painted them (C# sends it before
     * loadMessages today, but the order is C#'s to change). Repaint the log once when
     * the flag actually turns on, so a card painted early is not left without its
     * "Call back" link for the session. The N34 groupOwner handler uses this pattern. */
    showCallButton() {
      const changed = !callVisible;
      callVisible = true;
      renderTopbar();
      if (changed && model.size) renderLog();
    },
    /* ★★ ROUND 3 (review3-cs MAJOR-2): C#'s refusal, said out loud. The old start leg
     * logged and pushed nothing, so a tap on a live-looking control did nothing, for
     * ever. `reason` ∈ {unavailable, busy} — a token, not a sentence, so the wording
     * stays in the shell dictionary. */
    callRefused(reason) { showCallRefusal(reason); },
    // APP invite/session card (chat.js addAppRequest:1174). appStatus ∈
    // {Missing, Minimized, else} — already enum-shaped. Reuses installApp/joinApp.
    // ⚠ GLOBAL NAME COLLISION (Batch A): displayAppRequests also pushes a 4-arg
    // addAppRequest(sessionIdHex, text, ok, cancel) — a MINI-APP session request
    // (SpixiContentPage.cs:1368), a different message on the same global. Legacy
    // never rendered it (spixi.js:247 body is a commented-out TODO) → discriminate
    // by arg count and ignore the short form, or it corrupts the invite renderer.
    // NOTE: arg 10 is message.confirmed (xaml.cs:1591) — NOT `sent`. Unused today;
    // named correctly so nobody wires a delivery tick to the wrong flag.
    addAppRequest(id, appid, appname, appimage, address, nick, avatar, time, localSender, confirmed, read, appStatus, appInstallURL) {
      if (arguments.length <= 4) { dbg('addAppRequest: 4-arg mini-app session request — ignored (legacy parity)'); return; }
      upsertApp(id, toMs(time), asBool(localSender) ? 'sent' : 'received', {
        appid: appid, name: appname, iconUrl: appimage || null,
        astate: appStateFrom(localSender, appStatus),
        appInstallURL: appInstallURL || '',
        senderNick: resolveNick(address, nick), senderAddress: address || '',
      });
    },
    // installed multi-user apps (loadApps, xaml:1088 — addApp(id,name,icon,publisher))
    // → the attach "App invite" picker. icon path doesn't resolve in-shell → omitted.
    addApp(id, name, icon, publisher) { chatApps.push({ id: String(id), name: name || String(id), publisher: publisher || '' }); },
    clearApps() { chatApps.length = 0; },
    // BOT CHANNELS (chat.js:1353/250/1345). setSelectedChannel names the current
    // channel + reveals the bar; addChannelToSelector rows arrive (pull-on-open)
    // into the live sheet; setChannelSelectorStatus flags any-channel-unread.
    addChannelToSelector(index, name, icon, unread) {
      const ch = { index: Number(index) || 0, name: name || '', icon: icon || '', unread: asBool(unread) };
      channelList.push(ch);
      if (channelSheetBody) {
        const ph = channelSheetBody.querySelector('.chat-channel-list__empty');
        if (ph) ph.remove();
        channelSheetBody.append(makeChannelRow(ch));
      }
    },
    setSelectedChannel(index, icon, name) {
      channelState.has = true;
      channelState.index = Number(index) || 0;
      channelState.icon = icon || '';
      channelState.name = name || '';
      // A3: a channel switch is a NEW message stream — C# pushes setSelectedChannel
      // and THEN loadMessages() (clearMessages → burst), on both the initial load and
      // a switch. onChatScreenReady does NOT re-fire, so without this reset the spent
      // latch (and a stale boundary id matching no row) would kill the divider in
      // every channel after the first.
      resetUnreadBoundary();
      /* A1: same reasoning — a channel switch is a new stream and onChatScreenReady
         does not re-fire, so an in-flight loadmore's spinner/anchor from the
         previous channel must not survive into this one. The incoming
         clearMessages then sets showOlder correctly for the new channel.
         (Note for the record: C# does NOT reset messagesToShow on a channel switch
         (:249-256 calls loadMessages() with the grown window), so an expanded
         window carries across channels. The pill simply reflects that faithfully.) */
      resetOlder();
      setStlUnread(0);   // N53: the counter must not carry across bot channels (a switch = a new room)
      renderTopbar();
    },
    // "true" ⇒ all read; anything else (incl. "") ⇒ unread (legacy chat.js:1345)
    setChannelSelectorStatus(status) {
      channelState.unread = String(status) !== 'true';
      renderTopbar();
    },
    // A participant's nick resolved/changed (chat.js:1233). Update every row from
    // that sender address + re-render so their label refreshes. Also store it so
    // later rows from an as-yet-unseen address get the right name on arrival.
    updateGroupChatNicks(address, nick) {
      const addr = String(address || '');
      if (!addr) return;
      groupNicks.set(addr, nick || '');
      invalidateMentions();                // a resolved sender nick joins the mention name list
      let touched = false;
      for (const rec of model.values()) {
        if (rec.senderAddress === addr && rec.senderNick !== (nick || '')) {
          rec.senderNick = nick || '';
          touched = true;
        }
      }
      if (touched) renderLog();
    },
    // ⑪ pending-outgoing lock (was a dbg stub — the push died and the composer
    // stayed live). "1" on load while RequestSent; "0" from updateScreen the
    // moment the peer accepts (state → Approved). See the setComposerLock docblock.
    // Q1 review (#267 loop): "0" is now the UNIVERSAL unlock — C#'s updateScreen
    // sets _waitingForContactConfirmation in BOTH pending branches, so any
    // pending→Approved transition pushes it exactly once, whoever accepted and
    // wherever (in-chat, the chats-list card, or the peer's side). It therefore
    // clears ANY lock (not just 'outgoing'), drops the request pane, and latches —
    // it was clearing only 'outgoing', so an 'incoming' lock accepted from the
    // desktop chats list stayed hidden behind a stale pane for the whole session
    // (updateScreen pushes NOTHING for a freshly-approved OFFLINE peer, xaml:1884).
    showRequestSentModal(flag) {
      const on = String(flag) === '1' || asBool(flag);
      // #275 review A1 (belt): never take the 'outgoing' lock for a group/bot —
      // mirrors the heartbeat lock's !mode.isMulti guard. A non-approved GROUP
      // reaching this push would show "Waiting for {group}…" + a Cancel that fires
      // ixian:undorequest → removeFriend WITHOUT sendLeave. C# now excludes
      // FriendType.Group from the push too; this is defense-in-depth.
      if (on) { if (!mode.isMulti) setComposerLock('outgoing'); return; }
      markRequestResolved();
    },
    // M16 (#59 DECIDED): the two known "Connecting…" strings (matched against
    // their *SL-substituted carriers — locale-proof) render as a topbar
    // TITLE-STATE (presence sub swap); the banner is kept for ACTIONABLE /
    // unrecognized warnings only. Empty text clears BOTH (C# sends "" once
    // connected — xaml:1929; the same clear also closes any actionable banner,
    // exactly as before). warningDisplayed is one C#-side flag, so a
    // connectivity state and a banner never coexist.
    showWarning(text) {
      const t = String(text || '').trim();
      const isConn = !!t && CONNECTIVITY_TEXTS.has(t);
      const next = isConn ? t : '';
      if (next !== connectivitySub) {
        connectivitySub = next;
        // update the LIVE sub in place (audit A-2): a full topbar rebuild
        // recreates the aria-live region, and screen readers do not announce
        // content that ships inside a freshly-inserted live region — mutating
        // the existing node is what makes "Connecting…" audible. Later rebuilds
        // (presence/nick pushes) recompose the same text via topbarSubText().
        if (topbarHost.querySelector('.c-topbar__sub')) {
          setTopbarSub(topbarHost, topbarSubText(mode.isBot && channelState.has));
          /* ★ N19 (#428): this branch deliberately does NOT rebuild the bar (the
             aria-live node must survive), so the line has to be toggled in place
             here as well as in renderTopbarNow. Both read the same
             `connectivitySub`, so they cannot disagree. */
          const bar = topbarHost.querySelector('.c-topbar');
          if (bar) {
            if (connectivitySub) bar.setAttribute('data-connecting-bar', '');
            else bar.removeAttribute('data-connecting-bar');
          }
        } else {
          renderTopbar();   // no sub yet (pre-first-paint edge) → normal rebuild
        }
      }
      setWarning(warningBanner, isConn ? '' : (text || ''));
    },

    /* N51 (the N50/#370 grammar applied to chat): OS back routed INTO the shell
       while the mirror below reports an open overlay. Arm order = the edge-swipe
       precedent (#328): the hand-rolled channel selector first (it is NOT on the
       shared stack), then the shared overlay stack (sheets/menus/modals render
       above the selection bar), then select mode — the natives' order. Self-heal:
       nothing actually open (stale mirror) → re-sync so the next back pops the
       conversation instead of wedging (the N50 cdBack grammar). */
    chatBack() {
      if (channelDropdown) { closeChannelSelector(); return; }
      const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
      if (dismiss && dismiss()) return;
      if (chatSendView) { closeSendTakeover(); return; }   // loop MAJOR fix: the cover before select mode
      if (chatSelect) {
        // #376 loop A-1 belt: a dead handle must not eat the press with no heal —
        // verify the selection is LIVE on the DOM before exiting through it.
        if (box.dataset.selecting === undefined) { chatSelect = null; syncChatOverlay(); return; }
        exitChatSelect();
        return;
      }
      syncChatOverlay();
    },
  };

  /* ★★★ ONE WIRE, NOT THREE (round 2, surviving mutations X1, X2, X8).
     Round 1 pushed the composer ⊕ state from three handlers. Each call site was a
     separate line that a single deletion could remove, and the suite read none of them:
     deleting the one in `setChatMode` hid the ⊕ for the whole session in every room.
     The state is DERIVED instead. Every C#→JS handler runs through this one wrapper, and
     the wrapper re-derives the ⊕ after the handler returns. A new handler that changes
     the room, the peer or a capability needs no new call.
     `finally`, so a handler that throws still leaves the ⊕ honest.
     ⚠ Delete this wrapper and the ⊕ freezes at its boot state in every room. */
  const syncedHandlers = {};
  for (const name of Object.keys(handlers)) {
    const fn = handlers[name];
    syncedHandlers[name] = typeof fn !== 'function' ? fn : function (...args) {
      try {
        return fn.apply(this, args);
      } finally {
        /* Best-effort, and deliberately so: this wrapper sits on EVERY C# push, and a
           throw here would replace the handler's own result. `composerEl` is assigned
           far below this line, so a push that lands before the composer is built reads
           it in its temporal dead zone. */
        /* ★ round 3 MINOR-4: a ONE-OFF throw is healed by the next push, and a throw
           that REPEATS freezes the ⊕ for the whole session. Say so on the debug
           channel, or the device report reads "the ⊕ never appears" with a clean log. */
        try { syncAttachAffordance(); } catch (e) { dbg('syncAttachAffordance threw', e && e.message); }
      }
    };
  }
  bridge.exposeAll(syncedHandlers);

  /* N51: mirror the shell's overlay-stack state to C# so Android back closes the
     TOP overlay (an overlay.js sheet, the hand-rolled channel selector, select
     mode) instead of popping the whole conversation — chat is a HomePage overlay
     (#225), so its in-document surfaces are invisible to C#. The exact
     contact_details recipe (N50): coalesced through a zero-timeout so an
     open→close flurry sends one line. channelDropdown + chatSelect live OUTSIDE
     the shared overlay stack (no body[data-overlay-open]), so they join the
     predicate and their open/close sites call syncChatOverlay() explicitly. */
  let chatOverlaySyncT = 0;
  function chatOverlayLive() {
    // #376 loop A-2: the reactions inspect sheet hosts on #messages (applyReactions
    // passes host: box), so its data-overlay-open lands on BOX, not body. Dead
    // today (only ❤️ ships, the "+N" trigger can't render), but the C8 emoji batch
    // lights it up — cover the host now so the hole can't reopen silently.
    return document.body.dataset.overlayOpen !== undefined
      || box.dataset.overlayOpen !== undefined
      || !!channelDropdown || !!chatSelect
      || !!chatSendView;                               // loop MAJOR fix: the money cover consumes back too
  }
  function syncChatOverlay() {
    if (chatOverlaySyncT) return;
    chatOverlaySyncT = setTimeout(() => {
      chatOverlaySyncT = 0;
      try { bridge.send('ixian:chatoverlay:' + (chatOverlayLive() ? '1' : '0')); } catch (e) {}
    }, 0);
  }
  try {
    new MutationObserver(syncChatOverlay).observe(document.body, { attributes: true, attributeFilter: ['data-overlay-open'] });
    new MutationObserver(syncChatOverlay).observe(box, { attributes: true, attributeFilter: ['data-overlay-open'] });   // loop A-2: the box-hosted sheet
  } catch (e) {}

  // Do NOT paint the empty log now — that produced a spinner → empty-notice →
  // full-conversation sequence (the residual flicker Damir felt after the burst
  // gate). Instead the BOOT SPINNER stays until the first real render:
  // onChatScreenLoaded paints the whole history in ONE go. A short fallback
  // (armed at ready) covers a brand-new empty chat or a missing signal so the
  // spinner never sticks — but never paints mid-burst (guarded on !bursting).

  /* —— scroll-to-latest affordance (appears when scrolled up) ——————————————— */
  const stl = createScrollToLatest({ target: box });
  box.closest('.c-chat-canvas').append(stl);

  /* N53: feed the chevron's unread badge (setScrollLatestCount shipped in #74 and
   * was never fed). Counts every INCOMING row created while the user is scrolled
   * up; the load burst is excluded (history streaming is not "new"), and the read
   * happens at upsert time — before the coalesced render — so it reflects the
   * position the user was actually reading at. Reset: back at the bottom (scroll
   * listener below), per peer (onChatScreenReady) and per bot channel
   * (setSelectedChannel — the counter must not carry across rooms). */
  let stlUnread = 0;
  let stlFlushQuietUntil = 0;   // loop B-1: re-flush quiet window (set by clearMessages)
  function setStlUnread(n) {
    stlUnread = n;
    setScrollLatestCount(stl, n, window.SL || {});
  }
  function noteArrival(existing, rec) {
    if (existing || bursting) return;                    // update or history stream — not an arrival
    /* #376 loop B-1 (MAJOR): `bursting` alone is NOT a complete flush gate — the
       load-more and reloadScreen paths never push onChatScreenLoaded, so their
       burst can only end by the 250ms idle timer, and ONE main-thread stall
       mid-stream (GC, a data-URI decode) flips it while rows are still coming.
       clearMessages wipes the model, so every re-flushed row is a CREATE — with
       the user held scrolled-up by applyOlderAnchor, the badge counted requested
       HISTORY as unread. Belt: a 5s quiet window after every clearMessages (the
       A3 loadPhase window precedent). Fails SAFE: a live arrival inside the
       window is missed by the badge (the chevron still shows), never miscounted. */
    if (Date.now() < stlFlushQuietUntil) return;
    if (rec && rec.direction === 'sent') return;         // own sends stick to the bottom anyway
    // loop B-9: an old exe's addCall carries no `outgoing` arg → no direction —
    // never count a directionless call row (it may be the user's own).
    if (rec && rec.kind === 'call' && !rec.direction) return;
    if (nearBottom()) return;                            // visible on arrival — nothing unread
    setStlUnread(stlUnread + 1);
  }
  box.addEventListener('scroll', () => {
    /* #376 loop B-5: clear at the CHEVRON's own threshold (200px, scroll-latest.js
       SHOW_THRESHOLD), not nearBottom's half-viewport — the badge must not vanish
       while three bubbles are still below the fold. Count-side stays nearBottom():
       inside that band renderLogNow sticks to the bottom on arrival (same
       predicate), so the pairing is coherent. */
    if (stlUnread && box.scrollHeight - box.scrollTop - box.clientHeight <= 200) setStlUnread(0);
  }, { passive: true });

  /* —— @ jump-to-mention FAB (#8, premium mentions #210) ————————————————————
   * Sits bottom-right, ABOVE the scroll-to-latest chevron. Appears ONLY when a
   * message mentioning the LOCAL user is off-screen; tap smooth-scrolls to the
   * nearest such message + pulses it. Identifying "me" needs the local nick,
   * which C# does not push to the chat yet — so this stays hidden until
   * SelfNick lands (be-cutover); highlight-all + the picker work regardless. */
  const mentionFab = document.createElement('button');
  mentionFab.type = 'button';
  mentionFab.className = 'chat-mention-fab';
  mentionFab.setAttribute('aria-label', (window.SL && window.SL.jumpToMention) || 'Jump to mention');
  if (window.SpixiIcons && window.SpixiIcons.icon) mentionFab.append(window.SpixiIcons.icon('at', { size: 22 }));
  else mentionFab.textContent = '@';
  const mentionFabBadge = document.createElement('span');   // count of unseen mentions (Telegram-style)
  mentionFabBadge.className = 'chat-mention-fab__badge u-tabular';
  mentionFabBadge.setAttribute('aria-hidden', 'true');       // count lives in the button aria-label
  mentionFabBadge.hidden = true;
  mentionFab.append(mentionFabBadge);
  box.closest('.c-chat-canvas').append(mentionFab);

  /* Cycle-with-count behaviour (Telegram-style, Damir 2026-07-09). The FAB counts
   * EVERY mention of ME the user hasn't SEEN yet — regardless of where it sits in the
   * history — and, per tap, jumps to the NEWEST unseen one first (the most recent @you,
   * usually the nearest scroll), pulsing it; each subsequent tap steps to the next-older
   * unseen (Damir: jumping to the earliest first felt backwards). A mention becomes
   * "seen" once it scrolls into view (or is jumped to). The seen set is PERSISTED per
   * peer (localStorage, same pattern as myLikes/loadedMedia) so a caught-up mention does
   * not resurface on the next open — mirrors Telegram's durable unread-mention marker.
   * No baseline seed: on first open, all not-yet-seen mentions (anywhere in the log)
   * surface, which IS the desired catch-up. */
  const mentionSeen = new Set();      // message ids whose @me has been seen (persisted per peer)

  /* does a message text @-mention the LOCAL user? (boundary-checked, case-insensitive) */
  function textMentionsMe(text) {
    const keys = mentionCtx().self;
    if (!keys.length || !text || text.indexOf('@') < 0) return false;
    const low = text.toLowerCase();
    const isWord = (c) => c && /[\p{L}\p{N}_]/u.test(c);
    for (const k of keys) {
      const key = String(k).toLowerCase();
      if (!key) continue;
      let i = low.indexOf('@' + key);
      while (i !== -1) {
        const before = i > 0 ? low[i - 1] : '';
        const after = low[i + 1 + key.length] || '';
        if (!isWord(before) && before !== '@' && !isWord(after)) return true;
        i = low.indexOf('@' + key, i + 1);
      }
    }
    return false;
  }
  function mentionIdsOrdered() {                         // chronological (oldest → newest)
    const out = [];
    for (const id of order) { const rec = model.get(id); if (rec && textMentionsMe(rec.text)) out.push(id); }
    return out;
  }
  function mentionRowVisible(row) {
    const br = box.getBoundingClientRect(); const rr = row.getBoundingClientRect();
    return rr.bottom > br.top && rr.top < br.bottom;
  }
  function updateMentionFab() {
    if (!mentionFab) return;
    if (!mentionCtx().self.length) { mentionFab.removeAttribute('data-visible'); return; }
    const ids = mentionIdsOrdered();
    let changed = false;
    for (const id of ids) {                              // mark any now-visible mention seen
      const row = rows.get(id);
      if (row && row.isConnected && mentionRowVisible(row) && !mentionSeen.has(id)) {
        mentionSeen.add(id); changed = true;
      }
    }
    if (changed) saveMentionSeen();                      // persist catch-up progress
    const unseen = ids.filter((id) => !mentionSeen.has(id));
    const n = unseen.length;
    mentionFab.toggleAttribute('data-visible', n > 0);
    mentionFab._next = n ? unseen[n - 1] : null;         // NEWEST unseen first (Damir: jump to the most recent mention; each tap then steps to the next-older)
    mentionFabBadge.hidden = n <= 1;                     // show a count only when >1 pending
    if (n > 1) mentionFabBadge.textContent = n > 99 ? '99+' : String(n);
    const base = (window.SL && window.SL.jumpToMention) || 'Jump to mention';
    mentionFab.setAttribute('aria-label', n > 1 ? base + ', ' + n : base);
  }
  function resetMentionTracking() { loadMentionSeen(); }   // per-peer: restore the durable seen set
  mentionFab.addEventListener('click', () => {
    const id = mentionFab._next; if (!id) return;
    // M1 (#441): the scroll-and-pulse body now lives in jumpToRow, shared with the
    // reply quote so the two can never drift.
    if (!jumpToRow(id, updateMentionFab)) return;
    mentionSeen.add(id); saveMentionSeen();              // viewing it counts as seen (persisted) → next tap advances
    updateMentionFab();
  });
  let mentionFabRaf = 0;
  box.addEventListener('scroll', () => {
    if (mentionFabRaf) return;
    mentionFabRaf = requestAnimationFrame(() => { mentionFabRaf = 0; updateMentionFab(); });
  }, { passive: true });

  /* —— composer (JS→C# emits) ——————————————————————————————————————————————
   * send  → ixian:chat:<encodeURIComponent(text)>  (legacy chat.js:409 — chat
   *         text is the ONE ixian verb that is URI-encoded; native.js otherwise
   *         composes raw, so we encode here and hand bridge.send the whole cmd).
   * typing → ixian:typing, throttled to >1s like legacy (chat.js:423). Legacy
   *         suppresses typing in group chats; mirror that.
   * After send we clear locally for snappiness; C# also echoes clearInput. */
  /* —— composer drafts (CH7). Persist the UNSENT composer text to localStorage
   * keyed by peer address so it survives leaving/returning to the chat, and the
   * chats list (home.html, same Resources/Raw/html origin) can show a "Draft: …"
   * excerpt. A draft is the user's own unsent text (not message history) →
   * SECURITY.md-OK to cache; cleared on a successful send. Fail-soft if
   * localStorage is unavailable. Keyed on identity.address, which lands via
   * onChatScreenReady BEFORE the composer can be typed into. */
  const DRAFT_PREFIX = 'spixi.draft.';
  let draftRestored = false;
  let draftSaveTimer = 0;
  function draftKey() { return identity.address ? DRAFT_PREFIX + identity.address : ''; }
  function saveDraft(text) {
    const k = draftKey();
    if (!k) return;
    try {
      if (text && text.trim()) localStorage.setItem(k, text);
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function clearDraft() {
    clearTimeout(draftSaveTimer);          // cancel any in-flight debounced save so it can't
    const k = draftKey();                  // resurrect the just-sent text after removeItem (audit race)
    if (!k) return;
    try { localStorage.removeItem(k); } catch (_) {}
  }
  /** Restore a saved draft once the peer address is known — but never clobber
   *  text the user already started typing, and only once per page life. */
  function maybeRestoreDraft() {
    if (draftRestored) return;
    const k = draftKey();
    if (!k) return;                              // address not known yet — try again later
    draftRestored = true;
    let saved = '';
    try { saved = localStorage.getItem(k) || ''; } catch (_) {}
    if (!saved) return;
    const input = composerEl && composerEl.querySelector('.c-composer__input');
    if (!input || input.value) return;          // don't overwrite in-progress typing
    input.value = saved;
    input.dispatchEvent(new Event('input'));    // grow + action sync; isTrusted=false → no spurious ixian:typing
  }

  /* —— Q12: deleted-tail excerpt hint (shared contract with home.html, which
   * reads spixi.exdel.<addr>). Deleting the LAST message leaves the chats list
   * stale: the delete path never re-pushes HomePage (SingleChatPage:1150-1159
   * pushes only THIS WebView), and C#'s friend.metaData.lastMessage may keep the
   * deleted message (Ixian-Core is outside this tree — unverifiable, #215; the
   * hint self-expires if C# turns out to correct itself). So on a delete of the
   * tail row we write a per-address hint home.html folds into the row.
   *
   * LOCAL DELETES ONLY (A-1). C# pushes the IDENTICAL deleteMessage(id) command
   * for both paths, but only the local menu delete mutates core (SingleChatPage:
   * 1146/1154 → friend.deleteMessage); the REMOTE msgDelete path (StreamProcessor:
   * 459-462 → UIHelpers.deleteMessage:69-77 → SingleChatPage:1727) just drops the
   * bubble — core keeps the message, so C# keeps pushing the same lastMessage ts
   * (hint could never expire) while the next open re-shows the row. Hence the
   * writer is latched: onMenuAction registers the id in pendingLocalDeletes and
   * the deleteMessage handler consumes it. Remote deletes still remove the row —
   * they just write no hint.
   *
   * Shape: { del: ms ts of the C#-VISIBLE lastMessage (max over sequential tail
   * deletes — C#'s stale lastMessage keeps the newest ts it ever saw), t: ms ts of
   * the new tail or 0, kind }. NO message text (DECISIONS #254 security ruling:
   * shells + mini-apps share the file:// storage partition, so untrusted publisher
   * code may read localStorage — we never widen it with counterpart-authored text).
   * home expires the hint when C# pushes a lastMessage ts ≠ del. Crosses the #221
   * wall via same-origin localStorage ONLY (the #238 landtab precedent) — no shared
   * JS, no bridge. SKIPPED: bots (lastMessage may live in another channel than the
   * visible order[], accepted edge) · rows with a synthetic wall-clock ts (A-3) ·
   * deletes arriving mid-load-burst, where order[] is still partial (A-6). */
  const EXDEL_PREFIX = 'spixi.exdel.';
  const pendingLocalDeletes = new Set();   // ids sent by the local delete menu, awaiting C#'s echo
  function writeExdelHint(deletedRec, wasTail) {
    if (!wasTail || !identity.address || mode.isBot) return;
    if (bursting) return;                              // A-6: partial log mid-load-burst → tail is not final
    if (deletedRec.tsSynthetic) return;                // A-3: wall-clock ts C# can't push → hint could never expire
    const k = EXDEL_PREFIX + identity.address;
    let del = deletedRec.ts || 0;
    try {   // sequential tail deletes: keep the NEWEST ts C# ever saw as lastMessage
      const prev = JSON.parse(localStorage.getItem(k) || 'null');
      if (prev && prev.del) del = Math.max(del, prev.del);
    } catch (_) {}
    if (!del) return;                                  // no comparable ts → no safe hint
    const tailId = order[order.length - 1];
    const tail = tailId ? model.get(tailId) : null;
    const hint = {
      del,
      t: tail ? (tail.ts || 0) : 0,
      kind: tail ? tail.kind : '',
    };
    try { localStorage.setItem(k, JSON.stringify(hint)); } catch (_) {}
  }

  /* —— own-reaction persistence (C5 interim). The bridge's addReactions re-emit
   * carries NO per-user flag, so "I reacted" is FE-remembered in myLikes. A C#
   * re-flush (clearMessages→re-add) or reopening the chat must NOT drop it, else
   * the pill loses its selected state while the heart+count survive (Damir F5,
   * 2026-07-07). Persisted keyed by peer address — same origin/pattern as drafts;
   * a like is the user's own action metadata, SECURITY.md-OK to cache. */
  const LIKE_PREFIX = 'spixi.likes.';
  function likeKey() { return identity.address ? LIKE_PREFIX + identity.address : ''; }
  function saveLikes() {
    const k = likeKey();
    if (!k) return;
    try {
      if (myLikes.size) localStorage.setItem(k, JSON.stringify([...myLikes]));
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function loadLikes() {
    myLikes.clear();                            // reset for THIS peer (desktop peer-switch safe)
    const k = likeKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => myLikes.add(String(id)));
    } catch (_) {}
  }

  // Remote media (GIF/image) load policy — legacy parity: load by default. The
  // global pref defaults ON; write 'off' to spixi.media.autoload to opt out (a
  // settings toggle can flip it — deferred UI). Regardless of the pref, URLs the
  // user DID load are remembered per peer so they auto-expand on re-entry (fixes
  // the "GIF hidden again after leaving + returning" bug). #82 security note in
  // be-cutover-brief (auto-loading remote media reveals the reader's IP to the host).
  const MEDIA_AUTOLOAD_KEY = 'spixi.media.autoload';
  const MEDIA_LOADED_PREFIX = 'spixi.media.loaded.';
  function mediaAutoloadOn() {
    try { return localStorage.getItem(MEDIA_AUTOLOAD_KEY) !== 'off'; } catch (_) { return true; }
  }
  function loadedMediaKey() { return identity.address ? MEDIA_LOADED_PREFIX + identity.address : ''; }
  function loadLoadedMedia() {
    loadedMedia = new Set();                    // reset for THIS peer (desktop peer-switch safe)
    const k = loadedMediaKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((u) => loadedMedia.add(String(u)));
    } catch (_) {}
  }
  function rememberLoadedMedia(url) {
    if (!url) return;
    loadedMedia.add(url);
    const k = loadedMediaKey();
    if (!k) return;
    try { localStorage.setItem(k, JSON.stringify([...loadedMedia])); } catch (_) {}
  }

  /* —— declined app-invite persistence (C7(a)). Declining an app invite is a LOCAL
   * action (the sender is NOT notified — future BE, be-cutover C7). Instead of deleting
   * the card (feels like it vanished), the invite stays and flips to a terminal
   * "Declined" state. Remembered per peer so it survives a C# re-flush (loadMessages
   * re-pushes the invite as 'invite'/'missing') and re-opening the chat. Same
   * origin/pattern as myLikes — the user's own action metadata, SECURITY.md-OK. */
  /* ★ B2: the CANCELED set — my own invites I withdrew — same origin/pattern as the
     declined set (the user's own action metadata, SECURITY.md-OK). Loaded beside it. */
  let canceledApps = new Set();
  const CANCELED_APP_PREFIX = 'spixi.app.canceled.';
  function canceledAppKey() { return identity.address ? CANCELED_APP_PREFIX + identity.address : ''; }
  function loadCanceledApps() {
    canceledApps = new Set();
    const k = canceledAppKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => canceledApps.add(String(id)));
    } catch (_) {}
  }
  function saveCanceledApps() {
    const k = canceledAppKey();
    if (k) { try { localStorage.setItem(k, JSON.stringify([...canceledApps])); } catch (_) {} }
  }
  function cancelApp(id) {
    id = String(id);
    if (canceledApps.has(id)) return;
    canceledApps.add(id);
    saveCanceledApps();
    renderLog();                                 // repaint the card as 'canceled'
  }
  let declinedApps = new Set();
  const DECLINED_APP_PREFIX = 'spixi.app.declined.';
  function declinedAppKey() { return identity.address ? DECLINED_APP_PREFIX + identity.address : ''; }
  function loadDeclinedApps() {
    declinedApps = new Set();                    // reset for THIS peer (desktop peer-switch safe)
    const k = declinedAppKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => declinedApps.add(String(id)));
    } catch (_) {}
  }
  function declineApp(id) {
    id = String(id);
    if (declinedApps.has(id)) return;
    declinedApps.add(id);
    const k = declinedAppKey();
    if (k) { try { localStorage.setItem(k, JSON.stringify([...declinedApps])); } catch (_) {} }
    renderLog();                                 // repaint the card as 'declined'
  }

  /* —— @ jump-to-mention seen-state persistence (Telegram-style catch-up, Damir
   * 2026-07-09). Which of MY mentions the user has already caught up on, keyed by
   * peer address — so a mention doesn't resurface on re-open. Same origin/pattern
   * as myLikes; it's the user's own read-progress metadata, SECURITY.md-OK to cache. */
  const MENTION_SEEN_PREFIX = 'spixi.mentions.seen.';
  function mentionSeenKey() { return identity.address ? MENTION_SEEN_PREFIX + identity.address : ''; }
  function saveMentionSeen() {
    const k = mentionSeenKey();
    if (!k) return;
    try {
      if (mentionSeen.size) localStorage.setItem(k, JSON.stringify([...mentionSeen]));
      else localStorage.removeItem(k);
    } catch (_) {}
  }
  function loadMentionSeen() {
    mentionSeen.clear();                        // reset for THIS peer (desktop peer-switch safe)
    const k = mentionSeenKey();
    if (!k) return;
    try {
      const arr = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(arr)) arr.forEach((id) => mentionSeen.add(String(id)));
    } catch (_) {}
  }

  let composerEl = null;
  let lastTypingSent = 0;
  composerEl = createComposer({
    placeholder: (window.SL && window.SL.chatPlaceholder) || 'Message',
    voice: false,
    onSend: (text) => {
      if (!text) return;
      if (composerLock) return;   // ⑪ belt-and-braces: no compose path while pending
      if (text.length > MAX_MESSAGE_CHARS) return;    // A7 belt — composer already blocked it
      /* M1 reply-to (#441). A reply goes out on its own verb carrying the target id;
         everything else keeps the exact ixian:chat: grammar. The context is read
         BEFORE the send and cleared after, so a failed send cannot leave the strip
         pointing at a message the next send would silently quote. The id is a hex
         string produced by C# (Crypto.hashToString) — no colon, so the single-colon
         split on the C# side is unambiguous. */
      const ctx = composerEl ? getComposerContext(composerEl) : null;
      if (ctx && ctx.kind === 'reply' && ctx.replyId && bridge.cap('reply')) {
        bridge.send('ixian:chatreply:' + encodeURIComponent(ctx.replyId) + ':' + encodeURIComponent(text));
        setComposerContext(composerEl, null);
      } else {
        bridge.send('ixian:chat:' + encodeURIComponent(text));
        if (ctx) setComposerContext(composerEl, null);
      }
      clearDraft();                                   // sent → drop the saved draft (CH7)
      // composer already clears its own field on send; this is belt-and-braces.
    },
    /* A7 (#302) — legacy parity: legacy alerted and aborted above 64 000 chars
       (js/chat.js:401-409) and the string ships in all 13 legacy locales. There is
       no length check anywhere in either tree today, and the transport is URL
       navigation — encodeURIComponent inflates ~3× for ASCII but NINE× for CJK
       (%XX per UTF-8 byte), so 64 000 raw chars is a ~576 000-char URL. That is
       still well under Chromium's 2 MB URL cap, which is why the raw count is the
       right rule and an encoded check would never fire first.
       ⚠ BE ask (logged, not this batch): the genuinely correct cap is BYTES — C#
       sends Encoding.UTF8.GetBytes(str) (:771) and prices by UTF-16 length (:757),
       and neither tree checks any length. Needs the protocol max from BE. */
    maxLength: MAX_MESSAGE_CHARS,
    onTooLong: () => {
      showToast({
        text: (window.SL && window.SL.messageTooLong) || 'Text is too long.',
        tone: 'error', host: overlayHost, strings: window.SL || {},
      });
    },
    onTyping: () => {
      // #264 (Damir: "no typing indicator in groups"): legacy suppressed typing in
      // EVERY multi chat; the receive side (showUserTyping) is generic and C#'s
      // handleFriendIsTyping resolves the envelope friend (= the group), so
      // un-gate GROUPS. BOTS stay suppressed — a busy channel would rebroadcast
      // typing to thousands. ⚠ on-device 2-client F5 verifies the group relay
      // actually forwards msgTyping (IXICore — unverifiable in-tree, #215);
      // fail-soft either way (an unrelayed signal is simply never shown).
      if (mode.isBot || composerLock) return;   // ⑪ no typing signal while pending either
      const now = Date.now();
      if (now - lastTypingSent > 1000) {              // >1s throttle (chat.js:423)
        lastTypingSent = now;
        bridge.send('ixian:typing');
      }
    },
    // ⊕ attach: redesigned attach sheet (tile grid) replacing the legacy native
    // attach bar. Routes to the existing verbs — nothing invisible.
    onAttach: () => openAttach(),
    // @-autocomplete member picker (#210). Always wired; mentionMembers() returns
    // [] in 1:1 (nothing to pick) so the picker only ever opens in group/bot chats.
    // `mode` isn't known at composer-creation, so the gate lives in the source fn.
    mentionSource: mentionMembers,
  });
  document.getElementById('chat-composer').replaceChildren(composerEl);
  /* The ⊕ offers nothing at boot: the room type is not known yet, so it holds its place
     and stays invisible until setChatMode answers or the wait window closes. THE
     ROOM-ANSWER LATCH above holds the whole rule. This is the FIRST derive; every later
     one rides the bridge.exposeAll wrapper.
     ★★★ AND THIS IS THE ONLY WAKE-UP THE WAIT WINDOW GETS (round 3; surviving mutations
     Y2 and Y11). Round 2 armed a timer from inside the derive function and cleared it
     again on the next push, so the ARM was a line that one deletion could remove while
     the timer itself stayed pinned and green. There is no arm now, no timer handle and
     no clearing branch: ONE timeout, scheduled once, for the life of this document.
     It only re-derives. It cannot grant a gate — `syncAttachAffordance` reads the same
     predicate whenever it runs.
     ⚠ Delete this timeout and a room that NEVER answers holds an invisible 40 px box in
     the composer for the whole session (#647③, a latch with no bound). It offers
     nothing, so the direction is safe, but the space is never released. */
  syncAttachAffordance();
  setTimeout(syncAttachAffordance, MODE_WAIT_MS);

  /* Save the draft as the user types (debounced ~400ms). Only genuine typing
   * (isTrusted) persists — a synthetic restore/clear event must not re-write.
   * flushDraft() writes immediately on blur / page-hide so leaving the chat
   * within the debounce window never drops the last keystrokes (audit). */
  {
    const input = composerEl.querySelector('.c-composer__input');
    if (input) {
      const flushDraft = () => { clearTimeout(draftSaveTimer); saveDraft(input.value); };
      input.addEventListener('input', (e) => {
        if (!e.isTrusted) return;
        clearTimeout(draftSaveTimer);
        const v = input.value;
        draftSaveTimer = setTimeout(() => saveDraft(v), 400);
      });
      input.addEventListener('blur', flushDraft);
      // WebView back/navigation away → persist the in-progress draft now.
      window.addEventListener('pagehide', flushDraft);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
    }
  }

  /* Put the caret in the composer so the user can type on entry without tapping.
   * Q10a (Damir): DESKTOP ONLY — on mobile an entry autofocus pops the soft
   * keyboard over the fresh conversation; on desktop (physical keyboard, #228
   * flag) the caret is free. Called from onChatScreenLoaded; guarded so a
   * missing input or a non-focusable state (e.g. a modal open) never throws. */
  function focusComposer() {
    if (!document.documentElement.hasAttribute('data-desktop')) return;
    try {
      const input = composerEl && composerEl.querySelector('.c-composer__input');
      if (input) input.focus();
    } catch (_) {}
  }

  /* —— iOS-6/iOS-29 keyboard viewport — attempt 4, CHANGED LEVER (#301) ————
   * WKWebView does NOT resize the layout viewport when the soft keyboard shows —
   * it PANS the document (programmatic scrollView contentOffset) to reveal the
   * focused input (ios-sim-findings iOS-6). Attempts 1–3 fought that pan by
   * RESIZING <body> to vv.height; #294's device F5 proved that lever wrong:
   * shipped, the resize did not land AND produced a double-topbar artifact
   * while WKWebView ran its own focus pan against the shrinking document.
   * REVERTED there; #294's standing order = only re-attempt with a changed lever.
   *
   * This is that changed lever: the document NEVER changes size (so WKWebView's
   * pan math stays stable and scrollTo(0,0) fully undoes it — the part #283
   * proved works). Instead the keyboard overlap is published as a CSS var
   * (--kb-inset) and the composer's margin-bottom (see the #chat-composer rule)
   * lifts it above the keyboard INSIDE the fixed-height flex column;
   * .c-chat-canvas (flex:1, min-height:0) absorbs the difference so the topbar
   * never moves. #294's measurements all hold here: innerHeight constant (852),
   * vv.height shrinks (544), the vv resize event fires, and env(safe-area-
   * inset-bottom) stays at full value with the keyboard up (compensated in the
   * CSS max()). No-op by construction wherever the keyboard already resizes
   * the viewport (Android adjustResize, WebView2 → delta ≈ 0), skipped on
   * desktop, guarded for a missing visualViewport. Threshold 60px separates
   * real keyboards from browser-chrome/jitter resizes. */
  (function keyboardViewport() {
    const vv = window.visualViewport;
    if (document.documentElement.hasAttribute('data-desktop')) return;
    let kbOpen = false;
    let nativeKb = false;                  // r2 (#303): true once C# keyboard frames arrive — they win
    /* iOS-53 r2 (#324) — bottom-stick THROUGH the margin transition. A one-shot
     * scrollTop write only held the bottom for the instant jump; with the
     * composer sliding (280ms), the log's height changes every frame, so the
     * stick must track the whole slide or the newest message lags then snaps.
     * 340ms > the 280ms transition; restarts safely on overlapping writes. */
    let stickRaf = 0, stickEnd = 0;
    function stickDuring(ms) {
      // #328 loop fix: reduced-motion has no transition to track — one write.
      if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) {
        box.scrollTop = box.scrollHeight;
        return;
      }
      stickEnd = performance.now() + ms;
      cancelAnimationFrame(stickRaf);
      (function step() {
        box.scrollTop = box.scrollHeight;
        if (performance.now() < stickEnd) stickRaf = requestAnimationFrame(step);
      })();
    }
    /* #328 loop fix (audit MAJOR): any user touch cancels the stick — the loop
     * exists only to track the composer's own 280ms slide; without this it
     * fought user scrolling AND yanked the @-mention FAB's jump back to the
     * bottom while the mention was already marked seen (the marker burned with
     * the jump never shown). A touch anywhere = user intent wins. */
    /* #337 audit MINOR: touchmove too — the AND-16 v2 arm fires on a window
     * RESIZE that can land MID-drag (composer tap → flick up → IME resize
     * ~100-300ms later): touchstart already happened, so without a move abort
     * the stick fought the active finger for up to 500ms (#328 class). A
     * touchmove only fires with a finger down — cancelling there never hurts
     * the no-touch case the stick exists for (the composer's own slide). */
    for (const evName of ['touchstart', 'touchmove']) {
      document.addEventListener(evName, () => {
        cancelAnimationFrame(stickRaf);
        stickEnd = 0;
      }, { passive: true, capture: true });
    }
    let lastInset = -1;                    // #328: arm the stick only on a REAL change
    function setInset(px) {
      document.documentElement.style.setProperty('--kb-inset', px + 'px');
      kbOpen = px > 0;
      insetChanged = px !== lastInset;
      lastInset = px;
    }
    let insetChanged = false;
    function apply() {
      if (!vv) return;
      // innerHeight tracks the LAYOUT viewport (constant under WKWebView's
      // keyboard); vv.height shrinks by the keyboard overlap.
      const delta = window.innerHeight - vv.height;
      const open = delta > 60;
      const stick = nearBottom();          // read BEFORE the layout change
      // r2 (#303): once the NATIVE lever is live, the vv path stops writing the
      // inset (two writers with different readings of the same keyboard would
      // fight) but keeps its pan-reset + stick duties below.
      if (!nativeKb) {
        if (open) setInset(Math.round(delta));
        else if (kbOpen) setInset(0);
      }
      // undo WKWebView's focus pan (fires before AND after our margin lands — the
      // vv 'scroll' listener below catches the late pan too). With the composer
      // lifted above the keyboard, WebKit has no reason to re-pan after this.
      if (vv.offsetTop || window.scrollY) window.scrollTo(0, 0);
      // #328: arm ONLY when this pass actually changed the inset — the settle
      // ladder re-runs apply() at 80..1400ms and each pass re-armed a fresh
      // 340ms pin (a ~1.7s continuous window after every focus, audit MAJOR).
      if (open && stick && insetChanged) stickDuring(340);
      insetChanged = false;
    }
    /* r2 (#303) — SETTLE POLL. Damir's F5: the composer lifted only after 7-8
     * typed characters. Diagnosis: the first vv 'resize' fires BEFORE the keyboard
     * geometry settles (delta still < 60 → no-op) and no further event comes until
     * a keystroke makes WebKit scroll the caret (vv 'scroll' → apply → correct).
     * So: every trigger (vv event OR composer focus) runs apply() NOW plus a short
     * recheck ladder that outlives the ~250ms keyboard animation — a missed or
     * early event can no longer strand the composer under the keyboard. */
    let settleTimers = [];
    function kick() {
      apply();
      for (const t of settleTimers) clearTimeout(t);
      settleTimers = [80, 240, 480, 900, 1400].map((ms) => setTimeout(apply, ms));
    }
    if (vv) {
      vv.addEventListener('resize', kick);
      vv.addEventListener('scroll', kick);
    }
    // focus into the composer = the user summoned the keyboard — don't wait for vv
    document.addEventListener('focusin', (e) => {
      if (composerEl && composerEl.contains(e.target)) kick();
    });
    // belt: any stray document pan while the keyboard is up gets reset
    window.addEventListener('scroll', () => { if (kbOpen) window.scrollTo(0, 0); }, { passive: true });

    /* AND-16 v2 (#336) — measured 2026-08-12 on the Samsung (kb-probe). Android
     * adjustResize SHRINKS the layout viewport: innerHeight 774→451 with the
     * keyboard, and vv.height tracks it 1:1 (delta = innerHeight − vv.height = 0),
     * so the vv writer above stays correctly silent AND the composer is already
     * placed right (probe cb == innerHeight, above the keyboard). The ONLY defect:
     * the log's scrollTop stays put while scrollMax GROWS by the shrink (probe:
     * st 5063/5063 → 5063/5386) → the newest messages fall 323px below the fold.
     *
     * The #333 one-shot re-pin was falsified because nearBottom() recomputes
     * against the SHRUNKEN clientHeight (~339px) and reads false right after the
     * shrink (5063 + 339·1.5 < scrollHeight). The fix judges "were we at bottom"
     * on the PRE-resize geometry (sampled on scroll, stable) and re-pins with the
     * settle-tracked stickDuring — NOT a one-shot — so it holds the bottom across
     * the whole IME animation. Android-only (iOS innerHeight is constant under its
     * keyboard, so the shrink test excludes it; UA-gated as belt). */
    if (/Android/i.test(navigator.userAgent || '')) {
      let wasAtBottom = nearBottom();
      box.addEventListener('scroll', () => { wasAtBottom = nearBottom(); }, { passive: true });
      let lastIH = window.innerHeight;
      window.addEventListener('resize', () => {
        const ih = window.innerHeight;
        const shrank = ih < lastIH - 60;     // keyboard opening (not chrome jitter)
        lastIH = ih;
        // re-pin only when the keyboard OPENED and the user was reading the
        // bottom before it did — a scrolled-up reader keeps their position.
        if (shrank && wasAtBottom) stickDuring(500);   // > the IME settle window
      });
    }
    /* r2 (#303) — NATIVE LEVER (the #294 alternative, now primary on iOS). C#
     * observes UIKeyboardWillChangeFrame/WillHide (SpixiContentPage, chat.html
     * pages only) and pushes the FINAL keyboard overlap in points — same units as
     * CSS px — through this global. Deterministic where the vv event is not: the
     * notification always carries the settled end-frame. First push latches
     * nativeKb so the vv writer stands down; hide pushes 0. The vv machinery
     * stays as the belt for pan-resets and as the whole lever on engines where
     * C# never pushes (Android WebView, browser previews). */
    window.__setKbInset = function (h) {
      if (document.documentElement.hasAttribute('data-desktop')) return;
      const px = Math.max(0, Math.round(Number(h) || 0));
      nativeKb = true;
      const stick = nearBottom();
      setInset(px > 60 ? px : 0);          // same real-keyboard threshold as the vv path
      if (window.scrollY || (vv && vv.offsetTop)) window.scrollTo(0, 0);
      // #328: change-gated like the vv writer — a re-push of the same height
      // (C# re-posts WillChangeFrame freely) must not re-pin the log.
      if (px > 60 && stick && insetChanged) stickDuring(340);
      insetChanged = false;
    };
  })();


  /* #334 iOS-62 — BOOT-SCOPED late-height re-pin. The boot pin in
   * onChatScreenLoaded is one synchronous write, but bubbles GROW after it —
   * file-transfer state swaps mutate rows IN PLACE (setFileProgress: progress
   * bar/hint/Open-file appear) and app-invite remote icons load — pushing the
   * newest content below the fold ("chat opens not quite at the bottom", Damir
   * walk 2026-08-11; media tiles already self-re-pin on img load). Bounded
   * settle window + nearBottom guard + USER-INPUT ABORT — the #328 MAJOR-2
   * lesson: a pin without an abort fights the user; touch is not enough on
   * desktop, so wheel + mousedown cancel too. Idempotent beside the #324 stick
   * (same value, same direction). */
  let bootRepinRaf = 0, bootRepinEnd = 0;
  function cancelBootRepin() { bootRepinEnd = 0; cancelAnimationFrame(bootRepinRaf); }
  ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach((evName) =>
    document.addEventListener(evName, cancelBootRepin, { passive: true, capture: true }));
  function bootRepin(ms) {
    bootRepinEnd = performance.now() + ms;
    cancelAnimationFrame(bootRepinRaf);
    (function step() {
      if (performance.now() >= bootRepinEnd) return;
      if (nearBottom()) {
        const max = box.scrollHeight - box.clientHeight;
        if (box.scrollTop < max) box.scrollTop = max;
      }
      bootRepinRaf = requestAnimationFrame(step);
    })();
  }

  /* —— iOS-56 r3 — edge-swipe back, SHELL lever (#325) ——————————————————————
   * Two rounds of a native UIScreenEdgePanGestureRecognizer died silently in
   * UIKit arbitration (never transitioned to Began — no [swipe] lines with the
   * recognizer on the WKWebView + simultaneous recognition, then on the page
   * root + scroll-pan requireToFail). The touches provably DO reach this page
   * (scrolling works), so the pan is detected HERE instead: touchstart within
   * 24px of the left edge, then >70px rightward travel with <50px vertical
   * drift inside 700ms = back. Sheet-first: an open overlay consumes the swipe
   * (dismissTopOverlay() — synchronous here, same grammar as Esc/back; a
   * locked money sheet swallows it); otherwise ixian:back = the topbar-back
   * verb (popToRootAsync — overlay-aware C#-side). Touch surfaces only;
   * desktop untouched. No horizontal gesture exists in the chat surface, so
   * there is nothing to collide with; vertical scroll intent bails early. */
  (function edgeSwipeBack() {

      if (e.touches.length !== 1) { tracking = false; return; }

      fired = false;

      if (!tracking || fired || e.touches.length !== 1) return;
      if (performance.now() - t0 > 700) { tracking = false; return; }
      const t = e.touches[0];
      const dx = t.clientX - x0;
      const dy = Math.abs(t.clientY - y0);
      if (dy > 50 && dy > dx) { tracking = false; return; }   // vertical scroll intent
      // #328 r2: dominant-axis gate. The r1 form (`dx > dy * 1.4` beside
      // dy < 50) was DEAD CODE — for any dy < 50, dy*1.4 < 70 < dx, so it
      // never bound (break-my-verdict catch: its own cited 71/49 case still
      // fired). Real gate: the dx threshold SCALES with drift — a shallow
      // swipe fires at 70px, a 49px-drift diagonal needs 98px of travel.
      if (dy < 50 && dx > Math.max(70, dy * 2)) {
        // #328 (audit MINOR): an active text selection means the user is
        // dragging a selection handle (received bubbles sit left-aligned —
        // a start-handle drag from the edge IS this gesture's shape). Never
        // steal it.
        const sel = document.getSelection && document.getSelection();
        if (sel && !sel.isCollapsed) { tracking = false; return; }
        fired = true; tracking = false;
        // #328 (audit MINOR): the bot channel selector is hand-rolled (top-
        // anchored panel, deliberately NOT on the shared overlay stack) — the
        // sheet-first contract must cover it too, or the swipe closes the
        // whole chat under an open panel.
        if (channelDropdown) { closeChannelSelector(); return; }   // live-state probe: nulled at close START (an exiting panel must not eat the swipe)
        const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
        if (dismiss && dismiss()) return;                          // a sheet/menu sits ABOVE the selection bar
        // SELECTION FIRST: back out of the contextual bar before it backs out of
        // the conversation (the natives' order; the ✕ is the same exit).
        if (chatSelect) { exitChatSelect(); return; }
        bridge.send('ixian:back');
      }
    }, { passive: true });
  })();

  /* —— page ready — fire ixian:onload AFTER the document fully loads, matching
   *    the legacy onload() timing (spixi.js:88 → window load). Firing it
   *    synchronously during parse raced C#'s conversation push: the first entry
   *    could arrive empty and only a manual refresh fixed it. Deferring to the
   *    window 'load' event makes C# push setChatMode/setNickname/addMe/addThem at
   *    the right time, so the conversation populates on first open. ———————————— */
  function signalReady() {
    bridge.ready();
    // Fallback: if nothing has painted shortly after ready (brand-new empty chat
    // whose C# skips clearMessages, or a missing onChatScreenLoaded), replace the
    // boot spinner with the current model so it never sticks. Never paints during
    // a load burst (that render is owned by onChatScreenLoaded / the burst safety).
    setTimeout(() => { if (!firstRenderDone && !bursting) renderLogNow(); }, 500);
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
