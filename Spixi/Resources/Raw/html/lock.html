<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi is locked</title>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<!-- ★ L5 (2026-08-31), the SAME defect Damir reported on the launch sheets, found here
     while fixing that one: this shell and launch.html were the ONLY two of eighteen with
     no root data-theme, so every token-driven surface resolved the LIGHT :root block on
     every phone. The lock CHROME never showed it — #lock-root below pins data-theme
     ="dark" on its own subtree and everything outside it is a literal (#13171b, #ffffff,
     below). But the "Use a different wallet?" MODAL mounts on document.body, OUTSIDE
     that pin (lock-shell.js passes no host in production), so it painted a LIGHT dialog
     over the dark lock. Nobody had reported it; it is the same one line.
     The root now carries the real theme, pre-paint, like the other sixteen shells. It
     cannot repaint the fixed chrome: an element carrying data-theme redefines the tokens
     for its own subtree whatever the root says. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<style>
  /* The lock screen is a FIXED-DARK brand surface in BOTH themes (#160): the
     .c-lock subtree pins itself to dark tokens over --gradient-lock. So paint a
     deep dark IMMEDIATELY (never theme-dependent) to avoid any light flash
     before tokens.css + the bundle load. */
  html { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/overlay.css">
/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }
/* ★ Batch E (b) (#557, Damir 2026-08-22): the MOBILE scrim is one level deeper
   (0.6 → 0.7) — the lifted message (#506②) reads better against the darker
   ground. Desktop keeps 0.6 for its centred dialogs; anchored desktop menus
   stay wash-free (#268, [data-dt-clear] below). */
:root:not([data-desktop]) .c-scrim { background: var(--surface-scrim-deep); }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

/* ★★ #608 (device row 5a, iPhone 15) — THE SHEET RISES FOR THE KEYBOARD.
   A bottom sheet is `bottom: 0` of its host, and on iOS the host does NOT shrink under
   the soft keyboard: the whole sheet sat behind it. On the tip sheet only the title row
   stayed visible — the amount chips, the custom-amount field the sheet had just FOCUSED
   itself, and the button that commits the payment were all underneath, on a surface with
   no scroll and no cap, so nothing could reach them. That is also why the keyboard read
   as having "no way out": the scrim you would tap to dismiss it was under the keyboard
   too.
   Three declarations, and every one of them is INERT at `--kb-inset: 0` — no keyboard,
   no change, anywhere in the app:
     · the sheet sits on top of the keyboard instead of behind it;
     · the home-indicator pad is given back while the keyboard covers that strip anyway
       (the same max() the chat composer uses), so the sheet does not float twice;
     · it is capped and scrollable, so a sheet taller than the space that is left can
       still be read to the end rather than being clipped at both ends.
   ⚠ Mobile only. A desktop dialog is centred, has no soft keyboard, and is scoped
   separately further down this file. */
:root:not([data-desktop]) .c-sheet {
  bottom: var(--kb-inset, 0px);
  padding-bottom: calc(var(--spacing-16) + max(0px, env(safe-area-inset-bottom, 0px) - var(--kb-inset, 0px)));
  max-height: calc(100% - var(--kb-inset, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————
   The sheet is z-44 and every scrim is z-40, so a sheet paints above a scrim that
   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.
   The house pattern is "close the sheet, then open the modal". A second quick tap
   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
  /* ★★ E1d (Damir on device, 2026-08-29 — Windows AND mobile): a long URL OVERFLOWS the
     dialog. The external-link confirm (#82, chat.html confirmOpenLink) puts the raw URL in
     this slot as its body, and a URL is ONE unbroken token — no spaces, and a query string
     or a `#fragment` gives the line breaker nothing to work with. The modal is capped at
     360px, so the text ran straight past the rounded corner on both platforms.
     ⚠ `anywhere`, not `break-word`: `overflow-wrap: break-word` only breaks BETWEEN
     opportunities and still refuses to split a single long token in several engines, which
     is exactly the case here. `anywhere` breaks only when the line would otherwise overflow,
     so ordinary body copy in every other modal is untouched — it is not `word-break:
     break-all`, which would hyphen-less-chop normal sentences too.
     ★ This slot is shared by every modal body, which is why the fix belongs here and not in
     the link dialog: the same overflow waits for any long token — a wallet address, a
     file name, a base58 transaction id — and those are all things this app puts in dialogs. */
  overflow-wrap: anywhere;
}

.c-modal__actions {
  display: flex;
  /* ★ Batch B/C loop r1 M-1 (2026-08-24): WRAP. A long localized confirm label
     ("Supprimer le compte", "Отменить приглашение") overflowed the fixed pair —
     nowrap labels + flex-basis 0 + min-width:auto has no out. Wrapping drops the
     long action onto its own full-width row (the remove-contact sheet's answer);
     short pairs render exactly as before. */
  flex-wrap: wrap;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②). ⚠ NO min-width:0 here — loop r2 R2-1: with flex-basis 0 a used min of 0 makes every item's hypothetical size 0, so the wrap above could NEVER fire; min-width:auto (the label's min-content) is what trips it. Measured in Chrome: with auto, the long confirm wraps to its own full row; with 0 it spilled 43px past its button */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 220px; padding: var(--spacing-8); }   /* ★ Session I (sheet 6 + Damir's Windows walk: "quite substantial") — was min-width 260, padding 12/16/16 */
/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source
   highlight is RETUNED — the SELECTED tint read as a selection state on the
   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".
   ⚠ loop E-4 (r2): :not([aria-current]) is LOAD-BEARING — this (0,3,0) shorthand
   would otherwise REPLACE the OPEN conversation's tonal selected paint (0,2,0)
   in the desktop split view, visually deselecting the row under its own menu.
   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;

<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Lock shell — the redesigned LockPage boot takeover wired to the
   * REAL C# MAUI bridge via the mountLockPage adapter (src/bridge/lock-page.js
   * in the bundle). Loaded by the C# LockPage. ZERO C# change, frozen bridge
   * (bridge-audit-A §11, bridge-audit-B §3, docs/lock-spec.md).
   *
   * Contract (LockPage):
   *   JS→C#: ixian:onload (ready; LockPage.onLoad relaunches native biometrics —
   *          re-emitting it IS the "try fingerprint again" affordance) ·
   *          ixian:unlock:<password> (raw — C# Splits on the prefix,
   *          WalletStorage.verifyWallet decides) · ixian:change (unlock mode =
   *          escape hatch → LaunchPage; confirm mode = cancel → authSucceeded(false)).
   *   C#→JS: setJustConfirm("True") — flips into confirm-action mode (no escape
   *          hatch, Cancel instead). Exposed by mountLockPage.
   *
   * NO-CALLBACK CONTRACT (lock-spec §3): C# answers a WRONG password with a
   * NATIVE alert only — no JS callback. mountLockPage relies on the shell's own
   * 1600 ms auto-release to restore the form (value kept; the alert already
   * spoke). On success C# replaces the page mid-latch. A §9 unlockFailed push is
   * pre-wired (inert until BE ships it).
   *
   * Biometrics: gated by window.SPIXI_ENV.biometrics (one generation-time flag
   * at the repoint PR); absent = false = the button is hidden (WinUI hosts have
   * no fingerprint — the #115 graceful default).
   *
   * SECURITY.md: the wallet password lives only in the field, transiently —
   * scrubbed on successful morph, on the escape-hatch confirm, and on pagehide
   * (createLockScreen §5). The WebView never persists or logs it.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    mountLockPage,
    createNativeBridge, installExecuteUiCommand,
    applyPushedTheme,
  } = window.Spixi;
  const strings = window.SL || {};

  /* —— bridge transport ———————————————————————————————————————————————————— */
  installExecuteUiCommand();                     // defines window.executeUiCommand for C# (setJustConfirm)

  /* ★ N71 (#421) made this a DELIBERATE no-op, reasoning that a brand-dark surface
   * must not follow a flip. ★ L5 (2026-08-31) shows the root theme cannot reach the
   * lock's chrome: #lock-root pins data-theme="dark" on itself, and an element
   * carrying data-theme redefines the tokens for its whole subtree whatever the root
   * says. What the root DOES reach is the "Use a different wallet?" modal, which
   * mounts on document.body outside that pin and was therefore a light dialog over a
   * dark lock on every device.
   * The reason to DEFINE the global is unchanged, and it is still the important half:
   * C# emits `executeUiCommand(setTheme, …)` with setTheme as a BARE identifier, and
   * an undefined one throws a ReferenceError while the arguments are evaluated,
   * before the dispatcher can catch it (the #258 addAppRequest lesson). Throwing into
   * the page while the user is at a password field is the failure this prevents.
   * Shared body: theme-runtime.js. */
  window.setTheme = function (name) { applyPushedTheme(name); };
  const bridge = createNativeBridge();           // default sink: location.href = 'ixian:…'

  /* mountLockPage appends the screen, exposes setJustConfirm AND fires
   * bridge.ready() — so mount on the window LOAD event (#177 load-timing
   * invariant), never during parse (a premature onload races C#'s
   * setJustConfirm push → confirm mode would arrive before the handler exists). */
  /* ★ C4.1 (#457, Damir on device): "cold start flashes the password screen before
   * the OS prompt takes over". LockPage fires native biometrics as soon as the page
   * is BOTH loaded and visible — so the form painted first and the system sheet
   * dropped over it a moment later. Two screens for one action.
   *
   * The fix has to land in the FIRST FRAME or it is just a second flash, so it rides
   * a generatePage carrier (the LockAuthPending key) like the launch-boot-view and
   * theme-name carriers do — not a push, which arrives a navigation round-trip late.
   *
   * ⚠ N83 (found in Damir's 2026-08-22 device log): those two are NAMED here rather than
   * written as live `*SL{…}` tokens on purpose. generatePage's substitution is text-based
   * and does not skip comments, so a carrier spelled out in this prose is really resolved
   * on the LOCK page — which registers LockAuthPending and SpixiThemeName but never
   * LaunchBootView (LaunchPage.xaml.cs:104 does, and the lock is not the launch page).
   * The result was `Unknown localization key; LaunchBootView` logged on EVERY lock
   * presentation, cold start and pause alike, in a log this project keeps trying to read.
   * "1" means C# is about to call Plugin.Fingerprint. While that is pending the boot
   * spinner STAYS and the form is not shown; C# pushes setAuthPending("False") when
   * the attempt resolves without authenticating, and the form takes over.
   *
   * ⚠ Belt, and it is the important half: a plugin that never returns must not leave
   * the user staring at a spinner with no way in. Reveal unconditionally after 3 s.
   * The password field is the fallback for every biometric failure, so revealing it
   * early is safe — it is never the thing being protected. */
  const AUTH_PENDING = '*SL{LockAuthPending}' === '1';
  let lockRevealed = false;
  function revealLock() {
    if (lockRevealed) return;
    const lockHost = document.getElementById('lock-root');
    // ★ AUDIT NIT-1: the flag is set only once there is something to reveal. Setting it
    // first meant a push that somehow arrived before window load latched "revealed" over
    // an empty host — and boot() would then hide the form with every later reveal, and
    // the 3 s belt, already returning early. On a page whose back button is swallowed.
    if (!lockHost) return;
    lockRevealed = true;
    lockHost.querySelector('.boot')?.remove();   // mountLockPage appends — drop the boot spinner
    const screen = lockHost.querySelector('.c-lock');
    if (screen) screen.hidden = false;
  }
  // The push is a bare global (#258): DEFINE it whatever the carrier says, or an exe
  // that sends it into a shell built before this change throws before the dispatcher
  // can catch it.
  window.setAuthPending = function (pending) {
    if (pending === 'True' || pending === 'true' || pending === true || pending === '1') return;
    revealLock();
  };

  function boot() {
    const lockHost = document.getElementById('lock-root');
    mountLockPage({ host: lockHost, bridge, strings });   // biometrics ← SPIXI_ENV (default false)
    if (AUTH_PENDING) {
      const screen = lockHost.querySelector('.c-lock');
      if (screen) screen.hidden = true;         // hold behind the spinner
      setTimeout(revealLock, 3000);             // belt — never strand the user
      if (!screen) revealLock();                // nothing to hold: fail open
    } else {
      revealLock();
    }
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
</script>
