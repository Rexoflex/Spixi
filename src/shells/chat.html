    overlay.className = 'chat-channel-overlay';
    const scrim = document.createElement('div');
    scrim.className = 'chat-channel-overlay__scrim';
    scrim.addEventListener('click', closeChannelSelector);

    const panel = document.createElement('div');
    panel.className = 'chat-channel-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('tabindex', '-1');
    panel.setAttribute('aria-label', s.channels || 'Channels');
    // anchor the panel directly under the topbar (+ any connectivity banner)
    panel.style.top = (topbarHost.offsetHeight + (warningBanner.offsetHeight || 0)) + 'px';

    const title = document.createElement('div');
    title.className = 'chat-channel-panel__title';
    title.textContent = s.channels || 'Channels';
    panel.append(title);

    /* A6 (#302): the bot/server description, on the one bot-owned surface this
       shell owns (#97/#252 Q9). Read from stored mode state, not from the push
       moment — this panel is torn down and rebuilt on every open, so the value has
       to survive. textContent (never innerHTML): the string is authored by a REMOTE
       bot server. Already clamped in setChatMode; -webkit-line-clamp caps the
       visual height so a long one can't blow the panel. */
    if (mode.description) {
      const desc = document.createElement('p');
      desc.className = 'chat-channel-panel__desc t-body-sm';
      desc.textContent = mode.description;
      panel.append(desc);
    }

    channelSheetBody = document.createElement('div');
    channelSheetBody.className = 'chat-channel-list';
    const empty = document.createElement('p');
    empty.className = 'chat-channel-list__empty';
    empty.textContent = s.loading || 'Loading';   // fallback = the dict value (A4 conflict gate)
    channelSheetBody.append(empty);
    panel.append(channelSheetBody);

    overlay.append(scrim, panel);
    document.body.append(overlay);
    channelDropdown = overlay;
    syncChatOverlay();   // N51: the selector is NOT on the shared stack — mirror its open to C#
    // Esc closes; Tab is trapped within the panel (mirrors overlay.js house style).
    channelKeydown = (e) => {
      if (e.key === 'Escape') { closeChannelSelector(); return; }
      if (e.key !== 'Tab' || !channelDropdown) return;
      const f = channelFocusables();
      if (f.length === 0) { e.preventDefault(); panel.focus({ preventScroll: true }); return; }
      const first = f[0], last = f[f.length - 1], act = document.activeElement;
      if (!f.includes(act)) { e.preventDefault(); (e.shiftKey ? last : first).focus({ preventScroll: true }); }
      else if (e.shiftKey && act === first) { e.preventDefault(); last.focus({ preventScroll: true }); }
      else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus({ preventScroll: true }); }
    };
    document.addEventListener('keydown', channelKeydown);
    // anything focused outside the open dropdown bounces back in (overlay.js parity)
    channelFocusin = (e) => {
      if (!channelDropdown || channelDropdown.contains(e.target)) return;
      (channelFocusables()[0] || panel).focus({ preventScroll: true });
    };
    document.addEventListener('focusin', channelFocusin);
    // trigger the slide-down on the next frame (so the -100% start state paints)
    requestAnimationFrame(() => { if (channelDropdown === overlay) overlay.classList.add('is-open'); });
    // move focus into the panel now (list is still loading → the panel itself)
    panel.focus({ preventScroll: true });

    // pull the list — C# answers with addChannelToSelector per channel
    bridge.send('ixian:populateChannelSelector');
  }

  /* —— message log —————————————————————————————————————————————————————————— */
  const box = document.getElementById('messages');

  /* —— pinch = TEXT size, not page zoom (Damir 2026-07-29) ————————————————————
   * The intent was always "pinch to enlarge the chat text", the same knob as
   * Account -> Chat appearance. What shipped was the browser's own gesture: with
   * no scale clamp in the viewport meta, WKWebView pinch-zooms the DOCUMENT —
   * a raster zoom that blurs text, scales the topbar and composer off-screen and
   * strands the user until they double-tap back out. The meta clamp above stops
   * that; this maps the gesture onto --chat-text-scale instead.
   *
   * Same variable, same clamp and same storage key the Chat-appearance screen
   * writes (TEXT_SIZES spans 0.9..1.25; the boot script clamps 0.8..1.5), so a
   * pinch and the settings picker are two controls over ONE preference and
   * survive a reopen identically.
   *
   * Touch events, not the WebKit-only gesture* events: those don't fire once the
   * viewport is scale-clamped. Non-passive so the 2-finger move can preventDefault
   * (otherwise the log scroll-pans under the pinch). Single-finger scrolling is
   * untouched — we bail unless exactly two touches are down. */
  const TEXT_SCALE_MIN = 0.8, TEXT_SCALE_MAX = 1.5;
  function readTextScale() {
    const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chat-text-scale'));
    return isNaN(v) ? 1 : v;
  }
  function applyTextScale(v) {
    const c = Math.min(TEXT_SCALE_MAX, Math.max(TEXT_SCALE_MIN, v));
    document.documentElement.style.setProperty('--chat-text-scale', String(c));
    return c;
  }
  (function attachPinchTextScale() {
    let pinching = false, startDist = 0, startScale = 1, liveScale = 1;
    const dist = (t) => {
      const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.hypot(dx, dy);
    };
    box.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 2) { pinching = false; return; }
      pinching = true;
      startDist = dist(e.touches);
      startScale = liveScale = readTextScale();
    }, { passive: true });
    box.addEventListener('touchmove', (e) => {
      if (!pinching || e.touches.length !== 2 || !startDist) return;
      e.preventDefault();                       // the log must not pan under the pinch
      liveScale = applyTextScale(startScale * (dist(e.touches) / startDist));
    }, { passive: false });
    const end = (e) => {
      if (!pinching) return;
      if (e.touches && e.touches.length >= 2) return;   // one finger lifted mid-pinch
      pinching = false;
      // persist ONCE at the end, not per frame — this is the same key Chat
      // appearance owns, and a localStorage write per touchmove is a jank source.
      if (Math.abs(liveScale - startScale) > 0.001) {
        try { localStorage.setItem('spixi.chat.textscale', String(liveScale)); } catch (err) {}
      }
    };
    box.addEventListener('touchend', end, { passive: true });
    box.addEventListener('touchcancel', end, { passive: true });
  })();

  /* model: id → record, in insertion order. A record is one of:
   *   kind 'text'    → { id, kind, direction, text, ts(ms), status, senderNick, senderAddress }
   *   kind 'file'    → { id, kind, direction, ts(ms), fileid, name, meta, fstate,
   *                      progress, senderNick, senderAddress }
   *   kind 'payment' → { id, kind, direction, ts(ms), title, amount, pstatus,
   *                      txid, enableView, senderNick, senderAddress }  (view-only)
   *   kind 'call'    → { id, kind, ts(ms), missed, label, duration }    (view-only)
   * order[] holds ids in timestamp order so inserts find their slot (the legacy
   * findOlderChat behaviour). row: id → DOM row element. fileIndex maps a
   * transfer's fileid → the owning message id, because updateFile(fileid,…)
   * references the transfer, not the message row (chat.js:1009). */
  const model = new Map();   // id → record
  const rows = new Map();    // id → row element
  let order = [];            // ids, kept timestamp-ascending
  const fileIndex = new Map(); // fileid → message id
  const txIndex = new Map();   // txid → message id (updateTransactionStatus keys by txid)
  const groupNicks = new Map(); // group sender address → resolved nick (updateGroupChatNicks)
  const groupRoster = new Map(); // roster key → { address, name, avatar } from ixian:loadContacts (full participant list)
  let groupOwner = '';           // #248: owner address (setGroupOwner; '' for blind groups) → "Owner" chip
  /* N34 (#365): ONE owner predicate for the bubble chip + the member sheet.
   * '[Unknown]' guards the ROSTER-push path only (loadContacts masks there);
   * per-message addresses arrive verbatim, so the callers carry the real blind
   * gate (!mode.blind) themselves — this predicate is identity-match only. */
  const isOwnerAddr = (a) => !!(groupOwner && a && a !== '[Unknown]' && a === groupOwner);
  /* D-5/N26 (#366): the relation vocabulary the bridge may push (trailing arg on
   * addThem/addContact). 'pending-in' = an INCOMING request (#371 — badge
   * copy only; same no-button/no-money shape as 'pending'). Anything else —
   * incl. undefined from an old exe — degrades to '' = unknown ('none'). */
  const RELATIONS = new Set(['contact', 'pending', 'pending-in', 'none', 'self']);   // R2 (#371): + incoming-pending
  /* Session latch: after the user taps "Send contact request" in the member
   * sheet, later opens show 'pending' immediately — C#'s relation only refreshes
   * on the next message push. Per-peer reset in onChatScreenReady. */
  const requestedMembers = new Set();

  /* —— @-mention context (premium mentions #210). The bubble highlighter (#7) and
   * the composer picker (#6) share ONE source of member names: roster nicks
   * (loadContacts) + seen-sender nicks (groupNicks) + the 1:1 peer nick. `self`
   * keys = the LOCAL user's nick, which C# does NOT push to the chat today — read
   * from window.SL.SelfNick / SPIXI_ENV.selfNick when a trivial push lands
   * (be-cutover) so self-mention emphasis + the jump-to-me FAB (#8) light up; empty
   * until then (highlight-all + picker work regardless). Memoized; invalidated when
   * the name sources change. */
  let _mentionObj = null;
  let selfNickPushed = '';   // C13: the LOCAL user's nick, delivered by the setSelfNick bridge push
  function selfMentionKeys() {
    const sl = window.SL || {}, env = window.SPIXI_ENV || {};
    const out = [];
    if (selfNickPushed) out.push(selfNickPushed);       // C13 primary source (native bridge)
    if (sl.SelfNick) out.push(String(sl.SelfNick));     // demo/injection fallback
    if (env.selfNick) out.push(String(env.selfNick));
    return out;
  }
  function mentionNameList() {
    const set = new Set();
    for (const [, m] of groupRoster) { if (m && m.name) set.add(m.name); }
    for (const [, n] of groupNicks) { if (n) set.add(n); }
    for (const rec of model.values()) { if (rec && senderHasNick(rec)) set.add(rec.senderNick); }  // seen senders (addThem; the ONE nick predicate — r2 F-2)
    if (!mode.isMulti && identity.name) set.add(identity.name);   // 1:1 peer nick
    for (const s of selfMentionKeys()) set.add(s);                // my own nick is a valid @target too
    return [...set];
  }
  function mentionCtx() {
    if (!_mentionObj) _mentionObj = { names: mentionNameList(), self: selfMentionKeys() };
    return _mentionObj;
  }
  function invalidateMentions() { _mentionObj = null; }
  /* Members for the composer @-picker (#6): group/bot only (1:1 → []). Dedupe by
   * name. Sources: roster (loadContacts, has avatars) + resolved nicks (groupNicks)
   * + SEEN SENDERS from the loaded messages (model) — the last is essential so the
   * picker works on a chat you just opened, BEFORE chat-info/loadContacts has run
   * (Damir F5 2026-07-09: "@ in composer does nothing"). */
  /* ★ #717 (Damir on device, 2026-08-30): "in groups I can @ myself". The roster and the
     seen-senders both carry ME, and nothing filtered me out. C# tells the shell who I am
     on every own message (addMe's address + nick), so the picker drops that one entry —
     by address when it has one, by nick as the belt for a roster row without one. */
  let selfAddress = '';
  let selfNick = '';
  function mentionMembers() {
    if (!mode.isMulti) return [];
    const by = new Map();
    const isMe = (m) => (selfAddress && m.address && m.address === selfAddress) || (!m.address && selfNick && m.name === selfNick);
    const out = () => [...by.values()].filter((m) => !isMe(m));
    for (const [, m] of groupRoster) { if (m && m.name && !by.has(m.name)) by.set(m.name, { name: m.name, address: m.address || '', avatar: m.avatar || null }); }
    for (const [addr, n] of groupNicks) { if (n && !by.has(n)) by.set(n, { name: n, address: addr || '', avatar: null }); }
    for (const rec of model.values()) {                       // seen senders (addThem) — before any roster load
      const nm = rec && senderHasNick(rec) ? rec.senderNick : '';   // the ONE nick predicate (r2 F-2)
      if (nm && !by.has(nm)) by.set(nm, { name: nm, address: rec.senderAddress || '', avatar: rec.avatar || null });
    }
    return out();
  }
  // msg-ids I've liked THIS session. The bridge's addReactions sends only
  // key:count (no per-user flag — C5), so a fresh reaction can't tell the shell
  // that *I* reacted; tracking my own likes locally lets the pill show the
  // selected "you reacted" state immediately (Damir F5). Historical own-state
  // (a like from a previous session, re-pushed on load) still needs the C5 flag.
  const myLikes = new Set();
  let loadedMedia = new Set();   // remote-media URLs the user has loaded (persisted per peer, Damir 2026-07-08)
  // installed multi-user apps pushed by C# loadApps (addApp) — feed the attach
  // → "App invite" picker (legacy parity: legacy showed an app option in the
  // attach bar, picking one emits ixian:app:<id>, chat.js:1250 / onApp xaml:832).
  const chatApps = [];

  // Best-known display nick for a group sender: an explicit nick on the row wins,
  // else the last name resolved via updateGroupChatNicks for that address.
  const resolveNick = (address, nick) =>
    nick || (address && groupNicks.get(String(address))) || '';

  // True when a row has a REAL display nick (not empty, and not just its own
  // address echoed back as the nick) — nameless senders fall through to the
  // truncated + copyable address treatment (Damir F5, 2026-07-07).
  /* Loop r2 F-2 (#373) BELT: an address-SHAPED nick is not a nick. The equality
     guard below cannot fire when the address slot is EMPTY (the Core 0.9.8k
     common case) — if Core ever stores the address string in senderNick on such
     a row, the nick-first ladder would render it in a BLIND room. Same shape
     guard as the roster ingests; a real 30+ base58-only nick degrades to the
     placeholder/address rung — the safe direction. */
  const senderHasNick = (rec) =>
    !!rec.senderNick && rec.senderNick !== rec.senderAddress && !isPseudoAddressNick(rec.senderNick);

  /* typing pill — appended while typing is on, removed on timeout / new message,
   * and always kept LAST (shell duty mirrored from the demo). */
  let typingRow = null;
  let typingTimer = null;
  let typingActive = false;   // peer is currently typing — survives full re-renders
  // re-append after a rebuild: renderLogNow's box.textContent='' detaches the pill,
  // so this must re-add it whenever typing is ACTIVE (audit M3: the old
  // parentNode===box guard could never re-append a just-cleared pill).
  function keepTypingLast() {
    if (typingActive && typingRow) box.append(typingRow);
  }
  function showTyping() {
    if (!typingRow) {
      // #264: in a MULTI chat the pill stays GENERIC ("typing…") — showUserTyping
      // carries no sender, and the old `{ name: identity.name }` would have
      // captioned it with the GROUP's name, misattributing the typist. Sender
      // attribution = a BE arg-append ask (be-cutover C21).
      typingRow = createTypingIndicator({});
    }
    typingActive = true;
    box.append(typingRow);
    // N54: scroll to the pill ONLY when the user is already at the bottom — the
    // unconditional jump yanked the view away from older messages mid-read.
    // The check runs AFTER the append, so the pill's ~40px growth can flip the
    // verdict for a user sitting within 40px of the threshold (loop B-7) — in
    // that band the pill simply appears without the scroll, which is harmless.
    if (nearBottom()) box.scrollTop = box.scrollHeight;
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(hideTyping, 5000);  // legacy showUserTyping auto-hides after 5s
  }
  function hideTyping() {
    typingActive = false;
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    if (typingRow && typingRow.parentNode) typingRow.remove();
  }

  const nearBottom = () => box.scrollTop + box.clientHeight * 1.5 >= box.scrollHeight;

  /* status derivation from the legacy bool flags (chat.js updateMessage / addMe):
   *   errorSending → failed   (highest priority)
   *   read         → read
   *   confirmed    → delivered (peer received; "double check" in legacy)
   *   sent         → sent      (relayed; single check)
   *   else         → sending   (the legacy "default"/clock state) */
  function statusFrom({ sent, confirmed, read, errorSending }) {
    if (asBool(errorSending)) return 'failed';
    if (asBool(read)) return 'read';
    if (asBool(confirmed)) return 'delivered';
    if (asBool(sent)) return 'sent';
    return 'sending';
  }

  /* #63 grouping: consecutive same-direction rows within 90s form a run.
   * Recomputes position (single/first/middle/last) for the whole log — simplest
   * correct approach for an upsert model with out-of-order inserts + deletes.
   * Only TEXT rows group: a typed card (file/…) is always standalone and breaks
   * the run. In group chats a run also breaks when the sender changes, so every
   * participant keeps their own label + avatar. */
  const GROUP_WINDOW = 90000;
  function positionsFor(ids) {
    const pos = {};
    for (let i = 0; i < ids.length; i++) {
      const r = model.get(ids[i]);
      const prev = i > 0 ? model.get(ids[i - 1]) : null;
      const next = i < ids.length - 1 ? model.get(ids[i + 1]) : null;
      // A3: `bid` = the LATER row's id — a bubble run never continues across the
      // unread divider (the boundary row restarts its own group, matching the
      // visual break the divider draws).
      const cont = (a, b, bid) => a && b
        && bid !== unreadBoundaryId
        && !a.eventChip && !b.eventChip   // #264 ⑤: event chips stand alone — never group
        && (a.kind || 'text') === 'text' && (b.kind || 'text') === 'text'
        && a.direction === b.direction
        /* ★ D-19 r2 (#356, loop r1 MAJOR-4): the run key falls back to the NICK.
           Core 0.9.8k stores every bot-room row address-less, so an address-only
           key merged ALL received rows into one run — Bob's message rendered
           under Alice's label (label on 'first' only) with the anonymous row's
           avatar (avatar on 'last'). address || nick keeps named senders apart;
           rows with NEITHER share '' and merge with each other only — they are
           indistinguishable by construction. D-19b (#370): such a run renders
           with NO label on non-blind surfaces (legacy parity) and the
           "Hidden member" placeholder in blind rooms — never a name either way. */
        && (a.senderAddress || a.senderNick || '') === (b.senderAddress || b.senderNick || '')
        && Math.abs(a.ts - b.ts) < GROUP_WINDOW;
      const withPrev = cont(prev, r, ids[i]);
      const withNext = cont(r, next, i < ids.length - 1 ? ids[i + 1] : null);
      pos[ids[i]] = !withPrev && !withNext ? 'single'
        : !withPrev && withNext ? 'first'
        : withPrev && withNext ? 'middle'
        : 'last';
    }
    return pos;
  }

  /* —— M1 reply-to ————————————————————————————————————————————————————————————
   * C# pushes only the TARGET ID (hex) on addMe/addThem; the quote itself is
   * resolved here against the rows this shell already holds. That keeps the push
   * unchanged in size and means the quote can never disagree with the row it
   * points at.
   * ★ FAIL SOFT is the whole contract. The id is peer-controlled on an incoming
   * message and the target may simply be older than the loaded window, so an
   * unknown id renders a GENERIC quote label rather than nothing (which reads as
   * a broken reply) and never a broken node or a throw. */
  function replyKindOf(rec) {
    if (!rec) return null;
    if (rec.kind === 'file') return 'file';
    if (rec.kind === 'payment') return 'payment';
    if (rec.kind === 'app') return 'app';
    if (rec.kind === 'call') return 'call';
    const media = mediaUrlOf(rec.text);
    /* ★ #684 (Session F): this tested the regex against the OBJECT mediaUrlOf returns,
       not against a string — String({url,kind}) is "[object Object]", which never matches
       /\.gif/, so EVERY media reply-quote was labelled "image", GIFs included. mediaUrlOf
       already decided the kind; ask it rather than re-deriving from a value that is not a URL. */
    if (media) return media.kind === 'gif' ? 'gif' : 'image';
    return null;
  }
  const REPLY_TEXT_MAX = 140;   // the quote is one clamped line; the bubble clamps visually too
  function replyQuoteFor(rec) {
    if (!rec || !rec.replyTo) return null;
    const s2 = window.SL || {};
    const target = model.get(String(rec.replyTo));
    if (!target) {
      // outside the loaded window, or deleted → honest placeholder, no sender, no tap
      return { text: (window.SL && window.SL.replyUnavailable) || 'Original message', sender: '', address: '' };
    }
    const kind = replyKindOf(target);
    const isOwn = target.direction === 'sent';
    const sender = isOwn
      ? (s2.you || 'You')
      : (senderHasNick(target) ? target.senderNick
          : (mode.isMulti && mode.blind ? (s2.hiddenMember || 'Hidden member')
              : (identity.nick || '')));
    let text = '';
    if (!kind) {
      text = String(target.text || '').replace(/\s+/g, ' ').trim();
      if (text.length > REPLY_TEXT_MAX) text = text.slice(0, REPLY_TEXT_MAX - 1) + '…';
    } else if (kind === 'file') {
      text = String(target.name || '');
    }
    return {
      sender,
      address: isOwn ? '' : (target.senderAddress || identity.address || ''),
      text,
      kind,
      thumb: null,   // media originals: the tile is fetched on demand (#82), so no thumb to quote
    };
  }

  /* The composer strip's view of the row you are replying TO (not the same as
     replyQuoteFor, which reads a row's OWN reply target). */
  function replySourceFor(rec) {
    if (!rec || !rec.id) return null;
    const s2 = window.SL || {};
    const kind = replyKindOf(rec);
    const isOwn = rec.direction === 'sent';
    const sender = isOwn ? (s2.you || 'You')
      : (senderHasNick(rec) ? rec.senderNick
          : (mode.isMulti && mode.blind ? (s2.hiddenMember || 'Hidden member')
              : (identity.nick || '')));
    let text = '';
    if (!kind) {
      text = String(rec.text || '').replace(/\s+/g, ' ').trim();
      if (text.length > REPLY_TEXT_MAX) text = text.slice(0, REPLY_TEXT_MAX - 1) + '…';
    } else if (kind === 'file') text = String(rec.name || '');
    return { sender, text, kind };
  }

  /* Shared scroll-to-and-pulse. Extracted from the @-mention FAB so the reply
     quote lands on the SAME behaviour (and the same stale-node re-bind). */
  function jumpToRow(id, onArrive) {
    const first = rows.get(id); if (!first) return false;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    first.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    /* N52: start the pulse when the row is actually VISIBLE, not when the tap
       landed — on a far jump the 1.4s animation is otherwise spent mid-scroll.
       loop B-4: renderLogNow rebuilds rows, so re-bind through the id each frame. */
    const pulseFrom = performance.now();
    (function pulseWhenVisible() {
      const live = rows.get(id);
      if (!live || !live.isConnected) { if (performance.now() - pulseFrom <= 1500) requestAnimationFrame(pulseWhenVisible); return; }
      if (mentionRowVisible(live) || performance.now() - pulseFrom > 1500) {
        live.setAttribute('data-mention-pulse', '');
        live.addEventListener('animationend', () => live.removeAttribute('data-mention-pulse'), { once: true });
        setTimeout(() => { live.removeAttribute('data-mention-pulse'); if (onArrive) onArrive(); }, 1600);
        return;
      }
      requestAnimationFrame(pulseWhenVisible);
    })();
    return true;
  }

  function buildRow(rec, position) {
    if (rec.kind === 'file') return buildFileRow(rec);
    if (rec.kind === 'app') return buildAppRow(rec);
    if (rec.kind === 'payment') return buildPaymentRow(rec);
    if (rec.kind === 'call') return buildCallRow(rec);
    if (rec.eventChip) return buildEventRow(rec);   // #264 ⑤: accepted-request event chip
    // A text message that is JUST a remote image/GIF URL → media tile (Damir
    // 2026-07-07: legacy parity, reopens #82 for remote media). The model stays
    // kind 'text' (menu/reactions still work — attachMessageMenu targets
    // .c-mbubble too), we only swap the RENDER.
    const media = mediaUrlOf(rec.text);
    if (media) return buildMediaRow(rec, media);
    const isSent = rec.direction === 'sent';
    return createMessageBubble({
      direction: isSent ? 'sent' : 'received',
      position,
      text: rec.text || '',
      timestamp: rec.ts,
      status: isSent ? rec.status : null,
      paid: !!rec.paid,             // A2 (#302): message cost IXI (C# transactionId)
      // group/bot chats: show the sender nick, or the raw ADDRESS (middle-truncated
      // + click-to-copy in the component) when there's no nick yet (Damir 2026-07-07).
      // A nameless sender is one with no nick AND one whose "nick" is really its
      // own address (some C# paths pass the address as the nick fallback) — both
      // must render truncated + copyable, not a full untruncated address label.
      /* ★ W8 (#348) review r2 MAJOR — SECURITY. C# does not mask for us here:
         insertMessage sends senderAddress verbatim for `bot || Group` with no
         blindness test, and resolveNick falls back to the address as the nick —
         so senderHasNick guards the echo and the blind arm below never renders
         an address (no title, no copy, no sheet — plain span only).
         ★ D-19b (#370, the #369 AMENDED ladder — supersedes the #356 ladder):
         1. A real nickname ALWAYS wins — in blind rooms too (Damir: "keep
            nicknames visible in blind groups, only addresses are completely
            hidden"). A nick reveals no address; senderHasNick keeps the
            address-echo out of this arm.
         2. Blind + nameless → the "Hidden member" placeholder. NEVER an address.
         3. Non-blind + nameless → the truncated copyable address when the row
            has one (C# now reverse-resolves roster-known nicks, so this arm is
            rare), else NOTHING — legacy parity (#369: no "Hidden member" on any
            non-blind surface; the public Spixi bot room must never render
            masked). Anonymous rows share the '' run key and merge with each
            other only, so an unlabeled run never reads as a named sender's. */
      sender: (!isSent && mode.isMulti)
        ? (senderHasNick(rec) ? rec.senderNick
          : (mode.blind ? ((window.SL || {}).hiddenMember || 'Hidden member')
                        : (rec.senderAddress || null)))
        : null,
      senderIsAddress: (!isSent && mode.isMulti && !mode.blind && !senderHasNick(rec) && !!rec.senderAddress),
      showAvatar: (!isSent && mode.isMulti),
      name: senderHasNick(rec) ? rec.senderNick : '',
      address: rec.senderAddress || '',
      avatar: rec.avatar || null,   // real per-sender photo (C# addThem avatar); gradient fallback

      // #99: in a NON-blind group (type 1) OR a bot chat (type 3), the sender
      // label + avatar open the member sheet — the ONLY way to reach a NAMED
      // sender's full address (nick labels aren't copyable; the address is)
      // (Damir F5 2026-07-08). Blind groups (type 2) hide identities → no tap.
      /* ★ W8 (#348) review MAJOR-5 — SECURITY. `mode.type === 3` admits a BLIND BOT,
         and C# does NOT mask addresses for bots (the [Unknown] substitution in
         loadContacts is `type == Group && hideParticipantAddresses` only, xaml:552-560;
         the per-message push sends senderAddress verbatim for `bot || Group`, :1492).
         So tapping a sender in a blind bot channel opened a sheet showing that
         participant's FULL wallet address — in a chat whose entire purpose is to hide
         it. A blind GROUP was protected only by accident, because type 2 is not in the
         list. This is OUR surface (the member sheet is #99, legacy had none), so under
         the handover gate it is ours to fix. */
      onSenderClick: (!isSent && !mode.blind && (mode.type === 1 || mode.type === 3) && (rec.senderAddress || rec.senderNick))
        ? () => openMember(rec) : null,
      // resend has NO SingleChatPage case (dead verb) — gate the Retry affordance
      // behind cap('resend') so a failed message shows an HONEST "Not delivered"
      // (no dead button) until the BE cutover lands the resend case (audit M1).
      onRetry: (isSent && rec.status === 'failed' && bridge.cap('resend'))
        ? () => bridge.send('ixian:contextAction:resend:' + rec.id) : null,
      // URLs render as buttons; the shell confirms before opening externally
      // (#82 — P2P has no server, so no auto-load of remote content). Fixes
      // Damir F5: links were inert because no handler was wired.
      onLinkClick: (url) => confirmOpenLink(url),
      // @-mentions → highlighted spans (bold + tonal pill); self-mention stronger (#210)
      mention: mentionCtx(),
      // N34 (#365): Owner chip on the group-owner's run heads. !mode.blind is the
      // REAL frontend belt (loop MAJOR-1): the '[Unknown]' mask exists only on the
      // roster push, never on per-message addresses — and C#'s suppression can miss
      // a blind BOT whose botInfo hasn't persisted yet (getOwner reads a different
      // store). Same gate family as sender/onSenderClick above.
      roleBadge: (!isSent && mode.isMulti && !mode.blind && isOwnerAddr(rec.senderAddress))
        ? ((window.SL || {}).owner || 'Owner') : null,
      // M1 reply-to (#441). Rendered whenever the push carried a target — the
      // `reply` CAPABILITY gates who can CREATE one, not whether an incoming one
      // is shown, because a peer on a newer build can send one either way.
      reply: replyQuoteFor(rec),
      onReplyClick: (rec.replyTo && rows.get(String(rec.replyTo)))
        ? () => jumpToRow(String(rec.replyTo)) : null,
    });
  }

  /* —— remote media (GIF/image) tiles —————————————————————————————————————————
   * Damir 2026-07-07 (reopens #82, legacy parity, client-fetch — accepts that
   * loading a remote asset reveals the reader's IP to the host; flag for
   * BE/security sign-off): a message that is EXACTLY a direct image/GIF URL
   * renders as a tap-to-load tile (play button → fetch → full-screen viewer),
   * instead of the plain confirm-to-open link. Detection is conservative — a
   * direct media EXTENSION or a known direct-media host (media.tenor.com,
   * mediaN.giphy.com) — so a random page URL stays a link (a page URL wouldn't
   * load as an <img> anyway). Non-direct hosts fail-soft to the tile's retry
   * state. autoload stays OFF (a future "auto-load media" setting = legacy's
   * immediate load). NOTE: website OpenGraph meta cards are NOT wired — fetching
   * a site's meta from the WebView is CORS-blocked; that needs a proxy or
   * sender-composed meta (§82). */
  const MEDIA_EXT = /\.(gif|png|jpe?g|webp|bmp|avif)(\?|#|$)/i;
  /* ★★ #684 (Session F) — A SHARE LINK IS A PAGE URL, AND THAT IS THE WHOLE BUG.
     What a user pastes, and what the Android GIF keyboard hands us (LinkUri, see
     WebViewRenderer.OnCommitContent), is the SHARE page:
         https://giphy.com/gifs/excited-yay-l0HlvtIPzPdt2usKs
         https://tenor.com/view/happy-dance-gif-12345678
     Neither carries a media extension and neither is on a direct-media host, so both
     fell to `return null` and rendered as plain text. The picker was checked and is
     innocent — do not close this by pointing at it.
     ★ GIPHY IS DERIVABLE, so it is derived here: the share id is the last token of the
     last path segment, and https://i.giphy.com/<id>.gif is Giphy's canonical direct
     form. The tile then loads a real GIF instead of a web page.
     ⚠ TENOR IS NOT DERIVABLE and is deliberately left alone. A tenor.com/view/… page id
     is NOT the media hash in media.tenor.com/<hash>/… — recovering it needs a Tenor API
     call with a key, which this shell has no business making (#82: no auto-fetch, and a
     key in the client is a key in everyone's client). A Tenor share link therefore stays
     a confirm-to-open LINK. That is honest and it is still strictly better than today,
     where the keyboard's copy was dropped before it ever reached the shell.
     ★★ THE RIGHT LONG-TERM FIX IS NOT HERE AT ALL — see §7. Gboard hands C# BOTH a
     LinkUri and a ContentUri (the actual GIF file). Sending the FILE down the existing
     transfer path would render every provider identically AND close the #82 IP leak,
     because the recipient would fetch nothing from Tenor or Giphy. */
  function giphyDirectFromShare(u) {
    if (!/^(www\.)?giphy\.com$/.test(u.hostname.toLowerCase())) return null;
    const seg = u.pathname.split('/').filter(Boolean);
    // /gifs/<slug>-<id> · /stickers/<slug>-<id> · /embed/<id> · /gifs/<id>
    if (seg.length < 2 || !/^(gifs|stickers|embed|clips)$/.test(seg[0])) return null;
    // ⚠ clips are MP4, not GIF — a .gif URL for one 404s. Leave them as links.
    if (seg[0] === 'clips') return null;
    const last = seg[seg.length - 1];
    const id = last.split('-').pop() || '';
    /* Slug words are lowercase letters; a Giphy id is base62 and in practice carries a
       digit or a capital. Requiring one of those keeps "…/gifs/excited" from being read
       as an id. A wrong guess costs a broken tile, so the test is deliberately tight. */
    if (!/^[A-Za-z0-9]{7,}$/.test(id) || !/[A-Z0-9]/.test(id)) return null;
    return 'https://i.giphy.com/' + id + '.gif';
  }
  function mediaUrlOf(text) {
    const t = (text == null ? '' : String(text)).trim();
    if (!/^https?:\/\/\S+$/i.test(t) || /\s/.test(t)) return null;   // must be a lone URL
    let u;
    try { u = new URL(t); } catch (_) { return null; }
    const host = u.hostname.toLowerCase();
    const directGifHost = /^media\d*\.(tenor|giphy)\.com$/.test(host) || /^c\.tenor\.com$/.test(host) || /^i\.giphy\.com$/.test(host);
    if (MEDIA_EXT.test(u.pathname)) {
      return { url: t, kind: /\.gif(\?|#|$)/i.test(u.pathname) ? 'gif' : 'image' };
    }
    if (directGifHost) return { url: t, kind: 'gif' };
    const giphy = giphyDirectFromShare(u);
    if (giphy) return { url: giphy, kind: 'gif', from: t };
    return null;
  }
  function buildMediaRow(rec, media) {
    const isSent = rec.direction === 'sent';
    const label = media.kind === 'gif' ? 'GIF' : ((window.SL && window.SL.image) || 'Image');
    return createMediaBubble({
      direction: isSent ? 'sent' : 'received',
      kind: media.kind,
      src: media.url,
      alt: label,
      timestamp: rec.ts,
      gutter: mode.isMulti && !isSent,
      strings: window.SL || {},
      // legacy parity (Damir 2026-07-08): LOAD BY DEFAULT — or if the user loaded
      // this exact URL before (persisted), even when the global pref is off.
      autoload: mediaAutoloadOn() || loadedMedia.has(media.url),
      onOpen: () => openMediaViewer({ host: overlayHost, src: media.url, kind: media.kind, alt: label, strings: window.SL || {} }),
      // the tile grows from its placeholder box to the GIF's full size on load —
      // if the user was at the bottom, pull the log down; and remember this URL so
      // it auto-expands on re-entry even if autoload is later turned off.
      onLoad: () => { rememberLoadedMedia(media.url); if (nearBottom()) box.scrollTop = box.scrollHeight; },
    });
  }

  /* external-link confirm (#82): tapping an in-text link asks before leaving the
   * app / touching a remote URL, then opens via the legacy verb (dispatch 315). */
  function confirmOpenLink(url) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.openLinkTitle || 'Open external link?',
      body: url,
      host: overlayHost,
      actions: [
        { label: s.cancel || 'Cancel', type: 'text', autofocus: true },
        { label: s.openLink || 'Open', type: 'fill',
          onClick: () => bridge.send('ixian:openLink:' + url) },
      ],
    }));
  }

  /* file transfer row (chat.js addFile:904 / updateFile:1009).
   *   received + not started → 'offer'    → tap = ixian:acceptfile:<fileid>
   *   in transfer (0<p<100)  → 'progress' → no tap (disabled while downloading)
   *   complete               → 'complete' → tap = ixian:openfile:<fileid>
   * OUTGOING transfers now show progress too (Damir F5): the SENDER gets real
   * per-packet ticks (TransferManager.sendFileData → updateFile, 0→100+complete),
   * so a sent file shows the bar + "keep Spixi open" hint while transferring and
   * flips to complete (open button + success toast) when done — instead of the
   * legacy "own file = instantly complete". meta is empty (bridge sends no size). */
  function buildFileRow(rec) {
    return createFileBubble({
      direction: rec.direction,
      name: rec.name || '',
      meta: rec.meta || '',
      state: rec.fstate,
      progress: rec.progress || 0,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onAccept: () => bridge.send('ixian:acceptfile:' + rec.fileid),
      onOpen: () => bridge.send('ixian:openfile:' + rec.fileid),
      /* #334 (Damir ask): CANCEL an own offer the peer hasn't accepted yet —
       * routes through the DELETE grammar (the only durable local retraction:
       * the message goes, so the history-load resurrect has nothing to
       * re-prepare; C# also kills the in-memory outgoing transfer). Single
       * click per the #268 one-shot decision. Pre-accept window only: own
       * un-complete at 0 progress; the first packet tick removes the control
       * (setFileProgress). Peer-side residuals = C16 + the no-fileCancel
       * protocol gap (be-cutover). */
      onCancel: (rec.direction === 'sent' && rec.fstate !== 'complete'
        && !rec.transferStarted && !(Number(rec.progress) > 0) && !composerLock)
        ? () => onMenuAction('delete', rec)
        : undefined,
      /* loop MINOR-1: transferStarted (any updateFile tick) survives re-renders —
       * the progress check alone floored at 0 on big files and resurrected Cancel
       * on a LIVE transfer at every rebuild. loop MINOR-2: composerLock — the
       * delete grammar is gated in onMenuAction (sendMsgDelete EMITS to the
       * peer), so a locked chat must not render a dead Cancel; a mid-session
       * lock leaves an already-rendered Cancel inert until the next re-render
       * (accepted residual, rare path). */
    });
  }

  /* derive the file bubble state from the legacy addFile flags. */
  function fileStateFrom(me, progress, complete) {
    const p = Number(progress) || 0;
    if (asBool(complete) || p >= 100) return 'complete';
    // in-flight: OUTGOING shows send progress (bar + keep-open) — never 'offer'
    // (own files have no accept step); INCOMING = downloading vs a pending offer.
    if (asBool(me)) return 'progress';
    return p > 0 ? 'progress' : 'offer';
  }

  /* app invite/session card (chat.js addAppRequest:1174). state derives from the
   * stable localSender + appStatus signals; actions reuse the EXISTING verbs
   * (installApp / joinApp). C7(a): Decline is a LOCAL action — the invite card flips
   * to a terminal 'declined' state (persisted per peer, survives re-flush/re-open);
   * the sender is NOT notified (be-cutover C7 decline-notify is future BE). Only on
   * incoming invites (invite / missing states); own invites keep Cancel. */
  function buildAppRow(rec) {
    const incoming = rec.direction === 'received';
    const declined = incoming && declinedApps.has(String(rec.id));
    const canceled = !incoming && canceledApps.has(String(rec.id));   // ★ B2: my own invite, withdrawn
    // C7(b) privacy: a REMOTE (http) app icon auto-fetches from the publisher on render
    // → reveals the receiver's IP before any install consent (#82). Gate it behind the
    // media-autoload pref (privacy-first) so the same opt-out that suppresses remote chat
    // media also suppresses the publisher icon → rocket fallback. Local icon paths
    // (installed apps) are never remote, so never gated.
    const rawIcon = rec.iconUrl || null;
    const remoteIcon = !!rawIcon && /^https?:\/\//i.test(rawIcon);
    const iconUrl = (remoteIcon && !mediaAutoloadOn()) ? null : rawIcon;
    return createAppBubble({
      name: rec.name || '',
      iconUrl: iconUrl,
      state: declined ? 'declined' : (canceled ? 'canceled' : rec.astate),
      direction: rec.direction,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      // C7(b): only offer Get app when the invite actually carries an install URL —
      // otherwise installApp fires with an empty string and silently no-ops (C# fetch
      // rejects it). No URL → no dead button (the user can still Decline).
      onGet: rec.appInstallURL ? () => bridge.send('ixian:installApp:' + encodeURIComponent(rec.appInstallURL)) : undefined,
      onLaunch: () => bridge.send('ixian:joinApp:' + rec.appid),
      onJoin: () => bridge.send('ixian:joinApp:' + rec.appid),
      // in-session (already joined) → Resume reopens the app; joinApp re-shows the
      // minimized session. No End-session verb exists in the bridge → onEnd omitted
      // (createAppBubble gates it, so no dead button).
      onResume: () => bridge.send('ixian:joinApp:' + rec.appid),
      // local decline → persist + repaint as 'declined'; not shown once already declined
      onDecline: (incoming && !declined) ? () => declineApp(rec.id) : undefined,
      /* ★ B2 (#533 ①, Damir's locked shape): Cancel on MY invite → confirm → the
         RECIPIENT'S invite is removed through the existing msgDelete path (C#
         `cancelInvite`: sendMsgDelete to the peer, NO local delete) and MY card flips to
         a persistent "Canceled" (the #214 tombstone: per-peer localStorage set). The
         both-ends "Canceled" label waits for RC1 (BE). Before this the Cancel button
         had no handler at all (a dead button). */
      onCancel: (!incoming && !canceled && rec.astate === 'invited') ? () => confirmCancelInvite(rec) : undefined,
    });
  }

  function confirmCancelInvite(rec) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.cancelInviteTitle || 'Cancel this invite?',
      body: s.cancelInviteBody || 'The invite is removed from their chat. Your card stays here as canceled.',
      role: 'alertdialog', host: overlayHost,
      actions: [
        { label: s.keepInvite || 'Keep it', type: 'text', autofocus: true },
        { label: s.cancelInviteConfirm || 'Cancel invite', type: 'fill', intent: 'destructive', onClick: () => {
          cancelApp(rec.id);                             // persist + repaint NOW; C# answers cancelInviteResult
          bridge.send('ixian:contextAction:cancelInvite:' + rec.id);
        } },
      ],
    }));
    renderLog();                                         // release the card's oneShot latch (a "Keep it" must leave a live Cancel)
  }

  /* map the legacy addAppRequest flags → createAppBubble state.
   *   own invite (localSender)      → 'invited'    (Launch)
   *   incoming, app not installed   → 'missing'    (Get)
   *   incoming, session active      → 'in-session' (Resume) — C# 'Minimized' (xaml)
   *   incoming, installed, no session→ 'invite'    (Join) */
  function appStateFrom(localSender, appStatus) {
    if (asBool(localSender)) return 'invited';
    if (appStatus === 'Missing') return 'missing';
    if (appStatus === 'Minimized') return 'in-session';   // joined already → Resume, not Join again
    return 'invite';
  }

  /* payment card (chat.js addPaymentRequest / xaml.cs:1310,1361 · updates
   * 1648,1665). #523 SUPERSEDES the view-only interim: with the payRequest cap,
   * an incoming pending request's Pay acts IN PLACE through the W5 native-confirm
   * chain (C# signs; SECURITY.md intact), and an outgoing pending request carries
   * Cancel (#529 — the existing msgDelete path). Decline stays OUT for v1 (#526).
   * On an old exe (no caps) the view-only behavior below is unchanged. The
   * C#-localized `title` is passed verbatim because role alone can't tell a
   * REQUEST from a completed PAYMENT (the C1 enum gap — a best-effort interim). */
  /* Q4: signed-amount grammar. The component/demo canon (states matrix): a
   * RECEIVED direct payment shows a leading '+' (tone 'positive' when
   * completed); requests stay BARE on both sides. Request-vs-payment can only
   * be told apart by the C#-LOCALIZED title (the C1 enum gap) — matching the
   * *SL-SUBSTITUTED carrier makes that check hold in whatever locale C# runs.
   * Money-path safety: sign ONLY on a positive title match + a purely numeric
   * amount — an unrecognized title (unmapped locale drift), the '?' placeholder
   * (tx not yet fetched) or an already-signed amount stays bare/untouched
   * (today's rendering, never a WRONG sign). Display-only: rec.amount is kept
   * as pushed. Own/sent amounts keep the matrix's bare grammar; formatIxiAmount
   * (#77) still runs inside createPaymentBubble. */
  function displayPaymentAmount(rec) {
    const a = String(rec.amount == null ? '' : rec.amount);
    if (rec.direction !== 'received') return a;
    const title = String(rec.title || '').trim();
    if (title !== PAY_RECEIVED_TITLE) return a;
    // translation-collision guard (audit A-1): if this locale renders the request
    // title identically to the payment title, the signal is ambiguous → never sign
    if (title === PAY_REQUEST_RECEIVED_TITLE) return a;
    if (!/^[\d,]+(\.\d+)?$/.test(a)) return a;
    return '+' + a;
  }

  /* #264 ⑤: centered connection-event chip — the localized accepted-request
   * sentence with the subject swapped for the #211 canon (nick stays; a bare
   * base58 address renders middle-truncated). textContent-only (the subject is
   * counterpart-controlled). */
  function buildEventRow(rec) {
    // #434: rebuild from the template that actually MATCHED this row — a legacy
    // line must not be re-rendered inside the new sentence.
    const matched = acceptedEventMatch(rec.text);
    const parts = matched ? matched.parts : ACCEPTED_PARTS;
    const subject = matched ? matched.subject : '';
    /* ★ #589: this test was `/^[a-zA-Z0-9]{24,}$/` — 24 characters, and not even
       base58-restricted, so it accepted 0/O/I/l. A 24-character nickname without
       spaces is ordinary, and it was rendered middle-truncated as if it were an
       address. The shared canon needs 40+ base58 characters with a digit. */
    const display = isAddressShaped(subject) ? truncateAddressMiddle(subject) : subject;
    const row = document.createElement('div');
    row.className = 'chat-event';
    const chip = document.createElement('div');
    chip.className = 'chat-event__chip';
    try {
      if (window.SpixiIcons && window.SpixiIcons.icon) chip.append(window.SpixiIcons.icon('heart-handshake', { size: 16 }));
    } catch (e) { /* glyph optional */ }
    const line = document.createElement('span');
    line.textContent = parts ? (parts[0] + display + parts[1]) : rec.text;
    chip.append(line);
    row.append(chip);
    return row;
  }

  function buildPaymentRow(rec) {
    /* #264 ①: the viewPayment ARG is the MESSAGE id, not the tx id —
     * C# onViewPayment (xaml:897-899) resolves the message by
     * Crypto.stringToHash(arg); sending rec.txid (a REAL tx id on paid cards)
     * found no message and silently NRE'd — the old Details link was dead on
     * every paid/sent card. rec.id IS the message-id hex (arg 1 of the push).
     * #264 ②: an INCOMING PENDING REQUEST is now ACTIONABLE (Damir F5: "can't
     * action on it as I could in legacy"): role 'request-in' + Pay → the SAME
     * ixian:viewPayment verb — for an unpaid incoming requestFunds C# routes it
     * to WalletContactRequestPage (xaml:927-930), the NATIVE review/confirm
     * page (C# signs; SECURITY.md intact — the WebView only emits intent).
     * That page IS the mistake-proof confirmation UX. No onDecline (no in-chat
     * decline verb on the frozen bridge → the component hides Decline; the
     * review page is where the user backs out). Detection is locale-proof via
     * the existing Q4 title carrier; the pending shape is txid=""+enableView
     * (xaml:1375-1382; paid=":"-prefixed → txid set · declined="::" →
     * enableView=false). The oneShot Pay latch resets on return (OnAppearing →
     * loadMessages re-flush rebuilds the card — the #72 shell contract). */
    const view = (rec.enableView && rec.id) ? () => bridge.send('ixian:viewPayment:' + rec.id) : null;
    const pendingIncomingRequest = rec.direction === 'received'
      && rec.title === PAY_REQUEST_RECEIVED_TITLE
      && rec.enableView && !rec.txid;
    if (pendingIncomingRequest && view) {
      /* #526: Pay + Details ONLY — no Decline in v1 (Damir).
       * payRequest cap (W5): Pay acts IN PLACE — `ixian:payRequest:<msgId>` → C#
       * locates the request, shows the NATIVE confirm (+ auth), signs, and the
       * status pushes flip the card. A canceled confirm pushes payRequestResult
       * ('cancel') → re-render releases the oneShot latch. Old exe: Pay opens
       * the native review page (viewPayment), unchanged. */
      /* ★ W-d (Damir F5 2026-08-23): "show the new review dialog/sheet when someone
       * clicks Pay, rather than just the native dialog." With the payRequest cap,
       * Pay opens the c-sendreview SHEET (recipient · amount · live-quoted fee ·
       * total · Confirm & send) and ONLY its Confirm emits `ixian:payRequest:<id>`
       * → the NATIVE confirm (+ auth) → sign. Details is DROPPED while pending: it
       * routed to the legacy WalletContactRequestPage (ugly, and it exposed the
       * legacy Decline #526 removed) — the sheet IS the detail now; after payment
       * the tx detail shows as before. Old exe: Pay = the native review page. */
      // loop r1 A-2: 1:1 ONLY — C# rejects a group/bot pay (SingleChatPage:507) and a
      // requestFunds CAN land in a group/bot (StreamProcessor has no group gate), so
      // the sheet must never quote a fee against a group address and arm Confirm.
      const canSheet = bridge.cap('payRequest') && mode.type === 0
        && /^\d+(\.\d+)?$/.test(String(rec.amount == null ? '' : rec.amount).trim())
        && /[1-9]/.test(String(rec.amount));                 // loop r1 A-4: a zero amount has no sheet
      /* ★★ THE NATIVE PAYMENT PAGE IS REMOVED (Damir decision 4, 2026-08-29). Every
       * `canSheet === false` branch used to fall back to it — a page that no longer
       * exists — so all four now collapse into ONE honest rule: AN INCOMING REQUEST IS
       * ACTIONABLE ONLY WHEN IT CAN ACTUALLY BE PAID.
       * The four cases and why none of them was ever payable here:
       *   · no `payRequest` cap  — an exe older than this build; this one always has it
       *   · a group or bot room  — C# refuses the pay outright (SingleChatPage:507)
       *   · a non-numeric amount — nothing to quote a fee against
       *   · a zero amount        — the quote never answers
       * So the card renders as a plain record of the request instead of offering a Pay
       * that C# would refuse and a Details link into a deleted page. Nothing is lost:
       * the request is still visible, with its amount and its time.
       *
       * ★★ DECLINE lives on the CARD (decision 3), and only here — the same gate as
       * Pay, because declining is a message to the same peer about the same request.
       * It renders ONLY when wired (#264's no-dead-buttons canon), so the unpayable
       * card above carries no Decline either. */
      if (!canSheet) {
        return createPaymentBubble({
          role: 'request-in',
          status: 'pending',
          title: rec.title || '',
          amount: displayPaymentAmount(rec),
          timestamp: rec.ts,
          gutter: mode.isMulti,
          strings: window.SL || {},
        });
      }
      return createPaymentBubble({
        role: 'request-in',
        status: 'actionable',
        title: rec.title || '',
        amount: displayPaymentAmount(rec),
        timestamp: rec.ts,
        gutter: mode.isMulti,
        onPay: () => openPayRequestReview(rec),
        onDecline: () => bridge.send('ixian:declineRequest:' + rec.id),
        // W-d: the SHEET carries the detail; there is no other detail surface left.
        onDetails: null,
        strings: window.SL || {},
      });
    }
    /* #529: OUTGOING pending request → 'request-out' with Cancel. No protocol
     * cancel verb exists (SpixiMessageCode read, Ixian-Core) — Cancel = confirm
     * modal → the EXISTING delete path (msgDelete, both ends). Paid/declined
     * requests fall through to the plain card below. */
    const pendingOutgoingRequest = rec.direction === 'sent'
      && rec.title === PAY_REQUEST_SENT_TITLE
      && !rec.txid && rec.pstatus === 'pending';
    if (pendingOutgoingRequest && rec.id) {
      return createPaymentBubble({
        role: 'request-out',
        status: 'pending',
        title: rec.title || '',
        amount: displayPaymentAmount(rec),
        timestamp: rec.ts,
        gutter: mode.isMulti,
        onCancel: () => confirmCancelRequest(rec),
        onDetails: view,
        strings: window.SL || {},
      });
    }
    return createPaymentBubble({
      role: rec.direction === 'sent' ? 'sent' : 'received',
      title: rec.title || '',
      amount: displayPaymentAmount(rec),
      status: rec.pstatus,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onDetails: view,
      strings: window.SL || {},
    });
  }

  /* #529: Cancel request = delete the request message on BOTH ends (the existing
   * msgDelete path — receiver honors + persists it). The modal states exactly
   * that; a receiver-side "Canceled" label needs a new protocol verb (BE row). */
  function confirmCancelRequest(rec) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.cancelRequestTitle || 'Cancel this request?',
      body: s.cancelRequestBody || 'The request is removed from this chat for both of you.',
      role: 'alertdialog', host: overlayHost,
      actions: [
        { label: s.keepRequest || 'Keep it', type: 'text', autofocus: true },
        { label: s.cancelRequestConfirm || 'Cancel request', type: 'fill', onClick: () => {
          sendDeleteMessage(rec.id);                   // latches pendingLocalDeletes + emits the verb
        } },
      ],
    }));
    // release the card's oneShot latch NOW (the modal scrim blocks re-taps): a
    // "Keep it"/Esc close must leave a live Cancel button behind it.
    renderLog();
  }

  /* map the legacy FontAwesome status_icon → the redesigned card status enum.
   * C# emits only these three for payments (xaml.cs:1249/1265/1284/1325/1331/
   * 1336): fa-check-circle → completed · fa-exclamation-circle → declined ·
   * fa-clock (waiting/pending) → pending. */
  function paymentStatusFrom(statusIcon) {
    const s = String(statusIcon || '');
    if (s.indexOf('check') !== -1) return 'completed';
    if (s.indexOf('exclamation') !== -1) return 'declined';
    return 'pending';
  }

  /* call event card (chat.js addCall:1496). VIEW-ONLY best-effort (BE cutover
   * C4): the bridge conflates direction + no-answer/missed into one `declined`
   * flag plus a localized text blob. declined → render as "missed" so a call-
   * back is offered; otherwise it was answered → the (m:ss) duration is pulled
   * out of the text. directionLabel is left empty — it isn't recoverable from
   * the localized string.
   *
   * ★★ ROUND 3 (review3-cs MAJOR-2) — THIS LINK WAS THE CALL RULE'S THIRD HOME,
   * AND IT ANSWERED DIFFERENTLY FROM THE OTHER TWO.
   *   ① It sent `ixian:call`, which is a TOGGLE. During a live call that branch
   *      hangs up, ungated. So a user in a call could open any chat holding a
   *      call card, tap a control labelled "Call back", and END THE CALL with no
   *      confirmation. It now sends `ixian:callback`, a verb with ONE leg that
   *      can never end a call. Hang up stays ungated on the topbar toggle, where
   *      it belongs.
   *   ② It ignored the reveal. Any conversation that holds a call card offered a
   *      call, in rooms where C# reveals no phone action at all — including a
   *      device with no audio codec, which then dialled with an EMPTY codec list.
   *      The link is now painted only when `callVisible` is true, which is the
   *      shell's copy of C#'s own answer (`showCallButton`), and it is RE-ASKED
   *      at tap time because the room type and the relation can flip in between.
   *   ③ Its refusal was silent. C# now pushes `callRefused`, and the handler
   *      below says so on screen.
   * ⚠ C# is the authority. This is the paint gate, not the only gate: the same
   * rule is enforced in SingleChatPage.canPlaceCall before any call is placed. */
  /* the tap. `callVisible` is re-read HERE, not captured at paint time: a card can
   * sit in the log for a whole session while C# changes its mind about the room. */
  function callBackFromCard() {
    if (!callVisible) { showCallRefusal('unavailable'); return; }
    bridge.send('ixian:callback');
  }

  /* one refusal copy, for the shell's own gate and for C#'s `callRefused` push. */
  function showCallRefusal(reason) {
    const sl = window.SL || {};
    const text = String(reason || '') === 'busy'
      ? (sl.callBusy || 'A call is in progress. End that call first.')
      : (sl.callUnavailable || 'You cannot make a call in this chat.');
    try { showToast({ text: text, tone: 'error', host: overlayHost, strings: sl }); }
    catch (e) { dbg('showCallRefusal: the toast failed — ' + e); }
  }

  function buildCallRow(rec) {
    return createCallBubble({
      missed: rec.missed,
      /* ★ #572 ④: the DECLINED card (phone-x medallion, no call-back nudge — the
       * #87⑦ grammar) instead of the missed one. createCallBubble already lets
       * `declined` win over `missed`, so both flags can be passed honestly. */
      declined: !!rec.declinedLocal,
      direction: rec.direction || 'received',   // C4: outgoing calls finally sit right
      // pass the C#-localized label verbatim (duration stripped — shown
      // separately) so "No answer" (outgoing rang-out) isn't reconstructed as
      // "Missed voice call". Direction stays default until BE sends it (C4).
      title: rec.label || '',
      duration: rec.duration || '',
      timestamp: rec.ts,
      onCallBack: callVisible ? callBackFromCard : null,
    });
  }

  /* reactions (chat.js addReactions:549). The bridge sends a ;-joined "key:count"
   * string. v1 renders LIKE reactions (heart + count), toggled via the existing
   * `like` contextAction (xaml.cs:1045). Tips carry a txid, not a display amount
   * (xaml.cs:979/1607), so we can't show the value — but we DO render a tip pill
   * (heart-handshake glyph + "Tipped", Damir F5) so a tip is visible on the
   * bubble. C5: the bridge's trailing own arg (";"-joined keys I reacted with) is
   * authoritative; myLikes stays as the optimistic/old-exe fallback. */
  function parseReactions(str, id, ownStr) {
    const reactions = [];
    let tipCount = 0;
    /* ★★ L2 (#641): the SAME push carries the receipt counts. C# emits every reaction
       key with its member count — `received:3;seen:2;like:1;` — and this parser dropped
       every non-emoji key on the floor. Two of them are counted now and kept on the
       record, so the long-press detail is built from data the shell already receives.
       NOTHING new crosses the bridge.
       ★★ `received:` IS NOT COUNTED, AND THAT IS DELIBERATE (Damir, 2026-08-27). It is
       the DELIVERY receipt. C# owns the delivery rule and the bubble tick renders it.
       A delivery number kept here would be a number with no legal reader, and the next
       agent would find it and derive from it. See receiptDetail. */
    let seenCount = 0;
    let downloadedCount = 0;
    const ownKeys = new Set(String(ownStr || '').split(';').filter(Boolean));
    // C5: when the bridge supplies the own-keys arg (new exe) it is AUTHORITATIVE —
    // honor it exclusively so a stale local myLikes can't override an authoritative
    // negative (e.g. a reaction removed on another device). myLikes is used ONLY on
    // old exes that don't send the arg (ownStr === undefined).
    const likedByMe = ownStr !== undefined ? ownKeys.has('like') : myLikes.has(String(id));
    for (const tok of String(str || '').split(';')) {
      if (!tok) continue;
      const parts = tok.split(':');
      const count = parseInt(parts[parts.length - 1], 10) || 0;
      if (count <= 0) continue;
      if (tok.startsWith('like')) reactions.push({ emoji: '❤️', count, own: likedByMe });
      else if (tok.startsWith('tip')) tipCount += count;   // txid, not amount → count only
      // ★★ L2 (#641): read + download, per DISTINCT member (Core de-duplicates by sender).
      // `received:` falls through this chain on purpose — see the note above.
      else if (tok.startsWith('seen')) seenCount = count;
      // ★ Damir's ask: Core stores a fileReceived: reaction per member, exactly like
      // received:. So "N of M downloaded" needs no protocol change — the count is already
      // in this push and was being dropped with the other two.
      else if (tok.startsWith('fileReceived')) downloadedCount = count;
    }
    const sl = window.SL || {};
    const tip = tipCount > 0
      ? (tipCount > 1 ? (sl.tipped || 'Tipped') + ' ×' + tipCount : (sl.tipped || 'Tipped'))
      : '';
    return { reactions, tip, seenCount, downloadedCount };
  }

  /* React to a message with a like (the ONE reaction the bridge supports —
   * xaml.cs:1045). Records my like locally for the own-state (C5 interim), emits
   * the toggle, and optimistically reflects it on the row so the pill shows
   * selected immediately (C#'s addReactions re-emit lands the authoritative
   * count next). Shared by the context-menu React action AND tapping a pill. */
  function reactToMessage(id) {
    // ⑪ Q1 re-review: no outbound stream traffic while the contact is PENDING. A
    // pending-outgoing chat still renders ONE row (the empty `requestAddSent`
    // marker falls through insertMessage's requestAdd special-case, xaml:1306-1322),
    // so its pill/menu were reachable — a reaction to a non-contact never arrives.
    if (composerLock) return;
    id = String(id);
    myLikes.add(id);
    saveLikes();                                       // persist own-state across re-flushes (C5 interim)
    bridge.send('ixian:contextAction:like:' + id);
    const rec = model.get(id);
    if (!rec) return;
    rec.reactions = rec.reactions || [];
    const heart = rec.reactions.find((r) => r.emoji === '❤️');
    if (heart) heart.own = true;                       // count updates when C# responds
    else rec.reactions.push({ emoji: '❤️', count: 1, own: true }); // optimistic first like
    const row = rows.get(id);
    if (row) applyRowReactions(rec, row, true);
  }

  /* apply a record's stored reactions to its live row — called from renderLog so
   * pills survive re-renders, and from the addReactions handler for a live pop. */
  function applyRowReactions(rec, row, animate) {
    const hasReactions = rec.reactions && rec.reactions.length;
    if (!hasReactions && !rec.tip) return;
    applyReactions(row, {
      reactions: rec.reactions || [],
      tip: rec.tip || '',
      animate: !!animate,
      host: box,
      onToggle: () => reactToMessage(rec.id),
    });
  }

  /* —— message context menu (long-press + right-click) ————————————————————————
   * Attached to TEXT rows in renderLogNow. Actions map to existing bridge verbs;
   * Reply/Edit are §8-gated behind a capability flag (OFF until BE), so they
   * never render today. Non-text cards keep their own inline actions in v1. */
  const overlayHost = document.body;
  /* A7 (#302): legacy's 64 000-char ceiling (js/chat.js:403). Counted on the
     TRIMMED text in raw UTF-16 units — the same units C# prices in (:757). */
  const MAX_MESSAGE_CHARS = 64000;
  /* A6 (#302): hard clamp on the bot-authored server description before it ever
     reaches the DOM. The CSS line-clamp is the visual cap; this is the data cap. */
  const DESCRIPTION_MAX = 500;
  // Batch C (M6): on desktop, a RIGHT-CLICKED message menu presents as an anchored
  // dropdown at the pointer with the source row highlighted (demo 06c ⑩/⑰ grammar);
  // long-press keeps the centered dialog. No-op on mobile (data-desktop absent).
  attachContextMenuAnchors({ host: overlayHost, rows: '.c-bubble-row' });
  /* Menuable = a CONTENT row. Text gets copy/edit; file/payment/app cards get
   * react + tip + delete too (Damir: "file/payment can't react or tip — change
   * that"). Call logs are excluded — reacting/tipping a call record is
   * nonsensical and they carry their own call-back affordance; an event chip
   * (#264 ⑤) is not a message at all. ⑪ Q1 re-review: nothing is menuable while
   * the contact is pending — a menu whose actions are all gated is a dead menu.
   * ★ SAME predicate feeds the selection `selectable` below, so "menuable" and
   * "selectable" can never drift apart (a row you can Select from must stay
   * selectable once the mode is on). */
  function isMenuableRec(rec) {
    if (!rec) return false;
    if ((rec.kind || 'text') === 'call') return false;
    if (rec.eventChip) return false;
    if (composerLock) return false;
    return true;
  }
  /* ═══ ★★ L2 (#641) — THE RECEIPT DETAIL, IN THE LONG-PRESS MENU ═══════════════
   *
   * Damir, 2026-08-27: *"perhaps we don't need in the long press menu to show
   * delivered. Just seen and downloaded if there's a file. having delivered seems
   * redundant"*. He is right. The reason decides the shape of this function.
   *
   * ★★ THE BUBBLE TICK ALREADY ANSWERS "DID IT ARRIVE". C# derives that one answer
   * and pushes it as the message status. This menu answers the part the tick cannot
   * show: who has READ the message, and who has PULLED the file. A delivered count
   * here repeated the tick. Three review rounds found an impossible sentence on that
   * repeated count, every round on this line. Duplication is what produced it.
   *
   * ★★ THE SHELL DERIVES NOTHING ABOUT DELIVERY. It prints two counts that C# sends.
   * It reconciles nothing. The delivery rule has ONE home and that home is C#. Do NOT
   * add a `received:` term to this function. Do NOT take a maximum over the receipt
   * keys. `parseReactions` drops `received:` for the same reason: a number that no
   * reader may use must not be kept, because the next agent finds it and uses it.
   *
   * ★ TWO CLEAN KEYS, AND ONLY TWO.
   *   · `seen:`         — the READ count. Core writes one per member.
   *   · `fileReceived:` — the DOWNLOAD count. A FILE row only.
   * Both count DISTINCT members, because Core de-duplicates a reaction by sender.
   * ⚠ `like:` and `tip:` are NOT usable here, and this is why the "one rule, all
   * receipt keys" story cannot be completed: SingleChatPage.xaml.cs:1934 and :1751
   * add the LOCAL user's own like and own tip under the local address. So `like:1`
   * can name nobody but me (review3-fe MAJOR-2).
   *
   * The denominator is the OTHER members: `groupRoster.size` counts every participant
   * INCLUDING this device (C# loadContacts pushes one addContact per `friend.users`
   * entry), so the people who can confirm are one fewer.
   *
   * ★ EVERY CLAUSE CARRIES ITS OWN DENOMINATOR. A clause can then be dropped without
   * changing what the other clause means, and a row with one clause reads exactly
   * like a row with two.
   *
   * ★★ NO COUNTS, NO LINE. The menu says NOTHING rather than say something it cannot
   * support. That one rule covers every empty case:
   *   · an INCOMING message — no line. The counts describe my own message.
   *   · a 1:1 chat — no line. The bubble says it all.
   *   · a BOT room — no line. A bot reports no per-member receipt, so there is no
   *     honest count and no honest roster to divide by.
   *   · a roster under 2 — no line. A denominator we do not have.
   *   · nobody read and nobody downloaded — ★ SEE THE NEXT PARAGRAPH. This one case
   *     is no longer silent.
   *
   * ★★ THE EMPTY-COUNT CASE SAYS SO IN WORDS (Damir F5, 2026-08-28: *"the row should
   * say - nobody has seen this yet"*). He is right, and the reason is precise: the
   * four cases above are silent because we have NO HONEST ANSWER — no roster, no
   * receipts to describe, or a room type that reports none. This case is different.
   * We HAVE the roster, the message is mine, and every member has reported nothing.
   * "Nobody has seen this yet" is exactly that fact, stated.
   * ⚠ It is still NOT "0 of 3 read". A zero reads as a measurement of every member;
   * the sentence reads as the absence of any report, which is what we actually know.
   * The other four returns stay empty — do not fold them into this line.
   */
  function receiptDetail(rec) {
    if (!rec || rec.direction !== 'sent') return '';
    if (mode.isBot) return '';                          // a bot reports no per-member receipt
    if (!mode.isMulti) return '';                       // 1:1 — the bubble says it all
    const others = groupRoster.size - 1;
    if (others < 1) return '';                          // no honest denominator yet
    const s = window.SL || {};
    /* ★★ ONE ROSTER CLAMP, BOTH COUNTS. Each count counts DISTINCT members, so no
       count can exceed the room. The clamp is written ONCE and both counts pass
       through it. Delete this line and the "9 of 3" case fails for both counts. */
    const inRoom = (n) => Math.min(Math.max(Number(n) || 0, 0), others);
    const seen = inRoom(rec.seenCount);
    /* The download count belongs to a FILE row only. No other row kind carries a
       fileReceived: receipt, so a count on one would answer a question nobody asked. */
    const got = rec.kind === 'file' ? inRoom(rec.downloadedCount) : 0;
    const fill = (t, n) => t.split('{n}').join(String(n)).split('{m}').join(String(others));
    const parts = [];
    if (seen > 0) parts.push(fill(s.readOf || '{n} of {m} read', seen));
    if (got > 0) parts.push(fill(s.downloadedOf || '{n} of {m} downloaded', got));
    /* ★ Damir F5, 2026-08-28. Reached ONLY here: a group, my own message, a known
       roster of two or more, and not one receipt of any kind. Every other empty case
       returned above, where we have no honest answer to give. */
    if (!parts.length) return s.noneSeenYet || 'Nobody has seen this yet';
    return parts.join(' · ');
  }

  function menuOptsFor(rec, row) {
    const isSent = rec.direction === 'sent';
    return {
      host: overlayHost,
      text: rec.text || '',
      /* ★★ L2 (#641): a FUNCTION, not a string. attachMessageMenu captures these options
         at ROW-WIRE time and replays them on every long-press, and the writer of the
         counts does not re-render the row — addReactions patches the pills in place. A
         string computed here froze at wire time, so a menu could report a read count
         that a later push had already raised. Evaluated on open, it is always current. */
      detail: () => receiptDetail(rec),
      reactions: ['❤️'],   // the bridge only persists "like" (C8: emoji reactions need a core change — be-cutover C8)
      capabilities: {
        reply: bridge.cap('reply'),                       // §8-gated, OFF until BE (#25)
        edit: bridge.cap('edit') && isSent && !!rec.text, // own text only
        /* W8 (#348, Damir F5): tip is offered in BOT groups now — the Spixi bot group
           had no Tip while a normal group did. BLIND chats keep no tip: a tip pays the
           message's SENDER, and a blind chat hides who that is. mode.blind, not
           `type !== 2` — a blind BOT is type 3 (see setChatMode).
           ★ review MINOR-6: a tip in a multi-party chat resolves the recipient from the
           MESSAGE's sender address, and C# refuses when it has none (a system or relayed
           post in a bot channel). Require it here so the row never offers a button C#
           will silently drop.
           ★ review MINOR-7: `blindKnown` degrades against an exe that predates the 7th
           setChatMode argument. Such a build still blocks tip for EVERY bot, so offering
           it there would be a dead button — the same failure this batch is removing. */
        /* ★★ #613 round 2: the money gate is `hidesAddresses`, NOT `blind`. It is the
           value C#'s own refusal reads, so the offer and the refusal now agree by
           construction — which is the whole point of the 7th argument. */
        tip: (!isSent && !mode.hidesAddresses && (!mode.isMulti || !!rec.senderAddress)
              && (!mode.isBot || mode.blindKnown)),
        report: mode.isBot,                               // C# report is bots-only (xaml:1026)
        // multi-select: offered on every menu-able row. Selection carries Copy
        // (text rows) + bulk Delete (any row), so a file/payment card qualifies.
        select: true,
      },
      onAction: (action, arg) => onMenuAction(action, rec, row),
    };
  }
  function wireMenu(rec, row) {
    // the menu auto-hides Copy (no text) and Edit (not own text)
    if (!isMenuableRec(rec)) return;
    attachMessageMenu(row, menuOptsFor(rec, row));
  }

  /* ONE delete path. C# has a SINGLE-message verb only
   * (ixian:contextAction:deleteMessage:<id> → SingleChatPage → friend.deleteMessage,
   * which echoes deleteMessage(id) back). Bulk delete is therefore an FE LOOP over
   * that verb — no new bridge command, nothing invented on the C# side. Each id
   * gets its own local-delete latch so the Q12 exdel hint stays correct (A-1). */
  function sendDeleteMessage(id) {
    if (!mode.isBot) {
      const lid = String(id);
      pendingLocalDeletes.add(lid);
      setTimeout(() => pendingLocalDeletes.delete(lid), 10000);
    }
    bridge.send('ixian:contextAction:deleteMessage:' + id);
  }

  /* —— multi-message selection (Damir, tonight) ————————————————————————————————
   * WhatsApp/Telegram grammar: menu → "Select" → the log enters selection mode
   * (check circle per row, tap toggles) and the chat topbar is REPLACED by the
   * contextual bar (✕ · "N selected" · Copy · Delete).
   *
   * ENTRY, per surface (Damir: "long press to select"):
   *  · TOUCH — long-press → the message menu, whose FIRST group carries "Select"
   *    (Telegram's grammar). Long-press is this app's ONLY route to react / tip /
   *    delete / report, so it cannot be spent on selection alone; WhatsApp can
   *    only do that because its selection bar re-homes all of them in an overflow.
   *  · DESKTOP/POINTER — ⌘/Ctrl-click a message (attachPointerSelectEntry below).
   *    The OS-wide multi-select idiom; long-press is a poor desktop affordance and
   *    right-click already belongs to the anchored menu.
   *  · KEYBOARD — Shift+F10 / the Menu key opens the message menu on the focused
   *    row (or the newest one) → Select. Inside the mode every row is tabbable,
   *    Space toggles, Esc exits.
   *
   * The handle is shell-scoped because the log RE-RENDERS constantly (status
   * ticks, new messages, deletes): renderLogNow replaces every row node, so the
   * selection has to be re-applied by id afterwards (chatSelect.refresh()). */
  let chatSelect = null;
  function exitChatSelect() { if (chatSelect) chatSelect.exit(); }
  function startChatSelect(row) {
    if (chatSelect) return;
    const s = window.SL || {};
    chatSelect = enterChatSelect(box, {
      initialRow: row,
      host: topbarHost,                 // the bar COVERS the chat topbar (native contextual bar)
      idOf: (r) => r.dataset.msgid || '',
      // selectable = any row the model still knows and the menu would accept
      // (isMenuableRec — ONE predicate, so the two can't drift). Call logs,
      // event chips, date separators and the unread divider carry no menuable
      // record and are skipped automatically: they get no check circle, no
      // role=checkbox, and a tap on them does nothing.
      selectable: (r) => isMenuableRec(model.get(r.dataset.msgid || '')),
      textOf: (r) => { const rec = model.get(r.dataset.msgid || ''); return (rec && rec.text) || ''; },
      senderOf: (r) => {
        const rec = model.get(r.dataset.msgid || '');
        if (!rec) return '';
        if (rec.direction === 'sent') return s.you || 'You';
        /* ★ W8 (#348) review r3 MAJOR — SECURITY. This is the multi-select COPY path.
           C#'s resolveNick falls back to `nick = senderAddress.ToString()` (xaml:1487),
           so `rec.senderNick` IS the raw address for a member with no nickname — and
           chat-select joins it as "<sender>: <text>" straight into the clipboard.
           senderHasNick keeps that echo out of the nick arm, so a blind chat never
           copies an address.
           ★ D-19b (#370): the SAME amended ladder as the bubble label —
           nick always (blind included; a nick is already on the bubble) ·
           blind + nameless → the placeholder (attribution without identity) ·
           non-blind + nameless → truncated address, or NO attribution when the
           row has none (legacy parity, #369 — the placeholder is dead on
           non-blind surfaces; chat-select renders an empty sender as bare text). */
        if (senderHasNick(rec)) return rec.senderNick;
        if (mode.blind) return s.hiddenMember || 'Hidden member';
        if (mode.isMulti) return rec.senderAddress ? truncateAddressMiddle(rec.senderAddress, 9, 6) : '';
        return identity.name || '';
      },
      strings: s,
      onCopy: (n, okCopy) => {
        if (!okCopy) {
          showToast({ text: s.copyFailed || 'Couldn’t copy. Select the address text instead', tone: 'error', host: overlayHost, strings: s });
          return;
        }
        showToast({
          text: n === 1 ? (s.copied || 'Copied')
            : (s.messagesCopied || '{n} messages copied').split('{n}').join(String(n)),
          tone: 'success', host: overlayHost, strings: s,
        });
      },
      onDelete: (items) => confirmBulkDelete(items),
      onExit: () => { chatSelect = null; syncChatOverlay(); },   // N51: select mode leaves the back mirror
    });
    /* #376 loop A-1 (MAJOR): enterChatSelect can auto-exit INSIDE its constructor
       (initial row not selectable — a menu opened on a row the counterpart then
       deleted → exit() at count 0). onExit fires BEFORE the assignment above
       lands, so the stored handle is already DEAD — and exit() early-returns on a
       torn-down selection, so it can never fire onExit again. A dead handle
       reported the mirror open forever and WEDGED hardware back. Detect the
       constructor-auto-exit on the live DOM state and drop the handle. */
