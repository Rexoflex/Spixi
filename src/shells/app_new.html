<!DOCTYPE html>
<html lang="en">
<head>
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spixi — Add app</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark)
     so the page doesn't flash white while tokens.css + the bundle load. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/apps-add.css"><!-- premium add-app: method tiles + trust banner + URL field -->
<style>
  /* Production shell: fill the WebView. app_new.html is loaded by the C# AppNewPage
     (PUSHED). The premium add-app surface is the c-apps-add component (method tiles +
     trust banner + revealable URL field), Discover omitted for phase 1. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #topbar-slot { flex: none; }
  #add-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #add-scroll > .c-apps-add { max-width: 560px; margin: 0 auto; }
  /* Boot spinner — static, theme-colored loader shown during the ~1MB bundle
     parse / before first render (mirrors contact_details.html); the first
     replaceChildren render swaps it out, so the load gap is never blank. */
  .boot { flex: 1; min-height: 100%; display: flex; align-items: center; justify-content: center; }
  .boot__spinner {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    border: 3px solid var(--outline-neutral-02);
    border-top-color: var(--icon-action-default, var(--surface-action-default));
    animation: boot-spin var(--duration-700, 700ms) linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot__spinner { animation: none; } }
</style>
</head>
<body>
  <div id="topbar-slot"></div>
  <div class="u-scroll" id="add-scroll"><div class="boot"><div class="boot__spinner" role="status" aria-label="Loading"></div></div></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Add-app shell — the redesigned AppNewPage, wired to the REAL C#
   * MAUI bridge (native.js in the bundle). Reached from the apps surface
   * (Add mini app → ixian:newapp → C# pushes AppNewPage, which loads this file).
   * ZERO C# change, frozen bridge.
   *
   * Contract (verified bridge-audit-B §11, AppNewPage.xaml.cs):
   *   JS→C#: ixian:onload · ixian:back · ixian:fetch:<url> (fetch appinfo by URL
   *            → C# navigates to AppDetailsPage in installing mode) · ixian:quickscan
   *            (native ScanPage → result via setScannedData) · ixian:selectAppFile
   *            (native file picker → AppDetailsPage installing mode).
   *   C#→JS: setScannedData(url) (scan result → prefill the URL field) · showUrlError
   *            (fetch/file/invalid → clear loading + inline error).
   *
   * NOTES / deviations (flagged in the handoff):
   *   - Fetch = INDEFINITE loading resolved by NAVIGATION: C# navigates to the
   *     details page on success (this WebView is torn down), or pushes showUrlError
   *     on failure. Same wedge as add-contact (#185 L1) — a hard failure that
   *     neither navigates nor errors would leave the button latched; showUrlError
   *     is the only failure signal C# provides here, so a grace-timeout fallback
   *     restores the button if nothing arrives.
   *   - Local length/format gating is minimal (C# validates the fetched package);
   *     empty URL is caught inline before hitting the bridge (no ixian:error verb
   *     on this page — divergence #2 precedent, honest inline copy).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, setLoading,
    createAppsAdd, setAddUrl, setAddError,
    createNativeBridge, installExecuteUiCommand,
  } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const topbarSlot = document.getElementById('topbar-slot');
  const scroll = document.getElementById('add-scroll');

  topbarSlot.append(createTopbar({
    variant: 'view', title: strings.addApp || 'Add app', backLabel: strings.back || 'Back',
    onBack: () => bridge.send('ixian:back'),
  }));

  /* —— premium add-app surface (c-apps-add) ——————————————————————————————————
   * Method TILES (Paste link → reveals a URL field · Scan QR · From file), the
   * "Mini apps are lightweight… only add apps you trust" trust banner. Discover is
   * OMITTED (discover:false) for phase 1 — no directory feed wired yet. Wired to the
   * three AppNewPage verbs (bridge-audit-B §11): fetch / quickscan / selectAppFile. */
  let getBtn = null;      // the field's Get-app c-button (grabbed post-build for loading)
  let fetchGrace = 0;

  const addEl = createAppsAdd({
    strings,
    discover: false,
    // Paste-link "Get app" → ixian:fetch:<url>. Indefinite loading resolved by
    // NAVIGATION on success (C# → AppDetailsPage, this WebView torn down) or by a
    // showUrlError push on failure; the grace timeout only unwedges the rare
    // no-signal case (same wedge as add-contact #185 L1 — BE: onFetchFailed(msg)).
    onFetchUrl: (url) => {
      if (!url) { setAddError(addEl, strings.enterAppUrl || 'Enter an app link.'); return; }
      if (getBtn) setLoading(getBtn, true);
      bridge.send('ixian:fetch:' + url);
      clearTimeout(fetchGrace);
      fetchGrace = setTimeout(() => {
        if (getBtn) setLoading(getBtn, false);
        setAddError(addEl, strings.fetchMaybeFailed
          || 'If nothing happened, that link may be invalid or unreachable.');
      }, 8000);
    },
    // Scan QR → native ScanPage; the decoded URL returns via setScannedData.
    onScan: () => bridge.send('ixian:quickscan'),
    // From file → native file picker → AppDetailsPage installing mode.
    onPickFile: () => bridge.send('ixian:selectAppFile'),
  });
  scroll.replaceChildren(addEl);   // replaces the boot spinner on first render
  getBtn = addEl.querySelector('.c-apps-add__field .c-button');

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS handlers — page globals (executeUiCommand resolves bare fnRefs).
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    // QR-scan result → reveal + prefill the URL field (C# already trims the ":ixi…"
    // suffix + applies its 20<len<128 heuristic before pushing).
    setScannedData(url) {
      clearTimeout(fetchGrace);
      if (getBtn) setLoading(getBtn, false);
      setAddUrl(addEl, url || '');
    },
    // fetch / file-pick / invalid-package failure → clear loading + inline error.
    showUrlError() {
      clearTimeout(fetchGrace);
      if (getBtn) setLoading(getBtn, false);
      setAddError(addEl, strings.appUrlInvalid || 'That link or file isn’t a valid mini app.');
    },
  };

  bridge.exposeAll(handlers);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s preset setScannedData push. —— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
