<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spixi components — demo</title>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<style>
  /* demo chrome only — not part of the system */
  body { padding: var(--spacing-24); max-width: 900px; margin: 0 auto; }
  .demo-toolbar { display: flex; gap: var(--spacing-12); align-items: center; margin-bottom: var(--spacing-32); }
  .demo-section { margin-bottom: var(--spacing-40); }
  .demo-row { display: flex; gap: var(--spacing-12); align-items: center; flex-wrap: wrap; margin-bottom: var(--spacing-12); }
  .demo-label { width: 90px; flex: none; color: var(--text-neutral-02); font-size: var(--font-size-body-sm); }
  .demo-full { max-width: 360px; border: 1px dashed var(--outline-neutral-02); padding: var(--spacing-12); border-radius: var(--radius-12); }
</style>
</head>
<body>
  <div class="demo-toolbar">
    <h1 class="t-heading-md" style="margin-right:auto">Components</h1>
    <span id="theme-slot"></span>
  </div>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Button — sizes × types (intent: default)</h2>
    <div id="grid-default"></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Button — destructive</h2>
    <div id="grid-destructive"></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">States</h2>
    <div class="demo-row"><span class="demo-label">disabled</span><span id="row-disabled"></span></div>
    <div class="demo-row"><span class="demo-label">loading</span><span id="row-loading"></span></div>
    <div class="demo-row"><span class="demo-label">load→done</span><span id="row-interactive"></span></div>
    <div class="demo-row"><span class="demo-label">destructive</span><span id="row-destructive-flow"></span></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Icons</h2>
    <div class="demo-row"><span class="demo-label">leading</span><span id="row-icon-leading"></span></div>
    <div class="demo-row"><span class="demo-label">trailing</span><span id="row-icon-trailing"></span></div>
    <div class="demo-row"><span class="demo-label">icon-only</span><span id="row-icon-only"></span></div>
  </section>

  <section class="demo-section">
    <h2 class="t-heading-xs" style="margin-bottom: var(--spacing-16)">Width: full (fills container)</h2>
    <div class="demo-full" id="row-full"></div>
  </section>

<script>
  /* ============================================================
     GENERATED INLINE COPY — source of truth: src/components/button.js
     Self-contained so the demo opens via double-click (file:// blocks
     ES-module imports). Regenerated on component change. DECISIONS.md #27.
     ============================================================ */
  function createButton({
    label, type = 'fill', size = 44, intent = 'default', width = 'hug',
    icon = null, iconPosition = 'leading', ariaLabel,
    loading = false, disabled = false, onClick,
  } = {}) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'c-button';
    el.dataset.type = type;
    el.dataset.size = String(size);
    el.dataset.intent = intent;
    el.dataset.width = width;
    const hasLabel = label != null && label !== '';
    if (!hasLabel) {
      el.dataset.iconOnly = '';
      if (ariaLabel) el.setAttribute('aria-label', ariaLabel);
      else console.warn('c-button: icon-only button requires ariaLabel');
    }
    if (icon) icon.classList.add('c-button__icon');
    if (icon && iconPosition === 'leading') el.append(icon);
    if (hasLabel) {
      const text = document.createElement('span');
      text.className = 'c-button__label';
      text.textContent = label;
      el.append(text);
    }
    if (icon && iconPosition === 'trailing') el.append(icon);
    if (onClick) el.addEventListener('click', onClick);
    setLoading(el, loading);
    el.disabled = disabled;
    return el;
  }
  function morphWidth(el, mutate) {
    if (el.dataset.width === 'full' || !el.isConnected) { mutate(); return; }
    const w0 = el.offsetWidth;
    mutate();
    el.style.width = 'auto';
    const w1 = el.offsetWidth;
    el.style.width = w0 + 'px';
    void el.offsetWidth; // reflow so the transition has a start value
    el.style.width = w1 + 'px';
    clearTimeout(el._morphTimer);
    el._morphTimer = setTimeout(() => { el.style.width = ''; }, 250);
  }
  function setLoading(el, loading) {
    morphWidth(el, () => {
      const existing = el.querySelector('.c-button__spinner');
      if (loading) {
        if (!existing) {
          const spinner = document.createElement('span');
          spinner.className = 'c-button__spinner';
          spinner.setAttribute('aria-hidden', 'true');
          el.prepend(spinner);
        }
        el.dataset.loading = '';
        el.setAttribute('aria-busy', 'true');
      } else {
        if (existing) existing.remove();
        delete el.dataset.loading;
        el.removeAttribute('aria-busy');
      }
    });
  }
  const CHECK_PATH = 'M5 12l5 5L20 7';
  function setSuccess(el, opts) {
    opts = opts || {};
    const label = opts.label || null;
    const duration = opts.duration || 1400;
    if (el.dataset.success !== undefined) return;
    const original = Array.prototype.slice.call(el.childNodes).filter(
      n => !(n.classList && n.classList.contains('c-button__spinner'))
    );
    const originalDisabled = el.disabled;
    morphWidth(el, () => {
      el.textContent = '';
      el.dataset.success = '';
      el.disabled = true;
      delete el.dataset.loading;
      el.removeAttribute('aria-busy');
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('aria-hidden', 'true');
      svg.classList.add('c-button__icon');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', CHECK_PATH);
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '2.5');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      svg.append(path);
      el.append(svg);
      const text = document.createElement('span');
      text.className = 'c-button__label';
      text.setAttribute('role', 'status');
      if (label) text.textContent = label;
      el.append(text);
    });
    setTimeout(() => {
      morphWidth(el, () => {
        el.textContent = '';
        el.append.apply(el, original);
        delete el.dataset.success;
        el.disabled = originalDisabled;
      });
    }, duration);
  }
  /* ============================ demo ============================ */

  const TYPES = ['fill', 'tonal', 'outline', 'text'];
  const SIZES = [56, 44, 32];

  function makeIcon(d) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.append(path);
    return svg;
  }
  const ARROW_RIGHT = 'M5 12h14M13 6l6 6-6 6';
  const ARROW_LEFT = 'M19 12H5M11 18l-6-6 6-6';
  const QR = 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM20 17v3h-3';

  const themeBtn = createButton({
    label: 'Toggle dark', type: 'outline', size: 32,
    onClick: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark';
      root.dataset.theme = dark ? 'light' : 'dark';
      themeBtn.querySelector('.c-button__label').textContent = dark ? 'Toggle dark' : 'Toggle light';
    },
  });
  document.getElementById('theme-slot').append(themeBtn);
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

  for (const pair of [['grid-default', 'default'], ['grid-destructive', 'destructive']]) {
    const grid = document.getElementById(pair[0]);
    for (const size of SIZES) {
      const row = document.createElement('div');
      row.className = 'demo-row';
      const label = document.createElement('span');
      label.className = 'demo-label';
      label.textContent = size + 'px';
      row.append(label);
      for (const type of TYPES) row.append(createButton({ label: 'Button', type, size, intent: pair[1] }));
      grid.append(row);
    }
  }

  const disabledRow = document.getElementById('row-disabled');
  for (const type of TYPES) disabledRow.append(createButton({ label: 'Button', type, disabled: true }));

  const loadingRow = document.getElementById('row-loading');
  for (const type of TYPES) loadingRow.append(createButton({ label: 'Loading', type, loading: true }));

  // load 1.2s → success morph 1.4s → restore (DECISIONS.md #29)
  const interactive = createButton({
    label: 'Save settings', type: 'fill',
    onClick: () => {
      setLoading(interactive, true);
      setTimeout(() => setSuccess(interactive, { label: 'Saved' }), 1200);
    },
  });
  document.getElementById('row-interactive').append(interactive);

  const destructiveFlow = createButton({
    label: 'Delete history', type: 'tonal', intent: 'destructive',
    onClick: () => {
      setLoading(destructiveFlow, true);
      setTimeout(() => setSuccess(destructiveFlow, { label: 'Deleted' }), 1200);
    },
  });
  document.getElementById('row-destructive-flow').append(destructiveFlow);

  document.getElementById('row-icon-leading').append(
    createButton({ label: 'Back', type: 'tonal', icon: makeIcon(ARROW_LEFT) }),
    createButton({ label: 'Scan', type: 'outline', icon: makeIcon(QR) }),
  );
  document.getElementById('row-icon-trailing').append(
    createButton({ label: 'Continue', type: 'fill', icon: makeIcon(ARROW_RIGHT), iconPosition: 'trailing' }),
  );
  document.getElementById('row-icon-only').append(
    createButton({ type: 'fill', icon: makeIcon(QR), ariaLabel: 'Scan QR code' }),
    createButton({ type: 'tonal', icon: makeIcon(ARROW_LEFT), ariaLabel: 'Back' }),
    createButton({ type: 'text', size: 32, icon: makeIcon(ARROW_RIGHT), ariaLabel: 'Forward' }),
  );

  document.getElementById('row-full').append(
    createButton({ label: 'Send payment', type: 'fill', size: 56, width: 'full' }),
  );
</script>
</body>
</html>
