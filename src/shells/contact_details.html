<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>

<style>
  /* Production shell: fill the WebView. contact_details.html is loaded by the C#
     ContactDetails page (PUSHED, not a home tab) — the c-chat-info panel provides
     its own topbar (variant 'view') with a back button, so no separate chrome. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #contact-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #contact-root > * { flex: 1; min-height: 0; }
  /* ★★ L1 (#640): the money compose cover — the SAME grammar chat.html uses for its
     in-chat send (.chat-send-takeover); its review sheet (z-40) and Max modal (z-50)
     render on top. One class name per shell, so a rule can never leak between them. */
  .cd-send-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .cd-send-takeover__body { flex: 1; min-height: 0; overflow-y: auto; }
  /* Boot state: shown until the FIRST coalesced commit lands, so we never paint an
     empty panel that flashes to filled ~120ms later (the flicker fix). A lightweight
     centered spinner — replaced wholesale by the real panel on first render. */
  /* ★ A8 (Batch A 2026-08-24): the boot skeleton — hero disc + three rows, the shape
     of the panel to come; the same neutral wash + slow shimmer chat-info.css uses. */
  .contact-boot { display: flex; flex-direction: column; gap: var(--spacing-16); padding: var(--spacing-24) var(--spacing-16); }
  .contact-boot__hero { display: flex; flex-direction: column; align-items: center; gap: var(--spacing-12); padding-block: var(--spacing-16); }
  .contact-boot__disc { width: 80px; height: 80px; border-radius: var(--radius-full); background: var(--surface-neutral-02); }
  .contact-boot__row { display: flex; align-items: center; gap: var(--spacing-12); min-height: 56px; padding: var(--spacing-4); }
  .contact-boot__dot { flex: none; width: var(--size-avatar-40); height: var(--size-avatar-40); border-radius: var(--radius-full); background: var(--surface-neutral-02); }
  .contact-boot__line { height: 14px; border-radius: var(--radius-full); background: var(--surface-neutral-02); }
  .contact-boot__disc, .contact-boot__dot, .contact-boot__line { animation: contact-boot-shimmer 1.4s var(--easing-standard) infinite; }
  /* ★★ Item 6 (Damir, decision 9): CROSSFADE the skeleton into the content — the
     skeleton fades OUT as the real panel fades IN, in the same box, not a per-row
     swap and not a hold-then-snap. Both children share one grid cell for the length
     of the fade; the root goes back to its flex column the moment it ends. */
  #contact-root.is-crossfading { display: grid; }
  #contact-root.is-crossfading > * { grid-area: 1 / 1; min-width: 0; min-height: 0; }
  #contact-root.is-crossfading > .contact-boot { pointer-events: none; }
  .cd-fade { opacity: 1; transition: opacity 180ms var(--easing-standard); }
  .cd-fade--in { opacity: 0; }
  .contact-boot.is-leaving { opacity: 0; transition: opacity 180ms var(--easing-standard); }
  @media (prefers-reduced-motion: reduce) {
    .cd-fade, .contact-boot.is-leaving { transition: none; }
  }
  @keyframes contact-boot-shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .contact-boot__disc, .contact-boot__dot, .contact-boot__line { animation: none; } }
  /* N27 (#367): the blocking-group list inside the remove-blocked modal.
     max-height + scroll (loop MAJOR M1): the list is data-driven and c-modal
     has no overflow of its own — many groups (or landscape) must scroll the
     LIST, never push the OK button past the clipped viewport. */
  /* Loop r2 MINOR-1: the FIXED chrome (title + intro + path + actions) alone can
     exceed a short landscape viewport with the host scroll-locked — cap the
     modal itself so OK is always reachable by scroll. Shell-scoped on purpose:
     the global c-modal grammar is not this batch's to change. */
  .c-modal { max-height: calc(100% - 32px); overflow-y: auto; }
  .cd-remove-blocked {
    margin: var(--spacing-8) 0 var(--spacing-12);
    padding-inline-start: var(--spacing-24);
    font-weight: var(--font-weight-semibold);
    max-height: 40vh;
    overflow-y: auto;
  }
  .cd-remove-blocked li { margin-block: var(--spacing-4); overflow-wrap: anywhere; }
  /* Unit 6 (#247): desktop pane hosting. C# pushes setPaneMode('1'|'2') pre-present:
       '1' = the detail slot (no conversation open) — the body content caps at the demo
             grammar 640, title bar spans full width (#245b pattern);
       '2' = the 360px column beside the open conversation — hairline divider on its
             leading edge (the col-1 case reuses the home shell's right-edge hairline,
             so no double line; the 640 cap is inert at pane width). */
  body[data-pane] .c-chat-info__body { max-width: 640px; margin-inline: auto; width: 100%; }
    body[data-pane="2"] { border-inline-start: 1px solid var(--outline-neutral-03); }
</style>

  <div id="sl-carriers" hidden aria-hidden="true">
    <!-- ★ Session I: the DEVICE 12/24-hour setting ("h23" / "h12"), registered by HomePage

  <div id="contact-root">
    <!-- ★ A8 (Batch A 2026-08-24): the boot cover is a SKELETON of the panel (hero disc

      <div class="contact-boot__row" aria-hidden="true"><span class="contact-boot__dot"></span><span class="contact-boot__line" style="width:70%"></span></div>
    </div>
  </div>

<script src="../components/icons.iife.js"></script>

<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. Before this, production resolved
     'en-us' in EVERY locale. ?lang= still overrides (demos/tests); in a plain-browser
     preview the marker stays un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Contact-details / chat-info shell — the redesigned 1:1 contact
   * surface wired to the REAL C# MAUI bridge (native.js in the bundle). Reached
   * by tapping a 1:1 chat header (SingleChatPage emits ixian:details → C# pushes
   * ContactDetails, which loads this file). ONE component (createChatInfo) also
   * powers the in-chat GROUP info takeover (src/shells/chat.html).
   *
   * ARCHITECTURE §5 / bridge-audit-A §2 (ContactDetails.xaml.cs).
   * ⚠ NO LONGER "zero C# change": ★★ L1 (#640) routes the money composes here. The
   * verbs are not new to the app — they are the SAME three SingleChatPage answers —
   * but ContactDetails.xaml.cs now answers them too, and declares setCaps.
   *
   * Contract (verified ContactDetails.xaml.cs):
   *   C#→JS: setPaneMode('1'|'2') [#247 desktop pane, pre-present]
   *          · setContext('chat'|'contact') [#248 entry-dependent title/actions]
   *          · showCallButton() [★ #591: reveal the Call action — codecs + Approved]
   *          · setGroupInfo(count, blind, admin, notifications, owner) +
   *            clearMembers/addMember(addr, nick, avatar, role) [#248 group surface]
   *          · setAddress(addr) · setNickname(nick) [every sec] · setAvatar(path)
   *          ["" = none] · showIndicator("true"|"false") · clearRecentActivity()
   *          · addPaymentActivity(txid, type, time, amount, confirmed)  (5-arg;
   *          type = LOCALIZED "Sent"/"Received"; confirmed "true"|"error")
   *          · [★★ L1 #640] setCaps('composeSend,composeRequest') ·
   *            setSendQuote(addr, amount, fee, balance, max, error) ·
   *            signSendResult('ok'|'cancel'|'fail', message).
   *   JS→C#: ixian:onload · ixian:back · ixian:remove (remove contact) ·
   *          ixian:removehistory · ixian:chat ·
   *          [★★ L1 #640] ixian:signSend:<addr>:<amount> · ixian:feeQuery:<addr>:<amount>
   *          · ixian:sendrequest:<addr>:<amount> — the money composes, IN-SHELL. They
   *          REPLACE ixian:request / ixian:send, which pushed the legacy
   *          WalletReceivePage / WalletSendPage; both pages are deleted.
   *          ixian:txdetails:<txid> · ixian:userdefinednick:<nick> ·
   *          [#248 group] ixian:leave · ixian:en/disableNotifications ·
   *          ixian:kick:<addr> · ixian:ban:<addr> (all forwarded by ContactDetails,
   *          mirroring the SingleChatPage handlers).
   *
   * CONTEXT CHOICE (Damir 2026-07-08 — revises #142): context 'contact', kind
   *   'contact'. The contact-details page now shows the "Contact details" title +
   *   a leading "Message" button (ixian:chat → opens/pops the conversation) AND
   *   keeps BOTH destructive actions — the component was un-gated so context
   *   'contact' renders "Delete chat history" (ixian:removehistory) alongside
   *   "Remove contact" (ixian:remove). ixian:chat pushes SingleChatPage when
   *   reached from the contacts list, or pops back when opened from a chat header
   *   (customChatBtn) — same "open conversation" outcome either way.
   *
   * UPDATE CHURN: C#'s updateScreen() re-pushes setNickname + setAvatar +
   *   showIndicator EVERY SECOND, and clears + re-adds the WHOLE tx list every
   *   second. A naive rebuild-per-push would wipe an in-progress nickname edit,
   *   the open payments accordion, and scroll position every tick. So pushes are
   *   coalesced (settle timer) and the panel is rebuilt ONLY when the meaningful
   *   state (name / address / tx set) actually CHANGES — and never while a
   *   nickname edit is open. The avatar rebuilds once when it resolves; PRESENCE
   *   deliberately does NOT rebuild — it flips at the poll cadence, so it is
   *   applied with a targeted toggle instead (A4/#302, setChatInfoPresence) and is
   *   only re-seeded into stateSig so a rebuild from another cause keeps it.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createChatInfo, setChatInfoPresence, formatIxiAmount,
    createNativeBridge, installExecuteUiCommand,
    attachEdgeBack,   // ★ L3 (#706): the iOS back signal + the one-level chain
    attachPressFeedback,
    openRemoveContactSheet, setRemoveSheetGroups, setRemoveSheetResult,   // ★★ spec §4: the SAME sheet the chats row opens
    isPseudoAddressNick, dismissTopOverlay,          // D-19b (#370) blind pseudo-key display guard · N50 back-dismiss wiring
    isAddressShaped,                                 // ★ #591: an address-shaped "nickname" must not become the sheet's title
    showToast,                                       // N55: optimistic request-sent feedback,
    openAddressSheet,                                // ★ #591: the ONE address surface, peer variant
    applyPushedTheme,
    /* ★★ L1 (#640) — the money compose, ported from chat.html. This page emitted
     * `ixian:send` / `ixian:request`, which pushed the LEGACY WalletSendPage /
     * WalletReceivePage. Damir: "Nothing legacy was supposed to exist in this app
     * anymore." Same three symbols the chat shell destructures, same aliasing:
     * `setSendQuote` is renamed because the BRIDGE HANDLER below shares the name. */
    createTopbar,                                    // the takeover's own view topbar (Back)
    createWalletSend,                                // Pay  → the lockedRecipient compose (W5 #523)
    openRequestSheet,                                // Request → the amount sheet (#139/#528)
    setSendQuote: applySendQuote,                    // W6 — the component-side quote applier
  } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  /* #343: ONE call lights up press feedback for every pressable surface in this
     shell (src/components/pressable.js). Delegated on document, so rows created
     later by a re-render are covered without re-attaching. A new shell needs
     exactly this line. */
  attachPressFeedback();
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[contact-details]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;

  const root = document.getElementById('contact-root');

  /* —— contact state — flushed by ContactDetails.onLoad + updateScreen (1/sec) —— */
  const state = {
    name: '',            // friend.nickname (display name; incorporates any user-defined nick)
    address: '',
    online: false,       // showIndicator — NOT rendered by the component yet (gap), no rebuild
    avatarPath: null,    // setAvatar — rendered in the c-chat-info hero; onerror → gradient fallback
    txs: [],             // committed tx rows (txlist-item opts)
    txsBuf: null,        // accumulator between clearRecentActivity and the settle
    callable: false,     // ★ #591: revealed by showCallButton — C# gates on codecs + FriendState.Approved, exactly as the chat header does. Default FALSE so a contact who cannot be reached never shows the action.
    sharedGroups: null,  // ★ A4: [{ name, address }] once setSharedGroups answers; null = not yet; undefined = no answer (strip hidden)
    membersLanded: false,   // ★ A8: the first roster commit landed
    // #248: entry-dependent context — 'chat' (header/row-menu → "Chat info"/"Group
    // info", no Message action) vs 'contact' (directory → "Contact details").
    context: 'contact',
    // #248 GROUP surface: ContactDetails now carries group info too (setGroupInfo +
    // clearMembers/addMember roster — same contract family as SingleChatPage CI1).
    isGroup: false,
    group: { count: 0, blind: false, admin: false, notifications: true, owner: '' },
    /* ★ NOTIF-2 (Damir's 2026-08-21 block): the per-1:1 mute. Pushed by ContactDetails
       as setContactNotifications("1"|"0") for the 1:1 case only — the group surface
       carries its own value in setGroupInfo, and that one is SYNCED to the other side
       while this one is local to the device. Defaults ON so the row cannot paint as
       muted before the push lands. */
    notifications: true,
    members: [],         // committed roster [{ name, address, avatar, owner }]
    membersBuf: null,    // accumulator between clearMembers and the settle
  };

  /** Resolve a C# avatar arg to an <img> src or null (same rule as the other
   *  shells). Threaded into the c-chat-info hero; a path that can't load degrades
   *  cleanly via the avatar component's onerror → deterministic gradient. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }

  /* Best-effort direction from the LOCALIZED tx type ("Sent"/"Received"). C#
   * sends a localized string, not an enum (a fragile signal — flagged as a BE
   * ask). Compare against the shell's own localized words, then a multilingual
   * "received" stem, else default to outgoing. The row LABEL always shows the
   * verbatim C# string, so a wrong arrow never mislabels the row. */
  function txDirection(typeText) {
    const t = String(typeText || '').trim().toLowerCase();
    if (!t) return 'out';
    const recv = (strings.received || 'Received').toLowerCase();   // fallback = the dict value (A4 sweep: one key, one English)
    const sent = (strings.sent || 'Sent').toLowerCase();
    if (t === recv) return 'in';
    if (t === sent) return 'out';
    if (/receiv|empfang|recib|reçu|ricev|получ|recebid|受信|接收/.test(t)) return 'in';
    return 'out';
  }

  /* #366 loop m1: members the user requested from THIS page — the optimistic
   * 'pending' must survive change-gated panel rebuilds (chat-info mutates only
   * its mapped copy). One page = one contact, so the set never needs a reset. */
  const requestedMembers = new Set();

  /* ★★ REMOVE-CONTACT SPEC §4 (Damir, screenshots 2026-08-28): THE DEAD END IS GONE.
   * This page used to answer a refusal with "Cannot remove contact — this contact is a
   * member of these groups: • seengroup" and a single OK. It named the obstacle and
   * offered no way past it, while the chats row already had the actionable answer.
   * Both hosts open ONE component now — openRemoveContactSheet — which lists the
   * shared groups, offers to leave them, and only then removes. The C# refusal push
   * is retired with it, and so are its three strings.
   * ⚠ Deliberately NOT naming the retired modal function here: the pin that forbids it
   * reads raw file text, and a rationale block that quotes what it removed is how a
   * negative goes green over its own explanation — this suite's oldest lesson. */
  function openRemoveContact() {
    openRemoveContactSheet({
      chat: { name: state.name, address: state.address, avatar: state.avatarPath, type: 'contact' },
      host: document.body, strings,
      // This page already asks at boot and the answer may be here; hand it over at once
      // AND re-ask, so a sheet opened before the first answer landed still fills in.
      onNeedGroups: () => {
        if (state.sharedGroups) setRemoveSheetGroups(state.address, state.sharedGroups);
        bridge.send('ixian:sharedGroups');
      },
      onRemove: ({ leaveGroups }) => {
        bridge.send('ixian:removecontact:' + ((leaveGroups && leaveGroups.length) ? '1' : '0'));
      },
    });
  }

  /* —— panel build (change-gated, see UPDATE CHURN above) ——————————————————— */
  let built = false;
  let lastSig = '';

  /* ★ #591: the address row opens the ONE address surface (#527) in its PEER variant —
     their address, so the copy says "their", and the self-only safety line ("it never
     gives anyone access to your wallet") is dropped rather than re-worded into a true
     sentence about the wrong person's money.
     ⚠ NO onShare: `ixian:share` shares the USER'S OWN primary address (HomePage
     :635-641), so wiring it here would offer "Share" on a contact's address and send
     the reader's instead. Copy is the honest affordance until a peer-share verb exists.
     ★ Session I (#731 "bot-info address is a dud"): ONE handler for BOTH panel
     branches. The 1:1 branch had it; the group/bot branch never passed it, so a bot's
     row rendered chat-info's handler-less fallback — a plain div with the truncated
     address and nothing behind it (no copy, no QR, no full address). A bot address is
     a real wallet address exactly like a contact's (C# pushes setAddress for every
     non-group Friend; hidesParticipants() is false for FriendType != Group), so it
     gets the full contact grammar. Groups never reach this: chat-info suppresses the
     row for kind 'group' (a group id is a local session id, not an address). */
  function openPeerAddressSheet({ address }) {
    openAddressSheet({
      address, strings, host: document.body, subject: 'peer',
      /* state.name IS the display name (it already incorporates any user-defined nick
         — see the state declaration); there is no separate nickname field here.
         ⚠ AND IT CAN BE THE ADDRESS. `Friend.nickname` falls back to the address for an
         unnamed contact (the #276/#279 echo class), so an unguarded title would render
         a full base58 as the sheet's heading and aria-label — directly above the row
         #591 truncated to 9…6. Same guard the roster ingests use. */
      title: (state.name && !isAddressShaped(state.name) && !isPseudoAddressNick(state.name))
        ? state.name
        : (strings.peerAddressTitle || 'Ixian address'),
    });
  }

  function buildPanel() {
    // #248 GROUP surface: kind 'group' renders name/avatar + notifications toggle +
    // the full member list (owner chip, admin kick/ban) + Leave — no money, no
    // Message, no nickname override (group rename = a BE ask, no verb exists).
    // Context is forced to 'chat' for groups ("Group info" — a group is never a
    // "contact details" surface even from the directory).
    if (state.isGroup) {
      return createChatInfo({
        kind: state.group.kind || 'group',   // #249: 'bot' → members/notifications, no Leave (CI4)
        context: 'chat',
        name: state.name,
        address: state.address,
        avatar: state.avatarPath,
        avatarSeed: state.address,
        memberCount: state.group.count,
        // ★ A8 (Batch A, loop r1 relocation — the in-chat takeover is dead code since #249,
        // THIS surface is the info): skeleton rows until the roster's first commit lands
        // (clearMembers → addMember×N → the 120 ms settle) or 2.5 s pass
        loading: !state.membersLanded && state.members.length === 0 && Date.now() - bootAt < 2500,
        members: state.members.map((m) => ({
          name: m.name, address: m.address, avatar: m.avatar,
          owner: !!(state.group.owner && m.address && m.address !== '[Unknown]' && m.address === state.group.owner),
          // #366: honest sheet badges + Add-contact gating. The requestedMembers
          // latch (loop m1): chat-info's optimistic 'pending' lives on the MAPPED
          // copy, so any rebuild (late setAvatar, a tx push) would re-offer the
          // request button — the latch survives rebuilds. Page = one contact, so
          // no reset is needed (a new ContactDetails loads a fresh shell).
          relation: (requestedMembers.has(m.address) && (m.relation || 'none') === 'none')
            ? 'pending' : (m.relation || ''),
        })),
        blind: state.group.blind,
        amOwner: state.group.amOwner,   // N48 (#370): hero "You are the owner" chip in blind rooms
        notifications: state.group.notifications,
        capabilities: { notifications: true, admin: state.group.admin },
        host: document.body,
        strings,
        onBack: () => bridge.send('ixian:back'),
        // iOS-26 (Damir F5): a group reached from the CONTACTS DIRECTORY had no way
        // into its conversation — the surface dead-ended, which defeats the reason
        // groups were put back in the directory (a wiped history must not orphan the
        // group). Entered from inside the chat (context 'chat') there is nothing to
        // offer: you are already there. Title stays "Group info" either way.
        onMessage: state.context === 'chat' ? undefined : () => bridge.send('ixian:chat'),
        // notifications toggle → the group mute verbs (#248 ContactDetails forwards;
        // fire-and-forget, resolve optimistically — same as the in-chat takeover).
        onNotifications: (next, ctrl) => {
          state.group.notifications = next;
          bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
          ctrl.done();
        },
        // admin kick/ban (#248 forwards); blind-masked rows have no real address —
        // never emit a verb with a masked payload.
        onMemberAction: (action, m, ctrl) => {
          if (m && m.address && m.address !== '[Unknown]' && (action === 'kick' || action === 'ban')) {
            bridge.send('ixian:' + action + ':' + m.address);
          }
          ctrl.done();
        },
        // N26 (#366): member-sheet "Send contact request" — ContactDetails now
        // carries the SAME guarded verb as SingleChatPage (shared helper). The
        // chat-info layer gates it on relation === 'none'; masked rows never emit.
        onContactRequest: (m) => {
          if (m && m.address && m.address !== '[Unknown]') {
            requestedMembers.add(m.address);   // loop m1: survive panel rebuilds
            bridge.send('ixian:sendContactRequest:' + m.address);
            // N55: optimistic toast at the emit site (fire-and-forget verb, no ack)
            showToast({ text: strings.contactRequestSent || 'Contact request sent', tone: 'success', host: document.body, strings });
          }
        },
        onLeave: (ctrl) => { bridge.send('ixian:leave'); ctrl.done(); },
        // ★ Session I: the bot's address row opens the same peer address sheet as a
        // contact's (chat-info renders the row for kind 'bot' only — never 'group').
        onAddressSheet: openPeerAddressSheet,
      });
    }
    return createChatInfo({
      kind: 'contact',
      // #248: entry-dependent — 'contact' (directory) keeps the Message action +
      // "Contact details" title; 'chat' (header/row-menu) titles "Chat info".
      context: state.context,
      name: state.name,
      address: state.address,
      avatar: state.avatarPath,        // real contact photo (setAvatar); gradient fallback if unresolved
      avatarSeed: state.address,       // identity-stable gradient hue even before the name lands
      online: state.online,            // A4 (#302): seed the hero dot on (re)build; live flips go
                                       // through setChatInfoPresence, see showIndicator
      nickname: '',                    // no separate wire-name vs override signal; name = display name,
                                       // edit prefills empty w/ name as placeholder (empty = clear override)
      txs: state.txs,
      // ★ A4 (Batch A 2026-08-24): groups you are both in — asked at boot
      // (ixian:sharedGroups), answered by setSharedGroups; null until then.
      sharedGroups: state.sharedGroups,
      loading: state.sharedGroups === null,
      onOpenGroup: (g) => { if (g && g.address) bridge.send('ixian:openChat:' + g.address); },
      // A4: `capabilities` is a FEATURE-GATE bag ("this surface supports presence"),
      // not a live-value channel — it was carrying state.online since #142 and
      // nothing ever read it. The live value now rides the top-level `online` opt.
      /* ★ NOTIF-2: notifications is LIVE for 1:1 now (media/selfDestruct still have no
         bridge verb — §9). ContactDetails' existing ixian:en/disableNotifications
         handlers gained a 1:1 branch that writes a LOCAL device preference, because a
         1:1 friend has no botInfo to hold the flag and Core may not be changed here.
         Muting is therefore device-side and the peer is never told — which is also the
         correct privacy behaviour for muting somebody. */
      capabilities: { presence: true, notifications: true },
      notifications: state.notifications,
      host: document.body,             // confirm modals / QR-adjacent sheets attach to the page body
      strings,

      onBack: () => bridge.send('ixian:back'),

      // Message → open the conversation with this contact (ixian:chat: pushes
      // SingleChatPage from the contacts list, pops back from a chat header).
      onMessage: () => bridge.send('ixian:chat'),

      /* ★ NOTIF-2: the 1:1 mute. Same verbs as the group surface — ContactDetails
         routes on whether botInfo exists, so the shell asks one question and does not
         need to know where the answer is stored. Resolved optimistically like the group
         toggle: the write is a local preference that cannot fail in a way the user could
         act on, and C# re-pushes the stored value on the next open. */
      onNotifications: (next, ctrl) => {
        state.notifications = next;
        bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
        ctrl.done();
      },

      // nickname → local user-defined override (ixian:userdefinednick). Empty clears it.
      // C# re-pushes friend.nickname on the next tick, so the display self-heals.
      onNickname: (nick, ctrl) => { bridge.send('ixian:userdefinednick:' + nick); ctrl.done(); },

      /* ★★ #591 (Damir's mockup): CALL joins the action row. `ixian:call` was handled
         ONLY by SingleChatPage — this page had no such verb, so the button would have
         been dead the day it shipped (#215). The handler is four lines on the C# side
         and it delegates to the same VoIPManager entry the chat header uses; nothing
         about the call surface itself changes. 1:1 only, both here and in the
         component: there is no group-call verb to route. */
      /* ⚠ C# refuses the verb while a call is already live (VoIPManager.isInitiated), and
         the tap is then silent. That is accepted, and NOT because silence is good: this
         shell has no call state to test — #270 moved the call surface into its own
         WebView (CallPage) and nothing pushes "a call is up" here. A toast keyed on a
         flag this document does not have would have been invented data.
         What makes the silence tolerable is that the in-call STRIP is already on screen
         above this page saying exactly that. If Damir wants explicit feedback it needs a
         push, not a guess. */
      onCall: state.callable ? () => bridge.send('ixian:call') : undefined,

      /* ★★ L1 (#640): money composes IN THIS SHELL now. `composeSend` and
         `composeRequest` are declared by ContactDetails' own setCaps. The old
         `ixian:send` / `ixian:request` emits are GONE with the two pages they reached.

         ★★ #46 loop (MAJOR-2) — THE CAPABILITY DECIDES WHETHER THE ACTION EXISTS.
         The handlers were passed unconditionally and each tested the capability inside
         its own body. `chat-info.js` renders an action whenever it gets a handler, so an
         ungated build still showed Pay and Request and the tap did nothing. C# now
         declares the two caps only for a real 1:1 contact, not a bot, in
         FriendState.Approved (ContactDetails.xaml.cs:146-153), because
         `SPayments.handleSendRequest` refuses every other peer. An absent capability must
         therefore render NO action. A missing handler is how this component hides an
         action, and an empty action row is not appended at all.
         ⚠ Keep the inner test as well. It costs nothing and it stops a stale closure
         from spending money the caps no longer allow.
         ⚠ The panel is change-gated: `caps` is part of stateSig and setCaps calls
         scheduleCommit, so a capability that lands after the first paint rebuilds the
         panel. Without that the actions would never appear. */
      onPay: bridge.cap('composeSend')
        ? () => { if (bridge.cap('composeSend')) openSendTakeover(); }
        : undefined,
      onRequest: bridge.cap('composeRequest')
        ? () => { if (bridge.cap('composeRequest')) openRequestForPeer(); }
        : undefined,

      /* ★ #591: the address row opens the ONE address surface (#527) in its PEER
         variant — their address, so the copy says "their", and the self-only safety
         line ("it never gives anyone access to your wallet") is dropped rather than
         re-worded into a true sentence about the wrong person's money.
         ⚠ NO onShare: `ixian:share` shares the USER'S OWN primary address (HomePage
         :635-641), so wiring it here would offer "Share" on a contact's address and
         send the reader's instead. Copy is the honest affordance until a peer-share
         verb exists. */
      onAddressSheet: openPeerAddressSheet,

      // payment activity row tap → native tx detail (WalletSentPage).
      onTx: (tx) => { if (tx && tx.txid) bridge.send('ixian:txdetails:' + tx.txid); },

      // destructive — fire-and-forget INTENT after the FE confirm (oneShot latch).
      // C# runs its OWN native alert / removal on receipt (settings-delete pattern):
      //   removehistory → deletes local history + alert · remove → removes the
      //   contact (bots: pendingDeletion + sendLeave) then popToRoot.
      onDeleteHistory: (ctrl) => { bridge.send('ixian:removehistory'); ctrl.done(); },
      // ★★ §4: the SHEET is the confirmation — no generic confirm in front of it.
      removeContactOwnsConfirm: true,
      onRemoveContact: () => openRemoveContact(),
    });
  }

  /* ★★ Item 6 — the FIRST paint of real content crossfades over the boot skeleton.
     Until this batch nobody had ever seen that skeleton: presentPreload held EVERY
     load-then-present navigation for a flat 120 ms so the shell could finish, and this
     shell coalesces its own pushes on a 120 ms timer, so the panel was always finished
     before the page became visible. The hold is 0 for this page now, which makes the
     skeleton real — and a snap from skeleton to panel is what the crossfade replaces.
     Reduced motion and a missing transitionend both fall back to the plain swap. */
  function crossfadeIn(next) {
    const boot = root.querySelector('.contact-boot');
    let reduced = false;
    try { reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (!boot || reduced) { root.replaceChildren(next); return; }
    root.classList.add('is-crossfading');
    next.classList.add('cd-fade', 'cd-fade--in');
    root.append(next);
    let settled = false;
    const settle = () => {
      if (settled) return;
      settled = true;
      try { boot.remove(); } catch (e) {}
      root.classList.remove('is-crossfading');
      next.classList.remove('cd-fade');
    };
    next.addEventListener('transitionend', settle, { once: true });
    setTimeout(settle, 400);            // belt: a transition that never fires must not strand the skeleton
    requestAnimationFrame(() => requestAnimationFrame(() => {
      boot.classList.add('is-leaving');
      next.classList.remove('cd-fade--in');
    }));
  }

  function rebuildPanel() {
    // preserve the body scroll position across a rebuild (tx-list churn).
    const prevBody = root.querySelector('.c-chat-info__body');
    const top = prevBody ? prevBody.scrollTop : 0;
    const next = buildPanel();
    if (!built) crossfadeIn(next); else root.replaceChildren(next);
    const nb = root.querySelector('.c-chat-info__body');
    if (nb) nb.scrollTop = top;
    built = true;
  }

  // Signature of the state that actually AFFECTS the rendered panel (name,
  // address, avatar, tx set). The hero now renders the photo, so a resolved
  // avatarPath must rebuild once; presence stays excluded (no presence line yet).
  // A nickname edit in progress defers the rebuild (buildIfChanged guard).
  function stateSig() {
    return JSON.stringify({
      name: state.name,
      address: state.address,
      avatar: state.avatarPath,
      txs: state.txs.map((t) => [t.txid, t.direction, t.status, t.amount, t.timeText, t.name]),
      shared: state.sharedGroups ? state.sharedGroups.map((g) => g.address).sort() : String(state.sharedGroups),   // ★ A4 (null / undefined / list)
      landed: state.membersLanded || (Date.now() - bootAt >= 2500),   // ★ A8
      // #248: context + group meta/roster affect the rendered panel too. Loop C-6:
      // signature sorted by address so a re-pushed roster in a different order
      // never forces a needless rebuild (would drop an open search/sheet).
      context: state.context,
      // ★ NOTIF-2 (audit MINOR): the 1:1 mute must be IN the signature, or the
      // scheduleCommit() in setContactNotifications is decorative — buildIfChanged sees an
      // unchanged signature and does nothing. Benign only because C# pushes it once inside
      // the onLoad burst today; any later re-push (or an echo added tomorrow) would
      // silently fail to render.
      notifications: state.notifications,
      // A4 (#302): in the signature so a rebuild from ANY cause re-seeds the dot
      // with the current value. Live flips still go through setChatInfoPresence —
      // showIndicator never calls scheduleCommit, so this never drives a rebuild
      // by itself, it only makes one that happens anyway come out right.
      online: state.online,
      // ★ #591: the Call reveal MUST be in the signature or scheduleCommit is decorative
      // — the exact defect the NOTIF-2 note above records, one push later.
      callable: state.callable,
      /* ★★ #46 loop (MAJOR-2): the two money CAPABILITIES decide whether Pay and Request
         are rendered at all, so they must be in the signature. C# pushes setCaps inside
         the onLoad burst, which normally precedes the first coalesced commit — but a
         capability that lands later must still rebuild the panel, or the actions stay
         missing for the life of the page. Same lesson as the NOTIF-2 note above. */
      caps: (bridge.cap('composeSend') ? 's' : '') + (bridge.cap('composeRequest') ? 'r' : ''),
      isGroup: state.isGroup,
      group: state.group,
      members: state.members.map((m) => [m.address, m.name, m.avatar])
        .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)),
    });
  }
  function buildIfChanged() {
    const sig = stateSig();
    if (built && sig === lastSig) return;                 // C# re-pushed identical data — no-op
    // never wipe an in-progress nickname edit; defer until it closes.
    if (built && root.querySelector('.c-chat-info__nick-input')) { scheduleCommit(); return; }
    lastSig = sig;
    rebuildPanel();
  }

  /* Coalesce the per-second updateScreen burst (setNickname + setAvatar +
   * showIndicator + clearRecentActivity + addPaymentActivity×N — each a separate
   * EvaluateJavaScriptAsync frame) into ONE commit + change check, so partial tx
   * lists never paint. 120ms settles comfortably inside the 1s tick. */
  let commitTimer = 0;
  let firstGroupPaint = 0;   // ★ Session H: one-shot leading edge (below)
  function scheduleCommit() {
    clearTimeout(commitTimer); commitTimer = setTimeout(commitAndBuild, 120);
    /* ★ Session H (Damir, L10's family — "paint the info first, skeletons for the roster"):
       the FIRST paint of a group/bot surface must not wait for the roster burst to go
       quiet. Every addMember resets the 120 ms timer above, so a big bot room painted
       ONCE, late, with everything. The leading edge (40 ms after the first push that
       finds a group) builds the panel from META ONLY — the buffers stay untouched, so
       the "partial lists never commit" rule holds — and the panel shows hero + count +
       skeleton rows (membersLanded still false) until the settle commits the roster,
       which chat-info then fills in 24-row frames. 1:1 keeps its single coalesced first
       paint: its burst is small and a leading paint would flash an empty tx section. */
    if (!built && state.isGroup && !firstGroupPaint) {
      firstGroupPaint = setTimeout(() => { if (!built) buildIfChanged(); }, 40);
    }
  }
  function commitAndBuild() {
    if (state.txsBuf !== null) { state.txs = state.txsBuf; state.txsBuf = null; }
    if (state.membersBuf !== null) { state.members = state.membersBuf; state.membersBuf = null; state.membersLanded = true; }   // #248 roster · A8
    buildIfChanged();
  }

  /* NO empty first paint (flicker fix): the boot spinner (in #contact-root markup)
   * stays until the FIRST coalesced commit lands via scheduleCommit — rebuildPanel's
   * replaceChildren then swaps it for the filled panel in ONE render. `built` is still
   * false, so buildIfChanged builds unconditionally on that first commit. A brand-new
   * contact with no data still resolves: ContactDetails.onLoad always pushes setAddress
   * + updateScreen (→ scheduleCommit), and this fallback timer force-builds even if a
   * push never arrives, so the screen can never hang on the spinner. */
  setTimeout(() => { if (!built) commitAndBuild(); }, 1200);
  const bootAt = Date.now();
  // ★ A8: the roster skeleton ends on its own after 2.5 s (a bot room with no roster
  // would otherwise shimmer forever — the honest note takes over); ★ A4 belt (loop r1):
  // ContactDetails can answer NOTHING to ixian:sharedGroups on an old exe — after 4 s
  // the strip hides instead of shimmering forever
  setTimeout(() => { if (!state.membersLanded) scheduleCommit(); }, 2600);
  setTimeout(() => { if (state.sharedGroups === null) { state.sharedGroups = undefined; scheduleCommit(); } }, 4000);

  /* ═══ ★★ L1 (#640) — THE MONEY COMPOSE, IN THIS SHELL ══════════════════════
   * Damir, F5 2026-08-29: *"When on chat info or contact details, and pressing SEND
   * or RECEIVE it fires the LEGACY SEND and RECEIVE SCREENS."* Contact details was
   * the ONLY live route into `WalletSendPage` / `WalletReceivePage`; both pages are
   * deleted with this row (decision 4 grammar, #635).
   *
   * The replacement is not new — it is chat.html's proven pair, ported:
   *   Pay     → a cover that mounts createWalletSend with the peer LOCKED (#139),
   *             which PROPOSES only: `ixian:signSend` → C# re-parses → the NATIVE
   *             confirm (+ payment auth) → sign + broadcast → `signSendResult`.
   *   Request → the #139 amount sheet → `ixian:sendrequest:<addr>:<amount>`. A
   *             request is a chat MESSAGE; nothing is signed.
   * ★ SECURITY.md is unchanged by this: the shell still composes INTENT only, and
   *   every key, confirm and broadcast stays in C#. What went away is a WebView page
   *   that had its own money chrome.
   * ★ 1:1 ONLY. A group panel never renders these actions, and each opener re-tests
   *   `state.isGroup` at the emit site — the belt the ⑪ delivery-lie rule asks for.
   * ————————————————————————————————————————————————————————————————————————— */
  let cdSendView = null;
  let cdSendCtrl = null;
  let cdSendWait = 0;
  let cdSendFocusin = null;
  function cdClearSendWait() { if (cdSendWait) { clearTimeout(cdSendWait); cdSendWait = 0; } }

  /* The locked recipient's display name. `state.name` CAN be the address echo, and a
   * blind pseudo-key can reach this page too — an address is never a NAME, and the
   * component renders its own 'Address' label when the name is empty (#211/#370). */
  function cdPeerName() {
    const n = state.name || '';
    if (!n || n === state.address) return '';
    if (isAddressShaped(n) || isPseudoAddressNick(n)) return '';
    return n;
  }
  function cdLockedRecipient() {
    return { name: cdPeerName(), address: state.address, avatar: state.avatarPath || null };
  }

  function closeSendTakeover() {
    const t = document.querySelector('.cd-send-takeover');
    // r1 M4 grammar: never leave the review sheet orphaned above a removed cover.
    if (cdSendView && cdSendView._closeReview) { try { cdSendView._closeReview(); } catch (e) {} }
    if (t) t.remove();
    cdSendView = null;
    cdSendCtrl = null;
    cdClearSendWait();
    if (cdSendFocusin) { document.removeEventListener('focusin', cdSendFocusin); cdSendFocusin = null; }
    syncCdOverlay();                                 // back must stop eating the page (AND-29 class)
    /* ★ chat.html restores focus to its composer here; this page has none, so the anchor is
       the panel's FIRST action. ⚠ The comment used to claim it returns to Pay and the
       selector took whatever came first — on a 1:1 panel that is Message or Call. Saying
       what it does beats naming a control it does not find: the point is that focus lands
       back in the panel rather than on <body>, where the next Tab restarts the document. */
    try {
      const anchor = document.querySelector('#contact-root button');
      if (anchor && anchor.focus) anchor.focus();
    } catch (e) { /* focus restore is best-effort */ }
  }

  function openSendTakeover() {
    /* ⚠⚠ `state.isGroup`, NOT `state.group`. `state.group` is the metadata BAG (:274) and is
       ALWAYS TRUTHY, so the first cut of this guard returned on every contact and BOTH money
       buttons did nothing at all — a working native screen replaced by silence, which is the
       ⑪ delivery lie in its purest form. Fifty smoke pins were green: every one of them read
       the CALL SITE and none asked whether the opener was reachable. The pin below this row
       now executes the guard. */
    if (state.isGroup) return;                       // 1:1 only — C# rejects group sends
    if (!state.address) return;
    if (document.querySelector('.cd-send-takeover')) return;   // double-open guard
    const over = document.createElement('div');
    over.className = 'cd-send-takeover';
    over.append(createTopbar({
      variant: 'view', title: strings.send || 'Send',
      backLabel: strings.back || 'Back', onBack: closeSendTakeover,
    }));
    const body = document.createElement('div');
    body.className = 'cd-send-takeover__body u-scroll';
    cdSendView = createWalletSend({
      contacts: [],                                  // locked peer — no picker
      lockedRecipient: cdLockedRecipient(),
      balance: 0,                                    // the real balance rides the first quote
      fee: null,                                     // W6: gated until a quote lands
      strings, host: document.body,
      onQuote: (addr, amount) => bridge.send('ixian:feeQuery:' + addr + ':' + amount),
      onSend: (payload, ctrl) => {
        const r = (payload.recipients && payload.recipients[0]) || {};
        cdSendCtrl = ctrl;
        cdClearSendWait();
        /* The tipWait grammar: a dropped push must not strand a locked sheet, and the
         * copy must NOT claim failure — the tx may be out. 125 s sits ABOVE C#'s 120 s
         * confirm self-heal (SPayments.acquireConfirm), so the backstop can never fire
         * under a native dialog the user is still reading. */
        cdSendWait = setTimeout(() => {
          cdSendWait = 0;
          const c = cdSendCtrl;
          if (!c) return;
          cdSendCtrl = null;
          c.fail(strings.sendNoAnswer || 'No response from the app. Check your wallet activity before you try again.');
        }, 125000);
        bridge.send('ixian:signSend:' + r.address + ':' + payload.amount);
      },
      onDone: () => closeSendTakeover(),
    });
    body.append(cdSendView);
    over.append(body);
    document.body.append(over);
    syncCdOverlay();                                 // hardware back closes the COVER, not the page
    // The compose's FIRST FIELD (the amount) takes focus, not the topbar Back button
    // that `button, input` finds first; containment is the #205 grammar, light.
    const firstFocus = over.querySelector('.cd-send-takeover__body input') || over.querySelector('button, input');
    if (firstFocus) { try { firstFocus.focus(); } catch (e) {} }
    cdSendFocusin = (e) => {
      if (over.contains(e.target)) return;
      if (e.target && e.target.closest && e.target.closest('.c-sheet, .c-modal')) return;
      const f = over.querySelector('button, input');
      if (f) { try { f.focus(); } catch (err) {} }
    };
    document.addEventListener('focusin', cdSendFocusin);
    // balance prefetch: amount 0 = "quote the balance + Max ceiling" (fee stays gated)
    bridge.send('ixian:feeQuery:' + state.address + ':0');
  }

  /* Request — the #139 amount sheet. ONE verb per request; the peer is known, so
   * there is no balance guard and nothing is signed. */
  function openRequestForPeer() {
    if (state.isGroup || !state.address) return;      // ⚠ isGroup, not the always-truthy bag
    openRequestSheet({
      recipient: cdLockedRecipient(),
      host: document.body,
      strings,
      onRequest: (payload, ctrl) => {
        bridge.send('ixian:sendrequest:' + state.address + ':' + payload.amount);
        ctrl.done();                                 // a request is a message — C# alerts on refusal
      },
    });
  }

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS handlers — page globals (executeUiCommand resolves bare fnRefs).
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    // W1 (#336): this shell had NO setTheme handler at all — the pick-time C# fan-out
    // (SettingsPage:398-426, all overlays) hit an undefined bare global (a swallowed
    // ReferenceError, the #258 class), so a live chat-info/group-info pane could
    // never re-theme. Same grammar as home.html's handler (args arrive DECODED via
    // the real dispatcher; #53 transition suppression for a one-frame flip).
    // ★ N71 (#421): body moved to theme-runtime.js — five shells carried a copy of
    // it and thirteen carried none, which is how #251 and #288 MAJOR-1 both happened.
    setTheme(name) { applyPushedTheme(name); },

    // Q4-③ (#270): call-ui wiring GONE — calls present on the native CallPage
    // (identity comes from C#'s Friend, so the roster resolve is obsolete too).
    // #247: desktop pane hosting — C# pushes '1' (detail slot) or '2' (column beside
    // the conversation) BEFORE any content push; unset = mobile/full-span takeover.
    setPaneMode(col) { document.body.dataset.pane = (col === '2') ? '2' : '1'; },
    // #248: entry-dependent surface — pushed before setAddress in onLoad.
    setContext(c) { state.context = (c === 'chat') ? 'chat' : 'contact'; scheduleCommit(); },
    /* ★★ #591: the SAME verb the chat header uses (SingleChatPage:891). C# sends it only
       when the peer can actually be called — codecs present, 1:1, FriendState.Approved —
       so the action appears rather than being offered and refused. Idempotent: an exe
       that pushes it repeatedly costs one no-op commit. */
    showCallButton() { if (!state.callable) { state.callable = true; scheduleCommit(); } },
    // #248 GROUP surface: meta (count/blind/admin/notifications/owner) + roster.
    // Roster arrives as a clearMembers → addMember×N burst → buffered like the tx
    // list so a partial roster never commits.
    /* ★ NOTIF-2: the per-1:1 mute state. MUST be defined even though it is only ever
       pushed for a 1:1 — C# emits a push as a BARE GLOBAL, and an undefined one throws
       while the arguments are evaluated, before the dispatcher can catch it (#258). */
    setContactNotifications(on) {
      state.notifications = (on === '1' || on === 'true' || on === 'True' || on === true);
      scheduleCommit();
    },

    setGroupInfo(count, blind, admin, notifications, owner, kind, amOwner) {
      state.isGroup = true;
      state.group = {
        count: Number(count) || 0,
        blind: blind === '1' || blind === 'true' || blind === 'True',
        admin: admin === '1' || admin === 'true' || admin === 'True',
        notifications: notifications === '1' || notifications === 'true' || notifications === 'True',
        owner: owner || '',
        kind: kind === 'bot' ? 'bot' : 'group',   // #249: bots ride this surface too
        // N48 (#370): MY OWN owner status — additive 7th arg (old exe → undefined
        // → false). Blind groups get no owner ADDRESS, but my own status is mine
        // to see; the hero renders it there (the self row is unidentifiable).
        amOwner: amOwner === '1' || amOwner === 'true' || amOwner === 'True',
      };
      scheduleCommit();
    },
    clearMembers() { state.membersBuf = []; scheduleCommit(); },
    // D-5/N26 (#366): trailing `relation` ('contact'|'pending'|'none'|'self';
    // "" on blind rows, undefined from an old exe → treated as unknown).
    addMember(address, nick, avatar, role, relation) {
      if (state.membersBuf === null) state.membersBuf = [];
      state.membersBuf.push({
        address: address || '',
        /* D-19b (#370): a blind-masked row ('[Unknown]' address) whose nick is
           the legacy "x"+<address> pseudo-key must not display it — the member
           list would print the exact address the blind mask hides. Blanked
           here → chat-info renders its placeholder for the row. */
        name: (address === '[Unknown]' && isPseudoAddressNick(nick)) ? '' : (nick || ''),
        avatar: resolveAvatar(avatar),
        role: role || '',            // opaque role int (semantics live in Ixian-Core); owner comes from setGroupInfo
        relation: ['contact', 'pending', 'pending-in', 'none', 'self'].indexOf(relation) !== -1 ? relation : '',   // R2 (#371): + incoming-pending
      });
      scheduleCommit();
    },
    /* ★★ §4: the `removeBlocked` handler is RETIRED — C# no longer pushes it. A refusal
       arrives as removeContactResult('blocked', …) and re-opens the SHEET, which can
       actually get the user past the blocker. */
    setAddress(address) { state.address = address || ''; scheduleCommit(); },
    setNickname(nick) { state.name = nick || ''; scheduleCommit(); },
    // ★ A4 (Batch A): the shared-groups answer — flat name/address pairs (C# escapes each arg)
    setSharedGroups(address, ...pairs) {
      const groups = [];
      for (let i = 0; i + 1 < pairs.length; i += 2) groups.push({ name: String(pairs[i] || ''), address: String(pairs[i + 1] || '') });
      state.sharedGroups = groups;
      // ★★ §4: one answer, two consumers — the info strip AND a live remove sheet.
      setRemoveSheetGroups(String(address || state.address || ''), groups);
      scheduleCommit();
    },
    /* ★★ §4: the verb's outcome, in the same vocabulary HomePage uses (ok / left /
       blocked / fail). 'blocked' re-opens the question INSIDE the sheet with the
       blocking groups named and tickable — which is the whole difference from the
       modal this replaces. C# pops the page on ok/left, so those need no toast. */
    removeContactResult(address, status, ...pairs) {
      const addr = String(address || '');
      const st = String(status || '');
      if (st === 'ok' || st === 'left') return;
      const groups = [];
      for (let i = 0; i + 1 < pairs.length; i += 2) groups.push({ name: String(pairs[i] || ''), address: String(pairs[i + 1] || '') });
      if (st === 'blocked') {
        state.sharedGroups = groups;
        scheduleCommit();
        if (setRemoveSheetResult(addr, 'blocked', groups, strings)) return;
      }
      const names = groups.map((g) => g.name || g.address).filter(Boolean).join(', ');
      const text = st === 'blocked'
        ? (strings.removeBlockedToast || 'Not removed: still a member of {groups}. Leave the group first.').split('{groups}').join(names)
        : (strings.removeFailedToast || 'The contact could not be removed. Please try again.');
      try { showToast({ text, tone: 'error', host: document.body, strings }); } catch (e) {}
    },
    // Real contact photo → the c-chat-info hero (resolves today on WinUI; every
    // platform once BE cutover X1 lands the data: URI). Commit so the hero updates
    // when the photo arrives; the coalescer + edit-guard keep it churn-safe, and
    // c-avatar's onerror falls back to the gradient if the path can't load.
    setAvatar(path) { state.avatarPath = resolveAvatar(path); scheduleCommit(); },
    /* A4 (#302): presence. Guarded on CHANGE — this arrives at the poll cadence
       (~0.5 Hz while the surface is visible) and an unguarded scheduleCommit would
       reset the 120 ms settle timer on every tick, so the panel could never settle.
       No rebuild: a targeted dot toggle. state.online is also in stateSig now, so a
       rebuild triggered by something else re-seeds the dot correctly. */
    showIndicator(online) {
      const next = asBool(online);
      if (next === state.online) return;
      state.online = next;
      if (built && !state.isGroup) setChatInfoPresence(root.firstElementChild, next);
    },

    // tx list is cleared + fully re-pushed every second. Buffer between clear and
    // the settle so a partial list never commits.
    clearRecentActivity() { state.txsBuf = []; scheduleCommit(); },
    addPaymentActivity(txid, type, time, amount, confirmed) {
      const dir = txDirection(type);
      if (state.txsBuf === null) state.txsBuf = [];
      state.txsBuf.push({
        txid: txid || '',
        direction: dir,
        // confirmed "true" → confirmed; anything else ("error" = ActivityStatus
        // != Final) → pending (still confirming). C# collapses pending+error into
        // one "error" string — a real status enum is a BE ask.
        status: asBool(confirmed) ? 'confirmed' : 'pending',
        name: type || '',                                   // verbatim localized "Sent"/"Received" label
        amount: (dir === 'in' ? '+' : '-') + formatIxiAmount(amount),
        // iOS-55/#328 (W1 class): C# now pushes raw EPOCH SECONDS — all-digits
        // formats in-component via formatTxTimestamp/docLocale (createTxItem
        // prefers timestamp when timeText is absent); anything else = an OLD
        // exe's pre-formatted string → verbatim (backcompat). >0 guard: epoch 0
        // degrades to "no time", never a 1970 date.
        ...((/^\d{1,12}$/.test(String(time == null ? '' : time).trim()) && Number(String(time).trim()) > 0)
          ? { timestamp: Number(String(time).trim()) * 1000 }
          : { timeText: time || '' }),
      });
      scheduleCommit();
    },
    /* N50 (#370, #369 F5): OS back must dismiss the TOP OVERLAY first (the
       remove-blocked modal, a member sheet), then pop the page. C# routes back
       into the shell via this push while the mirror below reports an open
       overlay — the homeBack grammar (#336), applied to this shell. Self-heal:
       if nothing was actually open (stale mirror), re-sync so the next back
       pops the page instead of wedging. */
    cdBack() {
      if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
      // ★★ L1 (#640): the money cover consumes back BEFORE the page pops — the same
      // order chat.html uses (chatBack :4538). Without this line the page would pop
      // out from under an open compose.
      if (cdSendView) { closeSendTakeover(); return; }
      syncCdOverlay();
    },

    /* ★★ L1 (#640) — setCaps('a,b,…'), the #242 grammar. C# declares which OPTIONAL
       verbs THIS build answers; the two money composes are gated on it. Mutates the
       bridge's capability object in place — bridge.cap() reads the same reference. */
    setCaps(list) {
      String(list || '').split(',').forEach((c) => {
        c = c.trim();
        if (c) bridge.capabilities[c] = true;
      });
      /* ★★ #46 loop (MAJOR-2): Pay and Request are rendered only when their capability
         is present, so a capability change must reach the panel. `caps` is in stateSig,
         so this commit rebuilds only when the answer really changed. */
      scheduleCommit();
    },

    /* ★★ L1 (#640) — W6 answer to ixian:feeQuery. Routed to the OPEN compose only.
       The echo pair (addr, amount) rides along so the component drops a stale answer. */
    setSendQuote(addr, amount, fee, balance, max, error) {
      if (!cdSendView) return;
      applySendQuote(cdSendView, { fee, balance, max, address: addr, amount, error });
    },

    /* ★★ L1 (#640) — W5 outcome: 'ok' → the success morph · 'cancel' → a silent
       re-enable · anything else → fail(msg). An EMPTY fail is NOT a cancel: null
       routes to the component's own error copy instead of the silent branch. */
    signSendResult(status, message) {
      cdClearSendWait();
      const c = cdSendCtrl;
      if (!c) return;
      cdSendCtrl = null;
      const st = String(status || '');
      if (st === 'ok') { c.done(); return; }
      if (st === 'cancel') { c.fail(''); return; }
      const m = String(message || '');
      c.fail(m === '' ? null : m);
    },
  };

  /* ★ L3 (#706): the iOS back signal — the SAME chain hardware back runs (cdBack), then
     the verb the topbar arrow sends. cdBack returns nothing, so the swipe asks the
     mirror's own predicate: if it closed something, stop there. */
  attachEdgeBack({ onBack: () => {
    if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
    if (cdSendView) { closeSendTakeover(); return; }
    bridge.send('ixian:back');
  } });
  bridge.exposeAll(handlers);

  /* N50 (#370): mirror the shared overlay stack's open-state to C#
     (overlay.js toggles body[data-overlay-open]) — the exact home.html recipe:
     coalesced through a zero-timeout so an open→close flurry sends one line. */
  let cdOverlaySyncT = 0;
  /* ★★ L1 (#640): the money cover is NOT on the shared overlay stack, so it has to be
     reported here or Android back would pop the whole page out from under it — the
     same line chat.html carries for its own cover (chatOverlayLive :4569). */
  function cdOverlayLive() {
    return document.body.dataset.overlayOpen !== undefined || !!cdSendView;
  }
  function syncCdOverlay() {
    if (cdOverlaySyncT) return;
    cdOverlaySyncT = setTimeout(() => {
      cdOverlaySyncT = 0;
      try { bridge.send('ixian:cdoverlay:' + (cdOverlayLive() ? '1' : '0')); } catch (e) {}
    }, 0);
  }
  try {
    new MutationObserver(syncCdOverlay).observe(document.body, { attributes: true, attributeFilter: ['data-overlay-open'] });
  } catch (e) {}

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s first push. ————————————————— */
  function signalReady() {
    /* ★★ Item 6: this shell is PRESENTED on ixian:onload with no 120 ms hold, so the
       signal must not go out before the boot skeleton has actually been painted —
       otherwise the slide-in carries a blank themed rectangle, which is the #619 / V-6
       mistake in a new place. Two frames guarantee a paint; the cost is ~32 ms of data,
       and the data lands after the present by design now. */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bridge.ready();
      bridge.send('ixian:sharedGroups');   // ★ A4: ask once at boot; the strip shows a skeleton line until the answer
    }));
  }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
