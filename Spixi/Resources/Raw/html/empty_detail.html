<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). Same recipe as every redesigned shell. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
  /* Splash boot moment (Batch B, #256 ⑭) — uniform boot grammar. This page is
     static/inline so the cover drops almost immediately at window load; over a
     content block that itself centers the same logo it reads as the mark
     settling in, and it still masks any font/late-style pop. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #f9fafb; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  html[data-theme="dark"] .app-boot { background: #13171b; }
  .app-boot__logo { width: 64px; height: 64px; color: var(--icon-accent, #1892ce); animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>
<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style>
  /* —————————————————————————————————————————————————————————————————————————
   * #248 (Damir F5): redesigned EMPTY DETAIL — the desktop right-pane resting
   * state (EmptyDetail page, shown when no conversation is open). Replaces the
   * ALWAYS-DARK legacy empty_detail.html that clashed with light mode. Static,
   * token-themed both modes, dt-empty grammar; localized via the C# star-SL
   * substitution (same keys as legacy) with English fallbacks for previews.
   * ————————————————————————————————————————————————————————————————————————— */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: var(--spacing-12, 12px);
    max-width: 420px;
    padding: var(--spacing-24, 24px);
  }
  .empty__icon { color: var(--icon-neutral-03, var(--icon-neutral-02)); margin-bottom: var(--spacing-8, 8px); }
  .empty__icon svg { width: 56px; height: 56px; }
  /* type rides the base.css role classes (.t-heading-sm / .t-body-sm) */
  .empty__title { color: var(--text-neutral-01); margin: 0; }
  .empty__text { color: var(--text-neutral-02); margin: 0; }
</style>
<style data-device>html,body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important;background:var(--surface-screen)!important}.demo-toolbar,.demo-caption,.statusbar{display:none!important}.demo-frames{display:block!important;margin:0!important;gap:0!important;flex-wrap:nowrap!important}.demo-phone{width:100vw!important;height:100vh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}</style>
</head>
<body>
  <!-- Splash boot cover (Batch B) — logo injected in the script below; dropped at
       window load. -->
  <div class="app-boot" id="app-boot"><div class="app-boot__logo" id="app-boot-logo" role="status" aria-label="Loading"></div></div>
  <main class="empty">
    <div class="empty__icon" id="empty-icon" aria-hidden="true"></div>
    <h1 class="empty__title t-heading-sm" id="empty-title">*SL{empty-state-title}</h1>
    <p class="empty__text t-body-sm" id="empty-p1">*SL{empty-state-detail-1}</p>
    <p class="empty__text t-body-sm" id="empty-p2">*SL{empty-state-detail-2}</p>
  </main>

<script src="spixi.icons.js"></script>
<script>
  /* Localization: C#'s generatePage substitutes the star-SL markers from the lang
   * files (they live in HTML TEXT nodes — safe for any localized characters).
   * A plain-browser preview has no substitution → swap the raw marker for the
   * English fallback. ⚠ The marker is BUILT AT RUNTIME below: SpixiLocalization's
   * line parser crashes on any source line that contains the raw marker without a
   * closing brace after it (Substring(0, IndexOf("}")) with IndexOf = -1) — never
   * write the four-character sequence literally outside a real substitution. */
  (function () {
    var MARK = '*SL' + '{';   // runtime-assembled — see the warning above
    var fb = {
      'empty-title': 'Welcome to Spixi',
      'empty-p1': 'Your secure peer-to-peer chat app with an integrated wallet.',
      'empty-p2': 'Enjoy encrypted conversations that ensure your messages are stored and transmitted only between your device and your contacts, keeping your privacy intact.',
    };
    for (var id in fb) {
      var el = document.getElementById(id);
      if (el && el.textContent.indexOf(MARK) !== -1) el.textContent = fb[id];
    }
    try {
      var host = document.getElementById('empty-icon');
      if (host && window.SpixiIcons && window.SpixiIcons.icon) host.append(window.SpixiIcons.icon('logo', { size: 56 }));
    } catch (e) {}
    try {
      var boot = document.getElementById('app-boot-logo');
      if (boot && window.SpixiIcons && window.SpixiIcons.icon) boot.append(window.SpixiIcons.icon('logo', { size: 64 }));
    } catch (e) {}
  })();

  /* #251 (Damir F5: pane stayed DARK after a dark→light theme pick): C# re-themes
   * live WebViews with sendUiCommand(page, "setTheme", name) — the command arrives
   * as executeUiCommand(setTheme, 'light'), i.e. a BARE GLOBAL fn reference. Provide
   * the global + a minimal dispatcher (loop C-4 hardening folded in: unknown pushes
   * must not throw into EvaluateJavaScriptAsync). */
  /* ★ N71 (#421): this is the ONE shell that keeps a LOCAL copy of the body. It is
   * deliberately bundle-less (see the dispatcher note below), so it cannot import
   * theme-runtime.js like the other seventeen. Keep the two in step by hand. */
  window.setTheme = function (name) {
    if (name === 'light' || name === 'dark') document.documentElement.dataset.theme = name;
  };
  if (!window.executeUiCommand) {
    /* W1 (#336, Windows F5 runtime evidence: "PUSH RECEIVED: ZGFyaw=="): C#'s
     * sendUiCommand base64-encodes EVERY argument (Utils.cs escapeHtmlParameter)
     * and the REAL dispatcher (bridge/native.js installExecuteUiCommand) decodes —
     * this bundle-less stub passed args RAW, so setTheme compared 'ZGFyaw==' to
     * 'dark' and silently no-opped: the welcome pane NEVER re-themed live (dark
     * leftovers, Damir's repro). Decode unconditionally, exactly like the real
     * dispatcher (a bare C# `null` arrives as JS null → '' — the #182 guard). */
    window.executeUiCommand = function (fn) {
      try {
        if (typeof fn !== 'function') return;
        const args = [];
        for (let i = 1; i < arguments.length; i++) {
          const a = arguments[i];
          if (a == null) { args.push(''); continue; }
          let v = String(a);
          try {
            const bin = atob(v);
            v = new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.codePointAt(0); }));
          } catch (e) { /* not base64 (future plain push) — keep verbatim */ }
          args.push(v);
        }
        fn.apply(null, args);
      } catch (e) {}
    };
  }

  /* Page ready — window load (#177 timing invariant). EmptyDetail.onLoad is a
   * no-op, but the signal keeps the page on the standard shell lifecycle. */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }
  function signalReady() { dropAppBoot(); try { location.href = 'ixian:onload'; } catch (e) {} }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
<script>(function(){var m=[!window.SpixiIcons&&"spixi.icons.js",!getComputedStyle(document.documentElement).getPropertyValue("--spacing-16").trim()&&"spixi.tokens.css",!getComputedStyle(document.documentElement).getPropertyValue("--spixi-base-css").trim()&&"spixi.base.css"].filter(Boolean);if(!m.length)return;console.error("SPIXI: shared asset did not load: "+m.join(", "));document.documentElement.innerHTML='<pre style="margin:0;padding:24px;font:13px/1.5 monospace;color:#f66;background:#13171b">Spixi could not load: '+m.join(", ")+'\n\nThe shell and its shared assets must sit in the SAME folder.\nRe-run: node scripts/build-shells.mjs</pre>';})();</script>
</body>
</html>
