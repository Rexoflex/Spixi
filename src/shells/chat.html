<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- iOS/quirks: pinch must scale the CHAT TEXT, not the page. Without a scale
     clamp WKWebView owns the pinch and does a document zoom (blurry raster,
     topbar/composer scaled off-screen, no way back but a double-tap) — Damir
     2026-07-29. The clamp hands the gesture to us; the handler below maps it onto
     --chat-text-scale, the SAME knob Account → Chat appearance writes. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi</title>
<!-- Resolve the theme BEFORE any style/paint so the instant-bg + tokens match the
     user's chosen appearance from the first frame (no light→dark flash). Same
     head-top guard the other shells use; the late body block below is harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<!-- Preview forcing for the platform flag (?desktop=1 sets / ?mobile=1 clears;
     the app passes no query). MUST run BEFORE the pattern-pref script below —
     since B2 the pattern DEFAULT is platform-aware, so the flag has to be final
     when the default is derived. -->
<script>(function(){try{var p=new URLSearchParams(location.search);if(p.get('desktop')==='1')document.documentElement.setAttribute('data-desktop','');else if(p.get('mobile')==='1')document.documentElement.removeAttribute('data-desktop');}catch(e){}})();</script>
<!-- Chat appearance prefs (6e.2, FE-only): pattern intensity + message text size
     picked on the Account screen persist in localStorage (same origin) — applied
     here pre-paint (a level resolved after first paint flashes the wrong canvas).
     B2 (#256): ONE pref key, PLATFORM-AWARE DEFAULT when unset — desktop Off,
     mobile Default — replacing the #207 hard-forced desktop pattern-off, so an
     explicit user pick works on BOTH platforms.
     ★ N81 (#422): the value is a LEVEL INDEX and the alpha is a per-theme token,
     so the old "dark = light × 0.36" line that used to live here is gone. -->
<!-- W5 (Damir 2026-08-12): the pattern STYLE pref rides the SAME pre-paint script
     as the intensity, for the same reason — a style resolved after first paint
     flashes the wrong pattern. It sets `data-chat-pattern` on <html>, which
     chat-pattern.css turns into the tile custom properties (inherited, so the
     settings swatches can override it per element). Two dials, orthogonal:
     style picks the SOURCE, the intensity pref keeps mapping to opacity, and
     "Off" lives ONLY in the intensity dial (there is no fourth style).
     Live flow is DESKTOP-ONLY — a mobile client carrying the pref (restore,
     hand-edited storage) falls back to DOODLES here rather than burning
     battery on a constant rAF loop. -->
<!-- ★ N81 (#422): the level is an INDEX (0 Off / 1 Default / 2 Strong) and the
     alpha comes from the theme's own --chat-pattern-alpha-N. The old dark ×0.36
     derivation is GONE from every script — CSS resolves var() under the current
     theme, so a live setTheme push can no longer leave dark painting the light
     number. Legacy fractional prefs migrate here exactly as readPatternLevel()
     does in settings-screens.js; this copy is inline because it must run BEFORE
     the bundle loads (pre-paint). Keep the two in step. -->
<!-- ★★★ AUG (Damir 2026-08-30) — TWO CHANGES IN THIS SCRIPT, both pre-paint for the
     same reason the style already was: resolved after first paint, they FLASH.
     ① STRONG IS RETIRED. Levels are Off / Subtle. A stored `2` is a level that no longer
        exists and folds to 1 here, exactly as readPatternLevel() does in
        settings-screens.js. Keep the two in step — they are the same rule in two homes
        because this one must run before the bundle loads.
     ② THE LIGHT CANVAS IS A CHOICE: `spixi.chat.ground` = 'flat' (default) | 'gradient'.
        Allowlisted the same way the style is, so a corrupt or retired value lands on
        'flat' BEFORE first paint rather than painting an undefined ground. The attribute
        is set in BOTH themes and is simply inert in dark — tokens.css scopes the gradient
        rule out of dark, so there is nothing to branch on here. -->
<script>(function(){var r=document.documentElement.style,de=document.documentElement.hasAttribute('data-desktop'),p=NaN,t=NaN,s='',g='';try{p=parseFloat(localStorage.getItem('spixi.chat.pattern'));t=parseFloat(localStorage.getItem('spixi.chat.textscale'));s=localStorage.getItem('spixi.chat.patternstyle')||'';g=localStorage.getItem('spixi.chat.ground')||'';}catch(e){}var lv;if(!isFinite(p))lv=1;else if(p<=0)lv=0;else lv=1;r.setProperty('--chat-pattern-opacity',lv<=0?'0':'var(--chat-pattern-alpha-1)');if(!isNaN(t))r.setProperty('--chat-text-scale',String(Math.min(1.5,Math.max(0.8,t))));if(s==='flow'&&!de)s='doodles';if(s!=='doodles'&&s!=='matrix'&&s!=='flow')s='doodles';document.documentElement.setAttribute('data-chat-pattern',s);if(g!=='flat'&&g!=='gradient')g='gradient';document.documentElement.setAttribute('data-chat-ground',g);})();</script>
<style>
  /* Paint the screen surface IMMEDIATELY — before tokens.css/base.css load and
     before the JS bundle parses — so entering a chat doesn't flash an empty
     "blank" pane while the shell boots (Damir F5). Values mirror --surface-screen
     (neutral-10 / neutral-900); tokens.css takes over once loaded. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
  /* ★ N77 (#413): the load probe strip — dev-mode only, pointer-transparent,
     English-only diagnostics (the #301 precedent). Pinned above the composer. */
  .load-probe {
    position: fixed; left: var(--spacing-8); right: var(--spacing-8);
    bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    z-index: var(--z-10);
    width: max-content; max-width: calc(100% - 16px);
    padding: 3px var(--spacing-8); border-radius: var(--radius-8, 8px);
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px; line-height: 14px;
    pointer-events: none;
  }
</style>

<style>
  /* Production chat shell: fill the WebView (no demo phone frame). The chat
     topbar pins, the message log (c-chat-canvas → .messages) scrolls, the
     composer pins to the bottom. Element ids/classes MATCH the demo so the
     component CSS applies unchanged. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #chat-topbar { flex: none; }
  .c-banner { flex: none; }              /* connectivity strip pins under the topbar */
  .chat-request-pane { flex: none; }     /* incoming-request pane pins above the composer */
  /* #288 review: in the 'incoming' lock the composer is HIDDEN, so the request card is
     the chat's bottom-most chrome and owns the iOS home-indicator inset — otherwise
     Accept/Decline sit under the indicator. Break-my-verdict correction: the inset goes
     on the PAINTED child, not the wrapper — the wrapper has no background, so padding
     there would open a --surface-screen band under a --surface-neutral-02 card. */
  .chat-request-pane > .c-contact-request {
    padding-block-end: calc(var(--spacing-12) + env(safe-area-inset-bottom, 0px));
  }
  /* ⑪ pending-outgoing composer lock: while our contact request awaits the peer's
     accept, the composer is REPLACED by this quiet strip (nothing to type into —
     a locally-"sent" message would show delivered/read ticks the peer never sees).
     Same slot as the composer (#chat-composer child), so layout is unchanged. */
  .chat-pending-strip {
    display: flex; align-items: center;
    gap: var(--spacing-12);
    padding: var(--spacing-12) var(--spacing-16);
    /* #288 review: this strip REPLACES the composer (composerEl.hidden), so it is the
       chat's bottom-most chrome and must own the iOS home-indicator inset the way
       composer.css does — otherwise Cancel request, the ONLY escape from a locked
       chat, sits under the indicator. env() resolves to 0 off-iOS. */
    padding-block-end: calc(var(--spacing-12) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-neutral-02);
    border-top: var(--outline-width-1) solid var(--outline-neutral-01);   /* composer hairline parity */
  }
  /* #287 (#275 polish backlog): pending medallion — avatar-32 tonal disc +
     user-plus (the "Request sent" glyph family, #253), #117 handshake-pulse
     cadence; decorative (the strip text carries the meaning). Token-exact:
     the old block referenced non-existent --spacing-3/-4 (numeric naming is
     --spacing-12/-16) and rode the px fallbacks. */
  .chat-pending-strip__disc {
    flex: none;
    width: var(--size-avatar-32); height: var(--size-avatar-32);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full);
    background: var(--surface-action-tonal-default);
    color: var(--icon-action-default);
    animation: chat-pending-pulse 1.4s var(--easing-standard) infinite;
  }
  @keyframes chat-pending-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .chat-pending-strip__disc { animation: none; } }
  .chat-pending-strip__text {
    flex: 1;
    color: var(--text-neutral-02);
    font-size: var(--font-size-body-md); line-height: var(--line-height-body-md);
    min-width: 0; overflow-wrap: anywhere;
  }
  .c-chat-canvas { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* Messages sit at the BOTTOM (adjacent to the composer) and grow upward — the
     natural chat flow. The secure notice floats CENTERED in the free space above
     them: its own two auto-margins split that space equally above + below it, so
     on a new/empty chat it lands dead-center, and as messages fill in below it
     the notice rises like a normal bubble. When the log overflows the auto-
     margins collapse to 0 → notice pins to the top of history, log scrolls,
     newest at the bottom (Damir 2026-07-07). */
  #messages { flex: 1; min-height: 0; padding-bottom: calc(var(--composer-h, 0px) + var(--spacing-4)); display: flex; flex-direction: column; }   /* ★ Session I: + the floating composer's height (published by the ResizeObserver) so the log passes UNDER the pill */
  #messages > .c-sysnotice { margin-top: auto; margin-bottom: auto; }
  /* A3 (#302): unread-elsewhere dot on the chat topbar back button. #48 grammar
     (error surface + a 2px ring in the HOST surface so it reads on any background) at
     topbar scale — ring in --surface-topbar, not the bottombar token the nav badge
     uses. Positioned INSIDE the 44px button box (a bottomnav-style negative offset
     would clip against the topbar's own padding), and aria-hidden because the
     state is announced through the button's aria-label instead. */
  #chat-topbar .c-button[data-unread-dot] { position: relative; }
  #chat-topbar .c-button[data-unread-dot]::after {
    content: ""; position: absolute; top: 6px; inset-inline-end: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface-error);
    box-shadow: 0 0 0 2px var(--surface-topbar);
    pointer-events: none;
  }
  /* A1 (#302): "Show older messages" pill, first child of the log. It only ever
     renders when ≥100 messages exist, so it never coexists with the #181
     centered-when-short layout above (auto margins have collapsed by then).
     flex:none so it can't be stretched by the column. */
  .chat-older { flex: none; display: flex; justify-content: center; padding: var(--spacing-8) 0 var(--spacing-4); }
  .chat-older__btn {
    display: inline-flex; align-items: center; gap: var(--spacing-8);
    min-height: 32px; padding: 0 var(--spacing-16);
    border: 0; border-radius: var(--radius-full, 999px);
    background: var(--surface-menu, var(--surface-card));
    color: var(--text-action-default, var(--text-neutral-01));
    font-size: var(--font-size-label-sm, 13px);
    font-weight: var(--font-weight-semibold, 600);
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--elevation-1, 0 1px 2px rgba(0,0,0,.12));
    transition: background var(--duration-100) var(--easing-standard);
  }
  /* #43: every hover lives inside the hover-capable guard */
  @media (hover: hover) and (pointer: fine) { .chat-older__btn:not(:disabled):hover { background: var(--surface-interactive-hover, var(--surface-card)); } } /* #334 AND-18 guard */
  .chat-older__btn:disabled { cursor: default; color: var(--text-neutral-02); }
  /* ★★ Session I (#731/#735, sheet 5 — Damir: "the composer must TRULY float, messages
     pass under the pill"; his screenshot: the log ended above it). #711 made the bar
     paint as three floating shapes but left it IN THE FLOW, so the log still stopped at
     its top edge. The slot is absolutely positioned at the canvas bottom now (the canvas
     is position:relative — message-bubble.css), and the log takes the published
     --composer-h as bottom padding, so the last bubble scrolls up out from under the
     pill and the pattern runs behind it. Everything that composed with the slot keeps
     composing: the --kb-inset margin lifts an absolute box exactly as it lifted a flex
     one; the tray mounts INSIDE the slot after the bar and the ResizeObserver republishes
     the taller height; the request pane only exists in the 'incoming' lock, where the
     composer is hidden; the chevron + @ FAB already offset by --composer-h. The 760
     desktop column centres the slot with max-width + auto margins (align-self cannot
     reach an absolute box). ⚠ NO stacking-context property on the slot or the canvas —
     the message-menu row lift rule (message-menu.css) still holds. */
  #chat-composer { position: absolute; inset-inline: 0; inset-block-end: 0; }   /* the log's matching padding rides the #messages rule above */
  /* ★ #711: the @ FAB sits ABOVE the floating composer — --composer-h is written on the
     canvas by a ResizeObserver over #chat-composer (the chevron reads it in
     scroll-latest.css). Falls back to 0 where nothing writes it. */
  /* iOS-29 attempt 4 (#301) — CHANGED LEVER per #294: never resize <body> (that
     fought WKWebView's own focus pan through three attempts). The flex column
     keeps its 100% layout height; while the soft keyboard is up the composer is
     pushed above it by a bottom margin driven from visualViewport (--kb-inset,
     set by keyboardViewport()), and .c-chat-canvas (flex:1, min-height:0)
     absorbs the difference — topbar stays, log shrinks, composer lifts.
     The max(0px, … − env(safe-area-inset-bottom)) does two jobs: WebKit keeps
     reporting the FULL safe-area inset with the keyboard up (#294 measurement),
     so the composer's own inset padding is re-used as keyboard clearance
     (no 34px dead cushion above the keyboard); and with the keyboard closed
     (--kb-inset: 0) the max() clamps the negative result to 0 so the composer
     is never pushed INTO the home indicator. */
  #chat-composer { margin-bottom: max(0px, calc(var(--kb-inset, 0px) - env(safe-area-inset-bottom, 0px))); }
  /* iOS-53 r2 (#324): ride the keyboard, don't jump it. The native push lands at
     the keyboard animation's START (WillChangeFrame), so transitioning the margin
     over ~the keyboard's own duration/curve slides the composer in sync with the
     keyboard; the canvas + log animate with it (the stick loop in the shell keeps
     the newest message glued to the bottom through the slide). The bezier is the
     community-measured UIKit keyboard curve. Engines that never set --kb-inset
     (Android adjustResize, desktop) never trigger it. Reduced motion: instant. */
  #chat-composer { transition: margin-bottom 280ms cubic-bezier(0.38, 0.7, 0.125, 1); }
  @media (prefers-reduced-motion: reduce) { #chat-composer { transition: none; } }
  /* ===== DESKTOP (:root[data-desktop]) — grey ground only. Dark desktop deepens
     the base to grey-1000 (#207).
     B2 (#256): the #207 HARD-FORCED `::before{display:none}` pattern-off is GONE —
     desktop now defaults to pattern Off via the pre-paint pref script above, and an
     explicit Chat-appearance pick turns the doodle pattern on/off on desktop too.
     ★ N81 (#422): the desktop dark GROUND override is RETIRED too, and the reason is
     that it inverted itself. It existed to deepen the desktop ground below the old
     --surface-neutral-01; Damir's new dark canvas is #0f1115, which is already deeper
     than the grey-1000 (#111213) the override pointed at — so keeping it would have
     made desktop dark PALER than mobile dark, the exact opposite of its purpose, and
     an undocumented second dark canvas colour on top of that. One dark canvas now. */
  /* ★★ #722 (Session H, Damir 2026-08-30: "Yes 760") — THE 760 COLUMN.
     Wide desktop only: the CONVERSATION COLUMN and the COMPOSER cap at 760px and
     centre; the CANVAS (gradient + doodle pattern) stays full-bleed because nothing
     here touches .c-chat-canvas — the cap lives on the scroller's PADDING and on the
     composer slot's width (Telegram Desktop / iMessage / Signal Desktop grammar).
     · .messages keeps full width, so the SCROLLBAR stays at the window edge; the
       max(0px, …) term is inert below 760px of pane — a narrow desktop pane and every
       phone are byte-identical (the calc floors to the rows' own 16px inset).
     · Bubble rows, date pills, the unread strip and the secure notice are #messages
       children — they centre with the padding for free; bubbles keep
       --layout-bubble-max (680 desktop, #337 W4) INSIDE the column and cards hold
       their 360 rail.
     · The chevron and the @ FAB keep their 16px inset from the COLUMN's edge, not
       the window's — the same calc, plus the spacing term.
     · The composer slot (and the request pane that docks in the same slot) centres
       at the same 760 so the pill's edge tracks the bubbles' edge. */
  :root[data-desktop] .messages { padding-inline: max(0px, calc((100% - 760px) / 2)); }
  /* ★ Session I (Damir 2026-09-02, Windows): "the unread bar is cut off on both sides" —
     the strip is a #messages child, so it centred INSIDE the 760 column and its two
     hairlines + tint stopped dead at the gutters. Ruled FULL PANE, edge to edge. The
     child cannot see the scroller's 100%, but on desktop the scroller IS the pane:
     body is margin 0 / overflow hidden and .c-chat-canvas fills it, so 100vw == the
     .messages containing width and this term equals the padding term above to the
     pixel. The negative margin pulls the strip back over both gutters; the 6px
     scrollbar gutter (base.css .u-scroll) stays outside, so the strip runs from the
     pane edge to the scrollbar edge and its text stays centred on the column.
     Inert below 760px (max floors at 0), phones untouched. Pinned to the .messages
     term: the two 760 literals must move together. */
  :root[data-desktop] .c-unread-divider { margin-inline: calc(-1 * max(0px, (100vw - 760px) / 2)); }
  :root[data-desktop] #chat-composer { max-width: 760px; margin-inline: auto; }   /* ★ Session I: the slot is absolute now — insets 0 + max-width + auto margins centre it */
  :root[data-desktop] .chat-request-pane { width: 100%; max-width: 760px; align-self: center; }
  :root[data-desktop] .c-scroll-latest,
  :root[data-desktop] .chat-mention-fab {
    inset-inline-end: max(var(--spacing-16), calc((100% - 760px) / 2 + var(--spacing-16)));
  }
  /* boot spinner — fills the log while the JS bundle parses + C# pushes the
     conversation; the first renderLogNow() clears #messages and removes it. */
  .chat-boot { flex: 1; display: flex; align-items: center; justify-content: center; }
  /* ★ #346 (review of #343): this rule is PRE-#343 and the ad2c7ca revert took it out
     with the #343 delay rule that sat beside it. Without it the span is an empty
     display:inline box that paints NOTHING, so the log was a blank rectangle for the
     whole entry window — worse than the state the revert meant to restore. #343 only
     ever argued the spinner should be DELAYED, never removed. */
  .chat-boot__spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border-subtle, rgba(128,128,128,0.22));
    border-top-color: var(--icon-accent, #1892ce);
    animation: chat-boot-spin 0.8s linear infinite;
  }
  @keyframes chat-boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .chat-boot__spinner { animation: none; } }
  /* avatar flash guard: keep the topbar avatar invisible (slot reserved) until the
     identity lands, so the boot gradient never flashes before the real avatar. */
  .c-topbar.is-avatar-pending .c-avatar { visibility: hidden; }
  /* #264 ⑤: connection-event chip — a centered quiet pill replacing the clumsy
     "XYZ has accepted your contact request" BUBBLE (worst with a bare address;
     the subject renders via the #211 truncation canon). */
  .chat-event { display: flex; justify-content: center; padding: var(--spacing-8) var(--spacing-16); }
  .chat-event__chip {
    display: flex; align-items: center; gap: var(--spacing-8);
    max-width: min(85%, 480px);
    padding: var(--spacing-8) var(--spacing-16);
    border-radius: var(--radius-full);
    /* #265 (Damir ⑦): the tonal wash vanished on the light-blue canvas — ride
       the received-bubble surface instead.
       ★ N81 (#422, #46 audit): "white pops on the gradient" was TRUE of the old
       sky-blue canvas and is false of the cream one — white on #fcfbfa was 1.03:1.
       The elevation is replaced by the same incoming hairline the received bubble
       carries.
       ★ N82 (#427): the canvas is #f4f6f9 now, which gives a white chip 1.083:1 on
       its own, and --border-bubble-received is `transparent` in BOTH themes. The
       rule is unchanged on purpose — it follows the token, which is one line from
       bringing the edge back. */
    background: var(--surface-bubble-received);
    box-shadow: inset 0 0 0 1px var(--border-bubble-received);
    color: var(--text-neutral-01);
    font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm);
    text-align: center;
  }
  .chat-event__chip svg { flex: none; color: var(--icon-accent); }
  /* attach → App-invite picker (inside a c-sheet) */
  .chat-app-picker { display: flex; flex-direction: column; gap: var(--spacing-4); }
  .chat-app-picker__item {
    display: flex; align-items: center; gap: var(--spacing-12);
    padding: var(--spacing-12); border: 0; border-radius: var(--radius-12);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer; width: 100%;
  }
  @media (hover: hover) and (pointer: fine) { .chat-app-picker__item:hover { background: var(--surface-interactive-hover); } } /* #337: AND-18 sweep miss */
  .chat-app-picker__name { font-weight: 600; }
  .chat-app-picker__empty { padding: var(--spacing-16); text-align: center; color: var(--text-neutral-02); }
  /* group/bot chat-info takeover — full-viewport cover mounted over the chat.
     z-30 sits ABOVE the bars/composer (z-20) but BELOW the sheets (z-40) + modal
     (z-50) it spawns, so its member sheet + kick/ban/leave confirms render on top.
     The c-chat-info panel is height:100% → fills this. */
  .chat-info-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .chat-info-takeover > .c-chat-info { flex: 1; min-height: 0; }
  /* W5 (#523): the in-chat send compose — same cover grammar as chat-info; its
     review sheet (z-40) + Max modal (z-50) render on top. */
  .chat-send-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .chat-send-takeover__body { flex: 1; min-height: 0; overflow-y: auto; }
  /* Bot channels (Option A — channel-as-title, Damir F5 2026-07-08): the CURRENT
     channel name lives in the topbar title with a chevron-down affordance; tapping
     the title opens the selector as a panel that slides DOWN from under the topbar
     (NOT the old under-topbar bar, NOT a bottom sheet). The trailing ⓘ opens the
     chat-info takeover. */
  .c-topbar.is-bot-channels .c-topbar__name {
    display: inline-flex; align-items: center; gap: var(--spacing-4);
  }
  .chat-channel-chev { flex: none; color: var(--icon-neutral-02, currentColor); }
  .chat-channel-unread-dot {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);
  }
  /* top-anchored channel selector: full-viewport scrim + a panel pinned directly
     under the topbar (its `top` is set inline = the topbar height) that slides
     down (translateY -100% → 0). */
  .chat-channel-overlay { position: fixed; inset: 0; z-index: 15; } /* below topbar (--z-20): panel slides out from UNDER the bar; scrim dims messages/composer but NOT the topbar (Damir 2026-07-08) */
  .chat-channel-overlay__scrim {
    position: absolute; inset: 0; background: var(--surface-scrim, rgba(0,0,0,0.4));
    opacity: 0; transition: opacity var(--duration-200, 200ms) var(--easing-standard, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-overlay__scrim { opacity: 1; }
  /* #268 (Damir): desktop contextual menus carry no backdrop wash — the channel
     selector is the chat's third contextual dropdown (beside the right-click menu
     + ⊕ popover, overlay.css). Scrim element stays: outside-click still closes. */
  html[data-desktop] .chat-channel-overlay__scrim { background: transparent; }
  .chat-channel-panel {
    position: absolute; left: 0; right: 0;   /* top set inline = topbar height */
    max-height: 60vh; overflow-y: auto;
    background: var(--surface-menu, var(--surface-neutral-01, #fff));
    border-bottom-left-radius: var(--radius-16, 16px);
    border-bottom-right-radius: var(--radius-16, 16px);
    box-shadow: var(--elevation-3, 0 8px 24px rgba(0,0,0,0.24));
    padding: var(--spacing-12);
    transform: translateY(-100%);
    transition: transform var(--duration-200, 200ms) var(--easing-emphasized, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-panel { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .chat-channel-overlay__scrim, .chat-channel-panel { transition: none; }
  }
  .chat-channel-panel__title {
    font-size: var(--font-size-label-sm, 13px);
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-neutral-02, #666);
    padding: var(--spacing-4) var(--spacing-8) var(--spacing-8);
  }
  /* A6 (#302): bot/server description under the panel title. Body-sm neutral-02,
     clamped to 4 lines — the text is bot-authored and unbounded in length. */
  .chat-channel-panel__desc {
    margin: 0;
    padding: 0 var(--spacing-8) var(--spacing-8);
    color: var(--text-neutral-02, #666);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  /* channel list (rows shared by the panel) */
  .chat-channel-list { display: flex; flex-direction: column; gap: var(--spacing-4); }
  .chat-channel-list__item {
    display: flex; align-items: center; gap: var(--spacing-8);
    width: 100%; padding: var(--spacing-12); border: 0; border-radius: var(--radius-12);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer;
  }
  .chat-channel-list__unread {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);
  }
  .chat-channel-list__item[data-selected] { background: var(--surface-action-tonal-default, rgba(24,146,206,0.12)); }
  .chat-channel-list__item[data-selected] .chat-channel-list__name { font-weight: var(--font-weight-semibold, 600); }
  .chat-channel-list__item:hover { background: var(--surface-interactive-hover); }
  .chat-channel-list__empty { padding: var(--spacing-16); text-align: center; color: var(--text-neutral-02); }

  /* @ jump-to-mention FAB (#8). Hidden until an unseen mention of the local user
     exists. It occupies the PRIMARY bottom slot by default (when the scroll-to-latest
     chevron is hidden — i.e. at the bottom, image-1 case); when the chevron is visible
     (scrolled up) it slides UP one slot to sit ABOVE the chevron, never overlapping it.
     Keyed off the sibling c-scroll-latest[data-visible] (appended before this button). */
  .chat-mention-fab {
    position: absolute;
    inset-inline-end: var(--spacing-16);
    inset-block-end: calc(var(--composer-h, 0px) + var(--spacing-16));   /* primary bottom slot (chevron hidden) — above the floating composer (#711) */
    width: var(--size-target-min); height: var(--size-target-min);
    display: flex; align-items: center; justify-content: center;
    border: var(--outline-width-1) solid var(--outline-neutral-01);
    border-radius: var(--radius-full);
    background: var(--surface-action-tonal-default);
    color: var(--text-action-default);
    box-shadow: var(--elevation-2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    opacity: 0; transform: translateY(var(--spacing-8)); visibility: hidden; pointer-events: none;
    transition: opacity var(--duration-200) var(--easing-standard),
                transform var(--duration-200) var(--easing-decelerate),
                inset-block-end var(--duration-200) var(--easing-decelerate),
                visibility var(--duration-200),
                background-color var(--duration-100) var(--easing-standard);
  }
  /* chevron visible → stack the @ FAB one 44px button + gap above it */
  .c-scroll-latest[data-visible] ~ .chat-mention-fab {
    inset-block-end: calc(var(--composer-h, 0px) + var(--spacing-16) + var(--size-target-min) + var(--spacing-8));
  }
  .chat-mention-fab[data-visible] { opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }
  @media (hover: hover) and (pointer: fine) { .chat-mention-fab:hover { background: var(--surface-action-tonal-hover); } } /* #334 AND-18 guard */
  .chat-mention-fab:active { background: var(--surface-action-tonal-pressed); }
  /* unseen-mention count (same recipe as the scroll-latest badge: error role + ring) */
  .chat-mention-fab__badge {
    position: absolute; top: calc(-1 * var(--spacing-4)); inset-inline-end: calc(-1 * var(--spacing-4));
    min-width: 18px; height: 18px; padding: 0 var(--spacing-4);
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full);
    /* ★ #46 r2 C1 (cross-file contract from the token census): the ink is the ERROR role,
       not the action role. Session K made --text-neutral-on-action white in BOTH themes for
       Damir's blue button (6.68:1, correct and unchanged) — and this badge, which sits on
       --surface-error (dark #f1786e), inherited that white and collapsed to 2.63:1. The
       error role restores 6.72:1 in dark; light is 6.36:1 either way, so nothing moves there.
       REVERSAL: back to --text-neutral-on-action and the count goes unreadable in dark. */
    background: var(--surface-error); color: var(--text-neutral-on-error);
    box-shadow: 0 0 0 2px var(--surface-menu);
    font-size: var(--font-size-label-xs); line-height: 1; font-weight: var(--font-weight-bold);
  }

  /* pulse the target message on jump.
     N52 (verify-first): the original ring was --surface-warning-inverse — the WASH
     tone (orange-100 light / orange-900 dark), near-zero contrast against the
     canvas in BOTH themes, which is why the shipped pulse never read on device.
     --surface-warning is the SOLID role (orange-600 light / orange-400 dark). */
  .c-bubble-row[data-mention-pulse] .c-bubble { animation: chat-mention-pulse 1.4s var(--easing-standard) 1; }
  @keyframes chat-mention-pulse {
    0%, 20% { box-shadow: 0 0 0 3px var(--surface-warning); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  /* loop B-3: under reduced motion the ring must still READ — a static held ring
     (no animation) for the attribute's ~1.6s lifetime; the JS timeout removes it. */
  @media (prefers-reduced-motion: reduce) {
    .c-bubble-row[data-mention-pulse] .c-bubble { animation: none; box-shadow: 0 0 0 3px var(--surface-warning); }
  }
</style>

<body>
  <!-- C#-LOCALIZED string carriers (Q4 + M16). generatePage substitutes the star-SL
       markers from the lang files with the EXACT strings C# later pushes (title /
       showWarning text), so equality checks below are locale-proof by construction.
       They live in HTML TEXT nodes (safe for any localized characters); a plain-
       browser preview leaves the markers raw → the JS reader falls back to en-us.
       ⚠ #248: every marker here is same-line-closed — never write one that isn't. -->
  <div id="sl-carriers" hidden aria-hidden="true">
    <!-- ★ N77 (#413): dev-mode carrier, same grammar as home.html's. HomePage
         registers "devMode" with addCustomString at boot, so it resolves in EVERY
         generated document, not only index.html. Gates the load probe below. -->
    <span id="sl-devmode">*SL{devMode}</span>
    <!-- ★ Session I: the DEVICE 12/24-hour setting ("h23" / "h12"), registered by HomePage
         at boot (Utils.deviceHourCycle) — the shell boot below copies it onto <html
         data-hour-cycle> and every time format (timestamp.js timeOpts) follows it. -->
    <span id="sl-hourcycle">*SL{hourCycle}</span>
    <span id="sl-payment-received">*SL{chat-payment-received}</span>
    <span id="sl-payment-request-received">*SL{chat-payment-request-received}</span>
    <span id="sl-payment-request-sent">*SL{chat-payment-request-sent}</span>
    <span id="sl-connecting-s2">*SL{global-connecting-s2}</span>
    <span id="sl-connecting-dlt">*SL{global-connecting-dlt}</span>
    <span id="sl-request-connected">*SL{global-friend-request-connected}</span>
    <!-- #434: the LEGACY sentence is still carried, and only for history. The copy
         changed to one direction-neutral line, but chats written before that build
         hold the old text — without this carrier they would stop matching and
         degrade from a centred event chip to an ordinary message bubble. -->
    <span id="sl-request-accepted">*SL{global-friend-request-accepted}</span>
    <span id="sl-waiting-response">*SL{chat-waiting-for-response}</span>
    <span id="sl-online">*SL{chat-online}</span>
  </div>
  <script>(function(){var e=document.getElementById('sl-hourcycle');var t=e?e.textContent.trim():'';if(t==='h23'||t==='h12')document.documentElement.dataset.hourCycle=t;})();</script>
  <div id="chat-topbar"></div>
  <div class="c-chat-canvas">
    <!-- tabindex: keyboard users must be able to scroll text-only history -->
    <div class="messages u-scroll" id="messages" role="log" aria-label="Messages" tabindex="0"><div class="chat-boot" aria-hidden="true"><span class="chat-boot__spinner"></span></div></div>
    <!-- ★ #711 (Damir 2026-08-30): the composer FLOATS — it lives inside the canvas, so
         the gradient and the pattern run on behind a bar that has no background of its
         own. Still in the flex flow (no absolute positioning): the keyboard margin, the
         tray under it and the request pane before it all work exactly as before. The
         chevron and the @ FAB offset themselves by --composer-h (set below). -->
    <div id="chat-composer"></div>
  </div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. Before this, production resolved
     'en-us' in EVERY locale. ?lang= still overrides (demos/tests); in a plain-browser
     preview the marker stays un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production chat shell — the redesigned single-chat surface wired to the REAL
   * C# MAUI bridge (native.js in the bundle). SingleChatPage.xaml.cs pushes the
   * conversation via executeUiCommand(fnRef, b64…) against the page globals
   * registered below; the composer + back button emit legacy `ixian:` commands
   * via bridge.send.
   *
   * Contract source of truth: Spixi/Pages/Chat/SingleChatPage.xaml.cs +
   * Resources/Raw/html/js/chat.js (legacy). The 1:1 text conversation is wired
   * fully (create + status upsert + delete + typing + clear). Everything else is
   * a safe no-op stub so C#'s dispatch never console.errors.
   *
   * CONTRACT NOTES (verified against SingleChatPage.xaml.cs, line refs):
   *  · Text CREATE arrives via addMe / addThem (chat.js insertMessage → prefix,
   *    xaml.cs:1460), 12 args:
   *      addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending)
   *      addThem(id, address, nick, avatar, text, time)
   *    (legacy addMe/addThem share the addText 7-arg shape; addThem is called
   *    with only 6 by C#, so args 7-11 are undefined for incoming rows.)
   *  · Text STATUS UPDATE arrives via updateMessage (chat.js:1035, xaml.cs:1624):
   *      updateMessage(id, message, sent, confirmed, read, paid, errorSending)
   *    Legacy updateMessage ONLY mutates an existing msg_<id> row (returns early
   *    if unknown). To be robust here it is an UPSERT: create if the id is
   *    unknown (using `message` as the text + `sent` for direction), else update
   *    the existing row's status + text.
   *  · timestamps are UNIX SECONDS (legacy addText does `new Date(time*1000)`);
   *    the redesigned bubbles want ms → multiply.
   *  · All bool args are the .NET "True"/"False" strings.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, setTopbarSub, createMessageBubble, createDateSeparator,
    createComposer, clearComposer, setComposerCost, createTypingIndicator, createScrollToLatest,
    setComposerContext, getComposerContext,   // M1 reply-to (#441): the quote strip above the input
    setScrollLatestCount,           // N53: unread badge on the scroll-to-latest chevron (shipped #74, wired here)
    attachPressFeedback,
    setMessageStatus, removeMessage,
    createFileBubble, setFileProgress,
    createMediaBubble, setMediaSrc, openMediaViewer,
    createPaymentBubble, createCallBubble,
    createAppBubble, createSystemNotice, createUnreadDivider,
    attachMessageMenu, openMessageMenu,   // openMessageMenu = the KEYBOARD path (Shift+F10 / Menu key)
    enterChatSelect, openTipSheet, openMemberSheet, openAttachSheet,
    openAttachTray, closeAttachTray, isAttachTrayOpen, revealAttachTray,   // ★ #705: the mobile tray under the composer · ★ Session K: the K1 hold
    attachEdgeBack,                 // ★ L3 (#706): the iOS back signal, one line per shell
    hasAttachTiles, attachTilesFor, // the ONE attach predicate — see openAttach / syncAttachAffordance
    openRequestSheet,               // #528: attach → Request (the #139 amount sheet, live)
    createWalletSend,               // W5 (#523): attach → Pay (lockedRecipient compose)
    openPaymentReview,              // ★ W-d: request-in Pay → the review sheet BEFORE the native confirm
    setSendQuote: applySendQuote,   // W6 — aliased: the bridge handler below shares the name
    createModal, openModal, showToast, createButton,
    createWarningBanner, setWarning, createContactRequest,
    createSheet, openSheet, closeSheet,
    createChatInfo,                 // group/bot chat-info takeover (header tap; 1:1 → ContactDetails page)
    addReactions: applyReactions,   // component free-fn; aliased — the bridge handler below is also `addReactions`
    truncateAddressMiddle,          // #211 canon: chat surfaces show addresses truncated, never in full
    attachContextMenuAnchors, anchorSheetAbove,   // Batch C (M6): desktop sheet grammar (no-op on mobile)
    isPseudoAddressNick,            // D-19b (#370): blind roster "x"+address pseudo-keys never display
    isAddressShaped,                // ★ #589: the ONE address-shape test — a NICK is never middle-truncated
    attachChatFlow, syncChatFlow, detachChatFlow, // W5: "Live flow" animated pattern style (desktop-only)
    createNativeBridge, installExecuteUiCommand,
    /* ★ N81 (#422) — MISSED IN THE FIRST CUT, caught by the #46 audit executing the
     * BUILT artifact. readPatternPrefs() runs at module top level, so an unimported
     * name here is not a latent bug: the main script throws before bridge.exposeAll,
     * nothing is exposed, and every conversation boots to a permanent spinner.
     * ⚠ Neither gate could see it. build-shells' preflight validates DESTRUCTURED
     * symbols against the bundle — a symbol that is never destructured is invisible
     * to it, because its premise is staleness, not omission. The smoke pins regex-read
     * the file and never execute it. The new pin below is a destructure pin for that
     * reason. */
    patternLevelVar, readPatternLevel,
    /* ★ N71 (#421): and applyPushedTheme — the SECOND time this exact omission
     * happened in this file, in the same session, and the reason both gates below
     * now exist. The first cut died at boot (top-level call). This one did NOT: the
     * reference sits inside a handler, so the shell booted perfectly and the theme
     * push was the only thing that broke — which the boot gate cannot see and only
     * the END-TO-END push pin caught. Two different symptoms, one root cause. */
    applyPushedTheme,
    openRevokeRequestFlow,   // ★ #562: the HIDE-request words — ONE surface with the chats-list flow
  } = window.Spixi;

  /* —— W5 chat pattern STYLE (Damir 2026-08-12) ——————————————————————————————
   * The STYLE was resolved pre-paint (data-chat-pattern on <html>, head script);
   * the two TILE styles need nothing more — chat-pattern.css has already painted
   * them from the inherited custom properties. Only "Live flow" needs code, and
   * only once the bundle has parsed. Fail-soft ladder: no 2d context → fall the
   * root attribute back to 'doodles', so a canvas-less WebView gets a tile instead
   * of a bare gradient.
   * ⚠ This sentence said 'lineart' while the code below said 'triangles' — it had
   * been stale since 2026-08-22. Both now say 'doodles' (★ E1). */
  const chatCanvasEl = document.querySelector('.c-chat-canvas');
  function syncFlowIfActive() {
    if (chatCanvasEl && typeof syncChatFlow === 'function') syncChatFlow(chatCanvasEl);
  }
  /* ★★ SESSION F AUDIT — TWO FAIL-SOFT HOLES CLOSED HERE.
     chat-flow.js's own contract says "a pattern style must never be able to break the
     shell", and settings-screens.js mountFlowFace honours it with a try/catch. This
     call site did not. attachChatFlow catches its documented getContext throw, but it
     still does host.prepend(canvas) and constructs a ResizeObserver UNGUARDED — and
     this function runs at TOP LEVEL in the shell's main script, so a throw from either
     aborted everything below it (identity title, boot theme, the whole bridge wiring).
     That is far worse than the bare gradient the ladder exists to prevent.
     ⚠ And the !chatCanvasEl guard returned BEFORE the fail-soft instead of after it, so
     an absent canvas left 'flow' on the root with --chat-pattern-tile: none — the one
     path in all three ladders that can still end at a bare gradient. Unreachable today
     (.c-chat-canvas is static markup above), but it would be introduced silently by any
     refactor that renders the canvas from JS. Both now land on doodles. */
  function applyChatPatternStyle() {
    if (!chatCanvasEl) { document.documentElement.setAttribute('data-chat-pattern', 'doodles'); return; }
    const flow = document.documentElement.getAttribute('data-chat-pattern') === 'flow';
    if (!flow) {
      try { if (typeof detachChatFlow === 'function') detachChatFlow(chatCanvasEl); } catch (e) { /* never break the shell */ }
      return;
    }
    let mounted = false;
    try { mounted = typeof attachChatFlow === 'function' && !!attachChatFlow(chatCanvasEl); } catch (e) { mounted = false; }
    if (!mounted) document.documentElement.setAttribute('data-chat-pattern', 'doodles');
  }
  applyChatPatternStyle();

  /* —— W5 F5 (Damir 2026-08-13): a pattern pick must reach chats ALREADY OPEN ——
   * "works, just it always need to reload chat to see changes, it doesnt auto
   * apply to active chats." Both prefs were resolved ONCE, in the pre-paint head
   * script, so an open chat kept its boot pattern until the WebView reloaded.
   * The Account screen and the chat are separate WebViews over ONE file://
   * localStorage origin, which is exactly the spixi.backup.last problem — so
   * this reuses that grammar verbatim (settings.html, #314) rather than adding a
   * bridge verb: storage event + focus fallback + visibilitychange + a
   * visibility-guarded 2s poll, because WKWebView fires no cross-WebView storage
   * event and a COVERED WebView still reports itself visible and focused.
   * Everything is gated on an ACTUAL change of the stored pair, so the poll is a
   * no-op read in the steady state and never repaints under a live chat.
   *
   * The re-resolve is the SAME ladder as the head script (platform-aware default,
   * clamp, desktop-only Live flow, the legacy-alpha migration), then
   * applyChatPatternStyle() mounts or detaches the canvas. Tile-vs-canvas can
   * never double-paint: chat-pattern.css sets --chat-pattern-tile:none under
   * [data-chat-pattern='flow'] (::before display:none) and every non-flow style
   * detaches the canvas first. */
  /* ★★ AUG (Damir 2026-08-30, ON DEVICE): the GROUND joins this live re-resolve.
     "the chat that was preselected doesnt refresh" — the canvas pref was resolved once in
     the pre-paint head script, so an open chat kept its boot ground until the WebView
     reloaded. That is the identical defect W5 F5 fixed for the pattern pair in 2026-08-13,
     and the fix is to put the third key through the SAME machinery rather than add another
     one: same storage event, same focus/visibility fallback, same stamp gate. */
  const PATTERN_PREF_KEYS = { level: 'spixi.chat.pattern', style: 'spixi.chat.patternstyle', ground: 'spixi.chat.ground' };
  function readPatternPrefs() {
    const de = document.documentElement.hasAttribute('data-desktop');
    let p = NaN, s = '', gr = '';
    try {
      p = parseFloat(localStorage.getItem(PATTERN_PREF_KEYS.level));
      s = localStorage.getItem(PATTERN_PREF_KEYS.style) || '';
      gr = localStorage.getItem(PATTERN_PREF_KEYS.ground) || '';
    } catch (e) { /* DomStorageEnabled=false → boot defaults, forever */ }
    // ★ N81 (#422): p is a LEVEL INDEX now. readPatternLevel migrates the legacy
    // fractional alphas (0.3/0.5/0.7) and clamps; B2 (#256) platform-aware default
    // survives unchanged — desktop Off, mobile Default.
    p = readPatternLevel(p, de ? 0 : 1);
    if (s === 'flow' && !de) s = 'doodles';      // Live flow is desktop-only (battery)
    // ★ E1 2026-08-29: unknown/absent → DOODLES, the new default. This allowlist IS
    // the migration for the two retired styles: a stored 'triangles' or 'lineart'
    // matches nothing and falls through to 'doodles'. The stale value stays in
    // localStorage until the next pick overwrites it, which is harmless — it is
    // never read back as anything but "not in the list".
    if (s !== 'doodles' && s !== 'matrix' && s !== 'flow') s = 'doodles';
    /* ★ AUG: same allowlist discipline as the style, and the DEFAULT is platform-aware the
       way the intensity default already is (B2 #256, desktop Off / mobile Subtle). Damir
       2026-08-30: "for android we leave the default view on light mode always gradient
       canvas and new pattern" — so an unset pref means GRADIENT on mobile, FLAT on desktop,
       where the canvas sits beside the chrome and a wash competes with it. */
    if (gr !== 'flat' && gr !== 'gradient') gr = de ? 'flat' : 'gradient';
    return { level: p, style: s, ground: gr };
  }
  function applyPatternPrefs(prefs) {
    const r = document.documentElement;
    /* ★ N81 (#422): NO theme derivation here any more. This function used to read
     * data-theme and multiply the stored value by 0.36 for dark — the same
     * derivation the head script and settings.html each carried their own copy of,
     * three places that had to agree. The level is an index now and the alpha comes
     * from --chat-pattern-alpha-N, which CSS resolves under whatever theme is
     * current at paint time. The setTheme hook still calls this (the flow canvas
     * genuinely does need a repaint), but it can no longer paint the wrong number. */
    r.style.setProperty('--chat-pattern-opacity', patternLevelVar(prefs.level));
    r.setAttribute('data-chat-pattern', prefs.style);
    r.setAttribute('data-chat-ground', prefs.ground);   // ★ AUG: light-only in effect; inert in dark
    applyChatPatternStyle();     // mount / detach the flow canvas for the new style
    syncFlowIfActive();          // …and repaint it now (reduced motion = no loop to self-heal)
  }
  /* ⚠ THE STAMP IS THE GATE. A key left out of it is a key whose change is invisible to
     the poll — the ground would have needed a WebView reload exactly like the pattern did
     before W5 F5. Every field readPatternPrefs returns must appear here. */
  const patternStamp = (p) => p.level + '|' + p.style + '|' + p.ground;
  let seenPatternPrefs = patternStamp(readPatternPrefs());
  function refreshPatternPrefsIfChanged() {
    const prefs = readPatternPrefs();
    const stamp = patternStamp(prefs);
    if (stamp === seenPatternPrefs) return;
    seenPatternPrefs = stamp;
    applyPatternPrefs(prefs);
  }
  window.addEventListener('storage', (e) => {
    if (!e.key || e.key === PATTERN_PREF_KEYS.level || e.key === PATTERN_PREF_KEYS.style) refreshPatternPrefsIfChanged();
  });
  window.addEventListener('focus', refreshPatternPrefsIfChanged);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshPatternPrefsIfChanged();
  });
  setInterval(() => { if (!document.hidden) refreshPatternPrefsIfChanged(); }, 2000);

  /* #211 address-display canon: the visible chat title is the nick, or the address
   * MIDDLE-TRUNCATED (6…6) when there's no nick (or the "nick" is really the address
   * echoed back). Full address lives only in Contact details + payments. */
  function identityTitle() {
    const nick = identity.name || '';
    if (nick && nick !== identity.address) return nick;
    return identity.address ? truncateAddressMiddle(identity.address) : (nick || '');
  }

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  /* #343: ONE call lights up press feedback for every pressable surface in this
     shell (src/components/pressable.js). Delegated on document, so rows created
     later by a re-render are covered without re-attaching. A new shell needs
     exactly this line. */
  attachPressFeedback();
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[chat-shell stub]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;
  /* legacy sends Unix SECONDS; redesigned bubbles compare against Date.now() (ms) */
  const toMs = (t) => { let n = Number(t) || 0; if (n && n < 1e12) n *= 1000; return n; };

  /* —— C#-localized string carriers (the hidden #sl-carriers block) ——————————
   * Read once; an UNSUBSTITUTED marker (plain-browser preview) falls back to the
   * en-us string. The marker probe is RUNTIME-ASSEMBLED — a literal unclosed
   * marker in source crashes the C# line parser at boot (#248). */
  function slCarrier(id, fallback) {
    const MARK = '*SL' + '{';   // runtime-assembled, see above
    const el = document.getElementById(id);
    const t = el ? el.textContent.trim() : '';
    return (!t || t.indexOf(MARK) !== -1) ? fallback : t;
  }

  /* Q4: the DIRECT-payment "received" title — the request-vs-payment signal for
   * the signed-amount grammar (component canon: received payments show '+',
   * requests stay bare — src/demo/chat.html states matrix). The request title is
   * carried too, purely as a COLLISION GUARD (audit A-1): if a locale ever
   * translated both keys to the identical string, the sign must NOT fire. */
  const PAY_RECEIVED_TITLE = slCarrier('sl-payment-received', 'Payment Received');
  const PAY_REQUEST_RECEIVED_TITLE = slCarrier('sl-payment-request-received', 'New Payment Request');
  const PAY_REQUEST_SENT_TITLE = slCarrier('sl-payment-request-sent', 'Payment Request Sent');
  const isRequestTitle = (t) => t === PAY_REQUEST_RECEIVED_TITLE || t === PAY_REQUEST_SENT_TITLE;

  /* #264 (Damir nice-to-have ⑤): "{0} has accepted your contact request" arrives
   * as a PLAIN TEXT message (StreamProcessor:337/:354, string.Format over the
   * localized template) — as a chat bubble it reads clumsy, worst when {0} is a
   * bare base58 address. Detect it locale-proof via the template carrier
   * (prefix/suffix around the {0} slot) and render a centered EVENT CHIP instead:
   * same localized sentence, the subject swapped for the nick-or-TRUNCATED-address
   * canon (#211). Fail-soft: no carrier / no {0} → normal bubble. */
  /* ⑪ "Waiting for response" is pushed (updateScreen, PRE-burst) for BOTH pending
   * friend states — it closes the open-to-burst window before the specific
   * signal (showRequestSentModal / showContactRequest) lands. Locale-proof. */
  const WAITING_RESPONSE_TEXT = slCarrier('sl-waiting-response', 'Waiting for response');

  /* W1 (#302) — the presence dot was DEAD in 5 of the 8 shipped locales.
     setOnlineStatus receives a fully-localized string from C# (:1930/1940/1946),
     and the dot was derived from /online/.test(s). "chat-online" is only the word
     "Online" in en-us/de-de/pt-br; es-co "En línea", fr-fr "En ligne", ru-ru
     "В сети", sl-si "Na voljo", sr-sp "Na mreži" all fail that regex, so those
     users never saw a presence dot at all. Same carrier mechanism the payment
     titles already use in this file — locale-proof by construction. */
  const ONLINE_TEXT = slCarrier('sl-online', 'Online');

  /* #434: TWO templates, because the copy changed. The live one is the
     direction-neutral "you are now connected" sentence C# writes from now on; the
     legacy "has accepted your contact request" one is kept so existing histories
     still render as a chip. Matching is longest-prefix-first so a locale in which
     one sentence is a prefix of the other cannot mis-attribute the subject. */
  function tplParts(tpl) {
    const i = tpl.indexOf('{0}');
    return i === -1 ? null : [tpl.slice(0, i), tpl.slice(i + 3)];
  }
  const ACCEPTED_TPL = slCarrier('sl-request-connected', 'You are now connected with {0}.');
  const ACCEPTED_PARTS = tplParts(ACCEPTED_TPL);
  const EVENT_TPLS = [
    ACCEPTED_PARTS,
    tplParts(slCarrier('sl-request-accepted', '{0} has accepted your contact request.')),
  ].filter(Boolean).sort((a, b) => (b[0].length + b[1].length) - (a[0].length + a[1].length));
  /** → { parts, subject } for the template that matched, else null. */
  function acceptedEventMatch(text) {
    const t = String(text || '');
    for (const parts of EVENT_TPLS) {
      const [p, sfx] = parts;
      if (t.length <= p.length + sfx.length) continue;
      if (!t.startsWith(p) || !t.endsWith(sfx)) continue;
      return { parts, subject: t.slice(p.length, t.length - sfx.length) };
    }
    return null;
  }
  function acceptedEventSubject(text) {
    const m = acceptedEventMatch(text);
    return m ? m.subject : null;
  }

  /* M16 (#59): the two connectivity strings C# routes through showWarning
   * (SingleChatPage.xaml.cs:1921/1942). These render as a topbar TITLE-STATE
   * (sub-line swap), NOT a banner; en-us literals double as preview fallbacks
   * and are harmless duplicates when the substitution ran. */
  const CONNECTIVITY_TEXTS = new Set([
    slCarrier('sl-connecting-s2', ''),
    slCarrier('sl-connecting-dlt', ''),
    'Connecting to Ixian S2...',
    'Connecting to Ixian Platform...',
  ]);
  CONNECTIVITY_TEXTS.delete('');
  let connectivitySub = '';   // non-empty while C# reports connecting → overrides the presence sub

  /* —— chat mode (setChatMode type: 0 = 1:1, 1 = group, 2 = blind group,
   *    3 = bot — chat.js setChatMode / xaml.cs:526,549). We keep it so the
   *    header + grouping know whether to show sender labels/avatars. ————————— */
  /* ★★ ONE FIELD ANSWERS "IS THE ROOM TYPE KNOWN, AND FOR WHOM" (round 3).
     `answeredFor` is the peer address the CURRENT room answer describes. `null` means
     no answer has arrived. Round 2 held the same fact in TWO fields, `owner` and
     `known`, and each of them was a separate line that one deletion could remove
     (surviving mutation Y1). One fact, one field, one writer.
     `hidesAddresses` is declared here so the unknown-room answer is explicit and not
     an undefined read. `answeredFor` stays LAST — a pin names the tail of this literal. */
  const mode = { type: 0, isBot: false, isMulti: false, blind: false, blindKnown: true, admin: false, notifications: true, costText: '', description: '', hidesAddresses: false, answeredFor: null };

  /* ★★ THE ROOM-ANSWER LATCH AND ITS ONE WAKE-UP (#46 loop; round 3).
   * `mode` above starts at its 1:1 DEFAULTS. C# sends setChatMode for every room.
   * For a 1:1 room C# sends it SYNCHRONOUSLY, in the onLoad burst
   * (SingleChatPage.xaml.cs:804). For a group or a bot room C# sends it from inside a
   * Task.Run, after a wait loop (SingleChatPage.xaml.cs:730-771). So the first frames
   * of a group or a bot room read as a 1:1, and every gate that reads `mode` answers
   * for the wrong room.
   *
   * ★★ WHAT A ROOM OF UNKNOWN TYPE MAY OFFER: NOTHING. Read the four gates in
   * `attachFlags()`. `apps` needs "not a bot". `payments` needs "a 1:1". `files` needs
   * "not a bot and not a blind group". No tile survives every room type, so the
   * intersection over the four room types is EMPTY. An unknown room therefore offers no
   * tile, and the ⊕ that opens the tiles stays away. `attachFlags()` reads `modeKnown()`
   * for that reason. It is the ONE predicate. `openAttach`, the sheet's own action gate,
   * `openSendTakeover`, `openRequestForPeer` and `openAppPicker` all read that one
   * object. A round-1 belt granted the 1:1 DEFAULTS on a timer instead, and a bot room
   * then offered Pay, Request, App invite and Send file. C# refuses all four.
   *
   * ★ THE TIMEOUT IS PROOF, NOT PERMISSION. C# pushes the 1:1 setChatMode on the UI
   * thread, in the same burst as onChatScreenReady. So a room that has sent no
   * setChatMode after the wait is NOT a 1:1. Accepting the 1:1 defaults is the one
   * answer that the timeout rules out.
   *
   * ★ SO WHAT DOES THE WAIT WINDOW DO? It bounds the composer LAYOUT. It does not open
   * a gate. While the shell waits, the ⊕ keeps its place in the composer row and stays
   * invisible. The text field does not grow and then shrink under a typing finger. When
   * the window closes the shell stops holding space for a control that may never
   * arrive, and the ⊕ collapses. A latch with no time bound is a permanent latch
   * (#647③). This window is that time bound, and it cannot grant a capability.
   *
   * ★★★ THE WINDOW IS A CLOCK READING, NOT A STORED TIMESTAMP (round 3, surviving
   * mutations Y7 and Y8). Round 2 stamped `waitStart` and `waitPeer` inside the derive
   * function. Deleting that stamp, or setting it to 0, made the whole `wait` phase
   * unreachable and nothing went red. `performance.now()` counts milliseconds from THIS
   * document's time origin, and C# builds a NEW SingleChatPage — and therefore a new
   * document — for every chat it opens (HomePage.xaml.cs:2043). So the document's own
   * age IS this peer's wait window. There is no variable to stamp, no per-peer reset to
   * delete, and no writer to forget.
   * ★ It also closes review QUESTION-2: `performance.now()` is MONOTONIC, so an NTP
   * step backwards cannot leave the ⊕ parked in `wait`. `Date.now()` could.
   * ⚠ If a desktop reparent ever hands ONE document to a SECOND peer, that peer's
   * window is already closed and the ⊕ collapses until its setChatMode lands. That
   * direction is safe: it offers nothing. Do not "fix" it by re-stamping a variable.
   *
   * ⚠ MODE_WAIT_MS is compared against a FLOOR, not a ceiling. The C# wait is 50 sleeps
   * of 100 ms and has no upper bound. That is safe, because the window only releases
   * layout space. Do NOT restore a timer that opens a gate. */
  const MODE_WAIT_MS = 6000;
  /* The room type is known only when setChatMode answered for THIS peer. */
  function modeKnown() { return mode.answeredFor !== null && mode.answeredFor === identity.address; }
  /* True while this document is still inside its wait window. Pure: it reads a clock
     and a constant, and it writes nothing. */
  function modeWaitOpen() { return performance.now() < MODE_WAIT_MS; }

  /* —— header identity model. setNickname / setOnlineStatus mutate this; the
   *    topbar is rebuilt so name + presence sub-line stay live. ——————————————— */
  const identity = { name: '', sub: '', address: '', online: false, avatar: null };

  /* A3 (#302): "unread messages exist in other chats". Shell-scope, applied inside
   * renderTopbarNow — the topbar is fully rebuilt on six triggers. */
  let unreadElsewhere = false;

  /** Resolve a C# avatar arg to an <img> src, or null for the gradient fallback
   *  (same rule as the home shell): real on-disk path → src (normalize
   *  backslashes); the C# default placeholders → null = deterministic gradient.
   *  The avatar component has an onerror→gradient fallback, so a non-resolving
   *  path degrades cleanly. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }
  let callVisible = false;   // showCallButton reveals the topbar phone action (1:1, peer reachable)

  // Bot channel selector state — declared BEFORE the topbar renderer because the
  // channel-as-title (Option A) reads channelState during the first synchronous
  // paint (see the bot-channel bridge-protocol note further down).
  const channelState = { has: false, index: 0, name: '', icon: '', unread: false };
  let channelList = [];               // accumulated per open, from addChannelToSelector
  let channelDropdown = null;         // top-anchored selector overlay (open = non-null)
  let channelSheetBody = null;        // the live channel list inside the panel
  let channelKeydown = null;          // Esc + Tab-trap handler while the dropdown is open
  let channelFocusin = null;          // focus containment while the dropdown is open
  let channelReturnFocus = null;      // element to restore focus to on close (the title trigger)
  let focusTitleAfterRender = false;  // row-select rebuilds the topbar → focus the new title (review MINOR-2)

  const topbarHost = document.getElementById('chat-topbar');
  /* ONE composition for the topbar sub-line — used by the full rebuild AND the
   * M16 in-place connectivity swap (drift here = two different subs on screen).
   * M16 (#59): while C# reports connecting, the connectivity text REPLACES the
   * presence sub (WhatsApp/Telegram grammar); presence returns when it clears. */
  function topbarSubText(botChannels) {
    return connectivitySub || (botChannels
      ? [identityTitle(), identity.sub || ''].filter(Boolean).join(' · ')
      : (identity.sub || ''));
  }
  function renderTopbarNow() {
    /* Multi-select: the contextual selection bar is mounted INSIDE this slot (it
     * covers the topbar). The wipe below would destroy it, and the topbar is
     * rebuilt on six triggers — a presence tick mid-selection would silently drop
     * the bar and strand the user in selection mode with no way out. Detach it,
     * then put it back (listeners live on its own children, so they survive). */
    const keepSelectBar = topbarHost.querySelector('.c-chatselect-bar');
    topbarHost.textContent = '';
    if (keepSelectBar) topbarHost.append(keepSelectBar);
    const s = window.SL || {};
    // Bot channel mode (Option A): once C# has named a channel, the topbar TITLE
    // becomes the current channel name + chevron and opens the channel selector;
    // a trailing ⓘ opens the chat-info takeover. Otherwise the identity block
    // behaves as before (group/blind → chat-info takeover; 1:1 → ContactDetails).
    const botChannels = mode.isBot && channelState.has;

    // #248/#249: ALL chat info lives on the SHELL side now (the ContactDetails
    // group/bot/contact surface) — same desktop pane / takeover behavior for
    // every kind, C#-mediated (ixian:details). #249 (Damir r3): bots included —
    // the in-chat takeover overtook the conversation instead of paning. The
    // channel SELECTOR stays in-convo (title tap, botChannels mode). The
    // conversation wall (#221) is untouched — only a verb is emitted.
    // (openChatInfo/buildChatInfo remain for a possible channel-scoped info
    // surface — currently unreferenced by the topbar.)
    const infoTap = () => bridge.send('ixian:details');

    const actions = [];
    // start a voice call — revealed by showCallButton (C# gates availability);
    // ixian:call toggles initiate/hang-up (xaml:136).
    // key is callAction, NOT `call` — the dict's `call` is the history-bubble
    // label 'Voice call' (A4 sweep: one key, one English — conflict gate).
    if (callVisible) actions.push({ icon: 'phone', label: s.callAction || 'Call', onClick: () => bridge.send('ixian:call') });
    // #248 (Damir): an EXPLICIT info affordance on EVERY chat — the bare header
    // tap wasn't discoverable. Bot-channel mode already had it (its title became
    // the channel selector); now 1:1 + groups + plain bots get it too.
    actions.push({
      icon: 'info-circle',
      label: mode.isMulti && !mode.isBot ? (s.groupInfo || 'Group info') : (s.chatInfo || 'Chat info'),
      onClick: infoTap,
    });

    const tb = createTopbar({
      variant: 'chat',
      identity: {
        // channel-as-title: the channel name is the header label in bot mode; the
        // bot name/address drops to the sub-line so the identity stays visible.
        // #211: a nameless identity shows its address MIDDLE-TRUNCATED, never in full.
        name: botChannels ? ('# ' + (channelState.name || '')) : identityTitle(),
        sub: topbarSubText(botChannels),   // M16 connectivity override lives inside
        address: identity.address || identity.name || '',
        online: botChannels ? false : identity.online,
        avatar: identity.avatar || null,
        // N1 (#364): group/bot chats wear the group-glyph avatar. setChatMode
        // triggers renderTopbar, so the glyph lands with the mode push.
        group: !!mode.isMulti,
      },
      // Header tap. bot channels → open the channel selector (title = affordance).
      // #248: everything else routes like the info icon — 1:1 AND groups go to the
      // shell-side surface (ixian:details); plain bots keep the in-chat takeover.
      onIdentity: botChannels ? () => openChannelSelector() : infoTap,
      onBack: () => bridge.send('ixian:back'),
      /* A3 (#302): the unread-elsewhere state has to ride the BACK LABEL, not a
         nested badge element. createButton puts backLabel on the button's
         aria-label (button.js:43), and an aria-label overrides nested content —
         a badge <span> inside would be announced to nobody. Count-free wording
         deliberately: see the dot rationale at setUnreadIndicator. */
      backLabel: (s.back || 'Back') + (unreadElsewhere ? ', ' + (s.unreadElsewhere || 'Unread messages') : ''),
      actions,
    });

    // Inject the chevron (and an any-channel-unread dot) into the title so the
    // channel-as-title reads as a dropdown affordance. Done here (not in the
    // shared c-topbar component) to keep the component generic.
    if (botChannels) {
      tb.classList.add('is-bot-channels');
      const nameEl = tb.querySelector('.c-topbar__name');
      if (nameEl && window.SpixiIcons && window.SpixiIcons.icon) {
        if (channelState.unread) {
          const dot = document.createElement('span');
          dot.className = 'chat-channel-unread-dot';
          dot.setAttribute('aria-hidden', 'true');
          nameEl.append(dot);
        }
        const chev = window.SpixiIcons.icon('chevron-down', { size: 18 });
        chev.classList.add('chat-channel-chev');
        nameEl.append(chev);
      }
    }
    // Avatar flash guard (Damir F5): the synchronous first paint runs BEFORE C# pushes
    // onChatScreenReady/setAvatar, so identity has no address yet and createAvatar would
    // paint a default gradient that then swaps to the real avatar. Hide the avatar until
    // the identity lands (address known) — the slot reserves space, then the real avatar
    // (or the correct address-gradient) appears once, with no wrong-colour flash.
    if (!identity.address) tb.classList.add('is-avatar-pending');
    /* ★ N19 (#428): the connecting line rides the BAR, and this rebuild happens on
       six triggers (setNickname, setOnlineStatus, setAvatar, setChatMode, channel
       select, the rAF coalescer). Applied HERE, from state, for the same reason the
       unread dot below is: a one-shot poke from the showWarning handler would
       evaporate on the next presence tick — the #188 typing-pill lesson. */
    if (connectivitySub) tb.setAttribute('data-connecting-bar', '');
    /* A3 (#302): unread-elsewhere dot on the back button. Applied HERE, inside the
       render, because renderTopbarNow rebuilds the whole topbar (textContent=''
       at :582) on six different triggers — setNickname, setOnlineStatus, setAvatar,
       setChatMode, channel select and the rAF coalescer — so a one-shot DOM poke
       from the handler would evaporate on the next one.
       Mobile/single-pane only: on desktop the chats list is visible beside the
       conversation and already carries the unread state. */
    if (unreadElsewhere && !document.documentElement.hasAttribute('data-desktop')) {
      const backBtn = tb.querySelector('.c-button');
      if (backBtn) backBtn.dataset.unreadDot = '';
    }
    topbarHost.append(tb);
    // channel row-select coalesces a topbar rebuild; land focus on the NEW title
    // (the old trigger is detached by textContent='' above → would drop to body).
    if (focusTitleAfterRender && botChannels) {
      focusTitleAfterRender = false;
      const wrap = tb.querySelector('.c-topbar__identity-wrap');
      if (wrap) wrap.focus({ preventScroll: true });
    }
  }
  // Coalesce topbar rebuilds too: on open C# fires setNickname + setOnlineStatus
  // (+ onChatScreenReady) in quick succession, each tearing down + rebuilding the
  // header — same flicker class as the log. Batch to one frame.
  let topbarQueued = false;
  function renderTopbar() {
    if (topbarQueued) return;
    topbarQueued = true;
    requestAnimationFrame(() => { topbarQueued = false; renderTopbarNow(); });
  }
  renderTopbarNow();  // synchronous first paint

  /* connectivity banner (#59) — mounts directly under the top bar; showWarning
   * opens/updates it, empty text collapses it (bridge showWarning, xaml:1746). */
  const warningBanner = createWarningBanner({ strings: window.SL || {} });
  topbarHost.after(warningBanner);

  /* —— bot channel selector (Damir F5 2026-07-08: bot chats support channels) ——
   * Bots (mode.type 3) can host multiple channels. C# drives it (legacy chat.js):
   *   setSelectedChannel(index, icon, name)          → current channel; reveals the
   *                                                     bar (chat.js:250)
   *   addChannelToSelector(index, name, icon, unread) → one channel row, pushed
   *       ONLY in response to ixian:populateChannelSelector (pull-on-open,
   *       chat.js:1338/1353) — so the list is empty until the bar is tapped
   *   setChannelSelectorStatus(status)               → any-channel-unread flag
   *       ("true" = all read, else unread — chat.js:1345)
   * Tapping a row emits ixian:selectChannel:<index> (chat.js:1319; C# switches +
   * reloads the messages + echoes setSelectedChannel). The selector shows ONLY for
   * bots, once C# has named a channel — non-bot chats are untouched. State is
   * declared above (needed by the first topbar paint). */
  function makeChannelRow(ch) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chat-channel-list__item';
    if (ch.index === channelState.index) b.dataset.selected = '';
    const name = document.createElement('span');
    name.className = 'chat-channel-list__name';
    name.textContent = '# ' + (ch.name || '');
    b.append(name);
    if (ch.unread) {
      const dot = document.createElement('span');
      dot.className = 'chat-channel-list__unread';
      dot.setAttribute('aria-hidden', 'true');
      b.append(dot);
    }
    b.addEventListener('click', () => {
      // optimistic selection; C# echoes setSelectedChannel + reloads the messages
      channelState.index = ch.index;
      channelState.name = ch.name;
      channelState.icon = ch.icon || channelState.icon;
      channelState.unread = false;
      focusTitleAfterRender = true;   // land focus on the rebuilt title (review MINOR-2)
      renderTopbar();                 // channel name lives in the title now
      bridge.send('ixian:selectChannel:' + ch.index);
      closeChannelSelector();
    });
    return b;
  }

  /* Channel selector — a top-anchored panel that slides DOWN from directly under
   * the topbar (Option A, Damir F5 2026-07-08). Opened by tapping the topbar
   * title; NOT a bottom sheet. Scrim + Esc close it. */
  /* focusables inside the open dropdown panel (rows arrive async) — mirrors overlay.js */
  function channelFocusables() {
    if (!channelDropdown) return [];
    const p = channelDropdown.querySelector('.chat-channel-panel');
    if (!p) return [];
    return [...p.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => !el.disabled && !el.hidden);
  }

  function closeChannelSelector() {
    if (channelKeydown) { document.removeEventListener('keydown', channelKeydown); channelKeydown = null; }
    if (channelFocusin) { document.removeEventListener('focusin', channelFocusin); channelFocusin = null; }
    if (!channelDropdown) return;
    const el = channelDropdown;
    channelDropdown = null;
    channelSheetBody = null;
    syncChatOverlay();   // N51: the selector is NOT on the shared stack — mirror its close to C#
    // restore focus to the title trigger — only if focus is ours to move (still
    // inside the closing overlay or dropped to body), matching overlay.js policy.
    const rf = channelReturnFocus; channelReturnFocus = null;
    const active = document.activeElement;
    if (rf && rf.isConnected && typeof rf.focus === 'function' &&
        (el.contains(active) || active === document.body)) {
      rf.focus({ preventScroll: true });
    }
    el.classList.remove('is-open');
    el.style.pointerEvents = 'none';   // exiting overlay: stale scrim must not catch clicks (review NIT)
    // let the slide-up finish before detaching (reduced-motion → transition:none,
    // transitionend still fires); safety timer covers the no-transition case
    let removed = false;
    const done = () => { if (removed) return; removed = true; el.remove(); };
    el.querySelector('.chat-channel-panel').addEventListener('transitionend', done, { once: true });
    setTimeout(done, 260);
  }

  function openChannelSelector() {
    if (!mode.isBot) return;
    // Q9: title tap TOGGLES — a second tap while the selector is open closes it
    // (was: tore down + immediately re-opened, re-firing populateChannelSelector).
    // closeChannelSelector() runs its normal focus-restore path (#205): with the
    // pointer tap having landed focus on the title trigger the restore is a no-op
    // by policy; a trapped-focus (keyboard) close restores to the stored trigger.
    if (channelDropdown) { closeChannelSelector(); return; }
    channelReturnFocus = document.activeElement;   // the topbar title trigger
    const s = window.SL || {};
    channelList = [];

    const overlay = document.createElement('div');
