<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The in-page appearance switch below re-sets the same value. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Account</title>
<style>
  /* Paint the screen surface IMMEDIATELY (keyed off the head-top data-theme, so
     there's no light<->dark flip while tokens.css + the ~1MB bundle load). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
  /* Splash boot moment (Batch B, #256 ⑭) — home.html grammar: pulsing brand
     logo over the instant-bg for the bundle-parse gap, dropped at window load. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #f9fafb; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  html[data-theme="dark"] .app-boot { background: #13171b; }
  .app-boot__logo { width: 64px; height: 64px; color: var(--icon-accent, #1892ce); animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-action-default); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and

<style data-src="../styles/components/avatar.css">

.c-avatar[data-hue="6"]  { --av-c1: hsl(190, 62%, 35%); --av-c2: hsl(215, 58%, 25%); }
.c-avatar[data-hue="7"]  { --av-c1: hsl(215, 62%, 50%); --av-c2: hsl(240, 58%, 40%); }
.c-avatar[data-hue="8"]  { --av-c1: hsl(245, 62%, 58%); --av-c2: hsl(270, 58%, 48%); }
.c-avatar[data-hue="9"]  { --av-c1: hsl(275, 62%, 55%); --av-c2: hsl(300, 58%, 45%); }
.c-avatar[data-hue="10"] { --av-c1: hsl(305, 62%, 47%); --av-c2: hsl(330, 58%, 37%); }
.c-avatar[data-hue="11"] { --av-c1: hsl(335, 62%, 51%); --av-c2: hsl(0, 58%, 41%);   }

.c-avatar {

  display: inline-flex;
  align-items: center;
  justify-content: center;

/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }

/* —— bottom sheet (z-40, above its scrim by source order) —— */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
}

.c-modal__actions {
  display: flex;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②) */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 260px; }
:root[data-desktop] [data-dt-ctx-source] { background: var(--surface-interactive-selected); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

</style><!-- c-sheet (theme/language) + c-modal (danger confirm) -->

/* —— rows: disc · label · value · chevron —— */
.c-settings__row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-8);
  min-height: 52px;                 /* sanctioned: 44 target + disc breathing room */
  padding: var(--spacing-4) var(--spacing-8);
  border: 0;
  background: transparent;
  border-radius: var(--radius-12);
  cursor: pointer;
  text-align: start;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  /* A5 (#348): background-size carries the centre-out press fill's CLOSE (base.css).
     background-color stays at its intentional 100ms micro duration. */
  transition: background-color var(--duration-100) var(--easing-standard),
              background-size 220ms var(--easing-accelerate, ease-in);
  /* A5 (#348): the centre-out press fill. base.css only flips background-size while
     pressed — the IMAGE and its centred origin live HERE, in the same rule as the
     row's own `background`, so no state rule's `background` shorthand can wipe them
     out from under the sweep. Every state rule below sets background-COLOR for the
     same reason: a colour is all any of them ever meant to set. */
  background-image: linear-gradient(var(--surface-action-tonal-default), var(--surface-action-tonal-default));
  background-repeat: no-repeat;
  background-position: center;
  background-size: 0% 100%;
}
.c-settings__row--static { cursor: default; }
@media (hover: hover) and (pointer: fine) {
  .c-settings__row:not(.c-settings__row--static):hover { background-color: var(--surface-interactive-hover); }
}
  /* ★ A5 (#348) review r2: :active drives the SAME centre-out fill. It used to paint
     the identical colour flat across the whole row, and :active lands together with
     data-pressed on every Chromium engine — so the flat tint covered the sweep and the
     press still read exactly as the flicker Damir asked us to remove. */
.c-settings__row:not(.c-settings__row--static):active { background-size: 100% 100%; }
.c-settings__row-label {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-width: 0;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
}
.c-settings__row-value {
  margin-inline-start: auto;
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-md);
  flex: none;
}
.c-settings__row > svg:last-child { color: var(--icon-neutral-02); flex: none; }

/* tinted icon disc: PROMOTED to base.css as .c-disc (#148 — shared with
   chat-info/contact for one consistent treatment) */

/* stacked (two-line) rows — backup nudge, quiet danger rows */
.c-settings__row-label--stack {
  flex-direction: column;
  align-items: flex-start;
  /* N59 → N59b (Damir screenshot, 2026-08-17): the disc now centres against the
     title+sub GROUP, not against the title line alone. The first cut pulled the
     sub up under a title that stayed centred in the 32px disc box — the text
     block read bottom-weighted ("dragging down, uncentered"). The disc leaves
     the flow (absolute, centred on the whole label); the stack carries the
     gutter; the sub needs no pull-up — the dead space is gone at the source. */
  position: relative;
  padding-inline-start: calc(32px + var(--spacing-12));
  gap: 0;
  flex: 1;
}
.c-settings__row-label--stack .c-disc {
  position: absolute;
  inset-inline-start: 0;
  top: 50%;
  transform: translateY(-50%);
}
.c-settings__row-top {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
}
.c-settings__row-sub,
.c-settings__backup-sub {

  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);

  content: '';

  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);

  transition: transform var(--duration-200) var(--easing-standard);
}

  transform: translateX(20px);
}

/* —— theme sheet: VISUAL PREVIEW TILES (#147) —— */
.c-settings__themes {

}
.c-settings__theme {
  flex: 1;

/* the mini screen — FIXED paints (a preview shows its OWN mode, --surface-qr precedent) */

<style data-src="../styles/components/bottomnav.css">
/* c-bottomnav — mirrors Figma nav-bot / nav-item (selected = "super selected":
   tonal pill around stacked icon + label). Height: --layout-bar-bottom. */

.c-bottomnav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  /* iOS edge-to-edge (iOS-1/3/4): the bar owns the home-indicator region — surface
     paints under it, items stay above (border-box height grows by the inset).
     env() = 0 on Windows/desktop/Android; the --rail desktop variant overrides
     height anyway and env() is 0 there. */
  height: calc(var(--layout-bar-bottom) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-bottombar);
  border-top: var(--outline-width-1) solid var(--outline-neutral-01);
  position: sticky;
  bottom: 0;
  z-index: var(--z-20);
}

.c-bottomnav__item {
  flex: 1 1 0; /* equal widths — selected pill is identical for every item */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-2);
  padding: var(--spacing-4) var(--spacing-8);
  max-width: 96px;
  border: 0;
  border-radius: var(--radius-full);
  background: transparent;
  cursor: pointer;
  color: var(--icon-neutral-01);
  -webkit-tap-highlight-color: transparent;
  min-width: var(--size-target-min);
  min-height: var(--size-target-min);
  justify-content: center;
  position: relative;
  /* select/deselect ink fade (durations zero out under prefers-reduced-motion
     via token override); the pill itself lives on ::before below.
     background-color + transform = the #343 press release, declared here rather
     than in base.css: a base.css rule strong enough to win replaces this shorthand
     and the ink fade dies while the ::before pill keeps animating (#346). */
  transition: color var(--duration-200) var(--easing-standard),
              background-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* tonal pill = ::before layer so it can grow in / shrink out under the content */
.c-bottomnav__item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: var(--radius-full);
  background: var(--surface-action-tonal-default);
  opacity: 0;
  transform: scale(0.85);
  transition:
    opacity var(--duration-200) var(--easing-standard),
    transform var(--duration-200) var(--easing-decelerate);
}
.c-bottomnav__item[aria-current] { color: var(--icon-action-default); }
.c-bottomnav__item[aria-current]::before {
  opacity: 1;
  transform: scale(1);
}
/* hover guarded so touch devices don't get sticky hover (matches chatlist-item) */
@media (hover: hover) and (pointer: fine) {
  .c-bottomnav__item:hover { background: var(--surface-interactive-hover); }
  .c-bottomnav__item[aria-current]:hover { background: transparent; }
  .c-bottomnav__item[aria-current]:hover::before { background: var(--surface-action-tonal-hover); }
}
.c-bottomnav__item:active { background: var(--surface-interactive-pressed); }
.c-bottomnav__item[aria-current]:active { background: transparent; }
.c-bottomnav__item[aria-current]:active::before { background: var(--surface-action-tonal-pressed); }

.c-bottomnav__iconwrap { position: relative; display: flex; }

/* icon crossfade: outline rests in flow; -filled twin overlays and pops in on
   select (fade + scale, decelerate). Items without a -filled export just keep
   the outline glyph — ink transition still marks the state. */
.c-bottomnav__icon {
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-bottomnav__item[aria-current] [data-dual] .c-bottomnav__icon { opacity: 0; }

.c-bottomnav__icon--filled {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transform: scale(0.7);
  transition:
    opacity var(--duration-200) var(--easing-standard),
    transform var(--duration-200) var(--easing-decelerate);
}
.c-bottomnav__item[aria-current] .c-bottomnav__icon--filled {
  opacity: 1;
  transform: scale(1);
}

.c-bottomnav__label {
  font-size: var(--font-size-label-xs);
  line-height: var(--line-height-label-xs);
  letter-spacing: var(--tracking-label-xs);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
  position: relative; /* paint above the ::before pill (iconwrap is already positioned) */
  /* font-weight animates on variable fonts (ours are); older WebViews snap — acceptable
     degrade. Animating weight re-runs layout per frame — accepted cost per audit review
     (4 items, 200ms, mobile scale) */
  transition:
    color var(--duration-200) var(--easing-standard),
    font-weight var(--duration-200) var(--easing-standard);

.c-bottomnav__item[aria-current] .c-bottomnav__label {
  color: var(--text-action-default);
  font-weight: var(--font-weight-bold);

/* unread indicator (Figma "indicator") — sits on the icon corner.
   18px badge + item max-width: 96px are magic values pending size/* tokens at next Figma sync.
   Error role, NOT action (#48): action-blue vanished against the selected tonal pill +
   filled icon (same hue family); error reads on every nav surface = badge convention.
   Ring = bar surface via box-shadow (no layout shift), separates badge from pill/icon. */
.c-bottomnav__badge {
  position: absolute;
  top: -6px;
  right: -10px;
  min-width: 18px;
  height: 18px;

  border-radius: var(--radius-full);

/* ————————————————————————————————————————————————————————————————————————
   RAIL VARIANT (desktop-split-spec §6e.1, DECISIONS #232 ④) — the same nav
   turned into a LEFT column on desktop shells (`createBottomNav({variant:
   'rail'})`). Dials = the demo's consolidated round-4 state (spec §6c ①/§6d
   ③⑭): 84px column · gap 32 · quieter resting ink · 22px icons · pill = the
   whole item at radius-12, gentle scale-in · crossfade fades IN PLACE.
   Additive — the mobile base above is untouched; free-fn API unaffected.
   NOT a viewport query: the shell opts in per-platform (:root[data-desktop]
   is constant across resize, #227/#228). */
.c-bottomnav--rail {
  flex-direction: column;
  justify-content: flex-start;
  height: 100%;
  width: var(--layout-rail-width);   /* Damir F5 r2: 84 compressed the pane at min-width — TG-class 72.
                                        W2: tokenized — the shells inset their full-viewport covers by
                                        the SAME value so the rail is never covered (tokens.css §layout) */
  gap: var(--spacing-24);       /* r2: tighter with the logo on top (was 32) */
  padding-block: var(--spacing-16);
  padding-inline: var(--spacing-4);
  border-top: 0;
  /* r3 (Damir): rail↔pane hairline matches the pane↔pane divider (neutral/03) */
  border-inline-end: var(--outline-width-1) solid var(--outline-neutral-03);
  position: static;             /* a side column doesn't stick to the bottom */
}
/* brand mark pinned at the rail top (desktop; Damir F5 r2 — the topbar shows a
   plain screen title instead). Decorative: aria-hidden, not a button. */
.c-bottomnav__logo {
  display: flex;
  justify-content: center;
  color: var(--icon-accent);
  padding-block: var(--spacing-4) var(--spacing-8);
}
/* items size to content and stack from the top (the horizontal flex:1
   equal-width would become equal-HEIGHT stretching in a column) */
.c-bottomnav--rail .c-bottomnav__item {
  flex: none;
  width: 100%;
  max-width: none;
  padding-block: var(--spacing-8);
  color: var(--icon-neutral-02);            /* quieter resting ink (§6c ①) */
}
.c-bottomnav--rail .c-bottomnav__label { color: var(--text-neutral-02); }
.c-bottomnav--rail .c-bottomnav__icon,
.c-bottomnav--rail .c-bottomnav__icon--filled { width: 22px; height: 22px; }
/* selected pill = the WHOLE item (round 4): rounded rect, gentle scale-in */
.c-bottomnav--rail .c-bottomnav__item::before {
  border-radius: var(--radius-12);
  transform: scale(0.9);
}
.c-bottomnav--rail .c-bottomnav__item[aria-current]::before { transform: scale(1); }
/* selected ICON ink — must re-assert over the rail's quieter resting ink: the
   base [aria-current] rule ties with it on specificity (0,2,0) and the rail
   section comes LATER in the file, so without this the selected glyph rendered
   GREY (Damir F5 r3). The selected label already wins via the base (0,3,0) rule. */
.c-bottomnav--rail .c-bottomnav__item[aria-current] { color: var(--icon-action-default); }
/* hover rides the PILL layer, not the item background (§6c ①) */
@media (hover: hover) and (pointer: fine) {
  .c-bottomnav--rail .c-bottomnav__item:hover { background: transparent; }
  .c-bottomnav--rail .c-bottomnav__item:not([aria-current]):hover::before {
    opacity: 1;
    transform: scale(1);
    background: var(--surface-interactive-hover);
  }
}
.c-bottomnav--rail .c-bottomnav__item:active { background: transparent; }
.c-bottomnav--rail .c-bottomnav__item:not([aria-current]):active::before {
  opacity: 1;
  transform: scale(1);
  background: var(--surface-interactive-pressed);

.c-bottomnav--rail .c-bottomnav__item[aria-current] .c-bottomnav__icon--filled { transform: none; }

<style>
  /* Production shell: fill the WebView. Internal views (hub = root · danger /
     about / how-to = takeovers) swap client-side inside #settings-root.
     PEER-TAB CHROME: a c-bottomnav (Account active) is added so Account READS as
     a home tab (Damir). SettingsPage is still a standalone PUSHED page (settings
     data is pushed by SettingsPage, not HomePage), so this is an approximation —
     non-Account taps do a best-effort ixian:back (pop to home). Precise-tab
     landing + true in-home integration need BE (be-cutover S11). */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #settings-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #settings-root > * { flex: 1; min-height: 0; }
  #settings-nav { flex: none; }
  /* Desktop (Damir F5 r2, mirrors home.html): the peer-tab nav renders as the
     LEFT RAIL (c-bottomnav--rail variant), first in the row. Mobile untouched. */
  :root[data-desktop] body { flex-direction: row; }
  :root[data-desktop] #settings-nav { order: -1; display: flex; }
  /* #334 iOS-59: SUB-screens are hub-only surfaces — hide the peer-tab bottom
     nav while a sublevel is open (its back affordance owns the exit). Desktop
     full-window keeps the RAIL: it is the sole exit there (#237, no topbar back). */
  :root:not([data-desktop]) body[data-subview] #settings-nav { display: none; }

  /* —— Account as a PEER PANE (unit 2 #240 · #243 sublevels · #245 placement,
     Damir: "same peer as wallet/apps/chats, NOT a distant pane"): C# pins this
     WebView over the home grid MINUS the rail strip (stage margin — the home
     rail stays visible + live beside us), so the peer-tab chrome here is
     dropped. Inside: the HUB renders in the LIST-column slot (width pushed via
     setPaneMetrics → --sd-master-w, aligned with the native chats column +
     hairline where the pane divider sits) and rows open SUBLEVELS in the
     DETAIL region — the desktop demo layout verbatim. Sublevel content keeps
     the demo grammar (§6d ⑬⑭): 640px cap centered, sheet padding on lifted
     pickers, hugging CTAs. Mobile (no data-pane) is untouched. */
  body[data-pane] #settings-nav { display: none; }
  /* #242 specificity: the desktop rail rule `:root[data-desktop] #settings-nav`
     (1,2,0) BEAT a plain (1,1,1) hide — the pane must always out-rank it. */
  :root[data-desktop] body[data-pane] #settings-nav { display: none; }
  body[data-pane] #settings-root { flex-direction: row; }
  body[data-pane] #settings-root > .sd-master {
    /* N5 (341-next C1, narrow-desktop clip): --sd-master-w is pushed ONCE by C#
       (setPaneMetrics) and keeps a STALE pixel width when the window narrows —
       the fixed basis then starved the detail region and clipped the danger
       cards. Clamp it: the detail region keeps >=320px (the #247 pane minimum);
       208px floor = the native 280px left-pane minimum minus the 72px rail. */
    flex: 0 0 clamp(208px, var(--sd-master-w, 328px), calc(100% - 320px));
    display: flex; flex-direction: column; min-height: 0;
    border-inline-end: 1px solid var(--outline-neutral-03);
  }
  body[data-pane] #settings-root > .sd-detail {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
  }
  body[data-pane] .sd-master > * { flex: 1; min-height: 0; }
  /* #245b (Damir): sublevel TITLE BAR spans the full detail width; only the
     CONTENT below it locks at the demo cap (640px, centered). The screen
     element itself is full-width; every non-topbar child gets the cap. */
  body[data-pane] .sd-detail > * { flex: 1; min-height: 0; width: 100%; }
  body[data-pane] .sd-detail > :not(.sd-empty) > :not(.c-topbar) { width: 100%; max-width: 640px; margin-inline: auto; }
  /* selected hub row while its sublevel is open (#33 desktop selection, #194 tint) */

     silently reset the fill image and the selected hub row had no press feedback. */
  body[data-pane] .c-settings__row[aria-current="true"] { background-color: var(--surface-action-tonal-default); }
  body[data-pane] .c-settings__themes { padding: var(--spacing-16); }
  body[data-pane] .c-settings__opts { padding: var(--spacing-16); }
  body[data-pane] .c-settings-backup__hero > .c-settings-backup__cta { width: auto; min-width: 240px; margin-inline: auto; }
  body[data-pane] .c-settings-backup__adv-box .c-button { width: auto; }
  /* detail empty state (dt-empty grammar, desktop demo §3) */
  .sd-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--spacing-12); color: var(--text-neutral-02); text-align: center; padding: var(--spacing-24);
  }

  // #228 platform flag (set pre-paint, constant): desktop swaps the peer-tab
  // bottom bar for the LEFT RAIL + drops the topbar back (rail = the exit).
  const isDesktop = document.documentElement.hasAttribute('data-desktop');
  /* PANE MODE (#240 → #243 → #245): C# pushes setPaneMode('1') in onLoad when
   * HomePage hosts this page as the Account PEER PANE (wide window — the stage
   * spans the grid minus the home rail strip, so the rail stays visible+live
   * beside us). Display-only: the shell hides its own peer chrome, renders the
   * HUB in the list-column slot (setPaneMetrics width) and opens Theme/Language/
   * Backup/etc as SUBLEVELS in the detail region — the desktop demo layout.
   * `?pane=1` = browser-preview forcing (the app never passes query strings). */
  let paneMode = new URLSearchParams(location.search).get('pane') === '1';
  if (paneMode) document.body.dataset.pane = '';
  /* #242 (Damir F5 issue 3): X1 turned the post-picker loadAvatar push into a
   * DATA URI, so the old /avatar-tmp/ path sniff never marked a fresh pick dirty
   * → changing ONLY the photo never showed Save. Track the pick explicitly: set
   * on ixian:avatar, consumed by the NEXT loadAvatar push, cleared on remove. */
  let avatarPickPending = false;
  // W2 (#348): last app-lock value C# confirmed. undefined until the boot push.
  let lockSaved;
  /* ★ NOTIF-2: C# sends bools as bool.ToString(), i.e. the CAPITALISED "True"/"False"
     (setLockEnabled has parsed them this way since #348). Accepts the lower-case and
     real-boolean forms too so a future caller cannot silently read every value as false
     — the failure mode that would look exactly like "the toggle does nothing". */
  function boolPush(v) { return (v === 'True' || v === 'true' || v === true || v === '1'); }
  // Q1-② (#267): the mounted Downloads sublevel (pane-only; null otherwise).
  // clearFiles/addFile bursts land on whichever instance is current.
  let downloadsEl = null;
  let dlBuf = null, dlTimer = 0;
  function dlSettle() {
    clearTimeout(dlTimer);
    dlTimer = setTimeout(() => {
      dlTimer = 0;
      // Q1 review (#267 loop): the burst can settle AFTER the user left the
      // sublevel (a late C# push, or a push that raced the leave) — renderLayout
      // has already replaced the children, so downloadsEl is DETACHED. Painting
      // into it is a no-op that only retains a dead node; bail and release.
      if (!downloadsEl || !downloadsEl.isConnected) { downloadsEl = null; dlBuf = null; return; }
      if (dlBuf !== null) { setDownloads(downloadsEl, dlBuf); dlBuf = null; }
    }, 80);
  }
  /* Q1 review (#267 loop): leaving the Downloads sublevel RELEASES it. renderLayout
   * replaces the detail/root children, so a retained downloadsEl is a detached node
   * plus a pending settle timer for a screen the user is no longer on. Called on
   * every render that isn't 'downloads' (incl. showHub); re-entry is IDENTICAL —
   * buildScreen('downloads') re-assigns downloadsEl and re-emits ixian:loadDownloads,
   * whose clearFiles re-seeds the buffer. No verb changes. */
  function releaseDownloads() {
    clearTimeout(dlTimer); dlTimer = 0;
    downloadsEl = null; dlBuf = null;
  }
  /* Same contract for Chat appearance (#46 audit): its live preview owns a
   * requestAnimationFrame loop, a ResizeObserver and a document listener (the
   * W5 "Live flow" engine). renderLayout() replaces the screen's children, so
   * an unreleased screen leaks a loop per visit — and in pane mode setLocale /
   * setPaneMode / onRepresented re-render while the user is still ON the
   * screen, so they would stack without any navigation at all. */
  let appearanceEl = null;
  function releaseChatAppearance() {
    if (appearanceEl && appearanceEl.release) appearanceEl.release();
    appearanceEl = null;
  }
  /* #341: same contract for the in-pane Change-password sublevel, and here it is
   * a SECURITY requirement, not only a leak guard. The screen holds three plaintext
   * password values in live inputs. This document is long-lived and PARKED on close
   * (#315), so a detached screen would keep them for the life of the process.
   * release() scrubs the values, re-masks the reveal state and drops the window
   * `pagehide` listener. Called on every render that is not 'encpass' (incl.
   * showHub), and by the in-flight guard below. */
  let encpassEl = null;
  let encpassCtrl = null;                        // live lockCtrl while C# validates
  let encpassGuard = 0;                          // watchdog timer id
  let encpassSeq = 0;                            // correlates a submit with its answer
  function releaseEncpass() {
    if (encpassEl && encpassEl.release) encpassEl.release();
    encpassEl = null;
    encpassCtrl = null;                          // a late result must not touch a dead screen
    // #341 audit MINOR-1: drop the watchdog too (releaseDownloads precedent). Left
    // running it fires ctrl.fail() on a DETACHED screen up to 8 s later, which
    // re-enables dead inputs and calls focus() on a node nobody can see.
    clearTimeout(encpassGuard); encpassGuard = 0;
    // #341 audit MINOR-2: invalidate the in-flight submit. Without this, "submit,
    // leave, come back, submit again" lets the FIRST answer resolve the SECOND
    // form — a stale "Password changed" over a request whose outcome is unknown.
    encpassSeq += 1;
  }
  let strings = window.SL || {};   // #334 iOS-58: `let` — setLocale swaps the dict LIVE (closures read the variable)
  // Version: setVersion push (S4, SettingsPage.onLoad mirrors LaunchPage:33);
  // SPIXI_ENV seeds it if the generation step injects one.
  let appVersion = (window.SPIXI_ENV && window.SPIXI_ENV.version) || '';

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  /* #343: ONE call lights up press feedback for every pressable surface in this
     shell (src/components/pressable.js). Delegated on document, so rows created
     later by a re-render are covered without re-attaching. A new shell needs
     exactly this line. */
  attachPressFeedback();
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const root = document.getElementById('settings-root');

  /* —— account state — flushed by SettingsPage.onLoad after ixian:onload ————————
   * SettingsPage pushes: setNickname · setAppearance · setLockEnabled ·
   * showRemoveAvatar(conditional) · loadAvatar · setVersion (S4) · setAddress (S1) ·
   * setLanguage (S3). It does NOT push backup status — that row degrades (BE gap S2). */
  const state = {
    name: '', savedName: '',
    address: '',                 // S1: setAddress push → QR/address block
    theme: 0,                    // ThemeAppearance: 0 automatic · 1 light · 2 dark (ThemeManager.cs:9)
    lockEnabled: false,
    avatarSrc: null, hasCustomAvatar: false,
    language: 'en-us',           // setLanguage push (S3) overrides; default until it lands
    dirtyNick: false,            // nick edited since last save → persist on exit (ixian:save pops, §2)
    dirtyAvatar: false,          // avatar-tmp picked → needs promotion on exit (applyAvatar)
    // r3 (Damir F5: "lock toggle doesn't persist"): ixian:lock:on|off only flips
    // SettingsPage's in-memory field — Preferences.Set("lockenabled") happens ONLY
    // in onSaveSettings (:249). So a lock toggle is DIRTY: Save appears and any
    // exit routes through ixian:save (theme/language persist immediately C#-side,
    // which is why only lock was lost).
    dirtyLock: false,
    /* ★ NOTIF-2 (Damir's 2026-08-21 block): the global notification switches. Pushed by
       SettingsPage.onLoad (setNotifEnabled / setNotifSenderName / setNotifSounds) and
       echoed back after every write, so these are display state only — C#'s Preferences
       are authoritative and nothing here is persisted locally.
       Defaults match the C# defaults exactly, so the first paint cannot flicker: sender
       name OFF is today's shipped notification copy, byte for byte. */
    notifEnabled: true,
    notifSenderName: false,
    notifSounds: true,
  };

  /* Legacy lang-data codes (settings.html:69-81) — MUST match SpixiLocalization
   * .loadLanguage(), so use these exact codes, NOT the demo's variants. FE ships
   * the list at build time (BE gap §8-4). Flags are emoji stand-ins (SVG later).
   *
   * A4 (Damir, Batch A interview): a locale is HIDDEN until translated — the
   * app ships its legacy lang file, but if the redesigned shells have no
   * dictionary for it (build-locales.mjs LANGS), picking it silently rendered
   * English shell copy over a translated C# layer (a half-translated app).
   * N4 (#379): the #360 residual five (it/id/lt/cn/ja) shipped dictionaries →
   * their #258 languagePending rows are REAL rows now. PENDING_LANGS below is
   * empty but the guard grammar stays for any future pre-dictionary code. */
  const LANGS = [
    { code: 'en-us', label: 'English', flag: '🇺🇸' },
    { code: 'es-co', label: 'Español', flag: '🇨🇴' },
    { code: 'de-de', label: 'Deutsch', flag: '🇩🇪' },
    { code: 'fr-fr', label: 'Français', flag: '🇫🇷' },
    { code: 'pt-br', label: 'Português (Brasil)', flag: '🇧🇷' },
    { code: 'ru-ru', label: 'Русский', flag: '🇷🇺' },
    { code: 'sl-si', label: 'Slovenščina', flag: '🇸🇮' },
    { code: 'sr-sp', label: 'Srpski', flag: '🇷🇸' },
    { code: 'it-it', label: 'Italiano', flag: '🇮🇹' },
    { code: 'id-id', label: 'Bahasa Indonesia', flag: '🇮🇩' },
    { code: 'lt-lt', label: 'Lietuvių', flag: '🇱🇹' },
    { code: 'cn-cn', label: '中文', flag: '🇨🇳' },
    { code: 'ja-jp', label: '日本語', flag: '🇯🇵' },
  ];

  /* —— A4 fallback row (hidden-locale REGRESSION guard) ————————————————————————
   * App.xaml.cs:100-107 — on FIRST RUN, with no `language` preference, Spixi
   * auto-detects CultureInfo.CurrentCulture and PERSISTS it if SpixiLocalization
   * ships that code. When a shipped code has NO row in LANGS the picker showed
   * NO selection, and tapping ANY visible row silently moved the user off their
   * OS language. So: when the CURRENT code isn't in LANGS, append ONE row for it
   * (endonym + flag) — it renders as the selected option and stays inert (the
   * component early-returns on a click whose value === current,
   * settings-shell.js:142). A hint line says the interface stays English until
   * its dictionary lands.
   * N4 (#379): the five pending rows (it/id/lt/cn/ja) GRADUATED into LANGS —
   * this list is empty, but the grammar stays as the guard for any future
   * legacy-code-without-dictionary state. (.NET reports zh-cn for Chinese OS
   * users; C# can't map it, so they land on en-us and pick 中文 manually —
   * the zh→cn map is a logged C# dial, #378.) */
  const PENDING_LANGS = [];
  const langIsHidden = (code) => !!code && !LANGS.some((l) => l.code === code);
  /* The list handed to the hub AND to every picker — LANGS, plus the current
   * code when it's a hidden one (unknown codes degrade to the raw code label). */
  function langList(code) {
    if (!langIsHidden(code)) return LANGS;
    return LANGS.concat([PENDING_LANGS.find((l) => l.code === code) || { code, label: code, flag: '' }]);
  }
  const langHint = (code) => (langIsHidden(code)
    ? (strings.languagePending
      || 'Your system language is set for Spixi, but this interface is still shown in English. Its translation is on the way.')
    : undefined);
  const langOptions = (code) => langList(code).map((l) => ({ value: l.code, label: l.label, flag: l.flag }));

  /* —— theme —————————————————————————————————————————————————————————————————
   * The redesign swaps the token theme via data-theme (no page reload needed),
   * but C# STILL reloads settings.html on ixian:appearance (SettingsPage:178) —
   * we apply locally for instant feedback; the reload re-pushes setAppearance. */
  // 'Auto' resolves to the C#-injected theme (the app's own resolution of the OS
  // scheme), captured before any applyTheme call and REFRESHED by setTheme — NOT to
  // this WebView's
  // matchMedia, whose prefers-color-scheme can disagree with the app theme
  // (Damir F5: Account rendered light while the whole app was dark).
  /* ★ N71 (#421) — this was `const bootTheme`, and making it MUTABLE is the whole
   * point. 'Auto' resolves to the app's own answer, captured at document boot. That
   * was safe only while an OS theme flip RELOADED the document: the constant was
   * re-captured with the new theme every time. The flip PUSHES now, so nothing
   * rebuilds this document — and a stale constant would quietly undo the push. The
   * exact failure: OS flips to dark → setTheme lands and the screen goes dark → any
   * later applyTheme(0) (a setAppearance re-push, a rebuild) snaps it back to the
   * boot value. That is ★ #410 — since full bleed, anything derived from "the
   * current surface" must be READ, not REMEMBERED — and it is why settings.html is
   * the one shell whose handler needs more than the shared body. */
  let autoTheme = document.documentElement.dataset.theme || '';
  function applyTheme(idx) {
    const r = document.documentElement;
    if (idx === 1) r.dataset.theme = 'light';
    else if (idx === 2) r.dataset.theme = 'dark';
    else r.dataset.theme = autoTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    // PERSIST the choice so EVERY other shell (same Resources/Raw/html origin)
    // adopts it at boot — the redesigned shells otherwise read only the OS scheme,
    // so a light/dark pick "stayed on Account" (Damir F5). idx 0 = auto → shells
    // fall back to the OS scheme. Written on the C# setAppearance push + on a pick.
    try { localStorage.setItem('spixi.appearance', String(idx)); } catch (e) {}
  }
  // Boot: the head-top script already resolved data-theme (C#-substituted theme
  // name when running in the app; localStorage/OS in the browser demo). The old
  // applyTheme(0) here forced the OS scheme AND clobbered the persisted pick with
  // '0' until C#'s setAppearance landed — a light-app/dark-OS boot flip. The C#
  // setAppearance push (onLoad) and user picks still applyTheme + persist below.

  /* —— chat appearance (6e.2 / #147 flag closing) — FE-ONLY prefs, no bridge.
   * Persisted to localStorage (same Resources/Raw/html origin); the CONSUMER is
   * chat.html, which reads both keys at boot and sets the root vars (nothing in
   * THIS document paints a chat canvas — the takeover preview self-sets its own
   * vars).
   * ★ N81 (#422): the stored pattern value is a LEVEL INDEX (0 Off / 1 Default /
   * 2 Strong), not an alpha. The alpha lives in the theme (--chat-pattern-alpha-N),
   * so this document does no derivation — the old "v × 0.36 for dark" line is gone
   * from here, from chat.html's pre-paint script and from applyPatternPrefs alike.
   * readPatternLevel migrates the legacy fractional values. */
  const CHAT_PREFS = { pattern: 'spixi.chat.pattern', textScale: 'spixi.chat.textscale', patternStyle: 'spixi.chat.patternstyle' };
  function readChatPrefs() {
    // B2 (#256): ONE key, PLATFORM-AWARE default when unset — desktop Off (0),
    // mobile Default (1). Mirrors chat.html's pre-paint boot read so the
    // Chat-appearance swatch pre-selects what the chat actually shows.
    const desktop = document.documentElement.hasAttribute('data-desktop');
    let pattern = desktop ? 0 : 1, textScale = 1;   // · scale M
    // W5: the STYLE default is line art (the pre-W5 look — an absent pref must
    // change nothing). 'flow' is desktop-only, so a stored 'flow' on mobile
    // reads back as line art, exactly what chat.html's pre-paint script applies.
    let patternStyle = 'triangles';   // ★ 2026-08-22: the new default style
    try {
      pattern = readPatternLevel(localStorage.getItem(CHAT_PREFS.pattern), pattern);   // ★ N81 (#422)
      const t = parseFloat(localStorage.getItem(CHAT_PREFS.textScale));
      if (!isNaN(t)) textScale = Math.min(1.5, Math.max(0.8, t));
      const st = localStorage.getItem(CHAT_PREFS.patternStyle);
      if (st === 'matrix' || st === 'lineart' || (st === 'flow' && desktop)) patternStyle = st;
    } catch (e) {}
    return { pattern, textScale, patternStyle };
  }

  /* —— exit — the ONLY persist path is ixian:save, which persists nick + promotes
   * avatar-tmp + broadcasts AND pops the page (SettingsPage.onSaveSettings:221).
   * So per-row edits to nickname/avatar are held locally and committed on exit;
   * everything else (theme/language/lock) rides its own immediate verb. Clean
   * exit (no local edits) = ixian:back (discards any stray avatar-tmp). Mirrors
   * legacy Save-vs-Back semantics with the frozen bridge. */
  // Single-fire exit latch. The topbar Save, the topbar/hardware Back and the peer
  // bottom-nav ALL terminate this page (C# pops on ixian:save AND ixian:back). Once
  // any of them fires, a second exit verb is suppressed AND pending hub rebuilds are
  // dropped (scheduleRebuild bails) — a stray second verb or an rAF rebuild landing
  // mid-pop was the flicker our code contributed on Save (#199). The empty-Apps
  // landing after the pop is a HomePage boot-tab problem (home agent), not ours.
  let exiting = false;
  // W2 (#348) review MAJOR-4: the OUTBOUND-verb latch. Distinct from `exiting`, which
  // only gates painting and self-heals. This one is one-shot for the document's life.
  let exitSent = false;
  /* ★ W2 (#348) — THE LATCH HAD NO RESET PATH ON DESKTOP, and it freezes the whole
     document, not just one control: `exiting` makes renderLayout bail (:577) and
     scheduleRebuild bail (:839), so nothing repaints and the last painted frame — a
     stale check icon included — stays on screen for good.
     The ONLY reset is onRepresented (:1345), and C# pushes that from the narrow-mode
     park/re-present path alone (SpixiContentPage:514, gated by HomePage:1502 `!wide`).
     Parking is documented narrow-only, so a PANE that latches and then survives has
     nothing to un-latch it.
     This is a self-heal, not a guess about which path leaves it alive: the latch
     exists to swallow a second exit verb while the page pops, and a pop takes well
     under this. If we are still here afterwards, the exit did not happen — so drop
     the latch and repaint.
     Pane only, deliberately. A PARKED page is supposed to stay latched: it is alive
     but hidden, and un-latching it would restart the #314 backup poll behind the
     user's back. Pane mode is desktop, parking is narrow — they never overlap. */
  let exitHeal = 0;
  const EXIT_HEAL_MS = 2500;
  /* ★ review MAJOR-4 reshaped this. The heal originally called renderLayout(), and
     renderLayout REBUILDS the current view — and buildScreen('downloads') is not inert,
     it emits `ixian:loadDownloads`. A pane sitting on the Downloads sublevel would have
     fired a fresh navigation out of a page that is mid-pop: exactly the class of stray
     verb the `exiting` latch was added for (#199).
     So the heal now unblocks RENDERING only, and the verb gate is a separate latch that
     never heals. `exiting` gates paints; `exitSent` gates outbound exit verbs. A second
     onExitRequest — HomePage fires it from four sites — is still swallowed. */
  function armExitHeal() {
    if (!paneMode) return;
    clearTimeout(exitHeal);
    exitHeal = setTimeout(() => {
      if (!exiting) return;
      /* ★ review r2 MAJOR-9: release the VERB gate too. Holding exitSent forever turned
         "frozen pane" into "usable pane you can never close" — HomePage's tab switch only
         asks (requestSettingsOverlayExit → onExitRequest) and waits for the shell to
         answer with ixian:back, so a pane that never answers again sits over every other
         tab for good, and auto-save has removed the back arrow that used to save the user.
         Re-emitting is safe HERE precisely because the first verb provably did nothing:
         2500 ms later this document is still alive, so no pop is in flight to disturb. */
      exiting = false;
      exitSent = false;
      rebuildQueued = false;
      syncSave();          // no renderLayout: the next real interaction repaints
    }, EXIT_HEAL_MS);
  }
  function exitSettings() {
    if (exitSent) return;          // the verb gate — never healed
    exitSent = true;
    exiting = true;
    armExitHeal();
    // #341 SECURITY: scrub the password sublevel HERE too. `exiting` makes
    // renderLayout bail, so the usual release path never runs on this route — and
    // this document is PARKED, not destroyed (#315), so unscrubbed fields would
    // survive in a live DOM until the next visit. Reached by a rail tab switch
    // (onExitRequest), the peer nav and hardware back.
    releaseEncpass();
    const dirty = state.dirtyNick || state.dirtyAvatar || state.dirtyLock;
    bridge.send(dirty ? 'ixian:save:' + state.name : 'ixian:back');
  }
  // Explicit Save (topbar check): persist + pop, exactly ONCE, with NO success morph —
  // the C# page pop IS the confirmation (a morph would flash before the teardown).
  function commitSave() {
    if (exiting) return;
    // S14 (BE, gated OFF until C# lands ixian:apply): save WITHOUT popping — persist
    // nick + promote avatar-tmp, STAY on the page, confirm with a topbar "Saved" morph
    // + toast (Damir 2026-07-08). Built + ready; bridge.cap('settingsApply') is false
    // today, so we fall through to the frozen-bridge persist-and-pop below.
    if (bridge.cap('settingsApply')) {
      bridge.send('ixian:apply:' + state.name);
      state.dirtyNick = false; state.dirtyAvatar = false; state.dirtyLock = false;
      if (hubEl && hubEl.showSaved) hubEl.showSaved();
      // let the "Saved" morph play, then the clean hub hides Save again
      setTimeout(syncSave, 1700);
      showToast({ text: strings.settingsSaved || 'Settings saved', tone: 'success', host: document.body, strings });
      return;
    }
    // frozen-bridge fallback: persist + pop, exactly once (the C# page pop = confirm).
    // #341 audit MAJOR-2: scrub the password sublevel BEFORE latching `exiting`. In the
    // pane the hub column stays live beside an open sublevel, so Save is reachable
    // while the form holds three plaintext passwords — and once `exiting` is true
    // renderLayout bails, so no later render can scrub them.
    releaseEncpass();
    exitSent = true;
    exiting = true;
    armExitHeal();                 // W2: same self-heal on the legacy persist-and-pop
    bridge.send('ixian:save:' + state.name);
  }

  /* —— views ——————————————————————————————————————————————————————————————————
   * Two presentations, ONE view state (#245):
   *   mobile takeover (no data-pane): the current view replaces #settings-root.
   *   peer pane (data-pane): hub = the LIST-column slot, sublevel = the DETAIL
   *     region ('hub' = detail empty; a sublevel's back EMPTIES the detail).
   * Screens are stateless builders. */
  /* #274: ixian:language makes C# RELOAD settings.html (SettingsPage:289 loadPage)
   * — in the pane the fresh boot landed on hub + EMPTY detail (Damir F5: a
   * language pick "resets the panel to the Account empty state"). Persist the
   * open picker across that ONE reload — same localStorage-handshake class as
   * #238 spixi.landtab (15s staleness guard, consumed on read). Only 'language'
   * is ever stashed/restored: it is the only verb left that reloads the page
   * (theme applies live since the flicker round, SettingsPage:318-327).
   * SECURITY (#254 premise): the stash is a VIEW NAME only — no user data. */
  const VIEW_RESUME_KEY = 'spixi.settings.view';
  function stashViewForReload() {
    try { localStorage.setItem(VIEW_RESUME_KEY, JSON.stringify({ v: currentView, t: Date.now() })); } catch (e) {}
  }
  function takeResumeView() {
    try {
      const raw = localStorage.getItem(VIEW_RESUME_KEY);
      if (!raw) return null;
      localStorage.removeItem(VIEW_RESUME_KEY);          // one-shot, always consumed
      const o = JSON.parse(raw);
      return (o && o.v === 'language' && o.t && Date.now() - o.t < 15000) ? o.v : null;
    } catch (e) { return null; }
  }
  /* iOS-19 (#283) — backup status via a LOCAL stamp. There is still no C#
   * backup-status push (S2), so the hub's Backup row showed "Action needed"
   * FOREVER, even right after a successful backup (Damir: "remove it or fix
   * it"). Interim zero-C# fix: stamp localStorage when a backup share is
   * fired — from the inline pane sublevel here AND from the standalone
   * settings_backup.html shell (same file:// localStorage origin). Honest
   * caveat (accepted): the stamp marks the share-sheet LAUNCH — a user who
   * cancels the share sheet still clears the nudge until S2 lands with the
   * real signal. The stamp carries a timestamp only (no addresses/content —
   * #254 storage-partition rule). dirtyCount stays 0 (unknowable FE-side). */
  const BACKUP_STAMP_KEY = 'spixi.backup.last';
  function stampBackup() {
    try {
      const v = String(Date.now());
      localStorage.setItem(BACKUP_STAMP_KEY, v);
      seenBackupStamp = v;                   // our own write — don't re-fire on focus
    } catch (e) { /* private mode */ }
    scheduleRebuild();                       // hub Backup row re-derives its status
  }
  // Mobile path: the stamp is written by the standalone settings_backup.html shell
  // (BackupPage takeover, its own WebView) — the storage event + a focus fallback
  // (the #238 landtab grammar; WKWebView doesn't reliably fire cross-WebView
  // storage events) refresh this hub when it comes back into view. Guarded on an
  // ACTUAL stamp change so a mere focus never rebuilds under a mid-edit nickname.
  let seenBackupStamp = (() => { try { return localStorage.getItem(BACKUP_STAMP_KEY); } catch (e) { return null; } })();
  function refreshBackupStampIfChanged() {
    let cur = null;
    try { cur = localStorage.getItem(BACKUP_STAMP_KEY); } catch (e) { return; }
    if (cur !== seenBackupStamp) { seenBackupStamp = cur; scheduleRebuild(); }
  }
  window.addEventListener('storage', (e) => { if (e.key === BACKUP_STAMP_KEY) refreshBackupStampIfChanged(); });
  window.addEventListener('focus', refreshBackupStampIfChanged);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshBackupStampIfChanged(); });
  /* #314 (Damir F5: the nudge badge SURVIVED a backup on iOS) — the three
   * listeners above all miss on iOS: WKWebView fires no cross-WebView storage
   * event, and popping the BackupPage overlay changes neither visibilityState
   * nor window focus for the WebView that sat beneath it (it was "visible" the
   * whole time). C-9 (#311) proved the stamp itself crosses ll_* files fine —
   * the gap was purely REFRESH. A visibility-guarded 2s poll (home.html tick
   * cadence precedent) closes it deterministically on every platform; the
   * change-guard in refreshBackupStampIfChanged keeps it from ever rebuilding
   * under a mid-edit nickname. Also carries the B2 warm-Account world, where
   * this page LIVES across closes and re-presents (no reboot re-read). */
  // #46 r1 MINOR-4: `!exiting` pauses the poll while the page is PARKED (#315 —
  // document.hidden stays false for an attached opacity-0 WKWebView, so the
  // visibility guard alone never trips); onRepresented resets the latch → resumes.
  setInterval(() => { if (!document.hidden && !exiting) refreshBackupStampIfChanged(); }, 2000);
  function backupStatus() {
    try {
      const t = Number(localStorage.getItem(BACKUP_STAMP_KEY));
      if (t > 0) {
        return { last: new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) };
      }
    } catch (e) { /* fall through */ }
    return {};
  }
  let hubEl = null, currentView = 'hub';
  let hubScrollTop = 0;   // #336 (Damir F5 #15): preserve hub scroll across takeover sublevels
  currentView = takeResumeView() || 'hub';

  const masterWrap = document.createElement('div');
  masterWrap.className = 'sd-master';
  const detailWrap = document.createElement('div');
  detailWrap.className = 'sd-detail';
  let emptyEl = null;

  // detail empty state — dt-empty grammar (desktop demo §3)
  function getEmpty() {
    if (emptyEl) return emptyEl;
    emptyEl = document.createElement('div');
    emptyEl.className = 'sd-empty';
    try {
      const ic = window.SpixiIcons && window.SpixiIcons.icon;
      if (ic) emptyEl.append(ic('user-circle', { size: 64 }));
    } catch (e) {}
    const h = document.createElement('h2');
    h.className = 't-heading-sm';
    h.textContent = strings.account || 'Account';
    const p = document.createElement('p');
    p.textContent = strings.settingsEmptyHint || 'Choose a setting on the left';
    emptyEl.append(h, p);
    return emptyEl;
  }

  // selected hub row while its sublevel is open (aria-current + tint, CSS above)
  function markSelected(view) {
    for (const r of masterWrap.querySelectorAll('.c-settings__row[aria-current]')) {
      r.removeAttribute('aria-current');
    }
    if (view) {
      const r = masterWrap.querySelector('.c-settings__row[data-setting-key="' + view + '"]');
      if (r) r.setAttribute('aria-current', 'true');
    }
  }

  function renderLayout() {
    if (exiting) return;                           // no re-render once the page is exiting
    // #334 iOS-59: nav visibility keys off the view — hub shows the peer-tab
    // nav, any sublevel hides it (CSS scopes the hide to non-desktop; pane mode
    // already hides the nav wholesale).
    document.body.toggleAttribute('data-subview', currentView !== 'hub');
    // Q1 review (#267 loop): every render that isn't the Downloads sublevel drops
    // the mounted screen — the children are about to be replaced (both branches),
    // so keeping downloadsEl/dlBuf/dlTimer alive would retain a detached node and
    // let the 80ms settle paint into it. Re-entry rebuilds + re-requests the list.
    if (currentView !== 'downloads') releaseDownloads();
    if (currentView !== 'chatappearance') releaseChatAppearance();
    if (currentView !== 'encpass') releaseEncpass();   // #341: scrub the passwords
    if (!hubEl) { hubEl = buildHub(); syncSave(); }
    if (paneMode) {
      if (hubEl.parentNode !== masterWrap) {
        masterWrap.replaceChildren(hubEl);
        // #337: consume a captured hub scroll here too (setLocale in PANE mode
        // rebuilds the hub column) — and never leak a stale latch across a
        // later mode flip into the non-pane restore.
        if (hubScrollTop) {
          const t = hubScrollTop; hubScrollTop = 0;   // one-shot (#337)
