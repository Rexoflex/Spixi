<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). Same recipe as every redesigned shell. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
  /* Splash boot moment (Batch B, #256 ⑭) — uniform boot grammar. This page is
     static/inline so the cover drops almost immediately at window load; over a
     content block that itself centers the same logo it reads as the mark
     settling in, and it still masks any font/late-style pop. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #f9fafb; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  html[data-theme="dark"] .app-boot { background: #13171b; }
  .app-boot__logo { width: 64px; height: 64px; color: var(--icon-accent, #1892ce); animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>
<style data-src="../styles/tokens.css">
/* ==========================================================================
   Spixi design tokens — GENERATED from Figma "Spixi-App" variables.
   DO NOT EDIT BY HAND. To update: change variables in Figma, then ask Claude
   to re-extract ("re-sync tokens"). Figma is the source of truth.

   Tier mapping (mirrors Figma collections):
     1. primitives  ("Spixi - primitives")  → static, mode-less
     2. keys        ("keys", "keys-responsive") → static aliases; type switches
        via the PLATFORM flag :root[data-desktop] (#228 — set once at shell
        boot from desktop-OS detection; NOT a viewport query)
     3. tokens      ("tokens")              → light values on :root,
        dark overrides under [data-theme="dark"] (set by JS from OS
        preference + manual override via the existing ixian:appearance flow)

   Name mapping: slashes → hyphens; "colors/" and "region/" dropped.
     colors/surface/neutral/01      → --surface-neutral-01
     colors/surface/region/topbar   → --surface-topbar
     spacing/16                     → --spacing-16
   Negative spacing has no CSS var — use calc(-1 * var(--spacing-40)).
   Extracted: 2026-07-02 (incl. region tokens + mis-binding fixes).
   ========================================================================== */

/* ==========================================================================
   1. PRIMITIVES
   ========================================================================== */

  /* B1 — NATIVE UI FONT (Damir 2026-07-09, punch-list; DECISIONS #226): system-ui

  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Sora", system-ui, sans-serif; /* brand wordmark/hero ONLY */

  --font-secondary: var(--font-ui);             /* body, labels (was Source Sans 3) */

  --layout-pane-content-max: 640px;

/* B3/R2 — desktop DENSITY step (font-size-audit §2, DECISIONS #226 🟡 Damir
   dials at F5): desktop apps read SMALLER than mobile, not bigger — 24px
   screen titles + 18px list names were the "reads huge vs Telegram" factor.
   heading-lg/display keep their large desktop values (hero/launch only).
   DIAL 2 (2026-07-10, Damir post-F5 "smaller, TG/Discord parity"): titles
   20→18, heading-xs 18→16, row names 15→14 (=TG), NEW body-md 16→15
   (bubbles/body — midpoint of TG 14 / Discord 16), NEW label-lg 18→16 +
   label-sm 14→13. body-xs/label-xs stay 12 (legibility floor, R5). Dial 3
   considered + RETRACTED same day (Damir: bubble size OK — per-user tuning
   rides the Chat-appearance text-size pref, --chat-text-scale, 6e.2).
   TRIGGER (#228, Damir): PLATFORM flag `:root[data-desktop]` — set once at
   shell boot (desktop OS detection), NOT a viewport query. Type stays
   constant while the window resizes (TG/Discord behavior; the old
   @media 700px flipped type at the pane-split threshold — min window is
   480 logical, so narrowed desktop windows got phone-scale text). The 700px
   split threshold remains layout-only (HomePage). Phone-frame demos in a
   wide desktop browser no longer inherit desktop sizes (#226 caveat gone). */
:root[data-desktop] {
  /* W4 (#336, Windows F5): bubbles capped out narrow (~1/3 of a wide pane). The
     mobile cap (360, #334) stays; desktop raises the px edge so the 82% binds on
     modest panes and this caps the rest. VALUE = Damir dial (asked 640-720). */
  --layout-bubble-max: 680px;
  --font-size-display-lg: 56px;  --line-height-display-lg: 64px;  --tracking-display-lg: -2px;
  --font-size-display-md: 44px;  --line-height-display-md: 52px;  --tracking-display-md: -2px;
  --font-size-heading-lg: 36px;  --line-height-heading-lg: 44px;
  --font-size-heading-md: 28px;  --line-height-heading-md: 28px;
  --font-size-heading-sm: 18px;  --line-height-heading-sm: 24px;   /* screen titles */
  --font-size-heading-xs: 16px;  --line-height-heading-xs: 22px;
  --font-size-body-lg: 14px;     --line-height-body-lg: 20px;      /* chat-row names */
  --font-size-body-md: 15px;     --line-height-body-md: 21px;      /* bubbles/body copy */
  --font-size-body-sm: 13px;     --line-height-body-sm: 18px;      /* excerpts */
  --font-size-label-lg: 16px;    --line-height-label-lg: 24px;     /* large buttons */
  --font-size-label-md: 14px;    --line-height-label-md: 20px;     /* buttons/inputs */
  --font-size-label-sm: 13px;    --line-height-label-sm: 18px;
  --tracking-label-lg: -0.25px;  --tracking-label-md: -0.25px;
  --tracking-label-sm: -0.25px;  --tracking-label-xs: -0.25px;
  --tracking-body-md: -0.25px;   --tracking-body-sm: -0.25px;
  --tracking-body-xs: -0.25px;
}

/* Weight-per-role (from "typography" composites):
   display/heading = --font-primary semibold; label = --font-secondary semibold

  --surface-warning-inverse: var(--warning-100);

  --surface-action-pressed: var(--primary-800);
  --surface-action-disabled: var(--neutral-200);

  --surface-action-tonal-hover: var(--primary-200);
  --surface-action-tonal-pressed: var(--primary-300);

  /* surface/destructive */

  --surface-destructive-disabled: var(--neutral-200);
  --surface-destructive-tonal-default: var(--error-100);

/* ==========================================================================
   4. CODE-ONLY TOKENS — not represented in Figma (see DESIGN_SYSTEM.md §2)
   ========================================================================== */
:root {
  /* z-index */
  --z-0: 0;
  --z-10: 10;  /* sticky (date headers) */
  --z-20: 20;  /* bars: top/bottom/composer */
  --z-30: 30;  /* dropdown, context menu */
  --z-40: 40;  /* bottom sheet + scrim */
  --z-50: 50;  /* modal */
  --z-60: 60;  /* call bar — must stay above modals */
  --z-70: 70;  /* toast / alert */

  /* motion */
  --duration-100: 100ms; /* micro: hover, toggle */
  --duration-200: 200ms; /* standard: sheets, dropdowns */
  --duration-300: 300ms; /* view transitions */
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --easing-decelerate: cubic-bezier(0, 0, 0, 1);
  --easing-accelerate: cubic-bezier(0.3, 0, 1, 1);

  /* opacity */
  --opacity-disabled: 0.4;
  --opacity-scrim: 0.6;

  /* chat bubble sizing (DECISIONS.md #14):
     bubble rule = max-width: min(var(--bubble-max-pct), var(--layout-bubble-max))
     75%→82% #334 (Damir dial: wider bubbles; the % is the PHONE binding edge —
     ~300px on a 393px viewport; typed cards + media tiles ride the same tokens) */
  --bubble-max-pct: 82%;

  /* balance figures: tabular numerals so digits align and don't jitter on update
     (Sora + Source Sans 3 both ship tnum). Usage: .u-tabular { font-feature-settings: "tnum" 1; } */
}

/* Contextual region override (DECISIONS.md #20): hero screens repaint the top
   region by reassigning region tokens in scope — components underneath don't change. */
.screen--hero {
  --surface-topbar: var(--surface-hero);
  --text-topbar: var(--text-on-hero);
  --icon-topbar: var(--icon-on-hero);
}

:root {

  /* scrim (keys have no alpha colors — value = grey-1000 #111213 @ 60%;
     plain rgba for conservative WebView baseline) */
  --surface-scrim: rgba(17, 18, 19, 0.6);

  /* hero gradient overlay (code-only: Figma variables can't hold gradients —
     lives as a fill on the hero components there). Usage:
     background: var(--gradient-hero-overlay), var(--surface-hero); */
  --gradient-hero-overlay: linear-gradient(180deg, rgba(49, 13, 80, 0.45) 0%, rgba(102, 74, 151, 0.45) 100%);

  /* lock-screen brand gradient (#160, Damir: "brutally cool, multiple angles,
     purple/dark/blue"). FIXED-DARK both themes — the lock screen pins its
     subtree [data-theme="dark"], this token never flips. Multi-angle build:
     3 corner radials (purple / blue / cyan — the demo avatar-gradient hue
     family) over a 215° near-black base. Raw rgba sanctioned like
     --gradient-hero-overlay (gradients = code-only tokens). */
  /* Softened 2026-07-08 (Damir: less saturation, gentler, "slightly blurred"):
     halved blob alphas + muted hues toward grey + wider radial falloff (feathered
     edges) + compressed base lightness (lower stop-to-stop contrast). Alphas =
     strength, radial extent % = blur/feather, base lightness spread = base contrast
     — the dials, Damir's final call. */
  --gradient-lock:
    radial-gradient(150% 100% at 50% -25%, rgba(132, 108, 200, 0.22) 0%, rgba(132, 108, 200, 0) 70%),
    radial-gradient(90% 65% at 90% 16%, rgba(190, 120, 175, 0.07) 0%, rgba(190, 120, 175, 0) 72%),
    radial-gradient(105% 75% at 6% 84%, rgba(80, 120, 190, 0.13) 0%, rgba(80, 120, 190, 0) 70%),
    radial-gradient(75% 55% at 86% 98%, rgba(90, 170, 175, 0.06) 0%, rgba(90, 170, 175, 0) 68%),
    linear-gradient(200deg, #201a38 0%, #191830 45%, #10111f 100%);

  /* launch/welcome brand gradient (Damir premium round 2026-07-06: "more
     premium colors" than --gradient-lock). Aurora build, FIXED-DARK like the
     lock: a violet crown halo behind the logo, a faint magenta glint
     upper-right, deep sapphire lower-left, a teal whisper bottom-right, over
     a violet-ink 200° base. The 5 layers + alphas are Damir's dials; if he
     converges the lock onto this recipe, retire --gradient-lock into it.
     Raw rgba sanctioned (gradients = code-only tokens). */
  /* #264 (Damir: "soften like the lock" — the #206⑥ recipe applied to launch):
     halved blob alphas + hues muted toward grey + wider radial falloff (feathered
     edges) + compressed base lightness spread. Launch keeps its violet identity;
     the same four dials as the lock (alphas / extents / stops / base) — Damir
     art-directs live. Pre-soften values in git history. */
  --gradient-launch:
    radial-gradient(150% 100% at 50% -25%, rgba(126, 100, 224, 0.25) 0%, rgba(126, 100, 224, 0) 70%),
    radial-gradient(90% 65% at 90% 16%, rgba(200, 118, 178, 0.08) 0%, rgba(200, 118, 178, 0) 72%),
    radial-gradient(105% 75% at 6% 84%, rgba(78, 116, 200, 0.14) 0%, rgba(78, 116, 200, 0) 70%),
    radial-gradient(75% 55% at 86% 98%, rgba(88, 178, 172, 0.06) 0%, rgba(88, 178, 172, 0) 68%),
    linear-gradient(200deg, #1b163c 0%, #131230 45%, #0b0c1a 100%);

  /* chat canvas (Damir 2026-07-03): doodle pattern tile + themed gradient.
     PREMIUM TREATMENT (2026-07-03): pattern renders as a data-URI MASK
     (src/styles/chat-pattern.css, generated by scripts/generate-chat-pattern.mjs)
     inked with --chat-pattern-ink — theme-colored, not white ("white isn't
     premium", Damir). Two dials per theme: ink (color) + opacity (intensity).
     ✅ LOCKED (Damir 2026-07-03, via demo switcher): "Primary soft" —
     light primary-200 / dark primary-800, opacity 0.5 both modes.
     ADD --chat-pattern-ink TO FIGMA at next mirror. */
  /* gradient stays tinted end-to-end — fading to screen-white made white
     bubbles vanish at the bottom (Damir 2026-07-03) */
  /* W5 F5 2026-08-13 — "on light mode perhaps bump opacity, as its barely
     visible on the strongest". MEASURED in Chromium (pattern-vs-gradient
     contrast ratio, median over the inked pixels of the light canvas):
     primary-200 gave 1.02 at Standard and 1.03 at BOLD, against dark's
     1.12 / 1.18 — i.e. light Bold was fainter than dark SUBTLE (1.07)
     despite carrying 2.8× the opacity. The opacity ladder was never the
     problem: primary-200 (#b7c9f4) is all but isoluminant with the sky-blue
     --gradient-chat wash, so multiplying alpha multiplies almost nothing.
     The fix is the INK, one step up the same ramp the dark ink already sits
     on: primary-400 lands light at 1.08 / 1.14 / 1.20 (Subtle/Standard/Bold)
     — theme PARITY with dark's 1.07 / 1.12 / 1.18, so Standard stays the
     theme default it has always been and Bold finally reads as a pattern.
     PATTERN_LEVELS and the dark ×0.36 derivation are untouched; the dark ink
     below is a separate value, so dark renders pixel-identical to today. */
  --chat-pattern-ink: var(--primary-400);
  --chat-pattern-opacity: 0.5;
  /* message text scale (#147 — Chat appearance setting, FE-only). Bubbles
     compute font-size * this; ADOPTION in message-bubble.css lands at the
     chat-shell integration pass (flagged) — the settings preview uses it now. */
  --chat-text-scale: 1;
  /* light gradient v2 (Damir 2026-07-03, 2nd round): sky-blue diagonal wash,
     alphas composited over surface-screen (the trailing color layer). Raw
     rgba sanctioned like --gradient-hero-overlay (gradients = code-only
     tokens); soften dial = the two alphas. TOKEN-CANDIDATE colors at next
     Figma mirror. Replaces primary-100→50; recheck canvas-tuned inks
     (scroll thumb -03, datesep) at UX review. */
  /* canvas base = the SOLID color layer under the gradient wash. Split out so a
     surface (e.g. desktop, docs/desktop-split-spec.md item 2) can drop the doodle
     pattern AND swap the base without touching the gradient overlay itself. */
  --chat-canvas-base: var(--surface-screen);
  --gradient-chat: linear-gradient(195deg, rgba(170, 220, 245, 0.5) 0%, rgba(24, 146, 206, 0.5) 100%), var(--chat-canvas-base);
  /* OUTGOING (sent) bubble fill — premium saturated gradient, NOT washed out
     (Damir 2026-07-07). White text (--text-bubble-sent) rides on top. This is the
     ONE line to tune the sent-bubble look (Damir owns the final palette); the solid
     --surface-bubble-sent is the fallback. TOKEN-CANDIDATE at next Figma mirror. */
  --gradient-bubble-sent: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-600) 100%);
  /* #170: c-disc gradient palette — vivid, distinct, mode-agnostic (paired with a
     white glyph, so the same fills read in light AND dark). Assigned per-glyph by
     discGrad() so discs don't repeat; error = reserved destructive red. Raw hex
     sanctioned like the other --gradient-* code-only tokens. */
  --disc-grad-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --disc-grad-2: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
  --disc-grad-3: linear-gradient(135deg, #7c3aed 0%, #d946ef 100%);
  --disc-grad-4: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
  --disc-grad-5: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
  --disc-grad-6: linear-gradient(135deg, #f43f5e 0%, #ec4899 100%);
  --disc-grad-7: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
  --disc-grad-8: linear-gradient(135deg, #84cc16 0%, #22c55e 100%);
  --disc-grad-9: linear-gradient(135deg, #d946ef 0%, #a855f7 100%);
  --disc-grad-10: linear-gradient(135deg, #fb923c 0%, #ef4444 100%);
  --disc-grad-11: linear-gradient(135deg, #22d3ee 0%, #0ea5e9 100%);
  --disc-grad-12: linear-gradient(135deg, #64748b 0%, #475569 100%);
  --disc-grad-13: linear-gradient(135deg, #14b8a6 0%, #22d3ee 100%);
  --disc-grad-14: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
  --disc-grad-error: linear-gradient(135deg, #f87171 0%, #dc2626 100%);

  /* state washes over strong surfaces (hero gradient, success call bar) —
     mirrored in Figma as colors/surface/region/wash-* (alpha primitives);
     same value both modes: washes are relative to the surface they sit on */
  --surface-wash-on-hero: rgba(255, 255, 255, 0.12);
  --surface-wash-on-hero-pressed: rgba(255, 255, 255, 0.18);
  --surface-wash-on-success: rgba(0, 0, 0, 0.08);
  --surface-wash-on-success-pressed: rgba(0, 0, 0, 0.14);

  /* on-scrim inks (audit r3): the scrim stays DARK in both modes, so its inks
     are MODE-LESS — the on-action inks flip to near-black in dark mode and
     vanished on media-tile scrim pills. ADD TO FIGMA at next mirror. */
  --text-on-scrim: var(--neutral-10);
  --icon-on-scrim: var(--neutral-10);

  /* settings row-icon discs (#147 — Damir: tinted per-row badges, the
     Telegram/reference grammar; plain neutral glyphs read flat). Soft disc +
     strong ink per semantic hue; pairs flip per theme below. DS-DOC at next
     mirror pass. error is RESERVED for destructive rows. */
  --disc-primary-bg: var(--primary-100);   --disc-primary-ink: var(--primary-600);
  --disc-accent-bg: var(--accent-100);     --disc-accent-ink: var(--accent-600);
  --disc-info-bg: var(--info-100);         --disc-info-ink: var(--info-600);
  --disc-success-bg: var(--success-100);   --disc-success-ink: var(--success-600);
  --disc-warning-bg: var(--warning-100);   --disc-warning-ink: var(--warning-600);
  --disc-error-bg: var(--error-100);       --disc-error-ink: var(--error-600);
  --disc-neutral-bg: var(--neutral-100);   --disc-neutral-ink: var(--neutral-600);

  /* theme-picker preview tiles (#147): FIXED light/dark paints — a preview
     must show its OWN mode regardless of the active theme (the --surface-qr
     fixed-pair precedent). Mode-less by design. */
  --preview-light-surface: var(--neutral-10);
  --preview-light-line: var(--neutral-200);
  --preview-dark-surface: var(--neutral-950);
  --preview-dark-line: var(--neutral-700);

  /* switch control (#148 — Damir: the off-track/knob pair was near-invisible
     on card surfaces in both modes; the on-action knob ink goes near-black in
     dark). Dedicated pair per mode; ON track stays --surface-action-default. */
  --switch-track-off: var(--neutral-200);
  --switch-knob: var(--neutral-10);

  /* input ON A CARD (#150③): --surface-input === --surface-card in BOTH modes
     (neutral-50/-800 twins) — fields vanish on the #147/#148 card sections.
     Carded containers REASSIGN --surface-input to this (the #20 contextual
     region-override precedent — no component overrides). Inset reading:
     slightly darker than the card in light, deeper than it in dark. */
  --surface-input-on-card: var(--neutral-100);

  /* elevation — light: shadows */
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(17, 18, 19, 0.06), 0 1px 3px rgba(17, 18, 19, 0.1);
  --elevation-2: 0 2px 6px rgba(17, 18, 19, 0.08), 0 4px 12px rgba(17, 18, 19, 0.1);
  --elevation-3: 0 8px 16px rgba(17, 18, 19, 0.12), 0 12px 32px rgba(17, 18, 19, 0.14);
}

[data-theme="dark"] {
  /* settings row-icon discs — dark pairs (#147) */
  --disc-primary-bg: var(--primary-900);   --disc-primary-ink: var(--primary-300);
  --disc-accent-bg: var(--accent-900);     --disc-accent-ink: var(--accent-300);
  --disc-info-bg: var(--info-900);         --disc-info-ink: var(--info-300);
  --disc-success-bg: var(--success-900);   --disc-success-ink: var(--success-300);
  --disc-warning-bg: var(--warning-900);   --disc-warning-ink: var(--warning-300);
  --disc-error-bg: var(--error-900);       --disc-error-ink: var(--error-300);
  --disc-neutral-bg: var(--neutral-800);   --disc-neutral-ink: var(--neutral-300);

  /* switch control — dark pair (#148) */
  --switch-track-off: var(--neutral-700);
  --switch-knob: var(--neutral-100);

  /* input on a card — dark (#150③): deeper than the neutral-800 card = inset */
  --surface-input-on-card: var(--neutral-900);

  /* elevation — dark: shadows read poorly; raised surfaces use surface-card(-raised) */
  --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --elevation-2: 0 2px 6px rgba(0, 0, 0, 0.5);
  --elevation-3: 0 8px 20px rgba(0, 0, 0, 0.6);

  /* chat canvas — base = --surface-neutral-01 (resolves to neutral-900 in dark,
     Damir 2026-07-07) with a subtle premium glow so it reads gradient-like
     (Telegram), not flat; the theme-ink line pattern (chat-pattern.css) overlays
     on top. Tune the glow alpha/position here. */
  /* pattern ink + chat base + sent bubble — Damir exact values 2026-07-07:
     pattern overlay = hsla(242,76%,72%), chat base = surface-neutral-01,
     sent bubble = 180deg #353FB7→#2046A7. These are the dark-mode tuning lines. */
  --chat-pattern-ink: hsla(242, 76%, 72%, 1);
  /* dark pattern intensity reduced 60% then another 10% (0.5 → 0.2 → 0.18),
     Damir F5 2026-07-08 — the dark doodle overlay read too strong on the
     neutral-950 canvas. Light mode unchanged at 0.5 (different surface + ink). */
  --chat-pattern-opacity: 0.18;
  /* dark canvas base (see light-mode note): desktop swaps this to --neutral-1000
     for a solid grey-1000 under the gradient overlay (desktop-split-spec item 2). */
  --chat-canvas-base: var(--surface-neutral-01);
  --gradient-chat: radial-gradient(120% 85% at 50% 0%, rgba(80, 122, 249, 0.10) 0%, transparent 58%), var(--chat-canvas-base);
  /* OUTGOING (sent) bubble fill — premium saturated gradient, NOT washed out
     (Damir 2026-07-07); white text rides on top. */
  --gradient-bubble-sent: linear-gradient(180deg, #353FB7 0%, #2046A7 100%);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-100: 0ms;
    --duration-200: 0ms;
    --duration-300: 0ms;
  }
}

}
.t-display-lg { font-size: var(--font-size-display-lg); line-height: var(--line-height-display-lg); letter-spacing: var(--tracking-display-lg); }
.t-display-md { font-size: var(--font-size-display-md); line-height: var(--line-height-display-md); letter-spacing: var(--tracking-display-md); }
.t-heading-lg { font-size: var(--font-size-heading-lg); line-height: var(--line-height-heading-lg); letter-spacing: var(--tracking-heading-lg); }
.t-heading-md { font-size: var(--font-size-heading-md); line-height: var(--line-height-heading-md); letter-spacing: var(--tracking-heading-md); }

/* Balance figures (DECISIONS.md #21) */
.u-tabular { font-feature-settings: "tnum" 1; }

/* Search-match highlight (DECISIONS.md #52) — warning tonal wash, ink inherited */
.c-highlight {
  background: var(--surface-warning-inverse);
  border-radius: var(--radius-2, 2px);
}

/* Theme switch: suppress ALL transitions for the swap frame (DECISIONS.md #53) —
   mixed 100/200ms transitions repaint staggered during a token flip = flicker.
   JS adds the class, flips data-theme, removes it after two rAFs. */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after { transition: none !important; }

/* Keyboard focus — one ring app-wide (DECISIONS.md #23) */
:focus-visible {
  outline: var(--outline-width-2) solid var(--outline-focus);
  outline-offset: 2px;
}

/* Scroll regions (DECISIONS.md #41) — pointer devices get a thin themed thumb
   that is INVISIBLE until the pointer is over the region; the gutter is always
   reserved so content never shifts. ALL scrollbar styling is guarded behind
   (hover: hover) and (pointer: fine) (#334 AND-18: an S-Pen/hover-capable touch
   device flips Chromium's primary-pointer heuristic to hover-capable, which lit
   every guarded hover as a sticky tap-hover app-wide — pointer:fine keeps mice/
   trackpads, drops coarse-primary touch devices): touch WebViews — incl.
   Android >= Chromium 121, which honors scrollbar-width/color but never
   hovers — keep their native transient overlay indicator instead of a
   permanently hidden thumb. */
.u-scroll { overflow-y: auto; }
@media (hover: hover) and (pointer: fine) {
  .u-scroll {
    scrollbar-width: thin;                       /* FF + Chromium 121+ */
    scrollbar-color: transparent transparent;
    scrollbar-gutter: stable;                    /* reserve the gutter so an appearing scrollbar
                                                    never reflows content (the comment above always
                                                    promised this; QR/payments expand used to shift
                                                    + flicker — Damir). Pointer-only: touch WebViews
                                                    keep their transient overlay, no reserved gutter. */
  }
  .u-scroll:hover, .u-scroll:focus-within {
    scrollbar-color: var(--outline-neutral-02) transparent;
  }
  .u-scroll::-webkit-scrollbar { width: 6px; }   /* older WebKit/Blink */
  .u-scroll::-webkit-scrollbar-track { background: transparent; }
  .u-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: var(--radius-full); }
  .u-scroll:hover::-webkit-scrollbar-thumb,
  .u-scroll:focus-within::-webkit-scrollbar-thumb { background: var(--outline-neutral-02); }
}

/* Tinted icon disc (DECISIONS #147/#148) — the row-icon atom shared by the
   settings family AND chat-info/contact (Damir: one consistent treatment).
   Hue rides the --disc-* token pairs; error is RESERVED for destructive rows. */
/* #170: vivid GRADIENT fill + white glyph. The white icon reads on every gradient
   in BOTH light and dark, so one palette serves both modes. Per-glyph gradient via
   data-grad (discGrad) so discs don't repeat; data-hue survives as the reserved
   destructive-red recipe + a fallback for discs that set no data-grad. */
.c-disc {
  flex: none;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-full);
  background: var(--disc-grad, var(--disc-grad-1));
  color: #fff;                                   /* white glyph — sanctioned, mode-agnostic */
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
}
/* hue -> default gradient (for discs that set only data-hue, e.g. the scan card) */
.c-disc[data-hue='primary'] { --disc-grad: var(--disc-grad-1); }
.c-disc[data-hue='accent']  { --disc-grad: var(--disc-grad-3); }
.c-disc[data-hue='info']    { --disc-grad: var(--disc-grad-2); }
.c-disc[data-hue='success'] { --disc-grad: var(--disc-grad-4); }
.c-disc[data-hue='warning'] { --disc-grad: var(--disc-grad-5); }
.c-disc[data-hue='neutral'] { --disc-grad: var(--disc-grad-12); }
/* per-glyph gradient (discGrad) — later in source, so it wins over the hue default */
.c-disc[data-grad='1']  { --disc-grad: var(--disc-grad-1); }
.c-disc[data-grad='2']  { --disc-grad: var(--disc-grad-2); }
.c-disc[data-grad='3']  { --disc-grad: var(--disc-grad-3); }
.c-disc[data-grad='4']  { --disc-grad: var(--disc-grad-4); }
.c-disc[data-grad='5']  { --disc-grad: var(--disc-grad-5); }
.c-disc[data-grad='6']  { --disc-grad: var(--disc-grad-6); }
.c-disc[data-grad='7']  { --disc-grad: var(--disc-grad-7); }
.c-disc[data-grad='8']  { --disc-grad: var(--disc-grad-8); }
.c-disc[data-grad='9']  { --disc-grad: var(--disc-grad-9); }
.c-disc[data-grad='10'] { --disc-grad: var(--disc-grad-10); }
.c-disc[data-grad='11'] { --disc-grad: var(--disc-grad-11); }
.c-disc[data-grad='12'] { --disc-grad: var(--disc-grad-12); }
.c-disc[data-grad='13'] { --disc-grad: var(--disc-grad-13); }
.c-disc[data-grad='14'] { --disc-grad: var(--disc-grad-14); }
/* destructive stays RED regardless of the per-glyph gradient (safety) — LAST wins */
.c-disc[data-hue='error'] { --disc-grad: var(--disc-grad-error); }

/* Interactive-CHROME selectability sweep (iOS-33 extension; Damir 2026-08-07:
   bottom-nav labels were selectable, chat-row long-press popped the iOS text
   callout). Nav, rows, topbars, chips and the FAB are controls, not content —
   suppress selection AND the callout on TOUCH surfaces only (iOS-33 grammar:
   :root:not([data-desktop]) keeps desktop drag-select alive). Message TEXT keeps
   its decided behavior (message-bubble.css iOS-33/41 — menu-copy on mobile);
   deliberately selectable content (settings dev log / link urls, both explicit
   -webkit-user-select:text) wins on its own elements — -webkit-user-select
   inherits, and an explicit `text` on the child overrides this chrome-level
   `none`. No text INPUT lives inside any listed selector (search fields sit in
   .c-chats-header / takeover heads, both unlisted) — field selection unharmed. */
:root:not([data-desktop]) .c-bottomnav,
:root:not([data-desktop]) .c-topbar,
:root:not([data-desktop]) .c-chatlist-item,
:root:not([data-desktop]) .c-txlist-item,
:root:not([data-desktop]) .c-contacts__row,
:root:not([data-desktop]) .c-app-item,
:root:not([data-desktop]) .c-settings__row,
:root:not([data-desktop]) .c-chip,
:root:not([data-desktop]) .fab {
  -webkit-touch-callout: none;
  -webkit-user-select: none;   /* WebKit honors only the prefixed form (avatar.css precedent) */
  user-select: none;
}
/* #322 (Damir F5 r2: the wallet-hero action LABELS selected on long-press, "and
   it also works same on other places"): the per-component list above was
   whack-a-mole — on TOUCH surfaces NOTHING outside real inputs is document
   content, so suppress at the BODY and re-enable selection only where typing/
   selection is the point. -webkit-user-select inherits: element-level explicit
   `text` rules (settings dev log · link urls — settings-app.css:117/230) still
   win over the inherited none, and iOS-33's message-text policy is unchanged
   (bubbles were already none on mobile; menu Copy is the copy path). Desktop
   keeps full drag-select (the :root guard). The component list above stays —
   harmless, and it documents the surfaces that PROMPTED each pass. */
:root:not([data-desktop]) body {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
:root:not([data-desktop]) input,
:root:not([data-desktop]) textarea,
:root:not([data-desktop]) [contenteditable],
:root:not([data-desktop]) [contenteditable] * {
  -webkit-touch-callout: default;
  -webkit-user-select: text;
  user-select: text;
}

/* ——— PRESS FEEDBACK (#343) — one rule set for every pressable surface —————————
 * Driven by src/components/pressable.js, which sets data-pressed on pointerdown
 * and clears it the moment the gesture becomes a scroll. Read that file's header
 * for why this is not `:active`.
 *
 * Two grammars, because a list row and a button are different objects:
 *   row     — background tint only. A list row that scales reads as a mistake;
 *             iOS and Android both tint rows and neither moves them.
 *   control — tint plus a small scale, so the press reads as a physical push.
 *
 * Timings: 90 ms in, 120 ms out. In must be faster than out — the response has to
 * feel immediate, the release can relax. Both are well under the ~100 ms that
 * reads as "instant", which is the entire point of the mechanism.
 *
 * NOT guarded by @media (hover: hover): unlike :hover (#43), a press is exactly
 * what a touch device does, and it is also correct for a mouse.
 * `background-color` is animated, not `background`, so a gradient surface
 * (bubbles, hero) is never re-rasterised by a press. */
/* ★ SPECIFICITY, and why the `html:root` prefix is not decoration (#343 device fix).
   base.css loads BEFORE every component stylesheet, and `.c-chatlist-item` sets
   `background: transparent` at (0,1,0). A plain `[data-pressed]` rule is also
   (0,1,0), so it lost on source order and the press tint never painted — Damir on
   Android: "no feedback effect when tapping on chat row". The strongest competing
   component selectors are `.c-chatlist-item[aria-current]` and `:active`, both
   (0,2,0). `html:root …` is (0,2,1), which beats them from anywhere in the cascade.
   Do not simplify this prefix away. */
/* ★ INSTANT ON, FADE OUT — the native grammar (device fix). The first cut ramped the
   tint IN over 90 ms, which Damir read as "abrupt with delay": a ramp that short is too
   fast to be seen as motion and too slow to be seen as a response, so it lands as a
   late snap. iOS list rows and Android touch highlights both appear IMMEDIATELY and
   FADE on release. `transition: none` here does exactly that, and the release fade
   comes from the base rule below, which applies when the attribute is removed. */
html:root [data-pressed] { transition: none; }
html:root [data-pressed="row"] {
  background-color: var(--surface-interactive-pressed);
}
/* A SELECTED row (desktop split-view) presses in its own tonal family — pressing it
   must not flash the neutral tint over the action colour. */
html:root [data-pressed="row"][aria-current] {
  background-color: var(--surface-action-tonal-pressed);
}
html:root [data-pressed="control"] {
  transform: scale(0.97);
}
/* The release transition lives on the un-pressed element, so it applies when the
   attribute is REMOVED — a transition declared only under [data-pressed] would snap
   back with no animation. Same prefix, same reason. */
html:root .c-chatlist-item, html:root .c-contacts__row, html:root .c-txlist-item,
html:root .c-settings__row, html:root .c-app-item, html:root .c-apps-recents__item,
html:root .c-wallet-receive__contact, html:root .c-button, html:root .c-chip,
html:root .c-bottomnav__item, html:root .fab, html:root .c-topbar__dots {
  transition: background-color 200ms var(--easing-standard, ease-out),
              transform 200ms var(--easing-standard, ease-out);
}
@media (prefers-reduced-motion: reduce) {
  html:root [data-pressed="control"] { transform: none; }
  html:root [data-pressed],
  html:root .c-chatlist-item, html:root .c-contacts__row, html:root .c-txlist-item,
  html:root .c-settings__row, html:root .c-app-item, html:root .c-apps-recents__item,
  html:root .c-wallet-receive__contact, html:root .c-button, html:root .c-chip,
  html:root .c-bottomnav__item, html:root .fab, html:root .c-topbar__dots {
    transition: none;
  }
}

    for (var id in fb) {
      var el = document.getElementById(id);
      if (el && el.textContent.indexOf(MARK) !== -1) el.textContent = fb[id];
    }
    try {
      var host = document.getElementById('empty-icon');
      if (host && window.SpixiIcons && window.SpixiIcons.icon) host.append(window.SpixiIcons.icon('logo', { size: 56 }));
    } catch (e) {}
    try {
      var boot = document.getElementById('app-boot-logo');
      if (boot && window.SpixiIcons && window.SpixiIcons.icon) boot.append(window.SpixiIcons.icon('logo', { size: 64 }));
    } catch (e) {}
  })();

  /* #251 (Damir F5: pane stayed DARK after a dark→light theme pick): C# re-themes
   * live WebViews with sendUiCommand(page, "setTheme", name) — the command arrives
   * as executeUiCommand(setTheme, 'light'), i.e. a BARE GLOBAL fn reference. Provide
   * the global + a minimal dispatcher (loop C-4 hardening folded in: unknown pushes
   * must not throw into EvaluateJavaScriptAsync). */
  window.setTheme = function (name) {
    if (name === 'light' || name === 'dark') document.documentElement.dataset.theme = name;
  };
  if (!window.executeUiCommand) {
    /* W1 (#336, Windows F5 runtime evidence: "PUSH RECEIVED: ZGFyaw=="): C#'s
     * sendUiCommand base64-encodes EVERY argument (Utils.cs escapeHtmlParameter)
     * and the REAL dispatcher (bridge/native.js installExecuteUiCommand) decodes —
     * this bundle-less stub passed args RAW, so setTheme compared 'ZGFyaw==' to
     * 'dark' and silently no-opped: the welcome pane NEVER re-themed live (dark
     * leftovers, Damir's repro). Decode unconditionally, exactly like the real
     * dispatcher (a bare C# `null` arrives as JS null → '' — the #182 guard). */
    window.executeUiCommand = function (fn) {
      try {
        if (typeof fn !== 'function') return;
        const args = [];
        for (let i = 1; i < arguments.length; i++) {
          const a = arguments[i];
          if (a == null) { args.push(''); continue; }
          let v = String(a);
          try {
            const bin = atob(v);
            v = new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.codePointAt(0); }));
          } catch (e) { /* not base64 (future plain push) — keep verbatim */ }
          args.push(v);
        }
        fn.apply(null, args);
      } catch (e) {}
    };
  }

  /* Page ready — window load (#177 timing invariant). EmptyDetail.onLoad is a
   * no-op, but the signal keeps the page on the standard shell lifecycle. */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }
  function signalReady() { dropAppBoot(); try { location.href = 'ixian:onload'; } catch (e) {} }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
