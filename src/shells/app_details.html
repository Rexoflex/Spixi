<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — App</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark)
     so the page doesn't flash white while tokens.css + the bundle load. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/chip.css"><!-- capability chips -->
<link rel="stylesheet" href="../styles/components/badge.css"><!-- verified badge (unused today — always false) -->
<link rel="stylesheet" href="../styles/components/overlay.css"><!-- c-modal (install confirm / uninstall / removed) -->
<link rel="stylesheet" href="../styles/components/toast.css"><!-- copy-URL toast -->
<link rel="stylesheet" href="../styles/components/apps-icon.css">
<link rel="stylesheet" href="../styles/components/apps-details.css">
<!-- Q4-③ (#270): call CSS removed — calls present on the native CallPage -->
<style>
  /* Production shell: fill the WebView. app_details.html is loaded by the C#
     AppDetailsPage (PUSHED). A back-only topbar sits above a scrolling details
     region; the app name lives in the details hero right below (no vertical
     repeat, per Damir). The sticky Install bar sticks to the scroll region. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #topbar-slot { flex: none; }
  #app-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #app-scroll > .c-app-details { flex: 1; }
  /* Boot spinner — static, theme-colored loader shown during the ~1MB bundle
     parse / before first render (mirrors contact_details.html); the first
     replaceChildren render swaps it out, so the load gap is never blank. */
  .boot { flex: 1; min-height: 100%; display: flex; align-items: center; justify-content: center; }
  .boot__spinner {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    border: 3px solid var(--outline-neutral-02);
    border-top-color: var(--icon-action-default, var(--surface-action-default));
    animation: boot-spin var(--duration-700, 700ms) linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot__spinner { animation: none; } }
</style>
</head>
<body>
  <div id="topbar-slot"></div>
  <div id="app-scroll"><div class="boot"><div class="boot__spinner" role="status" aria-label="Loading"></div></div></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. Before this, production resolved
     'en-us' in EVERY locale. ?lang= still overrides (demos/tests); in a plain-browser
     preview the marker stays un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production App-details / installer shell — the redesigned AppDetailsPage,
   * wired to the REAL C# MAUI bridge (native.js in the bundle). Reached by
   * tapping a mini-app (HomePage apps tab / AppsPage → ixian:appDetails|details
   * → C# pushes AppDetailsPage, which loads this file), or by the add-app flow
   * navigating here in "installing" mode. ZERO C# change, frozen bridge.
   *
   * Contract (verified bridge-audit-B §10, AppDetailsPage.xaml.cs):
   *   C#→JS: init(name, icon, publisher, description, version, url, humanSize,
   *            capabilities, appId, hasSingleUser("True"/"False"), hasMultiUser,
   *            installed ("false" while installing, else bool-string — MIXED
   *            casing), verified (always "False"), <hardcoded "True">)  [14 args]
   *          · showInstalling · showInstallSuccess · showInstallFailed
   *          · showAppRemoved
   *   JS→C#: ixian:onload · ixian:back · ixian:install · ixian:uninstall
   *          · ixian:details (reload — NOT wired; no component reload hook)
   *          · ixian:startApp:<appId>      (single-user launch)
   *          · ixian:startAppMulti:<appId> (multi-user launch → contact picker)
   *
   * DESIGN NOTES / deviations (flagged in the handoff):
   *   - Icon path won't resolve inside the self-contained shell (repo-wide flag)
   *     → app.icon left null → c-app-icon renders its deterministic gradient
   *     tile (same hue as the list). Raw path stored for a future image slot.
   *   - `verified` is hardcoded "False" in C# → asBool() → false → NO bogus
   *     verified badge shown. (BE ask: a real signed-app flag — logged.)
   *   - `installed` mixes casing ("false" while installing vs Bool.ToString());
   *     asBool() treats "true"/"True" as true, everything else false.
   *   - Install = inline button morph (loading → success check → re-render as
   *     installed), driven by C#'s showInstalling/Success/Failed pushes resolving
   *     the component's install ctrl. We do NOT also open the modal variants
   *     (showAppInstalling/Installed) — that would double-signal the inline morph.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    // ALIAS the modal import — a bare `showAppRemoved` const would SHADOW the
    // same-named bridge handler in identifier resolution (declarative record wins
    // over the global object), so C#'s executeUiCommand(showAppRemoved) would call
    // the modal fn and skip the handler's re-render (audit MAJOR, Batch 4).
    createAppDetails, showAppRemoved: showAppRemovedModal,
    createTopbar,
    createNativeBridge, installExecuteUiCommand,
    attachEdgeBack,   // ★ L3 (#706): the iOS back signal + the one-level chain
    dismissTopOverlay,                   // ★ L3 (Session F): hardware back closes an open confirm first
    applyPushedTheme,
    } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const asBool = (v) => v === 'True' || v === 'true' || v === true;
  // Thread the icon path like the apps tab (home.html resolveIcon): normalize the
  // Windows separator; c-app-icon's onerror falls back to the gradient. Shows the
  // gradient until X1 (C# data-URI push) lands, then the real image — parity with
  // the tab (Damir F5 2026-07-08: details showed initials, tab showed the same).
  const resolveIcon = (pth) => { const t = (pth || '').replace(/\\/g, '/'); return t || null; };

  const topbarSlot = document.getElementById('topbar-slot');
  const scroll = document.getElementById('app-scroll');

  // populated by init(); until then the page is intentionally blank (C# queues
  // init until ixian:onload, then pushes it as the very first frame).
  let app = null;
  // the live install ctrl (component's { done, fail }) — resolved by C#'s
  // showInstallSuccess / showInstallFailed pushes.
  let pendingInstallCtrl = null;

  /** Choose the launch verb from the app's user-mode flags. Single-user apps →
   *  ixian:startApp; multi-user-only apps → ixian:startAppMulti (C# then opens a
   *  contact picker + sends the chat app-invite). An app declaring BOTH launches
   *  SOLO from the Open pill — A9 (#302) adds a second, explicitly labelled
   *  "Invite a contact" pill beside it rather than overloading Open or reviving
   *  legacy's per-tap choice modal. One pill → one verb, still. */
  function launch(a) {
    if (!a || a.id == null || a.id === '') return;
    if (a.hasSingleUser || !a.hasMultiUser) bridge.send('ixian:startApp:' + a.id);
    else bridge.send('ixian:startAppMulti:' + a.id);
  }
  /** A9 (#302): the explicit multi-user launch for a dual-capability app. */
  function launchMulti(a) {
    if (!a || a.id == null || a.id === '') return;
    bridge.send('ixian:startAppMulti:' + a.id);
  }

  function buildTopbar() {
    // back-only bar — the app name lives in the details hero right below (Damir).
    topbarSlot.replaceChildren(createTopbar({
      variant: 'view', title: '', backLabel: strings.back || 'Back',
      onBack: () => bridge.send('ixian:back'),
    }));
  }

  function render() {
    if (!app) return;
    scroll.replaceChildren(createAppDetails({
      app, strings, host: document.body,

      // launch (Open pill on installed apps, or related tiles → their details)
      onLaunch: (a) => launch(a),
      onLaunchMulti: (a) => launchMulti(a),      // A9 (#302): dual-capability apps only
      onOpen: () => {},                          // no related-app data over this bridge → no-op

      // install — fire the intent, stash the ctrl; C#'s showInstall* resolves it.
      onInstall: (a, ctrl) => { pendingInstallCtrl = ctrl; bridge.send('ixian:install'); },
      // after the success morph the component calls onInstalled → re-render as installed
      onInstalled: () => { if (app) { app.installed = true; render(); } },

      // uninstall — fire-and-forget INTENT after the component's confirm modal.
      // C# runs MiniAppManager.remove then pushes showAppRemoved (page stays).
      onUninstall: () => bridge.send('ixian:uninstall'),

      // copy the dev install URL — no bridge verb; best-effort Clipboard API
      // (the component shows its own "Copied" toast regardless).
      onCopyUrl: (url) => { try { navigator.clipboard && navigator.clipboard.writeText(url); } catch (_) {} },
    }));
    scroll.scrollTop = 0;
  }

  /* —————————————————————————————————————————————————————————————————————————
   * C#→JS handlers — page globals (executeUiCommand resolves bare fnRefs).
   * ————————————————————————————————————————————————————————————————————————— */
  const handlers = {
    /* ★ N71 (#421): the live re-theme push. C# used to RELOAD every page on an OS
     * theme flip, which threw the user back to Chats (N78) and discarded unsaved
     * input; it pushes now, so this shell must be able to receive one. Shared body
     * (theme-runtime.js) — never re-derive 'auto' from matchMedia here, the
     * WebView's prefers-color-scheme can disagree with the app theme. */
    setTheme(name) { applyPushedTheme(name); },
    /* ★★ L3 (Session F) — THE BACK LEVEL THIS SHELL NEVER HAD.
       createAppDetails opens two confirm modals (openModal), so hardware back could pop
       the page out from under one. Same grammar as ContactDetails' cdBack (N50 #370) and
       home's homeBack (#336). Self-heals a stale mirror by re-syncing, so back never wedges. */
    appDetailsBack() {
      if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
      syncAppDetailsOverlay();
    },
    // Q4-③ (#270): call-ui wiring GONE — calls present on the native CallPage.
    // init(...) — 14 positional args → the `app` model consumed by createAppDetails.
    init(name, iconPath, publisher, description, version, url, humanSize,
         capabilities, appId, hasSingleUser, hasMultiUser, installed, verified /*, _hardcodedTrue */) {
      app = {
        id: appId || '',
        name: name || '',
        icon: resolveIcon(iconPath), // parity with the apps tab; gradient until X1, then real image
        _iconPath: iconPath || '',  // raw path kept for reference
        publisher: publisher || '',
        description: description || '',
        version: version || '',
        size: humanSize || '',      // component reads app.size (metaRow "Size")
        url: url || '',
        capabilities: capabilities || '',   // string; normalizeCaps() splits on comma
        installed: asBool(installed),
        verified: asBool(verified),          // always false today → no badge
        hasSingleUser: asBool(hasSingleUser),
        hasMultiUser: asBool(hasMultiUser),
      };
      buildTopbar();
      render();
    },

    // install lifecycle — resolve the component's inline install morph.
    // showInstalling: button is already in the loading morph (onInstall set it) —
    // no extra modal, so this is a no-op ack.
    showInstalling() {},
    showInstallSuccess() {
      if (pendingInstallCtrl) { pendingInstallCtrl.done(); pendingInstallCtrl = null; }
      else if (app) { app.installed = true; render(); }   // resolved without a live ctrl
    },
    showInstallFailed() {
      // component's fail() restores the button + opens the "Install failed" modal
      if (pendingInstallCtrl) { pendingInstallCtrl.fail(); pendingInstallCtrl = null; }
    },

    // uninstall done — C# pushes this on success. Show the "removed" modal and
    // re-render the page as not-installed (Install CTA returns).
    showAppRemoved() {
      showAppRemovedModal({ host: document.body, strings });
      if (app) { app.installed = false; render(); }
    },
  };

  /* ★ L3 (#706): the iOS back signal — a confirm on the stack closes first (the level
     Session F gave hardware back), then the verb the topbar arrow sends. */
  attachEdgeBack({ onBack: () => {
    if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
    bridge.send('ixian:back');
  } });
  bridge.exposeAll(handlers);

  /* ★ L3 (Session F): mirror body[data-overlay-open] to C#. Deferred + coalesced (#337):
     bridge.send is a raw location.href assignment with no queue, so a state push must
     never share a navigation slot with a verb; state is read at FIRE time. */
  let adOverlaySyncT = 0;
  function syncAppDetailsOverlay() {
    if (adOverlaySyncT) return;
    adOverlaySyncT = setTimeout(() => {
      adOverlaySyncT = 0;
      try { bridge.send('ixian:appdetailsoverlay:' + (document.body.dataset.overlayOpen !== undefined ? '1' : '0')); } catch (e) {}
    }, 0);
  }
  try {
    new MutationObserver(syncAppDetailsOverlay).observe(document.body, { attributes: true, attributeFilter: ['data-overlay-open'] });
  } catch (e) {}

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s first init push. ——————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
