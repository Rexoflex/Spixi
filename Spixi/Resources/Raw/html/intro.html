<!-- #228 platform type flag (queued for launch at its next rebuild — this batch):
     desktop OS → compact desktop type/density (tokens.css :root[data-desktop]);
     set BEFORE first paint, constant across window resize. iPad (Macintosh UA +
     touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<style>
  /* The launch flow is a FIXED-DARK brand surface in BOTH themes (--gradient-
     launch, lock.html precedent #160): paint a deep dark IMMEDIATELY — launch
     previously had NO instant-bg at all, so a slow load flashed default-white. */
  html { background: #13171b; }
  /* Splash boot moment (Batch B, #256 ⑭) — dark-pinned variant (lock grammar):
     pulsing brand logo in white over the deep surface, dropped at window load. */
  .app-boot {
    position: fixed; inset: 0; z-index: 99;
    display: flex; align-items: center; justify-content: center;
    background: #13171b; transition: opacity var(--duration-200, 200ms) ease-out;
    /* never intercept input — see home.html app-boot note (audit B-1). */
    pointer-events: none;
  }
  .app-boot__logo { width: 64px; height: 64px; color: #ffffff; animation: app-boot-pulse 1.4s ease-in-out infinite; }
  .app-boot__logo svg { width: 100%; height: 100%; display: block; }
  @keyframes app-boot-pulse { 0%, 100% { opacity: 0.5; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .app-boot__logo { animation: none; } .app-boot { transition: none; } }
</style>

<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + env(safe-area-inset-top, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  color: var(--text-action-default);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */
.c-topbar .c-button[data-type="text"] {
  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

</style>
<style data-src="../styles/components/avatar.css">
/* c-avatar — photo or deterministic gradient placeholder (DECISIONS.md #34, #37).
   Hues (--av-h1/--av-h2) come from JS per identity; S/L below are themed so the
   gradient tracks the mode: light = deep gradient + white ink (inverse-01),
   dark = pastel gradient + dark ink (inverse-01 flips). */

:root {
  --avatar-grad-s1: 58%; --avatar-grad-l1: 48%;
  --avatar-grad-s2: 55%; --avatar-grad-l2: 34%;
}
[data-theme="dark"] {
  --avatar-grad-s1: 52%; --avatar-grad-l1: 62%;
  --avatar-grad-s2: 48%; --avatar-grad-l2: 48%;
}

.c-avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  border-radius: var(--radius-full);
  /* B5 (#231): container border DROPPED — gradient placeholders go borderless
     (Telegram-class, lighter list rhythm); the hairline moves to the PHOTO img
     only (below) so a light photo still separates from a light surface. Outer
     size unchanged (border-box) → photo and gradient variants render the same
     footprint + identical circular mask. */
  color: var(--text-neutral-inverse-01); /* initials/glyph over gradient */
  overflow: visible;
}

/* Known sizes from size tokens (unknown sizes: inline fallback in avatar.js).
   Initials scale ≈ 0.38 × avatar size. */
.c-avatar[data-size="24"] { width: var(--size-avatar-24); height: var(--size-avatar-24); }
.c-avatar[data-size="24"] .c-avatar__initials { font-size: 9px; }
.c-avatar[data-size="40"] { width: var(--size-avatar-40); height: var(--size-avatar-40); }
.c-avatar[data-size="40"] .c-avatar__initials { font-size: 15px; }
.c-avatar[data-size="48"] { width: var(--size-avatar-48); height: var(--size-avatar-48); }
.c-avatar[data-size="48"] .c-avatar__initials { font-size: 18px; }
/* W2 (#302): 64 = the chat-info HERO. It has rendered at that size since #142 but
   had no rule here at all, so it fell through to avatar.js's inline width/height
   fallback and its initials kept the base font-size instead of the 0.38× scale.
   Sizing stays inline — no --size-avatar-64 token exists yet (flag at the next
   Figma mirror); this pins the initials scale and the hero-scale presence dot. */
.c-avatar[data-size="64"] .c-avatar__initials { font-size: 24px; }
.c-avatar[data-size="64"] .c-avatar__dot { width: 16px; height: 16px; }

.c-avatar[data-placeholder] {
  background-image: linear-gradient(135deg,
    hsl(var(--av-h1, 0), var(--avatar-grad-s1), var(--avatar-grad-l1)),
    hsl(var(--av-h2, 40), var(--avatar-grad-s2), var(--avatar-grad-l2)));
}

.c-avatar__img {
  width: 100%;
  height: 100%;
  border-radius: var(--radius-full);
  border: var(--outline-width-1) solid var(--outline-neutral-02); /* B5 (#231): photos-only hairline */
  object-fit: cover;
}

.c-avatar__initials {
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  letter-spacing: 0;
  user-select: none;
  -webkit-user-select: none; /* WebKit honors only the prefixed form */
}

.c-avatar__dot {
  position: absolute;
  inset-inline-end: 0; /* RTL-logical (audit) */
  inset-block-end: 0;
  width: 12px;  /* sanctioned: dot scale is avatar-relative, not a size token */
  height: 12px;
  border-radius: var(--radius-full);
  background: var(--surface-presence-online);
  /* ring = surface-screen: shows a mismatched halo on hover/selected row surfaces —
     known + accepted for now; proper fix needs a design decision (audit LOW) */
  border: var(--outline-width-2) solid var(--surface-screen);
}

</style>
<style data-src="../styles/components/overlay.css">
/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }

/* —— bottom sheet (z-40, above its scrim by source order) —— */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
}

.c-modal__actions {
  display: flex;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②) */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 260px; }
:root[data-desktop] [data-dt-ctx-source] { background: var(--surface-interactive-selected); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

<style data-src="../styles/components/lock-shell.css">
/* c-lock / c-encpass — unlock · confirm-action · change-encryption-password
   (docs/lock-spec.md, Phase 1 #4). Token surfaces throughout; the unlock
   screen is a boot takeover with NO topbar (no back from lock). */

/* #160 (Damir): fixed-dark BRAND surface — the JS pins data-theme="dark" on
   the section (subtree token pin, #20 precedent) and --gradient-lock never
   flips, so both themes render the same purple/blue multi-angle moment. */
.c-lock {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  background: var(--gradient-lock);
  padding: var(--spacing-24);
  /* #160b⑧: the gradient BLEEDS under the OS statusbar (LockPage owns the
     whole screen) — content stays clear of the notch/inset, paint doesn't.
     Bottom: the hatch/cancel footer clears the home indicator the same way. */
  padding-top: max(var(--spacing-24), env(safe-area-inset-top));
  padding-bottom: calc(var(--spacing-24) + env(safe-area-inset-bottom, 0px));
}
/* #160b zones (Damir): brand centers in the UPPER share (1.2fr), the action
   cluster lands in the lower half (form top ≈ 63% of free space with the
   0.7fr spacer below), hatch/cancel = quiet footer. Tune the two flex
   ratios to slide the cluster. */
.c-lock__brand {
  flex: 1.2 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-12);
  text-align: center;
}
.c-lock__form {
  flex: none;
  width: 100%;
  max-width: 320px;                 /* sanctioned: form measure on the 419px frame */
  display: flex;
  flex-direction: column;
  gap: var(--spacing-16);
}
.c-lock__spacer { flex: 0.7 1 0; min-height: var(--spacing-16); }
/* #264 (Q14, Damir: "lock overlaps at the smallest size"): at short viewports
   (desktop min-window 384px wide can be SHORT too, #231c) the fixed zone
   ratios ran the brand into the form. Below 560px height: the whole surface
   SCROLLS instead of squeezing (flex zones stop absorbing), the brand block
   compresses (smaller glow, tighter gaps) and nothing can overlap. */
@media (max-height: 560px) {
  .c-lock { overflow-y: auto; justify-content: flex-start; }
  .c-lock__brand { flex: none; padding-block: var(--spacing-16); gap: var(--spacing-8); }
  .c-lock__brand svg { width: 40px; height: 40px; }
  .c-lock__logo { margin-bottom: 0; }
  .c-lock__spacer { flex: none; min-height: var(--spacing-8); }
  .c-lock__form { margin-top: var(--spacing-8); }
}
.c-lock__tail {
  flex: none;
  width: 100%;
  max-width: 320px;                 /* sanctioned: form measure */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-4);
  padding-bottom: var(--spacing-8);
}
/* #160: bare glyph, NO disc (Damir) — a soft brand glow instead of chrome */
.c-lock__logo {
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--spacing-8);
  color: var(--icon-accent);        /* dark-pinned subtree → accent-300 */
  filter: drop-shadow(0 0 28px rgba(123, 92, 255, 0.55)); /* sanctioned: glow on the fixed gradient */
}
.c-lock__title {
  margin: 0;
  min-width: 0;
  text-align: center;
  color: var(--text-neutral-01);
  font-family: var(--font-display);         /* #231 brand opt-in: lock is a brand moment (B1/#226 exception) */
  font-size: var(--font-size-heading-sm);   /* #58: all titles heading-sm */
  font-weight: var(--font-weight-semibold);
}
.c-lock__copy {
  margin: 0;
  min-width: 0;
  text-align: center;
  color: var(--text-neutral-02);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-sm);
}

.c-lock__input {
  width: 100%;
  min-height: 48px;                 /* sanctioned: #160 premium rhythm beside 56 buttons */
  padding: var(--spacing-8) var(--spacing-12);
  border: var(--outline-width-1) solid var(--outline-neutral-02);
  border-radius: var(--radius-12);
  background: var(--surface-input);
  color: var(--text-neutral-01);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-md);
}
/* #160: on the lock gradient the input goes GLASS (scan on-camera wash
   precedent) — encpass keeps the token surface via its own card scope */
.c-lock .c-lock__input {
  background: rgba(255, 255, 255, 0.07);   /* sanctioned: glass on the fixed gradient */
  border-color: rgba(255, 255, 255, 0.16); /* sanctioned */
}
.c-lock__input::placeholder { color: var(--text-neutral-02); }
.c-lock__input:focus-visible {
  outline: var(--outline-width-2) solid var(--outline-action-default);
  outline-offset: 1px;              /* #51 text-field focus grammar */
  border-color: var(--outline-action-default);
}
/* —— show-password eye (#160b⑦) — OURS, cross-platform: the #152① native
   ::-ms-reveal is WebView2-only (Android/iOS WebKit have none), so the shell
   owns the toggle and the native eye is SUPPRESSED (no double eye).
   settings-backup keeps its native-eye approach — its own surface. —— */
.c-lock__input::-ms-reveal { display: none; }
.c-lock__field {
  position: relative;
  width: 100%;
  display: flex;
}
.c-lock__field .c-lock__input {

}
.c-lock__reveal {
  position: absolute;
  inset-inline-end: var(--spacing-4);
  top: 50%;
  transform: translateY(-50%);      /* vertical only — RTL-safe */
  width: 36px;                      /* sanctioned: icon-button target inside a 48px field */
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-8);
  background: transparent;
  color: var(--text-neutral-02);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (hover: hover) and (pointer: fine) { .c-lock__reveal:hover { color: var(--text-neutral-01); } }
.c-lock__reveal:focus-visible {
  outline: var(--outline-width-2) solid var(--outline-action-default);
  outline-offset: 1px;
}

.c-lock__error {
  margin: 0;
  min-width: 0;
  color: var(--text-error);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-sm);
}
/* [hidden] handled by the base.css !important rule */

/* quiet escape hatch (unlock mode only) — a text link, not a button row */
.c-lock__hatch {
  align-self: center;
  border: 0;
  background: transparent;
  padding: var(--spacing-8);
  color: var(--text-neutral-02);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-sm);
  text-decoration: underline;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;

@media (hover: hover) and (pointer: fine) { .c-lock__hatch:hover { color: var(--text-neutral-01); } }
.c-lock__hatch:focus-visible {
  outline: var(--outline-width-2) solid var(--outline-action-default);
  outline-offset: 1px;
  border-radius: var(--radius-8);
}

/* —— encpass —— */
.c-encpass {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--surface-screen);
}
.c-encpass__body {
  flex: 1;
  min-height: 0;                    /* flex-column scroll rule (#136①) */
  display: flex;
  flex-direction: column;
  gap: var(--spacing-16);
  padding: var(--spacing-16) var(--spacing-16) var(--spacing-32);
}
.c-encpass__body > * { flex: none; }  /* #148③/#150① class */
.c-encpass__note {
  margin: 0;
  min-width: 0;
  color: var(--text-neutral-02);
  font-family: var(--font-secondary);
  font-size: var(--font-size-body-sm);

.c-encpass__card {

.c-encpass__card .c-lock__input { background: var(--surface-input); }
.c-encpass__footer {

  /* #314 (Damir screenshot): the Change-password CTA sat ON the iOS home
     indicator — clear it (launch-shell.css:281 canonical pattern; env = 0 elsewhere) */
  padding-bottom: calc(var(--spacing-12) + env(safe-area-inset-bottom, 0px));
  border-top: var(--outline-width-1) solid var(--outline-neutral-01);
  background: var(--surface-screen);
}

/* —— desktop: pane content rail + in-flow CTA (Damir 2026-08-12) ——
   settings_encryption.html opens as a pane over the Account on desktop (W7: it
   now COVERS its opener exactly — SettingsPage's ixian:encpass branch — where it
   used to be pinned to the detail column alone), so the page is as wide as that
   pane: the three fields stretched to ~900px and the sticky CTA sat at
   the very bottom with a screen-height dead gap above it. Desktop therefore
   (a) holds the shared pane rail (--layout-pane-content-max — the "How to use

   button lands directly under the inputs. `flex: 0 1 auto` keeps min-height:0,

:root[data-desktop] .c-encpass__body {

/* #341: the centring rail belongs to the STANDALONE page only. In the Account pane

   --layout-pane-content-max, and `box-sizing: border-box` makes a second rail eat

:root[data-desktop] body:not([data-pane]) .c-encpass__body {

:root[data-desktop] .c-encpass__footer {
  display: flex;
  justify-content: center;
  border-top: 0;                    /* no longer a bar edge — it is in flow now */
  background: transparent;
  padding-block-start: 0;
  padding-inline: var(--spacing-16);
}
/* #341 review MINOR-5: the footer carries the SAME rail as the body, so it needed
   the SAME scoping. Inside the pane the detail region already caps this element, and
   border-box then let the percentage padding eat the capped width — on a 1128px
   detail region the footer content box fell to about 152px, and it got narrower as
   the window widened. The CTA survived only because min-width:240px re-centred it. */
:root[data-desktop] body:not([data-pane]) .c-encpass__footer {
  padding-inline: max(var(--spacing-16), calc((100% - var(--layout-pane-content-max)) / 2));

  /* —— which legacy page is hosting this shell? ————————————————————————————— */
  const VIEWS = ['welcome', 'create', 'restore', 'retry', 'tail'];
  const bootRaw = window.__LAUNCH_VIEW__
    || new URLSearchParams(location.search).get('view')
    || 'welcome';
  const view = VIEWS.includes(bootRaw) ? bootRaw : 'welcome';

  /* —— bridge transport ————————————————————————————————————————————————————
   * Serialize outgoing ixian: commands. The MAUI WebView processes ONE URL
   * navigation at a time, so a rapid double `location.href` (accept + create on
   * the welcome page) would drop the first. A tiny queue delivers each on its own
   * macrotask — C# cancels every ixian: navigation (e.Cancel), leaving the WebView
   * on the same page, so the next command fires cleanly. Also hardens every other
   * emit path against an accidental back-to-back send. */
  const outbox = [];
  let draining = false;
  function drain() {
    if (!outbox.length) { draining = false; return; }
    window.location.href = outbox.shift();
    setTimeout(drain, 0);
  }
  function emit(command) {
    outbox.push(command);
    if (!draining) { draining = true; drain(); }
  }
  const bridge = createNativeBridge({ emit });   // send() → the serialized queue
  installExecuteUiCommand();                      // defines window.executeUiCommand for C#

  const host = document.body;
  const root = document.getElementById('launch-root');

  /* —— consent ————————————————————————————————————————————————————————————
   * LaunchPage.onLoad pushes showTerms only when terms are NOT yet accepted. We
   * record consent (ixian:accept) ONCE, at the first Create/Restore tap on the
   * WELCOME page — the only page whose C# handler processes ixian:accept (the
   * create/restore/retry pages don't). Premium round: "continuing = agreeing"
   * (the fine-print consent line + in-app Terms/Privacy sheets render on the
   * create/restore forms; the binding tap is the welcome CTA that navigates). */
  let termsRequired = false, acceptSent = false;
  function recordConsent() {
    if (!termsRequired || acceptSent) return;
    acceptSent = true;
    bridge.send('ixian:accept');
  }

  /* —— active locale ————————————————————————————————————————————————————————
   * A4 (Opus #46 loop): the shell never told launch-shell WHICH locale is active,
   * so the language pill always showed LAUNCH_LANGS[0] (en-us) no matter what the
   * account language was — and the hidden-locale fallback row could never engage.
   * Reuse the boot carrier (window.__SPIXI_LANG__, set beside window.SL above); an
   * un-substituted marker or ?lang=pseudo fails the shape test → en-us, as before. */
  const langRaw = String(window.__SPIXI_LANG__ || '');
  const language = /^[a-z]{2}-[a-z]{2}$/.test(langRaw) ? langRaw : 'en-us';

  /* —— per-view wiring ———————————————————————————————————————————————————— */
  const baseOpts = { view, host, strings, language };
  let opts = baseOpts;
  let handlers = {};
  let readyCmd = null;             // the ready/onload verb this page's C# expects
  let createCtrl = null, restoreCtrl = null, retryCtrl = null;

  const baseName = (p) => String(p || '').replace(/\\/g, '/').split('/').pop();

  if (view === 'welcome') {
    // intro.html · LaunchPage
    opts = Object.assign({}, baseOpts, {
      // language / appearance persist + RELOAD intro.html C#-side (LaunchPage
      // onNavigating) — fire-and-forget; the reload re-boots this welcome shell.
      onLanguage: (code) => bridge.send('ixian:language:' + code),
      onAppearance: (idx) => bridge.send('ixian:appearance:' + idx),
      // welcome CTAs NAVIGATE to the real create/restore pages (the hooks added
      // to launch-shell.js) instead of switching in place — a bare LaunchPage
      // can't process create:<nick>:<password>. Consent rides the first tap.
      onGoCreate: () => { recordConsent(); bridge.send('ixian:create'); },
      onGoRestore: () => { recordConsent(); bridge.send('ixian:restore'); },
    });
    handlers = {
      setVersion: (v) => setLaunchVersion(el, v),
      showTerms: () => { termsRequired = true; },      // arm the one-shot ixian:accept
      showOnboardingSection: () => {},                 // legacy no-op: welcome always shows CTAs
    };
    readyCmd = 'ixian:introload';                       // LaunchPage's onLoad trigger (NOT ixian:onload)
  } else if (view === 'create') {
    // intro_new.html · LaunchCreatePage
    opts = Object.assign({}, baseOpts, {
      onPickAvatar: () => bridge.send('ixian:avatar'),  // native picker → loadAvatar(path)
      // Loading until C# resolves (spec §2.2): on success C# generates the wallet
      // then navigates to Home + tears this page down (the morph never resolves —
      // correct); on FAILURE C# now shows the native alert AND pushes
      // removeLoadingOverlay (#334 L1, was the wedge: no release signal → inputs +
      // button permanently dead). Capture the ctrl so that push can release it.
      onCreateAccount: (nick, pass, ctrl) => { createCtrl = ctrl; bridge.send('ixian:create:' + nick + ':' + pass); },
      onBack: () => bridge.send('ixian:back'),          // C# pops LaunchCreatePage → welcome
    });
    handlers = {
      setVersion: (v) => setLaunchVersion(el, v),
      // loadAvatar(path) — native picker result. The absolute file path doesn't
      // resolve inside the self-contained shell (repo-wide avatar flag) → the
      // preview falls back to the deterministic gradient. Wired for honesty.
      loadAvatar: (path) => setLaunchAvatar(el, path || null),
      // #334 L1: create-failure release. SILENT fail('') — the retry-view grammar
      // (see the retry branch below): the native alert already carries the words;
      // fail('') re-enables the form + keeps the typed values for a retry.
      removeLoadingOverlay: () => { if (createCtrl) createCtrl.fail(''); },
    };
    readyCmd = 'ixian:onload';                          // LaunchCreatePage.onLoad → setVersion
  } else if (view === 'restore') {
    // intro_restore.html · LaunchRestorePage (NO onload handler → no ready verb)
    opts = Object.assign({}, baseOpts, {
      onSelectFile: () => bridge.send('ixian:selectfile'),   // native file picker → setUploadedFileName
      onRestore: (pass, ctrl) => { restoreCtrl = ctrl; bridge.send('ixian:restore:' + pass); },
      onBack: () => bridge.send('ixian:back'),
    });
    handlers = {
      // C# sends the full tmp filepath — display the basename (legacy parity,
      // intro_restore.html:135). Confirms a file was picked + enables submit.
      setUploadedFileName: (path) => setLaunchFile(el, baseName(path)),
      // wrong password → inline error on the field (spec §2.3). One-shot latch:
      // C# fires showPasswordError THEN removeLoadingOverlay — the error wins.
      showPasswordError: () => { if (restoreCtrl) restoreCtrl.fail(strings.restoreFailed || 'That password didn’t open the backup.'); },
      removeLoadingOverlay: () => { if (restoreCtrl) restoreCtrl.fail(''); },   // latched no-op after the error; bare release otherwise
    };
  } else if (view === 'retry') {
    // intro_retry.html · LaunchRetryPage (NO onload handler → no ready verb)
    opts = Object.assign({}, baseOpts, {
      onRetry: (pass, ctrl) => { retryCtrl = ctrl; bridge.send('ixian:proceed:' + pass); },
      onBack: () => bridge.send('ixian:back'),
    });
    handlers = {
      // wrong password = NATIVE alert + removeLoadingOverlay → SILENT restore
      // (fail('') keeps the value, no inline dup — the alert already spoke;
      // the unlock-screen grammar, spec §2.4).
      removeLoadingOverlay: () => { if (retryCtrl) retryCtrl.fail(''); },
    };
  } else {
    // onboarding.html · OnboardPage (tail — modal presented by HomePage after
    // create; NO onload handler, NO back per spec §2.5).
    // On the Join path the component calls onJoinBot() THEN onFinish() (its SPA
    // model: "add the bot" + "complete onboarding" are two steps). But the native
    // OnboardPage's `ixian:joinbot` ALREADY finishes onboarding + pops the modal
    // (OnboardPage.xaml.cs:36 → finishOnboarding), so a trailing `ixian:finish`
    // would double-fire onboardDone + pop the page beneath. Guard: joinbot and
    // finish are MUTUALLY EXCLUSIVE terminal verbs — emit finish only when the
    // user did NOT join. (Skip only calls onFinish → ixian:finish.)
    let tailJoined = false;
    opts = Object.assign({}, baseOpts, {
      // #334 L3/AND-5: "Back up now" is LIVE — OnboardPage now handles
      // ixian:backup (→ BackupPage.backupAccount(), the #243 static: share-sheet
      // LAUNCH, C# names every path). Mirror the settings backup-stamp semantics
      // (settings.html BACKUP_STAMP_KEY: timestamp ONLY, no addresses/content —
      // #254 storage-partition rule); home reads it lazily at badge/nudge
      // evaluation, so there is no race with the HomePage beneath this modal.
      // NON-terminal: the component advances to the join step itself (toJoin),
      // and the joinbot/finish mutual-exclusion latch below is untouched.
      onBackupNow: () => {
        try { localStorage.setItem('spixi.backup.last', String(Date.now())); } catch (e) {}
        bridge.send('ixian:backup');
      },
      onJoinBot: () => { tailJoined = true; bridge.send('ixian:joinbot'); },  // OnboardPage → joinBot + finish + pop
      onFinish: () => { if (!tailJoined) bridge.send('ixian:finish'); },      // skip path only (joinbot already finished)
    });
    handlers = {};   // no C#→JS pushes for the tail
  }

  const el = createLaunchShell(opts);
  root.append(el);
  bridge.exposeAll(handlers);

  /* —— page ready — fire the page's ready verb on window LOAD (#177 load-timing
   *    invariant): firing during parse races C#'s first push. Restore/retry/tail
   *    have no C# onload handler, so they send nothing (the boot cover still
   *    drops for them — signalReady runs on every view). ————————————————————— */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant),
  // transitionend + timeout fallback (the #29 morph pattern).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }

  function signalReady() { dropAppBoot(); if (readyCmd) bridge.send(readyCmd); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
<script>if(!window.Spixi){console.error("SPIXI: bundle did not load");document.documentElement.innerHTML='<pre style="margin:0;padding:24px;font:13px/1.5 monospace;color:#f66;background:#13171b">Spixi could not load spixi.bundle.js.\n\nThe shell and its shared assets must sit in the SAME folder.\nRe-run: node scripts/build-shells.mjs</pre>';}</script>
</body>
