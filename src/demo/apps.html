<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spixi Apps shell — demo</title>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/bottomnav.css">
<link rel="stylesheet" href="../styles/components/avatar.css">
<link rel="stylesheet" href="../styles/components/chip.css">
<link rel="stylesheet" href="../styles/components/search-field.css">
<link rel="stylesheet" href="../styles/components/badge.css">
<link rel="stylesheet" href="../styles/components/overlay.css">
<link rel="stylesheet" href="../styles/components/toast.css">
<link rel="stylesheet" href="../styles/components/message-menu.css">
<link rel="stylesheet" href="../styles/components/apps-icon.css">
<link rel="stylesheet" href="../styles/components/apps-item.css">
<link rel="stylesheet" href="../styles/components/apps-shell.css">
<link rel="stylesheet" href="../styles/components/apps-recents.css">
<link rel="stylesheet" href="../styles/components/apps-header.css">
<link rel="stylesheet" href="../styles/components/apps-add.css">
<link rel="stylesheet" href="../styles/components/apps-details.css">
<link rel="stylesheet" href="../styles/components/apps-discover.css">
<link rel="stylesheet" href="../styles/components/empty-state.css">
<style>
  body { padding: var(--spacing-24); }
  .demo-toolbar { display: flex; gap: var(--spacing-12); align-items: center; max-width: 900px; margin: 0 auto var(--spacing-32); }
  .demo-frames { display: flex; gap: var(--spacing-32); flex-wrap: wrap; justify-content: center; }
  .demo-phone {
    width: 419px; height: 860px; display: flex; flex-direction: column;
    border: 1px solid var(--outline-neutral-02); border-radius: var(--radius-32);
    overflow: hidden; background: var(--surface-screen);
    box-shadow: var(--elevation-2); position: relative;
  }
  .demo-caption { text-align: center; margin-top: var(--spacing-12); color: var(--text-neutral-02); font-size: var(--font-size-body-sm); }
  .statusbar {
    height: 44px; flex: none; display: flex; align-items: end; justify-content: space-between;
    padding: 0 var(--spacing-24) var(--spacing-4);
    font-weight: var(--font-weight-bold); font-size: var(--font-size-label-md);
  }
  .content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
</style>
</head>
<body>
  <div class="demo-toolbar">
    <h1 class="t-heading-md" style="margin-right:auto">Apps shell</h1>
    <span id="theme-slot"></span>
  </div>

  <div class="demo-frames">
    <div>
      <div class="demo-phone">
        <div class="statusbar"><span>9:41</span><span>▮▮▮ ⌁ ▮</span></div>
        <div id="apps-topbar"></div>
        <div class="content" id="apps-content"></div>
        <div id="apps-nav"></div>
      </div>
      <div class="demo-caption">Apps shell — installed list ⇄ grid toggle · search · Explore banner (parked) · per-app ⋮ menu · topbar "Add app" → details/installer</div>
    </div>
  </div>

<script src="../components/icons.iife.js"></script>
<script src="strings.iife.js"></script>
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || 'en-us');</script>
<script src="spixi.iife.js"></script>
<script>
  const {
    createTopbar, createBottomNav, createButton,
    createAppsList, renderAppsList, setAppsQuery, setAppsLayout, recordRecent,
    createAppsRecents, renderAppsRecents,
    createAppsHeader, setAppsHeaderEmpty, createAppsAdd, setAddUrl, setAddError, createAppDetails,
    setAddDiscoverFeed, parseAppsFeed, APPS_FEED_URL,
    showAppInstalling, showAppInstalled, showAppRemoved,
    closeModal, showToast,
  } = window.Spixi;
  const icon = window.SpixiIcons.icon;
  if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';

  const themeBtn = createButton({
    label: document.documentElement.dataset.theme === 'dark' ? 'Toggle light' : 'Toggle dark',
    type: 'outline', size: 32,
    onClick: () => {
      const root = document.documentElement;
      const dark = root.dataset.theme === 'dark';
      root.classList.add('theme-switching');
      root.dataset.theme = dark ? 'light' : 'dark';
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-switching')));
      themeBtn.querySelector('.c-button__label').textContent = dark ? 'Toggle dark' : 'Toggle light';
    },
  });
  document.getElementById('theme-slot').append(themeBtn);

  const phone = document.querySelector('.demo-phone');
  const topbar = document.getElementById('apps-topbar');
  const content = document.getElementById('apps-content');
  const toast = (text, tone) => showToast({ text, tone: tone || 'info', host: phone });

  const NAV_ITEMS = [
    { id: 'chats', label: 'Chats', icon: 'messages' },
    { id: 'apps', label: 'Apps', icon: 'apps' },
    { id: 'wallet', label: 'Wallet', icon: 'wallet' },
    { id: 'account', label: 'Account', icon: 'user-circle' },
  ];
  document.getElementById('apps-nav').append(createBottomNav({ items: NAV_ITEMS, active: 'apps' }));

  /* —— mock installed apps (mirrors bridge addApp; creator = §8 publisher) —— */
  const APPS = [
    // reverse-DNS id matches the live directory feed → Discover badges it "Installed" (#131)
    { id: 'com.ixilabs.spixi.tictactoe', name: 'TicTacToe', creator: 'IXI Labs', installed: true, verified: true,
      description: 'Play and win a game of Tic-Tac-Toe with a friend, right inside your chat. Take turns, track your score across rounds, and challenge anyone in your contacts to a quick match — no sign-up, no downloads, it just runs inside Spixi.',
      version: '1.2.0', size: '240 KB', url: 'https://apps.spixi.io/tictactoe/appinfo.spixi', capabilities: ['MultiUser'],
      screenshots: ['https://picsum.photos/seed/ttt1/360/640', 'https://picsum.photos/seed/ttt2/360/640', 'https://picsum.photos/seed/ttt3/360/640'],
      related: [{ id: 'starwind', name: 'Starwind Arena' }, { id: 'sushi', name: 'Sushi Master' }, { id: 'mistral', name: 'Mistral Roads' }] },
    { id: 'starwind', name: 'Ixian Starwind Arena', creator: 'IXI Labs', installed: true, verified: true,
      description: 'A fast-paced multiplayer space arena. Team up and battle across the galaxy.',
      version: '0.9.1', size: '1.4 MB', url: 'https://apps.spixi.io/starwind/appinfo.spixi', capabilities: ['MultiUser', 'Storage'],
      cover: 'https://picsum.photos/seed/starwindcover/900/400',
      screenshots: ['https://picsum.photos/seed/sw1/360/640', 'https://picsum.photos/seed/sw2/360/640'] },
    { id: 'mistral', name: 'Mistral Roads', creator: 'Jean Pierre B', installed: true,
      description: 'Plan road trips across Europe with friends.',
      version: '2.0', size: '820 KB', url: 'https://apps.spixi.io/mistral/appinfo.spixi', capabilities: ['Storage'] },
    { id: 'sushi', name: 'Sushi Master', creator: 'Hiro Nakamura', installed: true,
      description: 'Learn to roll the perfect sushi, step by step.',
      version: '1.0', size: '640 KB', url: 'https://apps.spixi.io/sushi/appinfo.spixi', capabilities: [] },
    { id: 'sunny', name: 'Is it sunny — Weather app', creator: 'Spoony', installed: true,
      description: 'A tiny, friendly weather companion.',
      version: '3.1', size: '180 KB', url: 'https://apps.spixi.io/sunny/appinfo.spixi', capabilities: ['Storage'] },
    { id: 'vintage', name: 'Vintage shoes store', creator: 'Vinted', installed: true,
      description: 'Buy and sell vintage sneakers with in-chat payments.',
      version: '1.5', size: '2.1 MB', url: 'https://apps.spixi.io/vintage/appinfo.spixi', capabilities: ['TransactionSigning', 'Storage'] },
    { id: 'pizza', name: 'Pizzeria Scanner', creator: 'IXI Labs', installed: true,
      description: 'Scan a menu and order in seconds.',
      version: '0.4', size: '310 KB', url: 'https://apps.spixi.io/pizza/appinfo.spixi', capabilities: [] },
    { id: 'smoothie', name: 'Smoothie recipes', creator: 'IXI Labs', installed: true,
      description: 'Fresh smoothie ideas, blended daily.',
      version: '1.1', size: '95 KB', url: 'https://apps.spixi.io/smoothie/appinfo.spixi', capabilities: [] },
  ];

  const state = { apps: APPS.slice(), query: '', layout: 'list', recents: ['com.ixilabs.spixi.tictactoe', 'sunny', 'mistral'] };
  // A4 precedent (home.html): `{}` pins every component to its English fallback
  // even when window.SL carries a real locale — and this shell is the packaged
  // AppsPage drop-in, not only a demo. Thread the ACTIVE dictionary.
  const strings = window.SL || {};

  // primary tap launches the app + records it in Recently used (re-renders the strip)
  function launchApp(app) {
    recordRecent(state, app);
    renderAppsRecents(recentsEl, state, opts);
    toast('Launch ' + app.name + ' — demo only');
  }

  const opts = {
    strings, host: phone,
    onLaunch: (app) => launchApp(app),                 // tap → LAUNCH
    onOpen: (app) => showDetails(app),                 // ⋮ → App details
    onUninstall: (app) => toast(app.name + ' uninstalled'),
    onModelChange: () => {},
    // empty state (nothing installed): art ships BESIDE the shell as images/… —
    // build-shells copies src/demo/images → Resources/Raw/html/images, so the same
    // relative ref resolves in the demo AND in the packaged AppsPage shell.
    emptyIllustration: 'images/apps-es.png',
    onAddApp: () => showAdd(),
  };

  const list = createAppsList(state, opts);
  const recentsEl = createAppsRecents(state, opts);
  const header = createAppsHeader({
    layout: state.layout, strings, discover: false,   // discover now lives in the Add surface
    // ⚠ was '../assets/images/discover-apps.svg' — that path does NOT exist next to the
    // PACKAGED shell (build-shells writes this file to Resources/Raw/html/), so the
    // banner illustration silently failed in the real app. images/… is the shipped one.
    exploreImage: 'images/explore-banner.png',
    onQuery: (q) => setAppsQuery(list, state, q, opts),
    onToggleLayout: (next) => setAppsLayout(list, state, next, opts),
    onExplore: () => showAdd(),                        // Explore → Add & Discover surface
  });

  /* —— view switching —— */
  function showInstalled() {
    // Damir 2026-08-12: a labelled TEXT action, not a bare "+" (see home.html rationale —
    // this flow INSTALLS an existing app from a link/QR/file, so "Add app", not "New app")
    topbar.replaceChildren(createTopbar({
      variant: 'root', title: 'Apps',
      actions: [{
        // this file is ALSO the packaged AppsPage drop-in (build-shells SHELLS.apps),
        // so the button has to localize like every other label in the shell instead
        // of shipping English to a translated user.
        icon: 'circle-plus',
        text: strings.addApp || 'Add app',
        label: strings.addMiniApp || 'Add mini app',
        onClick: showAdd,
      }],
    }));
    renderAppsRecents(recentsEl, state, opts);
    renderAppsList(list, state, opts);
    setAppsHeaderEmpty(header, !state.apps.length);
    content.replaceChildren(header, recentsEl, list);
  }
  function pushTopbar(title) {
    topbar.replaceChildren(createTopbar({ variant: 'view', title, onBack: showInstalled }));
  }
  function showDetails(app) {
    // resolve to the live installed entry when we have it — related tiles carry bare {id,name}
    // stubs and would otherwise render an installed app as installable (cosmetic, demo-only)
    app = state.apps.find((x) => x.id === app.id) || app;
    // back-only bar: the app name lives in the details hero right below — no vertical repeat (Damir)
    topbar.replaceChildren(createTopbar({ variant: 'view', title: '', onBack: showInstalled }));
    content.replaceChildren(createAppDetails({
      app, strings, host: phone,
      onLaunch: (a) => launchApp(a),
      onOpen: (a) => showDetails(a),               // related tiles → that app's details
      onCopyUrl: () => {},
      // mock bridge install: run the "install", then ctrl.done() drives the button morph
      onInstall: (a, ctrl) => {
        setTimeout(() => {
          a.installed = true;
          if (!state.apps.some((x) => x.id === a.id)) state.apps = [a, ...state.apps];
          renderAppsList(list, state, opts);
          ctrl.done();
        }, 1400);
      },
      onInstalled: (a) => showDetails(a),          // re-render details as installed (Open)
      onUninstall: (a) => runUninstall(a),
    }));
  }
  let addEl = null;
  function showAdd() {
    pushTopbar('Add mini app');
    addEl = createAppsAdd({
      strings,
      onCategory: (c) => toast(c),
      onFetchUrl: (url) => {
        if (!url) { setAddError(addEl); return; }
        showDetails({ id: 'fetched', name: 'Fetched Mini App', creator: 'Unknown publisher', installed: false,
          description: 'A mini app fetched from a link. Review its permissions before installing.',
          version: '1.0', size: '—', url, capabilities: ['Storage'] });
      },
      onScan: () => { setAddUrl(addEl, 'https://apps.spixi.io/tictactoe/appinfo.spixi'); toast('Scanned — link filled in'); },
      onPickFile: () => showDetails({ id: 'filed', name: 'Local Mini App', creator: 'From file', installed: false,
        description: 'A mini app loaded from a file. Review its permissions before installing.',
        version: '1.0', size: '512 KB', capabilities: ['MultiUser', 'Storage'] }),
      // both route through the external-link confirm in the real shell; toast-mocked here
      onBrowseWeb: () => toast('Would open apps.spixi.io (external-link confirm)'),
      onLearnBuild: () => toast('Would open the mini-app resources page (external-link confirm)'),
      onOpenApp: (a) => showDetails(a),                 // live-Discover card → details (installed → Open pill)
    });
    content.replaceChildren(addEl);
    loadDiscoverFeed(addEl);
  }

  /* —— live Discover (#131): fetch the real directory, fall back to a snapshot —— */
  // Snapshot of https://apps.spixi.io/data/apps.json (2026-07-05) so the file:// demo
  // shows the live experience even when fetch is blocked; the real shell fetches live
  // (transport question — direct vs bridge proxy — logged for BE, §9).
  const FEED_SNAPSHOT = { categories: ['All', 'AI', 'Games', 'IoT', 'Tools', 'Dev Tools'], apps: [
    { id: 'com.ixilabs.spixi.auth', name: 'Spixi Authenticator', publisher: 'IXI Labs', description: 'QR code authentication utility for secure Spixi identity verification.', category: 'Tools', featured: false, version: '1.0.0', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.auth.spixi', singleUser: true, multiUser: false },
    { id: 'com.ixilabs.spixi.gate-control', name: 'Gate Control', publisher: 'IXI Labs', description: 'QuIXI Gate Control example app for IoT device management.', category: 'IoT', featured: false, version: '1.0.2', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.gate-control.spixi', multiUser: true },
    { id: 'com.ixilabs.spixi.starwind-arena', name: 'StarWind Arena', publisher: 'IXI Labs', description: 'Classic multi-player tanks game. Play with friends through Spixi.', category: 'Games', featured: true, version: '1.0.0', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.starwind-arena.spixi', multiUser: true },
    { id: 'com.ixilabs.spixi.tictactoe', name: 'Tic-Tac-Toe', publisher: 'IXI Labs', description: 'Classic multi-player Tic-Tac-Toe game. Play with friends through Spixi.', category: 'Games', featured: true, version: '1.0.7', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.tictactoe.spixi', multiUser: true },
    { id: 'com.ixilabs.spixi.video-test', name: 'Spixi Video Test', publisher: 'IXI Labs', description: 'Local video testing app for developers to test video functionality in Spixi Mini Apps.', category: 'Dev Tools', featured: false, version: '0.1.0', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.video-test.spixi', singleUser: true },
    { id: 'com.ixilabs.spixi.whiteboard', name: 'Whiteboard', publisher: 'IXI Labs', description: 'Collaborative drawing whiteboard for real-time visual collaboration with friends.', category: 'Tools', featured: true, version: '1.0.2', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.whiteboard.spixi', multiUser: true },
    { id: 'com.ixilabs.spixi.mini-apps-test', name: 'Mini Apps Test', publisher: 'IXI Labs', description: 'SDK testing and demo playground for developers building Spixi Mini Apps.', category: 'Dev Tools', featured: true, version: '1.3.0', spixiUrl: 'https://apps.spixi.io/apps/com.ixilabs.spixi.mini-apps-test.spixi', multiUser: true },
  ] };
  async function loadDiscoverFeed(target) {
    const apply = (json) => setAddDiscoverFeed(target, parseAppsFeed(json, state),
      { strings, onOpen: (a) => showDetails(a) });
    try {
      const res = await fetch(APPS_FEED_URL, { cache: 'default' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      apply(await res.json());
    } catch (e) {
      apply(FEED_SNAPSHOT);                             // file:// / offline → snapshot
    }
  }

  /* —— uninstall flow —— */
  function runUninstall(app) {
    state.apps = state.apps.filter((a) => a.id !== app.id);
    renderAppsList(list, state, opts);
    showInstalled();
    showAppRemoved({ host: phone, strings });
  }

  showInstalled();
</script>
</body>
</html>
