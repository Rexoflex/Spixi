    // #334 iOS-58 (Damir dial: LIVE re-localize): the language pick no longer
    // reloads this page — C# pushes the picked code; the BUNDLED dictionaries
    // swap in place (SpixiStrings.get also re-stamps <html lang> → timestamps
    // re-localize on re-render), the cached hub is dropped (its text carries the
    // old dict), the nav replica rebuilds, and renderLayout re-renders the
    // current view — the picker stays exactly where it was and dirty nick/avatar
    // state SURVIVES (better than the #274 stash, which stays as belt for any
    // residual reload path). Components read strings at render time
    // (getStrings → window.SL) — no further plumbing. KNOWN residuals
    // (accepted, DECISIONS #334): C#-pushed verbatim text + generatePage carriers
    // keep the old language until the next natural regenerate.
    // ⚠ Do NOT write the carrier syntax literally in this file, not even in a
    // comment: localizeHtml is line-by-line and substitutes ANY match it finds, so
    // an empty one logged `Unknown localization key;` to ixian.log on EVERY
    // settings.html generation (found in Damir's 2026-08-19 log) and blanked the
    // comment text in the generated document.
    setLocale(code) {
      let dict = null;
      try { dict = window.SpixiStrings.get(String(code || '')); } catch (e) { dict = null; }
      if (!dict) return;
      window.SL = dict;
      strings = dict;
      if (code) state.language = String(code);
      // #337 (iOS-66): keep the pick surface's scroll through the re-localize —
      // the rebuilt hub re-attaches at 0, so capture the LIVE position now and
      // let renderLayout's one-shot restore re-apply it (mobile keeps the sheet
      // open over an unmoved hub; pane keeps the hub column where it was).
      // (r2: isConnected guard — a detached hub reports scrollTop 0, which would
      // ZERO a #15 latch saved on sublevel entry; unreachable today, belt only.)
      const hb = hubEl && hubEl.isConnected && hubEl.querySelector('.c-settings__body');
      hubScrollTop = hb ? hb.scrollTop : hubScrollTop;
      hubEl = null;
      emptyEl = null;      // loop MINOR-4: the memoized sd-empty pane baked the old dict
      // loop MINOR-5: the pane picker still arms the #274 reload-stash before the
      // verb — this push IS the proof no reload is coming; a stranded stash would
      // boot the NEXT pane open into the Language sublevel. The stash stays as
      // the belt for any genuine residual reload (which never delivers setLocale).
      try { localStorage.removeItem(VIEW_RESUME_KEY); } catch (e) {}
      buildPeerNav();
      renderLayout();
    },

    // setNickname(nick) — SettingsPage.onLoad:43
    setNickname(nick) { state.name = nick || ''; state.savedName = state.name; state.dirtyNick = false; scheduleRebuild(); },

    /* ★ N71 (#421): the live re-theme push. Two jobs, and the second is the one
     * that is easy to miss. (a) apply the swap, shared body (theme-runtime.js).
     * (b) REFRESH the 'Auto' resolution — this page owns the appearance picker, so
     * when the appearance is System the pushed name IS the new answer for every
     * later applyTheme(0). Without (b) a rebuild after an OS flip would snap the
     * page back to the boot theme and silently undo the push (★ #410).
     *
     * The order matters: autoTheme is updated FIRST, so anything the swap triggers
     * already reads the fresh value. Deliberately does NOT touch
     * `spixi.appearance` — an OS flip does not change the user's PICK (still
     * 'System'), and writing an idx here would silently convert their Auto choice
     * into a hard Light/Dark one. */
    setTheme(name) {
      /* ★ #46 audit (both auditors, independently): trust the pushed name as the
       * SYSTEM answer ONLY while System is the selected appearance. The pushed value
       * is getResolvedAppearanceName(), which returns the PICK whenever the pick is
       * explicit — so an unguarded assignment poisons the Auto cache with a value the
       * OS never reported. It is reachable because #421 newly routes the explicit-pick
       * path through the same sweep, and this page is now in it.
       * The sequence it broke (app = System, OS = light): pick Dark → autoTheme
       * becomes 'dark' → pick System → applyTheme(0) runs BEFORE the verb is sent and
       * paints from the poisoned cache → the Account flashes dark, then C#'s correct
       * push flips it back. A visible wrong-theme flash on the picker itself, which is
       * the one screen #242 round 2 cleaned up. */
      if (state.theme === 0) autoTheme = name === 'dark' ? 'dark' : 'light';
      applyPushedTheme(name);
    },

    // setAppearance(idx) — onLoad:46; idx = (int)ThemeAppearance
    setAppearance(idx) { const n = parseInt(idx, 10); state.theme = isNaN(n) ? 0 : n; applyTheme(state.theme); scheduleRebuild(); },

    // setLockEnabled(bool.ToString()) — onLoad:52 + lock-off auth resolution (HandleAuthSucceeded:241)
    /* ★ W2 (#348): this push is the AUTHORITATIVE app-lock value — the boot value at
       onLoad, and the post-auth resolution when the user turns the lock off. It is
       therefore the only safe place to persist it: one verb per task, and the value is
       the one C# actually holds.
       `lockSaved` starts undefined, so the FIRST push (boot) only records the baseline
       and never writes. */
    setLockEnabled(s) {
      const v = (s === 'True' || s === 'true' || s === true);
      state.lockEnabled = v;
      if (lockSaved === undefined) { lockSaved = v; state.dirtyLock = false; }
      else if (v !== lockSaved) { lockSaved = v; state.dirtyLock = true; autoSave(); }
      scheduleRebuild();
    },

    // showRemoveAvatar('1'|'0') — onLoad:63 (only when a custom avatar exists) + onRemoveAvatar:411
    showRemoveAvatar(show) { state.hasCustomAvatar = (show === '1' || show === 'true' || show === true); scheduleRebuild(); },

    // loadAvatar(path) — onLoad:66 / after picker:374 / after remove:412. Legacy
    // encodes '/' as '&bsol;' (settings.html:378). A tmp path means a fresh pick →
    // mark dirty so exit promotes it. Path resolution in-shell is the known avatar
    // flag → the tile falls back to a gradient until that's fixed.
    loadAvatar(path) {
      let p = (path || '').replace(/&bsol;/g, '/');
      // DEFAULT sentinel: SettingsPage pushes 'img/spixiavatar.png' when no custom
      // avatar exists (xaml:461). It RESOLVES on WinUI → rendered the LEGACY avatar
      // image instead of the redesign gradient (Damir F5 2026-07-08). Map the default
      // sentinels to null so createAvatar draws the deterministic gradient — same as
      // contact_details' resolveAvatar.
      if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') p = '';
      state.avatarSrc = p || null;
      // Dirty = a fresh pick pending promotion. #242: since X1 this push is a DATA
      // URI (no 'avatar-tmp' in it) — the explicit pick latch decides; the path
      // sniff stays as a fallback for the imageToDataUri raw-path failure mode.
      // Initial load / post-remove default pushes arrive with no pick pending →
      // not dirty, so a stale pick can't get promoted on the next exit.
      let pickLanded = false;
      if (avatarPickPending && p) {
        state.dirtyAvatar = true;
        avatarPickPending = false;
        pickLanded = true;
      } else {
        // Consume the latch on a non-pick push too (Opus #246): a CANCELED picker
        // (or a default/empty re-push after cancel) reaches this branch with p===''.
        // Leaving the latch armed let a later reload push (language reload / account-
        // delete onLoad re-push, non-empty) false-mark dirtyAvatar → a spurious Save
        // + exit via ixian:save instead of a clean ixian:back. The pick flow is a
        // SINGLE non-empty loadAvatar push (the tmp), so clearing here can't drop a
        // real pick's dirty (that took the if-branch above).
        avatarPickPending = false;
        state.dirtyAvatar = !!p && /avatar-tmp/i.test(p);
      }
      scheduleRebuild();
      // W2 (#348): promote a fresh pick immediately. This also ends a real footgun —
      // a non-save exit sends ixian:back, and ixian:back DELETES avatar-tmp.jpg
      // (SettingsPage:184-189), so picking a photo and then leaving by any route that
      // was not Save silently threw the photo away.
      // ONLY on a landed pick: the boot and post-remove pushes take the else branch,
      // and auto-saving on those would write on every page load.
      if (pickLanded) autoSave();
    },

    // setVersion(version) — S4 (SettingsPage.onLoad, mirrors LaunchPage:33);
    // feeds the hub Version row + the About takeover.
    setVersion(v) { appVersion = v || ''; scheduleRebuild(); },

    // setAddress(address) — S1 (SettingsPage.onLoad). PLAIN identity address (legacy
    // share form, HomePage:322 — no ExtendedAddress _suffix, that's payment-only);
    // used VERBATIM; the component appends ':ixi' for the QR.
    setAddress(addr) { state.address = addr || ''; scheduleRebuild(); },

    // setLanguage(code) — S3 (SettingsPage.onLoad, legacy codes e.g. 'en-us',
    // settings.html:69-81). Fixes the Language row's shown "current" only; the
    // picker always committed correctly. Unknown/empty codes keep the default.
    setLanguage(code) { if (code) { state.language = String(code).toLowerCase(); scheduleRebuild(); } },

    // setPaneMode('1') — unit 2 (#240): HomePage hosts this page as a detail-column
    // PANE (wide window). Arrives in the onLoad burst BEFORE the overlay presents
    // (pushes coalesce ahead of the #225 present), so the pane never flashes the
    // takeover layout; re-pushed by the language-change reload. Display-only.
    setPaneMode(v) {
      const on = (v === '1' || v === 'true' || v === true);
      if (on === paneMode) return;
      paneMode = on;
      if (on) document.body.dataset.pane = '';
      else delete document.body.dataset.pane;
      renderLayout();
    },

    // setPaneMetrics(width) — #245: the hub column's width in CSS px (= the native
    // list column minus the rail strip), so the Account hub aligns with the chats
    // list and its hairline lands where the pane divider sits. Pushed with
    // setPaneMode; guarded against junk.
    setPaneMetrics(w) {
      const n = parseFloat(w);
      if (!isNaN(n) && n >= 200 && n <= 1000) {
        document.documentElement.style.setProperty('--sd-master-w', n + 'px');
      }
    },

    // onExitRequest() — C# asks the pane to close ITSELF (home tab switch, #240):
    // the same save-if-dirty exit as back-from-hub; single-fire latched, so a
    // repeat request while the pop is in flight is a no-op.
    onExitRequest() { exitSettings(); },

    // setCaps('a,b,…') — #242: C# declares which OPTIONAL verbs this build
    // dispatches (SettingsPage.onLoad pushes 'settingsApply' now that ixian:apply
    // exists). Mutates the bridge's capability object IN PLACE — bridge.cap()
    // reads the same reference — so the S14-gated Save-stays path lights up.
    // Shell + C# ship in one commit, but the gate keeps an OLD exe with a NEW
    // shell (or vice versa) from emitting a verb nobody dispatches.
    setCaps(list) {
      String(list || '').split(',').forEach((c) => {
        c = c.trim();
        if (c) bridge.capabilities[c] = true;
      });
      // iOS-20 (#283): the hub's Change-password row visibility reads
      // bridge.cap('encpass') at BUILD time — if the hub happened to render
      // before this push landed (boot ordering), rebuild so the row appears.
      scheduleRebuild();
      /* ★ W2 (#348) review MINOR-10: an edit committed BEFORE this push took the
         legacy branch and only revealed the check icon — and this rebuild then removes
         that icon, because auto-save is on now. Without this the edit would sit dirty
         with no affordance at all until exit. Flush it. */
      autoSave();
    },

    // Q1-② (#267): downloads list pushed by SettingsPage itself (ixian:loadDownloads
    // → clearFiles + addFile per file; re-pushed after a delete). Same settle-buffer
    // as downloads.html — one EvaluateJavaScriptAsync frame per file, so buffer
    // between the clear and an 80ms settle so a partial list never paints.
    // ctime is a LOCALE-OPAQUE DateTime.ToString() → displayed verbatim, never parsed.
    clearFiles() { dlBuf = []; dlSettle(); },
    addFile(name, ctime) {
      if (dlBuf === null) dlBuf = [];
      dlBuf.push({ name: name || '', time: ctime || '' });
      dlSettle();
    },

    // setEncPassResult('1'|'0') — #341. The standalone settings_encryption.html has
    // NO result push: C# alerts and pops the page, and mountEncPassPage releases the
    // form on a 1600 ms no-pop timer. Inline there is no pop, so SettingsPage answers
    // explicitly instead. '1' = the wallet was re-encrypted with the new password;
    // anything else = the current password was wrong. Carries NO password material.
    // A result that arrives after the user left the sublevel finds encpassCtrl null
    // (releaseEncpass cleared it) and is dropped.
    setEncPassResult(ok) {
      const c = encpassCtrl;
      // #341 audit MINOR-2: the seq test drops an answer that belongs to a submit the
      // user already walked away from, so it can never resolve a later form.
      if (!c || c.seq !== encpassSeq) {
        // #341 review MINOR-7: but a DROPPED SUCCESS must still be told. The inline
        // route suppresses the native alerts, so a user who leaves the screen while
        // C# is validating would get no confirmation on any surface — and the wallet
        // password HAS changed. The mobile route cannot reach this state: C# alerts
        // and pops there.
        if (String(ok) === '1') {
          showToast({ text: strings.passwordChanged || 'Password changed', tone: 'success', host: document.body, strings });
        }
        return;
      }
      encpassCtrl = null;
      if (String(ok) === '1') c.done();
      // #341 review MINOR-2: this needs its OWN key. Re-using `badPassword` collided
      // with the component's value for the same key, and extract-strings exits 1 on a
      // fallback conflict — the whole build chain would have stopped at step 1.
      else if (String(ok) === '2') c.fail(strings.encpassRejected || 'That password can’t be used. Pick a different one.');
      else c.fail();                             // '0' — component supplies the wrong-current copy
    },

    // onBack() — hardware back, routed by HomePage while this page is an overlay
    // (#240; SettingsPage.OnBackButtonPressed when pushed). In any screen (danger /
    // about / how-to / …) back returns to the hub (split: empties the detail);
    // from the hub it exits (save-if-dirty else back).
    onBack() {
      // AND-37 (the N51 family): an open bottom sheet (theme/appearance/language
      // pickers on mobile ride the shared overlay stack) consumes back BEFORE any
      // navigation — without this arm the hub branch below exited the whole page
      // from under the sheet and back landed on Chats. No C# mirror is needed
      // here: unlike chat, back ALWAYS routes into this shell (HomePage's
      // SettingsPage branch + SettingsPage.OnBackButtonPressed are unconditional).
      const dismiss = window.Spixi && window.Spixi.dismissTopOverlay;
      if (dismiss && dismiss()) return;
      if (currentView !== 'hub') showHub(); else exitSettings();
    },

    // #315 (iOS-46 warm re-present; #46 r1 MAJOR-1): C# now PARKS this page on
    // close and re-presents the SAME document — the single-fire `exiting` latch
    // (#199 flicker guard, designed for a page that DIES on pop) would otherwise
    // freeze every re-presented Account: renders bailed, every exit verb
    // suppressed, no back arrow left to save you (this batch removed it). The
    // re-present push resets the latch, re-arms the dirty machinery and repaints
    // whatever view the user parked on. Also un-gates the #314 backup-stamp poll
    // (which pauses on `exiting` — a parked page must not tick timers).
    onRepresented() {
      exiting = false;
      exitSent = false;            // W2: a re-presented document may exit again
      rebuildQueued = false;
      clearTimeout(exitHeal);      // W2: the re-present IS the reset; drop any pending heal
      // #46 r2 MAJOR-1: reconcile the dirty machinery with what the PARKING EXIT
      // already persisted — every reachable park routes through exitSettings,
      // which sent ixian:save:<name> when dirty, so at park time shell-state ==
      // C#-state. Without this, a re-presented page kept savedName/dirty* from
      // BEFORE that save: a phantom Save button, and worse — reverting the nick
      // to the stale savedName read as "not dirty" → exit sent ixian:back and
      // the revert was SILENTLY DROPPED (the #240 close-audit class).
      state.savedName = state.name;
      state.dirtyNick = state.dirtyAvatar = state.dirtyLock = false;
      avatarPickPending = false;
      refreshBackupStampIfChanged();   // a backup may have happened while parked
      renderLayout();
      syncSave();
      // #320: the peer nav may have parked with the EXIT tap's tab highlighted
      // (bottomnav auto-selects before onChange) — this page is the Account tab.
      try { setNavActive(nav, 'account'); } catch (e) { /* pre-nav boot */ }
    },
  };

  bridge.exposeAll(handlers);

  /* —— peer-tab bottom nav (Damir): Account reads as a home tab. Non-Account taps
   * do a best-effort ixian:back (pop SettingsPage → home); precise-tab landing +
   * true in-home integration need BE (HomePage pushing settings data, or a
   * home-tab-select verb) — be-cutover S11. The nav persists across the
   * hub/takeover swaps (it's a sibling of #settings-root). ————————————————————— */
  /* #334 iOS-58: the nav is now REBUILDABLE — its labels captured a dict, and
   * setLocale swaps dicts LIVE (no page reload), so the replica rebuilds in
   * place. The unread badge (iOS-61) is re-applied across rebuilds from
   * lastNavUnread — C#'s push is value-latched and won't repeat. */
  let nav = null;
  let lastNavUnread = 0;
  function buildPeerNav() {
    const items = [
      { id: 'chats', label: strings.chats || 'Chats', icon: 'messages' },
      { id: 'apps', label: strings.apps || 'Apps', icon: 'apps' },
      { id: 'wallet', label: strings.wallet || 'Wallet', icon: 'wallet' },
      { id: 'account', label: strings.account || 'Account', icon: 'user-circle' },
    ];
    const fresh = createBottomNav({
      items, active: 'account',
      // Desktop (Damir F5 r2): same LEFT RAIL as the home shell (logo on top) so a
      // FULL-WINDOW Account (narrow desktop window) reads as a peer pane. When C#
      // hosts this page as a real PANE (unit 2 #240, setPaneMode) this whole nav is
      // hidden — home's rail sits beside the pane.
      variant: isDesktop ? 'rail' : undefined,
      logo: isDesktop,
      // Leaving Account = pop back to home. Route through exitSettings (NOT a raw
      // ixian:back) so a held-but-uncommitted nickname / picked avatar is saved on
      // the way out, exactly like the topbar/hardware back (audit m1 — the raw back
      // dropped the edit + let C# delete avatar-tmp).
      // r3 QUIRK fix (Damir: "from Account you always land on whatever tab you left
      // on"): there's still no C# land-on-tab verb (S11), so the TAPPED tab rides
      // localStorage (same origin) — home consumes it via the storage event while
      // it sits under this pushed page (+ a focus fallback). Timestamped so a
      // stranded key can't switch tabs minutes later.
      onChange: (id) => {
        if (id === 'account') return;
        try { localStorage.setItem('spixi.landtab', id + ':' + Date.now()); } catch (e) {}
        exitSettings();
        // #320 (Damir F5 of #315): bottomnav moves the highlight on tap BEFORE
        // onChange runs — the exit-tap left e.g. Wallet selected, the page PARKED
        // in that state, and the warm re-present showed Account with the wrong tab
        // lit. This page IS the Account tab: snap the highlight back immediately
        // so the parked state is always canonical (belt: onRepresented re-asserts).
        setNavActive(nav, 'account');
      },
    });
    if (nav) nav.replaceWith(fresh);
    else document.getElementById('settings-nav').append(fresh);
    nav = fresh;
    if (lastNavUnread) setNavBadge(nav, 'chats', lastNavUnread);
  }
  buildPeerNav();

  /* —— page ready — fire ixian:onload on the window LOAD event (#177 load-timing
   *    invariant): firing during parse races C#'s first push, arriving empty until
   *    a manual refresh. ———————————————————————————————————————————————————————— */
  // Splash boot cover teardown (Batch B): short fade (reduced motion: instant),
  // transitionend + timeout fallback (the #29 morph pattern).
  function dropAppBoot() {
    var b = document.getElementById('app-boot');
    if (!b) return;
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { b.remove(); return; }
    b.style.opacity = '0';
    b.addEventListener('transitionend', function () { b.remove(); }, { once: true });
    setTimeout(function () { if (b.parentNode) b.remove(); }, 400);   // > --duration-200
  }

  function signalReady() { dropAppBoot(); bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
