<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;function b(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-bottom',v+'px');}b('*SL{AndroidInsetBottom}');window.setInsetBottom=b;function c(l,r){var n=/^\d{1,3}(\.\d{1,2})?$/,d=document.documentElement.style;if(n.test(String(l)))d.setProperty('--android-inset-left',l+'px');if(n.test(String(r)))d.setProperty('--android-inset-right',r+'px');}c('*SL{AndroidInsetLeft}','*SL{AndroidInsetRight}');window.setInsetSides=c;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Contact</title>
<style>
  /* Paint the screen surface IMMEDIATELY (mirrors --surface-screen light/dark)
     so the page doesn't flash white while tokens.css + the bundle load. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);
  /* ★ #46 r2 C1: the ink that rides ON --_fill, intent-switched like every other member of
     this private palette. It used to be --text-neutral-on-action hard-coded at the
     [data-type="fill"] rule, which was right for the default intent and wrong for
     destructive: in dark --surface-destructive-default is --error-300 #f49c92 and the white
     label measured 2.01:1 — the worst reading anywhere in the #46 audit, and the one row
     the census missed. Default intent is unchanged at 6.68:1 on #3050bd (Damir, Session K). */
  --_on-fill: var(--text-neutral-on-action);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  /* ★ #46 r2 C1: dark #131415 on --error-300 #f49c92 = 8.80:1 (was #f9fafb at 2.01:1);
     light #f9fafb on --error-600 #b12525 = 6.36:1, unchanged. State steps hold on the same
     ink: dark hover #f1786e 6.72:1 / pressed #e34540 4.56:1.
     Reversal: delete the --_on-fill declaration below and the destructive fill falls back
     to the base palette (--text-neutral-on-action), i.e. back to 2.01:1 in dark. */
  --_on-fill: var(--text-neutral-on-destructive);
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--_on-fill); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  /* ★ #46 r2 C1: the morph fill is GREEN, never the action blue — in dark --success-300
     #91c69b took the on-action white at 1.87:1. --text-neutral-on-success = 9.45:1 dark /
     5.98:1 light. The !important is the morph overriding any intent, and stays. */
  color: var(--text-neutral-on-success) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
/* ★ L18 (Damir, 2026-08-31): the ink is now a ROLE, --text-logotype — brand blue in
   light (byte-identical: the role aliases --text-action-default) and neutral-01 in
   dark. The theme answer lives in tokens.css; a [data-theme] selector here is the
   shape #421 retired (tokens.css states the rule). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-logotype); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-topbar);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-topbar__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  letter-spacing: var(--tracking-body-sm);
  color: var(--text-neutral-02);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* presence dot ring sits on the topbar surface here, not the screen */
.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

/* TEXT action (topbar.js `actions[].text`) — a labelled action, not a bare glyph.
   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */
.c-topbar__actions--text { min-width: 0; max-width: 62%; }
.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}

   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */

.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }

   freezes the ink. Rest ink = topbar region token; hover/pressed step to the

  --_ink-hover: var(--icon-action-hover);

/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.

   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {

   contact-details cover is a person's identity colour behind their photo, and it must
   be the SAME colour their gradient avatar would have been — two sources for one
   identity is how they drift apart. Each selector gains one alternative; the values are
   untouched, and `.c-disc[data-hue]` cannot collide because its hues are NAMES
   ('accent', 'info', …) and these are indices. */

   address (identityIndex) and the twelve anchors are the palette itself; a token per stop
   would be twelve names for twelve numbers nobody else reads. Theme-aware S/L live below. */

   6.14 · 3 → #458226 4.69 / #216327 7.29. Reversal values ride in the trailing comment. */

.c-avatar[data-hue="4"], .c-idhue[data-hue="4"]  { --av-c1: hsl(135, 62%, 32%); --av-c2: hsl(160, 58%, 22%); }

.c-avatar[data-hue="6"], .c-idhue[data-hue="6"]  { --av-c1: hsl(190, 62%, 35%); --av-c2: hsl(215, 58%, 25%); }

.c-avatar {

  /* Fallbacks = anchor 7 (blue): a stale bundle that never stamps data-hue
     still paints a legible gradient instead of a transparent disc.
     ★ Session I (sheet 2b = D): TG-like DEPTH — a soft white highlight at the top-left

     is 22% at its centre and gone by half the radius, so at the disc centre — where
     the initials sit — it is ≈ 5%, and the lightest re-tuned stop (#c35118, 4.66:1)

<style data-src="../styles/components/overlay.css">
/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  /* the OVERLAY backdrop role — not --surface-scrim, which carries near-white ink on
     media tiles and the call stage (tokens.css). Halved in light, #557 values in dark. */
  background: var(--surface-scrim-overlay);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }
/* ★ Batch E (b) (#557, Damir 2026-08-22): the MOBILE scrim is one level deeper
   (0.6 → 0.7) — the lifted message (#506②) reads better against the darker
   ground. Desktop keeps 0.6 for its centred dialogs; anchored desktop menus
   stay wash-free (#268, [data-dt-clear] below). */
:root:not([data-desktop]) .c-scrim { background: var(--surface-scrim-deep); }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  /* ★ Session Z (#884 ①, Damir on the Y walk: every sheet "feels too low", "maybe even
     32px"): the foot is spacing-24 (was 16) ABOVE the safe region — the same 24 the
     desktop dialog already used (`:root[data-desktop] .c-sheet` below), so one number
     serves both presentations. Picked over 32: on a 3-button Android bar the sheet now
     also carries the 48 px bar under it (AND-45), and 32 + 48 read as an empty shelf
     (the two variants were rendered; 24 is his pick). The keyboard variant mirrors it. */
  padding-bottom: calc(var(--spacing-24) + var(--safe-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

/* ★★ #608 (device row 5a, iPhone 15) — THE SHEET RISES FOR THE KEYBOARD.
   A bottom sheet is `bottom: 0` of its host, and on iOS the host does NOT shrink under
   the soft keyboard: the whole sheet sat behind it. On the tip sheet only the title row
   stayed visible — the amount chips, the custom-amount field the sheet had just FOCUSED
   itself, and the button that commits the payment were all underneath, on a surface with
   no scroll and no cap, so nothing could reach them. That is also why the keyboard read
   as having "no way out": the scrim you would tap to dismiss it was under the keyboard
   too.
   Three declarations, and every one of them is INERT at `--kb-inset: 0` — no keyboard,
   no change, anywhere in the app:
     · the sheet sits on top of the keyboard instead of behind it;
     · the home-indicator pad is given back while the keyboard covers that strip anyway
       (the same max() the chat composer uses), so the sheet does not float twice;
     · it is capped and scrollable, so a sheet taller than the space that is left can
       still be read to the end rather than being clipped at both ends.
   ⚠ Mobile only. A desktop dialog is centred, has no soft keyboard, and is scoped
   separately further down this file. */
:root:not([data-desktop]) .c-sheet {
  bottom: var(--kb-inset, 0px);
  padding-bottom: calc(var(--spacing-24) + max(0px, var(--safe-bottom, 0px) - var(--kb-inset, 0px)));   /* ★ Session Z #884 ①: 24, as the resting sheet */
  /* #918 (AND-33): the cap clears the status bar too — a sheet taller than a landscape
     viewport rose to y=0 under it; the anchored menu already subtracted --safe-top. */
  max-height: calc(100% - var(--safe-top, 0px) - var(--kb-inset, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————
   The sheet is z-44 and every scrim is z-40, so a sheet paints above a scrim that
   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.
   The house pattern is "close the sheet, then open the modal". A second quick tap
   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
  /* ★★ E1d (Damir on device, 2026-08-29 — Windows AND mobile): a long URL OVERFLOWS the
     dialog. The external-link confirm (#82, chat.html confirmOpenLink) puts the raw URL in
     this slot as its body, and a URL is ONE unbroken token — no spaces, and a query string
     or a `#fragment` gives the line breaker nothing to work with. The modal is capped at
     360px, so the text ran straight past the rounded corner on both platforms.
     ⚠ `anywhere`, not `break-word`: `overflow-wrap: break-word` only breaks BETWEEN
     opportunities and still refuses to split a single long token in several engines, which
     is exactly the case here. `anywhere` breaks only when the line would otherwise overflow,
     so ordinary body copy in every other modal is untouched — it is not `word-break:
     break-all`, which would hyphen-less-chop normal sentences too.
     ★ This slot is shared by every modal body, which is why the fix belongs here and not in
     the link dialog: the same overflow waits for any long token — a wallet address, a
     file name, a base58 transaction id — and those are all things this app puts in dialogs. */
  overflow-wrap: anywhere;
}

.c-modal__actions {
  display: flex;
  /* ★ Batch B/C loop r1 M-1 (2026-08-24): WRAP. A long localized confirm label
     ("Supprimer le compte", "Отменить приглашение") overflowed the fixed pair —
     nowrap labels + flex-basis 0 + min-width:auto has no out. Wrapping drops the
     long action onto its own full-width row (the remove-contact sheet's answer);
     short pairs render exactly as before. */
  flex-wrap: wrap;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②). ⚠ NO min-width:0 here — loop r2 R2-1: with flex-basis 0 a used min of 0 makes every item's hypothetical size 0, so the wrap above could NEVER fire; min-width:auto (the label's min-content) is what trips it. Measured in Chrome: with auto, the long confirm wraps to its own full row; with 0 it spilled 43px past its button */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 220px; padding: var(--spacing-8); }   /* ★ Session I (sheet 6 + Damir's Windows walk: "quite substantial") — was min-width 260, padding 12/16/16 */
/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source
   highlight is RETUNED — the SELECTED tint read as a selection state on the
   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".
   ⚠ loop E-4 (r2): :not([aria-current]) is LOAD-BEARING — this (0,3,0) shorthand
   would otherwise REPLACE the OPEN conversation's tonal selected paint (0,2,0)
   in the desktop split view, visually deselecting the row under its own menu.
   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
/* ★ Session K: the rule is no longer desktop-scoped — the apps ⋯ dropdown clears its wash on
   mobile too (Damir: "shouldn't dim at all"). The tag keeps its name; one grammar. */
.c-scrim[data-dt-clear],
:root:not([data-desktop]) .c-scrim[data-dt-clear] { background: transparent; }   /* the second selector out-specifies the mobile deep wash (line 19, (0,3,0)) */

/* ═════════ MOBILE anchored dropdown (Batch E (a), #557, Damir 2026-08-22) ═════════
   The message menu + the chats-row menu present as a DROPDOWN anchored to the
   pressed row (desktop-anchors.js anchorSheetToRow sets the tag + inline
   left/top/width). Placement prefers ABOVE the row, so the menu can never cover
   the message it acts on — the 4.1 fix, structural. Everything else about the
   overlay is UNCHANGED: same z-44 (above the z-42 lifted row, #506②), same scrim
   (one level deeper here, (b) above), same focus/Esc/stack grammar, and the
   `:not([data-open])` pointer-events rule still covers the fade windows.
   Enter/exit = FADE IN PLACE (the desktop [data-dt-anchor] rule): a panel that
   slid from the bottom edge to mid-screen would point at the wrong origin. */
:root:not([data-desktop]) .c-sheet[data-m-anchor] {
  left: auto; right: auto; bottom: auto;
  margin: 0;
  max-width: none;
  border-radius: var(--radius-16);
  padding: var(--spacing-8) var(--spacing-12) var(--spacing-12);
  /* ★ loop E-1 (r2): the dropdown must never leave the SAFE region or outgrow the
     host — a menu taller than the screen with the body scroll locked is
     unreachable UI, and a clamp to y=8 puts the react row under the Dynamic
     Island (the #288 inset class). The height cap makes the menu its own
     scroller; the JS clamp (anchorSheetToRow) keeps top ≥ safe-top + 8. */
  max-height: calc(100% - var(--safe-top, 0px) - var(--safe-bottom, 0px) - 2 * var(--spacing-8));
  overflow-y: auto;
  transform: none;
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-decelerate);
}
:root:not([data-desktop]) .c-sheet[data-m-anchor][data-open] { transform: none; opacity: 1; }
:root:not([data-desktop]) .c-sheet[data-m-anchor] .c-sheet__handle { display: none; }

</style><!-- c-modal (delete-history / remove-contact confirms) + c-sheet -->

   shell rule that set it even CLAIMED to "mirror the chats-list treatment"

/* direction circle: 48, centered 24 arrow */

<style data-src="../styles/components/chat-info.css">
/* c-chat-info — chat info takeover (docs/chat-info-spec.md, #141).
   One surface for 1:1/group/bot; sections render by kind + capabilities. */

.c-chat-info {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--surface-screen);
}
.c-chat-info__body {
  flex: 1;
  min-height: 0;                    /* the flex-column scroll rule (#136①) */
  display: flex;
  flex-direction: column;
  gap: var(--screen-gap);                      /* ★ Session I canon: 12 (was 16) */
  padding: var(--screen-pad) var(--spacing-16) var(--spacing-32);   /* ★ Session I canon: 12 top (was 16) */
}
/* #150①: children of a SCROLLING flex column are shrinkable — overflow:hidden
   (#149①) dropped the payments section's min-height:auto floor to 0, so it
   absorbed ALL the shrink and rendered as a clipped sliver (Damir). The #148③
   settings guard, applied here too: never shrink. */
.c-chat-info__body > * { flex: none; }

/* ★ Session Y (#875 P2/P3/P5/P8) — INSET-GROUPED SECTIONS.
   #142 dividers → #148 one card PER ROW → now one card PER GROUP: a transparent
   `__group` wrapper carries the label OUTSIDE (iOS grouped) and one `__card` that the
   group's rows sit inside, separated by inset hairlines. Radius 12 — the ONE radius on
   this screen (the tiles above use it too). NO elevation: in light the card's own tone
   on the screen carries the lift; in dark a card lifts by tone and never outlines
   (Apple HIG grouped backgrounds, Telegram/Signal in dark). Hero + action row stay on
   the screen.
   #150③ lives on: cards REASSIGN --surface-input (input === card in both modes made
   fields invisible) — the #20 contextual-override precedent.
   ⚠ The card is `overflow: hidden` so full-bleed row washes clip to its corners (the
   #149① move, now for every group); the #150① never-shrink guard is on the WRAPPER
   (`__body > *`), so the clip cannot collapse a section to a sliver. */
.c-chat-info__group {
  display: flex;
  flex-direction: column;
  gap: var(--spacing-4);
}
.c-chat-info__card {
  display: flex;
  flex-direction: column;
  background: var(--surface-card);
  border-radius: var(--radius-12);
  overflow: hidden;
  --surface-input: var(--surface-input-on-card);
  /* the hairline between rows starts at the LABEL edge: card pad 12 + glyph 22 + gap 12.
     Lists with a 40 avatar override it (member/shared: 12 + 40 + 12); tx rows 12 + 48 + 12. */
  --ci-hairline-inset: calc(var(--spacing-12) + 22px + var(--spacing-12));
}
/* ★ Session Z (#882 (a)): every row/option INSIDE a card hovers/presses on the CARD pair
   (--surface-card-hover/-pressed, #878) — --surface-interactive-hover is the card's own colour
   on both ramps (light 50/50 · dark 800/800), i.e. no hover; the hero address button stays on

   HOSTS from txlist-item.css (whose own hover is the screen pair, right for the wallet list)
   — so the card-scoped override below is theirs (#46 loop A-3). */
/* ★ THE HAIRLINE is a pseudo on every row after the first — a border cannot be inset.
   ⚠ `::after`, NOT `::before`: base.css owns `::before` on `.c-txlist-item` (and the other
   row families) for the 5c-ii compositor PRESS LAYER (`html:root .c-txlist-item::before`,
   0,2,2). A `::before` hairline here loses that cascade on the payment rows — it inherits
   the press layer's `opacity: 0; z-index: -1` (no line) while its own `height: 1px`
   still lands and squashes the press fill to a sliver (#46 loop, Session Y MAJOR-1).
   `::after` is free on every row family this sheet draws (verified: `content: none`).
   ★ Session Z (#884 ⑤): the colour is the ROLE `--outline-on-card`, not a neutral step.
   Session Y picked `--outline-neutral-03` because no single step works on both cards
   (COMPUTED against the card from the resolved ramps; the suite recomputes them):
     -01  light neutral-100 on the neutral-50 card 1.04:1 · dark neutral-800 on neutral-800 = 1.00 (no line)
     -02  light neutral-200 1.137 · dark neutral-700 1.048 (the near-invisible class, #870)
     -03  light neutral-300 1.423 · dark neutral-600 1.223
   and Damir read the light 1.42 as "much too visible" on the Y walk. `--outline-on-card`
   resolves per theme to the step that is right on THAT card: light neutral-200 (1.137,
   a shade under iOS's ~1.30 separator on white), dark neutral-600 (1.187 — ink-600 on ink-800
   after #884 ②; the 1.223 above was the grey step). The Account hub's in-card hairline reads
   the same role (#882 (b) — its -01 was invisible in dark). */
.c-chat-info__card > * + *,
.c-chat-info__member-list > * + *,
.c-chat-info__member-fill > * + *,
.c-chat-info__shared-list > * + *,
.c-chat-info__txs-list > * + * { position: relative; }
.c-chat-info__card > * + *::after,
.c-chat-info__member-list > * + *::after,
.c-chat-info__member-fill > * + *::after,
.c-chat-info__shared-list > * + *::after,
.c-chat-info__txs-list > * + *::after {
  content: '';
  position: absolute;
  top: 0;
  inset-inline: var(--ci-hairline-inset) 0;
  height: var(--outline-width-1);
  background: var(--outline-on-card);
  pointer-events: none;
}
/* a list CONTAINER that follows another card child (the search field, the payments
   toggle) is itself `> * + *` of the card, so it draws the line ABOVE its first row —
   full-bleed, because what sits above it is not a row of the same family. Its first row
   is `:first-child` of the list and draws none (no double line). The "View all" button at
   the foot of the payments list is not a tx row either: full-bleed too. */
.c-chat-info__card > .c-chat-info__member-list::after,
.c-chat-info__card > .c-chat-info__shared-list::after,
.c-chat-info__card > .c-chat-info__txs-list::after,
.c-chat-info__txs-list > .c-chat-info__txs-all::after { inset-inline-start: 0; }

   card — on a single-row card (Leave group) the ring vanished entirely. Inside a card the
   ring draws INSIDE the row. */
.c-chat-info__card :focus-visible { outline-offset: -2px; }
.c-chat-info__member-list, .c-chat-info__shared-list { --ci-hairline-inset: calc(var(--spacing-12) + var(--size-avatar-40) + var(--spacing-12)); }
.c-chat-info__txs-list { --ci-hairline-inset: calc(var(--spacing-12) + var(--size-avatar-48) + var(--spacing-12)); }

/* clip-hidden live region (wallet-receive __live pattern) */
.c-chat-info__live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  margin: 0;
}

/* ★ Session Y (#875 P5): the section title sits OUTSIDE the card — label-sm, Medium,
   --text-neutral-02, inset to the card's content edge (iOS grouped headers).
   ★ Session Z (#884 ④, Damir on the Y walk: "not all caps"): SENTENCE CASE. The
   `text-transform: uppercase` + the 0.4px positive tracking that uppercase needed are
   gone; the label reads the label-sm token's own tracking like every other label. A
   translated title ("Skupne skupine") also survives sentence case where an uppercase
   transform of a non-Latin or accented string is a known screen-reader/ligature hazard. */
.c-chat-info__label {
  margin: 0;
  padding-inline: var(--spacing-12);
  font-size: var(--font-size-label-sm);
  line-height: var(--line-height-label-sm);
  letter-spacing: var(--tracking-label-sm);
  font-weight: var(--font-weight-medium);
  color: var(--text-neutral-02);
}

/* —— hero —— CENTERED identity block (Damir 2026-08-12 "premium" pass): the

.c-chat-info__hero {

  flex-direction: column;
  align-items: center;

  padding-block: var(--spacing-4) 0;            /* was 8 / 4 */

.c-chat-info__hero .c-avatar__initials { font-size: 30px; }
.c-chat-info__hero .c-avatar__dot { width: 18px; height: 18px; }
/* #334: real hero photo → full-size viewer. The button hugs the avatar circle

   action ring — a photo face can't tint (#43 hover coverage, tokens only). */
.c-chat-info__avatar-view {
  flex: none;
  display: inline-flex;
  padding: 0;
  border: 0;
  background: transparent;
  border-radius: var(--radius-full);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__avatar-view:hover { box-shadow: 0 0 0 var(--outline-width-2) var(--outline-action-hover); }
}
.c-chat-info__avatar-view:active { box-shadow: 0 0 0 var(--outline-width-2) var(--outline-action-pressed); }
.c-chat-info__id {
  min-width: 0;                     /* long names ellipsize, never blow out (③ lesson) */
  width: 100%;                      /* centered hero: the column is the full row, so
                                       the ellipsis still has a box to clip against */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-2);
}
.c-chat-info__name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-4);
  min-width: 0;
  max-width: 100%;
}
/* ★ Session Z (#884 ⑥): the ghost mirrors the pencil — a 44 icon-only button is 44 wide
   (`.c-button[data-icon-only][data-size="44"]`, button.css) — so the NAME is what the
   row centres, not the name+pencil pair. It hides with the pencil while the editor is
   open (the input then centres alone). The suite reads both widths from the sheets. */
.c-chat-info__nick-ghost { flex: none; width: 44px; }
.c-chat-info__name {
  min-width: 0;                     /* flex item in name-row: without this its
                                       min-width resolves to the NOWRAP content
                                       width, so a long name/nickname (or RTL
                                       string) never ellipsizes — it overflows
                                       the hero and shoves the edit pencil off
                                       screen (#140③ / #136① class) */
  font-size: var(--font-size-heading-sm);   /* centered hero carries one step more presence */
  line-height: var(--line-height-heading-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.c-chat-info__sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* ★ Session Y (#875 P7): THE ADDRESS UNDER THE NAME — the hero's last line. The #211
   truncated form in the sub register, a 16px code glyph beside it (the sheet it opens IS
   the QR), tabular so the digits sit still. It is a <button> when a host wires the
   sheet: reset the button box, keep a 32 min-height + padding, wash on press.
   ★ Damir (Session Y, on four rendered variants): the TAPPABLE line is ACTION INK — blue
   text + blue glyph, no ground (iOS Contacts' number, Telegram's @username: the oldest
   "blue text is tappable" rule; no new string, one accent, the hero stays quiet). A host
   that passes no handler renders a <span> and it stays --text-neutral-02: blue means
   tappable, so a line that does nothing must not wear it. Bots carry the line too (a bot
   HAS an address, #731); groups never do. */
.c-chat-info__hero-addr {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-4);
  max-width: 100%;
  min-height: 32px;
  margin: 0;
  padding: var(--spacing-2) var(--spacing-8);
  border: 0;
  border-radius: var(--radius-8);
  background: transparent;
  color: var(--text-neutral-02);
  font: inherit;
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  cursor: default;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
button.c-chat-info__hero-addr { cursor: pointer; color: var(--text-action-default); }
.c-chat-info__hero-addr > svg { flex: none; color: var(--icon-neutral-02); }
button.c-chat-info__hero-addr > svg { color: var(--icon-action-default); }
.c-chat-info__hero-addr .c-chat-info__addr-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (hover: hover) and (pointer: fine) {
  button.c-chat-info__hero-addr:hover { background: var(--surface-interactive-hover); }
}
button.c-chat-info__hero-addr:active { background: var(--surface-interactive-pressed); }
/* N48 (#370): own owner-status chip under the hero sub (blind rooms). The hero
   column is centered; the badge hugs its content and needs only breathing room. */
.c-chat-info__self-role {
  margin-top: var(--spacing-8);
  align-self: center;
}
.c-chat-info__nick-input {
  font: inherit;
  font-size: var(--font-size-heading-xs);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
  background: var(--surface-input);
  border: var(--outline-width-1) solid var(--outline-action-default);
  border-radius: var(--radius-8);
  padding: var(--spacing-2) var(--spacing-8);
  min-width: 0;
  width: 100%;
}
.c-chat-info__nick-error {
  font-size: var(--font-size-body-sm);
  color: var(--text-error);
}

/* —— address —— ★ #591 retired the CARD (→ the shared address sheet, #527);
   ★ Session Y (#875 P7) retired the ROW too — the address is the hero's last line
   (`__hero-addr`, above). No address rule lives in the body any more. */

/* —— action row —— ★ Session Y (#876): FOUR EQUAL ROUNDED-RECTANGLE TILES, max.
   The 48px tonal circle + label-underneath of 2026-08-12 (the wallet-banner grammar)
   is retired on THIS screen: the button IS the tile — --surface-card, radius 12 (the
   same surface and radius as the grouped cards below, one system), a 22px glyph on
   the single accent, a 12px label INSIDE. Telegram's header buttons (tile = list block
   colour, icon over label) and iOS Contacts' tile row are the reference. The wallet
   hero keeps its circles (different surface, different job).
   Equal widths: `flex: 1 1 0` with NO max-width cap (the #591 84px cap sized circles;
   tiles fill the row). A lone tile (a room from the chat header: Mute alone) hugs.
   Labels WRAP rather than truncate (the #591 ru-ru lesson: "Сообщ…" is unreadable, a
   two-line label is merely tall) — ONE `__qa-label` rule, see the #591 note below. */
.c-chat-info__money {
  display: flex;
  gap: var(--spacing-8);
}
.c-chat-info__money > .c-chat-info__qa { flex: 1 1 0; min-width: 0; }
/* identity + actions read as ONE header block: pull the row up out of the
   body's section rhythm (the full gap made the actions look orphaned) */
.c-chat-info__hero + .c-chat-info__money { margin-block-start: calc(-1 * var(--spacing-4)); }
/* a lone action hugs instead of stretching — a full-width tile reads as a button */
.c-chat-info__money[data-count='1'] { justify-content: center; }
.c-chat-info__money[data-count='1'] > .c-chat-info__qa { flex: none; min-width: 112px; }

.c-chat-info__qa {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-4);
  min-height: 64px;
  padding: var(--spacing-8) var(--spacing-4);
  border: 0;
  border-radius: var(--radius-12);
  background: var(--surface-card);
  color: var(--text-neutral-01);
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-xs);
  line-height: var(--line-height-label-xs);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
.c-chat-info__qa-glyph {
  flex: none;
  color: var(--icon-action-default);       /* the ONE accent on this screen (#875) */
}
.c-chat-info__qa-label {
  max-width: 100%;
  /* ★ #591: WRAPS (see the note above). `overflow-wrap` only does anything once
     wrapping is permitted, which is why it must live HERE and not in a second block
     that a later `nowrap` would beat. */
  white-space: normal;
  overflow-wrap: anywhere;
  text-align: center;
}
/* ★ hover/pressed = ONE VISIBLE STEP from the tile's own ground (the #870 PROPERTY).
   The #870 TOKENS are the sheet pair (a card on --surface-menu); a tile is a card on the
   SCREEN, so tokens.css now carries the card pair beside it — `--surface-card-hover /
   -pressed` (light 200/300 on the 50 card · dark 600/500 on the 800 card; measured
   1.137/1.423 · 1.223/1.357). `--surface-card-raised` was NOT usable as the hover: 1.04
   light / 1.048 dark, the invisible class. */
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__qa:hover { background: var(--surface-card-hover); }
}
.c-chat-info__qa:active { background: var(--surface-card-pressed); }

/* —— generic row —— ★ Session Y: rows live INSIDE a grouped card now. A row is
   full-bleed (the card clips the wash to its corners), carries its own 12px inline
   padding, and stacks with the inset hairline drawn by the card rule above. The switch
   row and the address row are gone (Mute tile · hero address); `--row-h-nav` 48 is the
   canon height (Session I), a member row 56, a tx row its own. */
.c-chat-info__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-8);
  min-height: var(--row-h-nav);     /* ★ Session I canon: 48 (was 52 — #149② "44 target + disc breathing room") */
  padding-inline: var(--spacing-12);
}
/* ★ Session Y (#875 P1): the ROW GLYPH — bare 22px, monochrome, no disc. Colour is a
   ROLE: --icon-neutral-02 for every row, --icon-error under the destructive tone. */
.c-chat-info__row-glyph { flex: none; color: var(--icon-neutral-02); }

/* setting row (#142: disappearing messages) — a tappable row: label · value · chevron */
.c-chat-info__setting {
  width: 100%;
  border: 0;
  background: transparent;
  border-radius: 0;                 /* ★ Session Y: full-bleed inside the card; the card clips */
  cursor: pointer;
  text-align: start;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
/* the disappearing-messages row is wrapped in its own group (one card, one row) so a
   divider/hairline can only ever land on the CARD's children, never on the button — the
   button keeps a tight border-box so its pressed/focus state stays on the row and never
   bleeds up into a divider gap (Damir: tap area + pressed state were off) */
.c-chat-info__setting-section > .c-chat-info__card > .c-chat-info__setting { width: 100%; }
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__setting:hover { background: var(--surface-card-hover); }
}
.c-chat-info__setting:active { background: var(--surface-card-pressed); }
.c-chat-info__setting-value {
  margin-inline-start: auto;
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-md);
  flex: none;
}
.c-chat-info__setting > svg:last-child { color: var(--icon-neutral-02); flex: none; }

/* disappearing-messages option sheet */
.c-chat-info__sd { display: flex; flex-direction: column; gap: var(--spacing-4); }
.c-chat-info__sd-hint {
  margin: 0 0 var(--spacing-8);
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
}
.c-chat-info__sd-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-8);
  min-height: 48px;
  padding: 0 var(--spacing-12);
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  cursor: pointer;
  text-align: start;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__sd-option:hover { background: var(--surface-card-hover); }
}
.c-chat-info__sd-option:active { background: var(--surface-card-pressed); }
.c-chat-info__sd-option-label {   /* keep the label put; ellipsize if ever long */
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* fixed right-hand slot: the success check (checked) OR the loading spinner (in
   flight) live HERE, so tapping never shifts the label (Damir) */
.c-chat-info__sd-status {
  flex: none;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--icon-success);       /* success token — theme-correct (light 600 / dark 400); spinner inherits it */
}
.c-chat-info__sd-check { visibility: hidden; }
.c-chat-info__sd-option[aria-checked='true'] { font-weight: var(--font-weight-semibold); }
.c-chat-info__sd-option[aria-checked='true'] .c-chat-info__sd-check { visibility: visible; }
.c-chat-info__sd-option[data-loading] .c-chat-info__sd-check { display: none; }   /* the spinner takes the slot */
.c-chat-info__row-label {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);          /* ★ Session Y: glyph 22 + 12 = the label edge (hairline inset) */
  min-width: 0;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  font-weight: var(--row-title-weight);   /* ★ Session J: same notch as the settings rows (tokens.css) */
}
/* ★ Session Y (#875): the notifications SWITCH (`__switch`, `__switch-knob`, the 56px
   switch row) is RETIRED with its row — Mute is a tile in the action row. Rules deleted,
   not left dangling: dead CSS ships inlined into every built shell (#591's rule). */
@media (prefers-reduced-motion: reduce) {
  /* #591: __qr-chevron left with the retired address card; Session Y: the switch too */
  .c-chat-info__txs-chevron { transition: none; }
}

/* —— shared media (flagged) —— ★ Session Y: a grouped section — the head (label +
   See all) is the wrapper's first child, the strip sits inside the card with its own
   padding (cards carry none; rows/strips do). */
.c-chat-info__media-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline-end: var(--spacing-4);
}
.c-chat-info__media-strip {
  display: flex;
  gap: var(--spacing-8);
  overflow-x: auto;
  padding: var(--spacing-12);
}
.c-chat-info__media-thumb {
  flex: none;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-12);
  background: var(--surface-neutral-01);
  color: var(--icon-neutral-02);
  overflow: hidden;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.c-chat-info__media-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* —— members —— ★ Session Y: the "Members (N)" label is outside; search + the roster
   are the card's children (a hairline lands between them via the card rule). */
.c-chat-info__members .c-search-field { margin: var(--spacing-12) var(--spacing-12) var(--spacing-8); }
.c-chat-info__member-list { display: flex; flex-direction: column; }
/* ★ Session H: the incremental fill's skeleton tail — a transparent wrapper so its
   skeleton rows stack exactly like real rows while real batches insert above it. */
.c-chat-info__member-fill { display: flex; flex-direction: column; }
.c-chat-info__member {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-height: var(--row-h-member);  /* ★ Session I canon: 56 */
  padding: var(--spacing-4) var(--spacing-12);   /* ★ Session Y: full-bleed in the card, 12 inline like every row */
  border: 0;
  border-radius: 0;                 /* the card clips the wash to ITS corners (#149①, for every group now) */
  background: transparent;
  text-align: start;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__member:hover { background: var(--surface-card-hover); }
}
.c-chat-info__member:active { background: var(--surface-card-pressed); }
.c-chat-info__member-name {
  flex: 1;
  min-width: 0;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.c-chat-info__member-badge { flex: none; }
.c-chat-info__member > svg:last-child { color: var(--icon-neutral-02); flex: none; }
.c-chat-info__member-note {
  padding: var(--spacing-12);
  color: var(--text-neutral-02);
  font-size: var(--font-size-body-sm);
}

/* —— payments (#142: collapsed accordion — reveal grammar shared with Show QR) —— */
/* #149① (Damir): tx rows run FULL-BLEED across the card — the press state spans edge
   to edge instead of a floating inset rectangle. ★ Session Y: the card carries NO
   padding any more, so the negative margins that cancelled it are gone; the card's
   own `overflow: hidden` clips the rows to radius 12. */
.c-chat-info__txs-list {
  display: flex;
  flex-direction: column;
}
.c-chat-info__txs-list .c-txlist-item { border-radius: 0; }
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__txs-list .c-txlist-item:hover:not([aria-current]) { background-color: var(--surface-card-hover); }   /* ★ Session Z (#46 loop A-3): the card pair for a card-hosted family */
}
/* the accordion toggle IS the group's title row — the row grammar (48, 12 inline,
   glyph + label), Medium like every row title (--row-title-weight, Session J) */
.c-chat-info__txs-toggle {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-height: var(--row-h-nav);
  padding: 0 var(--spacing-12);
  border: 0;
  background: transparent;
  color: var(--text-neutral-01);
  font-size: var(--font-size-body-md);
  font-weight: var(--row-title-weight);
  cursor: pointer;
  border-radius: 0;
  text-align: start;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__txs-toggle:hover { background: var(--surface-card-hover); }
}
.c-chat-info__txs-toggle:active { background: var(--surface-card-pressed); }
.c-chat-info__txs-chevron {
  margin-inline-start: auto;
  transition: transform var(--duration-200) var(--easing-standard);
}
.c-chat-info__txs-toggle[aria-expanded='true'] > .c-chat-info__txs-chevron {
  transform: rotate(180deg);        /* child combinator — the #137 M4 lesson */
}
.c-chat-info__txs-all {
  min-height: 44px;
  padding: 0 var(--spacing-12);
  border: 0;
  background: transparent;
  color: var(--text-action-default);
  font-size: var(--font-size-label-md);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  border-radius: var(--radius-8);
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}

/* —— destructive zone —— ★ Session Y (#875 P2/P4, #873): ONE grouped card, placed by
   kind in chat-info.js (1:1 last · group/bot above the roster). #142's "separated,
   bordered rows" and #618's "one card per row" are both superseded by the group card:
   the rows are ordinary rows of THIS screen, the tier lives in the ROLE.
   ⚠ It is a <button>, so every inherited button default has to be spelled out —
   a half-reset button in a card is how one row ends up a pixel off from its
   neighbours. */
.c-chat-info__row--action {
  /* ★★ V-14 (#46 loop 2026-08-29): TEN interactive rules in this file carry this kill
   * and #618's new row did not — so on Android it painted its own :active wash AND a
   * square platform rectangle over a rounded card. There is no global reset to fall
   * back on: base.css and tokens.css contain zero occurrences. */
  -webkit-tap-highlight-color: transparent;
  width: 100%;
  border: 0;
  border-radius: 0;                 /* full-bleed in the card; the card clips */
  background: transparent;          /* NO fill, NO elevation — the card is the surface */
  color: var(--text-neutral-01);
  font-family: inherit;
  font-size: var(--font-size-body-md);
  font-weight: var(--row-title-weight);
  text-align: start;
  cursor: pointer;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  .c-chat-info__row--action:hover { background: var(--surface-card-hover); }
}
.c-chat-info__row--action:active { background: var(--surface-card-pressed); }
/* the chevron reads as chrome, like every other row's */
.c-chat-info__row--action > svg { color: var(--icon-neutral-02); flex: none; }
/* ★ #875 P4 — RED IS A ROLE, NOT A FILL. The irreversible row (Remove contact · Leave
   group) sets its LABEL on --text-error and its glyph on --icon-error; nothing is
   painted red. The reversible row (Delete history, tone "quiet") is every other row.
   Contrast owed at build (#769): --text-error on --surface-card, both themes — the
   suite computes it. */
.c-chat-info__row--action[data-tone="error"] .c-chat-info__row-label { color: var(--text-error); }
.c-chat-info__row--action[data-tone="error"] .c-chat-info__row-glyph { color: var(--icon-error); }

.c-chat-info__confirm-error {
  margin: var(--spacing-8) 0 0;
  color: var(--text-error);
  font-size: var(--font-size-body-sm);
}

/* member-sheet injected actions (#141) — lives here: the opt only exists for
   chat-info's admin path today */
.c-member__actions {
  display: flex;
  gap: var(--spacing-8);
  margin-top: var(--spacing-8);
  width: 100%;                      /* #150②: the sheet centers its children — the
                                       hugging row made Kick/Ban read smaller than
                                       Pay/Request; span the row, flex:1 splits it */
}
.c-member__actions > .c-button { flex: 1; }

/* ★ A8 (Batch A 2026-08-24): skeleton rows while the roster / shared-groups pushes
   land. Neutral wash, a slow shimmer (off under reduced motion), never interactive.

   ★ #591 (Damir 2026-08-26): "it needs to have the EXACT same placement as the elements
   here, and it needs to be more visible, a notch or 2."

   TWO STEPS UP, not one: `--surface-neutral-02` is the same fill the cards on this
   screen already paint, so a skeleton drawn in it was a shape the eye read as content
   rather than as absence. `--surface-neutral-04` is two rungs of the ramp and reads as
   a placeholder in both themes.

   ⚠ PLACEMENT is the other half, and it is the half that matters more: a skeleton whose
   boxes MOVE when the data lands is worse than no skeleton at all. The row itself is
   already the real `.c-chat-info__member` (same min-height, padding, gap), so the two
   things that could still shift are the line's HEIGHT and its BASELINE. The line is now
   the real name's line-height, centred in the same box the text occupies, so the swap
   is a colour change and nothing reflows. */
.c-chat-info__member--skeleton { cursor: default; pointer-events: none; }
.c-chat-info__skeleton-avatar {
  flex: none;
  width: var(--size-avatar-40); height: var(--size-avatar-40);
  border-radius: var(--radius-full);
  background: var(--surface-neutral-04);
}
.c-chat-info__skeleton-line {
  /* the real row's name is body-md; matching its LINE BOX is what stops the jump */
  height: var(--line-height-body-md);
  border-radius: var(--radius-full);
  background: var(--surface-neutral-04);
}

/* c-search-field — text-field/large specialization (docs/chip-search-spec.md,

:root[data-desktop] .c-search-field {

/* Figma text-field used outline-info (hover) + text-action-default (focus) as

   — with the glyph and the clear affordance in action ink. Placed AFTER :hover and
   :focus-within (equal specificity, source order decides) so the filtering state

   unbounded preferred height grew the sheet UPWARD past the host's top edge, where

   near-full sheet with no visible way out. The sheet is a flex column capped at 100%

     `bottom: var(--kb-inset)` still applied — the sheet was LIFTED by the keyboard's

     and the top of the QR above the top of the screen, with nothing scrollable and no
