  gap: var(--spacing-8);
  font-size: var(--font-size-label-sm);
  line-height: var(--line-height-label-sm);
  letter-spacing: var(--tracking-label-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
}
.c-tcard__time {
  flex: none;
  font-size: var(--font-size-body-xs);
  line-height: var(--line-height-body-xs);
  color: var(--text-neutral-02);
}

/* amount (payment) — Sora, tone-driven per Figma */
.c-tcard__amount {
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}
/* ★ #1004 (D-03, Damir 2026-09-28): a pending amount is NOT a warning — orange read as an error.
   The status (chip / quiet foot) carries "pending"; the number stays the primary ink. Was --text-warning. */
.c-tcard__amount[data-tone="pending"] { color: var(--text-neutral-01); }
.c-tcard__amount[data-tone="positive"] { color: var(--text-amount-positive); }   /* ★ #1048 */
.c-tcard__amount[data-tone="neutral"] { color: var(--text-neutral-01); }
.c-tcard__amount[data-tone="void"] {
  color: var(--text-neutral-disabled);
  text-decoration: line-through;
}
.c-tcard__unit { font-size: 0.62em; font-weight: var(--font-weight-bold); } /* 0.62 sanctioned: IXI/amount ratio from Figma payment cards */
.c-tcard__fiat {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}
.c-tcard__fiat[data-tone="void"] { text-decoration: line-through; color: var(--text-neutral-disabled); }

.c-tcard__badge { margin-top: var(--spacing-8); }

/* ★ #1020: a card that ACTS (the full card, #996) is at least wide enough for its two buttons side
   by side — #591's hug made a short app name stack Decline over Join as two full-width slabs. It
   still hugs above this floor, and the Session J wrap still saves a long localized pair. */
.c-tcard:not([data-layout]) { min-width: min(var(--bubble-max-pct), 264px); }   /* 264 sanctioned: two 32px buttons + gap inside the 12px padding */
.c-tcard__actions {
  display: flex;
  flex-wrap: wrap;            /* ★ Session J: a button that cannot fit beside its neighbour takes the next row, whole */
  gap: var(--spacing-8);
  margin-top: var(--spacing-12);
}
/* r2 backlog B4: flex:1 + nowrap labels overflowed the card at <320px —
   buttons may shrink, labels ellipsize.
   ★ Session J (Damir, de-de screenshot "App star…": "in some languages the buttons in
   bubbles are not visible completely — should be full"): the ELLIPSIS IS GONE. A button
   keeps its label's full width as its minimum (no `min-width: 0`), the row WRAPS, so on
   a card too narrow for "Abbrechen" + "App starten" side by side the second button drops
   to its own full-width row instead of losing its verb. The B4 overflow cannot return:
   wrapping is what absorbs it now. Reversal = `min-width: 0` + the ellipsis trio. */
.c-tcard__actions .c-button { flex: 1 1 auto; }
/* ★ #1020: TWO actions sit side by side, equal width (secondary · primary) — actionsRow stamps
   data-width="full" (button.css: width 100%), which forced every pair onto two rows however wide
   the card. `flex-basis: 0` + `width: auto` share the row; each button's min-content (its label)
   is still its floor, so a pair too long for one row still wraps, whole (Session J). */
.c-tcard__actions .c-button[data-width="full"] { width: auto; flex: 1 1 0; min-width: max-content; }
.c-tcard__actions .c-button .c-button__label { white-space: nowrap; }

.c-tcard__note {
  margin-top: var(--spacing-8);
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}

/* Details › — hairline above, action-ink link row */
.c-tcard__details {
  margin-top: var(--spacing-12);
  padding-top: var(--spacing-8);
  border-top: var(--outline-width-1) solid var(--outline-card-divider);   /* ★ #993: own role — invisible on the dark received card (#989 review M1) */
}
.c-tcard__details-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-4);
  border: 0;
  background: transparent;
  padding: var(--spacing-4) 0;
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-sm);
  font-weight: var(--font-weight-semibold);
  letter-spacing: var(--tracking-label-sm);
  color: var(--text-action-default);
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine) {
  .c-tcard__details-btn:hover { color: var(--text-action-hover); }
}
.c-tcard__details-btn:active { color: var(--text-action-pressed); }

/* app identity row */
.c-tcard__app {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
}
.c-tcard__app-icon {
  width: var(--size-avatar-40);
  height: var(--size-avatar-40);
  border-radius: var(--radius-12);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-medallion);   /* #989 */
  color: var(--icon-medallion);
  flex: none;
}
.c-tcard__app-icon img { width: 100%; height: 100%; object-fit: cover; }
/* ★★ #1020: the no-icon app is a MONOGRAM on the identity gradient (the avatar treatment) */
.c-tcard__app-icon.c-tcard__app-icon--mono {
  background: linear-gradient(180deg, var(--av-c1, #2CB1FF), var(--av-c2, #3480EC));   /* sanctioned: the avatar fallback pair (avatar.css) */
  color: #fff;   /* sanctioned: a white initial on the identity gradient (avatar grammar) */
}
.c-tcard__app-initial {
  font-size: var(--font-size-label-lg);
  line-height: 1;
  font-weight: var(--font-weight-bold);
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);   /* sanctioned: the #1001 avatar initials shadow */
}
.c-tcard__app-info { display: flex; flex-direction: column; min-width: 0; }
.c-tcard__app-name {
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-01);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-tcard__app-sub {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}

/* call card — ★★ #1006 (D-07): ONE compact row. The medallion is the reskin's own
   (.c-tcard__medallion, above); the outcome tints it. Only a MISSED call is red. */
.c-tcard__call {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  min-height: var(--size-avatar-48);
}
.c-tcard__call-info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.c-tcard__call .c-tcard__title { flex: none; display: block; font-size: var(--font-size-label-md); line-height: var(--line-height-label-md); }
.c-tcard__call-meta {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}
.c-bubble-row[data-call-outcome="missed"] .c-tcard__title { color: var(--text-error); }
.c-bubble-row[data-call-outcome="missed"] .c-tcard__medallion {
  background: var(--surface-destructive-tonal-default);
  color: var(--icon-error);
}
.c-bubble-row[data-call-outcome="rejected"] .c-tcard__medallion,   /* ★ #1080 F11: the peer declined — the declined grammar */
.c-bubble-row[data-call-outcome="declined"] .c-tcard__medallion,
.c-bubble-row[data-call-outcome="noanswer"] .c-tcard__medallion {
  background: var(--surface-neutral-03);
  color: var(--icon-neutral-02);
}
/* ⚠ #1012 (Opus r1 m5): "no answer" is ALWAYS outgoing, so it sits on the #1003 sent tint —
   neutral-03 measured 1.04:1 there and the disc vanished. One step deeper on the sent side. */
.c-bubble-row[data-direction="sent"][data-call-outcome="rejected"] .c-tcard__medallion,
.c-bubble-row[data-direction="sent"][data-call-outcome="declined"] .c-tcard__medallion,
.c-bubble-row[data-direction="sent"][data-call-outcome="noanswer"] .c-tcard__medallion { background: var(--surface-neutral-04); }
/* the round 36px call-back button — the only tap target on the card */
.c-tcard__call-back {
  flex: none;
  width: 36px;               /* 36 sanctioned: the call-back disc (#1006) — the ⊕ / send disc size */
  height: 36px;
  margin-inline-start: var(--spacing-4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-full);
  padding: 0;
  background: var(--surface-action-tonal-default);
  color: var(--icon-action-default);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
/* 44px hit area on a 36px disc (the #990 precedent) */
.c-tcard__call-back::after { content: ''; position: absolute; inset: -4px; border-radius: var(--radius-full); }
/* ⚠ #1012 (Opus r1 m6): the disc keeps its tonal fill under the pointer — dark tonal-hover/-pressed
   are the SOLID action blue (primary-600/-500; the #1007 nav artifact) and the icon measured 2.67:1
   on it. Only the INK moves. */
@media (hover: hover) and (pointer: fine) {
  .c-tcard__call-back:hover { color: var(--icon-action-hover); }
}
.c-tcard__call-back:active { color: var(--icon-action-pressed); }
.c-tcard__call-back:focus-visible { outline: 2px solid var(--outline-focus); outline-offset: 2px; }

/* —— file bubble (compact) —— */
.c-fbubble {
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  max-width: min(var(--bubble-max-pct), var(--layout-card-max)); /* #337: card rail */
  padding: var(--spacing-8) var(--spacing-12);
  border: 0;
  border-radius: var(--radius-16);
  background: var(--surface-bubble-received);
  color: var(--text-bubble-received);
  /* the same edge + lift as .c-tcard above */
  box-shadow: inset 0 0 0 1px var(--border-bubble-received), inset 0 0 0 1px var(--outline-hairline), inset 0 1px 0 var(--highlight-top), var(--bubble-elevation);
  cursor: pointer;
  text-align: start;
  font-family: var(--font-secondary);
  -webkit-tap-highlight-color: transparent;
}
/* ★★ #1021 (Damir 2026-09-28: "premiumize the file transfer"): the DOCUMENT TILE — a 40×44
   squircle on the disc/avatar palette by file family (#1017 tokens, 180° gradient, white label),
   the extension in small caps, and a corner badge for the state (download on an offer, retry on a
   failure) ringed in the card's own surface. Hover/press brighten/darken the tile — no colour swap. */
.c-fbubble__icon {
  position: relative;
  width: 40px;             /* 40 sanctioned: the document tile (#1021) — the avatar-40 width, a page's taller aspect */
  height: 44px;            /* 44 sanctioned: the document tile's height */
  border-radius: var(--radius-8);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--disc-grad-neutral);
  color: #fff;             /* sanctioned: a white label on a palette gradient (the c-disc grammar) */
  flex: none;
  transition: filter var(--duration-100) var(--easing-standard);
}
/* ★★ #1031 (dial M3, #1022): the white extension label is 11px bold — WCAG wants 4.5:1, and on the
   raw avatar gradients it read 2.7–3.3:1 at the label's height (the tile's midpoint). A uniform 25% black
   SHADE under the family gradient lifts every family to ≥ 4.5:1 at the midpoint (computed in the suite:
   code 4.52 is the floor) while keeping the hue — the avatars keep the raw pairs (#364 covers initials).
   One token, so the whole ladder moves together; rendered before/after both themes. */
.c-fbubble__icon { background: var(--tile-shade), var(--disc-grad-neutral); }
.c-fbubble__icon[data-kind="pdf"]     { background: var(--tile-shade), var(--disc-grad-11); }   /* rose */
.c-fbubble__icon[data-kind="doc"]     { background: var(--tile-shade), var(--disc-grad-7); }    /* blue */
.c-fbubble__icon[data-kind="archive"] { background: var(--tile-shade), var(--disc-grad-1); }    /* orange */
.c-fbubble__icon[data-kind="image"]   { background: var(--tile-shade), var(--disc-grad-4); }    /* green */
.c-fbubble__icon[data-kind="audio"]   { background: var(--tile-shade), var(--disc-grad-9); }    /* purple */
.c-fbubble__icon[data-kind="video"]   { background: var(--tile-shade), var(--disc-grad-10); }   /* pink */
.c-fbubble__icon[data-kind="code"]    { background: var(--tile-shade), var(--disc-grad-6); }    /* cyan */
.c-fbubble__ext {
  max-width: 36px;         /* ★ #1022 (r1 N4): a wide 4-letter extension from a peer clips inside the 40px tile */
  overflow: hidden;
  white-space: nowrap;
  font-size: 11px;         /* sanctioned: the extension label on the tile (#1021) — below the type ramp by design */
  line-height: 1;
  font-weight: var(--font-weight-bold);
  letter-spacing: 0.02em;
  text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);   /* sanctioned: the #1001 avatar initials shadow */
}
.c-fbubble__icon > svg { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25)); }   /* sanctioned: same shadow for the no-extension glyph */
.c-fbubble__badge {
  position: absolute;
  inset-block-end: -4px;
  inset-inline-end: -6px;
  width: 20px;
  height: 20px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-action-default);
  color: var(--text-neutral-on-action);
  box-shadow: 0 0 0 2px var(--surface-bubble-received);   /* ring cut against the card */
}
.c-bubble-row[data-direction="sent"] .c-fbubble__badge { box-shadow: 0 0 0 2px var(--surface-card-sent); }
.c-fbubble[data-state="failed"] .c-fbubble__badge { background: var(--error-600); color: var(--text-neutral-on-destructive); }   /* #1062 #46 r1 (C MINOR-3): the failed badge keeps the LOUD red — the quieter dark destructive fill is for the dialog button; white on error-600 = 6.64:1 as before */
/* ★ #1022 (Opus r1 M2): no desaturation on the failed tile — a filter reaches the red retry badge
   too and the hover filter replaced it anyway; the red badge + the red retry line carry the state. */
@media (hover: hover) and (pointer: fine) {
  .c-fbubble:not(:disabled):hover .c-fbubble__icon { filter: brightness(0.96); }   /* ★ S9 H-16 f (#1247): darken on hover — the white label stays ≥ 4.5:1 (1.06 dropped it to 4.09:1) */
}
.c-fbubble:not(:disabled):active .c-fbubble__icon { filter: brightness(0.92); } /* audit: no pressed feedback */
.c-fbubble:disabled { cursor: default; } /* progress state */
.c-fbubble__info { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: var(--spacing-2); }
.c-fbubble__name {
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  font-weight: var(--font-weight-semibold);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.c-fbubble__meta {
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  color: var(--text-neutral-02);
}
.c-fbubble[data-state="failed"] .c-fbubble__meta { color: var(--text-error); }
.c-fbubble__meta[data-cta] { color: var(--text-action-default); font-weight: var(--font-weight-semibold); }   /* ★ #1021: "Tap to download" reads as the action */
.c-fbubble__meta[data-pct] { font-variant-numeric: tabular-nums; }
.c-fbubble__track {
  height: var(--spacing-4);
  border-radius: var(--radius-full);
  background: var(--surface-progress-track);
  overflow: hidden;
  margin-top: var(--spacing-2);
}
/* dark: global track token (neutral-700) equals the card surface — invisible (audit MAJOR) */
[data-theme="dark"] .c-fbubble__track { background: var(--surface-neutral-04); }
.c-fbubble__fill {
  display: block;
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--surface-progress-fill);
  transition: width var(--duration-200) var(--easing-standard);
}
/* keep-open hint — progress state only (P2P: both peers must stay online) */
.c-fbubble__hint {
  margin-top: var(--spacing-2);
  font-size: var(--font-size-body-xs);
  line-height: var(--line-height-body-xs);
  color: var(--text-neutral-02);
}
/* "Open file" affordance — complete state only (A8b). Link-like accent text so a
   finished download reads as actionable; the whole bubble is the button. */
.c-fbubble__open {
  margin-top: var(--spacing-4);
  font-size: var(--font-size-label-sm);
  line-height: var(--line-height-label-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-action-default);
}

/* ★ #1190 (#1173 (4)): my file not on this device — the compact card, no tap feedback */
.c-fbubble[data-unavailable] { cursor: default; }
.c-fbubble[data-unavailable]:active .c-fbubble__icon,
.c-fbubble[data-unavailable]:hover .c-fbubble__icon { filter: none; }
/* ★ #1190 (#1173 (3), #1188 b): a received file deleted from this device — italic grey, not a control */
.c-fbubble--gone {
  align-items: baseline;
  gap: var(--spacing-8);
  padding: var(--spacing-8) var(--spacing-12);
  cursor: default;
}
.c-fbubble__gone {
  min-width: 0;
  font-size: var(--font-size-body-sm);
  line-height: var(--line-height-body-sm);
  font-style: italic;
  color: var(--text-neutral-02);
  overflow-wrap: anywhere;
}

.c-fbubble__time {
  align-self: flex-end;
  flex: none;
  font-size: var(--font-size-body-xs);
  line-height: var(--line-height-body-xs);
  color: var(--text-neutral-02);
}
/* ★★ #1028 (walk P.22): a SENT file's time + delivery tick — one stamp, the text bubble's meta grammar
   (time · tick, the same 2px gap the #1028 tick crossfade overlaps by). sending/sent/delivered read in the
   stamp's own neutral ink (delivered stays neutral, iOS-16 #283); READ is the success green, as on a text
   bubble; each tone is ≥ 3:1 on the sent card in both themes (smoke #1028, computed). */
.c-fbubble__stamp {
  align-self: flex-end;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-2);
}
.c-fbubble__stamp .c-fbubble__time { align-self: auto; }
.c-fbubble__stamp .c-status-icon { flex: none; color: var(--text-neutral-02); }
.c-fbubble__stamp .c-status-icon[data-tone="read"] { color: var(--icon-success); }
.c-fbubble__stamp .c-status-icon[data-tone="failed"] { color: var(--icon-error); }   /* ★ #1045 (#46 r3): a failed file reads red like every failed status (was the stamp's grey) */
/* ★ A8 (#1126, Damir: "time and status reduced opacity in file bubbles and app as well, so READ is noticeable —
   same as the outgoing bubbles"): the text bubble's A9 / #1041 rule on the file stamp, the received file's lone
   time and the typed / app card time — 0.7 on the CHILDREN (a box opacity would cap the read tick), READ and
   FAILED stay 1.0. Reversal = delete these three rules. */
.c-fbubble__stamp > *,
.c-fbubble > .c-fbubble__time,
.c-tcard__time { opacity: 0.7; }
/* the tick needs the [data-tone] weight: where chatlist-item.css is ALSO loaded (the desktop demo; the chats list shells),
   its global delivered fade (0,2,0) would otherwise win */
.c-fbubble__stamp .c-status-icon[data-tone] { opacity: 0.7; }
.c-fbubble__stamp .c-status-icon[data-tone="read"],
.c-fbubble__stamp .c-status-icon[data-tone="failed"] { opacity: 1; }

/* —— unread divider (full width) —— */
.c-unread-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  margin: var(--spacing-12) 0;
  padding: var(--spacing-4) var(--spacing-16);
  /* ★ GLASS (Damir picked B, 2026-09-08). ⚠ FULL-BLEED IS DELIBERATE — he asked for the
     strip to stay the full width ("i like the full length unread"); option D turned it
     into a centred pill and was NOT taken. Only the fill and the hairlines change. */
  background: var(--surface-unread-strip);   /* ★ #1080 F16: its own role (light = the glass; dark lifts) */
  -webkit-backdrop-filter: blur(var(--blur-chat-glass)) saturate(160%);
  backdrop-filter: blur(var(--blur-chat-glass)) saturate(160%);
  border-block: var(--outline-width-1) solid var(--outline-unread-strip);
  color: var(--text-unread-strip);
  font-size: var(--font-size-label-xs);
  line-height: var(--line-height-label-xs);
  letter-spacing: var(--tracking-label-xs);
  font-weight: var(--font-weight-semibold);
}/* same fallback as the day pill — see message-bubble.css. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .c-unread-divider {
    background: var(--surface-chat-chip);
    border-block-color: var(--outline-neutral-02);
  }
}


/* #334 — file-send CANCEL (own un-accepted offer; sibling of the bubble button,
   sits left of the sent bubble under flex-end). Quiet text control, action ink. */
.c-bubble-row > .c-fbubble__cancel {
  align-self: center;
  border: 0;
  background: none;
  padding: var(--spacing-4) var(--spacing-8);
  color: var(--text-action-default);
  font-family: inherit;
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  border-radius: var(--radius-8);
}
.c-bubble-row > .c-fbubble__cancel:active { color: var(--text-action-pressed); }
@media (hover: hover) and (pointer: fine) {
  .c-bubble-row > .c-fbubble__cancel:hover { color: var(--text-action-hover); }
}

/* ★ B2 (#533 ①): the app card's terminal tombstones — declined (theirs) / canceled (mine)
   read VOID: muted name + sub, the icon dimmed. Nothing else on the card changes. */
.c-tcard[data-state="declined"] .c-tcard__app-icon,
.c-tcard[data-state="canceled"] .c-tcard__app-icon { opacity: var(--opacity-disabled); }
.c-tcard[data-state="declined"] .c-tcard__app-name,
.c-tcard[data-state="canceled"] .c-tcard__app-name { color: var(--text-neutral-02); }

/* ★★ #996 THE RESKIN (Damir's pick: "keep today's cards, but have compact for settled") — the
   COMPACT pill for a payment/app card with no button, and the shared medallion + padding the
   one-row call card (#1006) reads too. A card with a button keeps the full .c-tcard rules above.
   Surfaces, edges and lift are the .c-tcard rules above (#989 / #1003 tokens). */
.c-tcard[data-layout] { padding: var(--spacing-8) var(--spacing-12); }
/* The pill is a 2-column grid: the medallion spans the rows; the label takes the first line; the
   value and the foot share ONE wrapping line (.c-tcard__line) — ★ #1013 (Opus r2 M1): the old
   3-column grid (value · foot in their own tracks, minmax(max-content, …)) pushed the foot PAST the
   card edge on 320–430px phones (measured +2…+79px); in a wrapping line the foot drops under the
   amount, end-aligned, and nothing leaves the card. A long localized label still wraps on its own
   line and never squeezes the amount. */
.c-tcard__main {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: "med label" "med line" "med sub";
  column-gap: var(--spacing-12);
  align-items: center;
}
.c-tcard__main > .c-tcard__medallion { grid-area: med; align-self: center; }
.c-tcard__col { display: contents; }
.c-tcard__col > .c-tcard__label { grid-area: label; }
.c-tcard__col > .c-tcard__line { grid-area: line; }
.c-tcard__col > :nth-child(3) { grid-area: sub; }
.c-tcard__line {
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: var(--spacing-16);
}
.c-tcard__medallion {
  flex: none;
  width: var(--size-avatar-40);
  height: var(--size-avatar-40);
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-medallion);
  color: var(--icon-medallion);
  overflow: hidden;
}
.c-tcard__medallion.c-tcard__app-icon { border-radius: var(--radius-12); }
.c-tcard__label {
  min-width: 0;
  font-size: var(--font-size-label-sm);
  line-height: var(--line-height-label-sm);
  letter-spacing: var(--tracking-label-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--text-neutral-02);
  overflow-wrap: break-word;
}
.c-tcard[data-layout] .c-tcard__amount { white-space: nowrap; }
.c-tcard__foot {
  margin-inline-start: auto;       /* end-aligned on the amount's line, and on its own line when it wraps */
  display: inline-flex;
  align-items: center;
  gap: var(--spacing-8);           /* the line's 16px column gap is the space before it (was 28: a 12px margin + 4px pad + 12px gap) */
  font-size: var(--font-size-body-xs);
  line-height: var(--line-height-body-xs);
  color: var(--text-neutral-02);
}
.c-tcard__status { display: inline-flex; align-items: center; gap: var(--spacing-4); }
.c-tcard__status-dot {
  width: 6px;              /* 6 sanctioned: the quiet status dot (#996) — a mark, not a badge */
  height: 6px;
  border-radius: var(--radius-full);
  background: var(--icon-neutral-02);
}
.c-tcard__status[data-tone="success"] .c-tcard__status-dot { background: var(--icon-success); }
.c-tcard__status[data-tone="error"] .c-tcard__status-dot { background: var(--icon-error); }
/* the whole pill is the Details button: a stretched, transparent hit layer */
.c-tcard__hit {
  position: absolute;
  inset: calc(-1 * var(--spacing-8)) calc(-1 * var(--spacing-12));
  border: 0;
  margin: 0;
  padding: 0;
  background: transparent;
  border-radius: var(--radius-16);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.c-tcard__hit:focus-visible { outline: 2px solid var(--outline-focus); outline-offset: 0; }
/* the hit layer is the FIRST child, so its states reach the medallion with a sibling
   combinator (no :has — conservative-CSS baseline).
   ★ #1013 (r2 m1): the #1012 m6 rule, applied to the pill — dark tonal-hover/-pressed are the
   SOLID action blue and the medallion ink fell to 1.95:1 on the pressed one. The disc keeps its
   fill; only the INK moves, exactly as the call-back disc does. */
@media (hover: hover) and (pointer: fine) {
  .c-tcard__hit:hover ~ .c-tcard__medallion { color: var(--icon-action-hover); }
}
.c-tcard__hit:active ~ .c-tcard__medallion { color: var(--icon-action-pressed); }
/* #1020: a monogram tile keeps its white initial under the pointer (the ink move is for the tonal disc) */
@media (hover: hover) and (pointer: fine) {
  .c-tcard__hit:hover ~ .c-tcard__app-icon.c-tcard__app-icon--mono { color: #fff; }   /* sanctioned: the white initial (avatar grammar) */
}
.c-tcard__hit:active ~ .c-tcard__app-icon.c-tcard__app-icon--mono { color: #fff; }   /* sanctioned: the white initial (avatar grammar) */
.c-tcard[data-state="declined"] .c-tcard__medallion,
.c-tcard[data-state="canceled"] .c-tcard__medallion { opacity: var(--opacity-disabled); }
/* ★ #1009 (10a): completed = a small check (success ink) instead of the dot; a LIVE completion
   (data-live-complete, one render only) crossfades the status in and draws the check once (≈400ms). */
.c-tcard__status-check {
  width: 12px;               /* 12 sanctioned: the quiet-status mark (#996) — the dot's companion */
  height: 12px;
  flex: none;
  fill: none;
  stroke: var(--icon-success);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@keyframes c-tcard-status-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes c-tcard-check-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.c-tcard[data-live-complete] .c-tcard__status { animation: c-tcard-status-in var(--duration-200) var(--easing-standard) both; }
.c-tcard[data-live-complete] .c-tcard__status-check path {
  stroke-dasharray: 1;
  animation: c-tcard-check-draw calc(var(--duration-200) * 2) var(--easing-standard) both;   /* 400ms from the token */
}
@media (prefers-reduced-motion: reduce) {
  .c-tcard[data-live-complete] .c-tcard__status,
  .c-tcard[data-live-complete] .c-tcard__status-check path { animation: none; }
}

/* ★ S9 U-03 (#1247, measured): 12 % toward black lifts the card's error badge from 4.44:1 to 5.31:1 light · 5.41:1 dark. */
.c-tcard__badge .c-badge[data-weight="tonal"][data-type="error"] {
  color: var(--text-error);
  color: color-mix(in srgb, var(--text-error) 88%, #000);   /* sanctioned: U-03 — black is the mix target (12 % darker), not a paint */
}

</style><!-- ★ A3 (#1126): the Downloads rows reuse the chat's file-type tile (.c-fbubble__icon / __ext) -->
<!-- Q4-③ (#270): call CSS removed — calls present on the native CallPage -->
<style>
  /* Production shell: fill the WebView. downloads.html is loaded by the C#
     DownloadsPage (#264/S8: presented via pushPageLoaded from the Account hub —
     desktop: detail-column pane · mobile: takeover). createSettingsDownloads
     provides its own topbar (variant 'view') with a back button. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #downloads-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #downloads-root > * { flex: 1; min-height: 0; }
  /* Boot spinner — static, theme-colored loader shown during the ~1MB bundle
     parse / before first render (mirrors contact_details.html); the first
     replaceChildren render swaps it out, so the load gap is never blank. */
  .boot { flex: 1; min-height: 100%; display: flex; align-items: center; justify-content: center; }
  .boot__spinner {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    border: 3px solid var(--outline-neutral-02);
    border-top-color: var(--icon-action-default, var(--surface-action-default));
    animation: boot-spin var(--duration-700, 700ms) linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot__spinner { animation: none; } }
  /* ★ #1166 V-3 (#1154) "Show in Downloads": the row C# named carries a tonal wash (the #136 just-sent wash token),
     static — no motion, so nothing to reduce. */
  .c-settings-dl__row[data-highlight] { background-color: var(--surface-action-tonal-default); }
  /* ★ S9 (#1173 (8), #1246 D = B): the DIALOG presentation — desktop "Show in Downloads" opens this
     page in a centred native dialog (C#: ≤ 600 × ≤ 640 over a scrim, its own WebView). The chrome is
     native; the shell's part: the leading ← becomes a trailing ✕ (a dialog closes, it does not go
     back), the title takes the leading edge. Set by the setPresentation('dialog') push. */
  :root[data-presentation="dialog"] .c-settings-dl .c-topbar[data-variant="view"] { padding-inline-start: var(--spacing-16); }
  :root[data-presentation="dialog"] .c-settings-dl .c-topbar[data-variant="view"] > [data-dl-close] { order: 2; margin-inline-start: auto; }
</style>
<style data-device>html,body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important}html:not([data-device-bg="own"]),html:not([data-device-bg="own"]) body{background:var(--surface-screen)!important}.demo-toolbar,.demo-caption,.statusbar{display:none!important}.demo-frames{display:block!important;margin:0!important;gap:0!important;flex-wrap:nowrap!important}.demo-phone{width:100vw!important;height:100vh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}</style>

<body class="c-account"><!-- ★ #1080 F2: this shell IS Account — the Account disc + row dials (settings-shell.css) reach every sublevel and sheet -->
  <div id="downloads-root"><div class="boot"><div class="boot__spinner" role="status" aria-label="Loading" data-sl-aria="loading"></div></div></div>

<script src="spixi.icons.js"></script>
<script src="spixi.strings.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. Before this, production resolved
     'en-us' in EVERY locale. ?lang= still overrides (demos/tests); in a plain-browser
     preview the marker stays un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script>/* M13 (2026-09-08): the STATIC a11y labels below the boot line. They are in the markup so a screen reader has them on the FIRST paint, which is exactly why they could not be written as getStrings() calls — and so they were English in every locale. One walk over [data-sl-aria] relabels them from the dictionary as soon as the DOM exists; the English in the attribute stays as the fallback for a key the dictionary lacks. */
(function(){function r(){for(var e of document.querySelectorAll('[data-sl-aria]')){var v=window.SL&&window.SL[e.dataset.slAria];if(v)e.setAttribute('aria-label',v);}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',r,{once:true});else r();})();</script>
<script src="spixi.bundle.js"></script>
<script>/* ★ L15b (Session Z): the flag font — a device that cannot paint a flag emoji (Windows) gets the flags-only Twemoji face for the regional-indicator block, injected at runtime so the 78 KB is never inlined and never fetched on a phone; flags.js holds the mechanism. Unguarded on purpose: a missing export must fail loudly at boot, not fall silent. ★ #917: the deferred form — no flag on this shell's first screen; a phone probes after load + one frame, desktop stays synchronous (flags.js). */window.Spixi.installFlagFontLater();</script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Downloads shell — the redesigned received-files list wired to the
   * REAL C# MAUI bridge (native.js in the bundle). Loaded by DownloadsPage.
   * ZERO C# change, frozen bridge (bridge-audit-B §6).
   *
   * Contract (DownloadsPage.xaml.cs):
   *   C#→JS: clearFiles() + addFile(name, ctime) per file — pushed WHOLESALE on
   *          load and re-pushed after any delete. ctime = DateTime.ToString(),
   *          a LOCALE-OPAQUE string → displayed verbatim, never parsed.
   *          NOTE: OnAppearing calls onLoad() directly, so pushes can arrive
   *          before ixian:onload.
   *   C#→JS (★ S9, 🟡 NEW): setPresentation('dialog'|'page') — the desktop dialog host (#1173 (8)).
   *   JS→C#: ixian:onload · ixian:back (popPageAsync, #264; ★ S9: also ✕ / Esc in the dialog) · ixian:open:<name>
   *          (fire-and-forget; C# opens/previews via the OS) · ixian:delete:<name>
   *          (C# deletes then re-pushes the whole list) · ixian:deleted (clear all).
   *
   * SECURITY: file names are UNTRUSTED → the component uses textContent only
   * (never innerHTML). The `..` traversal gap on ixian:open/delete is C#-side
   * (bridge-audit-B §6 / §9 flag 5).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createSettingsDownloads, setDownloads,
    createNativeBridge, installExecuteUiCommand,
    attachEdgeBack,   // ★ L3 (#706): the iOS back signal + the one-level chain
    dismissTopOverlay,                   // ★ L3 (Session F): hardware back closes an open confirm first
    attachPressFeedback,
    applyPushedTheme,
    } = window.Spixi;
  const icon = window.SpixiIcons && window.SpixiIcons.icon;   // ★ S9: the ✕ glyph for the dialog presentation (home.html grammar)
  /* D-16 r2/r3 (audits C-4 + Opus finding 2): this shell renders the Downloads
     surface — the FILE rows (.c-settings-dl__open, a press family since r3) and
     one destructive .c-settings__row — and was the one rows-bearing shell without
     the shared press mechanism. */
  attachPressFeedback();
  const strings = window.SL || {};

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  const bridge = createNativeBridge();
  installExecuteUiCommand();

  const root = document.getElementById('downloads-root');

  // Build ONCE with an empty list; the wholesale pushes drive it via setDownloads
  // (rebuilding per push would wipe the search box + scroll position).
  const dlEl = createSettingsDownloads({
    files: [], host: document.body, strings,
    onBack: () => bridge.send('ixian:back'),
    // Q1 review (#267 loop, MAJOR — same fix as the settings.html sublevel): the name
    // is PEER-SUPPLIED and rides an URL → encode it. Unencoded, a decoy named
    // `invoice%2Epdf` survives canonicalization and C#'s UnescapeDataString resolves it
    // onto `invoice.pdf` — a wrong-file open, and a wrong-file DELETE. `%25` round-trips.
    onOpenFile: (name) => bridge.send('ixian:open:' + encodeURIComponent(name)),          // fire-and-forget
    onDeleteFile: (name, ctrl) => { bridge.send('ixian:delete:' + encodeURIComponent(name)); ctrl.done(); }, // C# re-pushes the list
    // NOTE: no onClearAll — DownloadsPage has NO bulk-delete verb (`ixian:deleted`
    // is a SettingsPage verb, dead here → a silent no-op destructive button). Omit
    // the row until the §5 SettingsPage-absorb repoint gives downloads that verb.
    // Per-file delete is the only real bulk path today (audit MAJOR, Batch 5).
  });
  root.replaceChildren(dlEl);

  /* clearFiles + addFile arrive as a burst (one EvaluateJavaScriptAsync frame per
   * file). Buffer between the clear and a short settle so a partial list never
   * paints — then one wholesale setDownloads (contact_details churn precedent). */
  let buf = null, timer = 0;
  /* ★ #1166 V-3 (#1154) "Show in Downloads" (chat info): highlightDownload(<the list's own row key = the stored file
     name>) — set by C# (never a path). Kept for HL_KEEP_MS so the re-push of a second onLoad (OnAppearing + ixian:onload
     both list the files) is marked too; scrolled into view ONCE. Matched by string equality on the row's dataset (never
     a selector built from the name). */
  const HL_KEEP_MS = 4000;
  let hlName = null, hlUntil = 0, hlScrolled = false;
  function applyHighlight() {
    if (hlName === null || Date.now() > hlUntil) { hlName = null; return; }
    let hit = null;
    for (const r of dlEl.querySelectorAll('.c-settings-dl__row')) {
      if (r.dataset.name === hlName) { r.dataset.highlight = ''; hit = r; } else delete r.dataset.highlight;
    }
    if (hit && !hlScrolled) {
      hlScrolled = true;
      try { hit.scrollIntoView({ block: 'center' }); } catch (e) {}
    }
  }
  function settle() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (buf !== null) { setDownloads(dlEl, buf); buf = null; }
      /* ★★ Session M — THE PRESENT SIGNAL (the #766 generalisation to the DATA pages).
         The settled list is on glass. Inside the settle rather than beside `root
         .replaceChildren(dlEl)` above, because that call mounts an EMPTY list: the rows
         arrive as a burst afterwards, and presenting on the mount would show the page
         empty and then fill it — the flat 120 ms hold exists precisely to prevent that.
         An account with NO downloads still reaches here (clearFiles alone opens the
         settle), and an account whose burst never arrives falls back to the same 120 ms
         it waits today. Latched. */
      bridge.painted();
      applyHighlight();   // ★ #1166 V-3 (#1154): the row C# named, on the settled list
    }, 80);
  }

  /* ★ S9 (#1173 (8), #1246 D = B) — the dialog presentation (🟡 NEW push `setPresentation(kind)`,
     kind ∈ 'dialog' | 'page'; anything else is ignored). C# (A3) pushes 'dialog' when it hosts this
     page in the desktop dialog; an older exe never pushes → the page stays a page. In dialog mode:
     · the topbar's ← is re-dressed as ✕ "Close" (SAME button, SAME verb ixian:back — C# closes the
       dialog on it; no new verb);
     · Esc sends ixian:back when NO confirm is open (a confirm takes Esc first — overlay.js closes it;
       this listener runs in the capture phase BEFORE overlay.js's and stands aside while one is up).
     Click-out (the scrim) is native. Esc in page mode is unchanged (nothing). */
  let presentation = 'page';
  let backGlyph = null;
  function dlBackButton() {
    const bar = dlEl.querySelector('.c-topbar');
    return bar ? bar.querySelector(':scope > button') : null;
  }
  function applyPresentation(kind) {
    const btn = dlBackButton();
    if (kind === 'dialog') {
      document.documentElement.dataset.presentation = 'dialog';
      if (btn && !btn.hasAttribute('data-dl-close')) {
        const old = btn.querySelector('svg');
        const x = (typeof icon === 'function') ? icon('x') : null;
        if (old && x) { backGlyph = old; old.replaceWith(x); }
        btn.dataset.dlBackLabel = btn.getAttribute('aria-label') || '';
        btn.setAttribute('aria-label', strings.close || 'Close');
        btn.setAttribute('data-dl-close', '');
      }
    } else {
      delete document.documentElement.dataset.presentation;
      if (btn && btn.hasAttribute('data-dl-close')) {
        const x = btn.querySelector('svg');
        if (x && backGlyph) x.replaceWith(backGlyph);
        backGlyph = null;
        btn.setAttribute('aria-label', btn.dataset.dlBackLabel || strings.back || 'Back');
        delete btn.dataset.dlBackLabel;
        btn.removeAttribute('data-dl-close');
      }
    }
    presentation = kind;
  }
  let escLatch = 0;
  window.addEventListener('keydown', (e) => {
    if (presentation !== 'dialog' || e.key !== 'Escape' || e.repeat || e.defaultPrevented) return;
    if (document.body.dataset.overlayOpen !== undefined) return;   // a confirm is up — overlay.js closes it
    if (Date.now() < escLatch) return;                              // one close per press burst
    escLatch = Date.now() + 600;
    e.preventDefault();
    bridge.send('ixian:back');
  }, true);

  const handlers = {
    setPresentation(kind) {
      const k = String(kind == null ? '' : kind);
      if (k === 'dialog' || k === 'page') applyPresentation(k);
    },
    /* ★ N71 (#421): the live re-theme push. C# used to RELOAD every page on an OS
     * theme flip, which threw the user back to Chats (N78) and discarded unsaved
     * input; it pushes now, so this shell must be able to receive one. Shared body
     * (theme-runtime.js) — never re-derive 'auto' from matchMedia here, the
     * WebView's prefers-color-scheme can disagree with the app theme. */
    setTheme(name) { applyPushedTheme(name); },
    // Q4-③ (#270): call-ui wiring GONE — calls present on the native CallPage.
    /* ★★ L3 (Session F) — THE BACK LEVEL THIS SHELL NEVER HAD.
       This shell emitted ixian:back but never told C# whether an overlay was up, so
       hardware back POPPED THE PAGE OUT FROM UNDER an open confirm. createSettingsDownloads
       opens three (settingsConfirm: delete one, delete all, and the destructive row), so
       this was reachable, not theoretical.
       Grammar copied verbatim from ContactDetails' cdBack (N50 #370) / home's homeBack
       (#336) — one implementation of "back closes the top thing", not a third dialect.
       ★ Self-heal: if nothing was actually open the mirror was stale, so re-sync and let
       the NEXT back pop the page. Back can never wedge. */
    downloadsBack() {
      if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
      syncDownloadsOverlay();
    },
    clearFiles() { buf = []; settle(); },
    highlightDownload(name) {   // ★ #1166 V-3 (#1154)
      const n = String(name == null ? '' : name);
      if (!n) return;
      hlName = n; hlUntil = Date.now() + HL_KEEP_MS; hlScrolled = false;
      settle();   // after the list it follows (the same settle the rows wait on)
    },
    addFile(name, ctime) {
      if (buf === null) buf = [];
      buf.push({ name: name || '', time: ctime || '' });   // ctime opaque — verbatim
      settle();
    },
  };
  /* ★ L3 (#706): the iOS back signal — a confirm on the stack closes first (the level
     Session F gave hardware back), then the verb the topbar arrow sends. */
  attachEdgeBack({ onBack: () => {
    if (typeof dismissTopOverlay === 'function' && dismissTopOverlay()) return;
    bridge.send('ixian:back');
  } });
  bridge.exposeAll(handlers);

  /* ★ L3 (Session F): mirror overlay.js's body[data-overlay-open] to C# so back can be
     routed INTO this shell while a confirm is up. DEFERRED + coalesced for the #337
     reason: bridge.send is a raw location.href assignment with no queue, so two
     navigations in one task coalesce last-wins and a state push must never share a slot
     with a verb. State is read at FIRE time, so the trailing push is always absolute. */
  let dlOverlaySyncT = 0;
  function syncDownloadsOverlay() {
    if (dlOverlaySyncT) return;
    dlOverlaySyncT = setTimeout(() => {
      dlOverlaySyncT = 0;
      try { bridge.send('ixian:downloadsoverlay:' + (document.body.dataset.overlayOpen !== undefined ? '1' : '0')); } catch (e) {}
    }, 0);
  }
  try {
    new MutationObserver(syncDownloadsOverlay).observe(document.body, { attributes: true, attributeFilter: ['data-overlay-open'] });
  } catch (e) {}

  /* —— page ready — fire ixian:onload on the window LOAD event (#177). ————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
