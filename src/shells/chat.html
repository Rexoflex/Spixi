    if (chatSelect && box.dataset.selecting === undefined) chatSelect = null;
    syncChatOverlay();   // N51: select mode is NOT on the shared stack — mirror it (Android back exits selection, not the chat)
    /* Land focus on the row the user long-pressed: it is now role=checkbox +
     * tabindex, so Space keeps toggling and Esc exits. The menu sheet has already
     * restored focus (synchronously, inside dismissOverlay) by the time we run,
     * so this is the last word — otherwise focus drops to the detached bubble. */
    if (chatSelect && row && typeof row.focus === 'function') row.focus({ preventScroll: true });
  }

  /* Row under a pointer/keyboard event, or null when it isn't a message. */
  function menuableRowOf(node) {
    const row = node && node.closest ? node.closest('.c-bubble-row') : null;
    if (!row || !box.contains(row)) return null;
    return isMenuableRec(model.get(row.dataset.msgid || '')) ? row : null;
  }

  /* DESKTOP/POINTER entry: ⌘/Ctrl-click enters selection with that row picked.
   * Capture phase so the bubble's own click (file open, payment card, link) never
   * runs underneath — the same swallow the selection component itself does once
   * the mode is on. Deliberately NOT Shift-click: shift extends a TEXT selection
   * in every browser and a chat is text people drag-select. On macOS Ctrl-click
   * is a right-click, which opens the anchored menu instead — the overlay guard
   * keeps that path from also arming a selection under the open sheet. */
  box.addEventListener('click', (e) => {
    if (chatSelect) return;                                   // the component owns clicks while selecting
    if (!(e.metaKey || e.ctrlKey)) return;
    if (document.body.dataset.overlayOpen !== undefined) return;   // a menu/sheet just took this gesture
    const row = menuableRowOf(e.target);
    if (!row) return;
    e.preventDefault();
    e.stopPropagation();
    startChatSelect(row);
  }, true);

  /* KEYBOARD entry: Shift+F10 / the Menu key = "context menu" everywhere, and the
   * message menu is where Select lives, so this is also the keyboard route INTO
   * selection (out = Esc, handled by the component). Bubbles aren't focusable
   * outside selection mode, so with nothing focused it targets the NEWEST
   * message — the one a keyboard user is looking at. */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ContextMenu' && !(e.shiftKey && e.key === 'F10')) return;
    if (chatSelect) return;                                   // already selecting: Space toggles, Esc exits
    if (document.body.dataset.overlayOpen !== undefined) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    let row = menuableRowOf(ae);
    if (!row) {
      const rows = [...box.querySelectorAll('.c-bubble-row')];
      for (let i = rows.length - 1; i >= 0 && !row; i--) row = menuableRowOf(rows[i]);
    }
    if (!row) return;
    const rec = model.get(row.dataset.msgid || '');
    e.preventDefault();
    openMessageMenu({ row, ...menuOptsFor(rec, row) });
  });

  /* Bulk delete confirm — the house alertdialog (createModal role=alertdialog,
   * destructive confirm, Cancel autofocused). Damir's ask: name the COUNT. */
  function confirmBulkDelete(items) {
    const s = window.SL || {};
    const n = items.length;
    const title = n === 1
      ? (s.deleteSelectedOne || 'Delete this message?')
      /* PLURALS: this dictionary is one flat key → one string (verify-locales
       * enforces key parity + placeholder parity), so there is no per-locale
       * plural-category machinery. The house convention is a ONE/MANY key pair
       * where the MANY form is written count-agnostic in the languages whose
       * plural rules split above 1 (ru/sl/sr use the "… ({n})?" construction);
       * en/de/es/fr/pt take the natural plural, which is always correct here
       * because this branch only ever runs for n ≥ 2. */
      : (s.deleteSelectedMany || 'Delete {n} messages?').split('{n}').join(String(n));
    openModal(createModal({
      title,
      body: s.cannotUndo || 'This action cannot be undone.',
      role: 'alertdialog',
      host: overlayHost,
      strings: s,
      actions: [
        { label: s.cancel || 'Cancel', type: 'text', autofocus: true },
        {
          label: s.delete || 'Delete', type: 'fill', intent: 'destructive',
          onClick: () => {
            // Snapshot the ids FIRST: exiting selection re-paints rows, and each
            // verb echoes a deleteMessage push that re-renders the log under us.
            const ids = items.map((it) => it.id).filter(Boolean);
            exitChatSelect();
            for (const id of ids) sendDeleteMessage(id);
          },
        },
      ],
    }));
  }

  function onMenuAction(action, rec, row) {
    const id = rec.id;
    // ⑪ Q1 re-review: the menu is the last non-composer outbound surface — react/tip
    // both emit to a peer that hasn't accepted us. Copy/delete are local-only, but the
    // whole menu is gated for one grammar: nothing leaves this chat while pending.
    if (composerLock) return;
    if (action === 'react') { reactToMessage(id); return; }
    if (action === 'copy') {
      if (navigator.clipboard && rec.text) navigator.clipboard.writeText(rec.text).catch(() => {});
      return;
    }
    if (action === 'select') { if (row) startChatSelect(row); return; }
    if (action === 'delete') {
      // Q12 (A-1): the local-delete latch lives in sendDeleteMessage — only a LOCAL
      // delete may write an exdel hint, and the latch self-expires so an id C# never
      // echoes can't be consumed later by a REMOTE delete of the same id.
      sendDeleteMessage(id);
      return;
    }
    if (action === 'report') { bridge.send('ixian:contextAction:report:' + id); return; }
    if (action === 'tip') { openTipForMessage(rec); return; }
    // M1 reply-to (#441). The menu item only renders behind bridge.cap('reply'),
    // and this arm re-checks it: an action can only arrive from a menu built with
    // the capability on, but the guard makes the gate one thing, not two.
    if (action === 'reply') {
      if (!bridge.cap('reply') || !composerEl) return;
      const q = replySourceFor(rec);
      if (!q) return;
      setComposerContext(composerEl, {
        kind: 'reply',
        title: ((window.SL && window.SL.replyingTo) || 'Reply to') + (q.sender ? ' ' + q.sender : ''),
        text: q.text,
        replyId: String(rec.id),
        strings: window.SL || {},
      });
      // In a group, replying also addresses the person — the @-mention half of M1
      // is pure FE and rides along. Only for a NAMED sender, never an address, and
      // never when the mention is already there.
      if (mode.isMulti && !mode.blind && senderHasNick(rec) && rec.direction !== 'sent') {
        const input = composerEl.querySelector('.c-composer__input');
        const tag = '@' + rec.senderNick + ' ';
        if (input && !input.value.includes('@' + rec.senderNick)) {
          input.value = tag + input.value;
          input.dispatchEvent(new Event('input'));
        }
      }
      const inp = composerEl.querySelector('.c-composer__input');
      if (inp) inp.focus();
      return;
    }
    // edit is still capability-gated off → never reached in v1
    dbg('menu action (gated/unhandled)', action);
  }

  /* member identity sheet (#99) — sender tap in a non-blind group OR a bot chat
   * (Damir F5 2026-07-08: a NAMED bot/group sender had no way to reveal its
   * address). Shows the FULL address (nick is spoofable), a contact-request
   * path, and admin kick/ban when I'm the group admin (bots have no admin →
   * just identity + copy + request). C# runs its own confirm for kick/ban
   * (displaySpixiAlert).
   * D-5/N26 (#366): relation now RIDES THE PUSH (addThem trailing arg — C#
   * answers from FriendList where it builds the push). A member already in
   * contacts gets the "In your contacts" badge + no request button; an
   * in-flight request shows "Request sent"; only true strangers get the
   * button. `requestedMembers` bridges the gap until C#'s next push. 'self'
   * and unknown ('') get NO request button (the C# self-guard alert would be
   * the only outcome). Money actions (Pay/Request) stay UNWIRED here — no
   * address-bearing money verb exists on SingleChatPage (logged, #366). */
  function openMember(rec) {
    if (!rec.senderAddress && !rec.senderNick) return;
    const s = window.SL || {};
    const actions = [];
    /* ★★ KICK AND BAN ARE BOT-ROOM ONLY (Damir, 2026-08-29, option A) — AND THIS IS
     * THE SURFACE HE ACTUALLY USES. The first cut of that change gated the CHAT-INFO
     * member sheet (chat-info.js) and left THIS one, the in-chat sender tap, wide open:
     * a private group still offered "Remove from group" and "Ban from group", which is
     * what his device walk found at §6.2.
     * ⚠ That is V-8's pattern exactly — "#616 fixed the twin surface, which #249 records
     * as unreachable, and left the live one" — repeated by me on the same day I pinned
     * the lesson. TWO surfaces offer these actions; a gate on one is not the rule.
     * Why the actions go: Ixian-Core's `kickUser` and `banUser` handlers are EMPTY cases,
     * so a private group's kick is delivered and honoured by nobody. A bot room works
     * because its action is addressed to the bot SERVER. `mode.isBot` is `type === 3`,
     * the same discriminator chat-info's `kind === 'bot'` resolves to. */
    if (mode.admin && mode.isBot && rec.senderAddress) {
      actions.push({ label: s.removeFromGroup || 'Remove from group', destructive: true,
        onClick: () => bridge.send('ixian:kick:' + rec.senderAddress) });
      actions.push({ label: s.banFromGroup || 'Ban from group', destructive: true,
        onClick: () => bridge.send('ixian:ban:' + rec.senderAddress) });
    }
    const pushed = RELATIONS.has(rec.relation) ? rec.relation : 'none';
    const relation = (pushed === 'none' && rec.senderAddress && requestedMembers.has(rec.senderAddress))
      ? 'pending' : pushed;
    openMemberSheet({
      host: overlayHost,
      member: {
        name: rec.senderNick || '', address: rec.senderAddress || '', avatar: rec.avatar || null,
        // N34 (#365): Owner badge in the sheet's name row (matches the bubble chip)
        owner: isOwnerAddr(rec.senderAddress),
      },
      // ★ review MAJOR-5: belt for the gate above — if any future caller reaches here in
      // a blind chat, the sheet renders its hidden-identity state instead of an address.
      blind: mode.blind,
      relation,
      // 'self' must never grow a request button (member-sheet only draws it when
      // relation is neither contact nor pending — so gate self/latched here).
      /* ★★ #623 (Damir, device 2026-08-28) — #613 ROUND 2 GOT THIS WRONG AND I BROKE A
         WORKING FEATURE. There are TWO sendContactRequest routes and I gated on the
         guard belonging to the other one.
           · `onContextAction("sendContactRequest", msgId)` — the MESSAGE-menu route.
             It refuses for `friend.bot` outright (SingleChatPage), and legacy refuses it
             identically, so the message menu has never offered it in a bot room.
           · `ixian:sendContactRequest:<address>` — the DIRECT, address-keyed verb, which
             is what THIS sheet sends. It runs `sendContactRequestGuarded`, whose guards
             are: a bad address, your own address, a pending deletion, an existing
             contact. ★ There is no bot guard, and legacy's is unguarded too
             (0e85a4b8 onNavigating:260) — which is exactly why tapping a member in the
             Spixi bot group works in legacy today.
         So the toast was NOT lying: the request genuinely sent. Gating it removed a
         feature that had been working, on the surface a public channel exists for.
         ⚠ The blind guard STAYS. A blind room hands the sheet `[Unknown]`, so there is
         no address to request against — that half of #613 r2 was right. */
      onRequest: (rec.senderAddress && relation === 'none' && !mode.blind)
        ? () => {
            requestedMembers.add(rec.senderAddress);
            bridge.send('ixian:sendContactRequest:' + rec.senderAddress);
            // N55: the verb is fire-and-forget (no ack push) → optimistic toast,
            // the house pattern (settings-delete class). The sheet's own
            // 'pending' latch already tells the durable story.
            showToast({ text: s.contactRequestSent || 'Contact request sent', tone: 'success', host: overlayHost, strings: s });
          }
        : null,
      actions,
      strings: s,
    });
  }

  /* —— group / bot chat-info takeover (#189-follow: header tap on a multi chat) ——
   * Mounts a full-viewport c-chat-info panel OVER the conversation (not a page
   * nav — SingleChatPage owns the group verbs). onBack closes it back to the
   * chat; it never emits ixian:back (that would pop the whole SingleChatPage).
   *
   * Members are BEST-EFFORT: there is no full-roster push from SingleChatPage, so
   * the list is built from senders we've SEEN (received rows) + resolved group
   * nicks (updateGroupChatNicks). A true roster + member count is a BE ask.
   * Blind groups (type 2) hide addresses. Admin (mode.admin) injects Kick/Ban via
   * the component's built-in member sheet; contact-request + kick/ban reuse the
   * existing verbs. */
  /* ⚠ #249 loop C-3: this whole in-chat takeover block (openChatInfo/buildChatInfo/
   * refreshChatInfo/collectGroupMembers + the groupRoster/groupOwner feeds) is
   * RETAINED BUT CURRENTLY UNREACHABLE — every topbar info route now emits
   * ixian:details (the shell-side ContactDetails surface owns group/bot info).
   * Kept for a possible future CHANNEL-scoped info surface; C#'s addContact/
   * setGroupOwner pushes still land here harmlessly. Prune when that's decided. */
  let chatInfoTakeover = null;
  let chatInfoOpen = false;

  // Members: authoritative full roster (ixian:loadContacts) enriched with senders
  // SEEN in loaded history (fresher nick/photo, and covers not-yet-synced members).
  function collectGroupMembers() {
    const byKey = new Map();     // unique key → { name, address, avatar, relation }
    // 1) full participant roster (blind entries keyed by nick, real ones by address)
    for (const [key, m] of groupRoster) {
      // #366 loop m2: carry the roster relation — a revived takeover must not
      // regress D-5 (every member reading 'none' = live request buttons again)
      byKey.set(key, { name: m.name || '', address: m.address || '', avatar: m.avatar || null, relation: m.relation || '' });
    }
    // 2) enrich from received-message senders (skip blind-masked addresses)
    // #366 loop r2 MAJOR-1(a): steps 2+3 rebuilt entries WITHOUT relation, so an
    // ACTIVE contact (one who has posted) fell back to 'none' and got the request
    // button while quiet members read correctly — the exact inversion D-5 kills.
    // Step 2 also ENRICHES from the per-message relation (rec.relation is the
    // live truth the roster push may lack), latch-aware like openMember.
    for (const rec of model.values()) {
      if (rec.direction === 'received' && rec.senderAddress && rec.senderAddress !== '[Unknown]') {
        const prev = byKey.get(rec.senderAddress) || { name: '', address: rec.senderAddress, avatar: null, relation: '' };
        byKey.set(rec.senderAddress, {
          name: prev.name || (senderHasNick(rec) ? rec.senderNick : ''),
          address: rec.senderAddress,
          avatar: prev.avatar || rec.avatar || null,   // real per-sender photo (C# addThem avatar)
          relation: prev.relation || rec.relation || '',
        });
      }
    }
    // 3) resolved nicks
    for (const [addr, nick] of groupNicks) {
      if (!addr || addr === '[Unknown]') continue;
      const prev = byKey.get(addr) || { name: '', address: addr, avatar: null, relation: '' };
      byKey.set(addr, { name: prev.name || (nick || ''), address: addr, avatar: prev.avatar, relation: prev.relation || '' });
    }
    // #248: mark the owner (blind groups never get an owner push).
    // #365 loop NIT-3: the ONE isOwnerAddr predicate — no inline drift copy.
    // #366 loop r2 MAJOR-1(b): apply the requestedMembers latch here too — the
    // list is rebuilt from scratch on every refreshChatInfo, so an in-flight
    // request must resurface as 'pending', never as a fresh button.
    const list = [...byKey.values()];
    for (const m of list) {
      if (isOwnerAddr(m.address)) m.owner = true;
      if (m.address && requestedMembers.has(m.address) && (m.relation || 'none') === 'none') m.relation = 'pending';
    }
    return list;
  }

  function buildChatInfo() {
    const s = window.SL || {};
    const infoKind = mode.type === 3 ? 'bot' : 'group';   // bot channels reuse the members/notifications surface
    return createChatInfo({
      kind: infoKind,
      context: 'chat',
      name: identity.name || identity.address || '',
      avatar: identity.avatar || null,       // real 1:1/bot/group photo (C# addThem/setAvatar); gradient fallback
      avatarSeed: identity.address || identity.name || '',
      members: collectGroupMembers(),        // best-effort; memberCount falls back to members.length
      blind: mode.blind,                     // blind group OR blind bot: identities hidden (#348)
      notifications: mode.notifications,
      // groups/bots have en/disableNotifications; admin gates kick/ban. media +
      // selfDestruct stay OFF (no bridge verb, §9).
      capabilities: { notifications: true, admin: mode.admin },
      host: overlayHost,                     // member sheet + kick/ban/leave confirms attach to body (above the takeover)
      strings: s,
      onBack: closeChatInfo,                 // close the takeover — NOT ixian:back

      // notifications toggle → the group/bot mute verbs. Fire-and-forget: the
      // bridge gives no ack, so resolve optimistically (component keeps the state).
      onNotifications: (next, ctrl) => {
        mode.notifications = next;
        bridge.send(next ? 'ixian:enableNotifications' : 'ixian:disableNotifications');
        ctrl.done();
      },

      // member sheet (component-owned): contact request + admin kick/ban. Reuses
      // the existing verbs; C# runs its own confirm for kick/ban on receipt.
      // #366 loop r2 MAJOR-1(b): feed the latch like the other two call sites —
      // chat-info's optimistic 'pending' lives on a mapped copy and dies on the
      // next refreshChatInfo rebuild without it.
      onContactRequest: (m) => {
        /* ★★ #623: the bot gate is REMOVED here too — this sends the same direct,
           address-keyed verb, which has never been bot-guarded in either tree. The
           `[Unknown]` test below is the blind-room guard and is the part that matters. */
        if (mode.blind) return;
        if (m && m.address && m.address !== '[Unknown]') {
          requestedMembers.add(m.address);
          bridge.send('ixian:sendContactRequest:' + m.address);
          // N55: optimistic toast at the emit site (fire-and-forget verb, no ack)
          showToast({ text: s.contactRequestSent || 'Contact request sent', tone: 'success', host: overlayHost, strings: s });
        }
      },
      onMemberAction: (action, m, ctrl) => {
        if (m && m.address && (action === 'kick' || action === 'ban')) bridge.send('ixian:' + action + ':' + m.address);
        ctrl.done();
      },

      // destructive — leave group (component renders this for kind 'group' only;
      // bots have no in-chat leave verb → no destructive row for a bot, flagged).
      onLeave: (ctrl) => { bridge.send('ixian:leave'); ctrl.done(); },
    });
  }

  let chatInfoRefreshQueued = false;
  function scheduleChatInfoRefresh() {   // coalesce the loadContacts roster burst → one rebuild
    if (chatInfoRefreshQueued) return;
    chatInfoRefreshQueued = true;
    requestAnimationFrame(() => { chatInfoRefreshQueued = false; refreshChatInfo(); });
  }

  function openChatInfo() {
    if (chatInfoOpen) return;
    chatInfoOpen = true;
    groupRoster.clear();                 // fresh roster per open (avoids stale/removed members accumulating)
    bridge.send('ixian:loadContacts');   // pull the full participant roster → addContact per member
    chatInfoTakeover = document.createElement('div');
    chatInfoTakeover.className = 'chat-info-takeover';
    chatInfoTakeover.append(buildChatInfo());
    document.body.append(chatInfoTakeover);
  }
  function closeChatInfo() {
    chatInfoOpen = false;
    if (chatInfoTakeover) { chatInfoTakeover.remove(); chatInfoTakeover = null; }
  }
  // Rebuild an OPEN takeover in place (e.g. setChatMode arrived after opening, or
  // new senders were seen). Cheap; the takeover is a shallow snapshot.
  function refreshChatInfo() {
    if (!chatInfoOpen || !chatInfoTakeover) return;
    chatInfoTakeover.replaceChildren(buildChatInfo());
  }

  /* tip: open the amount sheet (no balance — C# runs the real balance check +
   * native confirm), then emit ixian:contextAction:tip:<id>:<amount>. Recipient
   * is DISPLAY-only (C# resolves the real payee from the msg id). */
  function openTipForMessage(rec) {
    openTipSheet({
      message: { id: rec.id, excerpt: rec.text || undefined },
      recipient: {
        // ★ #346 (review of #342): this ladder must match the avatar ladder below,
        // and it did not. `identity.name` is the GROUP's name in a group chat (C#
        // pushes setNickname for the group), so a member who has not set a nickname
        // — the exact case senderHasNick exists for — produced "Tip <group name>"
        // beside that member's real photo, on the surface where the user checks who
        // is about to be paid. Same reasoning, same fix: the group roster first, then
        // the truncated address (#211 canon), and identity.name ONLY in a 1:1 chat.
        // Loop B-6 (#370) + r2 F-3 (#373): senderHasNick on rung 1 AND the shape
        // guard on the ROSTER rung — C#'s resolveNick echoes the address into the
        // roster nick for a nameless non-blind member, so rung 2 re-introduced
        // the full-base58 payee name B-6 had just removed. Either echo now falls
        // through to the truncated-address rung (#211 canon).
        name: (senderHasNick(rec) ? rec.senderNick : '')
          || (mode.isMulti
                ? ((n) => (n && !isPseudoAddressNick(n)) ? n : '')(((groupRoster.get(rec.senderAddress) || {}).name || ''))
                : identity.name)
          // ★★ #603 (row A4.2, Damir 2026-08-27): THE TWO TRUNCATING RUNGS ARE GONE.
          // They handed the sheet an ALREADY middle-elided address as a `name`, and a
          // 13-character string with an ellipsis in it looks exactly like a nickname:
          // it survives `payeeDisplayName`'s `n !== a` and `isPseudoAddressNick` tests
          // and is printed verbatim. That is the "the tip sheet truncates a nickname
          // like an address" report — the sheet never truncated anything, the caller
          // did, before the sheet could apply its own canon.
          // The sheet already receives `address` on the line below and falls back to
          // `truncateAddressMiddle(address)` itself, AFTER exhausting the nick tests —
          // which is exactly what the Request sheet relies on, and why that one is
          // correct. Ending the ladder at '' makes the two identical by construction.
          // Rung added: `groupNicks`, the live nick map `updateGroupChatNicks` feeds.
          // A member whose nickname arrived that way rather than through
          // ixian:loadContacts was falling past the roster rung to a bare address.
          // ⚠ the SAME shape guard the roster rung carries (#370 B-6 / #373 F-3):
          // C#'s resolveNick echoes the address into the nick for a nameless member,
          // so an unguarded rung would put the full base58 back on the payee line.
          || ((n) => (n && !isPseudoAddressNick(n)) ? n : '')(
               (rec.senderAddress && groupNicks.get(String(rec.senderAddress))) || '')
          || '',
        address: rec.senderAddress || identity.address || '',
        // #342 (Damir F5 item (d)): the photo was in scope here all along and was
        // never passed. Order matters, and #342 review MAJOR-1 explains why:
        //  1. rec.avatar — the per-sender photo on a TEXT row (C# addThem).
        //  2. in a GROUP, the roster photo for that sender (ixian:loadContacts).
        //     File, app and payment rows carry no avatar at all, so without this
        //     every tip on a card fell through to step 3.
        //  3. identity.avatar — ONLY in a 1:1 chat, where identity IS the peer.
        //     In a group, identity.avatar is the GROUP's photo (SingleChatPage
        //     pushes getAvatarPath(friend) for the group), so using it here put
        //     the group's face beside an individual member's name — on the one
        //     surface where the user checks WHO is about to be paid. A gradient
        //     is neutral; the wrong face is not. Never widen step 3 to groups.
        avatar: rec.avatar
          || (mode.isMulti ? (groupRoster.get(rec.senderAddress) || {}).avatar : identity.avatar)
          || null,
      },
      balance: null,
      host: overlayHost,
      /* ★ D-10 / I-7 (Damir F5 2026-08-15): WAIT FOR THE ANSWER.
         `ctrl.done()` used to fire the instant the verb was emitted, so the button
         morphed to a green "Tipped" even when the tip failed — Damir screenshotted a
         success morph under an "Insufficient Balance" dialog. On a money surface the UI
         must never claim a payment happened.
         C# now answers with setTipResult (SingleChatPage.sendTipResult); EVERY exit from
         its tip case reports exactly once. The sheet's own fail(msg) path — inline error,
         retry kept, overlay unfrozen — has existed since #74 and was simply never called.
         ★ The 12 s backstop is not decoration. While a tip is in flight the sheet
         disables light-dismiss and Esc (money-in-flight, C1), so an answer that never
         arrives — an old exe with no setTipResult, a dropped push — would strand the user
         in a frozen sheet. That is worse than the bug being fixed. */
      onTip: (payload, ctrl) => {
        const sl = window.SL || {};
        /* ★ audit: an exe that predates setTipResult never answers, and waiting for an
           answer that cannot come would freeze the sheet for 12 s after a SUCCESSFUL tip
           and then tell the user it may have failed. Gate on the capability, exactly as
           blindKnown does for setChatMode. Without the cap we keep the old behaviour. */
        if (!bridge.cap('tipResult')) {
          bridge.send('ixian:contextAction:tip:' + rec.id + ':' + payload.amount);
          ctrl.done();
          return;
        }
        clearTimeout(tipWait);
        tipCtrl = ctrl;
        tipFor = rec.id;                 // ★ audit: correlate — see setTipResult
        tipAmt = payload.amount;
        bridge.send('ixian:contextAction:tip:' + rec.id + ':' + payload.amount);
        tipWait = setTimeout(() => {
          if (!tipCtrl) return;
          const c = tipCtrl; tipCtrl = null; tipFor = ''; tipAmt = '';
          c.fail(sl.tipNoAnswer || 'No answer from the app. The tip may not have been sent.');
        }, 12000);
      },
    });
  }

  /* ★ D-10: the pending tip sheet's controller, and its backstop timer. One tip is in
     flight at a time — the sheet latches its own confirm button (#72④) — so a single
     slot is correct. */
  let tipCtrl = null;
  let tipWait = 0;
  let tipFor = '';      // ★ audit: the message id this pending tip belongs to
  let tipAmt = '';      // ★ audit: the amount, so success can restate it

  /* composer ⊕ → attach sheet (tile grid) replacing the legacy native attach bar.
   *   file    → ixian:sendfile            (native picker)
   *   photo/gif → ixian:sendmedia         (gated on the media capability, #81)
   *   pay     → composeSend cap: the #139 lockedRecipient compose takeover
   *             (W5 — C# signs after the NATIVE confirm). ★★ L1 (#640): no fallback
   *   request → composeRequest cap: the #139 amount sheet → ixian:sendrequest
   *             (a request is a chat message). ★★ L1 (#640): no fallback
   * App-invite tile is hidden (no SingleChatPage invite verb); Pay/Request are
   * hidden in groups/bots (C# rejects them there). */
  /* ★★ ONE GATE, TWO SURFACES (#46 loop, MAJOR-2). These flags decide which tiles the
     sheet shows. The composer ⊕ is shown or hidden from the SAME flags, through
     `hasAttachTiles`. Write the rule here only. A second copy can drift, and a drift
     puts a ⊕ on a room where every tile is refused — the ⑪ delivery lie again. */
  /* ★★ AND AN UNKNOWN ROOM ANSWERS FALSE TO ALL FOUR — see THE ROOM-ANSWER LATCH.
     Every gate below needs a room type. No tile survives every room type. So a room
     whose type has not arrived offers nothing, and `modeKnown()` is written into all
     four flags rather than beside them. Every reader of this object then inherits the
     rule: the ⊕, the sheet, the money composes and the app picker. */
  function attachFlags() {
    const known = modeKnown();
    /* ★★ Damir on device: *"on legacy the blind group had no Send file capability, and on
       redesign the sheet shows send file, but doesn't work."* C# has always refused it —
       `onSendFile` returns on `friend.bot || (type == Group && hideParticipantAddresses)` —
       so the tile was a dead control, the ⑪ delivery lie. This is that predicate,
       mirrored: `hidesAddresses` is the RAW flag (#613), type 1|2 are the group kinds, and
       a NORMAL private group keeps its files exactly as legacy did.
       ★★ ROUND 2: the SAME gate answers for Photo and GIF. C# routes `ixian:sendmedia` to
       `onSendFile(true)` and `ixian:sendfile` to `onSendFile(false)`
       (SingleChatPage.xaml.cs:200 and :206). One method, one refusal. Before this line
       `media` read the #81 capability alone, so the day that capability lands a bot room
       and a blind group would have shown two more tiles that C# refuses — the same ⑪ lie,
       pre-built on the next feature. */
    const canSendFile = known && !mode.isBot && !((mode.type === 1 || mode.type === 2) && mode.hidesAddresses);
    return {
      media: canSendFile && bridge.cap('media'),   // Photo/GIF also need the BE image standard (#81)
      apps: known && !mode.isBot,            // App invite: onApp is blocked in bots (xaml:834); 1:1 + groups OK
      payments: known && mode.type === 0,    // 1:1 only
      files: canSendFile,
    };
  }

  /* ★★ THE ⊕ IS HIDDEN WHEN NO TILE SURVIVES.
     In a bot room every flag above is false. All six tiles are filtered out. Before this
     fix the ⊕ opened a sheet with no tiles, no title and no text. The Spixi community bot
     is the first chat of many users, because N76 made it a chat-list empty-state CTA.
     An unknown room also answers false to every flag — see THE ROOM-ANSWER LATCH. A button
     that opens nothing is a control that reports an outcome it did not cause. */
  function attachAvailable() { return hasAttachTiles(attachFlags()); }

  /* ★★ THE WAIT STATE IS DERIVED WHERE IT IS USED (round 3).
     `attachWaiting()` is true only while the room type has NOT arrived and this
     document is still inside its wait window. It can never make a tile legal: it is
     tested only against `attachAvailable()`, never instead of it. */
  function attachWaiting() { return !modeKnown() && modeWaitOpen(); }

  /* ★★★ THE ⊕ IS A PURE FUNCTION OF STATE, READ AT THE MOMENT IT IS PAINTED
     (round 3; surviving mutations Y4, Y5, Y9, Y10).
     Round 2 computed a phase STRING, remembered it in `attachPhaseApplied`, and then
     wrote THREE independent DOM properties from it. That is four pieces of state for
     one answer, and the review broke the control by corrupting any one of them:
     force the phase to 'ready' and a bot room got a live ⊕ that opened nothing; pin
     `visibility` to 'hidden' and the ⊕ vanished from every room; pin `disabled` to
     false and the third leg stopped agreeing with the other two.
     There is no phase string and no memo now. Both writes below call the SAME
     predicate the sheet, the money composes and the app picker call, at the moment
     the answer is needed. A corrupted `attachAvailable()` therefore corrupts the ⊕
     and the sheet TOGETHER — the control cannot claim what the sheet refuses — and
     that function is one pinned line in both homes.
     ★ Two legs, not three. `visibility: hidden` already takes the button out of hit
     testing, out of the tab order and out of the accessibility tree, so `disabled`
     and `aria-hidden` added nothing but two more writers to corrupt. A control the
     user can reach is refused again inside `openAttach`.
     ★ COST, stated truthfully (round 3 MINOR-3 — the round-2 comment here said "three
     boolean reads" and the code did far more). This runs on every C# push and costs:
     one `querySelector`, two `attachFlags()` objects, two filtered arrays over six
     entries, and two property writes. While the room does not change, both writes write
     the value that is already there. Nothing is read back from the DOM, so no push
     forces a synchronous layout. Round 2 memoised a phase string to skip this work; the
     memo was a fourth piece of state for one answer, and the review broke the control by
     corrupting the state, never the arithmetic. Measure before adding a memo back — the
     [CDPERF] probe is the instrument. */
  function syncAttachAffordance() {
    const btn = composerEl && composerEl.querySelector('.c-composer__attach');
    if (!btn) return;
    /* `hidden` removes the control from the row: base.css:54 is
       `[hidden] { display: none !important; }`. `visibility` keeps its 40 px box, so
       the text field does not grow and then shrink when the room answers late. */
    const gone = !attachAvailable() && !attachWaiting();
    btn.hidden = gone;
    btn.style.visibility = attachAvailable() ? '' : 'hidden';
    /* ★ A2 (Damir F5, 2026-08-28), RE-HOMED BY #705: the ⊕ is a 44 disc OUTSIDE the
       pill now, so `hidden` changes the BAR's leading edge, not the field's. The bar
       carries 8px beside the disc and 16px without it (composer.css). The attribute is
       written from `gone`, the SAME expression that hides the button, so the padding
       can never disagree with the disc.
       ⚠ Not from `attachAvailable()` alone: during the wait the disc keeps its box
       (`visibility`), so the bar must keep the 8px too. */
    composerEl.toggleAttribute('data-no-attach', gone);
    /* ★ #705: a tray that is open when the ⊕ goes away would offer tiles the room has
       just refused. Same rule as the sheet's action-time re-check, applied at the
       moment the answer changes. */
    if (gone) closeAttachTrayIfOpen();
  }

  /* ★ #705: the tray is closed by every back path (chatBack, the edge swipe, Escape) —
     it is NOT on the overlay stack (attach-sheet.js explains why), so each site asks
     this instead of dismissTopOverlay. Returns true when it closed one. */
  function closeAttachTrayIfOpen() {
    if (!composerEl || !isAttachTrayOpen(composerEl)) return false;
    closeAttachTray(composerEl.nextElementSibling);
    syncChatOverlay();
    return true;
  }
  /* ★★ R3-5 (#46 loop ROUND 3): THE TWO HAND-OFFS ARE MUTUALLY EXCLUSIVE, AND NOTHING USED TO
     SAY SO. handKeyboardToTray (keyboard → tray) and handTrayToKeyboard (tray → keyboard) both
     arm a 450 ms listener on 'resize', and `isAttachTrayOpen` is true for a HELD tray — so a
     re-focus inside the reveal's window armed `drop` while `reveal` was still armed, and both
     stood on the same event.
     Before R2-8 that was covered by accident: one grow satisfied BOTH, reveal was registered
     first, and drop's synchronous `closeAttachTray(tray, { instant: true })` removed the node
     in the same dispatch, so nothing painted. R2-8 gave drop a SHRINK test, which un-cancelled
     the pair: the grow now satisfies only reveal, the tray paints at its full slot, and drop
     removes it on the keyboard's return shrink 100–300 ms later — ⊕ with the keyboard up, then
     a tap in the composer inside 450 ms, and the tray flashes in and out. That is the
     two-heights flash both hand-offs exist to prevent, assembled out of the two of them.
     So arming one DISARMS the other, explicitly. Listener registration order is not a
     mechanism: it is what silently covered this for one round, and it stopped covering it the
     moment the two tests stopped agreeing on which resize they wanted.
     `disarm` only unbinds — it never runs the action — and it is idempotent through `done`,
     which every path already checks first.
     REVERSAL: drop cancelKbHandoff() from the two arm sites and the pair can be armed together
     again; with R2-8's direction guards in place that is a visible flash, not a silent no-op. */
  let kbHandoffCancel = null;
  function cancelKbHandoff() { const c = kbHandoffCancel; kbHandoffCancel = null; if (c) c(); }
  /* ★ #721 (Damir): the field was tapped while the tray is up — the keyboard is coming.
     Hold the tray in place until the viewport shrinks (the keyboard has the slot), then
     remove it in one frame; a 450 ms backstop covers an engine that never resizes (a
     hardware keyboard, desktop). The bar never dips and rises between the two.
     ★★ R2-8 (#46 loop ROUND 2): DROP ON A VIEWPORT SHRINK, NOT ON ANY RESIZE — the exact
     mirror of the test B3 put on handKeyboardToTray's reveal, and it was missing here. B3's
     own docblock calls this function "the mirror" while leaving in it the defect B3 had just
     removed: any resize inside the 450 ms dropped the tray, so a chrome-bar jitter or a
     rotation removed it BEFORE the keyboard arrived and the composer dipped to the bottom and
     rose again — the two-heights flash, in the other direction. The keyboard arriving is a
     SHRINK of kbViewportH() (reveal wants a GROW of the same number, through the same reader).
     The 450 ms backstop below stays UNCONDITIONAL — it calls drop with NO event, so `if (e &&
     …)` cannot gate it and a tray can never be stuck up on an engine that never resizes (a
     hardware keyboard, desktop). Making the backstop conditional swaps a flash for a hang.
     ★★ R3-5: and arming this one DISARMS handKeyboardToTray's reveal — see cancelKbHandoff
     above. `isAttachTrayOpen` is true for a HELD tray, so this function is reachable while
     that reveal is still armed, and the two want opposite resizes.
     REVERSAL: drop the direction test and any jitter inside the window drops the tray again. */
  function handTrayToKeyboard() {
    if (!composerEl || !isAttachTrayOpen(composerEl)) return false;
    cancelKbHandoff();                                   // ★★ R3-5: one hand-off at a time
    const tray = composerEl.nextElementSibling;
    let done = false;
    try { console.warn('[KBTRAY] hold ih=' + window.innerHeight + ' tray=' + tray.offsetHeight + ' t=' + Math.round(performance.now())); } catch (_) {}   // ★ Session J stamp (temporary)
    const baseH = kbViewportH();
    let backstop = 0;
    const disarm = () => {                              // ★★ R3-5: unbind only — never the action
      done = true;
      clearTimeout(backstop);
      window.removeEventListener('resize', drop);
      if (window.visualViewport) window.visualViewport.removeEventListener('resize', drop);
      if (kbHandoffCancel === disarm) kbHandoffCancel = null;
    };
    const drop = (e) => {
      if (done) return;
      if (e && !(kbViewportH() < baseH - 60)) return;   // a resize, but not the keyboard arriving — keep holding
      disarm();
      try { console.warn('[KBTRAY] drop by=' + (e && e.type ? e.type : 'backstop') + ' ih=' + window.innerHeight + ' t=' + Math.round(performance.now())); } catch (_) {}   // ★ Session J stamp (temporary)
      closeAttachTray(tray, { instant: true });
      syncChatOverlay();
    };
    window.addEventListener('resize', drop);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', drop);
    backstop = setTimeout(drop, 450);
    kbHandoffCancel = disarm;
    return true;
  }

  /* ★ Session K (K1): the keyboard is up and the ⊕ was tapped — mount the tray closed, blur
     the field (the ⊕ button usually took focus already, #756), and open the tray in the
     frame the viewport grows back. Returns the tray, or null when no tile survives. */
  function handKeyboardToTray(trayArgs, input) {
    cancelKbHandoff();                                   // ★★ R3-5: one hand-off at a time
    const tray = openAttachTray({ ...trayArgs, hold: true });
    if (!tray) return null;
    syncChatOverlay();                                   // back must close the tray before it closes the chat
    try { if (input && document.activeElement === input) input.blur(); } catch (_) {}
    let done = false;
    /* ★★ B3 (#46 loop): REVEAL ON A VIEWPORT GROW, NOT ON ANY RESIZE. The whole point of the
       hold is to open the tray in the frame the KEYBOARD HAS LEFT, and the keyboard leaving is
       a GROW — the mirror test at the Android resize handler below already requires
       `ih > lastIH + 60` before it clears kbUp, and this one had no direction and no magnitude
       test at all. So any resize inside the window revealed the tray: a chrome-bar jitter, a
       further SHRINK (a keyboard swapping to a taller IME / an emoji panel), a rotation — i.e.
       exactly the frames where the keyboard is still on screen, which is the two-heights flash
       K1 was built to remove. Measured through kbViewportH() — visualViewport where there is
       one, because that is the surface that moves on iOS (innerHeight is constant under its
       keyboard, #303) while on Android adjustResize vv.height tracks innerHeight 1:1 (AND-16):
       one test, both engines, and ONE reader, shared with handTrayToKeyboard's mirrored SHRINK
       test (R2-8) so the two hand-offs cannot come to measure different surfaces.
       The 450 ms backstop below stays UNCONDITIONAL (it calls reveal with no event), so a tray
       can never be stuck unrevealed on an engine that never resizes; this only decides which
       resizes are allowed to beat it.
       ★★ R3-5: "mirror" does NOT mean "cannot both be armed" — they can, and were. Arming this
       one disarms handTrayToKeyboard's drop, and vice versa; see cancelKbHandoff above.
       REVERSAL: drop the guard and the tray can again open on top of a keyboard that has not
       left — the flash. Do NOT instead make the backstop conditional: that is the belt. */
    const baseH = kbViewportH();
    let backstop = 0;
    const disarm = () => {                              // ★★ R3-5: unbind only — never the action
      done = true;
      clearTimeout(backstop);
      window.removeEventListener('resize', reveal);
      if (window.visualViewport) window.visualViewport.removeEventListener('resize', reveal);
      if (kbHandoffCancel === disarm) kbHandoffCancel = null;
    };
    const reveal = (e) => {
      if (done) return;
      if (e && !(kbViewportH() > baseH + 60)) return;   // a resize, but not the keyboard leaving — keep holding
      disarm();
      try { console.warn('[KBTRAY] reveal by=' + (e && e.type ? e.type : 'backstop') + ' ih=' + window.innerHeight + ' t=' + Math.round(performance.now())); } catch (_) {}   // ★ Session K stamp (temporary, the [KBTRAY] set)
      revealAttachTray(tray);
    };
    window.addEventListener('resize', reveal);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', reveal);
    backstop = setTimeout(reveal, 450);
    kbHandoffCancel = disarm;
    return tray;
  }

  /* The tile → verb routing, ONE function for both presentations (tray and sheet). */
  function onAttachAction(id) {
    if (!attachTilesFor(attachFlags()).some((t) => t.id === id)) return;
    if (id === 'file') bridge.send('ixian:sendfile');
    else if (id === 'photo' || id === 'gif') bridge.send('ixian:sendmedia');
    // ★★ L1 (#640): the `else` legs are gone with WalletSendPage / WalletReceivePage.
    // SingleChatPage declares BOTH caps unconditionally (:909), so those legs could
    // only ever run against an exe that no longer exists. The gate stays honest.
    else if (id === 'pay') { if (bridge.cap('composeSend')) openSendTakeover(); }
    else if (id === 'request') { if (bridge.cap('composeRequest')) openRequestForPeer(); }
    else if (id === 'app') openAppPicker();
  }

  function openAttach() {
    /* Belt for a stale tap: the ⊕ can be hidden between the press and this call. */
    if (!attachAvailable()) return;
    /* ★ #705 (Damir, Session G): on MOBILE the grid is a TRAY under the composer,
       WhatsApp-style, and the ⊕ toggles it. Desktop keeps the M6 popover rising from
       the ⊕ — a keyboard-slot tray has no keyboard to replace there. */
    if (!document.documentElement.hasAttribute('data-desktop')) {
      if (closeAttachTrayIfOpen()) return;
      const input = composerEl && composerEl.querySelector('.c-composer__input');
      try { console.warn('[KBTRAY] open ih=' + window.innerHeight + ' kbUp=' + kbUp + ' focused=' + (!!input && document.activeElement === input) + ' t=' + Math.round(performance.now())); } catch (_) {}   // ★ Session J stamp (temporary)
      const trayArgs = {
        composerEl,
        ...attachFlags(),
        strings: window.SL || {},
        /* the tile CLOSES the tray inside the component; the mirror must hear about it
           here, or C# keeps routing the next back press into an empty chatBack. */
        onAction: (id) => { syncChatOverlay(); onAttachAction(id); },
      };
      /* ★ Session K (walk J2 K1 — Damir's "go" on the mechanism, no capture that day): THE
         KEYBOARD IS UP → HAND IT TO THE TRAY, the mirror of handTrayToKeyboard. #721's
         `instant` gave the tray its full slot in the SAME frame as the blur, and Android
         hides the keyboard 100–300 ms after the blur — so for that window the viewport was
         still keyboard-shrunk AND the tray sat under the composer: the composer at keyboard
         + tray, then the drop ("jumps high up and back", a flash). Now the tray mounts
         CLOSED (no transition) and opens in the frame the viewport GROWS (the keyboard has
         left); a 450 ms backstop opens it anyway (a keyboard that never resizes). */
      if (kbUp) {
        handKeyboardToTray(trayArgs, input);
        return;
      }
      const tray = openAttachTray({
        ...trayArgs,
        /* #721: the field is focused but no keyboard is up (hardware keyboard, desktop)
           → swap, do not rise. ★ #756: `kbUp` (the keyboard's own state) took the soft
           keyboard out of this test — it is the branch above now. */
        instant: !!input && document.activeElement === input,
      });
      if (tray) syncChatOverlay();   // back must close the tray before it closes the chat
      return;
    }
    const sheet = openAttachSheet({
      host: overlayHost,
      ...attachFlags(),
      strings: window.SL || {},
      /* ★★★ THE TILE IS RE-CHECKED AT ACTION TIME, ONCE, FOR ALL SIX TILES (round 3;
         surviving mutation Y6). An open sheet can outlive the answer it was built
         from: setChatMode can land while the sheet is open, and a tile that was legal
         at open is then refused by C#.
         Round 2 wrote that re-check as TWO per-leg guards on the two legs that reach C#
         directly, and the review deleted both with no pin turning red. The gate below
         asks `attachTilesFor` — the SAME function that decided which tiles the sheet
         drew — whether this tile still survives. One gate, six tiles, one rule. Do not
         add a per-leg copy back: a second copy of a rule is how the ⊕ and the sheet
         start disagreeing. */
      onAction: onAttachAction,
    });
    // Batch C (M6): desktop presents the share grid as a POPOVER rising from the
    // composer ⊕ (demo 06d ① grammar); no-op on mobile / when the ⊕ isn't found.
    // `sheet` is null when no tile survived. Then there is nothing to anchor.
    if (!sheet) return;
    anchorSheetAbove(sheet, composerEl && composerEl.querySelector('.c-composer__attach'), { host: overlayHost });
  }

  /* ——— W5 (#523): in-chat Pay — the send compose with the peer LOCKED (#139) ———
   * The compose only PROPOSES: `ixian:signSend` → C# re-parses → NATIVE confirm
   * (+ payment auth) → sign + broadcast → `signSendResult`. The sent-funds bubble
   * arrives through the normal message push; the takeover closes on the morph. */
  let chatSendView = null;
  let chatSendCtrl = null;
  let chatSendWait = 0;                                // loop fix: the no-answer backstop (tipWait grammar)
  let chatSendFocusin = null;                          // loop a11y fix: focus containment for the cover
  function clearSendWait() { if (chatSendWait) { clearTimeout(chatSendWait); chatSendWait = 0; } }
  function closeSendTakeover() {
    const t = document.querySelector('.chat-send-takeover');
    if (chatSendView && chatSendView._closeReview) { try { chatSendView._closeReview(); } catch (e) {} }   // loop r1 M4: no orphan sheet
    if (t) t.remove();
    chatSendView = null;
    chatSendCtrl = null;
    clearSendWait();
    if (chatSendFocusin) { document.removeEventListener('focusin', chatSendFocusin); chatSendFocusin = null; }
    syncChatOverlay();                                 // loop MAJOR fix (AND-29 class): back must stop eating the chat
    try { focusComposer(); } catch (e) { /* focus restore is best-effort */ }
  }
  function openSendTakeover() {
    /* ★★ ONE PREDICATE (round 2, MAJOR-2). The old guard read `mode.type !== 0`. An
       unknown room still has type 0, so the compose OPENED in a bot room six seconds
       after the round-1 belt granted the 1:1 defaults. `attachFlags().payments` answers
       false until setChatMode answers for this peer, and it is the same answer the ⊕,
       the sheet and the sheet's action gate read. */
    if (!attachFlags().payments) return;               // 1:1 only (C# rejects group sends)
    if (!identity.address) return;
    if (document.querySelector('.chat-send-takeover')) return;   // double-open guard
    const s = window.SL || {};
    const over = document.createElement('div');
    over.className = 'chat-send-takeover';
    over.append(createTopbar({
      variant: 'view', title: s.send || 'Send',
      backLabel: s.back || 'Back', onBack: closeSendTakeover,
    }));
    const body = document.createElement('div');
    body.className = 'chat-send-takeover__body u-scroll';
    chatSendView = createWalletSend({
      contacts: [],                                    // locked peer — no picker
      // loop fix (#211): identity.name CAN be the address echo — an address is
      // never a NAME (the component renders its 'Address' label instead), and
      // the peer's photo rides along (#342).
      lockedRecipient: {
        name: (identity.name && identity.name !== identity.address) ? identity.name : '',
        address: identity.address,
        avatar: identity.avatar || null,
      },
      balance: 0,                                      // real balance rides the first quote
      fee: null,                                       // W6: gated until a quote lands
      strings: s, host: document.body,
      onQuote: (addr, amount) => bridge.send('ixian:feeQuery:' + addr + ':' + amount),
      onSend: (payload, ctrl) => {
        const r = (payload.recipients && payload.recipients[0]) || {};
        chatSendCtrl = ctrl;
        // loop MAJOR fix: a dropped push must not strand a locked sheet forever —
        // the tipWait grammar. The copy must NOT claim failure: the tx may be out.
        clearSendWait();
        // Loop r2 R2-1 (Batch W): ABOVE C#'s 120 s confirm self-heal — see home.html
        chatSendWait = setTimeout(() => {
          chatSendWait = 0;
          const c = chatSendCtrl;
          if (!c) return;
          chatSendCtrl = null;
          c.fail((window.SL && window.SL.sendNoAnswer) || 'No response from the app. Check your wallet activity before you try again.');
        }, 125000);
        bridge.send('ixian:signSend:' + r.address + ':' + payload.amount);
      },
      onDone: () => closeSendTakeover(),
    });
    body.append(chatSendView);
    over.append(body);
    document.body.append(over);
    syncChatOverlay();                                 // loop MAJOR fix: hardware back closes the COVER, not the chat
    // loop a11y fix (#205 grammar, light): focus moves INTO the cover and stays
    // out of the covered conversation; overlays (sheets/modals) stay reachable.
    // loop r1 C-4: the compose's FIRST FIELD (the amount, W-i) takes focus — not the
    // topbar Back button that `button, input` found first; containment is unchanged.
    const firstFocus = over.querySelector('.chat-send-takeover__body input') || over.querySelector('button, input');
    if (firstFocus) { try { firstFocus.focus(); } catch (e) {} }
    chatSendFocusin = (e) => {
      if (over.contains(e.target)) return;
      if (e.target && e.target.closest && e.target.closest('.c-sheet, .c-modal')) return;
      const f = over.querySelector('button, input');
      if (f) { try { f.focus(); } catch (err) {} }
    };
    document.addEventListener('focusin', chatSendFocusin);
    // balance prefetch: amount 0 = "quote the balance + Max ceiling" (fee stays gated)
    bridge.send('ixian:feeQuery:' + identity.address + ':0');
  }

  /* ★ W-d: request-in Pay → the review sheet. ONE sheet at a time; the quote rides
   * the SAME `setSendQuote` push the compose uses (routed below when no compose is
   * open). Cancel/dismiss releases the card's Pay oneShot latch (renderLog). The
   * C# side is unchanged: Confirm emits the existing `ixian:payRequest:<id>`, and
   * `payRequestResult` resolves the sheet exactly as `signSendResult` resolves the
   * compose (ok → success morph · cancel → silent re-enable · fail → inline). */
  let chatPayReview = null;                            // the open sheet's controller
  let chatPayCtrl = null;                              // its pending done/fail
  let chatPayId = '';                                  // loop r1 B-7: the card the sheet belongs to
  let chatPayWait = 0;
  function clearPayWait() { if (chatPayWait) { clearTimeout(chatPayWait); chatPayWait = 0; } }
  function closePayReview() {                          // loop r1 B-3: the screen-ready sweep + teardown path
    const r = chatPayReview;
    chatPayReview = null; chatPayCtrl = null; chatPayId = '';
    clearPayWait();
    if (r) { try { r.close(true); } catch (e) { /* already gone */ } }
  }
  function openPayRequestReview(rec) {
    if (chatPayReview) return;                         // double-open guard
    if (mode.type !== 0) return;                       // loop r1 A-2: 1:1 only (the card arm gates too — belt)
    if (!identity.address || !rec || !rec.id) return;
    const s = window.SL || {};
    const amount = String(rec.amount).trim();
    chatPayId = String(rec.id);
    chatPayReview = openPaymentReview({
      recipient: {
        name: (identity.name && identity.name !== identity.address) ? identity.name : '',
        address: identity.address,
        avatar: identity.avatar || null,
        contact: true,
      },
      amount, fee: null,                               // W6: quoted live — no invented fee
      host: overlayHost, strings: s,
      title: s.payRequestTitle || 'Pay this request',
      onQuote: (addr, amt) => bridge.send('ixian:feeQuery:' + addr + ':' + amt),
      onConfirm: (payload, ctrl) => {
        chatPayCtrl = ctrl;
        clearPayWait();
        // the tipWait grammar: no answer → release, never claim failure. Loop r1 B-2:
        // ABOVE C#'s 120 s confirm self-heal (SPayments.acquireConfirm) — the native
        // dialog can legitimately sit open that long, and a re-armed Confirm under it
        // would only collide with the live confirm.
        chatPayWait = setTimeout(() => {
          chatPayWait = 0;
          const c = chatPayCtrl;
          if (!c) return;
          chatPayCtrl = null;
          c.fail(s.sendNoAnswer || 'No response from the app. Check your wallet activity before you try again.');
        }, 125000);
        bridge.send('ixian:payRequest:' + rec.id);
      },
      onDone: () => { chatPayReview = null; chatPayCtrl = null; chatPayId = ''; clearPayWait(); },   // the status pushes flip the card
      onCancel: () => { chatPayReview = null; chatPayCtrl = null; chatPayId = ''; clearPayWait(); renderLog(); },   // release the Pay latch
    });
    if (!chatPayReview) { chatPayId = ''; renderLog(); }
  }

  /* #528: in-chat Request — the #139 amount sheet (peer known, no balance guard).
   * ONE verb per request (`ixian:sendrequest:<addr>:<amount>`, the W8 grammar on
   * SingleChatPage now); the request-out card arrives via the normal push. */
  function openRequestForPeer() {
    // ★★ ONE PREDICATE (round 2, MAJOR-2) — see openSendTakeover.
    if (!attachFlags().payments || !identity.address) return;
    openRequestSheet({
      recipient: {
        name: (identity.name && identity.name !== identity.address) ? identity.name : '',
        address: identity.address,
        avatar: identity.avatar || null,               // #342: the confirm moment shows WHO
      },
      host: overlayHost,
      strings: window.SL || {},
      onRequest: (payload, ctrl) => {
        bridge.send('ixian:sendrequest:' + identity.address + ':' + payload.amount);
        ctrl.done();                                   // a request is a message — the card push confirms
      },
    });
  }

  /* App-invite picker (legacy parity): the attach "App invite" tile opens a
   * sheet of installed multi-user apps (captured from loadApps/addApp); picking
   * one emits ixian:app:<id> → onApp starts an app session with the peer
   * (xaml:832). Empty state when none are installed. */
  function openAppPicker() {
    // ★★ ONE PREDICATE (round 2, MAJOR-2): C# blocks onApp in a bot room (xaml:834),
    // and an unknown room answers false too.
    if (!attachFlags().apps) return;
    const s = window.SL || {};
    const content = document.createElement('div');
    content.className = 'chat-app-picker';
    if (!chatApps.length) {
      const empty = document.createElement('p');
      empty.className = 'chat-app-picker__empty';
      empty.textContent = s.noApps || 'No apps installed yet.';
      content.append(empty);
    } else {
      for (const app of chatApps) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chat-app-picker__item';
        if (window.SpixiIcons && window.SpixiIcons.icon) b.append(window.SpixiIcons.icon('rocket', { size: 20 }));
        const nm = document.createElement('span');
        nm.className = 'chat-app-picker__name';
        nm.textContent = app.name;
        b.append(nm);
        b.addEventListener('click', () => { closeSheet(sheet); bridge.send('ixian:app:' + app.id); });
        content.append(b);
      }
    }
    const sheet = createSheet({ title: s.inviteApp || 'Invite an app', content, host: overlayHost, strings: s });
    openSheet(sheet);
  }

  /* incoming contact-request pane (#109) — showContactRequest fires when the
   * peer's requestAdd lands and they're not yet approved (xaml:1196). Only "1"
   * is sent (no identity), so we populate from the header identity. Accept →
   * ixian:accept (onAcceptFriendRequest); Decline → ixian:undorequest (the only
   * decline path SingleChatPage offers — removes the pending friend + leaves).
   * Sits above the composer.
   * Q1 review (#267 loop): the old claim "C#'s re-flush after accept clears it"
   * was FALSE — onAcceptFriendRequest (xaml:886-895) only flips friend.approved +
   * sendAcceptAdd; it pushes NO UI command and never calls loadMessages, so the
   * clearMessages → removeRequestPane path never fires on accept. The pane stayed
   * armed over a live composer, and its Decline (undorequest → removeFriend) then
   * DELETED the contact the user had just accepted. Accept now resolves the
   * request FE-side (markRequestResolved: drop the pane + unlock + latch). */
  let requestPane = null;
  let requestResolved = false;   // ⑪ per-peer latch: this peer's request is settled for this page-load
  function removeRequestPane() { if (requestPane) { requestPane.remove(); requestPane = null; } }
  /* Q1 review (#267 loop): the request is settled (accepted here, from the
   * chats-list card, or on the peer's side — C#'s updateScreen pushes
   * showRequestSentModal("0") for BOTH pending states now). Terminal for this
   * peer/page-load: the still-arriving 1 Hz "Waiting for response" heartbeat and
   * a late showContactRequest must not re-lock the composer or re-arm the pane
   * behind the user's back (legacy did the same — chat.js:1880-1883 hid the pane
   * and re-enabled the chat bar on the accept click). NOT called on cancel/decline
   * (those pop the page). Reset per-peer in onChatScreenReady. */
  function markRequestResolved() {
    requestResolved = true;
    setComposerLock(null);
    removeRequestPane();
  }
  function showRequestPane() {
    removeRequestPane();
    requestPane = document.createElement('div');
    requestPane.className = 'chat-request-pane';
    requestPane.append(createContactRequest({
      name: identity.name || '', address: identity.address || '',
      timestamp: Date.now(), host: overlayHost, strings: window.SL || {},
      // Accept → optimistic resolve: emit the verb, then drop the pane + unlock +
      // latch. C# gives us nothing back on accept (see the docblock above), so the
      // pane's removal is OURS to do; the latch makes it stick against the pending
      // heartbeat that keeps ticking until the next updateScreen.
      /* ★★ AUG (Damir 2026-08-30, ON DEVICE): "the 'you are now connected' or
         'establishing…' is not shown upon accepting request, and then abruptly shows".
         DIAGNOSIS: the chats list DOES stage a handshaking row — acceptContactRequest()
         gives it `handshaking:true` and the "Setting up a secure connection…"
         excerpt for a ≥3s hold (#109 / CH2). But that staging lives in home.html's
         REQUEST-CARD handler, and accepting from inside the CHAT never reaches it: the two
         shells share no JS (#221) and C# gives us nothing back on accept. So the list sat
         on a bare row until the C# contacts re-flush landed with the connected message.
         ★ The marker below is the SAME cross-WebView grammar this codebase already uses for
         exactly this problem — one file:// localStorage origin, a namespaced key, read by
         the other shell on its storage event + focus/visibility fallback (spixi.backup.last
         #314, and Q12's spixi.exdel.<addr>). No bridge verb, no shared JS.
         ⚠ NO PEER TEXT IS STORED, only an address and a timestamp — the #254 rule, because
         mini-apps share this storage partition. */
      onAccept: () => {
        bridge.send('ixian:accept');
        try {
          const a = identity.address || '';
          if (a) localStorage.setItem('spixi.hsstage.' + a, String(Date.now()));
        } catch (_) { /* DomStorageEnabled=false → the list just misses the staging */ }
        markRequestResolved();
      },
      onDecline: () => bridge.send('ixian:undorequest'),
    }));
    document.getElementById('chat-composer').before(requestPane);
    // ⑪ same-class hazard as the outgoing lock: pre-accept the handshake isn't
    // done — a composed message would be locally "sent" (ticks) and never arrive.
    // The pane's Accept/Decline are the only affordances until the accept lands.
    setComposerLock('incoming');
  }

  /* ⑪ ★ COMPOSER LOCK (pending contact states) — DECISIONS #266.
   * THE BUG: after sending a contact request the composer stayed live; a typed
   * message was written to the LOCAL store, rendered with delivered+read ticks
   * (updateMessage echoes the local record's flags — not a real ack), and the
   * peer NEVER received it. The app lied about delivery.
   * THE SIGNAL (was a dbg stub): SingleChatPage.onLoad:648-652 pushes
   * showRequestSentModal("1") when friend.state == RequestSent; updateScreen
   * :1900-1904 pushes "0" the moment the state flips to Approved — an EXPLICIT
   * unlock, chosen over inferring from the accepted-system-message or the
   * showCallButton side-channel (states, not messages; codec-independent).
   * THE CANCEL: ixian:undorequest (xaml:353 — removeFriend + pop + clear detail
   * pane; already the incoming-decline verb). No confirm on Cancel: it's
   * reversible (re-send the request) and ⑩ just made Decline single-click —
   * one grammar for both request-flow exits. C# pops the page after cancel;
   * the chats-list "Request sent" row + picker pending badge clear on the
   * shouldRefreshContacts re-flush (HomePage:1945-1949) — no FE mirror needed.
   * States: null (live) · 'outgoing' (waiting strip + Cancel) · 'incoming'
   * (request pane is the affordance; composer hidden, no strip). */
  let composerLock = null;
  let pendingStrip = null;
  function pendingStripText() {
    const tpl = (window.SL && window.SL.waitingForAccept) || 'Waiting for {name} to accept your request';
    // #288 review: String.replace expands $&, $`, $' and $n in the REPLACEMENT, so a
    // peer nickname containing "$&" rendered mangled. split/join is the codebase canon.
    return tpl.split('{name}').join(identityTitle() || '');
  }
  function refreshPendingStrip() {
    if (!pendingStrip) return;
    const t = pendingStrip.querySelector('.chat-pending-strip__text');
    if (t) t.textContent = pendingStripText();
  }
  function setComposerLock(kind) {
    if (composerLock === kind) { refreshPendingStrip(); return; }
    composerLock = kind;
    if (pendingStrip) { pendingStrip.remove(); pendingStrip = null; }
    if (composerEl) composerEl.hidden = !!kind;
    if (kind === 'outgoing') {
      pendingStrip = document.createElement('div');
      pendingStrip.className = 'chat-pending-strip';
      const txt = document.createElement('span');
      txt.className = 'chat-pending-strip__text';
      txt.textContent = pendingStripText();
      // polite live region: the strip appears/disappears with the request state
      pendingStrip.setAttribute('role', 'status');
      /* ★ #562 (Damir 2026-08-25) SUPERSEDES the ⑪ Cancel: HIDE, with the words.
       * The old ixian:undorequest ran removeFriend — Damir's repro: the peer's
       * later accept then landed in a void and their chat could never deliver
       * (RC1's cost). The strip now opens the SAME explain-modal the chats-list
       * row uses (one surface, #149③ rule); confirming writes the
       * `spixi.hidereq.<addr>` handshake (home.html tombstones the row with its
       * real tail) and leaves the chat. The Friend record LIVES — a future
       * accept completes and the chat comes back, as the words promise. */
      const cancel = createButton({
        label: (window.SL && window.SL.hideRequest) || 'Hide request',
        type: 'text', size: 32,
        onClick: () => {
          openRevokeRequestFlow({
            chat: { name: identityTitle(), address: identity.address || '' },
            host: overlayHost,
            strings: window.SL || {},
            onAction: () => {
              // r3 NIT: no identity yet → no key (a bare-prefix key could never be consumed)
              try { if (identity.address) localStorage.setItem('spixi.hidereq.' + identity.address, String(Date.now())); } catch (err) {}
              bridge.send('ixian:back');
            },
          });
        },
      });
      const disc = document.createElement('span');
      disc.className = 'chat-pending-strip__disc';
      disc.setAttribute('aria-hidden', 'true');   // decorative; the text is the status
      if (window.SpixiIcons && window.SpixiIcons.icon) disc.append(window.SpixiIcons.icon('user-plus', { size: 18 }));
      pendingStrip.append(disc, txt, cancel);
      document.getElementById('chat-composer').append(pendingStrip);
    }
  }

  /* secure-chat / privacy notice — ALWAYS the first item in the log, mirroring
   * the legacy `private-messages-note` (chat.js clearMessages:1404). Marks the
   * conversation as end-to-end encrypted + P2P. Copy is i18n-overridable via
   * window.SL; "How it works" opens the security page through the legacy verb. */
  const SECURE_LINK = 'https://www.spixi.io/help-center.html';
  function createSecureNotice() {
    const s = window.SL || {};
    return createSystemNotice({
      title: s.secureNoticeTitle || 'Encrypted. Peer-to-peer. Yours alone.',
      /* ★★ §0 LAUNCH BLOCKER — RULED BY DAMIR, AWAKE, 2026-08-30 00:20.
         The old copy ended "No server carries or stores them. Every message exists only with
         you two, nowhere else." THAT WAS FALSE whenever the recipient is offline:
         Ixian-Core/Streaming/OfflinePushMessages.cs POSTs to ipn.ixian.io/v2/push.php with
         tag = recipient, data = the ciphertext, fa = SENDER — held until the recipient's device
         calls fetch.php. A server does carry and store it, and it observes who sent to whom and
         when. The ENCRYPTION half was always fine; the "no server" sentence was the lie, and it
         is the exact sentence a journalist or a regulator tests first.
         ★ He asked for copy that leads on the encryption without narrating the relay. This makes
         NO server claim at all — omission is honest, an affirmative denial was not.
         ★★ "post-quantum" WAS VERIFIED AT SOURCE BEFORE IT WAS KEPT, and a careless sweep nearly
         killed it wrongly: grepping Kyber|ML-KEM|ML_KEM|CRYSTALS returns NOTHING because the
         identifier is `MLKem`, no separator. What actually runs: CoreStreamProcessor's
         prepareSharedSecret/finalizeSharedSecret build the message secret from ECDH + ML-KEM-1024
         combined (BouncyCastle.cs:49, MLKemParameters.ml_kem_1024), and spixi2 bodies are
         AES-256-GCM + ChaCha20-Poly1305 with per-message derived keys. The hybrid is real.
         ⚠ rsa2 (RSA-4096 key wrap) is still the fallback when a peer does not support spixi2
         (CoreStreamProcessor.cs:1618/1623) and is NOT post-quantum. This copy says nothing the
         fallback contradicts — but WHEN rsa2 RETIRES IS AN OPEN QUESTION; see §7.
         ★ RULED 2026-08-30 (Session G, Damir): the notice is NOT technical. "post-quantum"
         is dropped from the copy — not because it is false on spixi2 (it is true there), but
         because it is false for an rsa2 peer and Damir wants a reassuring line that is true on
         both paths. rsa2 is deprecated in due course; the copy does not wait for it. */
      text: s.secureNoticeText || 'Messages are sealed on your device and can be opened only by the person you sent them to. Nobody in between can read them, not even us.',
      linkLabel: s.secureNoticeLink || 'How it works',
      onLink: () => bridge.send('ixian:openLink:' + SECURE_LINK),
    });
  }

  /* full re-render of the log from the model — used after any insert/delete so
   * grouping + timestamp order stay correct. Rebuilds date separators too.
   * Call the coalesced `renderLog()` from handlers; `renderLogNow()` is the
   * synchronous rebuild (also used for the first paint). */
  function renderLogNow() {
    invalidateMentions();   // rebuild the mention name list from the CURRENT model each render → seen senders (addThem) are always included (review m1)
    const scrollWasAtBottom = nearBottom();
    // Build the whole log into a DETACHED fragment, then swap it in with ONE
    // replaceChildren — the live #messages box is NEVER momentarily empty, so a
    // paint can't catch a blank log mid-rebuild (Damir 2026-07-07 flicker). Also
    // removes the boot spinner (it's a child of box) on the first render.
    const frag = document.createDocumentFragment();
    rows.clear();
    /* A1 (#302): the "Show older messages" affordance, above everything else.
       Model-driven, NOT appended imperatively — this fragment replaces the whole
       box below, so a node poked in from outside a render would be destroyed. */
    if (showOlder) frag.append(buildOlderPill());
    /* A1 / D1 (#302): the secure notice marks the START of the conversation
       ("Encrypted… Yours alone"). Pinning it unconditionally was harmless while
       nothing above it contradicted it — with the pill it would assert "this is the
       beginning" directly above a button that loads more of the beginning. So it
       appears only once history is exhausted, which is also the demo contract
       (src/demo/chat.html:436-450) and #91's original intent. */
    if (!showOlder) frag.append(createSecureNotice());
    /* #265 (Damir ③ / C10 FE-side): a FULFILLED payment request is TWO C#
     * messages — the original requestFunds (flips to ":"+txid → Completed) AND
     * a separate sentFunds direct-payment message carrying the SAME txid. One
     * event, ONE card: suppress the direct-payment card when a REQUEST card
     * owns its txid (the request card carries the fuller story — who asked,
     * Completed badge, working Details). Titles matched via the locale-proof
     * carriers; unfulfilled requests (txid="") and standalone direct payments
     * are untouched. The model keeps both recs (updates still land). */
    const requestTxids = new Set();
    for (const oid of order) {
      const r = model.get(oid);
      if (r && r.kind === 'payment' && r.txid && isRequestTitle(r.title)) requestTxids.add(r.txid);
    }
    const ids = !requestTxids.size ? order : order.filter((oid) => {
      const r = model.get(oid);
      return !(r && r.kind === 'payment' && r.txid && !isRequestTitle(r.title) && requestTxids.has(r.txid));
    });
    const pos = positionsFor(ids);
    let lastDay = null;
    for (const id of ids) {
      const rec = model.get(id);
      const day = new Date(rec.ts).toDateString();
      if (day !== lastDay) { frag.append(createDateSeparator(rec.ts)); lastDay = day; }
      // A3: the one-shot unread divider sits under any date separator, above the
      // first still-unread incoming row of this open (scrolls with the content).
      if (id === unreadBoundaryId) frag.append(createUnreadDivider(window.SL || {}));
      const row = buildRow(rec, pos[id]);
      row.dataset.msgid = id;
      rows.set(id, row);
      frag.append(row);
      applyRowReactions(rec, row, false);  // re-attach pills after a rebuild
      wireMenu(rec, row);                  // long-press / right-click context menu
    }
    box.replaceChildren(frag);             // atomic swap — no empty intermediate state
    keepTypingLast();
    if (scrollWasAtBottom) box.scrollTop = box.scrollHeight;
    else applyOlderAnchor();               // A1: hold the reading position across a load-more re-flush
    firstRenderDone = true;                 // boot spinner is now gone
    if (typeof updateMentionFab === 'function') updateMentionFab();  // refresh @ jump FAB (#8)
    // Multi-select: every row node above is BRAND NEW, so the selection (kept by
    // message id) has to be re-painted onto them. refresh() also prunes ids whose
    // rows are gone — a bulk delete therefore empties the selection and the
    // contextual bar closes itself once the last one lands.
    if (chatSelect) chatSelect.refresh();
  }

  /* Render scheduling — two regimes:
   * (1) NORMAL (post-load): coalesce into one animation frame so a burst of
   *     small updates (status ticks, a new message) rebuilds at most once/frame.
   * (2) LOAD BURST: on open C# streams the WHOLE history — clearMessages →
   *     insertMessage×N → onChatScreenLoaded (SingleChatPage.xaml.cs:1110/588).
   *     Each EvaluateJavaScriptAsync runs on a LATER frame, so even the rAF
   *     coalescer rebuilt+swapped the growing log many times as rows streamed
   *     in → the log visibly "filled in" / flickered (Damir 2026-07-07, chats
   *     with history). During a burst we SUPPRESS every render (the model just
   *     accumulates) and paint ONCE at onChatScreenLoaded — so the user sees the
   *     boot spinner, then the finished conversation in a single paint. A
   *     trailing safety timer force-finishes the burst if that signal never
   *     arrives (other loadMessages call sites, robustness). */
  let renderQueued = false;
  let bursting = false;
  let burstSafety = 0;
  let firstRenderDone = false;   // gates the boot spinner → first real paint
  /* A3 — unread divider (one-shot in place, Damir Batch A interview). The id of
   * the FIRST incoming row that arrived read="False" during a LOAD BURST. The
   * signal is real and exactly-once: SingleChatPage pushes the message (:1603)
   * BEFORE updateMessageReadStatus flips message.read (:1661-65), so the open
   * burst carries the boundary once and the next open correctly doesn't. Only
   * burst rows count — a message arriving while the chat is OPEN also pushes
   * read="False" then flips, and would spawn a divider per message. Survives
   * session re-renders/re-flushes (the model keeps the id; re-flushed history
   * arrives read="True" so the boundary is never re-derived); reset per peer in
   * onChatScreenReady; renderLogNow draws it, positionsFor breaks bubble
   * grouping at it.
   *
   * Derivation is gated on `loadPhase && bursting` — BOTH, and each carries half
   * the meaning:
   *   loadPhase — "this is an open/history load, not live traffic". Spans
   *     clearMessages → onChatScreenLoaded with a GENEROUS 5 s safety, because
   *     SingleChatPage's OnAppearing → reloadScreen → loadMessages path and the
   *     bot channel-switch path never push onChatScreenLoaded.
   *   bursting — "rows are still streaming" (the render coalescer's flag, re-armed
   *     by every insert, expiring 250 ms after the last one). Needed because on
   *     those two no-onChatScreenLoaded paths `loadPhase` would otherwise stay
   *     true for the full 5 s window, and a LIVE message arriving inside it would
   *     be latched as "unread" in a chat the user is watching (bot channels are
   *     exactly the high-traffic case).
   * Consequence, deliberately accepted: if the streamed history ever gaps >250 ms
   * (cold start, very long history, slow Android EvaluateJavaScriptAsync) the
   * boundary in the tail rows is not derived → NO divider. That fails safe, in the
   * same direction as the read===undefined guard; the alternative (loadPhase alone)
   * fails LOUD, drawing a false divider over a message the user watched arrive.
   * `boundaryLatched` makes the boundary ONE-SHOT per peer: a later re-flush
   * (accept, channel re-load, updateMessage storm) must never derive a NEW divider.
   * All three reset per peer in onChatScreenReady (and per channel in
   * setSelectedChannel). */
  let unreadBoundaryId = null;
  let loadPhase = false;         // A3: inside the open/load stream (clearMessages → onChatScreenLoaded)
  let boundaryLatched = false;   // A3: the one-shot boundary chance for this peer/channel is spent
  let loadSafety = 0;            // A3: generous fallback if onChatScreenLoaded never arrives
  /* Start the A3 load phase. No-op once the boundary chance is spent (one-shot),
   * so a re-flush cannot re-open derivation. */
  function beginLoadPhase() {
    if (boundaryLatched) return;
    loadPhase = true;
