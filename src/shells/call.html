<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). The body-tail theme block is now redundant but harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ #1028 (walk R.6): the platform CONVENTION flag (#922 carrier) in every shell — base.css draws the Mac title-bar hairline from it -->
<script>(function(){var p='*SL{SpixiPlatform}';if(/^(android|ios|maccatalyst|windows)$/.test(p))document.documentElement.setAttribute('data-platform',p);})();</script>
<script>(function(){if('*SL{SpixiP1}'==='1')document.documentElement.setAttribute('data-p1','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;function b(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-bottom',v+'px');}b('*SL{AndroidInsetBottom}');window.setInsetBottom=b;function c(l,r){var n=/^\d{1,3}(\.\d{1,2})?$/,d=document.documentElement.style;if(n.test(String(l)))d.setProperty('--android-inset-left',l+'px');if(n.test(String(r)))d.setProperty('--android-inset-right',r+'px');}c('*SL{AndroidInsetLeft}','*SL{AndroidInsetRight}');window.setInsetSides=c;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Call</title>
<style>
  /* ★ #1074: the call surface is DARK in both themes — = --call-ground, CallPage.callGround and
     surfaceColorStringFor("call.html"), so the pre-paint frame never flashes light. */
  html, html[data-theme="dark"] { background: #14161c; }
  /* ★ #1080 F8/F9: DESKTOP is see-through — the stage and the WebView are transparent (CallPage.stageGround,
     surfaceColorStringFor), so the ring's scrim dims the app behind it and the card rounds itself. The
     data-desktop flag is set by the script above, before this rule is parsed. */
  html[data-desktop], html[data-desktop][data-theme="dark"] { background: transparent; }
  /* ★★ B4/B5 (office walk #1084): data-device-bg="own" on <html> opts this shell out of the build's device
     ground (scripts/lib/inline.mjs DEVICE_CSS), whose `background: var(--surface-screen) !important` beat both
     rules above — the desktop ring dimmed a solid light page, the call card sat on a square, and the phone's
     first frame could paint the light surface under a dark call. This document owns its ground. */
</style>

<style>
  /* Q4-③ (#270): THE native call surface — loaded ONLY by CallPage, the one
     C#-presented cover that replaced the per-pane call-ui broadcasts (Damir F5:
     N rings/N bars on desktop, roster-less identities). The modes are below (#1074).
     Identity (nick + avatar data-URI, X1) is pushed by C# — always right.
     SECURITY: this page emits intent only — the global call verbs
     (ixian:appAccept/appReject/hangUp) and, since #1074, the CallPage-only control
     verbs (callExpand/callMinimise/callMute/callSpeaker/callSilence/callDeclineMsg).
     C# owns the call. */
  html, body { margin: 0; height: 100%; background: var(--call-ground); }
  :root[data-desktop], :root[data-desktop] body { background: transparent; }   /* ★ #1080 F8/F9: see the head note */
  body { overflow: hidden; }
  /* ★ #1074 — three modes, one document (CallPage.setMode):
       ring — full-window; c-callin renders over the call ground.
       full — full-window; c-callscreen, the expanded in-call view.
       bar  — the minimised CARD: the native stage is a rounded Border BELOW the app's top
              bar (CallPage.applyStageLayout) and --call-card-h tall, so the card fills
              this viewport edge to edge — no radius, shadow or inset here (the native
              Border clips + shadows it), and NO safe-top padding (the card sits under the
              top bar, not under the status bar). */
  :root { --call-card-h: 64px; }
  /* #46 r2 MINOR-6: the card exists only in bar mode — a card still fading out after a
     bar → full or bar → ring swap must not float over the new view (or take its taps). */
  body:not([data-mode="bar"]) .c-callbar { display: none; }
  /* ★ #1166 lever 9 (#1165 (6), the #1123 (4) mechanism): the card is laid out FROM THE TOP at its own height
     (--call-card-h = CallPage.cardHeightDip), not as 100% of the viewport. The native stage is already 64 dip when the
     shell is asked to paint, but the WebView's viewport reaches 64 px ~200 ms later (the resize, [CALLPAINT] via=resize
     212–223 ms). Laid out from the top, the card is right at ANY viewport height — the top 64 px the stage shows are
     the card — so awaitPaint's bar test passes at once (fits(), below). At the settled size the box is identical. */
  body[data-mode="bar"] .c-callbar,
  :root[data-desktop] body[data-mode="bar"] .c-callbar {
    top: 0; left: 0; right: 0; bottom: auto;
    width: auto;
    height: var(--call-card-h);
    border-radius: 0;
    box-shadow: none;
    transform: none;
  }
  /* ★ #1080 F9 (walk C.11, Damir ⑦: "desktop call card sharp corners"): on desktop the native stage is
     the card PLUS --call-card-pad on every side (CallPage.cardShadowPadDip — keep the two equal), and
     transparent — so the card draws its OWN 16px corners and shadow here. WebView2 is a composition
     visual a MAUI Border cannot clip, which is why the native rounding never reached it. */
  :root[data-desktop] { --call-card-pad: 8px; }   /* (#46 r1) 12 → 8: the pad is click-through-dead window area around the card */
  :root[data-desktop] body[data-mode="bar"] .c-callbar {
    top: var(--call-card-pad); left: var(--call-card-pad); right: var(--call-card-pad); bottom: auto;
    height: var(--call-card-h);   /* ★ #1166 lever 9: from the top (stage = card + 2 × pad, CallPage.applyStageLayout) */
    border-radius: var(--radius-16, 16px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);    /* sanctioned: the card's own shadow, fitted inside the 8px pad (the native Border shadow it replaces: black 0.28) */
  }
  /* ★ #1087 (Damir, Android dark: the minimised card did not stand off the dark UI): in DARK the card carries the
     glass edge — a hairline + a top highlight (tokens --call-card-edge / --call-card-highlight). Drawn INSIDE the
     card (inset), so the phone's native Border clip (16px) and the desktop card both keep it; the card rounds itself
     to the same 16px so the line follows the corner. The desktop rule keeps its outer shadow beside it. */
  :root[data-theme="dark"] body[data-mode="bar"] .c-callbar {
    border-radius: var(--radius-16, 16px);
    box-shadow: inset 0 0 0 1px var(--call-card-edge), inset 0 1px 0 var(--call-card-highlight);
  }
  :root[data-theme="dark"] body[data-mode="bar"] .c-callbar__main { margin-block: 1px; }   /* #46 r1 N2: the hover/press wash stays inside the edge */
  :root[data-theme="dark"][data-desktop] body[data-mode="bar"] .c-callbar {
    box-shadow: inset 0 0 0 1px var(--call-card-edge), inset 0 1px 0 var(--call-card-highlight), 0 2px 6px rgba(0, 0, 0, 0.28);   /* sanctioned: = the desktop card shadow above */
  }
  /* ★ #1080 F9 (Damir ⑦: "a blue focus ring shows on the left"): after a POINTER swap (Minimise / the
     card / Accept) the new view takes focus for keyboard and screen-reader users (r4 MINOR-2) — and
     Chromium paints a programmatic focus with no prior focused element as :focus-visible. A pointer
     swap marks the target data-noring; the ring comes back on the first key press (renderCall). */
  [data-noring]:focus-visible { outline: none; }
  /* ★★ B4/B5 (#1093) WINDOWS: WinUI 3's WebView2 cannot be see-through (CallPage.winScrim note), so on Windows
     this WebView is only ever the CARD — CallPage draws the scrim natively and sizes the WebView to the card
     (width fixed there, height from ixian:callCardH below). Here: no in-page scrim, the card fills the width and
     sits at the top (its natural height is what gets reported), no outer shadow (it would be cut at the WebView
     edge), no transparent pad around the minimised card. The rounded corners stay: the WebView2 ground behind
     them is the colour around the card (CallPage.webViewDefaultGround). The Mac keeps the see-through page. */
  :root[data-platform="windows"][data-desktop] { --call-card-pad: 0px; }
  :root[data-platform="windows"][data-desktop] body[data-mode="bar"] .c-callbar { box-shadow: none; }
  :root[data-platform="windows"][data-theme="dark"][data-desktop] body[data-mode="bar"] .c-callbar {
    box-shadow: inset 0 0 0 1px var(--call-card-edge), inset 0 1px 0 var(--call-card-highlight);
  }
  :root[data-platform="windows"][data-desktop] .c-callin,
  :root[data-platform="windows"][data-desktop] .c-callscreen {
    background: transparent;
    justify-content: flex-start;
    align-items: stretch;
    overflow-y: auto;   /* (#46 r1 MAJOR-4) a short window clamps the card (CallPage) — Accept / End stay reachable */
  }
  /* (#46 r1 MINOR-2) the in-page overlay scrim under the ring would darken the card's corners over the native scrim */
  :root[data-platform="windows"][data-desktop] .c-scrim { background: transparent; }
  /* ★ #1094 (walk #1093 B6w, Damir: "the background behind both cards on Windows, squared"): the WebView2 box is square
     and opaque, so the ground in the round corners can only be a guess of what is behind it — and the guess showed
     (the dimmed app, the chat canvas). Damir's pick: a SMALL radius on Windows, 4px, so the guessed wedge is tiny. */
  :root[data-platform="windows"][data-desktop] .c-callin__card,
  :root[data-platform="windows"][data-desktop] .c-callscreen__card,
  :root[data-platform="windows"][data-desktop] body[data-mode="bar"] .c-callbar { border-radius: 4px; }
  /* a clamped full card still scrolls: a quiet themed bar, not the white classic one (walk B4b) */
  :root[data-platform="windows"][data-desktop] .c-callin,
  :root[data-platform="windows"][data-desktop] .c-callscreen { scrollbar-width: thin; scrollbar-color: var(--call-btn-pressed) transparent; }
  /* ★ #1094 (walk #1093 B4b, Damir: "small window shows a weird card, should be responsive"): a SHORT window (CallPage
     sets data-call-compact below 520 dip) gets a compact, wide ring — identity left, Decline / Accept right, the quiet
     row under them. No scroll. The pulse rings step out.
     ★ #1101 0b(d) (Damir): the e2e chip is BACK — a first row, start-aligned over the identity (it was hidden by #1094). */
  :root[data-call-compact] .c-callin__card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "top top" "id act" "quick quick";
    align-items: center;
    column-gap: var(--spacing-12);
    row-gap: var(--spacing-12);
    padding: var(--spacing-16);
  }
  :root[data-call-compact] .c-callin__top { grid-area: top; justify-content: flex-start; margin: 0; }
  :root[data-call-compact] .c-callin__identity {
    grid-area: id;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas: "av name" "av sub";
    align-items: center;
    column-gap: var(--spacing-12);
    row-gap: 0;
    padding-block: 0;
    text-align: start;
  }
  :root[data-call-compact] .c-callin__avatar { grid-area: av; margin: 0; }
  :root[data-call-compact] .c-callin__avatar::before,
  :root[data-call-compact] .c-callin__avatar::after { display: none; }
  :root[data-call-compact] .c-callin__avatar .c-avatar { width: 48px !important; height: 48px !important; }   /* sanctioned: createAvatar sizes itself inline (112) */
  :root[data-call-compact] .c-callin__avatar .c-avatar__initials { font-size: 18px; }
  :root[data-call-compact] .c-callin__name {
    grid-area: name;
    font-size: var(--font-size-body-lg, 16px);
    line-height: var(--line-height-body-lg, 24px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    overflow-wrap: normal;
  }
  :root[data-call-compact] .c-callin__sub { grid-area: sub; font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm); }
  :root[data-call-compact] .c-callin__actions { grid-area: act; width: auto; margin: 0; gap: var(--spacing-12); }
  :root[data-call-compact] .c-callin__circle { width: 48px; height: 48px; }
  :root[data-call-compact] .c-callin__circle svg { width: 22px; height: 22px; }
  :root[data-call-compact] .c-callin__label { display: none; }
  :root[data-call-compact] .c-callin__quick { grid-area: quick; order: 0; margin: 0; }
  /* (#46 r1) the pills keep the 44px target (#990). While the decline sheet is open the card fills the (grown) WebView,
     so no ground strip shows under a compact card — its height report is then the viewport itself, a fixed point. */
  :root[data-platform="windows"][data-desktop] .c-callin[data-sheet] .c-callin__card { min-height: 100%; }
  /* (#46 r2 NIT) the sheet's 76% cap made it scroll inside a card-sized WebView that already has room for it */
  :root[data-platform="windows"][data-desktop] .c-declinemsg-sheet { max-height: calc(100% - 48px); }
  :root[data-platform="windows"][data-desktop] .c-callin__card,
  :root[data-platform="windows"][data-desktop] .c-callscreen__card {
    width: 100%;
    box-shadow: none;
  }
</style>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: C#-substituted locale carrier — the dictionary follows the Settings pick;
     ?lang= still overrides (demos/tests); un-substituted → en-us fallback. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="../demo/spixi.iife.js"></script>
<script>/* ★ L15b (Session Z): the flag font — a device that cannot paint a flag emoji (Windows) gets the flags-only Twemoji face for the regional-indicator block, injected at runtime so the 78 KB is never inlined and never fetched on a phone; flags.js holds the mechanism. Unguarded on purpose: a missing export must fail loudly at boot, not fall silent. ★ #917: the deferred form — no flag on this shell's first screen; a phone probes after load + one frame, desktop stays synchronous (flags.js). */window.Spixi.installFlagFontLater();</script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production CALL shell — the one native call surface (CallPage, Q4-③/#270).
   *
   * Contract (CallPage.xaml.cs):
   *   C#→JS  setCallUi(kind, name, avatar, text, startedSecs, sessionId, address)
   *          kind ∈ 'ring' | 'dialing' | 'incall'. Re-pushed on EVERY state
   *          change and re-asserted after ixian:onload (the shell holds no
   *          state C# can't replay). avatar = data URI (X1) or a sentinel path
   *          (→ gradient fallback). startedSecs = unix SECONDS, 0 ⇒ no timer.
   *   JS→C#  ixian:appAccept:<addr>:<sid> · ixian:appReject:<addr>:<sid> ·
   *          ixian:hangUp:<sid> — the existing global verbs (onNavigatingGlobal;
   *          VoIPManager routes them; ★ mini-apps still can't reach any of this —
   *          acceptsCallPushes gates are untouched).
   *   ★ #1074 (call premium):
   *   C#→JS  setCallCaps(mute, speaker, silence, declineMsg) — "1"/"0" per platform;
   *          a control renders only when its cap is on (no dead buttons).
   *          setCallAudio(muted, speaker, silenced, expanded, ringGen) — C#'s echo; pushed
   *          BEFORE setCallUi so the kind renders with current state.
   *   JS→C#  (CallPage-local, never global — mini-apps and other shells cannot send them)
   *          ixian:callExpand · ixian:callMinimise · ixian:callMute:<0|1>:<sid> ·
   *          ixian:callSpeaker:<0|1>:<sid> · ixian:callSilence:<sid> ·
   *          ixian:callDeclineMsg:<sid>:<base64url UTF-8>
   *   Dismissal is NATIVE: C# tears the surface down on accept-elsewhere /
   *   decline / remote hang-up / the #265 ring timeout — this shell never
   *   self-dismisses (no local verb exists; a hidden-but-ringing call would lie).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    showIncomingCall, hideIncomingCall, updateIncomingCall,
    showCallBar, hideCallBar,
    showCallScreen, hideCallScreen,
    createNativeBridge, installExecuteUiCommand, utf8ToB64Url, dismissTopOverlay,
    applyPushedTheme,
    isAddressShaped, truncateAddressMiddle,   // ★ B3 (#1084): the #211 address canon for the caller name
    } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme fallback (head-top script normally resolved it already).
  (function () {
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  const bridge = createNativeBridge();
  installExecuteUiCommand();

  // C# pushes sentinels/paths through un-encoded (X1) — anything that isn't a
  // data/http(s) URI can't resolve in this self-contained shell → gradient.
  function resolveAvatar(v) {
    const s = String(v || '');
    return /^(data:image\/|https?:\/\/)/.test(s) ? s : null;
  }

  /* ★ #1074: what THIS platform can do (setCallCaps) and C#'s echo of the live controls
   * (setCallAudio). Every cap defaults OFF — a control renders only after C# says its verb
   * is wired here (no dead buttons, #256/#264). */
  const caps = { mute: false, speaker: false, silence: false, declineMsg: false };
  const audio = { muted: false, speaker: false, silenced: false, expanded: false, ringGen: 0 };
  let last = null;          // the last setCallUi payload — re-rendered when caps/audio change

  let ringEl = null;        // live c-callin (singleton)
  let ringSession = '';
  let barSession = '';      // hang-up target while the call UI is up
  const hungUp = new Set(); // sessions this surface already hung up (one-shot per call)
  /* ★ #1074 (#46 r1 MAJOR-1/2): sessions whose ring the USER already answered here —
   * Accept, Decline or Decline-with-message. call-overlay.js dismisses its own ring on
   * those, and C#'s next push can still say "ring" for a moment (the silence echo, the
   * setCallAudio that precedes every setCallUi). A ring for an acted session is NEVER
   * rebuilt: a second live ring over the in-call card could Decline the answered call. */
  /* ★ #46 r2 MAJOR-1: keyed sid → the ring GENERATION at the tap. C# bumps the generation
   * (VoIPManager.currentCallRingGen, 5th setCallAudio arg) only when an Accept is REFUSED
   * (no mic permission) and the ring must come back — the one case a latched ring rebuilds. */
  const actedRings = new Map();
  let userSwapAt = 0;       // a tap on Minimise / the card / Accept (WebKit never focuses a tapped button — r3 NIT-3)
  /* ★ #1080 F9: the last input kind, so a POINTER swap moves focus without painting a ring */
  let lastInput = '';
  document.addEventListener('pointerdown', () => { lastInput = 'pointer'; }, true);
  document.addEventListener('keydown', (e) => {
    /* (#46 r1) a modifier press, an IME composition or the Android 229 key is not keyboard navigation */
    if (e.isComposing || e.keyCode === 229 || ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(e.key)) return;
    lastInput = 'keyboard';
    for (const n of document.querySelectorAll('[data-noring]')) n.removeAttribute('data-noring');
  }, true);
  let lastCallMode = '';   // 'full' | 'bar' — the call view on screen, for the focus hand-off

  function dropRing() {
    if (!ringEl) return;
    const el = ringEl;
    ringEl = null;
    ringSession = '';
    hideIncomingCall(el);   // idempotent: a ring already dismissing is simply removed
  }

  function renderRing(name, avatar, text, sid, addr) {
    if (actedRings.has(sid)) {
      if (audio.ringGen <= actedRings.get(sid)) {   // answered here — C# is moving on; never rebuild
        if (ringEl && ringSession === sid && !ringEl.isConnected) { ringEl = null; ringSession = ''; }
        return;
      }
      actedRings.delete(sid);                        // C# re-rang it (a refused Accept) — show it again
      if (ringEl && ringSession === sid) dropRing();
    }
    if (ringEl && ringSession === sid && ringEl.isConnected) {
      updateIncomingCall(ringEl, { silenced: audio.silenced, strings });   // same ring — only the echo moves
      return;
    }
    dropRing();
    ringSession = sid;
    const acted = (fn) => (...a) => { actedRings.set(sid, audio.ringGen); fn(...a); };
    ringEl = showIncomingCall({
      host: document.body,
      ignore: false,       // Accept/Decline only — no local-dismiss verb exists (C# keeps ringing)
      caller: { name: name || '', address: addr || '', avatar: resolveAvatar(avatar) },
      sub: text || '',     // C#-localized "Incoming call" line
      // r4 MINOR-2: Accept's dismissal hands focus back to <body>; the first call view
      // that follows counts as a user swap, so focus lands on it (keyboard/screen reader)
      onAccept: acted(() => { userSwapAt = Date.now(); bridge.send('ixian:appAccept:' + addr + ':' + sid); }),
      onDecline: acted(() => bridge.send('ixian:appReject:' + addr + ':' + sid)),
      // ★ #1074: each quiet action only when its verb is wired on this platform
      onSilence: caps.silence ? () => bridge.send('ixian:callSilence:' + sid) : undefined,
      onDeclineMessage: caps.declineMsg
        ? acted((text) => bridge.send('ixian:callDeclineMsg:' + sid + ':' + utf8ToB64Url(text)))
        : undefined,
      strings,
    });
    updateIncomingCall(ringEl, { silenced: audio.silenced, strings });
  }

  function hangUpOnce() {
    const target = barSession;
    if (!target) return;                     // already ended — idempotent
    barSession = '';
    hungUp.add(target);
    bridge.send('ixian:hangUp:' + target);   // C# tears the surface down
  }

  function renderCall(name, avatar, addr, startedSecs, sid, text, prevFocus) {
    dropRing();
    // A re-assert must never re-arm a hang-up the user already made (review MINOR).
    barSession = hungUp.has(sid) ? '' : sid;
    const t = Number(startedSecs) || 0;
    const startedAt = t > 0 ? t * 1000 : null;   // 0 ⇒ dialing, no timer
    const common = {
      host: document.body,
      name: name || '', address: addr || '', avatar: resolveAvatar(avatar),
      startedAt,
      caps: { mute: caps.mute, speaker: caps.speaker },
      audio: { muted: audio.muted, speaker: audio.speaker },
      /* ★ #1080 F12 (#46 r1): the shell's own copy moves with the optimistic flip, so a re-render
         before C#'s echo cannot paint the old state back; no live session → false = no flip. */
      onMute: (on) => { if (!barSession) return false; audio.muted = !!on; bridge.send('ixian:callMute:' + (on ? '1' : '0') + ':' + barSession); return true; },
      onSpeaker: (on) => { if (!barSession) return false; audio.speaker = !!on; bridge.send('ixian:callSpeaker:' + (on ? '1' : '0') + ':' + barSession); return true; },
      onHangUp: hangUpOnce,
      strings,
    };
    /* #46 r1 MINOR-9 · r2 NIT-11 · r3 NIT-3: when the view SWAPS and this document has
     * focus, land focus in the new view if (a) the swap removed the control that held focus
     * here (hardware back, a mode change), or (b) the user tapped Minimise / the card /
     * Accept (WebKit never focuses a tapped button). Never otherwise: taking focus this
     * WebView does not hold would pull it (and the keyboard) away from another pane. */
    const hadFocus = document.hasFocus() && !!prevFocus && prevFocus !== document.body;
    const userSwap = userSwapAt > 0 && Date.now() - userSwapAt < 3000;
    let el;
    if (audio.expanded) {
      hideCallBar(document.body);
      el = showCallScreen({ ...common, onMinimise: () => { userSwapAt = Date.now(); bridge.send('ixian:callMinimise'); } });
    } else {
      hideCallScreen(document.body);
      // the card's identity region opens the full call screen (C#-owned expand)
      el = showCallBar({ ...common, text: String(text || ''), onReturn: () => { userSwapAt = Date.now(); bridge.send('ixian:callExpand'); } });
    }
    const lostFocus = hadFocus && (!prevFocus.isConnected || (!el.contains(prevFocus) && !!prevFocus.closest('.c-callbar:not([data-open])')));
    const mode = audio.expanded ? 'full' : 'bar';
    const swapped = mode !== lastCallMode;
    lastCallMode = mode;
    if (swapped) userSwapAt = 0;
    if (el && swapped && document.hasFocus() && (lostFocus || userSwap)) {
      const target = el.querySelector(audio.expanded ? '.c-callscreen__min' : '.c-callbar__main');
      if (target && typeof target.focus === 'function') {
        if (lastInput === 'pointer') target.setAttribute('data-noring', '');   // ★ #1080 F9
        target.focus({ preventScroll: true });
      }
    }
  }

  function render() {
    if (!last) return;
    const { kind, name, avatar, text, startedSecs, sid, addr } = last;
    if (kind === 'ring') {
      document.body.dataset.mode = 'ring';
      lastCallMode = '';
      hideCallBar(document.body);
      hideCallScreen(document.body);
      barSession = '';
      renderRing(name, avatar, text, sid, addr);
    } else if (kind === 'dialing' || kind === 'incall') {
      const prevFocus = document.activeElement;   // read BEFORE the mode flips (the card's display rule)
      document.body.dataset.mode = audio.expanded ? 'full' : 'bar';
      renderCall(name, avatar, addr, startedSecs, sid, text, prevFocus);
    }
    // any other kind: leave the surface exactly as it is (an unknown kind used to
    // fall into 'bar' mode and paint an empty opaque strip).
  }

  const flag = (v) => String(v) === '1';

  /* ★★ B4/B5 (#1093) — WINDOWS ONLY: report the card's natural height (dip = CSS px) so CallPage can size the
   * card-only WebView (see the head note). Ring → the ring card, full → the call-screen card; an open
   * decline-with-message dialog needs its own height + the dialog margin. The bar has a fixed height in C#. */
  const winCards = document.documentElement.getAttribute('data-platform') === 'windows'
    && document.documentElement.hasAttribute('data-desktop');
  let lastCardH = 0;
  function measureCardH() {
    const mode = document.body.dataset.mode;
    const sel = mode === 'ring' ? '.c-callin__card' : (mode === 'full' ? '.c-callscreen__card' : '');
    const card = sel ? document.querySelector(sel) : null;
    if (!card) return 0;
    /* (#46 r1 MAJOR-3) offsetHeight = the LAYOUT height. getBoundingClientRect includes the entry transform
       (the call-screen card mounts at scale(0.96)), and a transform fires no ResizeObserver — the card was sized
       4% short for good. */
    /* (#46 r2 MINOR-1) the COMPUTED height: transform-free like offsetHeight but fractional, so the ceil really
       rounds up — an integer-rounded 451.4 left 0.4 px to overflow into a scrollbar at 125 / 150 % scaling. */
    const layoutH = (n) => parseFloat(getComputedStyle(n).height) || n.offsetHeight;
    let h = layoutH(card);
    const sheet = document.querySelector('.c-declinemsg-sheet');
    /* ★ #1094 (#46 r1 MINOR-1): the sheet's NATURAL height (scrollHeight), not its capped box — the desktop sheet caps
       itself at 76% of the viewport, so the capped height grew the card-sized WebView in ~8 visible steps. */
    if (sheet) h = Math.max(h, Math.max(layoutH(sheet), sheet.scrollHeight) + 48);
    return Math.ceil(h);
  }
  function reportCardH() {
    if (!winCards) return;
    const h = Math.min(measureCardH(), 1600);   // (#46 r3 NIT) the C# bound — a value C# refuses would be waited for forever
    if (h >= 120 && Math.abs(h - lastCardH) >= 1) {
      lastCardH = h;
      bridge.send('ixian:callCardH:' + h);
    }
  }
  if (winCards) {
    let queued = false;
    const ro = typeof ResizeObserver === 'function' ? new ResizeObserver(() => scheduleCardH()) : null;
    function scheduleCardH() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        if (ro) {
          ro.disconnect();
          for (const n of document.querySelectorAll('.c-callin__card, .c-callscreen__card, .c-declinemsg-sheet')) ro.observe(n);
        }
        reportCardH();
      });
    }
    new MutationObserver(scheduleCardH).observe(document.body, { childList: true, attributes: true, attributeFilter: ['data-mode'] });
  }

  /* ★★ B6 (#1093): CallPage hid the stage for a mode swap, pushed the new view and gave the stage its new
   * geometry; answer when this document has PAINTED at that geometry so it can fade back in (no black frame,
   * no empty card slot). "At that geometry" = the viewport has the new mode's shape: the card is short, the
   * full views are tall; on Windows the card-only WebView has the height reported above. Two frames after
   * that, a frame at the new size has been produced. Never later than ~450 ms (C# has its own timeout too). */
  function awaitPaint(token, mode, maxH) {
    const t = String(token || '');
    if (!/^\d{1,18}$/.test(t)) return;
    const m = String(mode || '');
    if (winCards) reportCardH();
    /* (#46 r2 MAJOR-2) Windows: C# clamps the card to the window (maxH, digits; 0 = no clamp), so the height to wait
       for is EXACTLY min(card, maxH) — never "the first resize", which can still be the previous mode's card. */
    const capN = /^\d{1,5}$/.test(String(maxH || '')) ? Number(maxH) : 0;
    const fits = () => {
      const h = window.innerHeight;
      /* ★ #1166 lever 9: the card is laid out from the top at --call-card-h (the bar CSS above), so it paints right
         before the viewport shrinks — no wait for the resize (was `h <= 120`: 212–223 ms, #1123 (4)). */
      if (m === 'bar') return h > 0;
      if (winCards) {
        if (lastCardH <= 0) return true;
        const want = Math.max(120, capN > 0 ? Math.min(lastCardH, capN) : lastCardH);
        return Math.abs(h - want) <= 2;
      }
      return h > 200;
    };
    let done = false;
    let timer = 0;
    /* ★ G-9 [CALLPAINT] probe — TEMPORARY (#1115 A1: the bar reveal waits ≈240 ms although the native stage and
       WebView heights settle in 9–16 ms). Where the wait sits inside this handshake: the viewport height when the ask
       arrives, when `fits()` turned true (and after how many resize events, or the 450 ms timer), and when each of the
       two frames ran. One console line (Android routes it to ixian.log as [WEBVIEW]); integers + fixed words only. */
    const p0 = performance.now();
    const pr = { h0: Math.round(window.innerHeight), resizes: 0, fit: -1, via: 'now', r1: -1, r2: -1 };
    const ms = () => Math.round(performance.now() - p0);
    const onResize = () => { pr.resizes++; if (fits()) fire('resize'); };
    function fire(via) {
      if (done) return;
      done = true;
      pr.fit = ms(); pr.via = via;
      clearTimeout(timer);
      window.removeEventListener('resize', onResize);
      requestAnimationFrame(() => {
        pr.r1 = ms();
        requestAnimationFrame(() => {
          pr.r2 = ms();
          bridge.send('ixian:callPainted:' + t);
          try { console.log('[CALLPAINT] mode=' + (m === 'bar' ? 'bar' : m === 'ring' ? 'ring' : 'full') + ' h0=' + pr.h0 + ' h=' + Math.round(window.innerHeight)
            + ' resizes=' + pr.resizes + ' fit=' + pr.fit + 'ms via=' + pr.via + ' raf1=' + pr.r1 + 'ms raf2=' + pr.r2 + 'ms'); } catch (e) {}
        });
      });
    }
    timer = setTimeout(() => fire('timer'), 450);
    if (fits()) fire('now');
    else window.addEventListener('resize', onResize);
  }

  const handlers = {
    /* ★ N71 (#421): the live re-theme push (theme-runtime.js). The call views are dark
     * in both themes (#1074); the decline sheet still follows the app theme. */
    setTheme(name) { applyPushedTheme(name); },
    /* the ONE state push — full current state, replayable (see contract above) */
    setCallUi(kind, name, avatar, text, startedSecs, sessionId, address) {
      /* ★ B3 (office walk #1084, C.2 on the Mac: the ring card showed the FULL address). A contact with
       * no nickname reaches C# as its address IN the nick field, so the components' own "no name →
       * truncate the address" fallback never ran. An address-shaped name is shortened here, like the
       * chat topbar and every list row (#211: never a full base58 in a title). */
      const shownName = name && isAddressShaped(String(name)) ? truncateAddressMiddle(String(name)) : name;
      last = {
        kind: String(kind || ''), name: shownName, avatar, text, startedSecs,
        sid: String(sessionId || ''), addr: String(address || ''),
      };
      render();
    },
    /* ★ #1074: platform caps — mute · speaker · silence · decline-with-message. Fixed per
     * platform, so a change only happens at the first push; the views are rebuilt then,
     * but an acted ring is never resurrected (renderRing). */
    setCallCaps(mute, speaker, silence, declineMsg) {
      const next = { mute: flag(mute), speaker: flag(speaker), silence: flag(silence), declineMsg: flag(declineMsg) };
      const changed = Object.keys(next).some((k) => next[k] !== caps[k]);
      Object.assign(caps, next);
      if (changed && last) {
        hideCallBar(document.body);
        hideCallScreen(document.body);
        dropRing();
        render();
      }
    },
    /* ★ #1074: C#'s echo of the live controls — the buttons show what C# did. It only
     * UPDATES what is on screen (#46 r1 MAJOR-2: it used to re-render from the previous
     * setCallUi, rebuilding a live ring after Accept). C# always follows it with setCallUi,
     * which is the one push that creates views. */
    setCallAudio(muted, speaker, silenced, expanded, ringGen) {
      audio.muted = flag(muted);
      audio.speaker = flag(speaker);
      audio.silenced = flag(silenced);
      audio.expanded = flag(expanded);
      const g = Number(ringGen);
      audio.ringGen = Number.isFinite(g) && g >= 0 ? Math.floor(g) : 0;   // an older C# sends no 5th arg → 0
      if (!last) return;
      if (last.kind === 'ring') {
        if (ringEl && ringEl.isConnected && ringSession === last.sid) updateIncomingCall(ringEl, { silenced: audio.silenced, strings });
      } else {
        render();   // dialing/in-call: mutates the live card/screen in place (or swaps the mode)
      }
    },
    /* ★ #1074 (#46 r1 MINOR-7): Android back while the ring is up. The ring cannot be
     * dismissed (escDismiss:false consumes it), so this closes only an open sheet above it. */
    callBack() { dismissTopOverlay(); },
    /* ★ #1094 (walk B4b): a short Windows window → the compact ring. "1"/"0" only; Windows card mode only. */
    setCallCompact(v) {
      if (!winCards) return;
      if (String(v) === '1') document.documentElement.setAttribute('data-call-compact', '');
      else document.documentElement.removeAttribute('data-call-compact');
    },
    /* ★★ B6 (#1093): C# asks for the painted signal of a hidden stage swap (token = digits, mode = the new mode). */
    callAwaitPaint(token, mode, maxH) { awaitPaint(token, mode, maxH); },
    /* ★ #1074 (#46 r1 MINOR-6): the iOS keyboard (CallPage attaches the native observer) —
     * the decline-with-message sheet rides --kb-inset (overlay.css). Validated number only. */
    __setKbInset(h) {
      const px = Math.max(0, Math.round(Number(h) || 0));
      document.documentElement.style.setProperty('--kb-inset', (px > 60 ? px : 0) + 'px');
    },
  };
  bridge.exposeAll(handlers);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177): C# then
   *    (re)pushes setCallUi and reveals the stage. ————————————————————————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
