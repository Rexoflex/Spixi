    <!-- ★ N77 (#413): dev-mode carrier, same grammar as home.html's. HomePage
         registers "devMode" with addCustomString at boot, so it resolves in EVERY
         generated document, not only index.html. Gates the load probe below. -->
    <span id="sl-devmode">*SL{devMode}</span>
    <span id="sl-payment-received">*SL{chat-payment-received}</span>
    <span id="sl-payment-request-received">*SL{chat-payment-request-received}</span>
    <span id="sl-payment-request-sent">*SL{chat-payment-request-sent}</span>
    <span id="sl-connecting-s2">*SL{global-connecting-s2}</span>
    <span id="sl-connecting-dlt">*SL{global-connecting-dlt}</span>
    <span id="sl-request-connected">*SL{global-friend-request-connected}</span>
    <!-- #434: the LEGACY sentence is still carried, and only for history. The copy
         changed to one direction-neutral line, but chats written before that build
         hold the old text — without this carrier they would stop matching and
         degrade from a centred event chip to an ordinary message bubble. -->
    <span id="sl-request-accepted">*SL{global-friend-request-accepted}</span>
    <span id="sl-waiting-response">*SL{chat-waiting-for-response}</span>
    <span id="sl-online">*SL{chat-online}</span>
  </div>
  <div id="chat-topbar"></div>
  <div class="c-chat-canvas">
    <!-- tabindex: keyboard users must be able to scroll text-only history -->
    <div class="messages u-scroll" id="messages" role="log" aria-label="Messages" tabindex="0"><div class="chat-boot" aria-hidden="true"><span class="chat-boot__spinner"></span></div></div>
  </div>
  <div id="chat-composer"></div>

<script src="spixi.icons.js"></script>
<script src="spixi.strings.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. Before this, production resolved
     'en-us' in EVERY locale. ?lang= still overrides (demos/tests); in a plain-browser
     preview the marker stays un-substituted → SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="spixi.bundle.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production chat shell — the redesigned single-chat surface wired to the REAL
   * C# MAUI bridge (native.js in the bundle). SingleChatPage.xaml.cs pushes the
   * conversation via executeUiCommand(fnRef, b64…) against the page globals
   * registered below; the composer + back button emit legacy `ixian:` commands
   * via bridge.send.
   *
   * Contract source of truth: Spixi/Pages/Chat/SingleChatPage.xaml.cs +
   * Resources/Raw/html/js/chat.js (legacy). The 1:1 text conversation is wired
   * fully (create + status upsert + delete + typing + clear). Everything else is
   * a safe no-op stub so C#'s dispatch never console.errors.
   *
   * CONTRACT NOTES (verified against SingleChatPage.xaml.cs, line refs):
   *  · Text CREATE arrives via addMe / addThem (chat.js insertMessage → prefix,
   *    xaml.cs:1460), 12 args:
   *      addMe(id, address, nick, avatar, text, time, sent, confirmed, read, paid, errorSending)
   *      addThem(id, address, nick, avatar, text, time)
   *    (legacy addMe/addThem share the addText 7-arg shape; addThem is called
   *    with only 6 by C#, so args 7-11 are undefined for incoming rows.)
   *  · Text STATUS UPDATE arrives via updateMessage (chat.js:1035, xaml.cs:1624):
   *      updateMessage(id, message, sent, confirmed, read, paid, errorSending)
   *    Legacy updateMessage ONLY mutates an existing msg_<id> row (returns early
   *    if unknown). To be robust here it is an UPSERT: create if the id is
   *    unknown (using `message` as the text + `sent` for direction), else update
   *    the existing row's status + text.
   *  · timestamps are UNIX SECONDS (legacy addText does `new Date(time*1000)`);
   *    the redesigned bubbles want ms → multiply.
   *  · All bool args are the .NET "True"/"False" strings.
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, setTopbarSub, createMessageBubble, createDateSeparator,
    createComposer, clearComposer, setComposerCost, createTypingIndicator, createScrollToLatest,
    setComposerContext, getComposerContext,   // M1 reply-to (#441): the quote strip above the input
    setScrollLatestCount,           // N53: unread badge on the scroll-to-latest chevron (shipped #74, wired here)
    attachPressFeedback,
    setMessageStatus, removeMessage,
    createFileBubble, setFileProgress,
    createMediaBubble, setMediaSrc, openMediaViewer,
    createPaymentBubble, createCallBubble,
    createAppBubble, createSystemNotice, createUnreadDivider,
    attachMessageMenu, openMessageMenu,   // openMessageMenu = the KEYBOARD path (Shift+F10 / Menu key)
    enterChatSelect, openTipSheet, openMemberSheet, openAttachSheet,
    hasAttachTiles, attachTilesFor, // the ONE attach predicate — see openAttach / syncAttachAffordance
    openRequestSheet,               // #528: attach → Request (the #139 amount sheet, live)
    createWalletSend,               // W5 (#523): attach → Pay (lockedRecipient compose)
    openPaymentReview,              // ★ W-d: request-in Pay → the review sheet BEFORE the native confirm
    setSendQuote: applySendQuote,   // W6 — aliased: the bridge handler below shares the name
    createModal, openModal, showToast, createButton,
    createWarningBanner, setWarning, createContactRequest,
    createSheet, openSheet, closeSheet,
    createChatInfo,                 // group/bot chat-info takeover (header tap; 1:1 → ContactDetails page)
    addReactions: applyReactions,   // component free-fn; aliased — the bridge handler below is also `addReactions`
    truncateAddressMiddle,          // #211 canon: chat surfaces show addresses truncated, never in full
    attachContextMenuAnchors, anchorSheetAbove,   // Batch C (M6): desktop sheet grammar (no-op on mobile)
    isPseudoAddressNick,            // D-19b (#370): blind roster "x"+address pseudo-keys never display
    isAddressShaped,                // ★ #589: the ONE address-shape test — a NICK is never middle-truncated
    attachChatFlow, syncChatFlow, detachChatFlow, // W5: "Live flow" animated pattern style (desktop-only)
    createNativeBridge, installExecuteUiCommand,
    /* ★ N81 (#422) — MISSED IN THE FIRST CUT, caught by the #46 audit executing the
     * BUILT artifact. readPatternPrefs() runs at module top level, so an unimported
     * name here is not a latent bug: the main script throws before bridge.exposeAll,
     * nothing is exposed, and every conversation boots to a permanent spinner.
     * ⚠ Neither gate could see it. build-shells' preflight validates DESTRUCTURED
     * symbols against the bundle — a symbol that is never destructured is invisible
     * to it, because its premise is staleness, not omission. The smoke pins regex-read
     * the file and never execute it. The new pin below is a destructure pin for that
     * reason. */
    patternLevelVar, readPatternLevel,
    /* ★ N71 (#421): and applyPushedTheme — the SECOND time this exact omission
     * happened in this file, in the same session, and the reason both gates below
     * now exist. The first cut died at boot (top-level call). This one did NOT: the
     * reference sits inside a handler, so the shell booted perfectly and the theme
     * push was the only thing that broke — which the boot gate cannot see and only
     * the END-TO-END push pin caught. Two different symptoms, one root cause. */
    applyPushedTheme,
    openRevokeRequestFlow,   // ★ #562: the HIDE-request words — ONE surface with the chats-list flow
  } = window.Spixi;

  /* —— W5 chat pattern STYLE (Damir 2026-08-12) ——————————————————————————————
   * The STYLE was resolved pre-paint (data-chat-pattern on <html>, head script);
   * the two TILE styles need nothing more — chat-pattern.css has already painted
   * them from the inherited custom properties. Only "Live flow" needs code, and
   * only once the bundle has parsed. Fail-soft ladder: no 2d context → fall the
   * root attribute back to 'lineart', so a canvas-less WebView gets the doodle
   * tile instead of a bare gradient. */
  const chatCanvasEl = document.querySelector('.c-chat-canvas');
  function syncFlowIfActive() {
    if (chatCanvasEl && typeof syncChatFlow === 'function') syncChatFlow(chatCanvasEl);
  }
  function applyChatPatternStyle() {
    if (!chatCanvasEl) return;
    const flow = document.documentElement.getAttribute('data-chat-pattern') === 'flow';
    if (!flow) { if (typeof detachChatFlow === 'function') detachChatFlow(chatCanvasEl); return; }
    if (typeof attachChatFlow !== 'function' || !attachChatFlow(chatCanvasEl)) {
      document.documentElement.setAttribute('data-chat-pattern', 'triangles');
    }
  }
  applyChatPatternStyle();

  /* —— W5 F5 (Damir 2026-08-13): a pattern pick must reach chats ALREADY OPEN ——
   * "works, just it always need to reload chat to see changes, it doesnt auto
   * apply to active chats." Both prefs were resolved ONCE, in the pre-paint head
   * script, so an open chat kept its boot pattern until the WebView reloaded.
   * The Account screen and the chat are separate WebViews over ONE file://
   * localStorage origin, which is exactly the spixi.backup.last problem — so
   * this reuses that grammar verbatim (settings.html, #314) rather than adding a
   * bridge verb: storage event + focus fallback + visibilitychange + a
   * visibility-guarded 2s poll, because WKWebView fires no cross-WebView storage
   * event and a COVERED WebView still reports itself visible and focused.
   * Everything is gated on an ACTUAL change of the stored pair, so the poll is a
   * no-op read in the steady state and never repaints under a live chat.
   *
   * The re-resolve is the SAME ladder as the head script (platform-aware default,
   * clamp, desktop-only Live flow, the legacy-alpha migration), then
   * applyChatPatternStyle() mounts or detaches the canvas. Tile-vs-canvas can
   * never double-paint: chat-pattern.css sets --chat-pattern-tile:none under
   * [data-chat-pattern='flow'] (::before display:none) and every non-flow style
   * detaches the canvas first. */
  const PATTERN_PREF_KEYS = { level: 'spixi.chat.pattern', style: 'spixi.chat.patternstyle' };
  function readPatternPrefs() {
    const de = document.documentElement.hasAttribute('data-desktop');
    let p = NaN, s = '';
    try {
      p = parseFloat(localStorage.getItem(PATTERN_PREF_KEYS.level));
      s = localStorage.getItem(PATTERN_PREF_KEYS.style) || '';
    } catch (e) { /* DomStorageEnabled=false → boot defaults, forever */ }
    // ★ N81 (#422): p is a LEVEL INDEX now. readPatternLevel migrates the legacy
    // fractional alphas (0.3/0.5/0.7) and clamps; B2 (#256) platform-aware default
    // survives unchanged — desktop Off, mobile Default.
    p = readPatternLevel(p, de ? 0 : 1);
    if (s === 'flow' && !de) s = 'triangles';    // Live flow is desktop-only (battery)
    // ★ 2026-08-22: unknown/absent → TRIANGLES, the new default (was line art).
    if (s !== 'lineart' && s !== 'matrix' && s !== 'flow' && s !== 'triangles') s = 'triangles';
    return { level: p, style: s };
  }
  function applyPatternPrefs(prefs) {
    const r = document.documentElement;
    /* ★ N81 (#422): NO theme derivation here any more. This function used to read
     * data-theme and multiply the stored value by 0.36 for dark — the same
     * derivation the head script and settings.html each carried their own copy of,
     * three places that had to agree. The level is an index now and the alpha comes
     * from --chat-pattern-alpha-N, which CSS resolves under whatever theme is
     * current at paint time. The setTheme hook still calls this (the flow canvas
     * genuinely does need a repaint), but it can no longer paint the wrong number. */
    r.style.setProperty('--chat-pattern-opacity', patternLevelVar(prefs.level));
    r.setAttribute('data-chat-pattern', prefs.style);
    applyChatPatternStyle();     // mount / detach the flow canvas for the new style
    syncFlowIfActive();          // …and repaint it now (reduced motion = no loop to self-heal)
  }
  const patternStamp = (p) => p.level + '|' + p.style;
  let seenPatternPrefs = patternStamp(readPatternPrefs());
  function refreshPatternPrefsIfChanged() {
    const prefs = readPatternPrefs();
    const stamp = patternStamp(prefs);
    if (stamp === seenPatternPrefs) return;
    seenPatternPrefs = stamp;
    applyPatternPrefs(prefs);
  }
  window.addEventListener('storage', (e) => {
    if (!e.key || e.key === PATTERN_PREF_KEYS.level || e.key === PATTERN_PREF_KEYS.style) refreshPatternPrefsIfChanged();
  });
  window.addEventListener('focus', refreshPatternPrefsIfChanged);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshPatternPrefsIfChanged();
  });
  setInterval(() => { if (!document.hidden) refreshPatternPrefsIfChanged(); }, 2000);

  /* #211 address-display canon: the visible chat title is the nick, or the address
   * MIDDLE-TRUNCATED (6…6) when there's no nick (or the "nick" is really the address
   * echoed back). Full address lives only in Contact details + payments. */
  function identityTitle() {
    const nick = identity.name || '';
    if (nick && nick !== identity.address) return nick;
    return identity.address ? truncateAddressMiddle(identity.address) : (nick || '');
  }

  // Boot theme: honor the user's chosen appearance (persisted to localStorage by
  // the Account screen — same Resources/Raw/html origin) so a light/dark pick
  // propagates to every shell; fall back to the OS scheme when 'auto'/unset.
  (function () {
    // The head-top boot script already resolved the theme (C#-substituted theme
    // name when running in the app — see ThemeManager.loadTheme — else
    // localStorage / OS scheme). Only re-derive here if it somehow didn't run.
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  /* —— bridge transport ———————————————————————————————————————————————————— */
  const bridge = createNativeBridge();          // default sink: location.href = 'ixian:…'
  /* #343: ONE call lights up press feedback for every pressable surface in this
     shell (src/components/pressable.js). Delegated on document, so rows created
     later by a re-render are covered without re-attaching. A new shell needs
     exactly this line. */
  attachPressFeedback();
  installExecuteUiCommand();                     // defines window.executeUiCommand for C#

  const dbg = (...a) => { try { console.debug('[chat-shell stub]', ...a); } catch (_) {} };
  const asBool = (v) => v === 'True' || v === 'true' || v === true;
  /* legacy sends Unix SECONDS; redesigned bubbles compare against Date.now() (ms) */
  const toMs = (t) => { let n = Number(t) || 0; if (n && n < 1e12) n *= 1000; return n; };

  /* —— C#-localized string carriers (the hidden #sl-carriers block) ——————————
   * Read once; an UNSUBSTITUTED marker (plain-browser preview) falls back to the
   * en-us string. The marker probe is RUNTIME-ASSEMBLED — a literal unclosed
   * marker in source crashes the C# line parser at boot (#248). */
  function slCarrier(id, fallback) {
    const MARK = '*SL' + '{';   // runtime-assembled, see above
    const el = document.getElementById(id);
    const t = el ? el.textContent.trim() : '';
    return (!t || t.indexOf(MARK) !== -1) ? fallback : t;
  }

  /* Q4: the DIRECT-payment "received" title — the request-vs-payment signal for
   * the signed-amount grammar (component canon: received payments show '+',
   * requests stay bare — src/demo/chat.html states matrix). The request title is
   * carried too, purely as a COLLISION GUARD (audit A-1): if a locale ever
   * translated both keys to the identical string, the sign must NOT fire. */
  const PAY_RECEIVED_TITLE = slCarrier('sl-payment-received', 'Payment Received');
  const PAY_REQUEST_RECEIVED_TITLE = slCarrier('sl-payment-request-received', 'New Payment Request');
  const PAY_REQUEST_SENT_TITLE = slCarrier('sl-payment-request-sent', 'Payment Request Sent');
  const isRequestTitle = (t) => t === PAY_REQUEST_RECEIVED_TITLE || t === PAY_REQUEST_SENT_TITLE;

  /* #264 (Damir nice-to-have ⑤): "{0} has accepted your contact request" arrives
   * as a PLAIN TEXT message (StreamProcessor:337/:354, string.Format over the
   * localized template) — as a chat bubble it reads clumsy, worst when {0} is a
   * bare base58 address. Detect it locale-proof via the template carrier
   * (prefix/suffix around the {0} slot) and render a centered EVENT CHIP instead:
   * same localized sentence, the subject swapped for the nick-or-TRUNCATED-address
   * canon (#211). Fail-soft: no carrier / no {0} → normal bubble. */
  /* ⑪ "Waiting for response" is pushed (updateScreen, PRE-burst) for BOTH pending
   * friend states — it closes the open-to-burst window before the specific
   * signal (showRequestSentModal / showContactRequest) lands. Locale-proof. */
  const WAITING_RESPONSE_TEXT = slCarrier('sl-waiting-response', 'Waiting for response');

  /* W1 (#302) — the presence dot was DEAD in 5 of the 8 shipped locales.
     setOnlineStatus receives a fully-localized string from C# (:1930/1940/1946),
     and the dot was derived from /online/.test(s). "chat-online" is only the word
     "Online" in en-us/de-de/pt-br; es-co "En línea", fr-fr "En ligne", ru-ru
     "В сети", sl-si "Na voljo", sr-sp "Na mreži" all fail that regex, so those
     users never saw a presence dot at all. Same carrier mechanism the payment
     titles already use in this file — locale-proof by construction. */
  const ONLINE_TEXT = slCarrier('sl-online', 'Online');

  /* #434: TWO templates, because the copy changed. The live one is the
     direction-neutral "you are now connected" sentence C# writes from now on; the
     legacy "has accepted your contact request" one is kept so existing histories
     still render as a chip. Matching is longest-prefix-first so a locale in which
     one sentence is a prefix of the other cannot mis-attribute the subject. */
  function tplParts(tpl) {
    const i = tpl.indexOf('{0}');
    return i === -1 ? null : [tpl.slice(0, i), tpl.slice(i + 3)];
  }
  const ACCEPTED_TPL = slCarrier('sl-request-connected', 'You are now connected with {0}.');
  const ACCEPTED_PARTS = tplParts(ACCEPTED_TPL);
  const EVENT_TPLS = [
    ACCEPTED_PARTS,
    tplParts(slCarrier('sl-request-accepted', '{0} has accepted your contact request.')),
  ].filter(Boolean).sort((a, b) => (b[0].length + b[1].length) - (a[0].length + a[1].length));
  /** → { parts, subject } for the template that matched, else null. */
  function acceptedEventMatch(text) {
    const t = String(text || '');
    for (const parts of EVENT_TPLS) {
      const [p, sfx] = parts;
      if (t.length <= p.length + sfx.length) continue;
      if (!t.startsWith(p) || !t.endsWith(sfx)) continue;
      return { parts, subject: t.slice(p.length, t.length - sfx.length) };
    }
    return null;
  }
  function acceptedEventSubject(text) {
    const m = acceptedEventMatch(text);
    return m ? m.subject : null;
  }

  /* M16 (#59): the two connectivity strings C# routes through showWarning
   * (SingleChatPage.xaml.cs:1921/1942). These render as a topbar TITLE-STATE
   * (sub-line swap), NOT a banner; en-us literals double as preview fallbacks
   * and are harmless duplicates when the substitution ran. */
  const CONNECTIVITY_TEXTS = new Set([
    slCarrier('sl-connecting-s2', ''),
    slCarrier('sl-connecting-dlt', ''),
    'Connecting to Ixian S2...',
    'Connecting to Ixian Platform...',
  ]);
  CONNECTIVITY_TEXTS.delete('');
  let connectivitySub = '';   // non-empty while C# reports connecting → overrides the presence sub

  /* —— chat mode (setChatMode type: 0 = 1:1, 1 = group, 2 = blind group,
   *    3 = bot — chat.js setChatMode / xaml.cs:526,549). We keep it so the
   *    header + grouping know whether to show sender labels/avatars. ————————— */
  /* ★★ ONE FIELD ANSWERS "IS THE ROOM TYPE KNOWN, AND FOR WHOM" (round 3).
     `answeredFor` is the peer address the CURRENT room answer describes. `null` means
     no answer has arrived. Round 2 held the same fact in TWO fields, `owner` and
     `known`, and each of them was a separate line that one deletion could remove
     (surviving mutation Y1). One fact, one field, one writer.
     `hidesAddresses` is declared here so the unknown-room answer is explicit and not
     an undefined read. `answeredFor` stays LAST — a pin names the tail of this literal. */
  const mode = { type: 0, isBot: false, isMulti: false, blind: false, blindKnown: true, admin: false, notifications: true, costText: '', description: '', hidesAddresses: false, answeredFor: null };

  /* ★★ THE ROOM-ANSWER LATCH AND ITS ONE WAKE-UP (#46 loop; round 3).
   * `mode` above starts at its 1:1 DEFAULTS. C# sends setChatMode for every room.
   * For a 1:1 room C# sends it SYNCHRONOUSLY, in the onLoad burst
   * (SingleChatPage.xaml.cs:804). For a group or a bot room C# sends it from inside a
   * Task.Run, after a wait loop (SingleChatPage.xaml.cs:730-771). So the first frames
   * of a group or a bot room read as a 1:1, and every gate that reads `mode` answers
   * for the wrong room.
   *
   * ★★ WHAT A ROOM OF UNKNOWN TYPE MAY OFFER: NOTHING. Read the four gates in
   * `attachFlags()`. `apps` needs "not a bot". `payments` needs "a 1:1". `files` needs
   * "not a bot and not a blind group". No tile survives every room type, so the
   * intersection over the four room types is EMPTY. An unknown room therefore offers no
   * tile, and the ⊕ that opens the tiles stays away. `attachFlags()` reads `modeKnown()`
   * for that reason. It is the ONE predicate. `openAttach`, the sheet's own action gate,
   * `openSendTakeover`, `openRequestForPeer` and `openAppPicker` all read that one
   * object. A round-1 belt granted the 1:1 DEFAULTS on a timer instead, and a bot room
   * then offered Pay, Request, App invite and Send file. C# refuses all four.
   *
   * ★ THE TIMEOUT IS PROOF, NOT PERMISSION. C# pushes the 1:1 setChatMode on the UI
   * thread, in the same burst as onChatScreenReady. So a room that has sent no
   * setChatMode after the wait is NOT a 1:1. Accepting the 1:1 defaults is the one
   * answer that the timeout rules out.
   *
   * ★ SO WHAT DOES THE WAIT WINDOW DO? It bounds the composer LAYOUT. It does not open
   * a gate. While the shell waits, the ⊕ keeps its place in the composer row and stays
   * invisible. The text field does not grow and then shrink under a typing finger. When
   * the window closes the shell stops holding space for a control that may never
   * arrive, and the ⊕ collapses. A latch with no time bound is a permanent latch
   * (#647③). This window is that time bound, and it cannot grant a capability.
   *
   * ★★★ THE WINDOW IS A CLOCK READING, NOT A STORED TIMESTAMP (round 3, surviving
   * mutations Y7 and Y8). Round 2 stamped `waitStart` and `waitPeer` inside the derive
   * function. Deleting that stamp, or setting it to 0, made the whole `wait` phase
   * unreachable and nothing went red. `performance.now()` counts milliseconds from THIS
   * document's time origin, and C# builds a NEW SingleChatPage — and therefore a new
   * document — for every chat it opens (HomePage.xaml.cs:2043). So the document's own
   * age IS this peer's wait window. There is no variable to stamp, no per-peer reset to
   * delete, and no writer to forget.
   * ★ It also closes review QUESTION-2: `performance.now()` is MONOTONIC, so an NTP
   * step backwards cannot leave the ⊕ parked in `wait`. `Date.now()` could.
   * ⚠ If a desktop reparent ever hands ONE document to a SECOND peer, that peer's
   * window is already closed and the ⊕ collapses until its setChatMode lands. That
   * direction is safe: it offers nothing. Do not "fix" it by re-stamping a variable.
   *
   * ⚠ MODE_WAIT_MS is compared against a FLOOR, not a ceiling. The C# wait is 50 sleeps
   * of 100 ms and has no upper bound. That is safe, because the window only releases
   * layout space. Do NOT restore a timer that opens a gate. */
  const MODE_WAIT_MS = 6000;
  /* The room type is known only when setChatMode answered for THIS peer. */
  function modeKnown() { return mode.answeredFor !== null && mode.answeredFor === identity.address; }
  /* True while this document is still inside its wait window. Pure: it reads a clock
     and a constant, and it writes nothing. */
  function modeWaitOpen() { return performance.now() < MODE_WAIT_MS; }

  /* —— header identity model. setNickname / setOnlineStatus mutate this; the
   *    topbar is rebuilt so name + presence sub-line stay live. ——————————————— */
  const identity = { name: '', sub: '', address: '', online: false, avatar: null };

  /* A3 (#302): "unread messages exist in other chats". Shell-scope, applied inside
   * renderTopbarNow — the topbar is fully rebuilt on six triggers. */
  let unreadElsewhere = false;

  /** Resolve a C# avatar arg to an <img> src, or null for the gradient fallback
   *  (same rule as the home shell): real on-disk path → src (normalize
   *  backslashes); the C# default placeholders → null = deterministic gradient.
   *  The avatar component has an onerror→gradient fallback, so a non-resolving
   *  path degrades cleanly. */
  function resolveAvatar(path) {
    if (!path) return null;
    const p = String(path).replace(/\\/g, '/');
    if (p === 'img/spixiavatar.png' || p === 'img/spixi-group-avatar.png') return null;
    return p;
  }
  let callVisible = false;   // showCallButton reveals the topbar phone action (1:1, peer reachable)

  // Bot channel selector state — declared BEFORE the topbar renderer because the
  // channel-as-title (Option A) reads channelState during the first synchronous
  // paint (see the bot-channel bridge-protocol note further down).
  const channelState = { has: false, index: 0, name: '', icon: '', unread: false };
  let channelList = [];               // accumulated per open, from addChannelToSelector
  let channelDropdown = null;         // top-anchored selector overlay (open = non-null)
  let channelSheetBody = null;        // the live channel list inside the panel
  let channelKeydown = null;          // Esc + Tab-trap handler while the dropdown is open
  let channelFocusin = null;          // focus containment while the dropdown is open
  let channelReturnFocus = null;      // element to restore focus to on close (the title trigger)
  let focusTitleAfterRender = false;  // row-select rebuilds the topbar → focus the new title (review MINOR-2)

  const topbarHost = document.getElementById('chat-topbar');
  /* ONE composition for the topbar sub-line — used by the full rebuild AND the
   * M16 in-place connectivity swap (drift here = two different subs on screen).
   * M16 (#59): while C# reports connecting, the connectivity text REPLACES the
   * presence sub (WhatsApp/Telegram grammar); presence returns when it clears. */
  function topbarSubText(botChannels) {
    return connectivitySub || (botChannels
      ? [identityTitle(), identity.sub || ''].filter(Boolean).join(' · ')
      : (identity.sub || ''));
  }
  function renderTopbarNow() {
    /* Multi-select: the contextual selection bar is mounted INSIDE this slot (it
     * covers the topbar). The wipe below would destroy it, and the topbar is
     * rebuilt on six triggers — a presence tick mid-selection would silently drop
     * the bar and strand the user in selection mode with no way out. Detach it,
     * then put it back (listeners live on its own children, so they survive). */
    const keepSelectBar = topbarHost.querySelector('.c-chatselect-bar');
    topbarHost.textContent = '';
    if (keepSelectBar) topbarHost.append(keepSelectBar);
    const s = window.SL || {};
    // Bot channel mode (Option A): once C# has named a channel, the topbar TITLE
    // becomes the current channel name + chevron and opens the channel selector;
    // a trailing ⓘ opens the chat-info takeover. Otherwise the identity block
    // behaves as before (group/blind → chat-info takeover; 1:1 → ContactDetails).
    const botChannels = mode.isBot && channelState.has;

    // #248/#249: ALL chat info lives on the SHELL side now (the ContactDetails
    // group/bot/contact surface) — same desktop pane / takeover behavior for
    // every kind, C#-mediated (ixian:details). #249 (Damir r3): bots included —
    // the in-chat takeover overtook the conversation instead of paning. The
    // channel SELECTOR stays in-convo (title tap, botChannels mode). The
    // conversation wall (#221) is untouched — only a verb is emitted.
    // (openChatInfo/buildChatInfo remain for a possible channel-scoped info
    // surface — currently unreferenced by the topbar.)
    const infoTap = () => bridge.send('ixian:details');

    const actions = [];
    // start a voice call — revealed by showCallButton (C# gates availability);
    // ixian:call toggles initiate/hang-up (xaml:136).
    // key is callAction, NOT `call` — the dict's `call` is the history-bubble
    // label 'Voice call' (A4 sweep: one key, one English — conflict gate).
    if (callVisible) actions.push({ icon: 'phone', label: s.callAction || 'Call', onClick: () => bridge.send('ixian:call') });
    // #248 (Damir): an EXPLICIT info affordance on EVERY chat — the bare header
    // tap wasn't discoverable. Bot-channel mode already had it (its title became
    // the channel selector); now 1:1 + groups + plain bots get it too.
    actions.push({
      icon: 'info-circle',
      label: mode.isMulti && !mode.isBot ? (s.groupInfo || 'Group info') : (s.chatInfo || 'Chat info'),
      onClick: infoTap,
    });

    const tb = createTopbar({
      variant: 'chat',
      identity: {
        // channel-as-title: the channel name is the header label in bot mode; the
        // bot name/address drops to the sub-line so the identity stays visible.
        // #211: a nameless identity shows its address MIDDLE-TRUNCATED, never in full.
        name: botChannels ? ('# ' + (channelState.name || '')) : identityTitle(),
        sub: topbarSubText(botChannels),   // M16 connectivity override lives inside
        address: identity.address || identity.name || '',
        online: botChannels ? false : identity.online,
        avatar: identity.avatar || null,
        // N1 (#364): group/bot chats wear the group-glyph avatar. setChatMode
        // triggers renderTopbar, so the glyph lands with the mode push.
        group: !!mode.isMulti,
      },
      // Header tap. bot channels → open the channel selector (title = affordance).
      // #248: everything else routes like the info icon — 1:1 AND groups go to the
      // shell-side surface (ixian:details); plain bots keep the in-chat takeover.
      onIdentity: botChannels ? () => openChannelSelector() : infoTap,
      onBack: () => bridge.send('ixian:back'),
      /* A3 (#302): the unread-elsewhere state has to ride the BACK LABEL, not a
         nested badge element. createButton puts backLabel on the button's
         aria-label (button.js:43), and an aria-label overrides nested content —
         a badge <span> inside would be announced to nobody. Count-free wording
         deliberately: see the dot rationale at setUnreadIndicator. */
      backLabel: (s.back || 'Back') + (unreadElsewhere ? ', ' + (s.unreadElsewhere || 'Unread messages') : ''),
      actions,
    });

    // Inject the chevron (and an any-channel-unread dot) into the title so the
    // channel-as-title reads as a dropdown affordance. Done here (not in the
    // shared c-topbar component) to keep the component generic.
    if (botChannels) {
      tb.classList.add('is-bot-channels');
      const nameEl = tb.querySelector('.c-topbar__name');
      if (nameEl && window.SpixiIcons && window.SpixiIcons.icon) {
        if (channelState.unread) {
          const dot = document.createElement('span');
          dot.className = 'chat-channel-unread-dot';
          dot.setAttribute('aria-hidden', 'true');
          nameEl.append(dot);
        }
        const chev = window.SpixiIcons.icon('chevron-down', { size: 18 });
        chev.classList.add('chat-channel-chev');
        nameEl.append(chev);
      }
    }
    // Avatar flash guard (Damir F5): the synchronous first paint runs BEFORE C# pushes
    // onChatScreenReady/setAvatar, so identity has no address yet and createAvatar would
    // paint a default gradient that then swaps to the real avatar. Hide the avatar until
    // the identity lands (address known) — the slot reserves space, then the real avatar
    // (or the correct address-gradient) appears once, with no wrong-colour flash.
    if (!identity.address) tb.classList.add('is-avatar-pending');
    /* ★ N19 (#428): the connecting line rides the BAR, and this rebuild happens on
       six triggers (setNickname, setOnlineStatus, setAvatar, setChatMode, channel
       select, the rAF coalescer). Applied HERE, from state, for the same reason the
       unread dot below is: a one-shot poke from the showWarning handler would
       evaporate on the next presence tick — the #188 typing-pill lesson. */
    if (connectivitySub) tb.setAttribute('data-connecting-bar', '');
    /* A3 (#302): unread-elsewhere dot on the back button. Applied HERE, inside the
       render, because renderTopbarNow rebuilds the whole topbar (textContent=''
       at :582) on six different triggers — setNickname, setOnlineStatus, setAvatar,
       setChatMode, channel select and the rAF coalescer — so a one-shot DOM poke
       from the handler would evaporate on the next one.
       Mobile/single-pane only: on desktop the chats list is visible beside the
       conversation and already carries the unread state. */
    if (unreadElsewhere && !document.documentElement.hasAttribute('data-desktop')) {
      const backBtn = tb.querySelector('.c-button');
      if (backBtn) backBtn.dataset.unreadDot = '';
    }
    topbarHost.append(tb);
    // channel row-select coalesces a topbar rebuild; land focus on the NEW title
    // (the old trigger is detached by textContent='' above → would drop to body).
    if (focusTitleAfterRender && botChannels) {
      focusTitleAfterRender = false;
      const wrap = tb.querySelector('.c-topbar__identity-wrap');
      if (wrap) wrap.focus({ preventScroll: true });
    }
  }
  // Coalesce topbar rebuilds too: on open C# fires setNickname + setOnlineStatus
  // (+ onChatScreenReady) in quick succession, each tearing down + rebuilding the
  // header — same flicker class as the log. Batch to one frame.
  let topbarQueued = false;
  function renderTopbar() {
    if (topbarQueued) return;
    topbarQueued = true;
    requestAnimationFrame(() => { topbarQueued = false; renderTopbarNow(); });
  }
  renderTopbarNow();  // synchronous first paint

  /* connectivity banner (#59) — mounts directly under the top bar; showWarning
   * opens/updates it, empty text collapses it (bridge showWarning, xaml:1746). */
  const warningBanner = createWarningBanner({ strings: window.SL || {} });
  topbarHost.after(warningBanner);

  /* —— bot channel selector (Damir F5 2026-07-08: bot chats support channels) ——
   * Bots (mode.type 3) can host multiple channels. C# drives it (legacy chat.js):
   *   setSelectedChannel(index, icon, name)          → current channel; reveals the
   *                                                     bar (chat.js:250)
   *   addChannelToSelector(index, name, icon, unread) → one channel row, pushed
   *       ONLY in response to ixian:populateChannelSelector (pull-on-open,
   *       chat.js:1338/1353) — so the list is empty until the bar is tapped
   *   setChannelSelectorStatus(status)               → any-channel-unread flag
   *       ("true" = all read, else unread — chat.js:1345)
   * Tapping a row emits ixian:selectChannel:<index> (chat.js:1319; C# switches +
   * reloads the messages + echoes setSelectedChannel). The selector shows ONLY for
   * bots, once C# has named a channel — non-bot chats are untouched. State is
   * declared above (needed by the first topbar paint). */
  function makeChannelRow(ch) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chat-channel-list__item';
    if (ch.index === channelState.index) b.dataset.selected = '';
    const name = document.createElement('span');
    name.className = 'chat-channel-list__name';
    name.textContent = '# ' + (ch.name || '');
    b.append(name);
    if (ch.unread) {
      const dot = document.createElement('span');
      dot.className = 'chat-channel-list__unread';
      dot.setAttribute('aria-hidden', 'true');
      b.append(dot);
    }
    b.addEventListener('click', () => {
      // optimistic selection; C# echoes setSelectedChannel + reloads the messages
      channelState.index = ch.index;
      channelState.name = ch.name;
      channelState.icon = ch.icon || channelState.icon;
      channelState.unread = false;
      focusTitleAfterRender = true;   // land focus on the rebuilt title (review MINOR-2)
      renderTopbar();                 // channel name lives in the title now
      bridge.send('ixian:selectChannel:' + ch.index);
      closeChannelSelector();
    });
    return b;
  }

  /* Channel selector — a top-anchored panel that slides DOWN from directly under
   * the topbar (Option A, Damir F5 2026-07-08). Opened by tapping the topbar
   * title; NOT a bottom sheet. Scrim + Esc close it. */
  /* focusables inside the open dropdown panel (rows arrive async) — mirrors overlay.js */
  function channelFocusables() {
    if (!channelDropdown) return [];
    const p = channelDropdown.querySelector('.chat-channel-panel');
    if (!p) return [];
    return [...p.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => !el.disabled && !el.hidden);
  }

  function closeChannelSelector() {
    if (channelKeydown) { document.removeEventListener('keydown', channelKeydown); channelKeydown = null; }
    if (channelFocusin) { document.removeEventListener('focusin', channelFocusin); channelFocusin = null; }
    if (!channelDropdown) return;
    const el = channelDropdown;
    channelDropdown = null;
    channelSheetBody = null;
    syncChatOverlay();   // N51: the selector is NOT on the shared stack — mirror its close to C#
    // restore focus to the title trigger — only if focus is ours to move (still
    // inside the closing overlay or dropped to body), matching overlay.js policy.
    const rf = channelReturnFocus; channelReturnFocus = null;
    const active = document.activeElement;
    if (rf && rf.isConnected && typeof rf.focus === 'function' &&
        (el.contains(active) || active === document.body)) {
      rf.focus({ preventScroll: true });
    }
    el.classList.remove('is-open');
    el.style.pointerEvents = 'none';   // exiting overlay: stale scrim must not catch clicks (review NIT)
    // let the slide-up finish before detaching (reduced-motion → transition:none,
    // transitionend still fires); safety timer covers the no-transition case
    let removed = false;
    const done = () => { if (removed) return; removed = true; el.remove(); };
    el.querySelector('.chat-channel-panel').addEventListener('transitionend', done, { once: true });
    setTimeout(done, 260);
  }

  function openChannelSelector() {
    if (!mode.isBot) return;
    // Q9: title tap TOGGLES — a second tap while the selector is open closes it
    // (was: tore down + immediately re-opened, re-firing populateChannelSelector).
    // closeChannelSelector() runs its normal focus-restore path (#205): with the
    // pointer tap having landed focus on the title trigger the restore is a no-op
    // by policy; a trapped-focus (keyboard) close restores to the stored trigger.
    if (channelDropdown) { closeChannelSelector(); return; }
    channelReturnFocus = document.activeElement;   // the topbar title trigger
    const s = window.SL || {};
    channelList = [];

    const overlay = document.createElement('div');
    overlay.className = 'chat-channel-overlay';
    const scrim = document.createElement('div');
    scrim.className = 'chat-channel-overlay__scrim';
    scrim.addEventListener('click', closeChannelSelector);

    const panel = document.createElement('div');
    panel.className = 'chat-channel-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('tabindex', '-1');
    panel.setAttribute('aria-label', s.channels || 'Channels');
    // anchor the panel directly under the topbar (+ any connectivity banner)
    panel.style.top = (topbarHost.offsetHeight + (warningBanner.offsetHeight || 0)) + 'px';

    const title = document.createElement('div');
    title.className = 'chat-channel-panel__title';
    title.textContent = s.channels || 'Channels';
    panel.append(title);

    /* A6 (#302): the bot/server description, on the one bot-owned surface this
       shell owns (#97/#252 Q9). Read from stored mode state, not from the push
       moment — this panel is torn down and rebuilt on every open, so the value has
       to survive. textContent (never innerHTML): the string is authored by a REMOTE
       bot server. Already clamped in setChatMode; -webkit-line-clamp caps the
       visual height so a long one can't blow the panel. */
    if (mode.description) {
      const desc = document.createElement('p');
      desc.className = 'chat-channel-panel__desc t-body-sm';
      desc.textContent = mode.description;
      panel.append(desc);
    }

    channelSheetBody = document.createElement('div');
    channelSheetBody.className = 'chat-channel-list';
    const empty = document.createElement('p');
    empty.className = 'chat-channel-list__empty';
    empty.textContent = s.loading || 'Loading';   // fallback = the dict value (A4 conflict gate)
    channelSheetBody.append(empty);
    panel.append(channelSheetBody);

    overlay.append(scrim, panel);
    document.body.append(overlay);
    channelDropdown = overlay;
    syncChatOverlay();   // N51: the selector is NOT on the shared stack — mirror its open to C#
    // Esc closes; Tab is trapped within the panel (mirrors overlay.js house style).
    channelKeydown = (e) => {
      if (e.key === 'Escape') { closeChannelSelector(); return; }
      if (e.key !== 'Tab' || !channelDropdown) return;
      const f = channelFocusables();
      if (f.length === 0) { e.preventDefault(); panel.focus({ preventScroll: true }); return; }
      const first = f[0], last = f[f.length - 1], act = document.activeElement;
      if (!f.includes(act)) { e.preventDefault(); (e.shiftKey ? last : first).focus({ preventScroll: true }); }
      else if (e.shiftKey && act === first) { e.preventDefault(); last.focus({ preventScroll: true }); }
      else if (!e.shiftKey && act === last) { e.preventDefault(); first.focus({ preventScroll: true }); }
    };
    document.addEventListener('keydown', channelKeydown);
    // anything focused outside the open dropdown bounces back in (overlay.js parity)
    channelFocusin = (e) => {
      if (!channelDropdown || channelDropdown.contains(e.target)) return;
      (channelFocusables()[0] || panel).focus({ preventScroll: true });
    };
    document.addEventListener('focusin', channelFocusin);
    // trigger the slide-down on the next frame (so the -100% start state paints)
    requestAnimationFrame(() => { if (channelDropdown === overlay) overlay.classList.add('is-open'); });
    // move focus into the panel now (list is still loading → the panel itself)
    panel.focus({ preventScroll: true });

    // pull the list — C# answers with addChannelToSelector per channel
    bridge.send('ixian:populateChannelSelector');
  }

  /* —— message log —————————————————————————————————————————————————————————— */
  const box = document.getElementById('messages');

  /* —— pinch = TEXT size, not page zoom (Damir 2026-07-29) ————————————————————
   * The intent was always "pinch to enlarge the chat text", the same knob as
   * Account -> Chat appearance. What shipped was the browser's own gesture: with
   * no scale clamp in the viewport meta, WKWebView pinch-zooms the DOCUMENT —
   * a raster zoom that blurs text, scales the topbar and composer off-screen and
   * strands the user until they double-tap back out. The meta clamp above stops
   * that; this maps the gesture onto --chat-text-scale instead.
   *
   * Same variable, same clamp and same storage key the Chat-appearance screen
   * writes (TEXT_SIZES spans 0.9..1.25; the boot script clamps 0.8..1.5), so a
   * pinch and the settings picker are two controls over ONE preference and
   * survive a reopen identically.
   *
   * Touch events, not the WebKit-only gesture* events: those don't fire once the
   * viewport is scale-clamped. Non-passive so the 2-finger move can preventDefault
   * (otherwise the log scroll-pans under the pinch). Single-finger scrolling is
   * untouched — we bail unless exactly two touches are down. */
  const TEXT_SCALE_MIN = 0.8, TEXT_SCALE_MAX = 1.5;
  function readTextScale() {
    const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chat-text-scale'));
    return isNaN(v) ? 1 : v;
  }
  function applyTextScale(v) {
    const c = Math.min(TEXT_SCALE_MAX, Math.max(TEXT_SCALE_MIN, v));
    document.documentElement.style.setProperty('--chat-text-scale', String(c));
    return c;
  }
  (function attachPinchTextScale() {
    let pinching = false, startDist = 0, startScale = 1, liveScale = 1;
    const dist = (t) => {
      const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.hypot(dx, dy);
    };
    box.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 2) { pinching = false; return; }
      pinching = true;
      startDist = dist(e.touches);
      startScale = liveScale = readTextScale();
    }, { passive: true });
    box.addEventListener('touchmove', (e) => {
      if (!pinching || e.touches.length !== 2 || !startDist) return;
      e.preventDefault();                       // the log must not pan under the pinch
      liveScale = applyTextScale(startScale * (dist(e.touches) / startDist));
    }, { passive: false });
    const end = (e) => {
      if (!pinching) return;
      if (e.touches && e.touches.length >= 2) return;   // one finger lifted mid-pinch
      pinching = false;
      // persist ONCE at the end, not per frame — this is the same key Chat
      // appearance owns, and a localStorage write per touchmove is a jank source.
      if (Math.abs(liveScale - startScale) > 0.001) {
        try { localStorage.setItem('spixi.chat.textscale', String(liveScale)); } catch (err) {}
      }
    };
    box.addEventListener('touchend', end, { passive: true });
    box.addEventListener('touchcancel', end, { passive: true });
  })();

  /* model: id → record, in insertion order. A record is one of:
   *   kind 'text'    → { id, kind, direction, text, ts(ms), status, senderNick, senderAddress }
   *   kind 'file'    → { id, kind, direction, ts(ms), fileid, name, meta, fstate,
   *                      progress, senderNick, senderAddress }
   *   kind 'payment' → { id, kind, direction, ts(ms), title, amount, pstatus,
   *                      txid, enableView, senderNick, senderAddress }  (view-only)
   *   kind 'call'    → { id, kind, ts(ms), missed, label, duration }    (view-only)
   * order[] holds ids in timestamp order so inserts find their slot (the legacy
   * findOlderChat behaviour). row: id → DOM row element. fileIndex maps a
   * transfer's fileid → the owning message id, because updateFile(fileid,…)
   * references the transfer, not the message row (chat.js:1009). */
  const model = new Map();   // id → record
  const rows = new Map();    // id → row element
  let order = [];            // ids, kept timestamp-ascending
  const fileIndex = new Map(); // fileid → message id
  const txIndex = new Map();   // txid → message id (updateTransactionStatus keys by txid)
  const groupNicks = new Map(); // group sender address → resolved nick (updateGroupChatNicks)
  const groupRoster = new Map(); // roster key → { address, name, avatar } from ixian:loadContacts (full participant list)
  let groupOwner = '';           // #248: owner address (setGroupOwner; '' for blind groups) → "Owner" chip
  /* N34 (#365): ONE owner predicate for the bubble chip + the member sheet.
   * '[Unknown]' guards the ROSTER-push path only (loadContacts masks there);
   * per-message addresses arrive verbatim, so the callers carry the real blind
   * gate (!mode.blind) themselves — this predicate is identity-match only. */
  const isOwnerAddr = (a) => !!(groupOwner && a && a !== '[Unknown]' && a === groupOwner);
  /* D-5/N26 (#366): the relation vocabulary the bridge may push (trailing arg on
   * addThem/addContact). 'pending-in' = an INCOMING request (#371 — badge
   * copy only; same no-button/no-money shape as 'pending'). Anything else —
   * incl. undefined from an old exe — degrades to '' = unknown ('none'). */
  const RELATIONS = new Set(['contact', 'pending', 'pending-in', 'none', 'self']);   // R2 (#371): + incoming-pending
  /* Session latch: after the user taps "Send contact request" in the member
   * sheet, later opens show 'pending' immediately — C#'s relation only refreshes
   * on the next message push. Per-peer reset in onChatScreenReady. */
  const requestedMembers = new Set();

  /* —— @-mention context (premium mentions #210). The bubble highlighter (#7) and
   * the composer picker (#6) share ONE source of member names: roster nicks
   * (loadContacts) + seen-sender nicks (groupNicks) + the 1:1 peer nick. `self`
   * keys = the LOCAL user's nick, which C# does NOT push to the chat today — read
   * from window.SL.SelfNick / SPIXI_ENV.selfNick when a trivial push lands
   * (be-cutover) so self-mention emphasis + the jump-to-me FAB (#8) light up; empty
   * until then (highlight-all + picker work regardless). Memoized; invalidated when
   * the name sources change. */
  let _mentionObj = null;
  let selfNickPushed = '';   // C13: the LOCAL user's nick, delivered by the setSelfNick bridge push
  function selfMentionKeys() {
    const sl = window.SL || {}, env = window.SPIXI_ENV || {};
    const out = [];
    if (selfNickPushed) out.push(selfNickPushed);       // C13 primary source (native bridge)
    if (sl.SelfNick) out.push(String(sl.SelfNick));     // demo/injection fallback
    if (env.selfNick) out.push(String(env.selfNick));
    return out;
  }
  function mentionNameList() {
    const set = new Set();
    for (const [, m] of groupRoster) { if (m && m.name) set.add(m.name); }
    for (const [, n] of groupNicks) { if (n) set.add(n); }
    for (const rec of model.values()) { if (rec && senderHasNick(rec)) set.add(rec.senderNick); }  // seen senders (addThem; the ONE nick predicate — r2 F-2)
    if (!mode.isMulti && identity.name) set.add(identity.name);   // 1:1 peer nick
    for (const s of selfMentionKeys()) set.add(s);                // my own nick is a valid @target too
    return [...set];
  }
  function mentionCtx() {
    if (!_mentionObj) _mentionObj = { names: mentionNameList(), self: selfMentionKeys() };
    return _mentionObj;
  }
  function invalidateMentions() { _mentionObj = null; }
  /* Members for the composer @-picker (#6): group/bot only (1:1 → []). Dedupe by
   * name. Sources: roster (loadContacts, has avatars) + resolved nicks (groupNicks)
   * + SEEN SENDERS from the loaded messages (model) — the last is essential so the
   * picker works on a chat you just opened, BEFORE chat-info/loadContacts has run
   * (Damir F5 2026-07-09: "@ in composer does nothing"). */
  function mentionMembers() {
    if (!mode.isMulti) return [];
    const by = new Map();
    for (const [, m] of groupRoster) { if (m && m.name && !by.has(m.name)) by.set(m.name, { name: m.name, address: m.address || '', avatar: m.avatar || null }); }
    for (const [addr, n] of groupNicks) { if (n && !by.has(n)) by.set(n, { name: n, address: addr || '', avatar: null }); }
    for (const rec of model.values()) {                       // seen senders (addThem) — before any roster load
      const nm = rec && senderHasNick(rec) ? rec.senderNick : '';   // the ONE nick predicate (r2 F-2)
      if (nm && !by.has(nm)) by.set(nm, { name: nm, address: rec.senderAddress || '', avatar: rec.avatar || null });
    }
    return [...by.values()];
  }
  // msg-ids I've liked THIS session. The bridge's addReactions sends only
  // key:count (no per-user flag — C5), so a fresh reaction can't tell the shell
  // that *I* reacted; tracking my own likes locally lets the pill show the
  // selected "you reacted" state immediately (Damir F5). Historical own-state
  // (a like from a previous session, re-pushed on load) still needs the C5 flag.
  const myLikes = new Set();
  let loadedMedia = new Set();   // remote-media URLs the user has loaded (persisted per peer, Damir 2026-07-08)
  // installed multi-user apps pushed by C# loadApps (addApp) — feed the attach
  // → "App invite" picker (legacy parity: legacy showed an app option in the
  // attach bar, picking one emits ixian:app:<id>, chat.js:1250 / onApp xaml:832).
  const chatApps = [];

  // Best-known display nick for a group sender: an explicit nick on the row wins,
  // else the last name resolved via updateGroupChatNicks for that address.
  const resolveNick = (address, nick) =>
    nick || (address && groupNicks.get(String(address))) || '';

  // True when a row has a REAL display nick (not empty, and not just its own
  // address echoed back as the nick) — nameless senders fall through to the
  // truncated + copyable address treatment (Damir F5, 2026-07-07).
  /* Loop r2 F-2 (#373) BELT: an address-SHAPED nick is not a nick. The equality
     guard below cannot fire when the address slot is EMPTY (the Core 0.9.8k
     common case) — if Core ever stores the address string in senderNick on such
     a row, the nick-first ladder would render it in a BLIND room. Same shape
     guard as the roster ingests; a real 30+ base58-only nick degrades to the
     placeholder/address rung — the safe direction. */
  const senderHasNick = (rec) =>
    !!rec.senderNick && rec.senderNick !== rec.senderAddress && !isPseudoAddressNick(rec.senderNick);

  /* typing pill — appended while typing is on, removed on timeout / new message,
   * and always kept LAST (shell duty mirrored from the demo). */
  let typingRow = null;
  let typingTimer = null;
  let typingActive = false;   // peer is currently typing — survives full re-renders
  // re-append after a rebuild: renderLogNow's box.textContent='' detaches the pill,
  // so this must re-add it whenever typing is ACTIVE (audit M3: the old
  // parentNode===box guard could never re-append a just-cleared pill).
  function keepTypingLast() {
    if (typingActive && typingRow) box.append(typingRow);
  }
  function showTyping() {
    if (!typingRow) {
      // #264: in a MULTI chat the pill stays GENERIC ("typing…") — showUserTyping
      // carries no sender, and the old `{ name: identity.name }` would have
      // captioned it with the GROUP's name, misattributing the typist. Sender
      // attribution = a BE arg-append ask (be-cutover C21).
      typingRow = createTypingIndicator({});
    }
    typingActive = true;
    box.append(typingRow);
    // N54: scroll to the pill ONLY when the user is already at the bottom — the
    // unconditional jump yanked the view away from older messages mid-read.
    // The check runs AFTER the append, so the pill's ~40px growth can flip the
    // verdict for a user sitting within 40px of the threshold (loop B-7) — in
    // that band the pill simply appears without the scroll, which is harmless.
    if (nearBottom()) box.scrollTop = box.scrollHeight;
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(hideTyping, 5000);  // legacy showUserTyping auto-hides after 5s
  }
  function hideTyping() {
    typingActive = false;
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    if (typingRow && typingRow.parentNode) typingRow.remove();
  }

  const nearBottom = () => box.scrollTop + box.clientHeight * 1.5 >= box.scrollHeight;

  /* status derivation from the legacy bool flags (chat.js updateMessage / addMe):
   *   errorSending → failed   (highest priority)
   *   read         → read
   *   confirmed    → delivered (peer received; "double check" in legacy)
   *   sent         → sent      (relayed; single check)
   *   else         → sending   (the legacy "default"/clock state) */
  function statusFrom({ sent, confirmed, read, errorSending }) {
    if (asBool(errorSending)) return 'failed';
    if (asBool(read)) return 'read';
    if (asBool(confirmed)) return 'delivered';
    if (asBool(sent)) return 'sent';
    return 'sending';
  }

  /* #63 grouping: consecutive same-direction rows within 90s form a run.
   * Recomputes position (single/first/middle/last) for the whole log — simplest
   * correct approach for an upsert model with out-of-order inserts + deletes.
   * Only TEXT rows group: a typed card (file/…) is always standalone and breaks
   * the run. In group chats a run also breaks when the sender changes, so every
   * participant keeps their own label + avatar. */
  const GROUP_WINDOW = 90000;
  function positionsFor(ids) {
    const pos = {};
    for (let i = 0; i < ids.length; i++) {
      const r = model.get(ids[i]);
      const prev = i > 0 ? model.get(ids[i - 1]) : null;
      const next = i < ids.length - 1 ? model.get(ids[i + 1]) : null;
      // A3: `bid` = the LATER row's id — a bubble run never continues across the
      // unread divider (the boundary row restarts its own group, matching the
      // visual break the divider draws).
      const cont = (a, b, bid) => a && b
        && bid !== unreadBoundaryId
        && !a.eventChip && !b.eventChip   // #264 ⑤: event chips stand alone — never group
        && (a.kind || 'text') === 'text' && (b.kind || 'text') === 'text'
        && a.direction === b.direction
        /* ★ D-19 r2 (#356, loop r1 MAJOR-4): the run key falls back to the NICK.
           Core 0.9.8k stores every bot-room row address-less, so an address-only
           key merged ALL received rows into one run — Bob's message rendered
           under Alice's label (label on 'first' only) with the anonymous row's
           avatar (avatar on 'last'). address || nick keeps named senders apart;
           rows with NEITHER share '' and merge with each other only — they are
           indistinguishable by construction. D-19b (#370): such a run renders
           with NO label on non-blind surfaces (legacy parity) and the
           "Hidden member" placeholder in blind rooms — never a name either way. */
        && (a.senderAddress || a.senderNick || '') === (b.senderAddress || b.senderNick || '')
        && Math.abs(a.ts - b.ts) < GROUP_WINDOW;
      const withPrev = cont(prev, r, ids[i]);
      const withNext = cont(r, next, i < ids.length - 1 ? ids[i + 1] : null);
      pos[ids[i]] = !withPrev && !withNext ? 'single'
        : !withPrev && withNext ? 'first'
        : withPrev && withNext ? 'middle'
        : 'last';
    }
    return pos;
  }

  /* —— M1 reply-to ————————————————————————————————————————————————————————————
   * C# pushes only the TARGET ID (hex) on addMe/addThem; the quote itself is
   * resolved here against the rows this shell already holds. That keeps the push
   * unchanged in size and means the quote can never disagree with the row it
   * points at.
   * ★ FAIL SOFT is the whole contract. The id is peer-controlled on an incoming
   * message and the target may simply be older than the loaded window, so an
   * unknown id renders a GENERIC quote label rather than nothing (which reads as
   * a broken reply) and never a broken node or a throw. */
  function replyKindOf(rec) {
    if (!rec) return null;
    if (rec.kind === 'file') return 'file';
    if (rec.kind === 'payment') return 'payment';
    if (rec.kind === 'app') return 'app';
    if (rec.kind === 'call') return 'call';
    const media = mediaUrlOf(rec.text);
    if (media) return /\.gif(\?|#|$)/i.test(media) ? 'gif' : 'image';
    return null;
  }
  const REPLY_TEXT_MAX = 140;   // the quote is one clamped line; the bubble clamps visually too
  function replyQuoteFor(rec) {
    if (!rec || !rec.replyTo) return null;
    const s2 = window.SL || {};
    const target = model.get(String(rec.replyTo));
    if (!target) {
      // outside the loaded window, or deleted → honest placeholder, no sender, no tap
      return { text: (window.SL && window.SL.replyUnavailable) || 'Original message', sender: '', address: '' };
    }
    const kind = replyKindOf(target);
    const isOwn = target.direction === 'sent';
    const sender = isOwn
      ? (s2.you || 'You')
      : (senderHasNick(target) ? target.senderNick
          : (mode.isMulti && mode.blind ? (s2.hiddenMember || 'Hidden member')
              : (identity.nick || '')));
    let text = '';
    if (!kind) {
      text = String(target.text || '').replace(/\s+/g, ' ').trim();
      if (text.length > REPLY_TEXT_MAX) text = text.slice(0, REPLY_TEXT_MAX - 1) + '…';
    } else if (kind === 'file') {
      text = String(target.name || '');
    }
    return {
      sender,
      address: isOwn ? '' : (target.senderAddress || identity.address || ''),
      text,
      kind,
      thumb: null,   // media originals: the tile is fetched on demand (#82), so no thumb to quote
    };
  }

  /* The composer strip's view of the row you are replying TO (not the same as
     replyQuoteFor, which reads a row's OWN reply target). */
  function replySourceFor(rec) {
    if (!rec || !rec.id) return null;
    const s2 = window.SL || {};
    const kind = replyKindOf(rec);
    const isOwn = rec.direction === 'sent';
    const sender = isOwn ? (s2.you || 'You')
      : (senderHasNick(rec) ? rec.senderNick
          : (mode.isMulti && mode.blind ? (s2.hiddenMember || 'Hidden member')
              : (identity.nick || '')));
    let text = '';
    if (!kind) {
      text = String(rec.text || '').replace(/\s+/g, ' ').trim();
      if (text.length > REPLY_TEXT_MAX) text = text.slice(0, REPLY_TEXT_MAX - 1) + '…';
    } else if (kind === 'file') text = String(rec.name || '');
    return { sender, text, kind };
  }

  /* Shared scroll-to-and-pulse. Extracted from the @-mention FAB so the reply
     quote lands on the SAME behaviour (and the same stale-node re-bind). */
  function jumpToRow(id, onArrive) {
    const first = rows.get(id); if (!first) return false;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    first.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    /* N52: start the pulse when the row is actually VISIBLE, not when the tap
       landed — on a far jump the 1.4s animation is otherwise spent mid-scroll.
       loop B-4: renderLogNow rebuilds rows, so re-bind through the id each frame. */
    const pulseFrom = performance.now();
    (function pulseWhenVisible() {
      const live = rows.get(id);
      if (!live || !live.isConnected) { if (performance.now() - pulseFrom <= 1500) requestAnimationFrame(pulseWhenVisible); return; }
      if (mentionRowVisible(live) || performance.now() - pulseFrom > 1500) {
        live.setAttribute('data-mention-pulse', '');
        live.addEventListener('animationend', () => live.removeAttribute('data-mention-pulse'), { once: true });
        setTimeout(() => { live.removeAttribute('data-mention-pulse'); if (onArrive) onArrive(); }, 1600);
        return;
      }
      requestAnimationFrame(pulseWhenVisible);
    })();
    return true;
  }

  function buildRow(rec, position) {
    if (rec.kind === 'file') return buildFileRow(rec);
    if (rec.kind === 'app') return buildAppRow(rec);
    if (rec.kind === 'payment') return buildPaymentRow(rec);
    if (rec.kind === 'call') return buildCallRow(rec);
    if (rec.eventChip) return buildEventRow(rec);   // #264 ⑤: accepted-request event chip
    // A text message that is JUST a remote image/GIF URL → media tile (Damir
    // 2026-07-07: legacy parity, reopens #82 for remote media). The model stays
    // kind 'text' (menu/reactions still work — attachMessageMenu targets
    // .c-mbubble too), we only swap the RENDER.
    const media = mediaUrlOf(rec.text);
    if (media) return buildMediaRow(rec, media);
    const isSent = rec.direction === 'sent';
    return createMessageBubble({
      direction: isSent ? 'sent' : 'received',
      position,
      text: rec.text || '',
      timestamp: rec.ts,
      status: isSent ? rec.status : null,
      paid: !!rec.paid,             // A2 (#302): message cost IXI (C# transactionId)
      // group/bot chats: show the sender nick, or the raw ADDRESS (middle-truncated
      // + click-to-copy in the component) when there's no nick yet (Damir 2026-07-07).
      // A nameless sender is one with no nick AND one whose "nick" is really its
      // own address (some C# paths pass the address as the nick fallback) — both
      // must render truncated + copyable, not a full untruncated address label.
      /* ★ W8 (#348) review r2 MAJOR — SECURITY. C# does not mask for us here:
         insertMessage sends senderAddress verbatim for `bot || Group` with no
         blindness test, and resolveNick falls back to the address as the nick —
         so senderHasNick guards the echo and the blind arm below never renders
         an address (no title, no copy, no sheet — plain span only).
         ★ D-19b (#370, the #369 AMENDED ladder — supersedes the #356 ladder):
         1. A real nickname ALWAYS wins — in blind rooms too (Damir: "keep
            nicknames visible in blind groups, only addresses are completely
            hidden"). A nick reveals no address; senderHasNick keeps the
            address-echo out of this arm.
         2. Blind + nameless → the "Hidden member" placeholder. NEVER an address.
         3. Non-blind + nameless → the truncated copyable address when the row
            has one (C# now reverse-resolves roster-known nicks, so this arm is
            rare), else NOTHING — legacy parity (#369: no "Hidden member" on any
            non-blind surface; the public Spixi bot room must never render
            masked). Anonymous rows share the '' run key and merge with each
            other only, so an unlabeled run never reads as a named sender's. */
      sender: (!isSent && mode.isMulti)
        ? (senderHasNick(rec) ? rec.senderNick
          : (mode.blind ? ((window.SL || {}).hiddenMember || 'Hidden member')
                        : (rec.senderAddress || null)))
        : null,
      senderIsAddress: (!isSent && mode.isMulti && !mode.blind && !senderHasNick(rec) && !!rec.senderAddress),
      showAvatar: (!isSent && mode.isMulti),
      name: senderHasNick(rec) ? rec.senderNick : '',
      address: rec.senderAddress || '',
      avatar: rec.avatar || null,   // real per-sender photo (C# addThem avatar); gradient fallback

      // #99: in a NON-blind group (type 1) OR a bot chat (type 3), the sender
      // label + avatar open the member sheet — the ONLY way to reach a NAMED
      // sender's full address (nick labels aren't copyable; the address is)
      // (Damir F5 2026-07-08). Blind groups (type 2) hide identities → no tap.
      /* ★ W8 (#348) review MAJOR-5 — SECURITY. `mode.type === 3` admits a BLIND BOT,
         and C# does NOT mask addresses for bots (the [Unknown] substitution in
         loadContacts is `type == Group && hideParticipantAddresses` only, xaml:552-560;
         the per-message push sends senderAddress verbatim for `bot || Group`, :1492).
         So tapping a sender in a blind bot channel opened a sheet showing that
         participant's FULL wallet address — in a chat whose entire purpose is to hide
         it. A blind GROUP was protected only by accident, because type 2 is not in the
         list. This is OUR surface (the member sheet is #99, legacy had none), so under
         the handover gate it is ours to fix. */
      onSenderClick: (!isSent && !mode.blind && (mode.type === 1 || mode.type === 3) && (rec.senderAddress || rec.senderNick))
        ? () => openMember(rec) : null,
      // resend has NO SingleChatPage case (dead verb) — gate the Retry affordance
      // behind cap('resend') so a failed message shows an HONEST "Not delivered"
      // (no dead button) until the BE cutover lands the resend case (audit M1).
      onRetry: (isSent && rec.status === 'failed' && bridge.cap('resend'))
        ? () => bridge.send('ixian:contextAction:resend:' + rec.id) : null,
      // URLs render as buttons; the shell confirms before opening externally
      // (#82 — P2P has no server, so no auto-load of remote content). Fixes
      // Damir F5: links were inert because no handler was wired.
      onLinkClick: (url) => confirmOpenLink(url),
      // @-mentions → highlighted spans (bold + tonal pill); self-mention stronger (#210)
      mention: mentionCtx(),
      // N34 (#365): Owner chip on the group-owner's run heads. !mode.blind is the
      // REAL frontend belt (loop MAJOR-1): the '[Unknown]' mask exists only on the
      // roster push, never on per-message addresses — and C#'s suppression can miss
      // a blind BOT whose botInfo hasn't persisted yet (getOwner reads a different
      // store). Same gate family as sender/onSenderClick above.
      roleBadge: (!isSent && mode.isMulti && !mode.blind && isOwnerAddr(rec.senderAddress))
        ? ((window.SL || {}).owner || 'Owner') : null,
      // M1 reply-to (#441). Rendered whenever the push carried a target — the
      // `reply` CAPABILITY gates who can CREATE one, not whether an incoming one
      // is shown, because a peer on a newer build can send one either way.
      reply: replyQuoteFor(rec),
      onReplyClick: (rec.replyTo && rows.get(String(rec.replyTo)))
        ? () => jumpToRow(String(rec.replyTo)) : null,
    });
  }

  /* —— remote media (GIF/image) tiles —————————————————————————————————————————
   * Damir 2026-07-07 (reopens #82, legacy parity, client-fetch — accepts that
   * loading a remote asset reveals the reader's IP to the host; flag for
   * BE/security sign-off): a message that is EXACTLY a direct image/GIF URL
   * renders as a tap-to-load tile (play button → fetch → full-screen viewer),
   * instead of the plain confirm-to-open link. Detection is conservative — a
   * direct media EXTENSION or a known direct-media host (media.tenor.com,
   * mediaN.giphy.com) — so a random page URL stays a link (a page URL wouldn't
   * load as an <img> anyway). Non-direct hosts fail-soft to the tile's retry
   * state. autoload stays OFF (a future "auto-load media" setting = legacy's
   * immediate load). NOTE: website OpenGraph meta cards are NOT wired — fetching
   * a site's meta from the WebView is CORS-blocked; that needs a proxy or
   * sender-composed meta (§82). */
  const MEDIA_EXT = /\.(gif|png|jpe?g|webp|bmp|avif)(\?|#|$)/i;
  function mediaUrlOf(text) {
    const t = (text == null ? '' : String(text)).trim();
    if (!/^https?:\/\/\S+$/i.test(t) || /\s/.test(t)) return null;   // must be a lone URL
    let u;
    try { u = new URL(t); } catch (_) { return null; }
    const host = u.hostname.toLowerCase();
    const directGifHost = /^media\d*\.(tenor|giphy)\.com$/.test(host) || /^c\.tenor\.com$/.test(host);
    if (MEDIA_EXT.test(u.pathname)) {
      return { url: t, kind: /\.gif(\?|#|$)/i.test(u.pathname) ? 'gif' : 'image' };
    }
    if (directGifHost) return { url: t, kind: 'gif' };
    return null;
  }
  function buildMediaRow(rec, media) {
    const isSent = rec.direction === 'sent';
    const label = media.kind === 'gif' ? 'GIF' : ((window.SL && window.SL.image) || 'Image');
    return createMediaBubble({
      direction: isSent ? 'sent' : 'received',
      kind: media.kind,
      src: media.url,
      alt: label,
      timestamp: rec.ts,
      gutter: mode.isMulti && !isSent,
      strings: window.SL || {},
      // legacy parity (Damir 2026-07-08): LOAD BY DEFAULT — or if the user loaded
      // this exact URL before (persisted), even when the global pref is off.
      autoload: mediaAutoloadOn() || loadedMedia.has(media.url),
      onOpen: () => openMediaViewer({ host: overlayHost, src: media.url, kind: media.kind, alt: label, strings: window.SL || {} }),
      // the tile grows from its placeholder box to the GIF's full size on load —
      // if the user was at the bottom, pull the log down; and remember this URL so
      // it auto-expands on re-entry even if autoload is later turned off.
      onLoad: () => { rememberLoadedMedia(media.url); if (nearBottom()) box.scrollTop = box.scrollHeight; },
    });
  }

  /* external-link confirm (#82): tapping an in-text link asks before leaving the
   * app / touching a remote URL, then opens via the legacy verb (dispatch 315). */
  function confirmOpenLink(url) {
    const s = window.SL || {};
    openModal(createModal({
      title: s.openLinkTitle || 'Open external link?',
      body: url,
      host: overlayHost,
      actions: [
        { label: s.cancel || 'Cancel', type: 'text', autofocus: true },
        { label: s.openLink || 'Open', type: 'fill',
          onClick: () => bridge.send('ixian:openLink:' + url) },
      ],
    }));
  }

  /* file transfer row (chat.js addFile:904 / updateFile:1009).
   *   received + not started → 'offer'    → tap = ixian:acceptfile:<fileid>
   *   in transfer (0<p<100)  → 'progress' → no tap (disabled while downloading)
   *   complete               → 'complete' → tap = ixian:openfile:<fileid>
   * OUTGOING transfers now show progress too (Damir F5): the SENDER gets real
   * per-packet ticks (TransferManager.sendFileData → updateFile, 0→100+complete),
   * so a sent file shows the bar + "keep Spixi open" hint while transferring and
   * flips to complete (open button + success toast) when done — instead of the
   * legacy "own file = instantly complete". meta is empty (bridge sends no size). */
  function buildFileRow(rec) {
    return createFileBubble({
      direction: rec.direction,
      name: rec.name || '',
      meta: rec.meta || '',
      state: rec.fstate,
      progress: rec.progress || 0,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      onAccept: () => bridge.send('ixian:acceptfile:' + rec.fileid),
      onOpen: () => bridge.send('ixian:openfile:' + rec.fileid),
      /* #334 (Damir ask): CANCEL an own offer the peer hasn't accepted yet —
       * routes through the DELETE grammar (the only durable local retraction:
       * the message goes, so the history-load resurrect has nothing to
       * re-prepare; C# also kills the in-memory outgoing transfer). Single
       * click per the #268 one-shot decision. Pre-accept window only: own
       * un-complete at 0 progress; the first packet tick removes the control
       * (setFileProgress). Peer-side residuals = C16 + the no-fileCancel
       * protocol gap (be-cutover). */
      onCancel: (rec.direction === 'sent' && rec.fstate !== 'complete'
        && !rec.transferStarted && !(Number(rec.progress) > 0) && !composerLock)
        ? () => onMenuAction('delete', rec)
        : undefined,
      /* loop MINOR-1: transferStarted (any updateFile tick) survives re-renders —
       * the progress check alone floored at 0 on big files and resurrected Cancel
       * on a LIVE transfer at every rebuild. loop MINOR-2: composerLock — the
       * delete grammar is gated in onMenuAction (sendMsgDelete EMITS to the
       * peer), so a locked chat must not render a dead Cancel; a mid-session
       * lock leaves an already-rendered Cancel inert until the next re-render
       * (accepted residual, rare path). */
    });
  }

  /* derive the file bubble state from the legacy addFile flags. */
  function fileStateFrom(me, progress, complete) {
    const p = Number(progress) || 0;
    if (asBool(complete) || p >= 100) return 'complete';
    // in-flight: OUTGOING shows send progress (bar + keep-open) — never 'offer'
    // (own files have no accept step); INCOMING = downloading vs a pending offer.
    if (asBool(me)) return 'progress';
    return p > 0 ? 'progress' : 'offer';
  }

  /* app invite/session card (chat.js addAppRequest:1174). state derives from the
   * stable localSender + appStatus signals; actions reuse the EXISTING verbs
   * (installApp / joinApp). C7(a): Decline is a LOCAL action — the invite card flips
   * to a terminal 'declined' state (persisted per peer, survives re-flush/re-open);
   * the sender is NOT notified (be-cutover C7 decline-notify is future BE). Only on
   * incoming invites (invite / missing states); own invites keep Cancel. */
  function buildAppRow(rec) {
    const incoming = rec.direction === 'received';
    const declined = incoming && declinedApps.has(String(rec.id));
    const canceled = !incoming && canceledApps.has(String(rec.id));   // ★ B2: my own invite, withdrawn
    // C7(b) privacy: a REMOTE (http) app icon auto-fetches from the publisher on render
    // → reveals the receiver's IP before any install consent (#82). Gate it behind the
    // media-autoload pref (privacy-first) so the same opt-out that suppresses remote chat
    // media also suppresses the publisher icon → rocket fallback. Local icon paths
    // (installed apps) are never remote, so never gated.
    const rawIcon = rec.iconUrl || null;
    const remoteIcon = !!rawIcon && /^https?:\/\//i.test(rawIcon);
    const iconUrl = (remoteIcon && !mediaAutoloadOn()) ? null : rawIcon;
    return createAppBubble({
      name: rec.name || '',
      iconUrl: iconUrl,
      state: declined ? 'declined' : (canceled ? 'canceled' : rec.astate),
      direction: rec.direction,
      timestamp: rec.ts,
      gutter: mode.isMulti && rec.direction === 'received',
      // C7(b): only offer Get app when the invite actually carries an install URL —
      // otherwise installApp fires with an empty string and silently no-ops (C# fetch
      // rejects it). No URL → no dead button (the user can still Decline).
      onGet: rec.appInstallURL ? () => bridge.send('ixian:installApp:' + encodeURIComponent(rec.appInstallURL)) : undefined,
      onLaunch: () => bridge.send('ixian:joinApp:' + rec.appid),
      onJoin: () => bridge.send('ixian:joinApp:' + rec.appid),
      // in-session (already joined) → Resume reopens the app; joinApp re-shows the
      // minimized session. No End-session verb exists in the bridge → onEnd omitted
      // (createAppBubble gates it, so no dead button).
      onResume: () => bridge.send('ixian:joinApp:' + rec.appid),
      // local decline → persist + repaint as 'declined'; not shown once already declined
      onDecline: (incoming && !declined) ? () => declineApp(rec.id) : undefined,
      /* ★ B2 (#533 ①, Damir's locked shape): Cancel on MY invite → confirm → the
         RECIPIENT'S invite is removed through the existing msgDelete path (C#
         `cancelInvite`: sendMsgDelete to the peer, NO local delete) and MY card flips to
         a persistent "Canceled" (the #214 tombstone: per-peer localStorage set). The
