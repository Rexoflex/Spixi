<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- ★ L17 — the ADAPTIVE ICON FOREGROUND. Transparent by design; Spixi.csproj pairs it
     with appicon.svg as the background via MauiIcon ForegroundFile.

     ⚠⚠ THIS FILE EXISTS BECAUSE A SINGLE-FILE ICON WAS WRONG, and the build told us:
     MAUI's resizetizer emits mipmap-anydpi-v26/appicon.xml as an <adaptive-icon> with
     THREE layers — background, foreground, and MONOCHROME pointing at the foreground.
     A one-file icon put the whole opaque blue square into the FOREGROUND, which breaks
     two things at once:
       · Android draws adaptive layers at 108dp with only the inner 72dp visible — a 1.5x
         zoom. A full-bleed foreground therefore ZOOMED THE MARK BACK UP, undoing the
         padding this row is about. Damir redeployed and reported the launcher "still
         old"; it was not stale, it was this.
       · The MONOCHROME layer (Android 13 themed icons) tints the foreground's ALPHA. An
         opaque full-bleed foreground has no alpha to speak of, so a themed icon rendered
         as a solid filled blob with no mark in it at all.

     ★ SIZED AGAINST THE VISIBLE ICON, not the canvas. Ink is 24.256 x 29.65 of logo.svg's
     32-unit box and the HEIGHT dominates, so the height is what gets budgeted. The visible
     area after the 1.5x adaptive zoom is 1024 * 72/108 = 682.
     ★ #683 (Damir, 2026-08-28, on a masked render rather than a guess): scale 11.5 -> 13.4.
     The ink is 325 x 397, so the mark reads at 58% of the icon a user actually sees, up
     from 50%. Its box DIAGONAL is 514 against the 682 circular mask, so it clears the
     circle with room; that diagonal is the number to check before raising this again.
     ⚠ The translate is DERIVED, never nudged: tx = 512 - S*16.0, ty = 512 - S*15.936,
     because the mark is centred on its measured INK centre (16.0, 15.936), not on the
     viewBox centre. At 13.4 that is (297.6, 298.5). -->
