<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Head-top theme: set data-theme SYNCHRONOUSLY before any paint (kills the
     light<->dark flip). Same recipe as every redesigned shell. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi — Transaction</title>
<style>
  /* Paint the screen surface IMMEDIATELY (keyed off the head-top data-theme). */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
</style>
<link rel="preload" href="../assets/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/base.css">
<link rel="stylesheet" href="../styles/components/button.css">
<link rel="stylesheet" href="../styles/components/topbar.css">
<link rel="stylesheet" href="../styles/components/avatar.css"><!-- contact avatar in the detail head + the incoming-call overlay -->
<link rel="stylesheet" href="../styles/components/badge.css"><!-- status badge (confirmed/pending/failed/unknown) -->
<link rel="stylesheet" href="../styles/components/overlay.css"><!-- c-sheet chrome for the ghost-lift builder (never visible) -->
<link rel="stylesheet" href="../styles/components/wallet-shell.css"><!-- .c-txsheet detail-card grammar -->
<!-- Q4-③ (#270): call CSS removed — calls present on the native CallPage -->
<style>
  /* Production shell: fill the WebView. wallet_sent.html is loaded by the C#
     WalletSentPage BOTH as a pushed page (narrow: back = ixian:dismiss) and
     swapped into HomePage.rightContent (wide pane: C# pushes hideBackButton).
     Layout = the desktop demo's detail grammar (§2.2): full-width title bar,
     content capped + centered below it, the openTxSheet builder's .c-txsheet
     as the card (NOT a bottom sheet). */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #tx-topbar { flex: none; }
  #tx-scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* demo dt-cap grammar: cap + center the detail card (desktop.html:264 / #detail-wallet cap) */
  .tx-cap { width: 100%; max-width: 560px; margin-inline: auto; }
  .tx-cap .c-txsheet { padding: var(--spacing-16) var(--spacing-24) var(--spacing-32); }
  /* #285: the per-view reveal eye — centered, breathing room under the head. */
  .tx-reveal { display: flex; justify-content: center; margin-top: var(--spacing-8); }
  /* Boot spinner — static, theme-colored loader shown during the ~1MB bundle
     parse / before the first C# data burst; the first render swaps it out. */
  .boot { min-height: 60vh; display: flex; align-items: center; justify-content: center; }
  .boot__spinner {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    border: 3px solid var(--outline-neutral-02);
    border-top-color: var(--icon-action-default, var(--surface-action-default));
    animation: boot-spin var(--duration-700, 700ms) linear infinite;
  }
  @keyframes boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .boot__spinner { animation: none; } }
</style>
</head>
<body>
  <!-- C#-LOCALIZED string carriers (#252 mechanism): generatePage substitutes the
       star-SL markers with the EXACT "unknown counterparty" strings WalletSentPage
       pushes as the username (xaml.cs:164/:201), so the shell can locale-proof
       detect a no-contact tx and show the direction glyph instead of personalizing
       a gradient avatar from "Unknown Recipient". Browser preview leaves them raw
       → the reader ignores them (en-us literals below back them up).
       ⚠ #248: markers must stay same-line-closed. -->
  <div id="sl-carriers" hidden aria-hidden="true">
    <span id="sl-unknown-recipient">*SL{wallet-unknown-recipient}</span>
    <span id="sl-unknown-sender">*SL{wallet-unknown-sender}</span>
  </div>

  <div id="tx-topbar"></div>
  <div class="u-scroll" id="tx-scroll"><div class="boot"><div class="boot__spinner" role="status" aria-label="Loading"></div></div></div>

<script src="../components/icons.iife.js"></script>
<script src="../demo/strings.iife.js"></script>
<!-- A4: the SL carrier below is C#-substituted with the ACTIVE locale on every page
     load (SpixiLocalization.localizeHtml — every lang file carries the key), so the
     dictionary follows the Settings language pick. ?lang= still overrides (demos/
     tests); in a plain-browser preview the marker stays un-substituted →
     SpixiStrings.get() falls back to en-us. -->
<script>window.SL = window.SpixiStrings.get(new URLSearchParams(location.search).get('lang') || '*SL{language-code}');</script>
<script src="../demo/spixi.iife.js"></script>
<script>
  /* —————————————————————————————————————————————————————————————————————————
   * Production Transaction-details shell (B3, #256) — the redesigned tx detail
   * wired to the REAL C# MAUI bridge (native.js in the bundle). Loaded by
   * WalletSentPage. ZERO C# change, frozen bridge. Spec: docs/wallet-shell-spec.md
   * §detail + fable-build-brief-missing-bits.md §3 B3.
   *
   * Contract (Pages/Wallet/WalletSentPage.xaml.cs — verified):
   *   C#→JS: clearEntries() — starts every checkTransaction pass; ⚠ ALSO pushed
   *            alone on a re-poll whose status hasn't changed (:121 precedes the
   *            :129-132 early-return) → it resets the STAGING buffer only, never the
   *            committed model and never the rendered card (legacy parity: the legacy
   *            clearEntries body is empty). See the staging docblock below — this is
   *            the #288 F5 bug.
   *          setReceivedMode() — received tx, precedes addEntry.
   *          addEntry(address, username, avatar, amount, fiat, time, type,
   *            confirmed) — ONE counterparty entry (C# breaks after the first;
   *            multi-recipient is a C#-side TODO). amount/fiat pre-formatted
   *            UN-grouped; time = pre-formatted human string (verbatim, never
   *            parsed); type 'send'|'receive'; confirmed 'true'|'false'|
   *            'unknown'|'error'.
   *          setData(amount, fee, time, txid, confirmed) — closes the burst →
   *            the shell renders HERE (one paint per pass). fee = IxiNumber
   *            string (full precision — NOT #77-truncated: fees are sub-0.01).
   *          hideBackButton() — pane-hosted (wide: HomePage rightContent); the
   *            title bar drops its back affordance.
   *          setHideBalance(hide) — #285: the persisted #263 global hide flag
   *            ("True"/"False"); masks money+who, per-view reveal eye un-masks.
   *   JS→C#: ixian:onload (ready; C# then runs checkTransaction) ·
   *          ixian:dismiss (narrow: pops the page) ·
   *          ixian:viewexplorer (TX-SCOPED explorer URL — ?p=transaction&id=…).
   *   LIVE STATUS: updateScreen() re-polls until Final → a fresh burst lands on
   *   every status change; the card re-renders in place (badge/status flips).
   *
   * ★ VIEW-ONLY (SECURITY.md): no compose, no signing, no money math beyond
   *   display grouping. The money path stays C#'s; wallet-send is a later batch.
   * X1 note: WalletSentPage is NOT in the #217 imageToDataUri wrap set (it was
   *   "legacy — do at repoint"; the repoint is THIS shell) → the avatar arrives
   *   as a raw local path: resolves on WinUI (#190), degrades to the gradient
   *   elsewhere via createAvatar onerror. Wrap ask logged in be-cutover (X1).
   * ————————————————————————————————————————————————————————————————————————— */
  const {
    createTopbar, openTxSheet, closeSheet,
    createNativeBridge, installExecuteUiCommand,
    attachEdgeBack, dismissTopOverlay,   // ★ L3 (#706): the iOS back signal + the one-level chain
    truncateAddressMiddle,               // #276: address-shaped counterparty names render truncated
    isAddressShaped,                     // ★ #589: the ONE address-shape test (was a local 20-char regex)
    createButton,                        // #285: the per-view reveal button
    formatTxTimestamp,                   // iOS-55 (#325): epoch → localized display (docLocale)
    groupAmountDisplay,                  // ★ I-6 (#360): locale-aware amount display (money.js),
    applyPushedTheme,
  } = window.Spixi;
  const strings = window.SL || {};

  // Boot theme fallback (standard block): only re-derive if the head-top script
  // somehow didn't run.
  (function () {
    if (document.documentElement.dataset.theme) return;
    var a = ''; try { a = localStorage.getItem('spixi.appearance') || ''; } catch (e) {}
    if (a === '1') document.documentElement.dataset.theme = 'light';
    else if (a === '2') document.documentElement.dataset.theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  })();

  const bridge = createNativeBridge();
  installExecuteUiCommand();

  const scroll = document.getElementById('tx-scroll');
  const topbarHost = document.getElementById('tx-topbar');

  /* —— title bar: back = ixian:dismiss (narrow); hideBackButton (pane) rebuilds
   *    it without the back affordance — the pane has no pop to offer. ————————— */
  function buildTopbar(withBack) {
    topbarHost.replaceChildren(createTopbar({
      variant: 'view',
      title: strings.txDetails || 'Transaction details',
      backLabel: strings.back || 'Back',
      onBack: withBack ? () => bridge.send('ixian:dismiss') : null,
    }));
  }
  buildTopbar(true);

  /* —— helpers ——————————————————————————————————————————————————————————————— */
  // Display grouping only (legacy wallet_sent.html:175 amountWithCommas) — the
  // detail is the authoritative record, so decimals stay VERBATIM (no 2dp clamp).
  // ★ I-6 (#360): separators now follow the APP LANGUAGE (money.js
  // groupAmountDisplay — group + decimal mark travel together), not hard commas.
  const amountWithCommas = (n) => groupAmountDisplay(n);
  // 'true'→confirmed · 'false'→pending · 'unknown'→unknown · anything else→failed
  // (mirrors the legacy enum + home.html walletStatus).
  function statusFrom(confirmed) {
    const c = String(confirmed || '').toLowerCase();
    return c === 'true' ? 'confirmed' : c === 'false' ? 'pending' : c === 'unknown' ? 'unknown' : 'failed';
  }
  // Counterparty avatar: C# pushes a raw path — normalize Windows separators
  // (#206 canon); the `img/…` WebView-relative sentinel (spixiavatar.png = "no
  // avatar stored") degrades to the deterministic gradient like every other
  // redesigned surface (#206 ⑦).
  function resolveAvatar(path) {
    const p = String(path || '').replace(/\\/g, '/');
    if (!p || p.indexOf('img/') === 0) return null;
    return p;
  }
  // Unknown-counterparty detection (#252 equality carriers): C# sends the
  // LOCALIZED "Unknown Recipient/Sender" as the username when there is no
  // friend record — match it so we don't personalize a gradient from it.
  function carrierText(id) {
    const el = document.getElementById(id);
    const t = el ? el.textContent.trim() : '';
    return (!t || t.indexOf('*SL' + '{') !== -1) ? '' : t;   // raw marker (preview) → unusable
  }
  const UNKNOWN_NAMES = [
    carrierText('sl-unknown-recipient'), carrierText('sl-unknown-sender'),
    'Unknown Recipient', 'Unknown Sender',   // en-us literals back up the raw-marker preview
  ].filter(Boolean);

  /* —— buffered model: one render per C# burst (at setData) ————————————————— */
  const model = { entries: [], received: false, data: null };
  /* #288 F5 (Damir: "hidden balance → open detail → Show amounts doesn't show amounts").
   * checkTransaction pushes `clearEntries` as its FIRST act and then early-returns when
   * the activity status is unchanged (WalletSentPage:121 / :129-133), and updateScreen
   * re-polls at 1 Hz for as long as !isConfirmedDisplayed — which is only ever set for an
   * Activity.Final tx (:137). So on ANY pending/unknown transaction the buffer is empty
   * one second after open, while the painted card still shows the last good burst.
   * That was safe while setData was render()'s ONLY caller. #285's per-view reveal added
   * a SECOND caller, so revealing rebuilt the card from {} → blank amount/name/fiat: the
   * chrome intact with no money in it. (`received` reset too, but that sign flip is NOT
   * observable — an empty entry renders no amount at all, so no sign is emitted. Audit
   * correction; recognise a recurrence by the BLANK card, not by a wrong sign.) NOT a
   * layout bug — a CONFIRMED tx stops polling and reveals fine, which is why it looked
   * narrow-only. The buffer can also be empty AT open, not just one second later: onLoad's
   * own checkTransaction takes the early return whenever the 1 Hz tick already ran a pass,
   * which it can — pageLoaded is the readyState poll, not ixian:onload. The burst now STAGES here and is COMMITTED at setData, so render() is
   * idempotent for every caller and the documented "buffer reset only, never clears the
   * rendered card" contract finally holds for re-renders too.
   * Push order is safe: clearEntries (:121) → setReceivedMode (:208) → addEntry
   * (:187/:225) → setData (:236). */
  const staging = { entries: [], received: false };
  let rendered = false;

  /* —— #285 (#263/#276 hide leg): the detail follows the GLOBAL hide flag.
   *    C# (WalletSentPage.onLoad) pushes the persisted flag before the burst.
   *    The old "detail stays unmasked = explicit reveal" dial was designed for
   *    the mobile sheet→Details flow; on desktop a row tap opens THIS page
   *    directly, leaking money+who next to a masked list. Reveal is explicit
   *    again via the per-view eye (a hide re-push that CHANGES the flag drops the
   *    reveal; an unchanged-value re-push preserves it — HomePage's balance-toggle
   *    broadcast depends on exactly that, #288).
   *    Masking parity with home.html: money + who; status/date/txid stay
   *    (pattern-of-life dial). ————————————————————————————————————————————— */
  let walletHidden = false;
  // #288 review: the mask was fail-OPEN — the shell rendered money before it knew the
  // flag, so a lost/late setHideBalance push (older exe, stranded queue, or a 1 Hz
  // checkTransaction tick landing between pageLoaded and ixian:onload) painted the card
  // fully unmasked with the preference ON. Mask until the flag has actually arrived.
  let hideKnown = false;
  let revealed = false;
  /* #288 F5 audit R10: ONE source of truth — the two call sites (buildTx and the eye)
   * had the predicate inline and duplicated; two edits from disagreeing, and a
   * disagreement means either a masked card with no way to reveal, or an unmasked card
   * that still offers one. */
  function isMasked() { return (walletHidden || !hideKnown) && !revealed; }
  /* #288 F5 audit R1: the eye must NOT be offered during the fail-closed unknown
   * window. It used to render there, and the first setHideBalance push — which is
   * always treated as actionable, even when its value matches the masked default —
   * unconditionally clears `revealed`, silently undoing a tap the user had just made.
   * The window is sub-millisecond (readyState complete → load), but the fix is free:
   * no flag, no eye. The card stays masked either way, so nothing leaks. */
  function canReveal() { return hideKnown && walletHidden && !revealed; }
  const WALLET_MASK = '••••••';

  function buildTx() {
    const e = model.entries[0] || {};
    const d = model.data || {};
    const status = d.status || e.status || 'unknown';
    const dirIn = model.received || e.direction === 'in';
    const sign = status === 'failed' ? '' : (dirIn ? '+' : '-');
    const unknown = !e.name || UNKNOWN_NAMES.indexOf(e.name) !== -1;
    // #276 (#211 canon sweep): C# sends the RAW ADDRESS as `username` when the
    // counterparty isn't a contact — the "Sent to {name}" title rendered full
    // base58 (Damir F5). Address-shaped names render MIDDLE-TRUNCATED; the full
    // address stays on the copyable address row below (the sanctioned field).
    // Same token shape as home.html's looksLikeAddress (base58, 20–128, ≥1 digit).
    // ★ #589: the local test fired at 20 characters, so a long nickname was
    // middle-truncated. One canon now (avatar.js looksLikeAddress, floor 40).
    const nameIsAddr = !unknown && isAddressShaped(e.name);
    // #285: mask = global hide minus the per-view reveal. Money + who mask
    // (amount/fiat/fee/name/address/avatar); status/date/txid stay visible —
    // home.html applyWalletVisibility parity ("pattern-of-life is visible
    // anyway; the MONEY and the WHO are what a bystander reads").
    const masked = isMasked();
    return {
      txid: d.txid || '',
      direction: dirIn ? 'in' : 'out',
      status,
      // unknown counterparty → NO name/contact (title stays "Sent"/"Received",
      // the direction circle carries the identity slot, the address row still
      // shows the raw address). Data-honest — never a gradient of "Unknown".
      name: masked ? WALLET_MASK : (unknown ? '' : (nameIsAddr ? truncateAddressMiddle(e.name) : e.name)),
      contact: masked ? false : !unknown,
      address: masked ? '' : (e.address || ''),
      avatar: (masked || unknown) ? null : e.avatar,
      amount: masked ? WALLET_MASK : ((e.amount != null && e.amount !== '') ? sign + amountWithCommas(e.amount) : ''),
      fiat: masked ? '' : ((e.fiat != null && e.fiat !== '') ? sign + '$' + amountWithCommas(e.fiat) : ''),
      fee: masked ? '' : ((d.fee != null && d.fee !== '') ? amountWithCommas(d.fee) + ' IXI' : ''),
      timeText: txTimeDisplay(e.timeText || d.time || ''),
    };
  }

  /* iOS-55 (#325, W1 LANDED): C# pushes the RAW EPOCH (seconds) in addEntry/
   * setData time args — all-digits formats via formatTxTimestamp/docLocale
   * (translated month names, chat-row parity); anything else = an OLD exe's
   * pre-formatted English string → verbatim (backcompat). */
  function txTimeDisplay(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (/^\d{1,12}$/.test(s) && Number(s) > 0) return formatTxTimestamp(Number(s) * 1000);
    return s;
  }

  /* Detail card = the openTxSheet builder LIFTED out of a ghost sheet (the
   * desktop demo's §2.2 recipe, desktop.html:1628 — same card, pane host, no
   * bottom sheet). The ghost never paints: it mounts detached and is dismissed
   * synchronously; the lifted .c-txsheet is reparented before the overlay's
   * 400ms removal fallback touches it. Explorer keeps its one-shot latch —
   * a status re-render re-arms it (sheet parity). */
  function render() {
    const tx = buildTx();
    const ghost = document.createElement('div');
    const sheet = openTxSheet({
      tx, host: ghost, strings,
      // N25 (#443) audit MINOR-8: this PAGE exists to show the address, fee and id —
      // do not hide them behind the sheet's "See details" disclosure here.
      disclose: false,
      // ★ F4 (Damir on device 2026-08-21): the sheet's Close button acts on the SHEET,
      // and this page discards that sheet immediately below (the ghost-lift). Carried
      // along it rendered a dead control. Its own option — deliberately NOT keyed off
      // `disclose`, which answers a different question. This page's way out is the
      // topbar back arrow.
      showClose: false,
      // TX-SCOPED explorer (the page's own verb — C# opens ?p=transaction&id=<txid>).
      onExplorer: () => bridge.send('ixian:viewexplorer'),
    });
    const detail = sheet.querySelector('.c-txsheet');
    closeSheet(sheet);
    const cap = document.createElement('div');
    cap.className = 'tx-cap';
    cap.append(detail);
    // #285 per-view reveal: masked → an explicit eye under the amount block
    // reveals THIS view only (the global flag is untouched; the next
    // setHideBalance flip re-masks). Sits inside the card, under the head.
    if (canReveal()) {
      const revealHost = document.createElement('div');
      revealHost.className = 'tx-reveal';
      revealHost.append(createButton({
        label: strings.revealAmounts || 'Show amounts',
        // NOTE: createButton takes an icon ELEMENT, not a name — a string here
        // threw inside the fail-soft dispatcher = eternal boot spinner (F5
        // 2026-07-29). Text-only: the bundle does not export icon(); not worth
        // a bundle rebuild for a glyph.
        type: 'outline', size: 32,
        onClick: () => { revealed = true; render(); },
      }));
      const head = detail.querySelector('.c-txsheet__head');
      if (head) head.after(revealHost); else detail.prepend(revealHost);
    }
    // Re-review MINOR-1: a live status re-render replaces the card in place — if
    // keyboard focus sits inside the outgoing card it would drop to <body>.
    // Re-home it onto the same control (class + index) in the fresh card, else
    // the first focusable there.
    const active = document.activeElement;
    let restoreSel = '', restoreIdx = -1;
    if (active && scroll.contains(active) && active.className) {
      try {
        restoreSel = '.' + String(active.className).trim().split(/\s+/).join('.');
        restoreIdx = Array.prototype.indexOf.call(scroll.querySelectorAll(restoreSel), active);
      } catch (e) { restoreSel = ''; }
    }
    scroll.replaceChildren(cap);
    if (restoreSel && restoreIdx >= 0) {
      let next = null;
      try { next = cap.querySelectorAll(restoreSel)[restoreIdx] || null; } catch (e) {}
      if (!next) next = cap.querySelector('button, [href], input, [tabindex]:not([tabindex="-1"])');
      if (next && next.focus) next.focus({ preventScroll: true });
    }
    rendered = true;
    /* ★★ Session M — THE PRESENT SIGNAL (the #766 generalisation to the DATA pages).
       The card is on glass; C# presents here instead of on its flat 120 ms hold. render()
       has three callers, but the FIRST one is always `setData`'s commit (#289's staging
       buffer). The other two cannot run before it, for two DIFFERENT reasons — ⚠ #46 r1
       NIT-1 corrected an earlier claim that both "gate on `rendered`": only the 1 Hz status
       re-render does (`if (rendered) render()`). The reveal is STRUCTURAL — its eye button
       is created inside render() itself, so it does not exist until a card has been built.
       Either way no path signals a card built from an empty buffer — exactly the #289
       defect — which is why this line sits after `rendered = true` rather than anywhere in
       the push handlers. Latched: the 1 Hz status re-render is free. */
    bridge.painted();
  }

  /* ★ L3 (#706): the iOS back signal. The topbar arrow sends ixian:dismiss, and only
     while the page offers one (hideBackButton rebuilds it for the desktop pane, which
     never attaches anyway). A sheet on the shared stack closes first. */
  let sentHasBack = true;
  attachEdgeBack({ onBack: () => {
    if (dismissTopOverlay()) return;
    if (sentHasBack) bridge.send('ixian:dismiss');
  } });
  const handlers = {
    // Q4-③ (#270): the #258 §0 "every shell exposes the call globals" contract is
    // RETIRED — calls present on the ONE native CallPage; no shell receives call
    // pushes anymore (the C# broadcasts route to the surface, not to pages).

    // Buffer reset ONLY — never clears the rendered card (C# pushes a lone
    // clearEntries on every unchanged re-poll; see the contract docblock).
    // #288 F5: resets the STAGING buffer — the committed model survives until the next
    // setData, so a later render() (reveal, status flip) still has real data.
    clearEntries() { staging.entries = []; staging.received = false; },
    setReceivedMode() { staging.received = true; },
    addEntry(address, username, avatar, amount, fiat, time, type, confirmed) {
      staging.entries.push({
        address: address || '',
        name: username || '',
        avatar: resolveAvatar(avatar),
        amount: amount || '',
        fiat: fiat || '',
        timeText: time || '',
        direction: type === 'receive' ? 'in' : 'out',
        status: statusFrom(confirmed),
      });
    },
    // Closes every burst → the one render/re-render point (live status flips).
    // #288 F5: COMMIT the staged burst before rendering (see the staging docblock).
    setData(amount, fee, time, txid, confirmed) {
      model.entries = staging.entries.slice();
      model.received = staging.received;
      model.data = {
        amount: amount || '', fee: fee || '', time: time || '',
        txid: txid || '', status: statusFrom(confirmed),
      };
      render();
    },
    // Pane-hosted (wide): drop the back affordance — C# owns the pane lifecycle.
    hideBackButton() { sentHasBack = false; buildTopbar(false); },   // #706: the swipe follows the arrow
    // #285: the persisted #263 hide flag (bool.ToString() → "True"/"False" —
    // home.html setHideBalance parity). A flip that CHANGES the value drops the
    // per-view reveal; an unchanged-value re-push early-returns and PRESERVES it —
    // which is what makes HomePage's balance-toggle broadcast to open panes safe
    // (#288). Do not "simplify" the early return away.
    setHideBalance(hide) {
      const h = hide === 'True' || hide === 'true' || hide === true;
      // #288 review: the FIRST push must always render, even when its value matches the
      // (masked-by-default) initial state — otherwise "False" on a visible balance would
      // early-return and leave the card masked forever.
      const firstKnown = !hideKnown;
      hideKnown = true;
      /* ★ F7 INSTRUMENTATION (log only): the SHELL half of the split. C# logs the value
         it pushed; this logs that the push ARRIVED and what both flags then read, so the
         two lines together say which of `hideKnown`/`walletHidden` is false when the eye
         does not render. Console-only — visible over `adb logcat` and in the WebView
         inspector; nothing is written to storage and nothing renders on screen. */
      try { console.log('[WALLETDIAG] setHideBalance arrived · raw=' + hide + ' → hideKnown=true walletHidden=' + h + ' revealed=' + revealed); } catch (e) {}
      if (h === walletHidden && !firstKnown) return;
      walletHidden = h;
      revealed = false;
      if (rendered) render();
    },
    // #251 defense: theme re-push lands as a bare global — accept it.
    // ★ N71 (#421): body shared (theme-runtime.js). This shell carried a MINIMAL
    // variant with no transition suppression, so its swap animated every colour on
    // the page at once (#53); sharing the body fixes that for free.
    setTheme(name) { applyPushedTheme(name); },
  };
  bridge.exposeAll(handlers);

  /* —— page ready — fire ixian:onload on the window LOAD event (#177). ————————— */
  function signalReady() { bridge.ready(); }
  if (document.readyState === 'complete') signalReady();
  else window.addEventListener('load', signalReady, { once: true });
</script>
</body>
</html>
