<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- iOS/quirks: pinch must scale the CHAT TEXT, not the page. Without a scale
     clamp WKWebView owns the pinch and does a document zoom (blurry raster,
     topbar/composer scaled off-screen, no way back but a double-tap) — Damir
     2026-07-29. The clamp hands the gesture to us; the handler below maps it onto
     --chat-text-scale, the SAME knob Account → Chat appearance writes. -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spixi</title>
<!-- Resolve the theme BEFORE any style/paint so the instant-bg + tokens match the
     user's chosen appearance from the first frame (no light→dark flash). Same
     head-top guard the other shells use; the late body block below is harmless. -->
<script>(function(){var n='*SL{SpixiThemeName}';if(n==='light'||n==='dark'){document.documentElement.dataset.theme=n;return;}var a='';try{a=localStorage.getItem('spixi.appearance')||'';}catch(e){}document.documentElement.dataset.theme=a==='1'?'light':a==='2'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
<!-- #228 platform type flag: desktop OS → compact desktop type/density (tokens.css
     :root[data-desktop]); set BEFORE first paint, constant across window resize
     (TG/Discord behavior). iPad (Macintosh UA + touch) counts as mobile. -->
<script>(function(){var u=navigator.userAgent;if(!/Android|iPhone|iPad|IEMobile|Mobile/.test(u)&&!(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))document.documentElement.setAttribute('data-desktop','');})();</script>
<!-- ★ AND-7 (#396/#401) FULL BLEED: the Android top system-bar inset, in CSS px, set
     BEFORE first paint. MainActivity no longer pads the root view down by the status
     bar, so this page reaches y=0 and its own chrome pads itself from --safe-top
     (base.css). Android's env(safe-area-inset-top) cannot carry this — it reports the
     display CUTOUT only. Off Android the carrier resolves to the seeded "0"
     (SpixiLocalization), so --safe-top collapses to env() exactly as before; an
     UNRESOLVED marker also fails the numeric test and leaves the variable unset.
     The value is validated as a plain number before it reaches a style property. -->
<script>(function(){function a(v){if(/^\d{1,3}(\.\d{1,2})?$/.test(String(v)))document.documentElement.style.setProperty('--android-inset-top',v+'px');}a('*SL{AndroidInsetTop}');window.setInsetTop=a;})();</script>
<!-- Preview forcing for the platform flag (?desktop=1 sets / ?mobile=1 clears;
     the app passes no query). MUST run BEFORE the pattern-pref script below —
     since B2 the pattern DEFAULT is platform-aware, so the flag has to be final
     when the default is derived. -->
<script>(function(){try{var p=new URLSearchParams(location.search);if(p.get('desktop')==='1')document.documentElement.setAttribute('data-desktop','');else if(p.get('mobile')==='1')document.documentElement.removeAttribute('data-desktop');}catch(e){}})();</script>
<!-- Chat appearance prefs (6e.2, FE-only): pattern intensity + message text size
     picked on the Account screen persist in localStorage (same origin) — applied
     here pre-paint (a level resolved after first paint flashes the wrong canvas).
     B2 (#256): ONE pref key, PLATFORM-AWARE DEFAULT when unset — desktop Off,
     mobile Default — replacing the #207 hard-forced desktop pattern-off, so an
     explicit user pick works on BOTH platforms.
     ★ N81 (#422): the value is a LEVEL INDEX and the alpha is a per-theme token,
     so the old "dark = light × 0.36" line that used to live here is gone. -->
<!-- W5 (Damir 2026-08-12): the pattern STYLE pref rides the SAME pre-paint script
     as the intensity, for the same reason — a style resolved after first paint
     flashes the wrong pattern. It sets `data-chat-pattern` on <html>, which
     chat-pattern.css turns into the tile custom properties (inherited, so the
     settings swatches can override it per element). Two dials, orthogonal:
     style picks the SOURCE, the intensity pref keeps mapping to opacity, and
     "Off" lives ONLY in the intensity dial (there is no fourth style).
     Live flow is DESKTOP-ONLY — a mobile client carrying the pref (restore,
     hand-edited storage) falls back to line art here rather than burning
     battery on a constant rAF loop. -->
<!-- ★ N81 (#422): the level is an INDEX (0 Off / 1 Default / 2 Strong) and the
     alpha comes from the theme's own --chat-pattern-alpha-N. The old dark ×0.36
     derivation is GONE from every script — CSS resolves var() under the current
     theme, so a live setTheme push can no longer leave dark painting the light
     number. Legacy fractional prefs migrate here exactly as readPatternLevel()
     does in settings-screens.js; this copy is inline because it must run BEFORE
     the bundle loads (pre-paint). Keep the two in step. -->
<script>(function(){var r=document.documentElement.style,de=document.documentElement.hasAttribute('data-desktop'),p=NaN,t=NaN,s='';try{p=parseFloat(localStorage.getItem('spixi.chat.pattern'));t=parseFloat(localStorage.getItem('spixi.chat.textscale'));s=localStorage.getItem('spixi.chat.patternstyle')||'';}catch(e){}var lv;if(!isFinite(p))lv=de?0:1;else if(p<=0)lv=0;else if(p===1||p===2)lv=p;else lv=p>0.5?2:1;r.setProperty('--chat-pattern-opacity',lv===2?'var(--chat-pattern-alpha-2)':lv<=0?'0':'var(--chat-pattern-alpha-1)');if(!isNaN(t))r.setProperty('--chat-text-scale',String(Math.min(1.5,Math.max(0.8,t))));if(s==='flow'&&!de)s='triangles';if(s!=='lineart'&&s!=='matrix'&&s!=='flow'&&s!=='triangles')s='triangles';document.documentElement.setAttribute('data-chat-pattern',s);})();</script>
<style>
  /* Paint the screen surface IMMEDIATELY — before tokens.css/base.css load and
     before the JS bundle parses — so entering a chat doesn't flash an empty
     "blank" pane while the shell boots (Damir F5). Values mirror --surface-screen
     (neutral-10 / neutral-900); tokens.css takes over once loaded. */
  html { background: #f9fafb; }
  html[data-theme="dark"] { background: #13171b; }
  /* ★ N77 (#413): the load probe strip — dev-mode only, pointer-transparent,
     English-only diagnostics (the #301 precedent). Pinned above the composer. */
  .load-probe {
    position: fixed; left: var(--spacing-8); right: var(--spacing-8);
    bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    z-index: var(--z-10);
    width: max-content; max-width: calc(100% - 16px);
    padding: 3px var(--spacing-8); border-radius: var(--radius-8, 8px);
    background: rgba(0, 0, 0, 0.55); color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px; line-height: 14px;
    pointer-events: none;
  }
</style>

<link rel="stylesheet" href="spixi.tokens.css">
<link rel="stylesheet" href="spixi.base.css">
<style data-src="../styles/components/button.css">
/* c-button — mirrors Figma button/{32,44,56}/{default,destructive}, type=fill|tonal|outline|text.
   Taxonomy: data-attributes mirror Figma names (DECISIONS.md #16).
   Semantic tokens only — no primitives/keys. Width: hug by default, data-width="full" fills. */

.c-button {
  /* intent-switched private palette (default = action) */
  --_fill: var(--surface-action-default);
  --_fill-hover: var(--surface-action-hover);
  --_fill-pressed: var(--surface-action-pressed);
  --_tonal: var(--surface-action-tonal-default);
  --_tonal-hover: var(--surface-action-tonal-hover);
  --_tonal-pressed: var(--surface-action-tonal-pressed);
  --_ink: var(--text-action-default);
  --_ink-hover: var(--text-action-hover);
  --_ink-pressed: var(--text-action-pressed);
  --_outline: var(--outline-action-default);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-8);
  border: 0;
  border-radius: var(--radius-full);
  font-family: var(--font-secondary);
  font-weight: var(--font-weight-semibold);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  white-space: nowrap;
  /* `transform` is the #343 press release (base.css sets data-pressed="control" →
     scale(0.97); this animates the way back). It lives HERE, not in base.css: a
     base.css rule strong enough to win would REPLACE this whole shorthand — that is
     the #346 clobber that killed the morph width below. */
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard);
}

/* width animates only during the success morph (JS sets data-morphing) —
   keeps resize from layout-animating full-width buttons */
.c-button[data-morphing] {
  transition: background-color var(--duration-200) var(--easing-standard),
              color var(--duration-200) var(--easing-standard),
              border-color var(--duration-200) var(--easing-standard),
              transform var(--duration-200) var(--easing-standard),
              width var(--duration-200) var(--easing-standard);
}

.c-button[data-intent="destructive"] {
  --_fill: var(--surface-destructive-default);
  --_fill-hover: var(--surface-destructive-hover);
  --_fill-pressed: var(--surface-destructive-pressed);
  --_tonal: var(--surface-destructive-tonal-default);
  --_tonal-hover: var(--surface-destructive-tonal-hover);
  --_tonal-pressed: var(--surface-destructive-tonal-pressed);
  --_ink: var(--text-error);
  --_ink-hover: var(--text-error);
  --_ink-pressed: var(--text-error);
  --_outline: var(--outline-error);
}

/* sizes (heights match Figma set names) */
.c-button[data-size="56"] { height: 56px; padding-inline: var(--spacing-24); font-size: var(--font-size-label-md); }
.c-button[data-size="44"] { height: 44px; padding-inline: var(--spacing-20); font-size: var(--font-size-label-sm); }
.c-button[data-size="32"] { height: 32px; padding-inline: var(--spacing-12); font-size: var(--font-size-label-sm); }

/* width behavior (instance-level, not a variant — DECISIONS.md #12) */
.c-button[data-width="full"] { display: flex; width: 100%; }

/* types */
.c-button[data-type="fill"] { background: var(--_fill); color: var(--text-neutral-on-action); }

.c-button[data-type="tonal"] { background: var(--_tonal); color: var(--_ink); }

.c-button[data-type="outline"] {
  background: transparent;
  color: var(--_ink);
  border: var(--outline-width-1) solid var(--_outline);
}

.c-button[data-type="text"] { background: transparent; color: var(--_ink); }

/* hover guarded per DECISIONS #43 (no sticky hover on touch WebViews) */
@media (hover: hover) and (pointer: fine) {
  .c-button[data-type="fill"]:hover { background: var(--_fill-hover); }
  .c-button[data-type="tonal"]:hover { background: var(--_tonal-hover); }
  .c-button[data-type="outline"]:hover { color: var(--_ink-hover); border-color: var(--_ink-hover); background: var(--surface-interactive-hover); }
  .c-button[data-type="text"]:hover { color: var(--_ink-hover); background: var(--surface-interactive-hover); }
}

/* :active AFTER the hover block so pressed wins while both match (source order at equal specificity) */
.c-button[data-type="fill"]:active { background: var(--_fill-pressed); }
.c-button[data-type="tonal"]:active { background: var(--_tonal-pressed); }
.c-button[data-type="outline"]:active { color: var(--_ink-pressed); border-color: var(--_ink-pressed); background: var(--_tonal); }
.c-button[data-type="text"]:active { color: var(--_ink-pressed); background: var(--_tonal); }

/* disabled — loading buttons are ALSO disabled now (audit r2: keyboard could
   re-fire a processing Pay) but must keep their type surface, not the grey */
.c-button:disabled { cursor: not-allowed; }
.c-button:disabled:not([data-loading])[data-type="fill"],
.c-button:disabled:not([data-loading])[data-type="tonal"] { background: var(--surface-action-disabled); color: var(--text-neutral-on-disabled); }
.c-button:disabled:not([data-loading])[data-type="outline"] { color: var(--text-action-disabled); border-color: var(--outline-action-disabled); background: transparent; }
.c-button:disabled:not([data-loading])[data-type="text"] { color: var(--text-action-disabled); background: transparent; }

/* loading */
.c-button[data-loading] { pointer-events: none; }
.c-button[data-loading] .c-button__icon { display: none; }   /* the spinner replaces the content icon (e.g. Accept's check while "Accepting…") */
.c-button__spinner {
  width: 1em;
  height: 1em;
  border-radius: var(--radius-full);
  border: var(--outline-width-2) solid currentColor;
  border-right-color: transparent;
  animation: c-button-spin 800ms linear infinite;
}
@keyframes c-button-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .c-button__spinner { animation-duration: 1600ms; } /* keep visible motion, slower */
}

/* success morph (DECISIONS.md #29) — overrides any type while active */
.c-button[data-success] {
  background: var(--surface-success) !important;
  color: var(--text-neutral-on-action) !important;
  border-color: transparent !important;
  pointer-events: none;
}
.c-button[data-success]:disabled { cursor: default; }

/* icon slot */
.c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); flex: none; }
.c-button[data-size="32"] .c-button__icon { width: var(--size-icon-16); height: var(--size-icon-16); }

/* icon-only: square, no inline padding (a11y: requires aria-label) */
.c-button[data-icon-only] { padding-inline: 0; }
.c-button[data-icon-only][data-size="56"] { width: 56px; }
.c-button[data-icon-only][data-size="44"] { width: 44px; }
.c-button[data-icon-only][data-size="32"] { width: 32px; }
.c-button[data-icon-only] .c-button__icon { width: var(--size-icon-24); height: var(--size-icon-24); }
.c-button[data-icon-only][data-size="32"] .c-button__icon { width: var(--size-icon-20); height: var(--size-icon-20); }

</style>
<style data-src="../styles/components/topbar.css">
/* c-topbar — app top bar. Variants: root (logo/title left) · view (back + title).
   Region tokens: surface/text/icon-topbar — hero screens override via .screen--hero
   (DECISIONS.md #20). Height: --layout-bar-top. */

.c-topbar {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  /* iOS edge-to-edge (iOS-1/3/4): the bar OWNS the status-bar region — its surface
     paints under the OS status bar and the content row sits below it. env() resolves
     0 everywhere else (Windows/desktop; Android keeps native insets for now), and
     WKWebView only populates it for a WebView actually touching the screen top —
     desktop panes / phone-frame demos are untouched. border-box: grow the fixed
     height by the same inset so the row keeps --layout-bar-top. */
  height: calc(var(--layout-bar-top) + var(--safe-top, 0px));   /* ★ AND-7: Android's env() is cutout-only — --safe-top carries the real inset */
  padding-top: var(--safe-top, 0px);
  padding-inline: var(--spacing-8);
  background: var(--surface-topbar);
  color: var(--text-topbar);
  position: sticky;
  top: 0;
  z-index: var(--z-20);
  transition: background-color var(--duration-200) var(--easing-standard);
}

.c-topbar__title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-primary);
  font-weight: var(--font-weight-semibold);
  font-size: var(--font-size-heading-sm);
  line-height: var(--line-height-heading-sm);
  letter-spacing: var(--tracking-heading-sm);
}

/* root variant: logotype (mark + wordmark). Wordmark inherits the base title's
   heading-sm — ALL screen titles are heading-sm (Damir 2026-07-02, #58): the
   wordmark must fit the 28px mark, not overpower it. Only ink/weight/layout differ. */
.c-topbar[data-variant="root"] { padding-inline: var(--spacing-16); }
.c-topbar[data-variant="root"] .c-topbar__title {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  font-weight: var(--font-weight-bold);
  /* iOS-47 (#314): the display face moved OFF the title — it hit ANY root-variant
     title text (the Apps tab rendered "Apps" in Sora) while #226/B1 reserves Sora
     for the WORDMARK alone. The wordmark span rule below carries it. */
}
/* ★ I-5 (Damir, 2026-08-15): ONLY THE LOGOTYPE KEEPS THE ACCENT.
   The accent ink used to sit on the root VARIANT, and root is what every tab screen
   uses — so Apps, Wallet and Account all inherited a brand colour meant for the
   wordmark alone. Pushed screens use the `view` variant, which has no colour rule, so
   those were already correct.
   ★ The fix REMOVES a colour rather than adding one. A plain root title now inherits
   --text-topbar from .c-topbar, which resolves to the same primitives as
   --text-neutral-01 (neutral-950 light / neutral-100 dark, tokens.css) — exactly what
   Damir asked for — AND it keeps working inside the Wallet hero, where --text-topbar
   correctly becomes --text-on-hero. Hard-setting --text-neutral-01 here would have
   given the right colour on four screens and broken the fifth.
   The flag is set by topbar.js's logotype branch; see the note there for why not :has(). */
.c-topbar[data-variant="root"] .c-topbar__title[data-logotype] { color: var(--text-action-default); }
.screen--hero .c-topbar[data-variant="root"] .c-topbar__title { color: var(--text-topbar); }

.c-topbar__logo { display: block; flex: none; } /* inline SVG, currentColor from title */

/* M16 title-state: the wordmark span can carry a LONG connectivity string
   ("Connecting to Ixian Platform..." and longer in de/fr) — as a flex child it
   hard-clips at the container edge without its own min-width:0 + ellipsis
   (the container's text-overflow doesn't reach into flex children). */
.c-topbar[data-variant="root"] .c-topbar__title > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* iOS-47: Sora scoped to the WORDMARK class alone (topbar.js logo branch) —
   plain root titles (Apps; desktop Chats) render the system face, per #226/B1 */
.c-topbar[data-variant="root"] .c-topbar__title > .c-topbar__word {
  font-family: var(--font-display);
}
/* iOS-48 (#314): while the title carries the CONNECTIVITY state (M16 swap) it is
   UI text, not the wordmark — system face, regular contrast handled by ink. */
.c-topbar[data-variant="root"] .c-topbar__title[data-connecting] > span {
  font-family: var(--font-secondary);
}
/* iOS-48: animated ellipsis — three dots stepping so the state reads as LIVE.
   Opacity keyframes on static glyphs (no text mutation → no aria-live spam; the
   dots container is aria-hidden). Reduced motion: dots hold steady. */
.c-topbar__dots { display: inline; }
.c-topbar__dots span {
  animation: topbar-dot 1.2s infinite;
  opacity: 0.25;
}
.c-topbar__dots span:nth-child(2) { animation-delay: 0.2s; }
.c-topbar__dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes topbar-dot {
  0%, 60%, 100% { opacity: 0.25; }
  30% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar__dots span { animation: none; opacity: 1; }
}

/* ★ N19 (#428, Damir's dial 2026-08-19): the CONNECTING line — an animated gradient
   sweeping along the bar's bottom edge.
   ⚠ CONNECTING-ONLY, and that was the dial, not a shortcut. The alternative on the
   table was a shared loading affordance, and #417 measured why not: during a
   community-bot join essentially NOTHING reaches the shell (`n=0`), so a general
   loading line would sit still through the exact 90 seconds it was hired for. The
   connectivity state is different — C# pushes it (showWarning, xaml:1760/1781), the
   shells already recognise it (M16/#59, CONNECTIVITY_TEXTS) and already render it as
   a title-state. This is that same state's visual half, driven by the SAME attribute,
   so the two can never disagree.
   The attribute is set on the BAR by the shells beside the existing title swap
   (home.html setChatsTitleState · chat.html applyConnectivity). It rides ::after
   rather than border-image: the bar is `position: sticky` (a positioned value), so
   the pseudo-element's containing block is the bar itself, and an absolutely
   positioned strip cannot disturb the bar's height the way a thicker border would —
   the height is `--layout-bar-top + --safe-top` and full bleed made that arithmetic
   load-bearing (★ AND-7).
   `inset-inline: 0` is the house logical grammar (media-bubble/reactions); the block
   axis stays physical because `bottom` is correct in both writing directions.
   The sweep is a moving background-position on an oversized gradient — one
   compositable property, no layout, no repaint of the bar.
   Reduced motion: the line HOLDS as a solid action-tinted rule. It must not vanish —
   it is state, not decoration, and the title's own dots follow the same rule above. */
.c-topbar[data-connecting-bar]::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  height: var(--outline-width-2);
  background-image: linear-gradient(
    90deg,
    transparent 0%,
    var(--surface-action-default) 35%,
    var(--surface-action-default) 65%,
    transparent 100%
  );
  background-size: 220% 100%;
  background-repeat: no-repeat;
  animation: topbar-connecting 1.6s linear infinite;
  pointer-events: none;
}
@keyframes topbar-connecting {
  from { background-position: -110% 0; }
  to   { background-position: 210% 0; }
}
@media (prefers-reduced-motion: reduce) {
  .c-topbar[data-connecting-bar]::after {
    animation: none;
    background-image: none;
    background-color: var(--surface-action-default);
    opacity: 0.6;
  }
}

/* view variant — secondary screens (app details, add, discover). Hairline below so the
   sticky bar reads against the scrolling content, same language as the chat bar (Damir). */
.c-topbar[data-variant="view"] {
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
[data-theme="dark"] .c-topbar[data-variant="view"] { border-bottom-color: var(--outline-neutral-02); }

/* chat variant — identity block (Damir 2026-07-03: name label-md, sub body-sm text-02).
   Hairline below (not shadow — matches bottomnav/composer language) so the bar
   reads against white incoming bubbles on the canvas. */
.c-topbar[data-variant="chat"] {
  gap: var(--spacing-12);
  padding-inline-end: var(--spacing-8);
  border-bottom: var(--outline-width-1) solid var(--outline-neutral-01);
}
/* dark (audit r2): neutral-900 bar + neutral-800 hairline both vanish on the
   primary-900 gradient top — one step up so the boundary reads in dark too */
[data-theme="dark"] .c-topbar[data-variant="chat"] { border-bottom-color: var(--outline-neutral-02); }
/* identity wrap — plain div normally; BUTTON when tappable (bot channel
   selector / chat info, #86). Internal gap mirrors the chat-variant bar gap. */
.c-topbar__identity-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--spacing-12);
  padding: var(--spacing-4);
  margin-block: calc(-1 * var(--spacing-4)); /* keeps the 40px avatar optically placed */
  border: 0;
  border-radius: var(--radius-12);
  background: transparent;
  text-align: start;
  font: inherit;
  color: inherit;
}
button.c-topbar__identity-wrap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-100) var(--easing-standard);
}
@media (hover: hover) and (pointer: fine) {
  button.c-topbar__identity-wrap:hover { background: var(--surface-interactive-hover); }
}
button.c-topbar__identity-wrap:active { background: var(--surface-interactive-pressed); }

.c-topbar__identity {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.c-topbar__name {
  font-family: var(--font-secondary);
  font-size: var(--font-size-label-md);
  line-height: var(--line-height-label-md);
  letter-spacing: var(--tracking-label-md);

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

.c-topbar[data-variant="chat"] .c-avatar__dot { border-color: var(--surface-topbar); }

.c-topbar__actions { display: flex; align-items: center; gap: var(--spacing-4); }

   Apps' lone "+" did not say what it did (Damir 2026-08-12); the label does.
   Grammar: tonal size-32 pill so it reads as an action inside the 56px bar without
   competing with the title. It hugs its label, so a long locale (de "App hinzufügen")
   grows the pill and the TITLE yields — hence min-width:0 on the actions row too. */
/* ★ The 62% cap lives on the ACTIONS ROW, not on the button. A percentage max-width
   resolves against the containing block — and the button's containing block is the
   shrink-to-fit actions row, i.e. the button's own width. That self-reference cut the
   pill to 62% of its natural size and rendered "A…" on a 390px phone with room to
   spare (caught in screenshot review). The row's containing block is the BAR, which
   has a definite width, so the cap means what it says. A CLASS, not :has() — nothing
   else in this stylesheet relies on :has() and a WebView without it would silently
   drop the cap. */

.c-topbar .c-button.c-topbar__action--text {
  position: relative;
  flex: 0 1 auto;                         /* yields only after the 62% row cap bites */
  min-width: 0;
  max-width: 100%;
}
/* …and the TARGET is still 44px tall (§5b) even though the pill is drawn at 32: the
   house hit-expander (c-splitpaste__dismiss / c-composer__attach precedent) grows the
   pressable box block-wise only, so it never overlaps the neighbouring action. */
.c-topbar .c-button.c-topbar__action--text::after {
  content: '';
  position: absolute;
  inset: -6px 0;                          /* 32 + 6 + 6 = 44 */
}
.c-topbar .c-button.c-topbar__action--text .c-button__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* the root-variant bar pads to spacing-16; pull the pill back to the optical edge so
   it lines up with the 44px glyph buttons every other root bar uses */
.c-topbar[data-variant="root"] .c-topbar__actions { margin-inline-end: calc(-1 * var(--spacing-4)); }
/* hero bars: the tonal wash is near-white on the gradient — fall back to on-hero ink */
.screen--hero .c-topbar .c-button.c-topbar__action--text {
  background: var(--surface-wash-on-hero);
  color: var(--text-topbar);
}

/* bar buttons: ink via the button's private vars ONLY — a direct `color:` here
   out-cascades button.css's :hover color (later sheet, equal specificity) and
   freezes the ink. Rest ink = topbar region token; hover/pressed step to the
   action ink for a visible affordance (Damir 2026-07-02, #49) */
.c-topbar .c-button[data-type="text"] {
  --_ink: var(--icon-topbar);
  --_ink-hover: var(--icon-action-hover);
  --_ink-pressed: var(--icon-action-pressed);
}
/* hero surfaces: ink stays pinned — blue action ink would clash with the gradient.
   Backgrounds pinned too: button.css's neutral hover wash / tonal pressed fill are
   near-white in light theme = invisible white-on-white icon on the hero gradient.
   On-hero wash values match the demo's; token candidates at next Figma sync (#49) */
.screen--hero .c-topbar .c-button[data-type="text"] {
  --_ink-hover: var(--icon-topbar);
  --_ink-pressed: var(--icon-topbar);
}
@media (hover: hover) and (pointer: fine) {
  .screen--hero .c-topbar .c-button[data-type="text"]:hover { background: var(--surface-wash-on-hero); }
}
.screen--hero .c-topbar .c-button[data-type="text"]:active { background: var(--surface-wash-on-hero-pressed); }

/* ★ N19 (#428): while the state is live the sweep IS the bottom border — the bar's
   own hairline under it would read as a second line.
   ⚠ THE PLACEMENT AND THE SECOND SELECTOR ARE BOTH LOAD-BEARING. This rule has to
   sit AFTER the view/chat variant blocks above, which set the `border-bottom`
   SHORTHAND at equal specificity (source order decides), and it needs the
   [data-theme="dark"] twin because the dark overrides are (0,3,0) and would
   otherwise out-specify a (0,2,0) reset — i.e. the hairline would keep painting in
   dark only. Written the first time as one low-specificity rule high up in the file,
   where it silently lost to all four. Pinned in smoke against computed style. */
.c-topbar[data-connecting-bar],
[data-theme="dark"] .c-topbar[data-connecting-bar] { border-bottom-color: transparent; }

<style data-src="../styles/components/avatar.css">
/* c-avatar — photo or deterministic gradient placeholder (DECISIONS.md #34, #364).
   N1 rework (supersedes #37): JS stamps the anchor INDEX (data-hue 0..11);
   the 12 gradients below are hand-tuned per anchor and serve BOTH themes
   (the c-disc #170 grammar — vivid fill + white ink, mode-agnostic).
   Every pair is computed ≥ 4.5:1 under white ink at BOTH stops (#364 table).
   Recipe: stop1 = hsl(h, 62%, L1) · stop2 = hsl(h+25, 58%, L1−10).

   ★ #591: the same 12 anchors are now reusable OFF an avatar, via `.c-idhue`. The
   contact-details cover is a person's identity colour behind their photo, and it must
   be the SAME colour their gradient avatar would have been — two sources for one
   identity is how they drift apart. Each selector gains one alternative; the values are
   untouched, and `.c-disc[data-hue]` cannot collide because its hues are NAMES
   ('accent', 'info', …) and these are indices. */

.c-avatar[data-hue="0"], .c-idhue[data-hue="0"]  { --av-c1: hsl(0, 62%, 52%);   --av-c2: hsl(25, 58%, 42%);  }
.c-avatar[data-hue="1"], .c-idhue[data-hue="1"]  { --av-c1: hsl(22, 62%, 43%);  --av-c2: hsl(47, 58%, 33%);  }
.c-avatar[data-hue="2"], .c-idhue[data-hue="2"]  { --av-c1: hsl(40, 62%, 35%);  --av-c2: hsl(65, 58%, 25%);  }
.c-avatar[data-hue="3"], .c-idhue[data-hue="3"]  { --av-c1: hsl(95, 62%, 31%);  --av-c2: hsl(120, 58%, 21%); }
.c-avatar[data-hue="4"], .c-idhue[data-hue="4"]  { --av-c1: hsl(135, 62%, 32%); --av-c2: hsl(160, 58%, 22%); }
.c-avatar[data-hue="5"], .c-idhue[data-hue="5"]  { --av-c1: hsl(165, 62%, 31%); --av-c2: hsl(190, 58%, 21%); }
.c-avatar[data-hue="6"], .c-idhue[data-hue="6"]  { --av-c1: hsl(190, 62%, 35%); --av-c2: hsl(215, 58%, 25%); }
.c-avatar[data-hue="7"], .c-idhue[data-hue="7"]  { --av-c1: hsl(215, 62%, 50%); --av-c2: hsl(240, 58%, 40%); }
.c-avatar[data-hue="8"], .c-idhue[data-hue="8"]  { --av-c1: hsl(245, 62%, 58%); --av-c2: hsl(270, 58%, 48%); }
.c-avatar[data-hue="9"], .c-idhue[data-hue="9"]  { --av-c1: hsl(275, 62%, 55%); --av-c2: hsl(300, 58%, 45%); }
.c-avatar[data-hue="10"], .c-idhue[data-hue="10"] { --av-c1: hsl(305, 62%, 47%); --av-c2: hsl(330, 58%, 37%); }
.c-avatar[data-hue="11"], .c-idhue[data-hue="11"] { --av-c1: hsl(335, 62%, 51%); --av-c2: hsl(0, 58%, 41%);   }

.c-avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  border-radius: var(--radius-full);
  /* B5 (#231): container border DROPPED — gradient placeholders go borderless
     (Telegram-class, lighter list rhythm); the hairline moves to the PHOTO img
     only (below) so a light photo still separates from a light surface. Outer
     size unchanged (border-box) → photo and gradient variants render the same
     footprint + identical circular mask. */
  /* N1 (#364): white ink in BOTH themes — the anchor gradients are dark enough
     everywhere (≥ 4.5:1 computed). Literal #fff on purpose, exactly like
     c-disc (base.css): a theme-flipping token here re-breaks dark mode. */
  color: #fff; /* initials/glyph over gradient */
  overflow: visible;
}

/* Known sizes from size tokens (unknown sizes: inline fallback in avatar.js).
   Initials scale ≈ 0.38 × avatar size. */
.c-avatar[data-size="24"] { width: var(--size-avatar-24); height: var(--size-avatar-24); }
.c-avatar[data-size="24"] .c-avatar__initials { font-size: 9px; }
.c-avatar[data-size="40"] { width: var(--size-avatar-40); height: var(--size-avatar-40); }
.c-avatar[data-size="40"] .c-avatar__initials { font-size: 15px; }
.c-avatar[data-size="48"] { width: var(--size-avatar-48); height: var(--size-avatar-48); }
.c-avatar[data-size="48"] .c-avatar__initials { font-size: 18px; }
/* W2 (#302): 64 = the chat-info HERO. It has rendered at that size since #142 but
   had no rule here at all, so it fell through to avatar.js's inline width/height
   fallback and its initials kept the base font-size instead of the 0.38× scale.

   Figma mirror); this pins the initials scale and the hero-scale presence dot. */
.c-avatar[data-size="64"] .c-avatar__initials { font-size: 24px; }
.c-avatar[data-size="64"] .c-avatar__dot { width: 16px; height: 16px; }

.c-avatar[data-placeholder] {
  /* Fallbacks = anchor 7 (blue): a stale bundle that never stamps data-hue
     still paints a legible gradient instead of a transparent disc. */
  background-image: linear-gradient(135deg,

    var(--av-c2, hsl(240, 58%, 40%)));

.c-avatar__img {
  width: 100%;

.c-avatar__initials {

  font-weight: var(--font-weight-semibold);

}

.c-avatar__dot {
  position: absolute;
  inset-inline-end: 0; /* RTL-logical (audit) */

  height: 12px;
  border-radius: var(--radius-full);
  background: var(--surface-presence-online);
  /* ring = surface-screen: shows a mismatched halo on hover/selected row surfaces —

  border: var(--outline-width-2) solid var(--surface-screen);

<style data-src="../styles/components/message-bubble.css">
/* c-bubble — chat message bubble (Figma 11288:4442 · DECISIONS #63 grouping,
   #14 width). Region tokens only. No tails — grouping = inner-corner
   tightening (radius-16 outer / radius-8 group-adjacent), per design language. */

/* —— chat canvas (Damir 2026-07-03): themed gradient + doodle pattern layer.
   Pattern sits on the canvas (::before), messages scroll in a child ⇒ pattern
   stays fixed under the scroll, WhatsApp-style. */
.c-chat-canvas {
  position: relative;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  background: var(--gradient-chat);
  overflow: hidden;
}
.c-chat-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  /* PAINT lives in src/styles/chat-pattern.css (GENERATED — data-URI mask +

     the pattern takes token ink per theme (premium treatment, Damir
     2026-07-03 — external mask URLs fail silently on file:// and were
     reverted earlier). This block owns only the LAYER: geometry + intensity.
     FAIL-SOFT: without chat-pattern.css there's no background/mask here, so
     the canvas degrades to gradient-only — never a solid ink rectangle.

   (neutral-490 light / neutral-400 dark) clears 3:1 on both canvases */
@media (hover: hover) and (pointer: fine) {
  .c-chat-canvas .u-scroll:hover,
  .c-chat-canvas .u-scroll:focus-within { scrollbar-color: var(--text-neutral-02) transparent; }
  .c-chat-canvas .u-scroll:hover::-webkit-scrollbar-thumb,
  .c-chat-canvas .u-scroll:focus-within::-webkit-scrollbar-thumb { background: var(--text-neutral-02); }
}

.c-bubble-row {
  display: flex;
  align-items: flex-end;
  padding-inline: var(--spacing-16);
  margin-top: var(--spacing-12);           /* gap between groups */
  /* N36b (#363 candidate, repro gate met 2026-08-17): in select mode the ROW is
     the tap target (N36 made in-bubble controls pointer-dead), and every
     `transparent` in this file sat on SUB-elements — Android painted its native
     tap highlight over the whole row on every toggle. Applied to the row
     generally (the house pattern, 86 prior uses): outside select mode the row

.c-bubble-row[data-position="middle"],
.c-bubble-row[data-position="last"] { margin-top: var(--spacing-2); } /* in-group gap */

.c-bubble-row[data-direction="sent"] { justify-content: flex-end; }

.c-bubble-row__gutter {

.c-bubble {

  max-width: min(var(--bubble-max-pct), var(--layout-bubble-max));
  padding: var(--spacing-8) var(--spacing-12);

     flag): --chat-text-scale (tokens.css, default 1) multiplies the body-md

  font-size: calc(var(--font-size-body-md) * var(--chat-text-scale, 1));
  line-height: calc(var(--line-height-body-md) * var(--chat-text-scale, 1));

/* Overlay layer: scrim + c-sheet + c-modal (docs/overlays-spec.md, DECISIONS #56).
   Overlays position inside their HOST (shell root / demo phone), not the viewport. */

[data-overlay-open] { overflow: hidden; } /* host scroll lock while an overlay is up */

.c-scrim {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: var(--z-40);
  background: var(--surface-scrim);
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-standard);
}
.c-scrim[data-open] { opacity: 1; }
/* ★ Batch E (b) (#557, Damir 2026-08-22): the MOBILE scrim is one level deeper
   (0.6 → 0.7) — the lifted message (#506②) reads better against the darker
   ground. Desktop keeps 0.6 for its centred dialogs; anchored desktop menus
   stay wash-free (#268, [data-dt-clear] below). */
:root:not([data-desktop]) .c-scrim { background: var(--surface-scrim-deep); }

/* —— bottom sheet (z-44) ————————————————————————————————————————————————
   ⚠ #506②: this used to be z-40 and sat above its scrim by SOURCE ORDER alone.
   That stopped being enough once a long-pressed message is promoted to z-42: an
   explicit number is the only thing that keeps the menu above the message it is
   acting on when the two overlap at the bottom of the log. Still below the modal
   (z-50), the call bar (z-60) and toasts (z-70). */
.c-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: var(--z-44);
  max-width: var(--layout-content-max);
  margin-inline: auto;
  background: var(--surface-menu);
  border-radius: var(--radius-24) var(--radius-24) 0 0;
  box-shadow: var(--elevation-3);
  padding: var(--spacing-8) var(--spacing-16) var(--spacing-16);
  padding-bottom: calc(var(--spacing-16) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%);
  transition: transform var(--duration-200) var(--easing-accelerate);
  outline: none;
}
.c-sheet[data-open] {
  transform: translateY(0);
  transition-timing-function: var(--easing-decelerate);
}

/* ★★ #608 (device row 5a, iPhone 15) — THE SHEET RISES FOR THE KEYBOARD.
   A bottom sheet is `bottom: 0` of its host, and on iOS the host does NOT shrink under
   the soft keyboard: the whole sheet sat behind it. On the tip sheet only the title row
   stayed visible — the amount chips, the custom-amount field the sheet had just FOCUSED
   itself, and the button that commits the payment were all underneath, on a surface with
   no scroll and no cap, so nothing could reach them. That is also why the keyboard read
   as having "no way out": the scrim you would tap to dismiss it was under the keyboard
   too.
   Three declarations, and every one of them is INERT at `--kb-inset: 0` — no keyboard,
   no change, anywhere in the app:
     · the sheet sits on top of the keyboard instead of behind it;
     · the home-indicator pad is given back while the keyboard covers that strip anyway
       (the same max() the chat composer uses), so the sheet does not float twice;
     · it is capped and scrollable, so a sheet taller than the space that is left can
       still be read to the end rather than being clipped at both ends.
   ⚠ Mobile only. A desktop dialog is centred, has no soft keyboard, and is scoped
   separately further down this file. */

  bottom: var(--kb-inset, 0px);
  padding-bottom: calc(var(--spacing-16) + max(0px, env(safe-area-inset-bottom, 0px) - var(--kb-inset, 0px)));
  max-height: calc(100% - var(--kb-inset, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
}
/* —— #46 loop MAJOR-3: A CLOSING SHEET MUST NOT TAKE TAPS ————————————————————
   The sheet is z-44 and every scrim is z-40, so a sheet paints above a scrim that
   opens LATER. dismissOverlay does not remove the sheet at once: it drops
   data-open, starts the exit transition, and removes on transitionend with a
   400 ms timeout fallback. For that window the sheet is still in the DOM, still
   above the new scrim, and still sliding.
   The house pattern is "close the sheet, then open the modal". A second quick tap
   in that window lands on the sheet, at a row the finger did not choose, because
   the sheet has moved down. Tap Delete twice fast and you get Tip. This rule kills
   that path: no data-open, no hit-testing.
   ⚠ The descendant selector is part of the fix, not decoration. pointer-events
   INHERITS, so one descendant with `pointer-events: auto` would re-open the hole.
   ⚠ The `html:root` prefix is the base.css grammar for a rule that must beat every
   component file on specificity (0,3,1). Do not lower it.
   ⚠ The SCRIM keeps its hit-testing on purpose. A tap over the closing sheet now
   falls to the closing scrim, which swallows it. Make the scrim dead too and the
   same tap reaches the screen behind the overlay.
   ⚠ This rule is also live in the OPEN window, between append and the two-rAF
   data-open. Nothing is lost there, but the REASON differs by surface — do not
   write "the sheet is off-screen", which is true on one surface only:
     · mobile: the sheet sits at translateY(100%), below the host.
     · desktop, centred dialog: `:root[data-desktop] .c-sheet` is
       transform: translate(-50%, calc(-50% + 16px)) with opacity 0 — CENTRED, and
       fully inside the host.
     · desktop, [data-dt-anchor] dropdown: transform: none, opacity 0, sitting at
       its anchor. It transitions opacity only.
   The one property all three share is that the user cannot SEE the sheet, so the
   user cannot aim at it. An opacity-0 element still hit-tests, so on desktop this
   rule closes a hole rather than leaving one — which is more than the mobile case
   needed. Focus is not affected: pointer-events does not change focusability, so
   the open-time focus move and the exit focus restore both still work. */
html:root .c-sheet:not([data-open]),
html:root .c-sheet:not([data-open]) *,
html:root .c-modal:not([data-open]),
html:root .c-modal:not([data-open]) * {   /* ★ Batch A loop r1 (A-1): a CLOSING modal's action re-entered `fire` on a second tap — same hole, same rule */
  pointer-events: none;
}

.c-sheet__handle {
  display: block;
  width: 32px;  /* grab-handle: fixed affordance size, no token (spec ①) */
  height: 4px;
  margin: 0 auto var(--spacing-8);
  border-radius: var(--radius-full);
  background: var(--outline-neutral-03);
}

.c-sheet__title { margin-bottom: var(--spacing-12); color: var(--text-neutral-01); }
.c-sheet__content { color: var(--text-neutral-01); }

/* —— modal (z-50) —— */
.c-modal {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: var(--z-50);
  width: calc(100% - 2 * var(--spacing-24));
  max-width: 360px; /* dialog max — token candidate at next Figma sync */
  background: var(--surface-menu);
  border-radius: var(--radius-24);
  box-shadow: var(--elevation-3);
  padding: var(--spacing-24);
  transform: translate(-50%, -50%) scale(0.95);
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-standard),
              opacity var(--duration-200) var(--easing-standard);
  outline: none;
}
.c-modal[data-open] {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.c-modal__title { margin-bottom: var(--spacing-8); color: var(--text-neutral-01); }

.c-modal__body {
  margin: 0 0 var(--spacing-24);
  font-size: var(--font-size-body-md);
  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);
  color: var(--text-neutral-02);
}

.c-modal__actions {
  display: flex;
  /* ★ Batch B/C loop r1 M-1 (2026-08-24): WRAP. A long localized confirm label
     ("Supprimer le compte", "Отменить приглашение") overflowed the fixed pair —
     nowrap labels + flex-basis 0 + min-width:auto has no out. Wrapping drops the
     long action onto its own full-width row (the remove-contact sheet's answer);
     short pairs render exactly as before. */
  flex-wrap: wrap;
  gap: var(--spacing-8);
  justify-content: flex-end;
  /* rich `content` slots carry no trailing margin (only __body does) — without this the
     last content line sat flush against the buttons (Damir screenshot, install modal).
     Collapses with __body's margin-block-end so plain modals keep their 24 gap. */
  margin-block-start: var(--spacing-24);
}
.c-modal__actions .c-button { flex: 1 1 0; } /* equal-width pair (spec ②). ⚠ NO min-width:0 here — loop r2 R2-1: with flex-basis 0 a used min of 0 makes every item's hypothetical size 0, so the wrap above could NEVER fire; min-width:auto (the label's min-content) is what trips it. Measured in Chrome: with auto, the long confirm wraps to its own full row; with 0 it spilled 43px past its button */

/* ═════════ DESKTOP presentation (:root[data-desktop] — Batch C, #256 M6) ═════════
   Bottom sheets read poorly on desktop → they PRESENT as centered dialogs; three
   surfaces stay contextual (the demo grammar, desktop.html:205-237/:302-305/
   :320-328, Damir-approved 2026-07-06c/d): the bot channel selector (chat.html's
   hand-rolled top-anchored panel — NOT a c-sheet, already matches), right-click
   context menus ([data-dt-anchor="menu"], positioned by desktop-anchors.js at the
   pointer/source row) and the composer ⊕ attach grid ([data-dt-anchor="up"],
   popover above the trigger). PRESENTATION-ONLY: the #56 stack/host/dismissal
   grammar, the #205 a11y wiring and the money sheet's JS-side locks
   (lightDismiss/escDismiss:false) are untouched. Modals need no change. */
:root[data-desktop] .c-sheet {
  left: 50%; right: auto; top: 50%; bottom: auto;
  width: min(480px, 92%);
  max-height: 76%;
  overflow-y: auto;
  border-radius: var(--radius-24);
  /* the top 8px was the drag-handle's seat — a dialog title needs real air */
  padding: var(--spacing-24);
  padding-bottom: var(--spacing-24);   /* drop the mobile safe-area pad */
  transform: translate(-50%, calc(-50% + var(--spacing-16)));
  opacity: 0;
  transition: transform var(--duration-200) var(--easing-accelerate),
              opacity var(--duration-200) var(--easing-accelerate);
}
:root[data-desktop] .c-sheet[data-open] {
  transform: translate(-50%, -50%);
  opacity: 1;
  transition-timing-function: var(--easing-decelerate);
}
:root[data-desktop] .c-sheet .c-sheet__handle { display: none; }
/* anchored variants: dropdowns FADE IN PLACE — no transform at any point, so
   nothing can visually "arrive from" anywhere (06d). Inline left/top/bottom/
   width are set by desktop-anchors.js (or a shell) at open. */
:root[data-desktop] .c-sheet[data-dt-anchor] {
  right: auto; bottom: auto; margin: 0;
  min-width: 320px;
  border-radius: 0 0 var(--radius-16) var(--radius-16);
  padding: var(--spacing-12) var(--spacing-16) var(--spacing-16);  /* dropdowns stay tighter than dialogs */
  transform: none;
  transition: opacity var(--duration-200) var(--easing-decelerate);
  /* Q2 review (#268 loop): with the wash gone (below), elevation was the ONLY
     separation — and in LIGHT mode --surface-menu == --surface-screen (both
     neutral-10), so a white dropdown over the white chats list read as loose
     text. A hairline restores the edge; dark mode never needed it (menu-700 on
     screen-900). Art dial: drop the border and re-dial the elevation instead. */
  border: 1px solid var(--outline-neutral-03);
}
:root[data-desktop] .c-sheet[data-dt-anchor][data-open] { transform: none; }
/* right-click context menu: rounded on all corners, source row highlighted */
:root[data-desktop] .c-sheet[data-dt-anchor="menu"] { border-radius: var(--radius-16); min-width: 260px; }
/* ★ Batch E (c) (#557, Damir 2026-08-22): #268 STANDS (no wash) and the source
   highlight is RETUNED — the SELECTED tint read as a selection state on the
   right-clicked row. It now rides the #519 press wash (--surface-press-row-hover,
   the alpha recipe that lands one perceptual level on EVERY ground — the plain
   press step is invisible on a card, the 5c-iii lesson), so the row reads as
   "held", not "chosen".
   ⚠ loop E-4 (r2): :not([aria-current]) is LOAD-BEARING — this (0,3,0) shorthand
   would otherwise REPLACE the OPEN conversation's tonal selected paint (0,2,0)
   in the desktop split view, visually deselecting the row under its own menu.
   The selected row keeps its tonal; the wash marks only unselected sources. */
:root[data-desktop] [data-dt-ctx-source]:not([aria-current]) { background: var(--surface-press-row-hover); border-radius: var(--radius-12); }
/* attach/share grid: popover RISING above the composer ⊕ (bottom-anchored) */
:root[data-desktop] .c-sheet[data-dt-anchor="up"] {
  right: auto; top: auto; margin: 0;
  border-radius: var(--radius-16);
  transform: none;
}
:root[data-desktop] .c-sheet[data-dt-anchor="up"][data-open] { transform: none; }
/* #268 (Damir 2026-07-12): anchored CONTEXTUAL menus (right-click dropdown +
   composer ⊕ popover) get NO backdrop wash on desktop — the menu + source-row
   highlight are the affordance; a full-viewport dim reads modal. desktop-anchors.js
   tags the sheet's own scrim [data-dt-clear]; the ELEMENT stays (outside-click
   dismissal + the #56 stack/a11y grammar untouched) — it's just invisible.
   Centered sheets-as-dialogs and modals keep their wash. */
:root[data-desktop] .c-scrim[data-dt-clear] { background: transparent; }

/* ═════════ MOBILE anchored dropdown (Batch E (a), #557, Damir 2026-08-22) ═════════
   The message menu + the chats-row menu present as a DROPDOWN anchored to the
   pressed row (desktop-anchors.js anchorSheetToRow sets the tag + inline
   left/top/width). Placement prefers ABOVE the row, so the menu can never cover
   the message it acts on — the 4.1 fix, structural. Everything else about the
   overlay is UNCHANGED: same z-44 (above the z-42 lifted row, #506②), same scrim
   (one level deeper here, (b) above), same focus/Esc/stack grammar, and the
   `:not([data-open])` pointer-events rule still covers the fade windows.
   Enter/exit = FADE IN PLACE (the desktop [data-dt-anchor] rule): a panel that
   slid from the bottom edge to mid-screen would point at the wrong origin. */
:root:not([data-desktop]) .c-sheet[data-m-anchor] {
  left: auto; right: auto; bottom: auto;
  margin: 0;
  max-width: none;
  border-radius: var(--radius-16);
  padding: var(--spacing-8) var(--spacing-12) var(--spacing-12);
  /* ★ loop E-1 (r2): the dropdown must never leave the SAFE region or outgrow the
     host — a menu taller than the screen with the body scroll locked is
     unreachable UI, and a clamp to y=8 puts the react row under the Dynamic
     Island (the #288 inset class). The height cap makes the menu its own
     scroller; the JS clamp (anchorSheetToRow) keeps top ≥ safe-top + 8. */
  max-height: calc(100% - var(--safe-top, 0px) - env(safe-area-inset-bottom, 0px) - 2 * var(--spacing-8));
  overflow-y: auto;
  transform: none;
  opacity: 0;
  transition: opacity var(--duration-200) var(--easing-decelerate);
}
:root:not([data-desktop]) .c-sheet[data-m-anchor][data-open] { transform: none; opacity: 1; }
:root:not([data-desktop]) .c-sheet[data-m-anchor] .c-sheet__handle { display: none; }

  letter-spacing: var(--tracking-body-xs);

.c-chip__icon, .c-chip__dismiss { flex: none; }

/* count inside a filter chip (Damir 2026-07-09): a plain trailing NUMBER, sits
   after the label via the chip's flex gap. Muted so the label stays primary; the
   selected chip tints it with the chip text colour (inherits currentColor). */
.c-chip__count { flex: none; font-variant-numeric: tabular-nums; opacity: 0.7; }
.c-chip[aria-pressed="true"] .c-chip__count { opacity: 1; }

/* readonly (display) variant — non-interactive tags e.g. app permissions/capabilities */
.c-chip[data-readonly] {
  cursor: default;
  background: var(--surface-neutral-02);
  border-color: transparent;
  color: var(--text-neutral-01);
}
.c-chip[data-readonly] .c-chip__icon { color: var(--icon-neutral-02); }
.c-chip[data-readonly]::after { content: none; }   /* no expanded hit area — it's not a target */

/* selected (toggle chips) — #50, Damir 2026-07-02: TONAL fill ("not too strong"),
   action ink; pressed-on-unselected keeps its outline so the two stay distinct.
   ★ I-2 (#358): the selected chip now carries an OUTLINE — a selected chip and a
   tonal button both paint --surface-action-tonal-default, so "selected" and
   "button" rendered identically (same disease as D-16 fix C, one ramp step
   apart). The outline is a state ladder (default/hover/pressed). The border
   SLOT already exists on every chip (--outline-width-1, transparent when
   unused), so no layout shift — the #51 lesson.
   ★ Loop r1 MAJOR-6: the selected PRESS keeps the DEFAULT fill — the old
   tonal-pressed fill put the pressed outline at 2.31:1 in dark (200-on-500),
   under the 1.4.11 bar exactly when the outline is doing its job. Press
   feedback = outline default→pressed + ink + the #343 scale; the fill holds.
   (Dial rider on the F5 checklist: say if the press wants its wash back.)
   ★ Loop r1 MAJOR-7: every hover/active pair carries the SAME :not() chain —
   the old ladder claimed "source order at equal specificity" while hover
   out-specified active by one pseudo-class, so the pressed rung never painted
   on a mouse. :not([data-readonly]) also stops display-tag chips (spans — they
   match :active) from wearing the selected skin (loop r1 MINOR).
   Contrast, non-text ≥3:1 (WCAG 1.4.11), executable in smoke (#358 pins):
   light rest 600-on-100 = 4.73 · hover 700-on-200 = 6.28 · press 800-on-100 = 9.67
   dark  rest 400-on-800 = 5.47 · hover 300-on-600 = 3.44 · press 200-on-800 = 8.62 */
.c-chip[aria-pressed="true"] {
  background: var(--surface-action-tonal-default);
  border-color: var(--outline-action-default);
  color: var(--text-action-default);
}

/* hover guarded per #43; :not(:disabled) — disabled elements still match :hover */
@media (hover: hover) and (pointer: fine) {

    background: var(--surface-neutral-02);
    border-color: var(--outline-action-hover);
    color: var(--text-action-hover);

    border-color: var(--outline-action-hover);   /* I-2 (#358): ladder, not transparent */
    color: var(--text-action-hover);
  }
}

/* pressed AFTER hover — same specificity as its hover twin, later in source */
.c-chip:not(:disabled):not([data-readonly]):active {
  background: var(--surface-action-tonal-default);
  border-color: var(--outline-action-pressed);
  color: var(--text-action-pressed);
}
.c-chip[aria-pressed="true"]:not(:disabled):not([data-readonly]):active {
  background: var(--surface-action-tonal-default);   /* r1 MAJOR-6: fill holds — see header */
  border-color: var(--outline-action-pressed);       /* I-2 (#358): ladder, not transparent */

/* c-search-field — text-field/large specialization (docs/chip-search-spec.md,
   DECISIONS #51). Permanent transparent border prevents the Figma default→hover
   layout jump; focus fakes the spec's 2px border via box-shadow (no shift). */

.c-search-field {
  display: flex;
  align-items: center;
  gap: var(--spacing-8);
  min-height: var(--size-target-min); /* Figma ≈40px — raised to touch minimum (#51) */
  padding: var(--spacing-8) var(--spacing-12);
  border: var(--outline-width-1) solid transparent; /* Figma: none; see header */
  border-radius: var(--radius-full);
  background: var(--surface-neutral-02);
  /* glyph ink shares the placeholder's text token — one resting ink for the
     whole empty field (deliberate; icon-neutral-* would split the pair) */
  color: var(--text-neutral-02);
  /* 100ms intentional: micro-interaction, matches chip/chatlist hover */
  transition: background-color var(--duration-100) var(--easing-standard),
              border-color var(--duration-100) var(--easing-standard),
              box-shadow var(--duration-100) var(--easing-standard);
}

/* #228 desktop density: pointer targets may go tighter than the 44px touch
   minimum (TG search ≈32–36px). Mobile keeps --size-target-min. */
:root[data-desktop] .c-search-field {
  min-height: 36px;
  padding-block: var(--spacing-4);
}

/* Figma text-field used outline-info (hover) + text-action-default (focus) as
   borders — confirmed errors by Damir 2026-07-02; action OUTLINE roles are the
   correct family (#51). Mirror back to Figma text-field/large. */
@media (hover: hover) and (pointer: fine) {
  .c-search-field:hover {
    background: var(--surface-neutral-03);
    border-color: var(--outline-action-hover);
  }
}

.c-search-field:focus-within {
  background: var(--surface-neutral-01);
  border-color: var(--outline-action-default);
  box-shadow: 0 0 0 1px var(--outline-action-default); /* 1px border + 1px shadow ≈ spec 2px */
}

/* ★ BUG-3 — ACTIVE FILTER (Damir F5 2026-08-13: "I had active search bar stuff in").
   A field holding a query is not a resting input: it is HIDING ROWS, so it stops
   looking neutral and wears the ACTION outline permanently — not only while focused
   — with the glyph and the clear affordance in action ink. Placed AFTER :hover and
   :focus-within (equal specificity, source order decides) so the filtering state
   out-ranks a passing hover; focus stays distinguishable because it adds the
   box-shadow + surface change, which this rule does not touch.
   Semantic tokens only; nothing here is density- or viewport-dependent. */
.c-search-field[data-active] {
  border-color: var(--outline-action-default);
  color: var(--text-action-default);
}
.c-search-field[data-active] .c-search-field__clear { color: var(--text-action-default); }

.c-search-field__icon { flex: none; }

  line-height: var(--line-height-body-md);
  letter-spacing: var(--tracking-body-md);

  caret-color: var(--text-action-default);

/* sanctioned #51 deviation from the #23 ring: text fields show focus as the
   container's action border+shadow (Figma text-field treatment), not the ring */
.c-search-field__input:focus { outline: none; }
/* custom clear button is the affordance — hide the native WebKit one */
.c-search-field__input::-webkit-search-cancel-button { display: none; }

<!-- Q4-③ (#270): call CSS removed — calls present on the native CallPage -->
<link rel="stylesheet" href="spixi.chat-pattern.css"><!-- theme-ink pattern mask (loads after message-bubble.css) -->
<style>
  /* Production chat shell: fill the WebView (no demo phone frame). The chat
     topbar pins, the message log (c-chat-canvas → .messages) scrolls, the
     composer pins to the bottom. Element ids/classes MATCH the demo so the
     component CSS applies unchanged. */
  html, body { margin: 0; height: 100%; background: var(--surface-screen); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #chat-topbar { flex: none; }
  .c-banner { flex: none; }              /* connectivity strip pins under the topbar */
  .chat-request-pane { flex: none; }     /* incoming-request pane pins above the composer */
  /* #288 review: in the 'incoming' lock the composer is HIDDEN, so the request card is
     the chat's bottom-most chrome and owns the iOS home-indicator inset — otherwise
     Accept/Decline sit under the indicator. Break-my-verdict correction: the inset goes
     on the PAINTED child, not the wrapper — the wrapper has no background, so padding
     there would open a --surface-screen band under a --surface-neutral-02 card. */
  .chat-request-pane > .c-contact-request {
    padding-block-end: calc(var(--spacing-12) + env(safe-area-inset-bottom, 0px));
  }
  /* ⑪ pending-outgoing composer lock: while our contact request awaits the peer's
     accept, the composer is REPLACED by this quiet strip (nothing to type into —
     a locally-"sent" message would show delivered/read ticks the peer never sees).
     Same slot as the composer (#chat-composer child), so layout is unchanged. */
  .chat-pending-strip {
    display: flex; align-items: center;
    gap: var(--spacing-12);
    padding: var(--spacing-12) var(--spacing-16);
    /* #288 review: this strip REPLACES the composer (composerEl.hidden), so it is the
       chat's bottom-most chrome and must own the iOS home-indicator inset the way
       composer.css does — otherwise Cancel request, the ONLY escape from a locked
       chat, sits under the indicator. env() resolves to 0 off-iOS. */
    padding-block-end: calc(var(--spacing-12) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-neutral-02);
    border-top: var(--outline-width-1) solid var(--outline-neutral-01);   /* composer hairline parity */
  }
  /* #287 (#275 polish backlog): pending medallion — avatar-32 tonal disc +
     user-plus (the "Request sent" glyph family, #253), #117 handshake-pulse
     cadence; decorative (the strip text carries the meaning). Token-exact:
     the old block referenced non-existent --spacing-3/-4 (numeric naming is
     --spacing-12/-16) and rode the px fallbacks. */
  .chat-pending-strip__disc {
    flex: none;
    width: var(--size-avatar-32); height: var(--size-avatar-32);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full);
    background: var(--surface-action-tonal-default);
    color: var(--icon-action-default);
    animation: chat-pending-pulse 1.4s var(--easing-standard) infinite;
  }
  @keyframes chat-pending-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .chat-pending-strip__disc { animation: none; } }
  .chat-pending-strip__text {
    flex: 1;
    color: var(--text-neutral-02);
    font-size: var(--font-size-body-md); line-height: var(--line-height-body-md);
    min-width: 0; overflow-wrap: anywhere;
  }
  .c-chat-canvas { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* Messages sit at the BOTTOM (adjacent to the composer) and grow upward — the
     natural chat flow. The secure notice floats CENTERED in the free space above
     them: its own two auto-margins split that space equally above + below it, so
     on a new/empty chat it lands dead-center, and as messages fill in below it
     the notice rises like a normal bubble. When the log overflows the auto-
     margins collapse to 0 → notice pins to the top of history, log scrolls,
     newest at the bottom (Damir 2026-07-07). */
  #messages { flex: 1; min-height: 0; padding-bottom: var(--spacing-4); display: flex; flex-direction: column; }
  #messages > .c-sysnotice { margin-top: auto; margin-bottom: auto; }
  /* A3 (#302): unread-elsewhere dot on the chat topbar back button. #48 grammar
     (error surface + a 2px ring in the HOST surface so it reads on any background) at
     topbar scale — ring in --surface-topbar, not the bottombar token the nav badge
     uses. Positioned INSIDE the 44px button box (a bottomnav-style negative offset
     would clip against the topbar's own padding), and aria-hidden because the
     state is announced through the button's aria-label instead. */
  #chat-topbar .c-button[data-unread-dot] { position: relative; }
  #chat-topbar .c-button[data-unread-dot]::after {
    content: ""; position: absolute; top: 6px; inset-inline-end: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface-error);
    box-shadow: 0 0 0 2px var(--surface-topbar);
    pointer-events: none;
  }
  /* A1 (#302): "Show older messages" pill, first child of the log. It only ever
     renders when ≥100 messages exist, so it never coexists with the #181
     centered-when-short layout above (auto margins have collapsed by then).
     flex:none so it can't be stretched by the column. */
  .chat-older { flex: none; display: flex; justify-content: center; padding: var(--spacing-8) 0 var(--spacing-4); }
  .chat-older__btn {
    display: inline-flex; align-items: center; gap: var(--spacing-8);
    min-height: 32px; padding: 0 var(--spacing-16);
    border: 0; border-radius: var(--radius-full, 999px);
    background: var(--surface-menu, var(--surface-card));
    color: var(--text-action-default, var(--text-neutral-01));
    font-size: var(--font-size-label-sm, 13px);
    font-weight: var(--font-weight-semibold, 600);
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--elevation-1, 0 1px 2px rgba(0,0,0,.12));
    transition: background var(--duration-100) var(--easing-standard);
  }
  /* #43: every hover lives inside the hover-capable guard */
  @media (hover: hover) and (pointer: fine) { .chat-older__btn:not(:disabled):hover { background: var(--surface-interactive-hover, var(--surface-card)); } } /* #334 AND-18 guard */
  .chat-older__btn:disabled { cursor: default; color: var(--text-neutral-02); }
  #chat-composer { flex: none; }
  /* iOS-29 attempt 4 (#301) — CHANGED LEVER per #294: never resize <body> (that
     fought WKWebView's own focus pan through three attempts). The flex column
     keeps its 100% layout height; while the soft keyboard is up the composer is
     pushed above it by a bottom margin driven from visualViewport (--kb-inset,
     set by keyboardViewport()), and .c-chat-canvas (flex:1, min-height:0)
     absorbs the difference — topbar stays, log shrinks, composer lifts.
     The max(0px, … − env(safe-area-inset-bottom)) does two jobs: WebKit keeps
     reporting the FULL safe-area inset with the keyboard up (#294 measurement),
     so the composer's own inset padding is re-used as keyboard clearance
     (no 34px dead cushion above the keyboard); and with the keyboard closed
     (--kb-inset: 0) the max() clamps the negative result to 0 so the composer
     is never pushed INTO the home indicator. */
  #chat-composer { margin-bottom: max(0px, calc(var(--kb-inset, 0px) - env(safe-area-inset-bottom, 0px))); }
  /* iOS-53 r2 (#324): ride the keyboard, don't jump it. The native push lands at
     the keyboard animation's START (WillChangeFrame), so transitioning the margin
     over ~the keyboard's own duration/curve slides the composer in sync with the
     keyboard; the canvas + log animate with it (the stick loop in the shell keeps
     the newest message glued to the bottom through the slide). The bezier is the
     community-measured UIKit keyboard curve. Engines that never set --kb-inset
     (Android adjustResize, desktop) never trigger it. Reduced motion: instant. */
  #chat-composer { transition: margin-bottom 280ms cubic-bezier(0.38, 0.7, 0.125, 1); }
  @media (prefers-reduced-motion: reduce) { #chat-composer { transition: none; } }
  /* ===== DESKTOP (:root[data-desktop]) — grey ground only. Dark desktop deepens
     the base to grey-1000 (#207).
     B2 (#256): the #207 HARD-FORCED `::before{display:none}` pattern-off is GONE —
     desktop now defaults to pattern Off via the pre-paint pref script above, and an
     explicit Chat-appearance pick turns the doodle pattern on/off on desktop too.
     ★ N81 (#422): the desktop dark GROUND override is RETIRED too, and the reason is
     that it inverted itself. It existed to deepen the desktop ground below the old
     --surface-neutral-01; Damir's new dark canvas is #0f1115, which is already deeper
     than the grey-1000 (#111213) the override pointed at — so keeping it would have
     made desktop dark PALER than mobile dark, the exact opposite of its purpose, and
     an undocumented second dark canvas colour on top of that. One dark canvas now. */
  /* boot spinner — fills the log while the JS bundle parses + C# pushes the
     conversation; the first renderLogNow() clears #messages and removes it. */
  .chat-boot { flex: 1; display: flex; align-items: center; justify-content: center; }
  /* ★ #346 (review of #343): this rule is PRE-#343 and the ad2c7ca revert took it out
     with the #343 delay rule that sat beside it. Without it the span is an empty
     display:inline box that paints NOTHING, so the log was a blank rectangle for the
     whole entry window — worse than the state the revert meant to restore. #343 only
     ever argued the spinner should be DELAYED, never removed. */
  .chat-boot__spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border-subtle, rgba(128,128,128,0.22));
    border-top-color: var(--icon-accent, #1892ce);
    animation: chat-boot-spin 0.8s linear infinite;
  }
  @keyframes chat-boot-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .chat-boot__spinner { animation: none; } }
  /* avatar flash guard: keep the topbar avatar invisible (slot reserved) until the
     identity lands, so the boot gradient never flashes before the real avatar. */
  .c-topbar.is-avatar-pending .c-avatar { visibility: hidden; }
  /* #264 ⑤: connection-event chip — a centered quiet pill replacing the clumsy
     "XYZ has accepted your contact request" BUBBLE (worst with a bare address;
     the subject renders via the #211 truncation canon). */
  .chat-event { display: flex; justify-content: center; padding: var(--spacing-8) var(--spacing-16); }
  .chat-event__chip {
    display: flex; align-items: center; gap: var(--spacing-8);
    max-width: min(85%, 480px);
    padding: var(--spacing-8) var(--spacing-16);
    border-radius: var(--radius-full);
    /* #265 (Damir ⑦): the tonal wash vanished on the light-blue canvas — ride
       the received-bubble surface instead.
       ★ N81 (#422, #46 audit): "white pops on the gradient" was TRUE of the old
       sky-blue canvas and is false of the cream one — white on #fcfbfa was 1.03:1.
       The elevation is replaced by the same incoming hairline the received bubble
       carries.
       ★ N82 (#427): the canvas is #f4f6f9 now, which gives a white chip 1.083:1 on
       its own, and --border-bubble-received is `transparent` in BOTH themes. The
       rule is unchanged on purpose — it follows the token, which is one line from
       bringing the edge back. */
    background: var(--surface-bubble-received);
    box-shadow: inset 0 0 0 1px var(--border-bubble-received);
    color: var(--text-neutral-01);
    font-size: var(--font-size-body-sm); line-height: var(--line-height-body-sm);
    text-align: center;
  }
  .chat-event__chip svg { flex: none; color: var(--icon-accent); }
  /* attach → App-invite picker (inside a c-sheet) */
  .chat-app-picker { display: flex; flex-direction: column; gap: var(--spacing-4); }
  .chat-app-picker__item {
    display: flex; align-items: center; gap: var(--spacing-12);
    padding: var(--spacing-12); border: 0; border-radius: var(--radius-12);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer; width: 100%;
  }
  @media (hover: hover) and (pointer: fine) { .chat-app-picker__item:hover { background: var(--surface-interactive-hover); } } /* #337: AND-18 sweep miss */
  .chat-app-picker__name { font-weight: 600; }
  .chat-app-picker__empty { padding: var(--spacing-16); text-align: center; color: var(--text-neutral-02); }
  /* group/bot chat-info takeover — full-viewport cover mounted over the chat.
     z-30 sits ABOVE the bars/composer (z-20) but BELOW the sheets (z-40) + modal
     (z-50) it spawns, so its member sheet + kick/ban/leave confirms render on top.
     The c-chat-info panel is height:100% → fills this. */
  .chat-info-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .chat-info-takeover > .c-chat-info { flex: 1; min-height: 0; }
  /* W5 (#523): the in-chat send compose — same cover grammar as chat-info; its
     review sheet (z-40) + Max modal (z-50) render on top. */
  .chat-send-takeover {
    position: fixed; inset: 0; z-index: var(--z-30, 30);
    background: var(--surface-screen);
    display: flex; flex-direction: column;
  }
  .chat-send-takeover__body { flex: 1; min-height: 0; overflow-y: auto; }
  /* Bot channels (Option A — channel-as-title, Damir F5 2026-07-08): the CURRENT
     channel name lives in the topbar title with a chevron-down affordance; tapping
     the title opens the selector as a panel that slides DOWN from under the topbar
     (NOT the old under-topbar bar, NOT a bottom sheet). The trailing ⓘ opens the
     chat-info takeover. */
  .c-topbar.is-bot-channels .c-topbar__name {
    display: inline-flex; align-items: center; gap: var(--spacing-4);
  }
  .chat-channel-chev { flex: none; color: var(--icon-neutral-02, currentColor); }
  .chat-channel-unread-dot {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);

     down (translateY -100% → 0). */

    opacity: 0; transition: opacity var(--duration-200, 200ms) var(--easing-standard, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-overlay__scrim { opacity: 1; }
  /* #268 (Damir): desktop contextual menus carry no backdrop wash — the channel

     + ⊕ popover, overlay.css). Scrim element stays: outside-click still closes. */
  html[data-desktop] .chat-channel-overlay__scrim { background: transparent; }
  .chat-channel-panel {
    position: absolute; left: 0; right: 0;   /* top set inline = topbar height */
    max-height: 60vh; overflow-y: auto;
    background: var(--surface-menu, var(--surface-neutral-01, #fff));
    border-bottom-left-radius: var(--radius-16, 16px);
    border-bottom-right-radius: var(--radius-16, 16px);
    box-shadow: var(--elevation-3, 0 8px 24px rgba(0,0,0,0.24));
    padding: var(--spacing-12);

    transition: transform var(--duration-200, 200ms) var(--easing-emphasized, ease);
  }
  .chat-channel-overlay.is-open .chat-channel-panel { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .chat-channel-overlay__scrim, .chat-channel-panel { transition: none; }
  }
  .chat-channel-panel__title {
    font-size: var(--font-size-label-sm, 13px);
    font-weight: var(--font-weight-semibold, 600);
    color: var(--text-neutral-02, #666);
    padding: var(--spacing-4) var(--spacing-8) var(--spacing-8);
  }
  /* A6 (#302): bot/server description under the panel title. Body-sm neutral-02,
     clamped to 4 lines — the text is bot-authored and unbounded in length. */
  .chat-channel-panel__desc {
    margin: 0;
    padding: 0 var(--spacing-8) var(--spacing-8);
    color: var(--text-neutral-02, #666);
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  /* channel list (rows shared by the panel) */
  .chat-channel-list { display: flex; flex-direction: column; gap: var(--spacing-4); }
  .chat-channel-list__item {
    display: flex; align-items: center; gap: var(--spacing-8);
    width: 100%; padding: var(--spacing-12); border: 0; border-radius: var(--radius-12);
    background: transparent; color: var(--text-neutral-01, inherit); font: inherit;
    text-align: start; cursor: pointer;
  }
  .chat-channel-list__unread {
    flex: none; width: 8px; height: 8px; border-radius: var(--radius-full, 999px);
    background: var(--icon-accent, #1892ce);
  }
  .chat-channel-list__item[data-selected] { background: var(--surface-action-tonal-default, rgba(24,146,206,0.12)); }
  .chat-channel-list__item[data-selected] .chat-channel-list__name { font-weight: var(--font-weight-semibold, 600); }
  .chat-channel-list__item:hover { background: var(--surface-interactive-hover); }
  .chat-channel-list__empty { padding: var(--spacing-16); text-align: center; color: var(--text-neutral-02); }

  /* @ jump-to-mention FAB (#8). Hidden until an unseen mention of the local user
     exists. It occupies the PRIMARY bottom slot by default (when the scroll-to-latest
     chevron is hidden — i.e. at the bottom, image-1 case); when the chevron is visible
     (scrolled up) it slides UP one slot to sit ABOVE the chevron, never overlapping it.
     Keyed off the sibling c-scroll-latest[data-visible] (appended before this button). */
  .chat-mention-fab {
    position: absolute;
    inset-inline-end: var(--spacing-16);
    inset-block-end: var(--spacing-16);   /* primary bottom slot (chevron hidden) */
    width: var(--size-target-min); height: var(--size-target-min);
    display: flex; align-items: center; justify-content: center;
    border: var(--outline-width-1) solid var(--outline-neutral-01);
    border-radius: var(--radius-full);
    background: var(--surface-action-tonal-default);
    color: var(--text-action-default);
    box-shadow: var(--elevation-2);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    opacity: 0; transform: translateY(var(--spacing-8)); visibility: hidden; pointer-events: none;
    transition: opacity var(--duration-200) var(--easing-standard),
                transform var(--duration-200) var(--easing-decelerate),
                inset-block-end var(--duration-200) var(--easing-decelerate),
                visibility var(--duration-200),
                background-color var(--duration-100) var(--easing-standard);
  }
  /* chevron visible → stack the @ FAB one 44px button + gap above it */
  .c-scroll-latest[data-visible] ~ .chat-mention-fab {
    inset-block-end: calc(var(--spacing-16) + var(--size-target-min) + var(--spacing-8));
  }
  .chat-mention-fab[data-visible] { opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }
  @media (hover: hover) and (pointer: fine) { .chat-mention-fab:hover { background: var(--surface-action-tonal-hover); } } /* #334 AND-18 guard */
  .chat-mention-fab:active { background: var(--surface-action-tonal-pressed); }
  /* unseen-mention count (same recipe as the scroll-latest badge: error role + ring) */
  .chat-mention-fab__badge {
    position: absolute; top: calc(-1 * var(--spacing-4)); inset-inline-end: calc(-1 * var(--spacing-4));
    min-width: 18px; height: 18px; padding: 0 var(--spacing-4);
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full);
    background: var(--surface-error); color: var(--text-neutral-on-action);
    box-shadow: 0 0 0 2px var(--surface-menu);
    font-size: var(--font-size-label-xs); line-height: 1; font-weight: var(--font-weight-bold);
  }

  /* pulse the target message on jump.
     N52 (verify-first): the original ring was --surface-warning-inverse — the WASH
     tone (orange-100 light / orange-900 dark), near-zero contrast against the
     canvas in BOTH themes, which is why the shipped pulse never read on device.
     --surface-warning is the SOLID role (orange-600 light / orange-400 dark). */
  .c-bubble-row[data-mention-pulse] .c-bubble { animation: chat-mention-pulse 1.4s var(--easing-standard) 1; }
  @keyframes chat-mention-pulse {
    0%, 20% { box-shadow: 0 0 0 3px var(--surface-warning); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  /* loop B-3: under reduced motion the ring must still READ — a static held ring
     (no animation) for the attribute's ~1.6s lifetime; the JS timeout removes it. */
  @media (prefers-reduced-motion: reduce) {
    .c-bubble-row[data-mention-pulse] .c-bubble { animation: none; box-shadow: 0 0 0 3px var(--surface-warning); }
  }
</style>
<style data-device>html,body{margin:0!important;padding:0!important;height:100%!important;overflow:hidden!important;background:var(--surface-screen)!important}.demo-toolbar,.demo-caption,.statusbar{display:none!important}.demo-frames{display:block!important;margin:0!important;gap:0!important;flex-wrap:nowrap!important}.demo-phone{width:100vw!important;height:100vh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}</style>

<body>
  <!-- C#-LOCALIZED string carriers (Q4 + M16). generatePage substitutes the star-SL
       markers from the lang files with the EXACT strings C# later pushes (title /
       showWarning text), so equality checks below are locale-proof by construction.
       They live in HTML TEXT nodes (safe for any localized characters); a plain-
       browser preview leaves the markers raw → the JS reader falls back to en-us.
       ⚠ #248: every marker here is same-line-closed — never write one that isn't. -->
  <div id="sl-carriers" hidden aria-hidden="true">
